# SRV-PIPELINE — the compile pipeline for the slice (V.COMPILE-min, docs/roadmap.md "Vertical slice first", V7):
# compile one lesson (L02 of the Bashir pilot) from its source spans through draft → fact-check → adversarial review
# → at most one revise loop → findings → lab verification, writing a lesson revision per step (SRV-LESSON
# FR-LESSON-4), and leaving every open problem in the notebook as an `open` cell (G2 report; no publish in the slice).
#
# Complex areas (AGENTS.md): cost math and the compile pipeline's verification stages. Full deep-reviewer review.
#
# Design decisions:
#   - Stages are data (ADR-0009: stages.yaml, VEC-PIPELINE-1). Each step of a run is one SRV-EVENTS job of kind
#     `pipeline.stage` keyed by (run_id, step, stage, input_sha256). A handler enqueues the next step inside itself,
#     before it returns (FR-EVENTS-3 is non-blocking; at worker concurrency 1 the next job cannot start before this one
#     commits), and the next handler treats a missing input as transient. `ensure` re-enqueues from the persisted run
#     state at worker start and on every status read.
#   - Reuse across runs: a model step whose `input_sha256` (source, stage input, prompt version, resolved model) equals a
#     completed step of an earlier run of the same lesson reuses that step's output without a provider call (ADR-0009: a
#     stage reruns only if its input hash changed). A recompile therefore spends only where something changed.
#   - Loops: at most 1 revise loop (ADR-0009 allows 3). Measured: 0 of 2 L02 compiles converged after one loop and
#     nothing improved after the revision (spikes/compile-cost). The roadmap's V7 row (owner-approved plan, PR #25) sends
#     open findings to G2 as open cells, so non-convergence ends a compile with `open_findings`, not an error.
#   - Run cap: $8.00 per compile, the owner's `budget.compile_cap_usd` (2026-11-22, docs/progress.yaml). The measured
#     $2.42–2.97 for one loop on L02 was taken without span ids in the prompts; the reserves come from the formula
#     (SRV-AGENT FR-AGENT-9), not from that figure.
#   - No publish: the owner studies the draft revision (SRV-LESSON owner note). The G2 report (FR-PIPELINE-8) records
#     what publish would check, including SRV-LESSON's three deferred items, and is computed after lab verification.
#   - Source: the lesson's own spans (its PDF page range from the course plan), first and byte-identical in every stage's
#     system prompt, inside a delimiter that span text cannot forge (VEC-PIPELINE-5), with short per-lesson span aliases
#     (`s1`…`sN`) that code expands to span ids. Search (SRV-SEARCH) is not a dependency. Reserves never assume cache
#     sharing (SRV-AGENT FR-AGENT-9).
#   - Models per stage come from reader.yaml `tasks` (ADR-0005; example: draft and review Opus, fact check Sonnet,
#     revise uses the draft task), resolved to full ids by SRV-AGENT.
#   - In the slice there is no web fact-check: `changed` cells and URL citations become open cells (FR-PIPELINE-7).
#
# ADRs: ADR-0009, ADR-0004, ADR-0005, ADR-0006, ADR-0008, ADR-0017 proposed and followed as written; ADR-0022,
# ADR-0025 accepted. Upstream specs: SRV-LESSON (origin/V/V.SRV-LESSON-min), SRV-EVENTS (origin/V/V.SRV-JOBS-min),
# SRV-INGEST (origin/V/V.SRV-INGEST-min), SRV-KERNEL and OPS-SANDBOX (origin/V/V.SRV-KERNEL, main), all approved in review.
#
# Cross-spec (paired changes in their own specs):
#   - SRV-EVENTS: KIND_MODULES adds `reader.pipeline.jobs`; the separate-connection rule for spend rows (SRV-AGENT);
#     `reader.jobs.running()` returns the worker's `Jobs` so a handler can enqueue the next step; a kind module may
#     export `on_worker_start(jobs)`, called once after the start sweep (FR-PIPELINE-6's ensure).
#   - SRV-AUTH: ROUTERS adds `reader.pipeline.routes`; VERSION_LOCATIONS adds `reader/pipeline/migrations` and
#     `reader/agent/migrations`; the api role builds a `Jobs` (same catalog, procrastinate app from its DbTarget) on
#     `app.state.jobs` so routes can enqueue.
#
# Review: deep-reviewer (Fable) rounds 1 and 2 changes, round 3 approve (2026-11-22; the $8 cap accepted as a declared
# deviation). Approval items folded in: the prompt file's content hash in input_sha256, the live check's zero task-budget
# refusals, the `fresh` flag and source-bound defers, the ADR-0005 owner note. Added at approval: the lab binding
# includes each lab's cell index (VEC-PIPELINE-3 `labs-swapped` moves the only lab, which an index-free list misses).
# Integration (V/SRV-TUTOR-impl, 2026-11-23): with SRV-INGEST's migration in the heads, the test fixture
# `import_material` fills the real tables' NOT NULL columns (ingests.artifact_id, span_count, outline_count,
# outline_source, pages_without_text; material_spans boxes); no oracle changed.
# Amendment (2026-11-23, V/plan; reviewed with SRV-PLAN, deep-reviewer rounds 1–4, approve on d9f655a):
# FR-PIPELINE-14 (a per-course advisory lock; course import as a function, with re-plan removal of unstarted lessons,
# re-checked under the lock, and renumbering for origin `study_plan`) and FR-PIPELINE-15 (run creation takes the same
# course lock and can refuse `already_started`), for SRV-PLAN. Paired: SRV-LESSON FR-LESSON-15. Promoted with their
# Red tests.
# Amendment (2026-11-23, V/compile-ui, for WEB-UI FR-UI-15): FR-PIPELINE-16, a stopped step's SRV-AGENT error code in
# the status routes, so the owner's list can say "No AI provider is connected" instead of only "Compile stopped".
# Today a permanent agent error reaches SRV-EVENTS as the exception's class name (`AgentError`, FR-EVENTS-6), so
# `provider_missing` is not recoverable from the job key. Round 1 (cc817d0, changes): the record carries the
# step's input_sha256 and is reported only for a dead `AgentError` key of that input; an allow-list of codes; and
# FR-PIPELINE-17 (`GET /api/compiles`, the owner's open runs) because a revision exists from the draft step on, so
# the list cannot tell a finished compile from `latest_sha256`. Round 2 on 08534df: VERDICT approve (deep-reviewer,
# run by the coordinator). Folded in before Green at the coordinator's request: the key's code through SRV-EVENTS
# FR-EVENTS-17 `dead_error_code_of`, an off-list permanent code writes null, `runs.record_stage_error` named, the
# open-runs route's query cost and unloadable-lesson limit recorded, a 101-run bound test. Approved by agent.
# Code review (2026-11-24, on cb81aff): VERDICT approve; applied with tests — `derive` treats an `AgentError` from
# `step_input` as "no args" (an unpriced model cannot 500 the list), and FR-PIPELINE-17 breaks ties by id ascending
# like `GET /api/lessons/{lesson_id}/compile`.
#   - SRV-LESSON: provenance stage enum adds `findings`; writes only through `write_revision`; the G2 report takes over
#     its `defers` (a)–(c). `finding.stage` uses its existing values `fact_check`, `adversarial_review`,
#     `lab_verification` (no change).
#   - SRV-INGEST: spans by material and page range; span ids `<material_sha256>:<seq>`.
#   - SRV-KERNEL: its upstream client (`reader.kernels.upstream`) is exported for worker use with the relay byte budgets;
#     OPS-SANDBOX's reset protocol against `kernel-verify` (ADR-0022: one run at a time).
#   - OPS-DEPLOY: `deploy/reader.example.yaml` task budgets sized for two worst-case calls per run (draft 4.00,
#     fact_check 2.00, review 4.00).
#   - OPS-CLI: profiles `agents` and `kernels` (progress tasks V.OPS-CLI-agents, V.OPS-CLI-kernels).
# Paired note 2026-11-24 (V/manage, SRV-CONFIG FR-CONFIG-26, ADR-0036 accepted): `create_run` snapshots
# `compile_runs.task_budgets` from `reader.config.effective` (reader.yaml plus the owner's overrides at run creation;
# a running run keeps its snapshot); `runs.task_budgets(conn, rt)` is async; no oracle changed.
# Code review of the management layer (2026-11-24, V/manage-fix-auth; SRV-CONFIG FR-CONFIG-26 "Enforcement is
# live"): `compile_runs.task_budgets` is a display snapshot (the run status's `task_budgets`); no step reads it, and
# SRV-AGENT's reserve enforces the effective budget per call. tests/pipeline/test_overrides_db.py adds the [db]
# oracle: a task budget override appears in a new run's snapshot, and an override lowered after the run's creation
# refuses the run's draft (`task_budget_exhausted`) while the status still shows the creation-time snapshot.
# ADR-0039 revision (V.kl-pipeline-checks, 2026-11-26, proposed): the check order after drafting, up to 3 loops under
# the loop rule, the rule checks, the lab reference path, fact-check through the search route, Admiralty credibility.
# Owner-approved 2026-11-26 and promoted 2026-11-27 with its Red tests: new ids in their sections, revised ids in
# `revisions` (end of file), each base entry carrying a pointer.

id: SRV-PIPELINE
title: Compile pipeline — stages as data, checks cheapest first with up to 3 loops, budgeted agent stages, findings as open cells, lab verification, G2 report (slice)
status: approved
approved_by: owner          # ADR-0039 revision: owner-approved, conditional on the round-5 fix (relayed by the coordinator, 2026-11-26); first approval 2026-11-22 by agent
approved_at: 2026-11-22
review: "ADR-0039 revision (V.kl-pipeline-checks): deep-reviewer (Fable) rounds 1–5 changes; owner-approved with the round-5 fix (2026-11-26), no further round."
layer: server
track: ai
adr: [ADR-0009, ADR-0004, ADR-0005, ADR-0006, ADR-0008, ADR-0022, ADR-0025, ADR-0017, ADR-0039]
slice: V.COMPILE-min

paths:
  - server/src/reader/pipeline/**
  - server/tests/pipeline/**
  - spec/fixtures/SRV-PIPELINE/**

normative:
  - id: REF-PIPELINE-1
    title: ADR-0009 — staged compile pipeline with fact-check, lab verification, adversarial review and two gates
    url: docs/adr/0009-compile-pipeline-and-verification.md
  - id: REF-PIPELINE-2
    title: spikes/compile-cost/RESULT.md — six-stage L02 compiles, costs, non-convergence, rubber-stamp fact-check
    url: spikes/compile-cost/RESULT.md
  - id: REF-PIPELINE-3
    title: ADR-0004 — lesson notebook format (cell kinds, claims, citations, labs, open cells)
    url: docs/adr/0004-lesson-notebook-format.md
  - id: REF-PIPELINE-4
    title: pilot/bashir/course.yaml — the course plan (lessons, chapters, PDF page ranges), generated from plan.yaml
    url: pilot/bashir/course.yaml
  - id: REF-PIPELINE-5
    title: Claude API model table (cached 2026-11-03) — 1M-token context for claude-opus-5-5 and claude-sonnet-5-5
    url: https://platform.claude.com/docs/en/about-claude/models/overview

bounds:
  run_cap_usd: 8.00          # owner's budget.compile_cap_usd, 2026-11-22 (docs/progress.yaml)
  open_runs_max: 100         # structural (FR-PIPELINE-17): one run per lesson at a time, each started by an owner click
  max_loops: 3               # ADR-0009 and ADR-0039 decision 22 (replaces max_revise_loops: 1)
  fact_find_phase_s: 250     # structural (FR-PIPELINE-26, route mode): stage_job_timeout_s 1,200 − SRV-AGENT
                             # proxy_upstream_timeout_s 900 − a 50 s parse margin; the finds' deadline
  items_max_per_report: 400  # structural: L02 drafts had 59–94 claims; 400 bounds a 39-page chapter at 4× L02's density
  source_max_chars: 300000   # 2.2× the largest pilot chapter (135,935 characters, ADR-0005); at the 2.0 chars/token
                             # floor ≤ 150k tokens; with a 32k-token notebook, reports and 32k output it stays under
                             # 25 % of the 1M-token context (REF-PIPELINE-5); applied to L02 until a chapter of
                             # this size is measured (defers)
  lab_runs: 2                # ADR-0009 stage 5: each lab list runs twice
  lab_exec_timeout_s: 60     # SRV-KERNEL FR-KERNEL-10's execution timeout, per cell and per assert
  verify_job_timeout_s: 3600 # structural: a notebook whose labs need more (FR-PIPELINE-9) is not verified
  stage_job_timeout_s: 1200  # proxy_upstream_timeout_s (900 s, SRV-AGENT) + 300 s for parsing and the revision write;
                             # covers the CLI's own ~3-minute retry sequence (SRV-AGENT FR-AGENT-6)
  stage_max_attempts: 3      # SRV-EVENTS default; each attempt reserves and settles its own spend

tables:
  course_plans: { owner_id: true, columns: "owner_id, plan_course_id text, plan_lesson_id text, lesson_id uuid → lessons, material_sha256, pdf_first int, pdf_last int, g1_at timestamptz; unique (owner_id, plan_course_id, plan_lesson_id); unique (lesson_id)" }
  compile_runs: { owner_id: true, columns: "id uuid pk, owner_id → users.id, lesson_id uuid, cap_usd numeric(8,2), task_budgets jsonb (snapshot of the tasks' budget_usd_per_lesson at start), budget_refused text null (the first refusal code), stage_error jsonb null ({step, code}, FR-PIPELINE-16; migration pipeline_0003), loops int, base_sha256 text null, last_model_sha256 text null, final_sha256 text null, g2 jsonb null, created_at, finished_at null, cancelled_at timestamptz null (FR-PIPELINE-20; migration pipeline_0004), ends int (FR-PIPELINE-18), order_version int NOT NULL (1 = the approved order, 2 = this revision's; migration pipeline_0006 adds it with DEFAULT 1, then sets DEFAULT 2); FK (lesson_id, owner_id) → lessons (id, owner_id)" }
  compile_steps: { owner_id: true, columns: "id bigint identity pk, owner_id, run_id → compile_runs, step int, stage text, input_sha256 text, output_sha256 text null, report jsonb null, reused_from bigint null → compile_steps, model text null, cost_usd numeric(12,6), duration_s numeric, created_at; unique (run_id, step); index (owner_id, stage, input_sha256)" }

errors: [no_material, no_source_spans, source_too_large, lesson_unknown, compile_running, output_invalid,
  input_not_ready, citation_unknown_span, cap_invalid, labs_unverifiable, verify_unavailable, not_owner,
  origin_conflict, started_lesson_dropped, already_started, not_running, lesson_inactive, course_deleted,
  loop_cap_run, loop_cap_task, loop_cap_month]

requirements:
  - id: FR-PIPELINE-1
    text: >-
      Course import (gate G1). `POST /api/pipeline/courses` (owner role only) takes a course plan shaped like
      `pilot/bashir/course.yaml` (JSON), validates it (course id, material sha256, lessons with ids, titles, chapter and
      `pages.pdf` ranges with first ≤ last), refuses `no_material` unless the caller has an imported material with that
      sha256 (SRV-INGEST), and upserts one `course_plans` row per lesson by (owner, plan course id, plan lesson id),
      creating the SRV-LESSON course and lesson on first sight (FR-LESSON-6) and keeping the same lesson uuid on every
      later import. Lessons map by plan lesson id, never by position: a lesson new to the plan (even inserted mid-plan)
      gets a new SRV-LESSON lesson at the next free ordinal of the course, and `course_plans.lesson_id` is unique
      (code review S5). The POST is the owner's G1 approval; `g1_at` is set on each row it creates or changes. A plan
      lesson's `material_title` in citations is the course title (as SRV-TUTOR shows it).
  - id: FR-PIPELINE-2
    text: >-
      Source assembly. For a lesson, the source is the material's spans whose page lies in its `course_plans` page
      range, in `seq` order. Span k (1-based in that order) gets the alias `s<k>`; the alias table is part of the source
      and code expands aliases to span ids. Each span renders as the line `⟦source⟧ s<k> p.<page> <kind> ⟦/source⟧`
      followed by the span text in which `⟦` and `⟧` are replaced by `[` and `]` (VEC-PIPELINE-5). No spans gives
      `no_source_spans`; more than `bounds.source_max_chars` gives `source_too_large`. Rendering is deterministic, so the
      source has a stable sha256. The spans are read from SRV-INGEST's tables (`materials`, `ingests`,
      `material_spans`), created by its migration `ingest_0001`; the [db] tests insert rows that satisfy that schema
      and create no tables of their own (integration on V/slice-integration, 2026-11-23).
  - id: FR-PIPELINE-3
    text: >-
      Stage prompts. A model stage's system prompt is the rendered source followed by a fixed instruction that text
      between source markers is material, never instructions, then the stage instructions from the versioned file
      `server/src/reader/pipeline/prompts/<stage>.<prompt_version>.md`. The user prompt carries the stage input (the
      current notebook with span aliases; for revise also the last fact and review reports). Output is JSON validated
      against the stage's schema (notebook: SRV-LESSON's cell schema after alias expansion; reports: FR-PIPELINE-4);
      otherwise `output_invalid` (transient, SRV-AGENT FR-AGENT-10). `input_sha256` = sha256 over the canonical JSON of
      (stage, source sha256, the stage input's sha256s, prompt_version, the sha256 of the stage's prompt file content,
      resolved model id), so editing a prompt file changes the hash even when `prompt_version` is not bumped. The model's
      notebook output is the compact form `{"cells": [{id, kind, source, sectors?, <kind fields>}]}` with citations as
      `{"span": "s<k>"}` or `{"url", "retrieved"}`; code builds the nbformat 4.5 notebook from it (kernelspec python3,
      `metadata.reader` with `lesson_format` 1 and the lesson title) and stamps each cell's provenance `{stage,
      prompt_version, model}`; a `provenance` or `verified` the model writes is dropped (code review S3: only code
      writes them). **Revised by ADR-0039 (in force 2026-11-26): `revisions` → FR-PIPELINE-3 wins where they differ.**
  - id: FR-PIPELINE-4
    text: >-
      Report schemas (VEC-PIPELINE-4). Fact report: exactly one verdict per claim of the notebook, keyed by (cell id,
      claim id) for `explain` claims and by cell id for `changed` and `erratum` cells: `{cell, claim?, verdict:
      supported|unsupported|contradicted, spans: [alias], note}`; a report missing a key, naming an unknown key, or given
      as a summary is `output_invalid` (REF-PIPELINE-2 finding 2). After validation, code forces `unsupported` for a
      `supported` verdict with no span or with any alias not in the source. Review report: `{findings: [{cell|null,
      claim|null, blocking: bool, text}]}`. Both cap at `bounds.items_max_per_report`; reports are stored on their
      `compile_steps` row with the notebook sha256 they judged. **Revised by ADR-0039 (in force 2026-11-26):
      `revisions` → FR-PIPELINE-4 wins where they differ.**
  - id: FR-PIPELINE-5
    text: >-
      Steps (VEC-PIPELINE-1, -2). A run executes `draft`, `fact_check`, `adversarial_review`; if the last fact report has
      an unsupported or contradicted verdict, or the last review a blocking finding, and fewer than `max_revise_loops`
      loops ran, it executes `revise`, `fact_check`, `adversarial_review`; then `findings` and `lab_verification`
      whenever a notebook exists. Each step is one `pipeline.stage` job (`max_attempts` = `bounds.stage_max_attempts`,
      `timeout_s` = `bounds.stage_job_timeout_s`, or `bounds.verify_job_timeout_s` for lab verification, which runs as a
      second kind `pipeline.verify` because a kind has one timeout (same args, key and handler); transient set per
      SRV-AGENT FR-AGENT-10 plus `verify_unavailable` and `input_not_ready`). A handler: reads its input (absent →
      `input_not_ready`, transient); reuses an earlier completed step with the same `input_sha256` for this lesson, in
      this run or an earlier one, if one exists (no provider call, `cost_usd` 0, `reused_from` set); otherwise runs the stage; writes its effect; enqueues
      the next step; returns. A budget refusal before a model step (SRV-AGENT FR-AGENT-9: run cap, task budget or month)
      sets `budget_refused` and skips the remaining model steps: the run continues with `findings` and
      `lab_verification`. One run per lesson at a time (`compile_running`). Amended by SRV-OBS V.obs-analytics
      (FR-OBS-12 d, -13, -14, -18; ADR-0035 accepted 2026-11-24; tracing only, no outcome changes): the handler sets
      the job root's `reader.lesson.id`, `reader.course.id` (`load_lesson` reads `c.id`) and `reader.prompt.version`
      (the registered version of `reader.<stage>`'s template, None for stages without one); a model step's StageCall
      carries the course id and the step; the fact report's validation runs inside a `verify.claims` child (total
      verdicts, supported verdicts) and `obs.feedback` records `fact_check.passed` (every verdict supported, {claims,
      supported}); lab verification runs inside a `verify.lab` child (cells = labs, cells_ok = passing labs, ms) with
      one `kernel.run` child per run of the labs (cells, exit 0 when every lab passed that run, else 1), and records
      `verify.lab_passed` ({cells, cells_ok}) and `verify.passed` (no problem in the lab report). None of these can
      raise. The session marker comes from SRV-EVENTS' wrapper. **Replaced by ADR-0039 (in force 2026-11-26):
      `revisions` → FR-PIPELINE-5 (the check order, loops and steps); the SRV-OBS tracing above stays, per check run.**
  - id: FR-PIPELINE-6
    text: >-
      Run state, derived from the run's job keys (SRV-EVENTS `job_status`) and steps, never stored: `running` while any key
      is queued or running; `stage_failed` when any key is `dead` (it exhausted transient attempts, raised a permanent
      error or timed out), and the run keeps its last revision; `stalled` when no key is queued, running or dead and the
      run has not finished `lab_verification` (a step's enqueue was lost); after `lab_verification`: `budget_exhausted` if
      `budget_refused` is set, `converged` if no open cell of the final revision is blocking, else `open_findings`.
      `ensure(run_id)` re-enqueues the next step of a `stalled` run (idempotent by key); the worker calls it for every
      unfinished run at start, and the status routes call it on each read. **Revised by ADR-0039 (in force
      2026-11-26): `revisions` → FR-PIPELINE-6 wins where they differ.**
  - id: FR-PIPELINE-7
    text: >-
      Citations. The model cites span aliases; code expands each to its span id, removes citations naming an alias not
      in the source (and forces the verdict of that claim, or of that `changed` or `erratum` cell, to `unsupported`,
      VEC-PIPELINE-4; code review S2), and fills `page` and `material_title` from the span and the course title (the
      model never writes them). In the slice, every `changed` cell and
      every URL citation also becomes an open cell (`url_citation_unchecked`, `changed_unchecked`; `finding.stage`
      `fact_check`), since there is no web fact-check yet.
  - id: FR-PIPELINE-8
    text: >-
      G2 report (VEC-PIPELINE-3), computed after lab verification and stored on the run; no publish in the slice. For the
      final revision F and the last model-written revision M: (a) labs — the sha256 over the ordered list of F's lab cells
      as `(cell index, id, source, asserts, kernel, network)` (`labs.binding` when it differs from the list lab
      verification ran), and whether every lab carries a passing `verified` whose `input_sha256` matches its source
      (`labs.unverified` otherwise); (b) claims —
      uncited claims, where an `explain` cell with no claims counts as uncited, plus `changed` and `erratum` cells without
      a supported verdict, and blocking open cells, where `wontfix` still counts as blocking; (c) stages — whether
      `fact_check` and `adversarial_review` stage records exist on M; (d) deltas — F equals the deterministic function
      `stamp_labs(append_findings(M, reports), lab_report)` recomputed from the stored inputs, compared on the canonical
      form: the SRV-LESSON canonical bytes (FR-LESSON-2) of F equal those of the recomputed notebook (nbformat stores an
      appended cell's `source` as a list of lines; an in-memory string must not count as a delta). A notebook that
      cannot be put in canonical form (a LessonWriteError or UnicodeEncodeError from the validator) counts as a delta:
      `deltas.mismatch`, never a failed step. `publishable` is true only when (a)–(d) are all clean. **Revised by
      ADR-0039 (in force 2026-11-26): `revisions` → FR-PIPELINE-8 wins where they differ.**
  - id: FR-PIPELINE-9
    text: >-
      Lab verification (`reader.pipeline.verify`). The worker-side client talks to `kernel-verify` through the SRV-KERNEL
      upstream client (no browser relay): reset per OPS-SANDBOX (exit, new nonce, `up`) before each run, then for each
      `lab` cell in notebook order execute its source and then each assert, each with `bounds.lab_exec_timeout_s`,
      collecting outputs within SRV-KERNEL's relay byte budgets: at most `EXEC_OUTPUT_MAX` (16 MiB) of text in all per
      run, beyond which the lab producing it fails (code review S4). The list runs `bounds.lab_runs` times. "Outputs
      identical" compares, per cell, the normalised `text/plain` of stream and execute_result outputs (CRLF → LF,
      trailing whitespace stripped). A lab passes when every assert passes on every run and outputs are identical; the
      result is written into each cell's `verified` by the `lab_verification` step. An assert failure or an execution
      timeout fails that lab (a blocking open cell, `finding.stage` `lab_verification`); a failed reset or an unreachable
      `kernel-verify` is `verify_unavailable` (transient). If (Σ over labs of (1 + asserts)) × (`lab_exec_timeout_s` +
      the 5 s interrupt grace) × `lab_runs` + `lab_runs` × the 30 s reset deadline exceeds `bounds.verify_job_timeout_s`, the labs are not run and one blocking open cell
      `labs_unverifiable` is added. No labs is a pass (L02 has none). **Revised by ADR-0039 (in force 2026-11-26):
      `revisions` → FR-PIPELINE-9 wins where they differ.**
  - id: FR-PIPELINE-10
    text: >-
      Findings step (stage `findings`, no model call). It appends one `open` cell per distinct remaining problem with
      `finding: {stage, blocking, text}`: every unsupported or contradicted verdict of the last fact report
      (`fact_check`, blocking), every finding of the last review (`adversarial_review`, its blocking flag), and the slice's
      `changed_unchecked` and `url_citation_unchecked` items (`fact_check`, non-blocking). The open cell id is `f-` + the
      first 16 hex of sha256(finding kind, target cell id, claim id or "", text); problems with the same id collapse into
      one cell (blocking if any of them is), so a rerun neither duplicates nor renumbers them; an id already taken by a
      cell that is not the same open finding gets a `-1`, `-2`, ... suffix instead of being dropped; `notes` cells are
      never touched (SRV-LESSON INV-LESSON-3). **Revised by ADR-0039 (in force 2026-11-26): `revisions` →
      FR-PIPELINE-10 wins where they differ.**
  - id: FR-PIPELINE-11
    text: >-
      Routes (owner role only; others get 404). `POST /api/lessons/{lesson_id}/compile` with optional `{"cap_usd": x}`
      (0 < x ≤ `bounds.run_cap_usd`, at most two decimals, else 400 `cap_invalid`; no body at all means the default
      cap) creates a new run and enqueues its first
      step; 409 `compile_running` while a run of that lesson is `running` or `stalled`. `POST
      /api/compiles/{run_id}/resume` on a `stage_failed` run requeues its dead key (SRV-EVENTS `requeue_dead`) and calls
      `ensure`. A recompile is always a new run (reusing unchanged steps, FR-PIPELINE-5). `GET /api/compiles/{run_id}` and
      `GET /api/lessons/{lesson_id}/compile` (latest run) return: state, steps with model, cost, duration and reuse,
      total spent, the task budgets and any refusal, the G2 report and the latest revision sha256; both call `ensure`.
      Bodies follow SRV-AUTH FR-AUTH-12. ADR-0039 revision: the body also carries `loops`, `stop`, `refused_limit`
      and `target_usd` (FR-PIPELINE-6 revised).
  - id: FR-PIPELINE-12
    text: >-
      Provenance. Every step writes through SRV-LESSON `write_revision` with provenance `{input_sha256, prompt_version,
      model, cost_usd, duration_s}` (the keys SRV-LESSON allows), also when the notebook is unchanged or reused.
  - id: FR-PIPELINE-13
    text: >-
      Live compile of L02 on the Bashir pilot: one run ends in `converged`, `open_findings` or `budget_exhausted` within
      the cap with zero task-budget refusals (the example budgets fit two worst-case calls per task, so a refusal means
      the sizing is wrong); its settled ledger sum equals the SDK-reported total; the owner opens the revision in the browser. Spends
      credit within the owner's test budget; the spike's $2.4–3.0 for one loop is a lower guide, not a bound. [live]
      **Revised by ADR-0039 (in force 2026-11-26): `revisions` → FR-PIPELINE-13 wins where they differ.**
  # Amendment for SRV-PLAN (2026-11-23, V/plan; reviewed with SRV-PLAN, deep-reviewer round 4 approve on d9f655a):
  # promoted with its Red tests. FR-PIPELINE-1..13 are unchanged in behaviour; the pilot's `POST /api/pipeline/courses`
  # keeps importing pilot/bashir/course.yaml.
  - id: FR-PIPELINE-14
    text: >-
      **Course lock and course import as a function.**
      - `reader.pipeline.courses.lock_course(conn, owner_id, plan_course_id)` takes
        `pg_advisory_xact_lock(COURSE_LOCK_NAMESPACE, hashtext(owner_id || ':' || plan_course_id))`, held to the end of
        the caller's transaction (a hash collision only serializes two courses). Lock order everywhere: the course
        lock before FR-PIPELINE-11's per-lesson lock.
      - FR-PIPELINE-1's import becomes `import_course_plan(conn, owner_id, plan, *, origin: "manifest" |
        "study_plan") -> ImportResult`, called by the existing route (origin `manifest`, behaviour unchanged; the
        route now takes the course lock too) and by SRV-PLAN's confirm (origin `study_plan`, inside the caller's
        transaction, which already holds the course lock). A [db] test per route holds `lock_course` on a second
        connection and pins that the request waits (an ungranted advisory lock) until that commit.
      For origin `study_plan` only:
      - lessons of the course that are absent from the new plan are removed when they have **not started**,
        re-checked inside this transaction immediately before each removal: their `course_plans` row, then the
        SRV-LESSON lesson through `delete_unstarted_lesson` (SRV-LESSON paired change FR-LESSON-15: "started" is
        `started_lessons`, the same function SRV-PLAN's preview uses; it raises `lesson_started` otherwise);
      - a started lesson absent from the new plan, or `lesson_started` from that call, is `started_lesson_dropped`
        (SRV-PLAN FR-PLAN-6 keeps started lessons fixed, so this is a guard; the transaction rolls back);
      - a lesson kept with a changed page range or title gets its `course_plans` row updated (`g1_at` as
        FR-PIPELINE-1); a started lesson's range never changes (SRV-PLAN fixes it), else `started_lesson_dropped`;
      - after the upserts, the course's lessons are renumbered to plan order 1..n through SRV-LESSON `reorder_lessons`
        (paired change: two passes, first every ordinal + (current max + n), then the final values, because
        `UNIQUE (course_id, ordinal)` is not deferrable and `ordinal ≥ 1`), so the lesson list follows the plan after
        any re-plan;
      - `course_plans` gains `origin text NOT NULL DEFAULT 'manifest' CHECK (origin IN ('manifest', 'study_plan'))`
        (migration `pipeline_0002` in `reader/pipeline/migrations`), and a course holds rows of one origin only
        (`origin_conflict`, 409, otherwise).
      `ImportResult` = `{course_id, lessons: [(plan_lesson_id, lesson_id, ordinal)], created, removed}`. [db] with the
      pilot: importing pilot/bashir/course.yaml through the route gives the same `course_plans` and lesson rows
      (ids, ordinals, page ranges, `g1_at` rules) as before the change, and a second import changes nothing; a study
      plan re-import removes only unstarted lessons and renumbers the rest in plan order.
  - id: FR-PIPELINE-15
    text: >-
      **Run creation under the course lock.** FR-PIPELINE-11's `reader.pipeline.runs.create_run(engine, jobs,
      owner_id, lesson_id, cap_usd, *, require_course_unstarted=False) -> run_id` first takes the course lock of the
      lesson's `course_plans` row (FR-PIPELINE-14; none for a lesson without one), then the per-lesson lock as today,
      and re-reads the lesson after taking the locks, inside that transaction (a lesson removed by a concurrent re-plan
      raises FR-PIPELINE-11's `lesson_unknown`, 404 at the route; a [db] test pins this re-read with a removal committed while `create_run` waits on the lock). With
      `require_course_unstarted`, any compile run of any lesson of the same plan course raises `already_started`
      (SRV-PLAN's compile-first target). `compile_running` and SRV-AGENT's budget refusals are unchanged; the route
      passes the default and behaves as before. [db]
  - id: FR-PIPELINE-16
    text: >-
      **A stopped step's error code.**
      - **Recording.** When a model step raises a permanent SRV-AGENT error (an `AgentError` that is neither a
        `TransientAgentError` nor a `BudgetRefused`) whose code is in the declared allow-list
        `reader.pipeline.runs.STAGE_ERROR_CODES` = {`sdk_error`, `tools_mismatch`, `unknown_model`,
        `provider_missing`, `usage_unmapped`, `settle_refused`, `void_refused`} (FR-AGENT-10's permanent codes plus
        the ledger's two refusals), the handler records `{"step": <step>, "input_sha256": <the step args'
        input_sha256>, "code": <code>}` in `compile_runs.stage_error` (jsonb null; migration `pipeline_0003`, whose
        downgrade drops the column), then re-raises the same exception, so SRV-EVENTS judges it as before (`dead`,
        `error_code` `AgentError`). A permanent `AgentError` whose code is outside the list writes null instead, so a
        stale code from an earlier failure is cleared. The write is
        `reader.pipeline.runs.record_stage_error(engine, run_id, value: dict | None)`, which the handler calls through
        the module attribute (`runs.record_stage_error`, not a name imported into the handler's module), so tests can
        replace it. It runs on a separate connection,
        committed at once, the same allowance SRV-AGENT FR-AGENT-9 uses for its reservations (the handler's own
        transaction rolls back with the failure; up to the model call it has only read, so the second transaction
        waits on no lock the first holds). If that write fails, the handler logs one line with the run id and the
        code only and re-raises the original exception, never the write's.
      - **Reporting.** The status routes (FR-PIPELINE-11, -17) add `error`: the recorded code only when all hold —
        the run is `stage_failed`; its pending step's number and its args' `input_sha256` equal the recorded `step`
        and `input_sha256`; and that step's dead job key has `error_code` `AgentError`. Otherwise null. The key's code
        comes from SRV-EVENTS FR-EVENTS-17 `dead_error_code_of(conn, kind, key)` (paired amendment, the published
        read); the pipeline never queries `job_keys` itself. So a code recorded for another step, for an earlier input of
        the same step, or before a later death of another kind (a transient exhaustion, a timeout) is never shown.
      - **Resume.** `POST /api/compiles/{run_id}/resume` sets `stage_error` to null in a committed transaction before
        `requeue_dead`. If the process dies between the two, the run stays `stage_failed` with `error: null` (the
        code is lost and the UI shows the generic stopped copy); a second resume works as before.
      The code is fixed text from the allow-list, never a message. [db] server/tests/pipeline/test_stage_error_db.py:
      an owner without a provider (`provider_missing` at `draft`) gives `stage_failed` with `error:
      "provider_missing"` and the stored `{step, input_sha256, code}`; after resume, `error` and the column are null
      and the run converges; a step that dies of exhausted transient attempts gives `error: null` and nothing
      stored; a recorded code whose `input_sha256` differs from the pending step's (a changed input at the same
      step) is not reported; a code recorded for the pending step's own input is not reported when the key died of
      a transient exhaustion; a code recorded for step 1 is not reported when step 2 stopped; a code outside the
      allow-list is not recorded and clears a stale record (null); a failing `runs.record_stage_error` (replaced by
      the test) still lets the original exception through, with one log line naming only the run and code; the job
      key's own `error_code` stays `AgentError`; the migration's downgrade drops the column.
  # Amendment (2026-11-23, V/compile-ui round 2): the list's run-state source for WEB-UI FR-UI-15. A revision exists
  # from the draft step on, so `latest_sha256` cannot tell an owner whether a lesson's compile finished.
  - id: FR-PIPELINE-17
    text: >-
      **Open runs.** `GET /api/compiles` (owner role only, others 404, as FR-PIPELINE-11) returns `{"runs": [...]}`:
      for each of the owner's lessons its latest run (`created_at` descending, ties broken by `id` ascending, the
      order FR-PIPELINE-11's `GET /api/lessons/{lesson_id}/compile` uses), kept when it is unfinished
      (`finished_at` null) or ended with a budget refusal (`budget_refused` set), in that same order, at most
      `bounds.open_runs_max` = 100 (structural: one run per lesson at a time, started by the owner's own clicks;
      more are cut, newest kept). Each entry is that run's FR-PIPELINE-11 status (with FR-PIPELINE-16's `error`),
      so the derived state is one of `running`, `stalled`, `stage_failed` or `budget_exhausted`; a run whose derived
      state is `converged` or `open_findings` is dropped. Like the other status routes it calls `ensure` per run, so
      a list view re-enqueues a stalled run.
      Known costs and limits (recorded, accepted for v1): every read derives each open run, about 8 queries per run
      (run, steps, current revision, job status, dead code, ledger, and ensure's re-derive), on every list poll while
      a run is `running` or `stalled`, so 100 open runs mean about 800 queries per 5 s poll; a run whose next step's
      input cannot be computed (its lesson cannot be loaded, a `PipelineError`, or its stage's model cannot be
      resolved or priced, an SRV-AGENT `AgentError` from `step_input`; FR-PIPELINE-6's `derive` treats both as "no
      args", so neither turns the read into a 500) stays `stalled`, is never re-enqueued and shows "Compiling" in
      the list until FR-UI-15's 30-minute polling stop.
      [db] server/tests/pipeline/test_open_runs_db.py: a running run, a
      stage_failed run, a budget-refused run and a converged run of four lessons give the first three, newest first;
      a lesson's older stopped run under a newer converged run is not listed; another owner's runs (rows under a
      second owner id) are not listed; a learner gets 404; a stalled run is re-enqueued by the read; 101 lessons with
      a budget-refused run each give exactly 100 entries, the oldest cut; two runs with the same `created_at` list in
      `id` order, the same one `GET /api/lessons/{lesson_id}/compile` returns; a stage whose `step_input` raises
      `AgentError` leaves the read 200 with that run `stalled`.
  - id: FR-PIPELINE-18
    text: >-
      Paired SRV-OBS phase 2 change (FR-OBS-20, ADR-0038). After the transaction that records a compile run's end
      (finished, failed or dead) has committed, the code that recorded it enqueues `obs.runs` {kind: compile, id:
      the run id, end: the run's count of recorded ends, 1 for the first} with `schedule_in` 60 s, inside its own
      try/except: an enqueue failure is logged as `obs runs_enqueue_failed kind=compile` and never changes the run's
      outcome, its status or the read routes (SRV-OBS INV-OBS-3). A resumed run that ends again enqueues with the
      next `end`. With tracing off nothing is enqueued. The end is counted (`compile_runs.ends` + 1, at most 100)
      by the stage kinds' SRV-EVENTS `after_end` hook only for the step that ended the run (code review of
      8466329): a succeeded step of a run that is finished and not cancelled whose `step` is at least every
      recorded step of the run, or a dead step of a run that is not finished (a dead step after the run ended, or
      after a cancel, counts nothing). A cancel (FR-PIPELINE-20) counts its end in its own transaction and enqueues
      after commit; the step that sees the cancel counts nothing. Tests: [db] a finished and a failed run each enqueue exactly
      one `obs.runs` with end 1 after commit; a resumed run's second end enqueues end 2; a cancelled run enqueues
      end 1; a failing enqueue leaves the run's end recorded and logs the line; a raising `after_end` leaves the
      step's outcome recorded; the ending-step rule pinned case by case (code review round 2): on a finished run
      an earlier step's succeeded `after_end` and a dead step's count nothing, the final step's counts once and a
      second call for it counts again only as a new end of a run that is still finished (the hook runs once per
      committed outcome); on a cancelled run nothing counts; a run stopped before finishing labels its lesson
      through the step that produced the revision (SRV-OBS FR-OBS-24 c).
  # Amendment (2026-11-24, V/manage, WEB-MANAGE): FR-PIPELINE-20..22; see the note at the end.
  # Code-review fixes (V/manage-fix-srv, 2026-11-24): FR-PIPELINE-20's tests gain the paused real step (B4), the
  # budget-refusal and budget-stopped cancel cases and owner scope on cancel and history (surviving mutants).
  - id: FR-PIPELINE-20
    text: >-
      **Cancel a run.** `POST /api/compiles/{run_id}/cancel` with `{}` (owner) on an open run (`finished_at IS NULL
      AND cancelled_at IS NULL`: derived `running`, `stalled` or `stage_failed`) is one statement on its own
      connection, `UPDATE compile_runs SET cancelled_at = now(), finished_at = now() WHERE id = :run AND owner_id
      = :o AND finished_at IS NULL AND cancelled_at IS NULL RETURNING id` (new nullable column `cancelled_at`;
      migration `pipeline_0004`). It takes no advisory lock (the step handler holds its job transaction for
      minutes, SRV-EVENTS owner note); it waits only on the run row's lock, which a step holds from its re-read (2)
      below to its commit. No row returned → the run is re-read: already `cancelled` → 200 with the same body
      (idempotent); finished → 409 `not_running`. **The step handler** (`pipeline.stage` and `pipeline.verify`,
      steps.py), in its job transaction: (1) before it reserves budget, calls a model or runs the lab kernel, reads
      `SELECT cancelled_at FROM compile_runs WHERE id = :run` (READ COMMITTED, so a committed cancel is seen) — set
      → return without effect; (2) after the model call or the lab run returns, reads `SELECT cancelled_at FROM
      compile_runs WHERE id = :run FOR UPDATE`, which locks the run row until the step commits — set → skip
      `write_revision`, the `compile_steps` row and the enqueue of the next step, and return. Because of that lock
      a cancel either commits before (2), and the step writes nothing, or waits until the step has committed its
      revision and its enqueue, and the next step's (1) then sees it; there is no window in which a step writes
      after a committed cancel. The model call has already settled or voided its reservation in the ledger
      (SRV-AGENT FR-AGENT-9 runs on its own committed connection), so the spend stays recorded. `_finish` and
      `_refused` add `AND cancelled_at IS NULL` to their UPDATE and do nothing when it matches no row. `derive`
      checks `cancelled_at` first: set → state `cancelled`, no `ensure`, no requeue. A dead key of a cancelled
      `stage_failed` run is never requeued (resume → 409 `not_failed`). 200 the run body of FR-PIPELINE-11.
      [db] cancel between steps (no further reservation row); cancel during a stubbed model call (that call
      settles, no revision, no compile_steps row, nothing enqueued); cancel during a stubbed lab run (no stamped
      revision, no `_finish`); cancel, then SRV-LESSON revert, then the late step returns: the reverted revision
      stays current; a cancel sent while the real step handler is paused right after its read (2) (a test hook
      around that read, no sleep) waits — `pg_stat_activity` shows its backend waiting on a lock with its UPDATE —
      until the step commits its revision, its compile_steps row and its enqueue, then commits; the next step
      returns at (1) with no reservation and nothing written; a cancel committed while the model call is refused
      for budget leaves `budget_refused`, `g2` and the cancel's `finished_at` as they were (`_refused` writes
      nothing); cancel of a budget-stopped run that is still open (`budget_refused` set, `finished_at` null) → 200
      `cancelled`, of a finished budget-stopped run → 409 `not_running`; another owner's run id on cancel, and
      another owner's lesson on FR-PIPELINE-21's history → 404 with nothing written; cancel twice; cancel a
      finished run; resume a cancelled run; the per-key idempotency of SRV-EVENTS FR-EVENTS-5 unchanged.
      **Revised by ADR-0039 (in force 2026-11-26): `revisions` → FR-PIPELINE-20 adds the order change at deploy.**
  - id: FR-PIPELINE-21
    text: >-
      **Run history.** `GET /api/lessons/{lesson_id}/compiles` → the lesson's newest 20 runs `{runs: [{run_id,
      state, created_at, finished_at, spent_usd, cap_usd, steps: n, error}]}`, newest first; read-only, no
      `ensure`. [db]
  - id: FR-PIPELINE-22
    text: >-
      **Inactive lessons.** `POST /api/lessons/{lesson_id}/compile` and `/api/compiles/{run_id}/resume` answer 409
      `lesson_inactive` for a skipped lesson or a lesson of an archived course, and 404 for a deleted lesson or a
      lesson of a deleted course (SRV-LESSON FR-LESSON-24/-25/-28); the check sits in runs.py `load_lesson`, read
      after `create_run`'s two locks (SRV-LESSON INV-LESSON-23), so it also covers `derive`'s `ensure` and the step
      handler (a step of a lesson deleted meanwhile cannot exist: delete refuses an open run). FR-PIPELINE-15's
      compile-first skips them. The manifest import (`POST /api/pipeline/courses`, FR-PIPELINE-1) whose plan
      course maps to a deleted course answers 409 `{"error": "course_deleted", "course_id": <id>}` and writes
      nothing (restore the course first; SRV-PLAN FR-PLAN-20 does the same for a study plan). A run of a lesson whose
      material is deleted cannot start either: no course that is not deleted refers to a deleted material
      (SRV-INGEST FR-INGEST-32), and as a second guard source.py's `material_imported` query becomes `SELECT 1 FROM
      materials WHERE owner_id = :o AND sha256 = :m AND deleted_at IS NULL` (today without the last condition), so
      it is false for a deleted material, so an import refuses it with the existing `no_material` (courses.py). [db] each refusal; the manifest import onto a deleted
      course.
  # ADR-0039 revision (2026-11-26, owner-approved): FR-PIPELINE-23..27, promoted with their Red tests; route mode of
  # FR-PIPELINE-26 waits for SRV-SEARCH's fact-check route (defers).
  - id: FR-PIPELINE-23
    text: >-
      **Loop rule** (ADR-0039 ADR-0005 row; SRV-AGENT FR-AGENT-23). Before enqueuing `revise`, the handler of the
      check that failed builds the loop's planned calls, each an SRV-AGENT `PlannedCall`, checking reuse first: a
      call whose `input_sha256` is known now and has a completed step to reuse (FR-PIPELINE-5) is not planned.
      `revise`: its input is known now (exact prompt); when it is reusable, its output notebook is known, so the
      inputs of the loop's `fact_check` and `adversarial_review` are computed from it and reusable ones are dropped
      too. Otherwise `fact_check` and `adversarial_review` are planned with prompts rendered from the current notebook
      as an estimate of the revised one, the route-mode fact-check source counted at `bounds.source_max_chars`, plus
      in route mode one `judge.find` per fact-checkable item of the current notebook (at most
      `bounds.items_max_per_report`; an over-estimate, since the find deadline may reach fewer) with the slot's input
      cap, max output and floor. Rules and lab verification make no calls and are not planned. A loop with no planned
      call starts without asking. Otherwise it calls SRV-AGENT `loop_fits_limit(owner_id, run_id,
      compile_runs.cap_usd, planned)`: None → enqueue `revise`; a limit → set `budget_refused` to `loop_cap_run`,
      `loop_cap_task` or `loop_cap_month` when it is null, enqueue `findings`, start no model call. The decision
      commits with the check's step row (FR-PIPELINE-5), whose report also records `planned_usd` (the sum of the
      planned reserves) and `planned_judge_usd` (its `judge.find` part). The plan is an admission estimate: every
      call still reserves under FR-AGENT-9, so no cap can be crossed when the revised notebook is larger than
      planned. The first pass is not a loop and is not planned.
    tests_planned:
      - "add server/tests/pipeline/test_loop_rule_db.py [db]: a loop whose summed reserve would cross the run cap does not start (no revise step, no new reserve row, budget_refused loop_cap_run, state budget_exhausted, findings ran); a task-budget crossing records loop_cap_task; a sum that fits exactly starts the loop; the planned calls recorded by a fake loop_fits_limit: section mode → revise (task draft), fact_check, review; route mode → plus one judge.find per claim, changed and erratum cell, fact_check planned at source_max_chars; a loop whose revise and checks are all reusable starts with loop_fits_limit not called, even with the month spent to the cap; the first pass never calls it"
  - id: FR-PIPELINE-24
    text: >-
      **Rule check** (stage `rules`, 0 model calls, no reservation, no ledger row). Rules are declared by name in
      stages.yaml `rules`, each a pure function in `reader.pipeline.rules` over (notebook, the source's aliases, the
      model step's strip list, stages.yaml), run in declared order: `explain_without_claims` (an `explain` cell with
      no claim); `claim_uncited` (a claim with no citation after FR-PIPELINE-7's expansion); `cell_uncited` (a
      `changed` or `erratum` cell with no citation); `citation_stripped` (the model step's output cited an alias not
      in the source, which FR-PIPELINE-7 removed; the draft and revise steps record the strip list on their report);
      `lab_reference_missing` (a lab without `reference`); `lab_reference_unresolved` (FR-PIPELINE-25's checks);
      `labs_unverifiable` (FR-PIPELINE-9's time bound exceeded). Report per FR-PIPELINE-4, items in cell order then
      rule order. `input_sha256` = sha256 of the canonical JSON of (stage, notebook sha256, source sha256, strip
      list sha256, sha256 of stages.yaml's `rules` and `reference_libraries`, the lab bounds `lab_runs`,
      `lab_exec_timeout_s` and `verify_job_timeout_s`, `RULES_VERSION`).
    tests_planned:
      - "add server/tests/pipeline/test_rules.py [unit] over VEC-PIPELINE-7: each rule fires on its case and on no other; a clean notebook passes; the provider object is never touched (a fake that raises)"
      - "add to test_pipeline_db.py [db]: a rules step writes no agent_spend row and is reused by input_sha256; a changed source or lab bound gives a new input_sha256"
  - id: FR-PIPELINE-25
    text: >-
      **Lab reference path** (ADR-0009 stage 5; D1). The drafter, and the reviser, write on each `lab` cell a
      `reference`, one of `{kind: test_vector, span: "s<k>", expected: [string, ...]}` (official test vectors in a
      span of the source), `{kind: library, module: <name>}` (a reference library in the kernel image) or `{kind:
      second_implementation}` (a separate implementation inside the asserts). The independent path is built then,
      at draft time; lab verification only runs it. The model writes `span` as an alias; when code builds the
      notebook (FR-PIPELINE-3) it expands the alias to the span id, so the stored reference holds a span id (the
      SRV-LESSON `span_ref` shape); an alias not in the source is dropped from the reference, which then has no
      `span`, so `lab_reference_unresolved` fires; it is not added to the citation strip list (`citation_stripped`
      stays about citations only). `to_compact` maps the span id back to its alias when the notebook goes into a
      later prompt, so the round trip is the identity. Rules (`lab_reference_unresolved`): for `test_vector`, `span`
      is present and is a span of the source, each `expected` string occurs verbatim (NFC) in that span's text and in
      at least one assert; for `library`, the module is in stages.yaml `reference_libraries` and named in at least
      one assert; `second_implementation` has no rule beyond presence. The adversarial review's prompt instructs the
      reviewer to report, as blocking, a lab whose reference is not independent of the lab's own computation. L02
      has no labs; the first lab-bearing lesson measures how often references fail (defers).
    tests_planned:
      - "test_rules.py over VEC-PIPELINE-7's reference cases: unknown alias (dropped at build, then lab_reference_unresolved), expected string absent from the span or from every assert, module outside the list, module in no assert, each kind valid"
      - "add to test_source_and_reports.py over VEC-PIPELINE-7's round-trip case: build expands the reference alias to the span id, to_compact maps it back, build(to_compact(n)) == n"
      - "add to test_source_and_reports.py: the adversarial_review prompt file contains the reference-independence instruction (by its fixed marker line; prompt_version stays v1, the file edited in place)"
  - id: FR-PIPELINE-26
    text: >-
      **Fact-check source** (ADR-0039 B6 fact-check route; D4). stages.yaml `fact_check.source`: `section` → the
      lesson's source of FR-PIPELINE-2 (today's behaviour); `route` → for each fact-checkable item (an `explain`
      claim, a `changed` or `erratum` cell) in notebook order, at most one SRV-SEARCH `find(caller, channel:
      pipeline, query, budget, judge_ctx, question_type: fact_check)` (FR-SEARCH-22). `query` = the first 1,000
      characters of the item's text (the claim text; the cell's source for a cell) after NFC normalisation and
      trimming (FR-SEARCH-22 allows 1–1000). An item whose text is empty after trimming gets no find and is judged
      on its cited spans; it is not under the incomplete-evidence rule below, so an `unsupported` verdict on it
      fails the check and causes a loop like any other (the drafter wrote an empty claim). `judge_ctx` = {line:
      `compile`, run_id: the compile run, run_cap_usd: `compile_runs.cap_usd`, lesson_id, daily_budget_usd: the
      owner's effective daily budget (`reader.config.effective`, as the tutor passes it)}. **Two alias namespaces,
      never mixed.** The notebook passed to fact_check keeps its lesson aliases `s<k>` (FR-PIPELINE-2), and every
      span a fact-checkable item cites is always rendered first, as its `s<k>` line, in ascending `k`. An `s<k>`
      alias in the fact report that was not rendered counts as not in the source (FR-PIPELINE-4's forcing). The
      route's cards that are not already among those spans are deduplicated by span id in first-seen order and
      rendered after them with their own aliases `r1`…`rN`; a card line is `⟦source⟧ r<k> p.<page> <kind>
      ⟦/source⟧` followed by the span text, with `⟦`/`⟧` replaced as in FR-PIPELINE-2 (VEC-PIPELINE-5). A card's
      context prefix (ADR-0039 B1) is not rendered: it is retrieval text, not evidence. **Bound and per-find
      budget.** The rendered fact-check source is bounded by `bounds.source_max_chars` (300,000; the pipeline
      channel's budget is the stage's own context budget, ADR-0039 B8). Finds run one after another (initial), in
      notebook order over the items with non-empty text. Before each find, its token budget is
      floor((`source_max_chars` − the characters already rendered: the cited spans and the cards kept so far) / (2.0
      × n)), 2.0 being SRV-AGENT's `chars_per_token_floor` and n the number of items, this one included, that are
      still to be asked; an item skipped (its budget below SRV-SEARCH policy `budget_min`, 400, so it gets no find)
      leaves n before the next item's budget is computed, so the divisor counts only items that may still get a
      find. A card's estimated tokens are at least half its rendered characters, so the cards fit the bound by
      construction. **Find-phase deadline.** The finds share a deadline of `bounds.fact_find_phase_s` (250 s = the
      1,200 s `stage_job_timeout_s` − SRV-AGENT's 900 s `proxy_upstream_timeout_s` − a 50 s parse margin), checked
      before each find, so the find phase plus the longest model call fit the step's job timeout; once it has
      passed, the remaining items get no find. **Guard cut.** If the rendered cards still exceed the bound (a find
      returned more than its budget), cards are kept per item, first each item's top card (its first by `find`'s
      order), then the items' next cards round-robin in item order, each card whole, until the next would cross the
      bound. **One rule for incomplete evidence.** An item judged without its full route evidence — a card cut by
      the guard, not reached by the deadline, or its budget below `budget_min` — is judged on what was rendered (an
      item with no find on its cited spans only), and gets, by code, the outcome `source_too_large` only when the
      model's verdict is `unsupported`; `supported` and `contradicted` stand. `source_too_large` does not fail the
      check and becomes a blocking open cell (FR-PIPELINE-10). In route mode `input_sha256` = sha256 of the
      canonical JSON of (stage, notebook sha256, `brain_version`, `policy_version`, prompt_version, prompt file
      sha256, resolved model), read before any find, so a reused step makes no find. A find response with
      `degraded: true` (SRV-SEARCH: the embed call failed, or `judge_skip` ∈ {timeout, error, budget, saturated,
      quota_refused, no_provider}) is used as returned, never sets `budget_refused`, and is recorded on the step's
      report, so that step is never reused (FR-PIPELINE-5); an embed-degraded find blocks reuse like a
      judge-degraded one. A gate-skipped response (`judge_skip: gate`, `judge_ran: false`, `degraded: false`) does
      not block reuse. **Fallback and decision hook:** `section` is the value until (1) SRV-SEARCH's fact-check
      route, with the paired-change row of this revision's header, is approved and merged (V.kl-search-find); that
      row is a promotion gate for `route`, not for this revision, and (2) spikes/retrieval-ablation/RESULT.md
      applies ADR-0039 B10's rule to the fact-check comparison: if the route is not significantly worse than the
      whole-section baseline and not worse by more than a net 2 of 30, the value becomes `route` in one data change
      citing that RESULT.md; otherwise it stays `section` and the task blocks for the owner with both measurements.
      **In this slice** only `section` loads (stages.py refuses `route`); route mode's code and tests land with
      SRV-SEARCH's route (defers).
    tests_planned:
      - "test_stages.py: stages.yaml with fact_check.source other than section (route included, until the route lands) is refused at load"
      - "with SRV-SEARCH's route (defers): server/tests/pipeline/test_fact_source_db.py [db] with a fake find: section mode makes no find; route mode makes one find per item in notebook order with channel pipeline, route fact_check and line compile with the run id; the notebook keeps s<k> aliases and every cited span is rendered as its s<k> line; cards already cited are not repeated; other cards get r<k> in first-seen order; a fact report naming s<k> and r<k> aliases expands both; no context prefix in the rendered source; an unrendered s<k> in the report is forced as not in the source; the budget passed to each fake find equals floor((source_max_chars − rendered chars so far) / (2.0 × items still to be asked)), and after an item skipped below budget_min the next budget is computed with that item no longer counted; an empty-text item gets no find and its unsupported verdict fails the check; the query passed is the NFC-trimmed text cut to 1,000 characters (a 1,000-character claim passes whole, a 1,001-character claim loses its last character); judge_ctx equals {line compile, run_id, run_cap_usd, lesson_id, daily_budget_usd}; a degraded find (degraded true, from a judge skip and from a failed embed) leaves budget_refused null and makes the step rerun on a recompile; a gate-skipped find (judge_skip gate, judge_ran false, degraded false) is reused; reuse in route mode makes no find"
      - "with SRV-SEARCH's route (defers): test_fact_source_db.py, the incomplete-evidence rule on all three branches, each with model verdicts unsupported, supported and contradicted: (a) guard cut, (b) deadline (a fake clock past fact_find_phase_s, checked before each find), and a route-mode fact_check whose run is cancelled between the find phase and the model call makes no model call, (c) budget below budget_min; in each branch unsupported → source_too_large, supported and contradicted stand, the check passes on source_too_large and findings adds a blocking source_too_large cell"
      - "with SRV-SEARCH's route (defers): a [unit] test that bounds.fact_find_phase_s equals stage_job_timeout_s − SRV-AGENT proxy_upstream_timeout_s − 50, and the pipeline reads budget_min from SRV-SEARCH policy (400)"
  - id: FR-PIPELINE-27
    text: >-
      **Admiralty credibility** (ADR-0039 owner decision 12; VEC-PIPELINE-6). After FR-PIPELINE-4's validation and
      forcing, code constrains each item's credibility to its verdict: `supported` → 1–3, `unsupported` → 4 or 6,
      `contradicted` → 5; a value outside its verdict's set becomes 3, 6 and 5 respectively; 1 ("confirmed by
      independent sources") requires cited spans from at least two distinct materials, otherwise it becomes 2; in
      section mode the source is one material, so 1 is unreachable there. `source_too_large` → 6. The fact_check
      step writes its revision with each claim's, and each `changed` or `erratum` cell's, `credibility` set to that
      value (`stamp_credibility`); nothing else changes. Credibility does not change the check's outcome (the verdict
      does); it is the `credibility` facet of ADR-0039 B3 when SRV-KB turns claims into L4 findings.
    tests_planned:
      - "add to test_source_and_reports.py: stamp_credibility over VEC-PIPELINE-6"
      - "add to test_pipeline_db.py [db]: the fact_check step's revision differs from its input only in credibility fields, present on every claim and every changed and erratum cell"

invariants:
  - id: INV-PIPELINE-1
    text: >-
      For any sequence of stage results (VEC-PIPELINE-2 and generated ones), a run never starts a model step whose reserve
      would exceed a cap, never runs more than `max_revise_loops` loops, and ends in exactly one derived terminal state
      with every unresolved problem present as an `open` cell (property test with a fake provider). **Replaced by
      ADR-0039 (in force 2026-11-26): `revisions` → INV-PIPELINE-1.**
  - id: INV-PIPELINE-2
    text: >-
      A model step never calls the provider when a completed step of the same lesson has the same `input_sha256`, in this
      run or an earlier one; a step job never calls it again after it succeeded (SRV-EVENTS INV-EVENTS-3). **Revised
      by ADR-0039 (in force 2026-11-26): `revisions` → INV-PIPELINE-2.**
  - id: INV-PIPELINE-3
    text: >-
      Every span citation in a stored revision names a span of the lesson's source, with page and title taken from
      that span. **Revised by ADR-0039 (in force 2026-11-26): `revisions` → INV-PIPELINE-3.**
  - id: INV-PIPELINE-4
    text: No log line contains source text, a prompt, model output or a claim text (canary test); only ids, stage names, costs and counts.
  - id: INV-PIPELINE-5
    text: >-
      The final revision of a finished run always equals the deterministic deltas applied to its last model-written
      revision (G2 (d)). **Revised by ADR-0039 (in force 2026-11-26): `revisions` → INV-PIPELINE-5.**

nfr:
  - id: NFR-PIPELINE-1
    metric: wall time of one L02 compile from run creation to its terminal state, with up to 3 loops, minutes
    threshold: 45            # ADR-0005/roadmap criterion; was "with one loop", measured 8.3–9.4 min (REF-PIPELINE-2);
                             # ADR-0039 revision: the estimate in `revisions` → NFR-PIPELINE-1
    verified_by: bench

