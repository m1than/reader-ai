# ---- ADR-0039 revision (V.kl-pipeline-checks, 2026-11-26): approved by the owner, promoted 2026-11-27 ----
#
# Promotion and Green notes (2026-11-27):
#   - prompt_version stays v1 (VEC-PIPELINE-1 below said v2): the prompt files are edited in place, and FR-PIPELINE-3's
#     input_sha256 hashes their content, so every prompt change is still a new input; bumping the version would also
#     have changed SRV-OBS's prompt registry paths (VEC-OBS-4) for no behavioural gain.
#   - Route mode of FR-PIPELINE-26 is not built: stages.py loads only `section` and refuses `route`; the route-mode
#     clauses of FR-PIPELINE-23, -26, INV-PIPELINE-2, -3 and VEC-PIPELINE-5, with their tests_planned, land with
#     SRV-SEARCH's fact-check route (defers). Reports carry `planned_judge_usd: "0"` in section mode.
#   - FR-PIPELINE-20 (a)'s audit row: action `compile.cancel`, actor `DEPLOY_ACTOR` = the nil UUID, detail
#     {lesson_id} (SRV-EVENTS FR-EVENTS-30's allowed key; no audit-table change).
#   - Lab verification is never reused (as approved); rules steps are (FR-PIPELINE-5 revised).
#   - The findings step's input_sha256 also hashes the run's `budget_refused` code: a stale findings job (enqueued
#     while the recorded decision admitted a loop, FR-PIPELINE-5) returns without effect but completes its job key,
#     so the findings of a later refusal at the same step must have another key (test_loop_rule_db.py pins it).
#   - FR-PIPELINE-13's example task budgets (D6) are OPS-DEPLOY's deploy/reader.example.yaml change, listed for its
#     task; the live check asserts the effective budgets of the stack it runs against.
#   - Paired SRV-LESSON schema change made here (its header note); WEB-UI FR-UI-15 labels, OPS-DEPLOY example budgets
#     (D6), SRV-OBS SPEC_CODES and OPS-SANDBOX's import test are listed for their own tasks.
#
# Source: ADR-0039 (accepted 2026-11-26), owner decisions 18 and 22, its ADR-0005 and ADR-0009 Amends rows and its
# Rework row "Pipeline check order, loops, the cap rule, fact-check route, credibility" (FR-PIPELINE-4, -5, -6, -8;
# NFR-PIPELINE-1; VEC-PIPELINE-1, -2; INV-PIPELINE-1, -2, -3, -5); docs/plans/adr-0039-execution.md
# "V.kl-pipeline-checks". Each item below replaces the approved text of its id (or joins `requirements`,
# `invariants`, `vectors`) only together with its tests (H2), after deep-reviewer approval (complex area: the compile
# pipeline's verification stages and cost math) and after the owner accepts the re-measured compile cost per lesson
# (plan, owner gates). (Historical: the draft's gate; met 2026-11-26, see the Promotion notes above.)
# Not in the Rework table, but changed by the new order and stated so the review sees them: FR-PIPELINE-3 (the revise
# input, the fact-check prompt), FR-PIPELINE-9 (`labs_unverifiable` moves to the rule check), FR-PIPELINE-10 (rule and
# lab findings, checks not run), FR-PIPELINE-13 (task budgets for four calls per task), FR-PIPELINE-20 (old-order
# runs at deploy), VEC-PIPELINE-5 (route cards).
#
# What it replaces in approved text: the header's "Loops" bullet (at most 1 revise loop, the measured deviation);
# `bounds.max_revise_loops`; the defers "More revise loops" and "Independent expected values for labs" (both removed
# at promotion). The $8 cap stays (`bounds.run_cap_usd`); ADR-0039's ADR-0005 row makes ADR-0005's $4.35 a target the
# run status reports against, not a stop. The ADR-0005 owner note stays.
#
# Decisions taken here (for the review):
#   D1 The lab's independent reference path (ADR-0009 stage 5) is built AT DRAFT TIME, by the drafter (and the
#      reviser), as data on each lab cell (`reference`, FR-PIPELINE-25), not in lab verification. Lab verification
#      stays model-free (sandbox runs only), so no model call verifies before claim support (decision 18). The rule
#      check pins that a reference is declared and resolvable; the adversarial review, last, judges whether it is
#      independent of the drafter's own computation.
#   D2 The four failures are: a rule failure, a failing lab, an unsupported or contradicted verdict, a blocking review
#      finding. Each sends the run to `revise` and counts as one loop (decision 22). After `bounds.max_loops` (3)
#      loops the next failure is the fourth and stops the lesson (ADR-0009: "the fourth failure stops the lesson and
#      asks the owner"). Until notifications exist (SRV-NOTIFY), the run status is that ask: the owner sees
#      `stop: loop_limit` in the run status and the open-runs list.
#   D3 A loop that SRV-AGENT `loop_fits_limit` refuses does not start: the run sets `budget_refused` to `loop_cap_run`,
#      `loop_cap_task` or `loop_cap_month` (the limit that refused), so FR-PIPELINE-6 derives `budget_exhausted` and
#      FR-PIPELINE-17 lists it, with no new column.
#   D4 The fact-check source is data, `fact_check.source: section | route` in stages.yaml. `section` (today's
#      whole-section fact-check over the lesson's own spans) is the fallback and the default until SRV-SEARCH's
#      fact-check route lands AND retrieval-ablation's fact-check comparison passes ADR-0039 B10's rule; the switch
#      is a one-line data change that cites that RESULT.md (FR-PIPELINE-26).
#   D5 Admiralty credibility is the fact_check model's value per report item, constrained to its verdict by code
#      (VEC-PIPELINE-6) and stamped on the claim by code, like `verified` on labs; the model never writes it into a
#      notebook (FR-PIPELINE-27).
#   D6 Task budgets: the example `budget_usd_per_lesson` of each compile task (draft, fact_check, review, and
#      `judge.find`) equals `bounds.run_cap_usd`. The reordered stages have no measured floors yet, so per-task
#      sizes would be guesses; with cap-sized task budgets the run cap, the loop rule and FR-AGENT-9 per call are the
#      bound, and the live check records spend per task for the owner to lower them (FR-PIPELINE-13).
#   D7 "Schema" in ADR-0039's first check is the parse-time gate that already exists: an output that does not parse
#      or fails SRV-LESSON's schema is `output_invalid`, a transient retry of the same call (FR-PIPELINE-3,
#      FR-AGENT-10), because a revision must validate before it is written (SRV-LESSON FR-LESSON-1), so there is no
#      notebook to send back. It is not counted as a loop. Everything checkable on a valid notebook with 0 calls is
#      the rule check (FR-PIPELINE-24) and counts.
#   D6 and D7 are also owner-confirm choices (proposed_owner_notes).
#
# Stale approved text to fix at promotion (it contradicts the revision; changed in the same promotion commit):
#   - `title` ("one revise loop") and the header's first paragraph (draft → fact-check → review → at most one revise
#     loop → findings → lab verification);
#   - the header bullets "Loops" (1 loop, the measured deviation) and "Source" ("Search (SRV-SEARCH) is not a
#     dependency": it becomes one in route mode, FR-PIPELINE-26);
#   - `bounds.max_revise_loops` (→ `max_loops`); `errors` gains the proposed codes; the defers "More revise loops"
#     and "Independent expected values for labs"; the owner note "With one loop the measured outcome is open findings";
#   - FR-PIPELINE-11's status body (gains `loops`, `stop`, `refused_limit`, `target_usd`);
#     FR-PIPELINE-17's list states (budget_exhausted now includes the loop_cap codes); `tables.compile_runs` gains
#     `order_version` (proposed_tables).
# Deploy: every run still open under the old order when this revision is deployed is cancelled at worker start
# (FR-PIPELINE-20 revised), so no run mixes the orders.
#
# Cost (ADR-0039 ADR-0005 row; estimates, not bounds): at today's floors a first pass is $1.39 and each loop $1.66,
# three loops about $6.37 per lesson. The measured L02 loop (revise + fact-check + review) cost $1.475–1.634 and took
# 312–314 s (REF-PIPELINE-2). The bound is the run cap through the loop rule (FR-PIPELINE-23) and FR-AGENT-9 per call.
#
# Paired changes (each in its own spec):
#   - SRV-LESSON: claim objects and `changed` / `erratum` cells gain optional `credibility` (integer 1–6, written by
#     code only, like `verified`); lab cells gain optional `reference` (FR-PIPELINE-25's shape, with `span` a span id
#     of the `span_ref` pattern, never an alias; optional so that stored revisions stay valid, required by the rule
#     check); the provenance stage enum and `finding.stage` gain `rules`; G2 deferred item (c) reads the four check
#     records of FR-PIPELINE-8 (c) revised. Sequencing: that SRV-LESSON change is approved and merged before this
#     revision's Green, since a revision carrying `credibility` or `reference` fails today's schema.
#   - WEB-UI (FR-UI-15): a stage label for `rules`, and copy for `stop` (`loop_limit`: stopped after 3 loops, the
#     owner decides; the loop_cap codes: which limit refused) in the owner's list and run view.
#   - SRV-SEARCH (V.kl-search-find): `find` (FR-SEARCH-22) callable from a worker job on channel `pipeline` with
#     `question_type: fact_check` and the caller's `judge_ctx` {line: compile, run_id, run_cap_usd, lesson_id,
#     daily_budget_usd}, so a judge call is spent on the compile run (SRV-AGENT FR-AGENT-9 (d)); policy `budget_min`
#     (400) and the pipeline channel's budget maximum (150,000 tokens = source_max_chars / 2.0); a call-free read of
#     the current `brain_version` and `policy_version`. The response's `degraded` is true iff the embed call failed
#     or `judge_skip` ∈ {timeout, error, budget, saturated, quota_refused, no_provider}, and false for `gate` (the
#     coordinator adds this definition to SRV-SEARCH). Until it lands, `fact_check.source` stays `section`.
#   - SRV-AGENT: `reserve_for` (FR-AGENT-6) and `loop_fits_limit(...) -> None | "run" | "task" | "month"` (FR-AGENT-23,
#     the first limit the planned sum crosses), both approved and merged in V/slice-integration; used as written.
#   - OPS-DEPLOY: deploy/reader.example.yaml task budgets per D6, including `tasks."judge.find".budget_usd_per_lesson`.
#   - SRV-FRESH: no change. The ADR-0030 freshness check keeps its place beside fact-check (ADR-0039 ADR-0009 row): it
#     is not one of the four checks, never counts as a loop and spends on the `freshness` line; FR-PIPELINE-7's slice
#     rule for `changed` cells and URL citations stays.
#   - SRV-OBS: `reader.obs.attributes.SPEC_CODES` gains `loop_cap_run`, `loop_cap_task`, `loop_cap_month` (its
#     catalogue test reads `errors`). `verify.lab`, `verify.claims`, `fact_check.passed` and `verify.lab_passed` (FR-OBS-13, -14) fire once
#     per check run inside the sequence; tests/pipeline/test_pipeline_obs_db.py, traced to SRV-OBS, changes its
#     expected stage order, so SRV-OBS carries a one-line paired note with it (H2).
#   - OPS-SANDBOX: every module named in `reference_libraries` imports in the kernel image ([image] test); a
#     package outside the standard library is added to sandbox/requirements.lock first.

# The route-mode fact-check source is bounded by `bounds.source_max_chars` (300,000; ADR-0039 B8's channel table: the
# pipeline channel's budget is the stage's own context budget, FR-PIPELINE-2), and loop_fits_limit plans the
# route-mode fact_check prompt at that size. Bounds, errors, tables and owner notes of this revision are merged into
# their sections above (`max_loops`, `fact_find_phase_s`, the `loop_cap_*` errors, `compile_runs.order_version`).
#
# `revisions`: the revised text of approved ids, in force (owner-approved 2026-11-26). Each entry wins where it differs
# from the entry of the same id above, which carries a pointer here; the tests listed trace the id.
revisions:
  - id: FR-PIPELINE-20
    text: >-
      Cancel a run, as approved, plus **the order change at deploy.** Migration `pipeline_0006` adds
      `compile_runs.order_version` (proposed_tables). The cancel at worker start does not depend on a v1 run's
      derived state. (a) At worker start, in the pipeline kind module's `on_worker_start` and before FR-PIPELINE-6's
      `ensure` of unfinished runs, one transaction cancels every open v1 run: `UPDATE compile_runs SET cancelled_at =
      now(), finished_at = now(), ends = least(ends + 1, 100) WHERE finished_at IS NULL AND cancelled_at IS NULL AND
      order_version = 1 RETURNING id, ends, lesson_id, owner_id`, whatever its jobs' state (queued, dead or none;
      the start sweep has already settled jobs of a dead worker), and in the same transaction writes one audit row
      per returned run, action `compile.cancel`, actor `DEPLOY_ACTOR` (the nil UUID, which no user has; it marks the
      deploy as the actor), detail `{lesson_id}` (SRV-EVENTS FR-EVENTS-30's allowed key); after that commit, one
      `obs.runs` end per returned row (its `ends` as `end`) is enqueued as FR-PIPELINE-18 does (its enqueue-failure
      rule unchanged). A second start returns no row and does nothing. (b) Read (1) of the step handler (above) also returns without effect when
      the run's `order_version` is 1, so a v1 job still queued after (a) reserves, calls and writes nothing. (c) A
      v1 run that finished before the deploy derives its state by the approved FR-PIPELINE-6 rule (`budget_refused`,
      else `g2.blocking_open`), with `stop` and `refused_limit` null and `loops` as stored. A cancelled v1 run is
      `cancelled` as approved; the owner compiles the lesson again as a new (v2) run.
    tests_planned:
      - "add server/tests/pipeline/test_legacy_order_db.py [db]: migration pipeline_0006 gives existing rows order_version 1 and new runs 2, and its downgrade drops the column; at on_worker_start an open v1 run with a queued job, one with a dead job and one with no job are each cancelled (cancelled_at, finished_at set, ends + 1, capped at 100) with exactly one obs.runs end enqueued after commit per run and one audit row compile.cancel with the nil-UUID actor and {lesson_id}; a queued v1 job run afterwards writes no reserve row, revision or compile_steps row; a finished v1 run derives the same state as under the approved rule, with stop null; a second worker start changes nothing; open v2 runs are untouched"
  - id: FR-PIPELINE-3
    text: >-
      As approved, with three changes. (a) `revise`'s user prompt carries the current notebook and the report of the
      check that failed (the rule, lab, fact or review report, FR-PIPELINE-5), not the last fact and review reports.
      (b) The fact_check stage's system prompt carries the fact-check source of FR-PIPELINE-26 (the lesson's source,
      or the route's cards) in the same delimiter, and its `input_sha256` is FR-PIPELINE-26's. (c) A `credibility`
      the model writes on a claim or cell is dropped like `provenance` and `verified` (only code writes it,
      FR-PIPELINE-27); a lab's `reference` is the drafter's and is kept (FR-PIPELINE-25).
    tests_planned:
      - "change server/tests/pipeline/test_source_and_reports.py: the revise prompt holds the failing check's report and no other report; a model-written credibility is dropped; a model-written lab reference is kept"
  - id: FR-PIPELINE-4
    text: >-
      Report schemas (VEC-PIPELINE-4, VEC-PIPELINE-6). Fact report: as approved, and every item carries
      `credibility`, an integer 1–6 (Admiralty information credibility); a missing or out-of-range value is
      `output_invalid`. After validation and the forced verdicts (FR-PIPELINE-4, -7), code constrains credibility
      to the verdict (FR-PIPELINE-27). In route mode the item's `spans` are `s<k>` aliases of the lesson's spans
      or `r<k>` aliases of the route's cards (FR-PIPELINE-26), both expanded to span ids in the stored report; an
      item judged without its full route evidence gets, by code, the outcome `source_too_large` instead of the
      model's verdict only when that verdict is `unsupported` (FR-PIPELINE-26's one rule). Review report: as approved. Rule report
      (FR-PIPELINE-24): `{failures: [{rule, cell|null, claim|null, text}]}`, written by code. Lab report: as
      FR-PIPELINE-9. Each check's outcome: the rule check fails iff `failures` is non-empty; lab verification iff a
      lab failed; fact_check iff a verdict is `unsupported` or `contradicted` after forcing (`source_too_large` does
      not fail it: a revise cannot fix a search limit; FR-PIPELINE-10 turns it into an open cell); the review iff a
      finding is blocking. All reports cap at `bounds.items_max_per_report` and are stored on their `compile_steps` row with
      the notebook sha256 they judged.
    tests_planned:
      - "change spec/fixtures/SRV-PIPELINE/verdicts.yaml and test_source_and_reports.py: every report item carries credibility; missing, 0, 7 and a non-integer credibility → output_invalid"
      - "add to test_source_and_reports.py: the outcome function per report kind (fails iff the rule above)"
  - id: FR-PIPELINE-5
    text: >-
      Steps and check order (VEC-PIPELINE-1, -2; ADR-0039 decisions 18 and 22). A run executes `draft`, then the
      checks of `order.checks` = [`rules`, `lab_verification`, `fact_check`, `adversarial_review`], cheapest first,
      each on the notebook the previous check passed (lab verification's stamped revision for fact_check, the
      credibility-stamped revision for the review). The first check that fails ends the pass: if `loops` <
      `bounds.max_loops` and the loop rule (FR-PIPELINE-23) admits a loop, the run executes `revise` (`loops` + 1)
      and the checks again from `rules`; if `loops` = `bounds.max_loops`, that failure is the fourth and the run
      stops with `stop: loop_limit`; if the loop rule refuses, the run stops with the `loop_cap_*` code of D3. When
      all four pass, the run stops with `stop: passed`. Every return to `revise` counts as one loop, a rule failure
      included. After any stop the run executes `findings`, its last step, whenever a notebook exists. Each step is
      one job as approved (`rules`, `fact_check`, `adversarial_review`, `revise`, `findings` of kind
      `pipeline.stage`; `lab_verification` of kind `pipeline.verify` with `bounds.verify_job_timeout_s`). Reuse by
      `input_sha256` as approved, for `rules` too (its input is FR-PIPELINE-24's); a `fact_check` step that recorded
      a find response with `degraded: true` (FR-PIPELINE-26) is never reused; one whose finds only skipped the judge
      at the gate (`judge_ran: false`, `degraded: false`) is reused as usual. A budget refusal before a model step
      (SRV-AGENT FR-AGENT-9) sets `budget_refused`; the run then executes `findings` only, or, when the refusal
      came before any notebook exists (the draft), finishes directly as `budget_exhausted` with no `findings`.
      **Stale steps.** Any model step (`draft`, `revise`, `fact_check`, `adversarial_review`) whose run has
      `budget_refused` set when its handler starts returns without effect: no reservation, no call, no revision, no
      `compile_steps` row (the read is FR-PIPELINE-20's read (1), extended to `budget_refused` and to
      `order_version` 1; a route-mode `fact_check` makes that read before its find phase and again before its model
      call); for `budget_refused` it enqueues `findings` before returning (nothing before any notebook exists).
      **A refusal wins over `next`:** when `budget_refused` is set, the run's next step is `findings` (none before
      any notebook exists) whatever `next` is recorded, for `ensure`, for FR-PIPELINE-6's derivation and for a stale
      model step. A `findings` job
      returns without effect when the run's recorded decision admitted a loop (the last check's report has `next:
      revise`) and neither a refusal nor `loop_limit` is recorded after it. Each check's report carries the
      decision as a named field, `next: revise | findings | <the next check>`, with `stop` (`passed`, `loop_limit`,
      `loop_cap`) when it is `findings`. A model step refused for budget writes no `compile_steps` row: it commits
      `budget_refused` and enqueues `findings` (or finishes the run, before any notebook), and FR-PIPELINE-6 derives
      `stop: budget_refused` from the column. The handler of a check writes its `compile_steps` row (with that report)
      and the loop decision (`loops` + 1, or `budget_refused`) in one transaction; the enqueue
      of the next step follows SRV-EVENTS FR-EVENTS-3 (its own commit, before the handler returns), as approved.
      `ensure` and a handler that finds its step already recorded re-enqueue the recorded `next` without calling
      `loop_fits_limit` again.
      One run per lesson at a time (`compile_running`). The SRV-OBS tracing of the approved text is unchanged, per
      check run.
    tests_planned:
      - "change server/tests/pipeline/test_stages.py: next_stage over the revised VEC-PIPELINE-2, including four-checks-fail-once (stops at the fourth failure with loops 3), rule-failure-counts, fourth-failure-at-rules, budget-stops-before-draft and the loop_cap cases"
      - "change server/tests/pipeline/test_pipeline_db.py: the revised VEC-PIPELINE-2 end to end with a fake provider, a fake kernel and a fake loop_fits_limit; a rule failure loops back with no provider call before revise; budget refusal mid-loop (budget-refused-mid-loop) runs findings only and the refused step writes no compile_steps row; a refusal at draft finishes budget_exhausted with no findings step"
      - "add to test_loop_rule_db.py [db], the stale-revise sequence: a revise job enqueued, then budget_refused set by a concurrent refusal, then the revise job runs → no reserve row, no revision, no compile_steps row; a check whose transaction fails after the loop decision leaves neither the row nor loops + 1; ensure on a run whose recorded decision admitted a loop re-enqueues revise with loop_fits_limit not called (the fake counts calls); a stale findings job enqueued while the recorded decision admits a loop (no refusal, no loop_limit) returns without effect: no open cell, no G2, no finish; a model step refused for budget whose findings enqueue is lost: ensure enqueues findings, not the refused step, and calls no loop_fits_limit"
