defers:
  - "Publish (gate G2) as an owner action, with an immutable published revision and no override (ADR-0009 stage 7)."
  - "Plan generation (ADR-0009 stage 2) by an agent; the slice imports the owner's committed plan, and (amendment, draft) SRV-PLAN's deterministic plan from the study-time form."
  - "Web fact-checking of `changed` cells and URL citations (separate web-fetch proxy, ADR-0025 rule 5)."
  - "Parallel finds in route mode (the judge lane runs 4 at once) if NFR-PIPELINE-1 is threatened."
  - "A measured floor per reordered stage, from the stage live check."
  - "How often lab references fail, measured on the first lab-bearing lesson (L02 has no labs)."
  - "FR-PIPELINE-26's route mode (`fact_check.source: route`): its code and the route-mode tests planned in FR-PIPELINE-23, -26, INV-PIPELINE-2, -3 and VEC-PIPELINE-5 land with SRV-SEARCH's fact-check route (V.kl-search-find) and the retrieval-ablation decision; until then stages.yaml refuses `route`."
  - "Prompt caching levers (TTL choice and measured savings); reserves assume no cache sharing."
  - "WEB-AUTHORING (trigger, progress and G2 in the browser); the slice uses the routes."
  - "A `fresh` flag on the compile route that skips cross-run reuse (FR-PIPELINE-5), for a recompile meant to resample the model."
  - "Raising `source_max_chars` beyond L02 use: the 300,000-character bound is applied to L02 only until a chapter of that size is measured."

owner_notes:
  - "Declared deviation from ADR-0005: 23 lessons × $8.00 = $184, above ADR-0005's $100 for the course. The $200 monthly budget (budgets.monthly_usd) is the remaining guard; an ADR-0005 amendment (status proposed) is drafted when the full pipeline lands with measured per-lesson costs."
  - "A compile is capped at your $8.00 compile_cap_usd and runs under your $30 test budget (budget.test_budget_usd, approved 2026-11-22), which covers live L02 compiles without further consent; every spend goes to the ledger. The spike measured $2.4–3.0 for one loop on L02 without span ids; a recompile reuses unchanged steps and spends only where inputs changed."
  - "Your choice to confirm (D6): each compile task's example budget (draft, fact_check, review, judge.find) equals the $8 run cap, so only the run cap, the loop rule and the per-call reserve stop a compile; the live check reports spend per task so you can lower them."
  - "Your choice to confirm (D7): a model output that does not parse or fails the notebook schema is retried as the same call (up to 3 attempts) and does not count as one of the 3 loops; only checks on a valid notebook count."
  - "A lesson stopped after its fourth failure shows `stop: loop_limit` in the compile status; until notifications exist, that status is the question to you."
  - "At the deploy of this revision, every compile started under the old order (draft → fact-check → review → 1 loop) that has not finished — running, waiting or stopped on an error — is cancelled when the worker starts. Finished compiles keep their results. Each cancelled lesson needs a new compile under the new order, about $1.39 (one clean pass at today's floors, an estimate) up to the $8 cap."
  - "L01 vs L02 (compile-cost ask b): the slice compiles L02 as the roadmap says; L01 (larger) is measured when the full pipeline lands."

