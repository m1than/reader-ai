# Numbers used below, each with its kind. "structural" = chosen to bound behaviour, with the reason; not measured.
bounds:
  - { name: heartbeat interval, value: "10 s", kind: "library default (REF-EVENTS-3), not tuned" }
  - { name: stalled after, value: "30 s without heartbeat", kind: "library default (REF-EVENTS-3), not tuned" }
  - { name: sweep period, value: "every minute, plus once at worker start", kind: "structural: cron granularity" }
  - { name: reconcile age, value: "job_keys.updated_at older than 60 s", kind: "structural: far above the milliseconds between FR-EVENTS-3's key commit and its defer, so the sweep never races a live enqueue" }
  - { name: recovery bound, value: "≤ max over kinds of timeout_s + 60 s + 30 s", kind: "derived: a killed worker is stalled after 30 s; the next sweep runs within 60 s; a sweep that finds the key lock held skips the key that round, and the live holder ends within its kind's timeout_s, so a later sweep (within 60 s) takes it. Holds for a worker restarted within 30 s too (the old worker id still goes stale). Does not hold when a dead session's connection is not closed by the kernel (network partition, frozen VM): the lock then stays until Postgres drops the connection" }
  - { name: default max_attempts (counted runs per key), value: 3, kind: "structural: retries are for transient faults only (FR-EVENTS-6); a deterministic failure retried more only repeats spend (compile-cost spike: 0 of 2 runs converged)" }
  - { name: retry delays, value: "5 s after the 1st counted failure, 25 s after the 2nd", kind: "structural: two retries span about 30 s; SRV-AGENT replaces them with the provider's Retry-After" }
  - { name: worker concurrency, value: 1, kind: "structural: ADR-0006 load profile < 1 job/s; one compile stage at a time keeps spend serial against budget.live_runs_usd" }
  - { name: shutdown_graceful_timeout, value: "8 s", kind: "structural: below Compose's 10 s stop timeout (REF-EVENTS-7), so procrastinate aborts the job and records it before SIGKILL" }
  - { name: start hook timeout (HOOK_TIMEOUT_S), value: "30 s per hook", kind: "structural: a start hook only enqueues (FR-EVENTS-1), milliseconds per key. Limit: a hook that needs more than 30 s is cancelled on every start, so it never completes; such work belongs in a job, not a hook" }

requirements:
  - id: FR-EVENTS-1
    text: >-
      Job kinds are declared as data: a `JobKind` record has `name` (`^[a-z][a-z0-9_.]{2,63}$`), `queue`, `args`
      (a Pydantic model with `extra="forbid"`), `key` (the ordered list of `args` field names that form the
      idempotency key), `max_attempts` (≥ 1 counted runs per key), `transient` (a tuple of exception types),
      `timeout_s`, and `priority` (an int, default 0; amended 2026-11-23 for SRV-TUTOR): every defer of the kind —
      first enqueue, retry, requeue and sweep re-enqueue alike — passes it to procrastinate as the job's priority, and
      the worker fetches higher-priority `todo` jobs first (procrastinate orders by priority, then id), so a short
      interactive kind runs before queued jobs of lower priority, never in the middle of a running one. The worker
      serves the `Catalog` that `reader.jobs.catalog.load_kinds()` builds from the declared module list
      `KIND_MODULES` (each module exports `JOB_KINDS`; SRV-INGEST, SRV-SEARCH, SRV-PIPELINE and SRV-TUTOR add
      theirs; integrated order on V/slice-integration: ingest, search, pipeline, tutor, giving kinds `ingest.import`,
      `search.embed`, `pipeline.stage`, `pipeline.verify`, `tutor.answer`; SRV-FRESH, paired change 2026-11-23,
      appends `reader.freshness.jobs` with `freshness.scan` and `freshness.web`). Paired SRV-AGENT/SRV-PIPELINE amendment:
      a handler may
      (a) append spend rows through SRV-AGENT's ledger, which opens its own connection and commits at once (append-only,
      never an outcome effect, so a rolled-back run still records its spend), and (b) enqueue through
      `reader.jobs.running()`, the worker's `Jobs` (FR-EVENTS-3 commits independently of the run's transaction); a kind
      module may export `on_worker_start(jobs)`. `worker.run`'s `hooks` argument is the list of start hooks (None
      means every declared module's `on_worker_start`, `reader.jobs.catalog.start_hooks()`; tests pass their own),
      independent of `catalog`. Each hook is awaited exactly once, in order, after the start sweep and with
      `running()` already returning the worker's `Jobs`. A hook must be idempotent and may only enqueue (through
      the `Jobs` it gets); it holds no lock and writes no key state. Hook failure is isolated: a hook that raises or
      overruns `HOOK_TIMEOUT_S` (30 s, a chosen bound: a hook only enqueues, which takes milliseconds per key) is
      logged with its module name only, and the next hook and the worker still run. Outside a running `worker.run`
      (before it, after it returns, in the api) `running()` raises `JobError("no_worker")`; `run` clears it in its
      `finally`. Building
      a `Catalog` rejects a duplicate name (`kind_name_duplicate`), the reserved name `jobs.sweep`, an `args` model
      whose `model_config` does not set `extra="forbid"` (`kind_args_not_forbid`), a `key` field missing from
      `args`, a `priority` outside 0 ≤ priority < the sweep's 1,000,000 (`kind_bounds_invalid`), and an `args` model
      that fails FR-EVENTS-10 (a field typed `Secret` or any subclass of it). Handlers are `async` functions; blocking work runs in `asyncio.to_thread` and checks a
      cancellation flag between steps, because `timeout_s` cannot interrupt blocking synchronous code.
  - id: FR-EVENTS-2
    text: >-
      The idempotency key of a job is `sha256` over the canonical JSON (sorted keys, separators `,` and `:`,
      non-ASCII unescaped, encoded UTF-8) of the `key` fields' values, prefixed by the kind name: `<kind>:<hex64>`.
      For compile stages the fields are `(lesson, stage, input_sha256)` (ADR-0006).
  - id: FR-EVENTS-3
    text: >-
      `enqueue(kind, args, schedule_in=0)` never takes the key lock and never waits for one. It can wait only on an
      uncommitted write to the key's row, which every writer makes as its last statement before commit (FR-EVENTS-4,
      -6, -7, -8, -15), so the wait is bounded by one statement plus a commit. It runs FR-EVENTS-10's
      checks, validates `args`, then in one short transaction inserts the `job_keys` row with `ON CONFLICT DO NOTHING`
      and reads the key's outcome, and commits. With an outcome it returns `already_done(job_id)` (`succeeded`) or
      `dead(job_id)` (`dead`) and defers nothing. Otherwise it defers a procrastinate job with `queueing_lock` and
      `lock` both set to the key, `lock_mode` `ordered` and the given `schedule_in`, returning `queued(job_id)`, or
      `already_queued` when procrastinate raises `AlreadyEnqueued` (a `todo` job exists). The key row commits before
      the defer; a crash between the two leaves a key without a job, which the sweep defers (FR-EVENTS-15). Enqueue
      commits independently of any caller transaction. An outcome written after enqueue read none is caught by the
      worker, which re-checks under the key lock (FR-EVENTS-4).
  - id: FR-EVENTS-4
    text: >-
      A worker runs each job in one SQLAlchemy transaction (READ COMMITTED; its first statement is `SET LOCAL
      idle_in_transaction_session_timeout = 0`) that first takes the key lock, then reads the key row. Only
      `JobFailed` (or the cancellation of a shutdown abort) leaves the wrapper: any other failure of the wrapper or
      the database becomes `JobFailed("wrapper_error")` `from None`, and every rollback in it is guarded. When the
      run's own session is lost (its connection invalidated: a network cut, a terminated backend), the key lock
      went with it: the run is not judged by FR-EVENTS-6. The worker opens a fresh connection and takes the key
      lock; if this job is still `doing` and the key has no outcome, no sweep has counted the run, so it counts it
      itself like a stall (`error_code` `session_lost`; `dead` when exhausted, otherwise enqueued again through
      FR-EVENTS-3 at once); if the job is no longer `doing`, the sweep already counted it and nothing is done.
      Either way the run ends `JobFailed("session_lost")`. A `wrapper_error` is counted the same way (`error_code`
      `wrapper_error`). If the fresh connection fails too, nothing is counted by the worker: the job ends
      `failed` with no outcome and FR-EVENTS-15 counts it after 60 s. A deadline overrun that invalidated the
      session while cancelling a statement is still judged as `timeout`. With no `job_keys` row, the job is finished `failed`,
      logged with its job id, and gets no outcome. With any outcome, the job returns without calling the handler and
      procrastinate finishes it `succeeded`. Otherwise, if FR-EVENTS-14 says the key is exhausted, it writes `dead`
      (`error_code` `exhausted`). Otherwise the handler runs with that session under `asyncio.timeout(timeout_s)`,
      started after the lock is acquired, and the `succeeded` outcome is written by FR-EVENTS-13 in the same
      transaction as the handler's writes. The run transaction writes the `job_keys` row only in its final statement
      before commit (the outcome update), never earlier, so no uncommitted key-row write is held across the handler.
      The handler never commits, rolls back or opens a session. The outcome commits before procrastinate records the
      job's status.
  - id: FR-EVENTS-5
    text: >-
      A handler gets the validated `args` model, the session and a context with `job_id`, the key and the key's
      attempt count. Effects outside the database must be idempotent per key: blobs are written content-addressed
      (ADR-0007), so a repeated write is a no-op. Provider calls are not idempotent: a run that fails after a
      provider call, is lost to a stall, or is aborted by shutdown spends again on its next run. Counted runs are
      bounded by `max_attempts`; shutdown aborts are not counted (FR-EVENTS-14), so provider spend per key is not
      bounded by `max_attempts` when the worker is stopped repeatedly mid-run.
  - id: FR-EVENTS-6
    text: >-
      Retries are decided by this module alone. On a handler exception, the run's transaction rolls back; then, under
      the key lock in a new transaction, the worker increments the key's attempt count. A `transient` exception on a
      key FR-EVENTS-14 does not call exhausted: after that commit the worker enqueues the same key through
      FR-EVENTS-3 with `schedule_in` 5 s after the first counted failure and 25 s after the second (a fresh
      procrastinate job), then ends the current job `failed`. When that enqueue returns `already_queued` (another
      caller's `todo` job exists), the existing job runs as soon as this one ends, without the delay; attempts stay
      bounded because every run is counted by the same predicate. When that enqueue raises, the current job still
      ends `failed`, and the key (no outcome, no todo or doing job, newest job `failed`) takes FR-EVENTS-15's
      stall-like path after 60 s. A `timeout_s` overrun is decided by the run's own deadline only (the
      `asyncio.timeout` context's `expired()`), with `error_code` `timeout`; a `TimeoutError` the handler raises
      itself (a provider read timeout) is judged by `transient` like any other exception. Any other exception, a
      deadline overrun and a transient exception on an exhausted key write `dead` (`error_code` = the
      exception's class name, or `timeout`) in that transaction. In every case the wrapper raises a sanitized
      `JobFailed(error_code)` `from None`; procrastinate records `failed` and never retries, so neither procrastinate
      nor a log sees the original message, traceback locals or args.
  - id: FR-EVENTS-7
    text: >-
      Stalled jobs. The sweep runs once at worker start, outside the job slot, and then as the periodic job
      `jobs.sweep` every minute, with its own `queueing_lock` and the highest priority. For each job from
      `get_stalled_jobs()`: a stalled `jobs.sweep` job is finished `failed` with no outcome; a job whose `task_name`
      is not in the catalog takes `pg_try_advisory_xact_lock` on its `lock` (the key) like a known kind, is left
      alone when the lock is held (a live session, e.g. a worker of another version, runs it), and otherwise gets
      `dead` (`error_code` `unknown_kind`) when its key row exists and is finished `failed`.
      For a known kind it uses `pg_try_advisory_xact_lock` on the key: when the lock is held, a live session runs the
      key and the job is left alone this round. With the lock: if the key has an outcome, the job is finished
      (`succeeded` for `succeeded`, `failed` for `dead`); otherwise the attempt count is always incremented (a stall
      counts), and when the incremented count is exhausted by FR-EVENTS-14, `dead` (`error_code` `stalled`) is
      written in the same transaction, which then commits. In this order: commit the increment (with `dead` when
      exhausted), then (when not exhausted) enqueue the key through
      FR-EVENTS-3 at once, then finish the stalled job `failed`. The sweep never holds an uncommitted key-row write
      across an enqueue call.
  - id: FR-EVENTS-8
    text: >-
      `requeue_dead(kind, key)` takes `pg_try_advisory_xact_lock` on the key and never waits: when the lock is held it
      returns `running`. With the lock, when the outcome is `dead`, it clears the outcome columns, resets the attempt
      count to 0, commits, then enqueues through FR-EVENTS-3 and returns its result (`queued(job_id)`). A crash between
      the commit and the defer leaves a key with no outcome, no todo or doing job and the dead run's `failed` job as
      its newest; after 60 s the sweep treats it like a stall (FR-EVENTS-15): it counts one attempt and re-enqueues,
      so the gap costs one attempt. With `max_attempts = 1` that is the only attempt: the key goes `dead` with
      `error_code` `orphaned` and must be requeued again. When the key has no outcome it
      returns FR-EVENTS-3's result for the stored args (`already_queued` or `queued`). It returns `already_done(job_id)`
      for `succeeded` and `unknown_key` when no row exists. It is the only way out of `dead`.
  - id: FR-EVENTS-9
    text: >-
      `reader.jobs.worker.run(engine, target, stop, catalog=None, secret_values=(), hooks=None)` installs the log scrubber
      (FR-EVENTS-16) first, checks the database through `engine`, opens the procrastinate app on `reader.db`'s
      `DbTarget` (the password as a psycopg connect argument, never in a conninfo string), builds the runtime with
      every resolved secret the calling process holds (`secret_values` plus the database password; FR-EVENTS-10;
      `reader-server --role worker` passes the database password, the only secret it holds), runs the start
      sweep, then serves the
      queues of every kind in the catalog plus `jobs.sweep`, with `concurrency=1`,
      LISTEN/NOTIFY on and `shutdown_graceful_timeout=8`. On SIGTERM it stops fetching, waits up to 8 s, then
      procrastinate aborts the running job (status `aborted`; the job's transaction rolls back). It returns 0 after
      a stop and 1 when the database is unreachable at start or the start sweep fails (logged without detail;
      0 when `stop` is already set by then).
      `stop` is observed during the start sweep and the start hooks too: a stop there cancels the sweep or hook
      (any gap a cancelled sweep leaves is FR-EVENTS-15's, as after a crash) and `run` returns 0 without serving.
  - id: FR-EVENTS-10
    text: >-
      No job payload carries a secret. An `args` model must not contain a field of type `reader.config.Secret`, at any
      depth. `enqueue` rejects any value that is a `Secret` instance, and any payload with a string leaf or a mapping
      key (after JSON encoding and decoding of the validated model) that contains, as a substring, a resolved secret
      value held by
      the process's loaded settings. Resolved values are never empty (SRV-CONFIG rejects empty secrets); the check
      asserts that and skips an empty value defensively. Both rejections use error code `secret_in_payload` and carry
      no part of the value.
  - id: FR-EVENTS-11
    text: >-
      One Alembic revision under `server/src/reader/jobs/migrations/` with branch label `jobs`, `down_revision` None
      and `depends_on = "procrastinate_0043"` (the head shipped by procrastinate 3.12.0's `alembic` extra) creates
      one table, `job_keys(kind text, key text, args jsonb not null, attempts int not null default 0, outcome text
      null check in ('succeeded','dead'), error_code text null, job_id bigint null, created_at timestamptz,
      updated_at timestamptz, finished_at timestamptz null, primary key (kind, key))`, with a partial index on
      `updated_at` where `outcome is null`. `outcome`, `error_code`, `job_id` and `finished_at` are set together.
      Every write sets `updated_at`. Its downgrade drops `job_keys` only. procrastinate's own schema comes from its
      shipped revisions; downgrading them is declared unsupported.
  - id: FR-EVENTS-12
    text: >-
      `job_status(kind, key)` returns one of `none`, `queued`, `running`, `succeeded`, `dead` from the key's outcome
      first and otherwise from its deciding procrastinate job, by VEC-EVENTS-3. The deciding job is a `doing` job if
      one exists (`aborting`, legacy, counts as `doing`), else a `todo` job, else the newest job by id.
  # Paired amendment (2026-11-23, V/compile-ui, for SRV-PIPELINE FR-PIPELINE-16; coordinator after review round 2).
  - id: FR-EVENTS-17
    text: >-
      **Dead error code.** `reader.jobs.queue.dead_error_code_of(conn, kind_name, key) -> str | None`, next to
      `job_status_of` and like it a read on an open connection without a procrastinate app, returns the key row's
      `error_code` when its outcome is `dead`, and None when the key has no row or another outcome. It is the
      published read of that column (FR-EVENTS-6 writes it: the exception's class name, `timeout`, `exhausted`,
      `stalled`, `orphaned` or `unknown_kind`); no module queries `job_keys` directly. [db]
      server/tests/jobs/test_dead_error_code_db.py: no row, queued, succeeded (None); dead from a permanent
      exception (its class name); dead from transient exhaustion (the transient class name); after `requeue_dead`
      (None).
  - id: FR-EVENTS-13
    text: >-
      Key lock and outcome writes. `lock_id(key)` is the first 8 bytes of `sha256("reader.jobs\0" + key)` read as a
      signed big-endian int64, used with the one-bigint advisory lock form; other modules' advisory locks (SRV-AUTH's
      migration lock included) use a different namespace string or the two-int4 form (REF-EVENTS-6). A collision
      only serializes two keys. Every outcome write runs under the key lock and is `UPDATE job_keys SET outcome = …
      WHERE kind = … AND key = … AND outcome IS NULL`; the first committed outcome wins. A writer whose update
      affects no row rolls back its whole transaction (a handler's effects included) and logs `outcome_lost` with the
      winning outcome.
  - id: FR-EVENTS-14
    text: >-
      The attempt predicate, the only one used by FR-EVENTS-4, -6 and -7: a key is exhausted when
      `job_keys.attempts >= kind.max_attempts`. The count is per key, so a new procrastinate job for the key does not
      reset it; only `requeue_dead` does. Counted: handler failures, timeouts and stalls. Not counted: shutdown aborts
      and cancellations, which are the operator's action, not the job's. Stalls count because a job can cause its
      own stall (out of memory, a crash in native code), and not counting them would rerun such a job forever. Two
      sweeps, or a sweep and a crashed worker's own increment, can count one lost run twice; this errs toward `dead`
      sooner, never toward an extra run.
  - id: FR-EVENTS-15
    text: >-
      Reconciliation, per key. Each sweep enumerates `job_keys` rows with no outcome, `updated_at` older than 60 s,
      and no `todo` or `doing` procrastinate job, and for each takes `pg_try_advisory_xact_lock` (skipping the key when
      held) and looks only at the key's newest procrastinate job (max id):
      none (a crash between FR-EVENTS-3's key commit and its defer) or `aborted`: enqueue through FR-EVENTS-3 without
      counting an attempt;
      `failed` or `succeeded` (a lost re-enqueue in FR-EVENTS-6, or `requeue_dead`'s crash gap): treated like a stall,
      the uniform rule: always increment the attempt count, and when the incremented count is exhausted by
      FR-EVENTS-14, write `dead` with `error_code` `orphaned` in the same transaction; commit; then, when not
      exhausted, enqueue through FR-EVENTS-3;
      `cancelled`: no action (an operator cancel).
      A key whose kind is not in the catalog (a worker of another version, a rollback) is skipped each round: no
      outcome is written for it here (only FR-EVENTS-7 writes `unknown_kind`, for a stalled job of such a kind), so
      a later worker that knows the kind still runs it.
      Each key-row write commits before any enqueue call. Because a re-deferred key has a `todo` job, a key is
      re-deferred at most once per abort or lost run. An enqueue that fails inside a sweep (FR-EVENTS-7 or this
      rule) is logged with the kind only and does not end the round; the key is left with no `todo` job, so
      reconciliation takes it once its row is 60 s old, like FR-EVENTS-6's lost re-enqueue. Separately, each sweep
      cancels every `todo` job whose `task_name` is neither in `KINDS` nor `jobs.sweep`.
  - id: FR-EVENTS-16
    text: >-
      Logging. The scrubber is a filter on every handler of the root logger, installed by `worker.run` (after
      `reader-server` configures logging) before it opens the procrastinate app; nothing in the worker process
      configures logging after that. Chosen over `logging.setLogRecordFactory` because procrastinate passes the job as `extra`, which
      `Logger.makeRecord` applies after the factory has built the record, so a factory cannot see it; chosen over
      logger-level filters because those do not see records propagated from child loggers. For records from the
      `procrastinate` hierarchy it removes `task_kwargs` and `call_string` from `record.job` with `pop(…, None)`
      (REF-EVENTS-5), and masks every call string in the message by pattern: `<task_name>[<job_id>](…)` becomes
      `<task_name>[<job_id>]`, where `<job_id>` is digits or `None` (a job logged before it has an id, on defer),
      with parentheses matched and quoted text skipped. The pattern covers records that
      carry the call string only in their message, without a `job` extra (procrastinate's shutdown line "Waiting
      for job to finish: worker: <call string>"). The filter is idempotent: a record passing it twice (it is on
      several handlers) is left as the first pass left it. The module's own records carry kind, key, job id,
      attempt count and error code only.
  - id: FR-EVENTS-18
    text: >-
      **Published key reads** (paired SRV-OBS change, FR-OBS-10). Next to `job_status_of` and `dead_error_code_of`,
      read-only, on an open connection without a procrastinate app: `key_rows_of(conn, keys) -> list[KeyRow]` takes
      keys of any kinds in one call (a key's kind is its `<kind>:` prefix; a row is returned only when its kind equals
      that prefix; unknown keys are omitted; served by the primary key), and `recent_keys_of(conn, kind_names, outcome,
      since, limit) -> tuple[list[KeyRow], bool]` returns rows of those kinds whose outcome equals `outcome` and whose
      `finished_at` ≥ `since`, newest `finished_at` first, at most `limit` (1 ≤ limit ≤ 500, else `JobError("limit")`),
      and `truncated` = (exactly `limit` rows were returned). `KeyRow = (kind, key, args, outcome, error_code, job_id,
      attempts, created_at, finished_at)`. Revision `jobs_0002` (branch `jobs`, down_revision `jobs_0001`) adds the
      index `job_keys_kind_outcome_finished` on (kind, outcome, finished_at); its downgrade drops it. The jobs
      branch's head becomes `jobs_0002` (the migration-heads test checks it). `key_rows_of` matches (kind, key) with
      the kind taken from the key's prefix in SQL, so a stored row whose kind differs from its key's prefix is never
      returned, and its plan uses `job_keys_pkey` (EXPLAIN in the db test; code review round 1). [db]
      server/tests/jobs/test_key_reads_db.py.
  - id: FR-EVENTS-19
    text: >-
      **Trace context** (paired SRV-OBS change, FR-OBS-5; ADR-0032 accepted 2026-11-24). Every defer (FR-EVENTS-3's
      enqueue, FR-EVENTS-6's retry, FR-EVENTS-4's lost-run re-enqueue, FR-EVENTS-8's requeue and the sweep's) passes a
      second task kwarg `trace`, SRV-OBS's `current_traceparent()` of the moment of the defer, omitted when it is None;
      the task accepts `trace: str | None = None`. `job_keys.args`, the idempotency key and FR-EVENTS-10's checks see
      only `payload`. The wrapper runs FR-EVENTS-4's whole run (claim, handler, judge, re-enqueue) inside SRV-OBS's
      `job_span(kind, job_id, key, attempt, payload, trace)`, so the retry and handler enqueues made during the run
      carry the job span's context; the sweep runs outside any span, so its defers carry none. The span records the
      outcome (`succeeded`, `skipped`, `failed`, `dead`, `aborted`) and the `JobFailed` code; a failure inside the span
      helpers never changes the job's outcome. KIND_MODULES lists `reader.obs.jobs` (kind `obs.retention`) last, so
      the integrated order is ingest, search, pipeline, tutor, obs, and `start_hooks()` is search's, pipeline's and
      obs's `on_worker_start` in that order (FR-EVENTS-1's unit test updated). The root span's outcome is the key's:
      `dead` with `reader.error_class` for a permanent failure, `dead` with `exhausted` for a run that finds the key
      at max_attempts, `skipped` for a run that finds the key decided, and `dead` (not `failed`) for `session_lost` and
      `wrapper_error` when that count ended the key dead (code review round 1), `failed` with `session_lost` when it
      did not, and `aborted` for a cancelled run (round 2). [unit, db]
      server/tests/jobs/test_trace_context.py. Amended by SRV-OBS V.obs-analytics (FR-OBS-12 e, -14, -15; ADR-0035
      accepted 2026-11-24): for `pipeline.*` kinds the wrapper calls `reader.obs.spans.session_marker("reader.run_id",
      <payload run_id>)` right after opening the root (only when the payload's `run_id` is a string; the helper never
      raises and does nothing with tracing off); `reader.obs.jobs` also declares `obs.feedback` and `obs.prompts`,
      and its `on_worker_start` also enqueues `obs.prompts` (enqueue-only, a failure logged); the integrated
      catalog is ingest.import, search.embed, pipeline.stage, pipeline.verify, tutor.answer, obs.feedback,
      obs.prompts, obs.retention (FR-EVENTS-1's unit test updated).
  - id: FR-EVENTS-32
    text: >-
      Paired SRV-OBS phase 2 change (ADR-0038 accepted 2026-11-25; SRV-OBS `phase2_job_kinds`). `reader.obs.jobs`
      declares five more kinds with SRV-EVENTS' `JobKind`, queue `obs`, delays 5 s and 25 s: `obs.setup` {digest}
      key [digest], 3 attempts, 60 s, enqueued by the worker's start hook (enqueue-only); `obs.runs` {kind
      compile|ingest, id, end 1..100} key [kind, id, end], 3 attempts, 60 s, `schedule_in` 60 s; `obs.bench`
      {upload_id} key [upload_id], 3 attempts, 60 s; `obs.label` {label_id, revision} key [label_id, revision], 3
      attempts, 30 s; `obs.health` {slot: the time truncated to 30 minutes} key [slot], 1 attempt, 20 s,
      `traced: false`. A periodic entry of the worker's scheduler enqueues `obs.health` every 30 minutes. A
      `JobKind` gains the optional field `traced: bool = True`; with `traced: false` the job wrapper opens no root
      span and passes no trace context (SRV-OBS FR-OBS-5 f). Declared: `obs.runs` holds a second advisory lock,
      `lock_id("obs.runs:<kind>:<id>")`, on its job's connection for the whole run beside the key lock, so it holds
      one pooled connection for up to its 60 s timeout like every running job. Tests: [unit] the catalogue lists the
      kinds in KIND_MODULES order with exactly these declarations; a `traced: false` kind opens no root span; [db]
      the periodic entry enqueues one `obs.health` per slot.
  # Amendment (2026-11-24, V/manage, WEB-MANAGE; header note above `audit_actions`).
  - id: FR-EVENTS-30
    text: >-
      **Audit rows.** A system table `audit_log(id bigint identity pk, at timestamptz, actor_id uuid, action text,
      object_kind text, object_id text, detail jsonb)`; `actor_id` has no foreign key, so a deleted learner's rows
      stay and never block SRV-AUTH FR-AUTH-43. A trigger refuses UPDATE, DELETE and TRUNCATE (as agent_spend's).
      `reader.jobs.audit.record(conn, actor_id, action, object_id, detail)` checks the row against `audit_actions`
      (declared as data in `AUDIT_ACTIONS`; the code's table equals this spec's, unit test): an unknown action, an
      `object_id` that does not match its pattern, or a `detail` key outside its list raises before any insert.
      `detail` values are integers, booleans, ids or hashes of the listed shapes, except `settings.*`, whose `old`,
      `new` and `file` are the setting's value (a number, an enum or null; never free text); never a title,
      description, note, question or handle. ≤ 2 KiB compact JSON. The row is inserted on the caller's connection, so
      it commits or rolls back with the change. Progress, notes and bookmarks are not audited (the reader's own data).
      A no-op request writes no row (SRV-LESSON INV-LESSON-21). **A refused row is a programming error**, never a
      user error: every route wrapper that runs audited changes (SRV-LESSON's management routes, SRV-INGEST's
      material routes, SRV-AUTH's people and self routes) catches `AuditRefused`, lets the transaction roll back,
      logs `audit_refused reason=<rule>` (the rule's name only: no object id, no detail) and answers 500
      `{"error": "audit_refused"}`; never a bare 500. [unit] the table equality and each refusal; a reader.yaml
      material id accepted exactly when SRV-CONFIG FR-CONFIG-18 accepts it; [db] the trigger; one row per applied
      action; rollback of the change removes its row; a forced refusal on a course rename and on a material rename
      answers 500 `audit_refused`, writes nothing and logs only the reason.
  - id: FR-EVENTS-31
    text: >-
      **Reading the audit.** `GET /api/audit?before=<id>` (`session`; owner only, else 403 `owner_only`; read-only)
      → the newest 200 rows with an id below `before` (all rows when absent), `{rows: [{id, at, actor_id, action,
      object_kind, object_id, detail}], next_before | null}`; a `before` that is not a positive integer → 400
      `before_invalid`. WEB-MANAGE's Data tab lists them as "Activity" with the actor's handle and the object's current
      title looked up by the client from the lists it already has (a deleted object shows its kind and the id's first
      8 characters). The route is in `reader.jobs.audit_routes` (SRV-AUTH ROUTERS, paired). [db] paging; a learner
      gets 403.

invariants:
  - id: INV-EVENTS-1
    text: At most one job per key is in procrastinate status `doing` (the `lock` index) and at most one in `todo` (the `queueing_lock` index); with `lock_mode` `ordered`, a `todo` job never starts while the key's `doing` job runs.
  - id: INV-EVENTS-2
    text: >-
      For every key, the outcome is written at most once until `requeue_dead`, and the handler's committed database
      effect happens at most once per outcome, under any interleaving of enqueue, worker kill, stall, sweep,
      shutdown abort and requeue. Provider spend is not covered (FR-EVENTS-5).
  - id: INV-EVENTS-3
    text: A key with an outcome is never handed to its handler again until `requeue_dead`; enqueue returns `already_done` or `dead`, and a claimed job skips.
  - id: INV-EVENTS-4
    text: Every `doing` job of a killed worker reaches a terminal procrastinate status within the recovery bound, and its key then has an outcome or a `todo` job; no key exceeds `max_attempts` counted runs.
  - id: INV-EVENTS-5
    text: >-
      No `Secret` value and no resolved secret value of the process's settings appears in `procrastinate_jobs.args`,
      `job_keys`, or any log record emitted in the worker process, `procrastinate.*` loggers included.
  - id: INV-EVENTS-6
    text: The per-key transition function over (state, event) is total and matches VEC-EVENTS-1 exactly; `succeeded` and `dead` are terminal except for `requeue` from `dead`.
  - id: INV-EVENTS-7
    text: "`enqueue` never waits for a key lock: with the key lock held by another session for the whole call (and no uncommitted key-row write), it completes under a 2 s `statement_timeout` set by the test only. Its only possible wait is on an uncommitted key-row write, bounded by one statement plus a commit (FR-EVENTS-3)."

