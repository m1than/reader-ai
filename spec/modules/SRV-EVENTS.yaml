#     skips the handler (counted outside the database); effect count 1 [FR-EVENTS-4, INV-EVENTS-2, -3].
#   - test_finish_after_sweep_finished (simulated): the original worker's finish of a job the sweep already
#     finished returns false and changes nothing [FR-EVENTS-7].
#   - test_session_cut_mid_run_then_sweep (real): a running worker's database session is terminated
#     (`pg_terminate_backend`); the sweep takes the freed key lock, counts the stall and re-enqueues; the worker
#     wakes, its run ends `session_lost` without being judged, and its finish of a job the sweep already finished
#     fails inside procrastinate's own task (procrastinate reports it as an unretrieved task exception or an
