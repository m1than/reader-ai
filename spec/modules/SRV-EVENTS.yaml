# SRV-EVENTS — the job queue; vertical-slice subset V1 (`V.SRV-JOBS-min`, docs/roadmap.md "Vertical slice first").
#
# The roadmap gives SRV-EVENTS both `server/src/reader/events/**` and `server/src/reader/jobs/**`. This revision
# specifies only the jobs half, the part the slice needs (ingest, compile and embedding jobs). The stage-2 revision
# of this same spec adds the event half (see `defers`) with new tables only: no data migration of the job table.
#
# Queue: procrastinate 3.12.0 (ADR-0006: "Postgres queue (FOR UPDATE SKIP LOCKED, LISTEN/NOTIFY wake-up) through
# procrastinate"). procrastinate delivers: fetch, LISTEN/NOTIFY, scheduled start (`schedule_in`), worker heartbeats
# (every 10 s) and stalled-worker detection (30 s without a heartbeat) (REF-EVENTS-2, -3). Every procrastinate job is
# single-shot: procrastinate never retries (no RetryStrategy, `max_attempts=None`). This module is the one judge of
# retries, attempts and outcomes, and keeps them per key in one table, `job_keys` (FR-EVENTS-11), because
# procrastinate's `queueing_lock` is unique only among `todo` jobs and its `lock` only among `doing` jobs
# (REF-EVENTS-4): neither stops a second run after success, and each new procrastinate job starts at 0 attempts.
#
# The key lock. Every read-then-write of a key's state by a worker, the sweep or `requeue_dead` happens inside a
# Postgres transaction holding the key's advisory lock (FR-EVENTS-13). A running job holds it for its whole run, so a
# key lock that cannot be taken means a live session is running that key. Postgres releases it when the session ends,
# including when the worker process is killed and the kernel closes its connection. `enqueue` never takes it and
# never waits (FR-EVENTS-3).
#
# Drivers (owner note below): asyncpg for SQLAlchemy (ADR-0006), psycopg 3 inside procrastinate only. Enqueue commits
# independently of any caller transaction (FR-EVENTS-3); atomic enqueue with a caller's state change is deferred to the
# stage-2 outbox.
#
# ADR status: ADR-0006, ADR-0007 and ADR-0018 are `proposed`; this spec follows their text as the current design, as
# the owner directed for the proposed stage-0 ADRs. ADR-0020 is accepted.
#
# Cross-spec requirements on SRV-AUTH (owner of `server/src/reader/db/**`, the Alembic environment and the
# `reader-server` dispatch; none of its files are claimed here):
#   - `version_locations` is computed at start (Alembic does not glob): every existing `server/src/reader/*/migrations`
#     directory, plus procrastinate's shipped `procrastinate/contrib/alembic/versions` (located through the installed
#     package). Migration runs `alembic upgrade heads`; readiness compares the database against all heads.
#   - The migration advisory lock is session-level (`pg_advisory_lock`), not transaction-level, because procrastinate's
#     revisions commit inside `autocommit_block`; and it uses a namespace other than this module's (FR-EVENTS-13).
#   - SRV-AUTH's owner_id invariant exempts the system tables other specs declare: `job_keys` and procrastinate's
#     `procrastinate_*` tables (jobs are server work, not user data; a job's owner, when one exists, is a field of its
#     `args`).
#   - `reader-server --role worker` calls `reader.jobs.worker.run(engine, target, stop)` (FR-EVENTS-9) once the
#     schema is at all heads, and nothing else.
#   - Readiness ("at all heads") compares the version table with the effective heads (`get_revisions("heads")`):
#     `procrastinate_0043` is reached through `jobs_0001`'s `depends_on` and is not kept in the version table.
#   - The migration lock is taken by polling `pg_try_advisory_lock` on its own autocommit connection: procrastinate's
#     chain runs `CREATE INDEX CONCURRENTLY`, which waits for every open transaction, so a migrator blocked inside
#     `pg_advisory_lock` with an open transaction deadlocks against it (measured: SRV-AUTH's concurrent-migration
#     test deadlocked until this change).
#
# Red phase: tests import the module inside each test body, so that each test fails on its own assertion.

id: SRV-EVENTS
title: Job queue on procrastinate with per-key attempts and outcomes, declared job kinds and a reconciling sweep (slice subset)
status: approved
approved_by: agent
approved_at: 2026-11-22
layer: server
track: engineering
adr: [ADR-0006, ADR-0007, ADR-0018, ADR-0020]
slice: V.SRV-JOBS-min
review: "deep-reviewer (Fable), 2026-11-20: round 1 changes (procrastinate integration seams); round 2 changes (single-shot jobs, per-key reconcile, non-blocking enqueue, one table); round 3 changes (uniform stall-like rule, commit order, key-row writes last); round 4 approve (three nits applied: increment always with dead in the same transaction, max_attempts = 1 requeue gap, idempotent log filter). Approved with Red after SRV-AUTH merged (2026-11-22). Code review round 1 (2026-11-22): changes — deadline-only timeout, try-lock on the unknown-kind stalled path, real lock and shutdown tests, pattern log masking, wrapper sanitizing; applied with paired tests. Paired change from SRV-INGEST (2026-11-22, reviewed in SRV-INGEST's code review): KIND_MODULES lists `reader.ingest.jobs` (FR-EVENTS-1); FR-EVENTS-12's status read is also exposed as `reader.jobs.queue.job_status_of(conn, kind, key)` for callers without a procrastinate app (SRV-INGEST's routes), and `Jobs.job_status` uses it; no behaviour of this module changed. Integration (V/SRV-TUTOR-impl, 2026-11-23): KIND_MODULES lists ingest, search and tutor. Amendment from SRV-TUTOR (2026-11-23, FR-EVENTS-1): `JobKind.priority`, passed at every defer, bounded below the sweep's priority; tests: the catalog bound (unit), the priority stored on the first enqueue and on a retry, and fetch order (db); reviewed with SRV-TUTOR's code review. Integration (V/slice-integration, 2026-11-23): KIND_MODULES ingest, search, pipeline, tutor (SRV-TUTOR's order). Final code review on 2924dcf (2026-11-23, deep-reviewer): changes, no live correctness bug, untested or unspecified behaviour. Applied on V/SRV-EVENTS-final, spec then tests then code: FR-EVENTS-1 injectable start hooks (`hooks=`), awaited once after the start sweep with `running()` set, failure and a 30 s timeout isolated, idempotent and enqueue-only, `running()` cleared in the finally; FR-EVENTS-15 skips unknown-kind keys (the reconcile's `dead`/`unknown_kind` write removed) and