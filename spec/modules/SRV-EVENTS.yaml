# Test levels.
#   [unit]  pure functions: the transition table, the status map, key derivation, lock_id, registry building, payload
#           checks, the log filter. Hypothesis stateful testing (RuleBasedStateMachine) drives random event sequences
#           against VEC-EVENTS-1.
#   [db]    a real Postgres from testcontainers (ADR-0006 names testcontainers), image pinned to the index digest
#           OPS-DEPLOY pins, `postgres:18-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a`
#           (has linux/arm64/v8, verified in OPS-DEPLOY). Skips when no Docker daemon is reachable.
#   [live]  none in this revision; V.live (`e2e/live/slice.sh`) runs ingest and compile jobs through the stack.
#
# Named [db] tests and their fault points (FR/INV in brackets):
#   - test_kill_after_commit_before_finish: a subprocess worker is SIGKILLed after the outcome commit and before
#     `finish_job` (a test hook pauses there); the sweep finishes the job; effect count 1 [FR-EVENTS-4, -15, INV-EVENTS-2].
#   - test_kill_mid_handler: SIGKILL during the handler; the transaction rolls back, the sweep retries, attempts +1,
#     effect count 1 after success [FR-EVENTS-7, -14, INV-EVENTS-4].
#   - test_stale_heartbeat_live_holder: a slow live original with its heartbeat stopped; the sweep finds the key
#     lock held and leaves it; a second worker re-claiming finds the outcome and skips; effect count 1, final
#     outcome succeeded [FR-EVENTS-7, -13, INV-EVENTS-2].
#   - test_finish_after_reclaim_not_found: procrastinate's `finish_job` for a job the sweep already finished is
#     expected and handled without a second outcome or a crash [FR-EVENTS-15].
#   - test_dead_then_claim: a todo job queued behind a running one that ends dead is claimed and skips [FR-EVENTS-4].
#   - test_enqueue_races_each_transition: concurrent enqueue against run start, success, transient failure,
#     exhaustion, stall and requeue; results match VEC-EVENTS-1 and INV-EVENTS-1..3 hold [FR-EVENTS-3, -8].
#   - test_shutdown_abort_not_counted: SIGTERM with a running job past 8 s; status aborted, attempts unchanged, the
#     sweep re-defers it [FR-EVENTS-9, -14, -15].
#   - test_exhaustion_counts_per_key: three transient failures across two procrastinate jobs for one key end dead
#     with attempts 3 [FR-EVENTS-6, -14].
#   - test_canary_secret_never_logged: every logger captured at DEBUG (root handler), canary in settings and a
#     handler error message containing it; no record, table or args contains it [INV-EVENTS-5, FR-EVENTS-10, -16].
#   - test_migration_heads: upgrade heads from empty, downgrade of the `jobs` branch drops only its two tables [FR-EVENTS-11].
