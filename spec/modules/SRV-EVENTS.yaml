BS's code review. Paired change from SRV-FRESH (2026-11-23, reviewed with SRV-FRESH's code; merged into V/slice-integration 2026-11-24): KIND_MODULES appends `reader.freshness.jobs` after `reader.obs.jobs` (kinds `freshness.scan`, `freshness.web`; no start hook); the declared-list test takes it; no behaviour of this module changed. Management code-review fix (V/manage-fix-srv, 2026-11-24, B2): the audit `material` id rule is SRV-CONFIG FR-CONFIG-18's own (the former slug pattern refused valid reader.yaml ids such as `Bashir`, so renaming or deleting them failed with a bare 500); FR-EVENTS-30 states that a refused row answers 500 `audit_refused` with the reason logged only"

paths:
  - server/src/reader/jobs/**
  - server/tests/jobs/**

# System tables (SRV-AUTH INV-AUTH-8 reads `system: true` entries from every spec; a `*` entry is a prefix match).
tables:
  job_keys: { system: true, columns: "kind text, key text, args jsonb, attempts int, outcome text null, error_code text null, job_id bigint null, created_at, updated_at, finished_at null; pk (kind, key)" }
  "procrastinate_*": { system: true, columns: "procrastinate 3.12.0's own schema (its shipped Alembic chain)" }
  audit_log: { system: true, columns: "id bigint GENERATED ALWAYS AS IDENTITY pk, at timestamptz, actor_id uuid (no FK), action text, object_kind text, object_id text, detail jsonb; trigger refuses UPDATE, DELETE, TRUNCATE (FR-EVENTS-30)" }

