#   [live]  none in this revision; V.live (`e2e/live/slice.sh`) runs ingest and compile jobs through the stack.
#
# Named [db] tests and their fault points (FR/INV in brackets). "Simulated" tests reproduce a dead worker's
# database state: a job fetched under a registered worker whose heartbeat is then made stale, with any commit the
# dead run would have made written by the test. "Real" tests kill or cut a running worker.
#   - test_kill_after_commit_before_finish (simulated): the run's effect and outcome are committed, the job stays
#     `doing` under a stale worker; the sweep finishes it; effect count 1 [FR-EVENTS-4, -7, INV-EVENTS-2].
#   - test_kill_mid_handler (simulated): a stale `doing` job with nothing committed; the sweep counts the stall and
