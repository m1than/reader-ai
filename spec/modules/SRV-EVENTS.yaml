# What the full stage-2 revision of SRV-EVENTS adds (docs/roadmap.md stage 2, SRV-EVENTS row).
defers:
  - "Typed event registry and the `events` table written in the same transaction as the state change (transactional outbox, ADR-0006)."
  - "Atomic enqueue with the caller's state change, through the stage-2 outbox. Alternative to weigh then: call `procrastinate_defer_jobs_v2` as SQL on the caller's asyncpg session, which keeps one transaction without a second driver."
  - "SSE `/api/events` resumable by `Last-Event-ID`; event to SSE client p95 ≤ 200 ms."
  - "TypeScript event types generated for `web/`."
  - "Event-driven pipeline consumers (`stage.completed` enqueues the next stage, ADR-0018)."
  - "Notifications (SRV-NOTIFY) and metrics (SRV-OBS) on job outcomes."

owner_notes:
  - "Driver (coordinator decision, 2026-11-20): two drivers. asyncpg stays for SQLAlchemy as ADR-0006 says; psycopg 3 is used only inside procrastinate. One psycopg driver would make enqueue atomic with state now, but contradicts ADR-0006's text and would need a new ADR."
  - "Migrations: each module keeps its Alembic revisions in its own `reader/<module>/migrations/` with a branch label; SRV-AUTH's environment computes `version_locations` and upgrades to all heads."
  - "A running job holds one database transaction for its whole run (minutes for compile stages); worker sessions disable `idle_in_transaction_session_timeout`. At concurrency 1 this is one long transaction at a time."
  - "Never run two worker versions side by side: a worker's sweep cancels `todo` jobs of kinds its own catalog lacks (FR-EVENTS-15) and writes `dead`/`unknown_kind` for their stalled jobs (FR-EVENTS-7). Stop the old worker before starting the new one."

# ---- Amendment (2026-11-24, V/manage, WEB-MANAGE): FR-EVENTS-30..31, promoted with their Red tests on
# V/manage-impl after deep-review rounds 1–3 (round 3 on 2a7d86f: VERDICT approve). The transactional outbox and its
# audit consumer stay deferred to stage 2; this is the smallest audit trail the management layer needs now, written
# in the same transaction as each change. Code: `server/src/reader/jobs/audit.py` (record),
# `server/src/reader/jobs/audit_routes.py` (the read route) and revision jobs_0003 on the `jobs` branch; tests in
# server/tests/jobs/. Green (2026-11-24): the Red test reformatted for ruff (line length, PT012); no oracle changed.
# jobs_0003 is now the `jobs` branch head, so the head checks of FR-EVENTS-11/-18 (test_jobs_db's migration heads,
# test_key_reads_db's index test) name jobs_0003 as the head; the jobs_0002 index is still asserted.
#
# One row per action: object_kind, the pattern its object_id must match, and the only keys `detail` may hold.
# uuid = canonical lowercase UUID; sid/pid = 16 lowercase hex; sha = 64 lowercase hex; a material id is
# `up-<12 hex>` or a reader.yaml id by exactly SRV-CONFIG FR-CONFIG-18's rule (non-empty, at most 64 code points,
# each printable and neither white space nor `/`, not starting with `up-`; `reader.config.checks.material_id_problem`
# is the one definition, so every id reader.yaml accepts is auditable); an OVERRIDABLE key is SRV-CONFIG
# FR-CONFIG-26's.
audit_actions:
    course.rename: { kind: course, id: uuid, detail: [version] }
    course.describe: { kind: course, id: uuid, detail: [version] }
    course.order: { kind: owner, id: uuid, detail: [count] }
    course.archive: { kind: course, id: uuid, detail: [] }
    course.unarchive: { kind: course, id: uuid, detail: [] }
    course.delete: { kind: course, id: uuid, detail: [lessons, revisions, tutor_questions, compile_runs, spend_rows, by_material] }
    course.restore: { kind: course, id: uuid, detail: [by_material] }
    lesson.rename: { kind: lesson, id: uuid, detail: [version] }
    lesson.order: { kind: course, id: uuid, detail: [count] }
    lesson.skip: { kind: lesson, id: uuid, detail: [] }
    lesson.unskip: { kind: lesson, id: uuid, detail: [] }
    lesson.delete: { kind: lesson, id: uuid, detail: [] }
    lesson.restore: { kind: lesson, id: uuid, detail: [] }
    lesson.revert: { kind: lesson, id: uuid, detail: [from_sha256, to_sha256] }
    material.rename: { kind: material, id: "a material id as GET /api/materials returns it (`up-<12 hex>` or a reader.yaml id)", detail: [version] }
    material.delete: { kind: material, id: "a material id", detail: [courses] }
    material.restore: { kind: material, id: "a material id", detail: [courses] }
    compile.cancel: { kind: run, id: uuid, detail: [lesson_id] }
    tutor.clear: { kind: lesson, id: uuid, detail: [count] }
    user.sessions_revoke: { kind: user, id: uuid, detail: [count] }
    user.credential_remove: { kind: user, id: uuid, detail: [pid] }
    user.delete: { kind: user, id: uuid, detail: [] }
    user.enable: { kind: user, id: uuid, detail: [] }
    self.session_revoke: { kind: user, id: uuid, detail: [sid, count] }
    self.credential_label: { kind: user, id: uuid, detail: [pid] }
    self.credential_remove: { kind: user, id: uuid, detail: [pid, revoked_sessions] }
    settings.set: { kind: setting, id: "an OVERRIDABLE key", detail: [old, new] }
    settings.reset: { kind: setting, id: "an OVERRIDABLE key", detail: [old, file] }
