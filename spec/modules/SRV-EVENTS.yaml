    source: "Hand-derived from FR-EVENTS-3, -4, -6, -7, -8, -14, -15 and procrastinate's statuses (REF-EVENTS-4); one row per (state, event)"
    file: spec/fixtures/SRV-EVENTS/transitions.yaml
  - id: VEC-EVENTS-2
