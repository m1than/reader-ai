#     outcome `succeeded`, one committed effect, two handler calls [FR-EVENTS-4, -7, INV-EVENTS-2].
#   - test_self_terminating_handler_is_bounded (real): a handler that terminates its own backend, re-enqueued
#     after every run, ends `dead`/`session_lost` with attempts 3 and at most 3 handler runs, with no sweep
