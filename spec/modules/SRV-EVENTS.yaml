# What the full stage-2 revision of SRV-EVENTS adds (docs/roadmap.md stage 2, SRV-EVENTS row).
defers:
  - "Typed event registry and the `events` table written in the same transaction as the state change (transactional outbox, ADR-0006)."
  - "Atomic enqueue with the caller's state change, through the stage-2 outbox. Alternative to weigh then: call `procrastinate_defer_jobs_v2` as SQL on the caller's asyncpg session, which keeps one transaction without a second driver."
  - "SSE `/api/events` resumable by `Last-Event-ID`; event to SSE client p95 ≤ 200 ms."
  - "TypeScript event types generated for `web/`."
  - "Event-driven pipeline consumers (`stage.completed` enqueues the next stage, ADR-0018)."
  - "Notifications (SRV-NOTIFY) and metrics (SRV-OBS) on job outcomes."

owner_notes:
  - "Driver (coordinator decision, 2026-11-20): two drivers. asyncpg stays for SQLAlchemy as ADR-0006 says; psycopg 3 is used only inside procrastinate. One psycopg driver would make enqueue atomic with state now, but contradicts ADR-0006's text and would need a new ADR."
  - "Migrations: each module keeps its Alembic revisions in its own `reader/<module>/migrations/` with a branch label; SRV-AUTH's environment computes `version_locations` and upgrades to all heads."
  - "A running job holds one database transaction for its whole run (minutes for compile stages); worker sessions disable `idle_in_transaction_session_timeout`. At concurrency 1 this is one long transaction at a time."
