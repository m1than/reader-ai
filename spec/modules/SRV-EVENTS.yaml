#   - test_real_run_holds_the_lock_then_sigkill (real): a subprocess `worker.run` runs a sleeping handler;
#     `sweep(stalled_after_s=0)` finds the key lock held (`skipped_live`, attempts 0) and `requeue_dead` returns
#     `running`; after SIGKILL the session ends, and the sweep re-enqueues with attempts 1 and effects 0
#     [FR-EVENTS-7, -8, -13, INV-EVENTS-2, -4].
#   - test_stale_heartbeat_lock_held_is_skipped (simulated stall, lock held by a test session) [FR-EVENTS-7, -13].
#   - test_unknown_kind_stalled_while_lock_held (simulated): a sweep whose catalog lacks the kind leaves a
#     lock-held key alone, no outcome [FR-EVENTS-7].
