# SRV-PLAN — the study-time question and the course plan derived from it (owner request 2026-11-23, task
# V.onboarding). A deterministic planner spreads an imported material evenly over the learner's study days (total weeks
# × 7) and checks that each day's lesson stays within the learner's minutes per day; the preview shows the plan and an
# estimate; confirm imports the plan through SRV-PIPELINE's course import and, if asked, starts compiling the first
# lesson.
#
# Status: approved (revision 4, deep-reviewer round 4 `VERDICT: approve` on d9f655a; cost math, jobs and idempotency
# are complex areas, AGENTS.md).
#
# Owner decisions:
#   1. (2026-11-23) The learner enters total weeks and minutes per day. The default minutes per day is 60 (owner
#      decision of 2026-11-06, recorded in ADR-0010 "Study budget", which is still proposed).
#   2. (2026-11-23) The study rate must not be invented: a sourced default the learner can adjust, plus a spike that
#      measures it (spikes/study-rate).
#   3. (2026-11-23, replaces revision 1's "one lesson per session, spare days for review") Lessons stretch to the
#      deadline: the material is spread evenly over every study day, `total_weeks × 7` days, with no review days.
#      A lesson is at most `minutes_per_day`. A small material gets fewer lessons than days (never less than one
#      page with text per lesson), and the preview says so. A material that does not fit gets suggestions: more weeks
#      or more minutes per day.
#   4. (2026-11-23, coordinator for the owner, round 2) A re-plan keeps the deadline: the stored start date and
#      `end = start + D − 1` stay; the free pages are spread over the days left (`end − today + 1`); past the deadline
#      the plan does not fit and more weeks are suggested; changing the weeks moves `end` from the stored start.
#
# Design decisions (each open to the reviewer and the owner):
#   - Volume is characters, not pages: page density in the pilot ranges from 1,189 (p10) to 2,748 (p90) span
#     characters (spikes/study-rate step 1b), so pages would mis-size lessons by about 2×.
#   - Cuts are by cumulative characters at exact targets (FR-PLAN-4), not at outline entries: the owner's even spread
#     makes the lesson count a function of the days, and an exact rule gives a testable size bound (INV-PLAN-3).
#     Cutting at section starts is a defer. Titles still come from the outline (FR-PLAN-5).
#   - A lesson must stay compilable: its rendered source must stay under SRV-PIPELINE's `source_max_chars`
#     (FR-PLAN-4 `lesson_source_chars_max`).
#   - The planner is a pure function over integers (characters, span counts, hundredths of a minute), so the same
#     inputs give the same plan byte for byte, on any machine (INV-PLAN-1).
#   - The material's pages and outline are read by this module's own reader over SRV-INGEST's tables (`materials`,
#     `ingests`, `material_spans`, `material_outline`, created by `ingest_0001`), the way SRV-PIPELINE FR-PIPELINE-2
#     reads spans (FR-PLAN-9). SRV-INGEST exports no page reader, so nothing here waits for ADR-0029.
#
# Cross-spec items (paired changes in their own specs, drafted with this one):
#   - SRV-PIPELINE FR-PIPELINE-14 (`import_course_plan`, origin `study_plan`, removal of unstarted lessons and
#     renumbering, under the course lock) and FR-PIPELINE-15 (`create_run` takes the same course lock and can refuse
#     `already_started`).
#   - SRV-LESSON: `delete_unstarted_lesson` and `reorder_lessons` (proposed FR-LESSON amendment, listed in
#     FR-PIPELINE-14).
#   - SRV-AUTH: ROUTERS appends `reader.plan.routes`; VERSION_LOCATIONS adds `reader/plan/migrations` after
#     `pipeline` (a paired note, no behaviour change there).
#   - WEB-IMPORT FR-IMPORT-4..6: the study-time form, the estimate and confirm use these routes and codes.
#
# Test levels: [unit] pure Python, Hypothesis for the invariants; [db] testcontainers Postgres (as SRV-PIPELINE);
# [live] e2e/live against `reader up` with the already-imported pilot, preview and confirm with `compile_first: false`
# (no compile, no credit): `bash e2e/live/plan.sh`. Its owner session is one row it creates and deletes by id
# (e2e/live/lib/plan_live.py; the owner's own passkeys and sessions are never touched), pinned against a fake owner
# session in server/tests/plan/test_live_session_db.py. When the owner already has a plan, the check reads it first
# and restores its weeks, minutes and rate in a `finally` (server/tests/plan/test_live_restore.py, against a fake).

id: SRV-PLAN
title: Course planning — the study-time question, a deterministic planner that spreads the material over the study days within the daily minutes, the estimate and confirm
status: approved
approved_by: agent
approved_at: 2026-11-23
layer: server
track: product
adr: [ADR-0010, ADR-0009, ADR-0005, ADR-0008]

paths:
  - server/src/reader/plan/**
  - server/tests/plan/**
  - spec/fixtures/SRV-PLAN/**

normative:
  - id: REF-PLAN-1
    title: ADR-0010 — learning loop; study budget 60 minutes a day (owner decision 2026-11-06; the ADR is proposed)
    url: docs/adr/0010-learning-loop.md
  - id: REF-PLAN-2
    title: "spikes/study-rate/RESULT.md — the default study rate from the owner's own pilot plan (81 theory hours over 890 PDF pages) and the pilot's characters per page"
    url: spikes/study-rate/RESULT.md
  - id: REF-PLAN-3
    title: "Brysbaert M. (2019), How many words do we read per minute? A review and meta-analysis of reading rate. Journal of Memory and Language 109, 104047 — silent reading of English non-fiction 238 words per minute (a lower bound on time: reading, not study)"
    url: https://doi.org/10.1016/j.jml.2019.104047
  - id: REF-PLAN-4
    title: "Compile cost basis: L02 converged in 210 s for $1.2587 on the product pipeline (docs/progress.yaml V.live, 2026-11-23); spike runs $2.4236 and $2.9714, one loop, not converged (spikes/compile-cost/RESULT.md)"
    url: spikes/compile-cost/RESULT.md
  - id: REF-PLAN-5
    title: "pilot/bashir/plan.yaml — the owner's hand-made study plan: 81 theory hours, 209.8 code hours, budget_sessions = round((theory + code) × 1.2), 349 sessions in all"
    url: pilot/bashir/plan.yaml
  - id: REF-PLAN-6
    title: "SRV-PIPELINE FR-PIPELINE-2 — the source rendering and its `source_max_chars` (300,000) check"
    url: spec/modules/SRV-PIPELINE.yaml

bounds:
  minutes_per_day: { min: 10, max: 240, step: 5, default: 60 }   # default: owner decision 2026-11-06 (ADR-0010, proposed); 240 = four hours, structural
  total_weeks: { min: 1, max: 104 }                             # two years, structural
  week_days: 7                 # owner decision 3: every day is a study day, no review days
  study_minutes_per_kchar_default: "2.64"   # spikes/study-rate step 1b: the owner's 81 theory hours over 1,841,091 span characters
  study_minutes_per_kchar: { min: "0.10", max: "20.00" }        # structural; the pilot's per-stage spread is 1.40–5.30
  span_header_chars: 46        # an upper bound: the longest FR-PIPELINE-2 marker line "⟦source⟧ s<5 digits> p.<4 digits> list_item ⟦/source⟧" is 42 characters, 45 with its "\n" and the "\n\n" join
  lesson_source_chars_max: 270000   # SRV-PIPELINE source_max_chars (300,000) less a 10 % margin (chosen); see FR-PLAN-2
  today_skew_days: 1           # the client's local date may differ from the server's UTC date by one day
  estimate_band: { min: "0.5", max: "2" }   # chosen: a mean lesson outside 0.5×–2× of L02's characters is an extrapolation (FR-PLAN-8)

requirements:
  - id: FR-PLAN-1
    text: >-
      **Planner input** (`reader.plan.planner.plan(PlanInput) -> Plan`, pure, no I/O): `page_chars: tuple[int, ...]`
      and `page_spans: tuple[int, ...]` (span text characters and span count per PDF page, page 1 first, both of
      length `page_count`), `outline: tuple[Entry(level, page | None), ...]` in outline (seq) order,
      `minutes_per_day`, `total_weeks`, `rate_centi` (the study rate in hundredths of a minute per 1,000 characters,
      an integer), `start_date` (the plan's first day), `today` (the learner's local date; equal to `start_date` on a
      first plan, FR-PLAN-6), and `fixed: tuple[Fixed(first, last, plan_lesson_id), ...]` (lessons that must stay
      as they are, FR-PLAN-6). The planned range is always the whole material, pages 1..`page_count`. Inputs outside
      `bounds` raise `PlanInputError(code)` with `minutes_per_day`, `total_weeks`, `rate` or `fixed` (overlapping,
      out of range or unsorted). [unit]
  - id: FR-PLAN-2
    text: >-
      **Minutes.** A lesson's cost in milli-minutes is `chars × rate_centi // 100`, where `chars` is the sum of its
      pages' `page_chars` (integer arithmetic, floor, computed once per lesson). Its displayed `minutes` is the cost
      divided by 1,000, rounded half up. The day's budget is `T = minutes_per_day × 1000` milli-minutes. A lesson's
      `source_chars` is `chars + span_header_chars × spans` over its pages: the planner's own measure, stricter than
      FR-PIPELINE-2's `render`, which checks only the span text against `source_max_chars`; it bounds the rendered
      source including its marker lines, and the 10 % margin of `lesson_source_chars_max` is a chosen allowance on
      top. [unit]
  - id: FR-PLAN-3
    text: >-
      **Days and free intervals.** `D = total_weeks × week_days` study days; the plan's last day is `end = start_date
      + D − 1`. The planner first sets `today = max(today, start_date)` (a re-plan on a date before the stored start,
      e.g. across the ±1-day skew, counts from the start). The free lessons are spread over the days left, `days_left
      = end − today + 1` (on a first plan `today = start_date`, so `days_left = D`). Fixed lessons take nothing from
      `days_left`: they are already scheduled on past days or today (owner decision 4, decided by the coordinator for
      the owner: keep the deadline; owner note 4). The free intervals are the maximal page runs not
      covered by a fixed lesson; a free interval whose pages all have 0 characters is left out of the plan (no lesson;
      the only place a page may be unplanned). `G` is the number of remaining free intervals, `C` their total
      characters and `P` the number of their pages with more than 0 characters. When `C = 0` and there are no fixed
      lessons the planner raises `PlanInputError("no_text")` (a scanned PDF without a text layer). The free lesson
      count target is `K = max(1, min(days_left − (G − 1), P))` (no target is computed when `G = 0`). [unit]
  - id: FR-PLAN-4
    text: >-
      **Packing (exact).** The free intervals' pages, in page order, form one sequence; `cum(p)` is the sum of
      `page_chars` from its start through page p. For j = 1..K−1 the target is `t_j = ceil(j × C / K)` (integer:
      `(j × C + K − 1) // K`). The cuts are made in three steps:
      1. target cut j falls after the first page p with `cum(p) ≥ t_j`;
      2. a target cut is dropped when it falls at or before the previous kept target cut, or when no page with more
         than 0 characters lies after it and up to the last page of its free interval (so a cut never leaves a
         0-character tail as a lesson of its own);
      3. each free interval's last page is a cut.
      The lessons are the page runs between consecutive cuts (the duplicates of step 1 and 3 counted once). So every
      free lesson holds at least one page with more than 0 characters: a run of 0-character pages joins the lesson
      that follows it, and a trailing run joins the interval's last lesson. Fixed lessons are inserted verbatim between
      the free intervals. There is no separate cap on the lesson count: `new_count ≤ P ≤ page_count ≤ 5,000`
      (SRV-INGEST's page cap), and a plan that fits has `new_count ≤ days_left ≤ 728`. [unit, VEC-PLAN-1]
  - id: FR-PLAN-5
    text: >-
      **Lesson fields.** Each lesson has `id = "p<first>-<last>"` (decimal page numbers; a fixed lesson keeps its
      plan lesson id), `pages = [first, last]`, `chars`, `source_chars`, `minutes` (FR-PLAN-2), `fixed: bool`, and
      `title_entry`: outline entries with a null page are ignored and the rest are ordered by (page, seq) — a
      non-monotonic bookmark list is ordered by page, ties by outline order; the entry is the shallowest one whose
      page lies in the lesson (the first in that order on a tie), else the last entry before `first` in that order,
      else none. The caller attaches the title: the entry's title, followed by ` (pp. <first>–<last>)` when the entry
      lies before the lesson, or `pp. <first>–<last>` without an entry; cut to 200 characters (SRV-LESSON's title
      bound). Titles come from the outline rows and never enter a log, a hash or an error (INV-PLAN-4). [unit]
  - id: FR-PLAN-6
    text: >-
      **Re-planning.** A plan is recomputed from scratch for any change of inputs (weeks, minutes, rate, today).
      A course with a `study_plans` row is re-planned: `start_date` is the stored one (the deadline is kept, owner
      decision 4, decided by the coordinator for the owner) and `today` is the request's date; a changed `total_weeks` moves `end` from the stored start. A first
      plan has `start_date = today`. A lesson of the course is `started` when SRV-LESSON `started_lessons(conn,
      owner_id, course_id)` lists it (any row other than its `course_plans` row refers to it: a lesson revision, a
      compile run, a tutor row; FR-LESSON-15); preview and the removal in FR-PIPELINE-14 use the same function.
      Started lessons are `fixed`: their page ranges and plan lesson ids are kept verbatim and the planner packs only
      the free intervals between them, so a started lesson never changes its pages or its id, and its SRV-LESSON
      lesson is the same. Unstarted lessons are not stable: when a lesson starts, a later re-plan may shift the
      unstarted ones around it, and a shifted lesson gets a new id (`p<first>-<last>`) and a new SRV-LESSON lesson.
      [unit, db]
  - id: FR-PLAN-7
    text: >-
      **Summary.** `lesson_count` N (all lessons), `fixed_count` F and `new_count` (free lessons; the re-plan card
      shows "F started + K new"); `study_days` D; `start_date`, `end` and `days_left`; `minutes_mean` and
      `minutes_max` over the free lessons (rounded half up); `required_minutes` (sum of free lesson minutes);
      `spare_days = days_left − new_count` when it is above 0 (the preview says "this source fills <new_count> of
      <days_left> days");
      `finish_by = today + new_count − 1` days (one lesson a day; null when there are no free lessons), which is on or
      before `end` when the plan fits (not otherwise). `fits` is true when `days_left ≥ 1`, `new_count ≤ days_left`,
      every free lesson's cost ≤ T and every free lesson's `source_chars` ≤ `lesson_source_chars_max`; `reasons` lists
      the failed checks (`days` for the first two, `minutes`, `source_size`). Fixed lessons are outside the minutes and
      size checks (they stay as they are). When it does not fit, `suggest` gives `minutes_per_day`: the smallest value
      on the 5-minute grid above the current one and up to 240 whose plan fits with the same weeks, and
      `total_weeks`: the smallest value above the current one and up to 104 whose plan fits with the same minutes
      (with the same `start_date`, so on a re-plan past the deadline only more weeks can help); each is found by
      re-running the planner (fit is not assumed monotonic), and each is null when no candidate fits. [unit,
      VEC-PLAN-1]
  - id: FR-PLAN-8
    text: >-
      **Compile estimate** (an estimate from one measured lesson, never a budget; neither end of the range is a bound).
      Per lesson, in `decimal.Decimal`: `kchars = chars / 1000`; `low = kchars × L02_LOW_USD / L02_KCHARS`;
      `high = min(kchars × L02_HIGH_USD / L02_KCHARS, run_cap_usd)`, where `L02_LOW_USD = 1.2587` (the converged
      product run, REF-PLAN-4), `L02_HIGH_USD = 2.9714` (the dearest spike run, one loop, not converged),
      `L02_KCHARS = 58.938` (L02's span characters, spikes/study-rate step 1b), so $0.0214–0.0504 per 1,000
      characters, and `run_cap_usd` = SRV-PIPELINE's `bounds.run_cap_usd` (8.00): a compile stops at the cap, so a
      lesson's high end is the cap at most. `estimate` gives `course_low_usd` and `course_high_usd` (sums over the
      free lessons, unrounded, then rounded to cents half up), `first_lesson` `{low_usd, high_usd}` for the plan's
      first lesson (FR-PLAN-9's compile target), `run_cap_usd` and `basis: "L02"`, all as decimal strings with two
      decimals, plus `basis_kchars: "58.938"`, `mean_lesson_kchars` (the free lessons' mean, three decimals, half up)
      and `extrapolated: bool`, true when `mean_lesson_kchars` lies outside `estimate_band` × `basis_kchars`
      (0.5×–2×, a chosen band); with no free lessons `mean_lesson_kchars` is null and `extrapolated` is false — the pilot's 890 planned pages (1,841 kchars) over 12 weeks give about 22 kchars a
      lesson, about 0.37× the basis, so such an estimate is an extrapolation. The constants live in `reader.plan.params` with their sources; VEC-PLAN-2 pins
      them.
      **Hypothesis:** compile cost scales with source characters. Only L02 is measured; for the pilot's 1,841,091
      planned characters the line gives about $39–93; per-lesson fixed costs (prompts, the notebook skeleton) make
      short lessons dearer per character than this line says. V.cost-optimize re-measures. [unit, VEC-PLAN-2]
  - id: FR-PLAN-9
    text: >-
      **Routes** (`reader.plan.routes.ROUTES`; each needs a session, and the handler checks role `owner`, else 403
      `owner_only`, as SRV-INGEST FR-INGEST-15; bodies follow SRV-AUTH FR-AUTH-12):
      - `POST /api/plans/preview` with `{material_id, total_weeks, minutes_per_day, today, rate?}` (`material_id`
        a material id as `GET /api/materials` lists it; `rate` a decimal string with at most two decimals, default
        `study_minutes_per_kchar_default`) returns `{plan_sha256, inputs, lessons, summary, estimate}` and writes
        nothing. The material must be declared and imported (an `ingests` row), else 404 `not_found`. This module's
        own reader over SRV-INGEST's tables (as FR-PIPELINE-2) gives the pages,
        `reader.plan.store.page_chars(conn, owner_id, material_sha256) -> (ingest_id, chars, spans)` (per page
        1..`page_count`: `sum(char_length(text))` and `count(*)` of its spans, 0 for a page without spans), and the
        outline, `outline_entries(conn, owner_id, ingest_id) -> ((level, page | None, title), ...)` in seq order;
        both read only the owner's rows.
        `fixed` and the stored `start_date` come from the material's existing plan course, if any (FR-PLAN-6). `today`
        outside the server's UTC date ± `today_skew_days` is 400 `today`. `no_text` is 422 with that code.
      - `POST /api/plans/confirm` with the same fields plus `plan_sha256` and `compile_first: bool`. The course is
        `plan-<first 12 hex of the material sha256>`, titled with the material id (so lesson citations name the
        material as, for the pilot, "bashir-2025"; a display title is an uploaded-material defer). In one
        transaction it takes the
        course lock (`reader.pipeline.courses.lock_course(conn, owner_id, plan_course_id)`, FR-PIPELINE-14) and holds
        it across every following read and write:
        - **replay:** when the course's `study_plans` row has the request's `plan_sha256`, nothing is recomputed or
          imported, and the response lists the course's current plan lessons (a retry after a lost response gets the
          same lessons). The stored sha alone decides: the body's weeks, minutes, rate and today are not compared
          again (the sha's pre-image already holds them). The replay check runs before the `today` range check (only
          the body's shape is validated first), so a retry after a lost response that crosses midnight still replays;
        - otherwise it reads `fixed` and recomputes the plan; a different sha256 is 409 `plan_changed` with the new
          plan in the body (the learner confirms what they saw, never a plan that moved underneath); a plan that does
          not fit is 422 `does_not_fit`; else it calls SRV-PIPELINE `import_course_plan(conn, owner_id, plan, origin=
          "study_plan")` (which re-checks "not started" before each removal, inside this transaction) and upserts the
          `study_plans` row; `started_lesson_dropped` from the import (a lesson started between the read and the
          removal, impossible under the lock and kept as a guard) is 409 `plan_changed`.
        After the commit, with `compile_first`, the compile target is the plan's first lesson, and only when no lesson
        of the course has a compile run yet: `create_run(..., cap_usd=run_cap_usd, require_course_unstarted=True)`
        (FR-PIPELINE-15) checks that under the same course lock. `already_started`, `compile_running` and budget
        refusals are reported in the response and never undo the import. Returns `{course_id, plan_course_id,
        lessons: [{plan_lesson_id, lesson_id, ordinal}], created, removed, replayed: bool, compile: {run_id} |
        {error} | null}`.
      - `GET /api/plans?material_id=<id>` returns `{course_id, plan_course_id, inputs, plan_sha256, started}` (the
        stored inputs and the count of started lessons), for the re-plan form; 404 `not_found` for a material without
        a study plan (of this owner), which the page reads as "no plan yet"; a missing or repeated `material_id`
        query parameter is 400 `material_id`.
      Validation errors are 400 with the field's code (`total_weeks`, `minutes_per_day`, `rate`, `today`,
      `material_id`, `plan_sha256`, `compile_first`). [db]
  - id: FR-PLAN-10
    text: >-
      **Plan hash.** `plan_sha256` is the sha256 of the canonical JSON (sorted keys, separators `,` `:`, UTF-8) of
      `{inputs, lessons}` where `inputs` holds the material sha256, the ingest id, the resolved `rate_centi`, weeks,
      minutes, `start_date` and the clamped `today` (FR-PLAN-3's `max(today, start_date)`, so preview and confirm
      agree; VEC-PLAN-1 pins it), and `lessons` holds every lesson's id, pages and minutes. Titles and the fixed set are
      not in the pre-image: titles so that the hash carries no book text, the fixed set because it is derived state
      (the lessons it keeps are in the pre-image through their ids and pages). [unit]
  - id: FR-PLAN-11
    text: >-
      **Table.** Migration `reader/plan/migrations/plan_0001.py`, branch label `plan`, `depends_on` the pipeline
      branch's head: `study_plans(course_id uuid PRIMARY KEY, owner_id → users.id, plan_course_id text,
      material_sha256 text, ingest_id → ingests, total_weeks int, minutes_per_day int, rate_centi int, start_date date,
      plan_sha256 text, confirmed_at timestamptz)`, FK (course_id, owner_id) → courses (id, owner_id), UNIQUE
      (owner_id, plan_course_id), CHECKs for the bounds. `start_date` is written by the first confirm and never
      changed by a later one (FR-PLAN-6). The downgrade drops this table only. [db]
  - id: FR-PLAN-12
    text: >-
      **Logging.** Preview and confirm log one structured line each: event, material sha256 prefix (12 hex),
      lesson_count, fits, plan_sha256 prefix, duration_ms, and for confirm `replayed`, the created and removed lesson
      counts and whether a compile run was created. [unit]
  # Amendment (2026-11-23, V/compile-ui, for WEB-UI FR-UI-15): the owner's Compile confirm shows a per-lesson
  # estimate. No existing route gives a lesson's characters (`GET /api/lessons` has none; the preview's lessons carry
  # pages and minutes only, and a re-plan may move unstarted lessons), so this one read-only route is added.
  - id: FR-PLAN-13
    text: >-
      **Per-lesson estimate.**
      - **The function** `reader.plan.estimate.lesson_estimate(chars: int) -> dict` (pure, `decimal.Decimal`)
        returns `{kchars, low_usd, high_usd, run_cap_usd, basis, basis_kchars, extrapolated}`: `low_usd` and
        `high_usd` are FR-PLAN-8's per-lesson `low` and `high` of `chars` (the same functions, the high end at most
        `run_cap_usd`), rounded to cents half up; `kchars` is `chars / 1000` with three decimals, half up;
        `run_cap_usd`, `basis` ("L02") and `basis_kchars` as FR-PLAN-8; `extrapolated` is true when `chars / 1000`
        lies outside `estimate_band` × `basis_kchars` (29.469–117.876, inclusive). [unit]
        server/tests/plan/test_lesson_estimate.py, vectors: 29,468 → extrapolated true; 29,469 → false; 117,876 →
        false; 117,877 → true; 58,938 → "1.26"–"2.97", false; 200,000 → kchars "200.000", low "4.27", high "8.00"
        (the cap), true; 0 → "0.000", "0.00"–"0.00", true; and for every vector, FR-PLAN-8's `first_lesson` of a
        one-lesson plan of the same characters gives the same low and high.
      - **The characters** `reader.plan.store.lesson_chars(conn, owner_id, lesson_id) -> int | None`: for one of the
        owner's lessons that has a `course_plans` row of that owner (SRV-PIPELINE FR-PIPELINE-1, both origins, so the
        pilot's manifest lessons too), the sum of `char_length(text)` over the spans of that owner's ingest of the
        row's material (`material_sha256`) on pages `pdf_first..pdf_last` (0 when there are none): the same per-page
        sum as FR-PLAN-9's `page_chars`, so for a study plan's lesson it equals that lesson's FR-PLAN-5 `chars`.
        None for a lesson without such a row or a material without an ingest. Every table is filtered by `owner_id`.
      - **The route** `GET /api/lessons/{lesson_id}/estimate` (in `reader.plan.routes.ROUTES`; a session; role
        `owner`, else 403 `owner_only`, as FR-PLAN-9) returns `{lesson_id}` plus `lesson_estimate(lesson_chars(…))`;
        a lesson id that is not a UUID, or `lesson_chars` None, is 404 `not_found`. Read-only: it writes nothing and
        starts nothing.
      [db] server/tests/plan/test_lesson_estimate_db.py pins the wiring: a planned lesson's answer equals
      `lesson_estimate` of its pages' characters (and, for the plan's first lesson, the preview's
      `estimate.first_lesson`); a manifest lesson; a lesson whose pages have no spans; rows of the same material and
      pages under a second owner id (a material with the same sha256, its ingest and spans with other text lengths,
      inserted before the owner's own, so they are the first rows a query without the owner filter would meet;
      `course_plans` cannot name another owner's lesson, its foreign key is (lesson_id, owner_id)) change nothing
      for the owner, and `lesson_chars` with the second owner's id is None; 404 for a non-UUID id, an
      unknown id and a lesson whose `course_plans` row is gone; 403 for a learner; no row written.

invariants:
  - id: INV-PLAN-1
    text: >-
      Determinism: for any valid input (Hypothesis: page counts 1–5,000, characters 0–20,000 and spans 0–60 per page,
      outlines of 0–3 levels with non-monotonic and null pages, any bounds-valid weeks, minutes and rate, 0–5 fixed
      ranges, `today` from `start_date` to past `end`), `plan` returns equal results on equal inputs, and its canonical
      JSON is byte-identical across two runs. [unit]
  - id: INV-PLAN-2
    text: >-
      Coverage: the lessons' page ranges are non-overlapping, in page order, and cover pages 1..`page_count` exactly,
      except the pages of 0-character free intervals (FR-PLAN-3); every fixed lesson appears verbatim with its id.
      Hypothesis property: no free lesson has 0 characters. [unit]
  - id: INV-PLAN-3
    text: >-
      Size and count: every free lesson has `chars ≤ ceil(C / K) + maxpage`, where `maxpage` is the largest
      `page_chars` among the free pages (so its cost ≤ `(ceil(C / K) + maxpage) × rate_centi // 100` milli-minutes);
      the free lesson count lies between `G` and `min(K + G − 1, P)` (bounds, not an equality: step 2 of FR-PLAN-4 may
      drop target cuts). `fits` holds exactly when FR-PLAN-7's checks hold, and `suggest.minutes_per_day` and
      `suggest.total_weeks`, when not null, give plans that fit. [unit]
  - id: INV-PLAN-4
    text: >-
      No book text in logs, hashes or errors: with a canary word in every outline title, the canary appears in no log
      record, no error body and not in `plan_sha256`'s pre-image. [unit, db]
  - id: INV-PLAN-5
    text: >-
      Confirm is idempotent and safe to repeat and to race:
      (a) confirming the same body twice leaves one `study_plans` row and the same `course_plans` rows and lesson ids;
      the second response has `replayed: true`;
      (b) retry after a lost response: a confirm with `compile_first` that committed and started a run, repeated with
      the same body, returns the same lessons, creates no second run (`compile: {error: "already_started"}`) and
      leaves exactly one run in the course;
      (c) race: a confirm that would remove an unstarted lesson and `create_run` on that lesson, run concurrently on
      two connections, end in one of two states only — the run exists and the lesson is kept (the confirm answers
      409 `plan_changed`, or the run was created after the confirm's commit on a lesson it kept), or the lesson is
      removed and `create_run` raises `lesson_unknown` (404 at the route); never a run on a removed lesson, never a
      started lesson removed (the test's second half, run first and confirm second, is sequential, not concurrent);
      (d) a started lesson is never deleted, and after any re-plan the course's ordinals follow plan order. [db]

nfr:
  - id: NFR-PLAN-1
    metric: wall time of `POST /api/plans/preview` for the pilot (935 pages, 494 outline entries), including the suggestion search, ms, p95 over 20 calls
    threshold: 500
    verified_by: bench

vectors:
  - id: VEC-PLAN-1
    source: >-
      Hand-computed planner cases with synthetic page counts and outlines (no book text): an empty outline; an even
      spread of 10 pages over 7 days; a small source (3 pages with text, 14 days → 3 lessons and "fills 3 of 14");
      a run of 0-character pages inside and at the end; a 0-character free interval between two fixed lessons; a
      large single page that drops a cut; a plan that does not fit by minutes with its two suggestions; one that does
      not fit by source size (rate 0.10) with a weeks suggestion only; `no_text`; a re-plan with two fixed lessons
      separated by a one-page free gap and a changed minutes value; round-2 cases: page characters `(1, 100, 0)`
      with D ≥ 2 (one lesson, the 0-character tail is not a lesson), `(1, 100)` with D = 2 (one lesson), and the gap
      case `(10, 0) | fixed | (10)` (two free lessons, none of 0 characters); a re-plan on day 80 of 84 (12 weeks)
      with 80 started lessons (days_left 5, "80 started + K new", finish by ≤ end) and one past the deadline
      (days_left < 1: `does_not_fit`, reason `days`, a weeks suggestion only); round-3 cases: 104 weeks on a
      728-page source, first plan, lesson 1 then fixed (started by the compile), and a same-day re-plan (727 new
      lessons over 728 days left; fits, no error), and a re-plan with `today` one day before the stored
      `start_date` (counted as `start_date`, days_left = D); code-review cases: page characters (1, 1, 1), 1 week,
      today = start + 5 (days_left 2, t1 = ceil(3/2) = 2 → [1-2], [3]; a floor would give [1], [2-3]), and five
      pages of 10 with fixed p2-2 and p4-4, 1 week, today = start + 5 (three free intervals over 2 days left: does
      not fit, reason `days`, suggest 2 weeks only). Each case gives the expected lesson ranges, minutes, summary
      and finish date.
    file: spec/fixtures/SRV-PLAN/planner-cases.yaml
  - id: VEC-PLAN-2
    source: >-
      Cost constants and their sources (REF-PLAN-4, spikes/study-rate), plus three estimate cases: L02's own range
      (expected low 1.26, high 2.97, `extrapolated: false`), a 1,000-kchar course, a lesson whose high estimate is cut
      at the $8.00 run cap, and the band's edges (mean lesson 29.469 and 117.876 kchars not extrapolated; 29.468 and
      117.877 extrapolated).
    file: spec/fixtures/SRV-PLAN/cost-basis.yaml

defers:
  - "An agent-proposed plan (ADR-0009 stage 2: lesson objectives, labs, the order of chapters); the slice cuts by volume only."
  - "Cutting at section or chapter starts (the exact even spread is chosen for its testable bound)."
  - "Study days per week other than 7, rest and review days, and the implementation intention's time and place (ADR-0010 resolved question 1)."
  - "Per-kind rates (code, formulas, tables), a per-learner rate learnt from session timings (spike study-rate step 2), and a configurable default rate in reader.yaml."
  - "A schedule of which lesson falls on which date and its notifications (ADR-0010 Notifier)."
  - "Choosing chapters or a page range instead of the whole material."
  - "Uploaded materials (ADR-0029): their display title and the upload's `ready` state; this spec plans declared, imported materials."

owner_notes:
  - "1. The default study rate comes from your own pilot plan: 81 theory hours for the 890 PDF pages of the 23 lessons, i.e. 5.46 min per page or 2.64 min per 1,000 characters of the stack's spans (spikes/study-rate step 1b). Per stage it ranges from 1.40 to 5.30. For comparison, plain silent reading of English non-fiction is 238 words a minute (Brysbaert 2019), about 1.3 min for a median pilot page. You can change the rate per plan in the form's 'Study pace'."
  - "2. As you decided: every day is a study day, the source is spread evenly over all of them, and no day's lesson is longer than your minutes per day. The estimate counts reading time only; labs and review are not included. Your own plan budgets 349 sessions (theory plus code, +20 %) against about 81 reading days."
  - "3. The compile estimate scales one measured lesson (L02: $1.26 converged, up to $2.97 in the spike, 58,938 characters) by characters. It is a range, not a promise, and neither end is a bound; each compile still stops at your $8.00 cap. Spread over your days, lessons are usually much shorter than L02 (the pilot over 12 weeks: about 22,000 characters, 0.37× L02); per-lesson fixed costs then make the real cost per lesson likely higher than the range, and the page says so whenever the mean lesson is outside 0.5×–2× of L02."
  - "4. A re-plan keeps your deadline: the start date of your first plan stays, started lessons stay as they are, and the rest of the source is spread over the days left until the deadline. Past the deadline the page suggests more weeks; changing the weeks moves the deadline from the original start. A lesson you start ahead of its calendar day takes no day, so compiling ahead leaves more days for the rest. This rule was decided by the coordinator for you (owner decision 4); you can overrule it, for example to restart the deadline from the re-plan day."
  - "5. Confirm with 'compile lesson 1' spends credit (about the first lesson's estimate) under your existing compile cap and monthly budget; the checkbox shows the amount."

review: "deep-reviewer (Fable), 2026-11-23. Round 1 on 62a86b2: changes — B11 confirm idempotency (fixed out of the hash, first-lesson compile target only while the course has no run, lost-response retry), B12 one course lock across fixed/hash/import shared with create_run, B13 uncompilable lessons (source size cap with header bound, no_text, zero-character pages merged), B14 exact packing with a testable bound; non-blocking applied. Round 2 on 7b074ca's parent: B11/B12 closed (no deadlock); changes — cut rule left 0-character lessons in 8,385 of 20k simulations (step 2 drops tail cuts; count bounds replace the equality), re-plan keeps the deadline (owner decision 4, decided by the coordinator), cost extrapolation flag; non-blocking applied. Round 3 on 7b074ca: changes — lessons_max dropped (a 104-week re-plan raised it), today clamped to the stored start; non-blocking applied (replay before the today check, null mean lesson, wording, owner note). Round 4 on d9f655a: VERDICT approve. Red pins that FR-PLAN-10's pre-image uses the clamped today (preview and confirm agree). Approved by agent. Green (2026-11-23): one Red oracle was a hand error and is corrected — the hash test's pages (1000, 2000, 3000) pack into [1-2], [3] (t1 = 2000 is reached on page 2; t2 = 4000 on page 3, the interval's end, is dropped), not [1], [2], [3]; no requirement changed. Code review of e244aa4 (changes): VEC-PLAN-1 adds the ceil-vs-floor and `days`-reason cases; [db] tests pin that confirm and the manifest route wait for the course lock, owner-only on confirm and GET with nothing written, and the store's owner filters; INV-PLAN-5(c) names `lesson_unknown` and marks the race test's second half sequential; the live check restores an existing owner plan; the confirm UI fix is WEB-PLAN's. Code review round 2 on a8a0408: VERDICT approve, every mutant killed. Before the merge: the live check previews the owner's stored inputs first and skips its mutating steps when that plan does not fit today, so the restore cannot fail halfway (fake-tested). Amendment 2026-11-23 (V/compile-ui): FR-PLAN-13, a read-only per-lesson estimate route for WEB-UI FR-UI-15's Compile confirm, reusing FR-PLAN-8's functions. Round 1 (cc817d0, changes): a pure `lesson_estimate(chars)` with band-edge and cap vectors, `lesson_chars` with owner filters pinned by a second owner's rows; the [db] test pins only the wiring. Round 2 on 08534df: VERDICT approve (deep-reviewer, run by the coordinator). Approved by agent. Code review (2026-11-24, on cb81aff): VERDICT approve; the owner-filter test now inserts the second owner's material first."
