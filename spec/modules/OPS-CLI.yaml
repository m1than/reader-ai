# Test levels. [unit]: pytest with a fake process runner (records argv, env, stdin, extra descriptors, timeouts and the
# call order), a fake keyring, a temporary HOME and runtime directory; no docker daemon. Fake-runner cases include
# FR-CLI-8's order (build, T0, resolve, watcher, readiness byte, `up -d`; no `up -d` when the byte is missing),
# VEC-CLI-4 (a foreign-project event causes no `docker exec`) and INV-CLI-9 (bootstrap). [live]: e2e/live/stage-1.sh
# against `reader up` on the owner's Mac. Live items: FR-CLI-8/10 (re-delivery after `docker compose restart api`;
# `reader up` returning with health), FR-CLI-7 (fail closed after `reader watcher stop`, which the roadmap's stage-1
# script uses), FR-CLI-16 (trust and `down --untrust`: owner-run, needs the owner's password), FR-CLI-17/18 (the
# backup-restore drill, the stage-1 exit: back up, restore onto a fresh pgdata and empty blobs, and check that the
# one-off containers read and write the 10001-owned blobs with `--user 10001:10001`, and caddy_config backup and
# restore as uid 0 with cap-drop ALL), and the ADR-0026 verified_by items OPS-CLI owns: no value in
# `docker inspect`, `docker export`, `docker events` since `reader up`, the Docker Desktop logs, or argv.
#
# Owner notes:
# - The watcher is a detached background process (FR-CLI-8), because live-check scripts call `reader up` and continue.
# - The DB password item is renamed: the owner named "Keychain item reader-ai/postgres"; this spec uses service
#   `reader-ai-system`, account `postgres`, so `reader secrets set` (service `reader-ai`) can never overwrite it.
# - `reader doctor` reads hostfile secrets to check them (FR-CLI-15); each value is discarded at once.
# - `op` runs with the allow-listed environment (FR-CLI-11), so `OP_*` variables (service-account or session tokens)
#   are dropped: `secret://op/…` works only through the 1Password desktop-app integration. `reader doctor` reports it.
# - Backups are unencrypted (FR-CLI-17); the directory is the owner's choice (ADR-0012), for example an encrypted volume.
# - ADR-0012's backup folder "set in reader.yaml" is deferred: a future SRV-CONFIG task adds the field, and then
#   `reader backup` may default to it.
# - After editing reader.yaml, run `reader up` again, and `reader down` first if the edit touched nothing Compose
#   renders: the single-file bind (FR-CLI-4) keeps the old inode, so running containers do not see an editor's
#   replace-on-save, and `up -d` recreates only containers whose rendered configuration changed.
# - The host codes `tool_missing`, `tool_failed`, `keychain_denied`, `keychain_locked` and `not_deliverable` should join
#   SRV-CONFIG FR-CONFIG-8's list at its next change.
# - `reader bootstrap` puts the short-lived bootstrap token in `open`'s argv (FR-CLI-21); the token's lifetime and
#   single use are SRV-AUTH's.
# - The pair-pool size is not a reader.yaml field; v1 keeps OPS-DEPLOY's static `kernel-pair-1`.
# - The power assertion (`caffeinate`) from the roadmap's risk table belongs to the job runner (stage 2+), not here.
