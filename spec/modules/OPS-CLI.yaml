# OPS-CLI — the host CLI `reader` that starts, watches and maintains the stack on the owner's Mac (stage 1).
#
# Declared deviations:
# - docs/roadmap.md's OPS-CLI row says values reach Compose "only as environment of the child process". Accepted
#   ADR-0026 (option A, the owner's choice) replaces that: no value enters Compose. `reader up` hands the resolved values
#   to a watcher process that writes each into the consumer's tmpfs /run/secrets over `docker exec -i` stdin.
# - The row's separate `reader untrust` becomes `reader down --untrust` (ADR-0024). `reader trust` is kept for an
#   explicit owner-run trust; `reader up` also offers it interactively.
# - ADR-0012 says the backup folder is "set in reader.yaml". In stage 1 `reader backup DIR` takes DIR as a required
#   argument; the reader.yaml field is a future SRV-CONFIG task (owner note below).
#
# Dependencies: SRV-CONFIG (merged: load_config, SecretRef, Secret, SecretResolutionError, SECRET_MAX_BYTES,
# secret_file_name, host_registry, ResolverRegistry); OPS-DEPLOY (merged, #27: deploy/compose.yaml with a top-level
# `name`, the `x-kernel` template, FR-DEPLOY-10 b's consumers, the backup labels, VEC-DEPLOY-3); SRV-AUTH (approved,
# branch 1/S1.SRV-AUTH: `reader-server bootstrap-link [--handle H]` and the bootstrap URL that `reader bootstrap` opens).
#
# Cross-spec item (open, V.OPS-CLI-kernels/agents, 2026-11-22): the `embed` service (SRV-SEARCH, ADR-0028) is not in
# deploy/compose.yaml yet: origin/V/V.SRV-SEARCH-min holds only its spec, and the coordinator's source branch
# origin/V/SRV-SEARCH-impl is not pushed. When OPS-DEPLOY adds it (default profile, own build), `reader up` builds
# and starts it with no OPS-CLI code change (step 1 builds every service with a build section); it is not a secret
# consumer (FR-CLI-5).
#
# Review policy (owner, 2026-11-20): this module handles secrets, so it keeps full deep-reviewer review until approve.

id: OPS-CLI
title: Host CLI `reader` — up/down/status with the secret-delivery watcher, bootstrap, doctor, secrets set, trust, backup/restore
status: approved
approved_by: agent
approved_at: 2026-11-20
review: "deep-reviewer (Fable), 2026-11-20. Spec round 1 changes (B1–B10: names from the rendered model, fd-3 hand-off, allow-listed env, DB password item and generation rule, events --since plus reconcile and flock liveness, config-free commands, default profile, ADR-0024 trust, x-kernel from source, codes and bounds, backup/restore). Round 2 changes (backup DIR required, Compose major check, event label trust, 15 s stop, fd-4 readiness; plus reader bootstrap added). Round 3 changes (backup uid, bootstrap token never in exceptions with timeouts; plus reader.yaml bind added). Round 4 approve (97b422e), non-blocking items applied. Delta 97b422e..5c15d21 (caddy_config back in backup and restore per ADR-0012 and ADR-0024; one-off uid is the mounting services' common user or 0:0) confirmed: approve. Approved with the Red tests after OPS-DEPLOY merged (#27); paired additions at approval: `reader bootstrap --handle` (SRV-AUTH FR-AUTH-4) and the exact pg_dump/pg_restore/psql argv of FR-CLI-17/18 (role and database `postgres`). Amended with code review round 1 (H2, tests in the same commit): one-offs `--entrypoint \"\"` and timeouts (FR-CLI-17/18), stops inside the try, restore ignores alembic_version, `op read` 120 s, keychain_unavailable, failed reconcile counts as a failed subscription, T0 kept, count reset after a 4 s stream, lock retry and SIGKILL waits (FR-CLI-7), INFO log with the failing label (FR-CLI-9), interruptible waits and coded errors (FR-CLI-20). Amended 2026-11-22 for V.OPS-CLI-kernels and V.OPS-CLI-agents (FR-CLI-4 bind to agent-proxy, FR-CLI-5 profiles, FR-CLI-8 step 0; paired with OPS-DEPLOY FR-DEPLOY-5 and VEC-DEPLOY-3); deep-reviewer review pending (secrets: full). Paired change 2026-11-24 (SRV-OBS, ADR-0032 accepted): FR-CLI-22
  (profile `observability`, the 8443 port in the override, the traces line, the doctor gate check); reviewed in
  SRV-OBS's code review."
layer: ops
track: engineering
adr: [ADR-0011, ADR-0012, ADR-0020, ADR-0022, ADR-0023, ADR-0024, ADR-0025, ADR-0026]

