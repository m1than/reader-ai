# SRV-CONFIG — reader.yaml: typed settings, JSON Schema, secret references, the container secret path (ADR-0011).
#
# Scope split with OPS-CLI (docs/roadmap.md stage 1): this module parses every `secret://` scheme, defines the resolver
# registry, the `Secret` value type and the one function that names a reference's file under /run/secrets/. It provides
# the `env`, `file` and `host-resolved` resolvers. OPS-CLI resolves `hostfile`, `keychain` and `op` on the host, writes
# the values to /run/secrets/<secret_file_name(ref)> for Compose, and owns `reader doctor`.
#
# Dependencies: redaction of secrets in the shared logger and the event serializer belongs to SRV-OBS and SRV-EVENTS.
# This module only guarantees that its own objects, errors and log calls never carry a secret or an input scalar.
#
# Red phase: tests import the module inside each test body, so that each test fails on its own assertion, not on a
# collection-time ImportError.

id: SRV-CONFIG
title: reader.yaml settings, JSON Schema export, secret references and the container secret path
status: draft
approved_by: null
approved_at: null
layer: server
track: engineering
adr: [ADR-0011, ADR-0006, ADR-0012, ADR-0017, ADR-0020]

paths:
  - server/src/reader/config/**
  - server/tests/config/**

normative:
  - id: REF-CONFIG-1
    title: ADR-0011 — Declarative reader.yaml with secret references resolved per platform
    url: docs/adr/0011-config-and-secrets.md
  - id: REF-CONFIG-2
    title: Pydantic v2 — JSON Schema generation (model_json_schema)
    url: https://docs.pydantic.dev/latest/concepts/json_schema/
  - id: REF-CONFIG-3
    title: JSON Schema, draft 2020-12 (the dialect Pydantic v2 emits)
    url: https://json-schema.org/draft/2020-12
  - id: REF-CONFIG-4
    title: YAML 1.2.2 specification (reader.yaml syntax)
    url: https://yaml.org/spec/1.2.2/
  - id: REF-CONFIG-5
    title: "ruamel.yaml 0.19.1 — YAML 1.2 parser; round-trip loader keeps line/column positions (PyPI, released 2026-01-02, Python 3.14 classifier)"
    url: https://pypi.org/project/ruamel.yaml/
  - id: REF-CONFIG-6
    title: "ADR-0020 — Toolchain baseline, Python 3.14 (accepted by the owner 2026-11-20; status flip on branch 0/python-3.14, PR #14)"
    url: docs/adr/0020-toolchain-baseline.md

# Field table for reader.yaml v1. Paths use `.` for mapping keys and `[]` for list items. "Required" is within the parent.
# A missing required key is reported at the line where its parent mapping node starts (its first key in block style,
# its `{` in flow style). `sectors` and `sharing` are opaque here and outside INV-CONFIG-1.
fields:
  - { path: version, type: "int (strict, no coercion from str or float)", required: true, constraint: "== 1" }
  - { path: instance, type: mapping, required: true, constraint: "keys: url, data_dir" }
  - { path: instance.url, type: str, required: true, constraint: "absolute https URL" }
  - { path: instance.data_dir, type: path, required: true, constraint: "lexical, see FR-CONFIG-9" }
  - { path: users, type: "list of mapping", required: false, constraint: "handles unique" }
  - { path: "users[].handle", type: str, required: true, constraint: "non-empty" }
  - { path: "users[].role", type: str, required: true, constraint: "non-empty, open set" }
  - { path: "users[].providers", type: "list of mapping", required: false, constraint: "" }
  - { path: "users[].providers[].kind", type: str, required: true, constraint: "non-empty, open set" }
  - { path: "users[].providers[].token", type: SecretRef, required: true, constraint: "FR-CONFIG-5" }
  - { path: tasks, type: "mapping of open keys to mapping", required: false, constraint: "keys non-empty" }
  - { path: "tasks.*.model", type: str, required: true, constraint: "non-empty, open set" }
  - { path: "tasks.*.budget_usd_per_lesson", type: Decimal, required: false, constraint: "finite, > 0" }
  - { path: budgets, type: mapping, required: false, constraint: "" }
  - { path: budgets.monthly_usd, type: Decimal, required: true, constraint: "finite, > 0" }
  - { path: budgets.warn_at, type: Decimal, required: false, constraint: "finite, 0 < x <= 1" }
  - { path: kernels, type: "list of str", required: false, constraint: "non-empty items, unique" }
  - { path: materials, type: "list of mapping", required: false, constraint: "ids unique" }
  - { path: "materials[].id", type: str, required: true, constraint: "non-empty" }
  - { path: "materials[].file", type: path, required: true, constraint: "lexical, see FR-CONFIG-9" }
  - { path: "materials[].sha256", type: str, required: true, constraint: "64 lowercase hex characters" }
  - { path: "materials[].license", type: str, required: true, constraint: "non-empty" }
  - { path: "materials[].language", type: str, required: true, constraint: "non-empty, open set" }
  - { path: sectors, type: "opaque mapping", required: false, constraint: "any; schema owned by later specs (ADR-0016/0017)" }
  - { path: sharing, type: "opaque mapping", required: false, constraint: "any; schema owned by later specs (ADR-0016)" }

requirements:
  # Loading and validation
  - id: FR-CONFIG-1
    text: >-
      `load_config(path)` reads reader.yaml and returns an immutable `ReaderConfig` (Pydantic v2) with exactly the fields
      of the field table. Every key not in the table is rejected, except inside the opaque `sectors` and `sharing`.
  - id: FR-CONFIG-2
    text: >-
      `version` is a strict integer equal to 1. A string, float or any other integer fails; there is no coercion.
  - id: FR-CONFIG-3
    text: >-
      Validation failures raise one `ConfigError` holding the list of all problems, ordered by line, then by key path.
      Each problem is (file, line, key path, code) and renders as `<file>:<line>: <key.path>: <code>: <fixed message>`.
      The line comes from the YAML source positions. A missing required key uses the line where its parent mapping node
      starts.
  - id: FR-CONFIG-4
    text: >-
      `export_json_schema()` returns the JSON Schema of `ReaderConfig` generated by Pydantic. The committed copy
      `server/src/reader/config/reader.schema.json` is produced by
      `uv run python -m reader.config.schema > src/reader/config/reader.schema.json` (run in server/). A test parses both
      and compares them as JSON values.
  - id: FR-CONFIG-5
    text: >-
      `SecretRef` accepts a string if and only if it fully matches the grammar of exactly one scheme, with no
      surrounding whitespace and no trailing newline (full match, not line match):
      `secret://env/NAME` with NAME `[A-Za-z_][A-Za-z0-9_]*`;
      `secret://file/run/secrets/NAME` with NAME `[A-Za-z0-9._-]+` other than `.` and `..`, meaning the absolute path
      `/run/secrets/NAME`;
      `secret://hostfile/S1/.../Sn` with n >= 1, meaning the absolute path `/S1/.../Sn`;
      `secret://keychain/SERVICE/ACCOUNT`;
      `secret://op/VAULT/ITEM/FIELD`.
      A segment S, SERVICE, ACCOUNT, VAULT, ITEM or FIELD is one or more characters other than `/`, `%`, NUL and other
      C0 control characters, and is not `.` or `..`. The prefix `secret://` and the scheme are lowercase.
      Percent-encoding is not decoded; `%` is rejected.
  - id: FR-CONFIG-6
    text: >-
      `resolve(ref, registry)` returns a `Secret` for a `SecretRef` through the resolver registered for its scheme.
      This module provides three resolvers. `env` reads the calling process's environment; it is meant for the host
      CLI and tests, not for containers. `file` reads `/run/secrets/NAME` under FR-CONFIG-13. `host-resolved` is for
      containers: for an `env`, `hostfile`, `keychain` or `op` reference it reads
      `/run/secrets/<secret_file_name(ref)>` under FR-CONFIG-13. The container composition registers `file` and
      `host-resolved`; the host CLI registers `env` and its own host resolvers. A scheme with no registered resolver
      fails with `SecretResolutionError`, code `no_resolver`.
  - id: FR-CONFIG-7
    text: >-
      `ResolverRegistry` is built once from a mapping of scheme to resolver and is immutable afterwards. A scheme
      outside the five ADR-0011 schemes, or a scheme given twice, raises `ValueError`.
  - id: FR-CONFIG-8
    text: >-
      Resolution failures raise `SecretResolutionError(ref, code)` with a fixed code: `no_resolver`, `env_unset`,
      `not_found`, `not_regular_file`, `outside_root`, `too_large`, `not_utf8` or `empty`. It is raised `from None`,
      carries neither the underlying exception text nor any byte of the value, and has `__cause__` and
      `__suppress_context__` such that no chained exception is rendered.
  - id: FR-CONFIG-9
    text: >-
      Relative paths in `instance.data_dir` and `materials[].file` resolve lexically against the directory of the
      reader.yaml file: no `~` expansion, no existence check, no filesystem access, no symlink resolution.
  - id: FR-CONFIG-10
    text: >-
      Value constraints of the field table hold: `materials[].sha256` is 64 lowercase hex characters; budgets are finite
      Decimals greater than 0 (NaN and infinities fail); `warn_at` is in (0, 1]; handles, material ids and kernels are
      unique within their list.
  - id: FR-CONFIG-11
    text: >-
      `ConfigError` never contains a scalar from the input file. Each problem carries only the file path, line, key path
      and a fixed code with its fixed message. Key paths of unknown keys are reported as the parent path plus
      `<unknown key #k>`, with the key's 1-based position k in its mapping, not its text. The error is raised `from None`, and no parser or
      Pydantic exception is chained.
  - id: FR-CONFIG-12
    text: >-
      `Secret` wraps a resolved value. `__repr__`, `__str__` and `__format__` (any format spec) render a fixed mask.
      `json.dumps`, `pickle.dumps`, `copy.copy` and `copy.deepcopy` either raise `TypeError` or produce the mask, never
      the value. `reveal()` is the only accessor that returns the plaintext.
  - id: FR-CONFIG-13
    text: >-
      The `file` and `host-resolved` resolvers read only below a root, `/run/secrets/` by default and injectable for
      tests. The normalised path must stay under the root (`outside_root`) and be a regular file (`not_regular_file`).
      At most `SECRET_MAX_BYTES` bytes are read; a longer file fails with `too_large`. Content must be UTF-8
      (`not_utf8`) and non-empty after stripping one trailing newline (`empty`).
      `SECRET_MAX_BYTES` is a structural bound for a bounded read, not a measured limit. Its value, 65536, is far above
      the provider token measured in this project (108 characters, spikes/agent-sdk-container, 2026-11-20).
  - id: FR-CONFIG-14
    text: >-
      `secret_file_name(ref)` is the single, deterministic map from an `env`, `hostfile`, `keychain` or `op` reference to
      its file name under /run/secrets/: `<scheme>-<first 32 hex characters of sha256(UTF-8 bytes of the reference)>`.
      It is shared with OPS-CLI, which writes the values under these names on `reader up`. For a `file` reference it
      raises `ValueError`, because that reference already names its file.
  - id: FR-CONFIG-15
    text: >-
      Load failures raise `ConfigError` with a fixed code, plus `file:line` where the parser reports a line:
      missing or unreadable file (`file_unreadable`); content not UTF-8 (`not_utf8`); YAML syntax error (`yaml_syntax`);
      empty document (`empty_document`); top-level node not a mapping (`not_mapping`); duplicate key (`duplicate_key`);
      any explicit tag (`tag_not_allowed`). The loader is ruamel.yaml (YAML 1.2) in round-trip mode for source positions.
      Duplicate keys are rejected and no object is constructed beyond YAML core scalars, mappings and sequences.
  - id: FR-CONFIG-16
    text: >-
      This module's own log calls never include a resolved value or an input scalar; they log references, codes and key
      paths only. Redaction in the shared logger and event serializer is a dependency on SRV-OBS and SRV-EVENTS.

invariants:
  - id: INV-CONFIG-1
    text: >-
      `SecretRef` accepts a string if and only if FR-CONFIG-5's grammar fully matches it. Property test over arbitrary
      text and over near-misses generated from valid references: case changes, inserted or removed `/`, empty, `.` and
      `..` segments, NUL, a trailing newline, `%`, extra and missing segments. Excludes the opaque `sectors` and
      `sharing`.
  - id: INV-CONFIG-2
    text: >-
      A resolved secret never leaks. A unique canary value is resolved through each resolver, and the canary is
      absent from:
      `str`, `repr` and `format` of every `Secret`, config, registry and error object;
      `traceback.format_exception` of every error;
      a traceback rendered with locals (`traceback.TracebackException(..., capture_locals=True)`), including a failure
      raised after the value was read, and a `file` secret with invalid UTF-8 that contains the canary;
      JSON, pickle and copy outputs of a `Secret`;
      log records emitted by this module.
  - id: INV-CONFIG-3
    text: >-
      An input scalar never leaks. A canary literal planted (a) in a `SecretRef` field, (b) under an unknown key and
      (c) on a syntactically broken line is absent from `str`, `repr` and `traceback.format_exception` of the
      resulting `ConfigError`. Its `__cause__` and `__context__` render nothing.
  - id: INV-CONFIG-4
    text: >-
      `load_config` never resolves secrets: it performs no environment, keyring or network access, and reads no file
      other than the reader.yaml it was given.
  - id: INV-CONFIG-5
    text: >-
      Loading is idempotent. Loading the same valid reader.yaml twice yields equal `ReaderConfig` values (property test
      over generated valid configs).
  - id: INV-CONFIG-6
    text: >-
      `secret_file_name` is deterministic, depends only on the reference string, and always matches
      `(env|hostfile|keychain|op)-[0-9a-f]{32}`.

nfr: []

vectors:
  - id: VEC-CONFIG-1
    source: ADR-0011 example reader.yaml (docs/adr/0011-config-and-secrets.md, "Example"); must load with no errors
    file: spec/fixtures/SRV-CONFIG/reader.example.yaml
  - id: VEC-CONFIG-2
    source: "Hand-written invalid configs with the exact expected error list (line, key path, code)"
    file: spec/fixtures/SRV-CONFIG/invalid/cases.yaml
  - id: VEC-CONFIG-3
    source: "Hand-written SecretRef grammar cases, accept or reject (FR-CONFIG-5)"
    file: spec/fixtures/SRV-CONFIG/secret-refs.yaml
  - id: VEC-CONFIG-4
    source: "Hand-written load failures (FR-CONFIG-15), byte-exact inputs as base64 where YAML cannot carry them"
    file: spec/fixtures/SRV-CONFIG/load-failures.yaml

# Owner notes (not requirements):
# - ADR-0011's revisit_when says "any of the four reference schemes"; its table lists five. Wording fix for the owner.
# - ADR-0011's table lists `env` as resolved "inside containers, the server". This spec decides that containers get
#   every non-`file` secret through /run/secrets/ (`host-resolved`), and `env` serves the host CLI and tests. This
#   matches the stage-1 live check ("no env secrets") and should be reflected in ADR-0011 by the owner.
