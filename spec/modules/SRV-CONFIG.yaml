# Field table for reader.yaml v1. Paths use `.` for mapping keys and `[]` for list items. "Required" is within the parent.
# A missing required key is reported at the line where its parent mapping node starts (its first key in block style,
# its `{` in flow style). Keys under `tasks` are open: errors name them by position (`tasks.<key #k>`), not by text.
# `sectors` and `sharing` are opaque mappings of core-schema values; they are outside INV-CONFIG-1.
fields:
  - { path: version, type: "int (YAML int only)", required: true, constraint: "== 1" }
  - { path: instance, type: mapping, required: true, constraint: "keys: url, data_dir" }
  - { path: instance.url, type: str, required: true, constraint: "absolute https URL with a host; no whitespace" }
  - { path: instance.data_dir, type: path, required: true, constraint: "non-empty; lexical, see FR-CONFIG-9" }
  - { path: users, type: "list of mapping", required: false, constraint: "handles unique" }
  - { path: "users[].handle", type: str, required: true, constraint: "non-empty" }
  - { path: "users[].role", type: str, required: true, constraint: "non-empty, open set" }
  - { path: "users[].providers", type: "list of mapping", required: false, constraint: "" }
  - { path: "users[].providers[].kind", type: str, required: true, constraint: "non-empty, open set" }
  - { path: "users[].providers[].token", type: SecretRef, required: true, constraint: "FR-CONFIG-5" }
  - { path: tasks, type: "mapping of open keys to mapping", required: false, constraint: "keys non-empty strings" }
  - { path: "tasks.*.model", type: str, required: true, constraint: "non-empty, open set" }
  - { path: "tasks.*.budget_usd_per_lesson", type: Decimal, required: false, constraint: "YAML number only; finite, > 0", note: "spent per compile run, not per lesson over time (SRV-AGENT FR-AGENT-9, paired note 2026-11-22); the name stays for compatibility" }
  - { path: budgets, type: mapping, required: false, constraint: "" }
  - { path: budgets.monthly_usd, type: Decimal, required: true, constraint: "YAML number only; finite, > 0" }
  - { path: budgets.warn_at, type: Decimal, required: false, constraint: "YAML number only; finite, 0 < x <= 1" }
  - { path: kernels, type: "list of str", required: false, constraint: "non-empty items, unique" }
  - { path: materials, type: "list of mapping", required: false, constraint: "ids unique" }
  - { path: "materials[].id", type: str, required: true, constraint: "non-empty" }
  - { path: "materials[].file", type: path, required: true, constraint: "non-empty; lexical, see FR-CONFIG-9" }
  - { path: "materials[].sha256", type: str, required: true, constraint: "64 lowercase hex characters" }
  - { path: "materials[].license", type: str, required: true, constraint: "non-empty" }
  - { path: "materials[].language", type: str, required: true, constraint: "non-empty, open set" }
  - { path: sectors, type: "opaque mapping", required: false, constraint: "any core-schema value; schema owned by later specs (ADR-0016/0017)" }
  - { path: sharing, type: "opaque mapping", required: false, constraint: "any core-schema value; schema owned by later specs (ADR-0016)" }
  - { path: observability, type: mapping, required: false, constraint: "keys: enabled, retention_days (FR-CONFIG-17)" }
  - { path: observability.enabled, type: bool, required: false, constraint: "YAML boolean; default true" }
  - { path: observability.retention_days, type: "int (YAML int only)", required: false, constraint: "1..365; default 30" }

# Database tables (FR-CONFIG-26, migration `config_0001` on its own branch `config` in server/src/reader/config/migrations).
# A system table: no user owns a setting (INV-AUTH-8 reads `system: true`).
tables:
  settings_overrides: { system: true, columns: "key text pk, value jsonb NOT NULL, updated_by uuid NOT NULL (no FK, as audit_log.actor_id), updated_at timestamptz NOT NULL DEFAULT now(), version int NOT NULL CHECK (version >= 1)" }

requirements:
  # Loading and validation
  - id: FR-CONFIG-1
    text: >-
      `load_config(path)` reads reader.yaml and returns an immutable `ReaderConfig` (Pydantic v2) with exactly the fields
      of the field table. Every key not in the table is rejected, except inside the opaque `sectors` and `sharing`, which
      are kept as immutable trees of core-schema values. A non-finite float (`.inf`, `.nan`) anywhere inside them is
      rejected with `not_finite`, for consistency with the finite Decimals; keys inside them are named by position.
      The Pydantic models enforce the same field constraints, so `ReaderConfig.model_validate` cannot construct a
      config that `load_config` would reject, with two stated exceptions: the models accept a relative `data_dir` or
      `file` (only the loader joins paths), and `model_copy(update=...)` skips validation by Pydantic's design.
      Mappings are frozen dict subclasses and sequences are tuples, so `model_dump`, `model_dump_json`,
      `copy.deepcopy` and `pickle` of a `ReaderConfig` work and round-trip to an equal value. Should the loader's rules
      and the models ever disagree, `load_config` raises `ConfigError` with the code `model_rule_mismatch` at the
      root (no line, empty key path), `from None`; no Pydantic `ValidationError` leaves `load_config`.
  - id: FR-CONFIG-2
    text: >-
      `version` must be a YAML int equal to 1. A quoted string, a float, a boolean or any other integer fails; there is
      no coercion.
  - id: FR-CONFIG-3
    text: >-
      Validation failures raise one `ConfigError` holding the list of all problems, ordered by line, then by key path.
      Each problem is (file, line, key path, code) and renders as `<file>:<line>: <key.path>: <code>: <fixed message>`.
      The line comes from the YAML source positions. A missing required key uses the line where its parent mapping node
      starts. The validation codes are exactly: `unknown_key`, `missing_key`, `wrong_type`, `bad_version`,
      `not_secret_ref`, `bad_sha256`, `bad_url`, `empty_string`, `empty_key` (an empty task key), `out_of_range`,
      `not_finite`, `not_unique`, and `model_rule_mismatch` (FR-CONFIG-1). The load codes are in FR-CONFIG-15.
      `bad_url`: the value contains whitespace, a control character or a backslash; `urlsplit` raises `ValueError`
      (for example an unbalanced or invalid `[` host), or reading its `port` does (a non-numeric or out-of-range port);
      the scheme is not `https`; or there is no host name (`https://@`, `https://:443`).
  - id: FR-CONFIG-4
    text: >-
      `export_json_schema()` returns the JSON Schema of `ReaderConfig` generated by Pydantic. The generator writes the
      committed copy itself: `uv run python -m reader.config.schema --write` (run in server/) writes
      `server/src/reader/config/reader.schema.json`. A test parses both and compares them as JSON values.
  - id: FR-CONFIG-5
    text: >-
      `SecretRef` accepts a string if and only if it fully matches the grammar of exactly one scheme:
      `secret://env/NAME` with NAME `[A-Za-z_][A-Za-z0-9_]*`;
      `secret://file/run/secrets/NAME` with NAME `[A-Za-z0-9._-]+` other than `.` and `..`, meaning the absolute path
      `/run/secrets/NAME`;
      `secret://hostfile/S1/.../Sn` with n >= 1, meaning the absolute path `/S1/.../Sn`;
      `secret://keychain/SERVICE/ACCOUNT`;
      `secret://op/VAULT/ITEM/FIELD`.
      A segment S, SERVICE, ACCOUNT, VAULT, ITEM or FIELD is one or more characters other than `/` and `%`, and is not
      `.` or `..`. Any whitespace or control character anywhere in the string rejects it, defined as a character `c`
      with Python `c.isspace()`, or a code point below 0x20, or 0x7F; that includes a leading or trailing space, a tab,
      a newline, NUL and Unicode spaces such as U+00A0. The prefix `secret://` and the scheme are
      lowercase. Percent-encoding is not decoded; `%` is rejected. Constructing `SecretRef(text)` validates the same
      way as `SecretRef.parse(text)` and raises `ValueError` for invalid text, so no invalid reference object exists.
  - id: FR-CONFIG-6
    text: >-
      `resolve(ref, registry)` returns a `Secret` for a `SecretRef` through the resolver registered for its scheme.
      This module provides three resolvers. `env` reads the calling process's environment; it serves the host CLI and
      tests, not containers. `file` reads `/run/secrets/NAME` under FR-CONFIG-13. `host-resolved` is one resolver,
      registered under the four schemes `env`, `hostfile`, `keychain` and `op`; it reads
      `/run/secrets/<secret_file_name(ref)>` under FR-CONFIG-13. Two builders live in `server/src/reader/config/`:
      `container_registry(root)` registers `file` and `host-resolved`; `host_registry(extra)` registers `env` plus the
      resolvers OPS-CLI passes in `extra`. A scheme with no registered resolver fails with `SecretResolutionError`, code
      `no_resolver`.
  - id: FR-CONFIG-7
    text: >-
      `ResolverRegistry` is built once from a sequence of (scheme, resolver) pairs and is immutable afterwards. A scheme
      outside the five ADR-0011 schemes, or a scheme given twice in the pairs, raises `ValueError`.
  - id: FR-CONFIG-8
    text: >-
      Resolution failures raise `SecretResolutionError(ref, code)` with a fixed code: `no_resolver`, `env_unset`,
      `not_found`, `unreadable` (permission denied), `not_regular_file`, `outside_root`, `too_large`, `not_utf8` or
      `empty`. It is raised `from None`, carries neither the underlying exception text nor any byte of the value, and no
      chained exception is rendered.
  - id: FR-CONFIG-9
    text: >-
      Relative paths in `instance.data_dir` and `materials[].file` are joined to the directory of the reader.yaml file
      and normalised lexically: `.` and `..` segments are collapsed and redundant separators removed (POSIX `normpath`
      semantics). There is no `~` expansion, no existence check, no symlink resolution and no filesystem access.
      Absolute paths are only normalised.
  - id: FR-CONFIG-10
    text: >-
      Value constraints of the field table hold. `materials[].sha256` is 64 lowercase hex characters. Decimal fields
      accept only a YAML int or float node: a quoted string or a boolean gives `wrong_type`. The Decimal is built from the
      scalar's source text, not via a binary float. Budgets are finite (`not_finite` for `.nan` and `.inf`) and greater
      than 0; `warn_at` is in (0, 1]. Handles, material ids and kernels are unique within their list: every repeated
      occurrence after the first gives one `not_unique` at its own item path and line (`kernels.1`, `users.1.handle`),
      so three equal items give two errors. Items that already failed their own type or emptiness check do not take
      part in the uniqueness check. Numbers that cannot be represented are `out_of_range` at the key's line and path:
      an integer in any base (decimal, `0o`, `0x`) whose absolute value is at least 10^4300 (decided by value, which for
      decimal matches Python's 4,300-digit conversion limit), and a Decimal field value that raises
      `decimal.InvalidOperation` or whose adjusted exponent lies outside the default decimal context
      (-999999 to 999999).
  - id: FR-CONFIG-11
    text: >-
      `ConfigError` never contains a scalar from the input file. Each problem carries only the file path, line, key path
      and a fixed code with its fixed message. A key that comes from the input is named by its 1-based position k in its
      mapping, never by its text: unknown keys as `<parent>.<unknown key #k>` (top level: `<unknown key #k>`), open task
      keys as `tasks.<key #k>`. The error is raised `from None`; no parser or Pydantic exception, message or object is
      chained or embedded.
  - id: FR-CONFIG-12
    text: >-
      `Secret` wraps a resolved value. `__repr__`, `__str__` and `__format__` (any format spec) render a fixed mask.
      `json.dumps`, `pickle.dumps`, `copy.copy` and `copy.deepcopy` either raise `TypeError` or produce the mask, never
      the value. `reveal()` is the only accessor that returns the plaintext. `__getstate__` and `__reduce_ex__` raise
      `TypeError`.
  - id: FR-CONFIG-13
    text: >-
      The `file` and `host-resolved` resolvers read only below a root, `/run/secrets/` by default and injectable for
      tests. `outside_root` is decided on real paths: the realpath of the target must lie under the realpath of the root.
      A symlink inside the root whose target is inside the root is allowed; one whose target leaves the root fails. The
      target must be a regular file (`not_regular_file`) and readable (`unreadable`). At most `SECRET_MAX_BYTES` + 1
      bytes are read; more than `SECRET_MAX_BYTES` gives `too_large`. Content must be UTF-8 (`not_utf8`) and non-empty
      after stripping one trailing newline (`empty`). `SECRET_MAX_BYTES` = 65536 is a structural bound for a bounded
      read, not a measured limit. The file is opened with `O_RDONLY | O_NOFOLLOW | O_NONBLOCK`, and the regular-file
      check runs on the open descriptor (`fstat`). `O_NOFOLLOW` guards only the last path component: a final component
      swapped for a symlink after the realpath check, or a symlink loop, fails the open with ELOOP and gives
      `unreadable`. Directories above it are not re-checked at open time; the root is expected to be a mount
      writable only by the service uid (the consumer's tmpfs at /run/secrets, ADR-0026).
  - id: FR-CONFIG-14
    text: >-
      `secret_file_name(ref)` is the single, deterministic map from an `env`, `hostfile`, `keychain` or `op` reference to
      its file name under `/run/secrets`: `<scheme>-<first 32 hex characters of sha256(UTF-8 bytes of the reference)>`.
      It is shared with OPS-CLI, which resolves the reference on the host and writes the value to
      `/run/secrets/<name>` in the consumer's tmpfs by atomic `docker exec` delivery over stdin (ADR-0026); no Compose
      secret and no environment variable carries the value. For a `file` reference it raises `ValueError`, because that
      reference already names its file.
  - id: FR-CONFIG-15
    text: >-
      Load failures raise `ConfigError` with a fixed code, plus `file:line` where a line exists:
      missing file (`file_unreadable`); permission denied (`file_unreadable`); content not UTF-8 (`not_utf8`); YAML syntax
      error (`yaml_syntax`); empty document (`empty_document`); a second document (`multiple_documents`); top-level node
      not a mapping (`not_mapping`); duplicate key (`duplicate_key`); a non-string mapping key (`non_string_key`); any
      anchor, alias or merge key `<<` (`alias_not_allowed`); any explicit tag, including spelled-out core tags
      (`tag_not_allowed`); collections nested deeper than `MAX_DEPTH` = 64 (`too_deep`, at the line of the first
      collection beyond the bound; a structural bound that keeps construction and validation within a fixed
      recursion depth, not a measured limit). Depth counts the root mapping as 1. A scalar or key that is not
      encodable as UTF-8 (a lone surrogate such as `"\ud800"` from a double-quoted escape) gives `not_utf8_encodable`
      at its line, during construction, so no such text reaches validation, Pydantic or JSON output.
      Loader design: ruamel.yaml 0.19.1 is used only as a YAML 1.2 parser to an event stream with start marks. A
      validation pass over the events enforces the rules above by inspection (an anchor on any node, any alias event,
      a tag on any node, a second document start, nesting depth). The loader then constructs plain values itself, resolving plain
      scalars by the YAML 1.2.2 core schema (REF-CONFIG-4): `null`, `Null`, `NULL`, `~` and empty are null; only `true`,
      `True`, `TRUE`, `false`, `False`, `FALSE` are booleans; core-schema int and float patterns are numbers; everything
      else, including date-like values, `yes`/`no` and `1_000`, is a string. Duplicate and non-string keys are detected
      during that construction. No parser exception text reaches `ConfigError`.
      Precedence, one error per load failure: a syntax error anywhere in the stream first (the whole stream is parsed
      before any check); then the first event-pass violation in stream order; then the first construction error
      (`empty_document`, `not_mapping`, `duplicate_key`, `non_string_key`). A root that is empty, `~` or `null` is
      `empty_document`. Only a plain `<<` key is a merge key; a quoted `"<<"` is an ordinary key.
  - id: FR-CONFIG-16
    text: >-
      This module's own log calls never include a resolved value or an input scalar; they log references, codes and key
      paths only. Redaction in the shared logger and event serializer is a dependency on SRV-OBS and SRV-EVENTS.
  - id: FR-CONFIG-17
    text: >-
      Observability (paired SRV-OBS change, ADR-0032 accepted 2026-11-24). A tenth top-level section
      `observability`, optional, a mapping with exactly two optional keys: `enabled` (a YAML boolean, default true) and
      `retention_days` (a YAML int, 1 ≤ n ≤ 365, default 30). The field table gains these rows; `ReaderConfig` gains
      `observability: Observability` with those defaults (an absent section equals `{}`), and the committed JSON Schema
      is regenerated (FR-CONFIG-4). Codes: a non-boolean `enabled` or a non-int `retention_days` (a float, a string, a
      boolean) is `wrong_type`; an int outside 1..365 is `out_of_range`; any other key is `unknown_key`. [unit]
      server/tests/config/test_observability.py.
  - id: FR-CONFIG-18   # paired change for SRV-INGEST revision 2 (ADR-0029); was FR-CONFIG-17 until the merge
    text: >-
      **Reserved material ids.** A `materials[].id` that starts with `up-` is a validation problem with code
      `reserved_id` and the message "material ids starting with up- are reserved for uploads" (SRV-INGEST
      FR-INGEST-23 names uploaded materials `up-<first 12 hex of sha256>`; SRV-SEARCH FR-SEARCH-10 reads an
      `up-` material's language from its upload, never from reader.yaml). The match is case-sensitive, on the id's
      characters as written, with no normalisation. The problem is reported like every other FR-CONFIG-10 problem
      (at the item's path and line, collected with the others). **Well-formed material ids** (paired with
      SRV-EVENTS FR-EVENTS-30, code review of the management layer): an id longer than 64 code points, or with a
      character that is white space, not printable (Python `str.isprintable`) or `/`, is a validation problem with
      code `bad_material_id` and the message "material ids are at most 64 printable characters, without white space
      or /" (the id is a path segment of SRV-INGEST's material routes and the audit `object_id` of its management
      actions, whose pattern is exactly this rule; `reader.config.checks.material_id_problem` is the one
      definition, used by the loader, the model and the audit). [unit] refused: `up-`, `up-abc`; accepted: `upx`,
      `upload-notes`, `Up-x`; refused `bad_material_id`: 65 characters, `two words`, `a/b`, a U+200F mark, a tab;
      accepted: `Bashir`, `bashir_4th`, `Башир-2025`, 64 characters; the model refuses what the loader refuses.
  # Amendment (2026-11-24, V/manage): FR-CONFIG-25..26, promoted with Red (see the note at the end of this file).
  - id: FR-CONFIG-25
    text: >-
      **Effective settings view.** `GET /api/settings` (`session`; non-owner → 403 `owner_only`; read-only) loads
      reader.yaml through `load_config` and returns an allow-listed projection, declared as one data table
      `SETTINGS_VIEW` of `(name, path or constant, read_when)` rows: `signup` (`sharing.signup` with FR-AUTH-23's
      default rule, `start`), `observability.enabled` and `observability.retention_days` (`start`),
      `budgets.monthly_usd` and `budgets.warn_at` (`each job`), each `tasks.<name>.model` and
      `tasks.<name>.budget_usd_per_lesson` (`each job`), and the constants SRV-PIPELINE `bounds.run_cap_usd` and
      SRV-TUTOR `question_cap_usd` and `daily_cap_usd` (`fixed`). Each row: `{name, value, source: "reader.yaml" |
      "default" | "fixed", key | null, read_when}`. Where `start` values come from: `signup` is read by the api, so
      its value is the api process's own startup snapshot (the process serving this route; so the page never shows
      a file value that is not in effect); `observability.*` is read by the worker at its start and by the daily
      job, which the api cannot see, so its row shows the file's current value with `read_when` "worker start and
      the daily job" and the page says "applies at the next run". `each job` values are the file's current values.
      **Redaction.** Free-text names from the file are shown only when they match `^[a-z0-9][a-z0-9._-]{0,63}$`
      (task names and model ids as reader.yaml writes them) and, for a model id, also appear in the pricing table
      (SRV-AGENT); any other task name or model id, and any value that starts with `secret:` or `sk-` or contains
      `://`, is replaced by the fixed string "(hidden)" and its row keeps its
      index, so nothing typed into the file by mistake (a token pasted into `model`) reaches the browser. No other
      key appears: users, providers, secret references, materials, kernels and instance URLs are never in the body.
      An unreadable file → 503 `config_unavailable` (FR-INGEST-15's code). The route lives in
      `reader.config.routes` (SRV-AUTH ROUTERS, paired). [unit] the projection of VEC-CONFIG fixtures; a config
      holding `secret://` references in every field and a model id `sk-ant-…`-shaped yields a body with no
      `secret://`, no `sk-` and the "(hidden)" rows; [db] the owner-only refusal. With FR-CONFIG-26 the row's
      `source` adds `"override"` and the body carries `file_value` beside `value`.
  - id: FR-CONFIG-26
    text: >-
      **Settings overlay** (ADR-0036 option B, owner decision 2026-11-24; ADR-0036 accepted). A system table
      `settings_overrides(key text pk, value jsonb, updated_by uuid, updated_at, version int)`; `key` is one of the
      declared allow-list `OVERRIDABLE` = `sharing.signup`, `observability.retention_days`, `budgets.monthly_usd`,
      `budgets.warn_at`, `tasks.<name>.budget_usd_per_lesson` for a task present in reader.yaml (any other key →
      400 `not_overridable`). One function `effective_settings(conn, config) -> Settings` resolves each key as
      override ?? file ?? default and validates the result with the same Pydantic models as the file (a value the
      file's schema refuses → 400 `value_invalid` with the field name, never stored). The overlay adds one bound
      the file does not have: a number for `budgets.monthly_usd` or a task budget must be below 1e15
      (`OVERRIDE_MAX`, below 2^53, so the settings page's JavaScript reads it exactly); a larger one (1e15, 1e308)
      → 400 `value_invalid`, never 500, and a stored one is ignored as `invalid`.
      - **Narrowing on the resolved sign-up value.** The file's sign-up value is first resolved by FR-AUTH-23's rule,
        defaults included (absent on a `localhost` RP ID → open; absent on any other host → off; `false` or `"off"`
        → off). When that resolved file value is off, the effective switch is off whatever the override says;
        setting the override to `open` then answers 409 `file_narrower`, and an `open` override stored earlier (the
        file changed since) is ignored.
      - **Stale overrides.** An override that no longer validates against the current file (its task was removed
        from `tasks`, or a schema bound changed) or that narrowing ignores is not applied: `effective_settings`
        skips it, logs `config override_ignored <key> <reason>` once per process start and per key, and the
        settings view shows it as ignored; `reader up` and `reader status` print `override <key>: ignored
        (<reason>)` (reasons `not_in_file`, `invalid`, `narrowed`; paired OPS-CLI change). It stays in the table
        until reset, so the owner sees and removes it.
      - **Budgets** take an override in either direction, raising included; that is accepted (ADR-0036) behind
        `recent_session` and an audit row.
      - **Readers.** Every reader of the five key families goes through `effective_settings`, and only processes
        with a database connection read them (api and worker; ADR-0036). Paired changes: SRV-AUTH reads the sign-up
        switch per request instead of at start (FR-AUTH-23); SRV-OBS's retention job and worker start read
        retention per run (FR-OBS-11), and the obs summary (`reader.obs.summary`, which today reports the api's
        start-time `retention_days`, FR-OBS-1) reads it per request; SRV-PIPELINE's `create_run` (runs.py), which
        snapshots `tasks.<name>.budget_usd_per_lesson` into `compile_runs.task_budgets`, reads the effective
        value at run creation (a running run keeps its snapshot); SRV-AGENT's monthly budget check per call in the
        worker.
      - **Enforcement is live.** Every budget check reads the effective value at the moment of the check: SRV-AGENT's
        reserve reads `tasks.<name>.budget_usd_per_lesson`, `budgets.monthly_usd` and `budgets.warn_at` through
        `effective_settings` per call, so an override changed during a run applies to that run's next call.
        `compile_runs.task_budgets` is a display snapshot only (the run status's `task_budgets`, the values in
        effect when the run was created); no check reads it.
      Routes (owner only, else 403 `owner_only`; `recent_session`): `POST /api/settings/{key}` with `{value,
      version}` (409 `stale` on a version mismatch; 0 for a new key) sets the override; `DELETE
      /api/settings/{key}` with `{}` removes it (idempotent). Each applied change writes the audit actions
      `settings.set` or `settings.reset` (SRV-EVENTS FR-EVENTS-30) with the key and the old and new values (small
      numbers and enums, not secrets). `reader up` and `reader status` print `override <key>: <value>
      (reader.yaml: <value>)` for each applied override, and the ignored lines above. The CLI reads the table the
      way its other status reads do (paired OPS-CLI change to FR-CLI's status section): one `docker compose exec -T
      postgres psql -U postgres -d <db> -At` query `SELECT key, value FROM settings_overrides ORDER BY key`, bounded
      by the status command's timeout, then evaluates each row against the loaded reader.yaml with the same
      resolution and validation rules as `effective_settings` (shared pure functions in `reader.config`, no
      database driver in the CLI); a failed query prints `overrides: unavailable` and does not fail status. A
      `reader restore` brings overrides back with the database. Models, users, providers, secrets, materials and
      kernels are never overridable. [unit] the merge, narrowing and validation table, with the rows: signup key
      absent on a non-localhost host plus an `open` override → off (ignored, `narrowed`); absent on localhost plus
      an `off` override → off; file `open` plus `off` → off; file `off` plus `open` → off; [unit] a source scan of
      server/src/reader: no module other than `reader.config.effective` reads `sharing.signup`,
      `observability.retention_days`, `budgets.monthly_usd`, `budgets.warn_at` or `budget_usd_per_lesson` from a
      loaded config (attribute or key access outside that module fails the test); [db] set, stale, reset,
      not_overridable, value_invalid, file_narrower; an override for a task then removed from reader.yaml is
      ignored, logged once and listed as ignored; sign-up turned off by an override answers 404 on the sign-up
      routes on the next request without a restart; a learner gets 403 with nothing written; `budgets.monthly_usd`
      and a task budget at 1e15 and 1e308 → 400 `value_invalid`; POST and DELETE with a session older than
      `recent_session` → 401 `reauth_required` with nothing written or removed. [db] through each real reader, not
      `effective_settings` alone: reader.yaml `sharing.signup: off` plus a stored `open` override → the three
      sign-up routes answer 404 (SRV-AUTH FR-AUTH-23); a lowered `budgets.monthly_usd` override makes SRV-AGENT's
      reserve refuse `monthly_budget_exhausted` where the file's value allows the call, and a lowered task budget
      override set after the run's creation makes it refuse `task_budget_exhausted` (enforcement is live);
      a task budget override appears in a new run's `compile_runs.task_budgets` (SRV-PIPELINE `create_run`); an
      `observability.retention_days` override reaches the retention job's cutoff and the obs summary's trace
      cutoff (SRV-OBS FR-OBS-11, FR-OBS-1).

invariants:
  - id: INV-CONFIG-1
    text: >-
      `SecretRef` accepts a string if and only if FR-CONFIG-5's grammar fully matches it. Property test over arbitrary
      text and over near-misses generated from valid references: case changes, inserted or removed `/`, empty, `.` and
      `..` segments, Unicode whitespace and C0 characters at any position, `%`, extra and missing segments. Excludes the
      opaque `sectors` and `sharing`.
  - id: INV-CONFIG-2
    text: >-
      A resolved secret never leaks. A unique canary value is resolved through each resolver, and the canary is absent
      from:
      `str`, `repr` and `format` of every `Secret`, config, registry and error object;
      `traceback.format_exception` of every error;
      a traceback rendered with locals (`traceback.TracebackException(..., capture_locals=True)`), including a failure
      raised after the value was read, and a `file` secret with invalid UTF-8 that contains the canary;
      JSON, pickle and copy outputs of a `Secret`;
      log records emitted by this module.
  - id: INV-CONFIG-3
    text: >-
      An input scalar never leaks. A canary planted (a) in a `SecretRef` field, (b) as an unknown key, (c) on a
      syntactically broken line, (d) as both values of a duplicate key, and (e) as an open task key is absent from `str`,
      `repr` and `traceback.format_exception` of the resulting `ConfigError`. Its `__cause__` and `__context__` render
      nothing.
  - id: INV-CONFIG-4
    text: >-
      `load_config` never resolves secrets: it performs no environment, keyring or network access, and reads no file
      other than the reader.yaml it was given. The test observes file opens through an audit hook and environment
      access through a recording `os.environ`.
  - id: INV-CONFIG-5
    text: >-
      Loading is idempotent. Loading the same valid reader.yaml twice yields equal `ReaderConfig` values (property test
      over generated valid configs).
  - id: INV-CONFIG-6
    text: >-
      `secret_file_name` is deterministic, depends only on the reference string, and always matches
      `(env|hostfile|keychain|op)-[0-9a-f]{32}`.

nfr: []

