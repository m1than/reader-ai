# SRV-CONFIG — reader.yaml: typed settings, JSON Schema, secret references (ADR-0011).
# Scope split with OPS-CLI follows docs/roadmap.md stage 1: this module parses every `secret://` scheme and resolves
# the two that work inside a container (`env`, `file`); OPS-CLI resolves the host-only schemes (`hostfile`, `keychain`,
# `op`) through the resolver registry defined here, and owns `reader doctor`.

id: SRV-CONFIG
title: reader.yaml settings, JSON Schema export and secret references
status: draft
approved_by: null
approved_at: null
layer: server
track: engineering
adr: [ADR-0011, ADR-0006, ADR-0012, ADR-0017, ADR-0020]

paths:
  - server/src/reader/config/**
  - server/tests/config/**

normative:
  - id: REF-CONFIG-1
    title: ADR-0011 — Declarative reader.yaml with secret references resolved per platform
    url: docs/adr/0011-config-and-secrets.md
  - id: REF-CONFIG-2
    title: Pydantic v2 — JSON Schema generation (model_json_schema)
    url: https://docs.pydantic.dev/latest/concepts/json_schema/
  - id: REF-CONFIG-3
    title: JSON Schema, draft 2020-12 (the dialect Pydantic v2 emits)
    url: https://json-schema.org/draft/2020-12
  - id: REF-CONFIG-4
    title: YAML 1.2.2 specification (reader.yaml syntax)
    url: https://yaml.org/spec/1.2.2/

requirements:
  - id: FR-CONFIG-1
    text: >-
      `load_config(path)` reads a reader.yaml file and returns a typed, immutable `ReaderConfig` (Pydantic v2 models)
      with the top-level sections of ADR-0011: `version`, `instance`, `users`, `tasks`, `budgets`, `kernels`, `materials`.
      `sectors` and `sharing` are optional; every unknown key is rejected.
  - id: FR-CONFIG-2
    text: >-
      `version` must be 1. Any other value fails with an error that names the file, the key path and the supported
      version.
  - id: FR-CONFIG-3
    text: >-
      A validation failure raises one `ConfigError` that lists every problem as `<file>:<line>: <key.path>: <message>`,
      ordered by line. The line numbers come from the YAML source, not from the parsed dict.
  - id: FR-CONFIG-4
    text: >-
      `export_json_schema()` returns the JSON Schema of `ReaderConfig`, generated by Pydantic. A committed copy at
      `server/src/reader/config/reader.schema.json` equals the generated one; a test fails when they drift.
  - id: FR-CONFIG-5
    text: >-
      Every secret-bearing field has type `SecretRef`. It accepts exactly the five ADR-0011 forms:
      `secret://env/NAME`, `secret://file/<absolute path>`, `secret://hostfile/<absolute path>`,
      `secret://keychain/<service>/<account>` and `secret://op/<vault>/<item>/<field>`. Any other string fails
      validation, and the error says which forms are allowed.
  - id: FR-CONFIG-6
    text: >-
      `resolve(ref, registry)` returns the secret value for a `SecretRef` through a resolver registry keyed by scheme.
      This module registers resolvers for `env` (process environment) and `file` (contents of the file, one trailing
      newline stripped). Resolving a scheme with no registered resolver fails with an error that names the scheme and
      the component that must resolve it (`reader` host CLI).
  - id: FR-CONFIG-7
    text: >-
      The registry accepts additional resolvers for `hostfile`, `keychain` and `op`, so OPS-CLI can resolve them on the
      host without changing this module. Registering two resolvers for one scheme fails.
  - id: FR-CONFIG-8
    text: >-
      Resolution failures (unset variable, missing or unreadable file, empty value) raise `SecretResolutionError`
      carrying the reference and the reason, never the value or any part of it.
  - id: FR-CONFIG-9
    text: >-
      Relative paths in the config (`instance.data_dir`, `materials[].file`) resolve against the directory of the
      reader.yaml file, not the working directory.
  - id: FR-CONFIG-10
    text: >-
      `materials[].sha256` must be 64 lowercase hex characters. `tasks.<name>.budget_usd_per_lesson`, `budgets.monthly_usd`
      and `budgets.warn_at` must be positive, and `warn_at` must be at most 1.

invariants:
  - id: INV-CONFIG-1
    text: >-
      A `SecretRef` field never accepts a literal value: every string that is not one of the five reference forms
      is rejected (property test over arbitrary strings).
  - id: INV-CONFIG-2
    text: >-
      A resolved secret value never appears in `repr()` or `str()` of any config or resolver object, in any exception
      message or traceback text, or in log records emitted through the project logger. Canary test: a unique canary
      value is resolved, then every such output is searched for it.
  - id: INV-CONFIG-3
    text: >-
      Loading a config never resolves secrets. `load_config` performs no environment, file, keychain or network access
      for `SecretRef` fields; resolution happens only through `resolve`.
  - id: INV-CONFIG-4
    text: >-
      `load_config` is deterministic: loading the same file twice yields equal `ReaderConfig` values, and dumping a
      loaded config back to YAML and loading it again yields an equal value.

nfr: []

vectors:
  - id: VEC-CONFIG-1
    source: ADR-0011 example reader.yaml (docs/adr/0011-config-and-secrets.md, "Example")
    file: spec/fixtures/SRV-CONFIG/reader.example.yaml
  - id: VEC-CONFIG-2
    source: "Hand-written invalid configs, one problem each, with the expected line and key path of the error"
    file: spec/fixtures/SRV-CONFIG/invalid/cases.yaml
