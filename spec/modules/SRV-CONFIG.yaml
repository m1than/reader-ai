# SRV-CONFIG — reader.yaml: typed settings, JSON Schema, secret references, the container secret path (ADR-0011).
#
# Scope split with OPS-CLI (docs/roadmap.md stage 1): this module parses every `secret://` scheme, defines the resolver
# registry and its two builders, the `Secret` value type, and the one function that names a reference's file under
# /run/secrets (FR-CONFIG-14). It provides the `env`, `file` and `host-resolved` resolvers. OPS-CLI resolves `hostfile`,
# `keychain` and `op` on the host and delivers each value over `docker exec` stdin into the consumer's tmpfs at
# /run/secrets/<name> (ADR-0026), and owns `reader doctor`.
#
# Dependencies: redaction of secrets in the shared logger and the event serializer belongs to SRV-OBS and SRV-EVENTS.
# This module only guarantees that its own objects, errors and log calls never carry a secret or an input scalar.
#
# Red phase: tests import the module inside each test body, so that each test fails on its own assertion, not on a
# collection-time ImportError.

