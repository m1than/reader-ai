# Owner notes (not requirements):
# - ADR-0011's revisit_when says "any of the four reference schemes"; its table lists five. Wording fix for the owner.
# - ADR-0011's table lists `env` as resolved "inside containers, the server". This spec routes every non-`file` secret
#   into containers through files OPS-CLI delivers to /run/secrets/ (ADR-0026; `host-resolved`), and `env` serves the host CLI and tests.
#   This matches the stage-1 live check ("no env secrets") and should be reflected in ADR-0011 by the owner.
# - ADR-0017 (multiple users): reader.yaml holds every user's provider references, and a registry resolves any of them.
#   SRV-AGENT must resolve only the acting user's references; that cross-user exposure is outside this module.
# - FR-CONFIG-5 forbids whitespace anywhere, so keychain service/account and 1Password vault/item/field names with
#   spaces cannot be referenced. The owner names such items without spaces.
# - Test note: the mode-0 (permission denied) cases are skipped when the tests run as uid 0, where permissions do not
#   apply.
# - Secret files: only one trailing "\n" is stripped. A CRLF ending leaves "\r", and a UTF-8 BOM stays as U+FEFF.
#   Write secret files without BOM and with LF (or no) line endings.
# - ruamel.yaml's scanner treats U+0085, U+2028 and U+2029 as line breaks (a YAML 1.1 behaviour; YAML 1.2 does not).
#   Such characters in reader.yaml shift the reported line numbers.
# - A character outside the Basic Multilingual Plane written as a surrogate pair of two `\u` escapes
#   ("😀") gives `not_utf8_encodable`; write it as `\U0001F600` or as the literal character.
# - An empty port (`https://x:`) is accepted as a URL without a port; this is harmless.
# - `ReaderConfig.model_validate` refuses any `version` whose type is not exactly int (True, 1.0, Decimal(1),
#   1+0j), matching the loader.

