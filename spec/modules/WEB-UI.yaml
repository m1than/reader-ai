title: App shell — pinned library build, Calm tokens, routing, API client, sign-in redirect and lesson list
status: draft
approved_by: null
approved_at: null
layer: web
track: product
adr: [ADR-0013, ADR-0020, ADR-0024, ADR-0004, ADR-0012]

