        and the Resume dialog open, in light and in dark. The library's dialog fades in over `--acme-duration-slow`
        (280 ms in the library, 0 under `prefers-reduced-motion`; Calm does not change it), so the [browser] test
        runs axe only after the dialog's animations have finished, waiting at most 2 s (a longer fade fails the test).
      - **Test server:** `web/test-server/` serves, for the owner fixture, `GET /api/lessons/w02/estimate`, and a
        compile of `w02` shaped like a real one: no run until `POST /api/lessons/w02/compile` (202); then `running`
