requirements:
  - id: FR-UI-1
    text: >-
      The library is the npm dependency `"@acme/ui": "file:vendor/acme-ui-v0.1.0.tgz"`. `npm pack` at the tag names its
      output after the source version (`acme-ui-0.0.0.tgz`; the release workflow sets the version only when
      publishing), so the script renames it to `acme-ui-v0.1.0.tgz`; the package inside stays `@acme/ui@0.0.0`.
      `web/vendor/acme-ui.lock.json` records `{tag: "v0.1.0", commit: <40-hex sha>, tarball: "acme-ui-v0.1.0.tgz",
      sha256, node: <version>, npm: <version>}`. `web/scripts/vendor-ui.mjs <library checkout>` refuses unless
      `git rev-parse v0.1.0^{commit}` in that checkout equals the recorded commit, then builds in a temporary clone at
      that commit with the library's own `npm ci && npm run build && npm pack` under the recorded Node version, writes
      the tarball and rewrites the lock file; it runs no git command that writes to a remote. A unit test hashes the
      committed tarball and compares it with the lock file. Imports use one entry per component (`@acme/ui/<entry>`),
      plus `@acme/ui/styles.css`. The slice uses these entries only: button, toast, progress, skeleton, tooltip,
      dialog, chip, divider, link, typography, stack, container, app-bar, list-view, alert, and (design pass,
      2026-11-23) breadcrumbs, menu, drawer and icon. `tree-view` is not used: it is an ARIA `tree` whose items are
      selected, not followed, so a tree of lesson links would announce links as tree items and take the arrow keys.
      `collapsible` is not used either: its panel hides all of its content when closed, while a collapsed course group
      keeps its published rows visible (FR-UI-6, FR-UI-17), so the groups use the app's own disclosure buttons
      (`aria-expanded`, `aria-controls`; WAI-ARIA disclosure pattern). The allowed list in `web/src/app/sourceScan.ts`
      equals this list in this order, then `styles.css`. [unit]
  - id: FR-UI-2
    text: >-
      Calm tokens are data: `web/src/ui/tokens/calm.tokens.json` (W3C Design Tokens, light and dark, starting from the
      spike's adjusted draft), compiled by `web/src/ui/tokens/build.mjs` into `calm.css`, which overrides the
      library's `--acme-*` variables unlayered, maps holo, glass and glow to flat values, and sets every duration to 0
      under `prefers-reduced-motion: reduce`. The generator is deterministic (same input, byte-identical output) and the
      committed `calm.css` equals its output (test). The app shell paints `--acme-canvas` on `html` (spike finding 4)
      and follows `prefers-color-scheme`, unless the user chose Light or Dark (FR-UI-16). [unit]
  - id: FR-UI-3
    text: >-
      Routes (TanStack Router, declared as one route table): `/` the lesson list; `/lessons/$lessonId` the lesson view
      (WEB-NOTEBOOK); anything else a not-found view with a link to `/`. `$lessonId` must match
      `^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$` and must not be `.` or `..` (VEC-UI-2 `bad_ids`), otherwise the not-found
      view renders and no request for that lesson is made (design pass: the shell's course sidebar, FR-UI-17, still
      runs its `GET /api/lessons` list query on every page, so the oracle is "no `/api/lessons/<id>` request"). [unit]
  - id: FR-UI-4
    text: >-
      API client: one module with a typed function per route the slice calls (`me`, `signOut`, `listLessons`,
      `getLesson`, `getRevision`, and the kernel session routes used by WEB-NOTEBOOK). Path segments are encoded with
      `encodeURIComponent`. Every request is same-origin with `credentials: "same-origin"`; a request with a body sends
      JSON with `Content-Type: application/json`; bodiless POST and DELETE send no body (SRV-AUTH FR-AUTH-12, SRV-KERNEL
      FR-KERNEL-3). Every response body is validated at run time against its declared shape (VEC-UI-2 for the lesson
      routes); a mismatch is an error `bad_response`, never a partially typed value. TanStack Query caches the list and
      lesson metadata with a stale time of 30 s (a structural choice: lessons change only on republish) and a revision
      with an infinite stale time keyed by its sha256 (revisions are immutable). [unit]
  - id: FR-UI-5
    text: >-
      Authentication: on app start the app calls `GET /api/me`, whose body is SRV-AUTH FR-AUTH-9's
      `{id, handle, role, display_name, consent: {evaluation, tuning}}` with `id` the user's UUID as a string (found by
      the live run, 2026-11-22: the client had expected a number and rejected every real response); on a 401 from it, or
      from any later API call, the app
      navigates the whole page to `/api/auth/signin` (SRV-AUTH FR-AUTH-14, which returns to `/` on success). The header
      shows the signed-in `display_name` as the user menu's trigger (FR-UI-11), and that menu's "Sign out" item calls
      `POST /api/auth/signout`, clears the query cache and then navigates to `/api/auth/signin`. The SPA never reads, stores or logs the session cookie, and keeps
      no credential in `localStorage`, `sessionStorage` or IndexedDB. [unit]
  - id: FR-UI-6
    text: >-
      Lesson list: `GET /api/lessons`, grouped by course (`course_title`, courses sorted by title in the user's locale)
      and within a course by `ordinal`. A lesson with `latest_sha256` set is published: a link to `/lessons/<lesson_id>`
      with its title and updated date; a lesson with `latest_sha256: null` is shown without a link and with "not
      published yet".
      Each lesson is one row: its ordinal, its title, then the status ("not published yet") and the date as separate
      muted elements at the row's end (under the title below 40rem), so status and date never read as part of the
      title (the live list ran them together; live run 2026-11-23).
      **Design pass (2026-11-23; the owner's live list: 128 rows in two courses, 2 published, L02 about 107 rows down,
      "the list of paragraphs, but no hyperlinks to courses"):**
      - **Continue.** Above the courses, a section "Continue" (`h2`) lists the published lessons of every course,
        most recent `updated_at` first, at most 5 rows (structural: a short block); each row shows the lesson title as
        a link and its course title muted. No published lesson: no section.
      - **Course groups.** Each course is a `section` with `id="course-<course_id>"`, labelled by its heading (`h2`,
        the course title as plain text), followed by a muted summary "<P> of <N> published" and, when some lesson is
        unpublished, " · next: <title of the lowest-ordinal unpublished lesson>". Expanded, the group shows all its
        rows; collapsed, only the rows of its published lessons (so every published lesson is a visible link on `/`
        without a click). One control toggles the state (review: one disclosure control per group): a button under the
        list, "Show all <N> lessons" while collapsed and "Show published only" while expanded, with `aria-expanded` and
        `aria-controls` naming the group's list; a group whose lessons are all published has no such button. A group
        with at most 12 lessons (structural: one screen of rows) starts expanded; a larger group starts collapsed.
        Opening `/#course-<course_id>` expands that group and scrolls it into view. The state is per course and lives
        in memory.
      - **Rows.** A row is full width with a hairline `--acme-border` separator and a `--acme-hover` fill on hover; a
        published row's link covers the whole row (its hit area is the row). Ordinal, date and metadata use tabular
        figures. The default status of an unpublished row is the neutral chip "not published yet"; an unpublished
        title is muted. **Compile slot (shaped for FR-UI-15; code review: components, so V/compile-ui's stateful
        control fits):** the app's `Services` carry an optional `compileSlot?: { Status?: ComponentType<{ lesson:
        LessonSummary }>; Action?: ComponentType<{ lesson: LessonSummary }> }` (`AppRoot` takes it as a prop and puts it
        there). When present, both are rendered as React components for **every** row of the list, published ones
        included, and on the not-published page (WEB-NOTEBOOK FR-NOTEBOOK-1). Constraints:
        - `Status` renders inside `span.slot-status`, followed by the default status in `span.status-default` (the chip
          of an unpublished row; nothing on a published one); app.css hides the default while `.slot-status` is not
          `:empty` and hides `.slot-status` while it is, so a `Status` that renders nothing (`null`) falls back to the
          chip. The status is always visible and sits above the row link's hit area (`position: relative`,
          `z-index: 1`), so a link or button inside it stays clickable;
        - `Action` renders inside `span.row-action` at the row's end, also above the row link, revealed on row hover
          and `:focus-within` and always shown under `(hover: none)`; interactive controls belong in `Action`;
        - on the not-published page the parts render inside a `div` (not a `p`), with the action always visible.
        Without the slot, rows show the default status. The course sidebar (FR-UI-17) renders no slot.
        **The app's slot (merge of V/design-pass into V/slice-integration, 2026-11-24).** When no `compileSlot` prop is
        given, `AppRoot` supplies its own: `Status` renders FR-UI-15's `CompileControl` for a user with role `owner`
        and `null` for everyone else, so a learner's row keeps the default chip and makes no compile request. The
        control therefore renders once per row and once on the not-published page, through the slot; `Status` and
        `Action` take `{ lesson, place }` with `place` `'list'` or `'page'`. For the owner, FR-UI-15's compile state,
        draft chip and Compile and Retry actions are what the slot shows; everything else holds for everyone.
      States: loading (skeleton), empty ("No lessons yet"), error (FR-UI-11's state block with Retry). [unit] the
      Continue block (order, cap, absence), the summary text, the 12-row rule at 12 and at 13 lessons, published rows
      visible while collapsed, the toggle both ways with its `aria-expanded` and `aria-controls`, no toggle on an
      all-published group, the hash expand and its `scrollIntoView`, the compile slot's `Status` and `Action` rendered
      for every row (published ones included, an action on a published row too), a `Status` rendering `null` leaving
      `.slot-status` empty beside the default chip (with app.css's two hiding rules checked by the CSS scan test), a
      stateful slot component keeping its state across re-renders, and no slot; [story] Light,
      Dark, Empty, a large course (30 lessons, 2 published) and WithCompileSlot (a stub slot); [live] the `ui` step:
      on `/` every published lesson of `GET /api/lessons` has a visible `a[href="/lessons/<id>"]` before any click,
      and each group of more than 12 lessons starts collapsed with exactly its published rows shown.
  - id: FR-UI-7
    text: >-
      Notices: one toast region for app-level messages (sign-out failure, network loss, the notebook's kernel notices
      handed over by WEB-NOTEBOOK). At most 3 toasts are visible (a structural bound for a calm screen); older ones
      collapse. Every message is plain text from a fixed catalogue keyed by code; no server text is shown as HTML.
      Design pass (2026-11-23): every catalogue message is one or more sentences in sentence case, starting with a
      capital letter and ending with a full stop (the live catalogue had "too many open lessons; close one or reset");
      each notice shows an info icon (the library's `InfoIcon`, `aria-hidden`) before its text, and the collapsed
      count reads "+<n> more" in a muted chip. The region stays this app's own (not the library's toast manager, whose
      timeout would drop kernel notices before they are read). [unit] the catalogue rule over every entry, the icon and
      the "+n more" text; [story]
  - id: FR-UI-8
    text: >-
      Stories: every exported React component in `web/src/{ui,app,notebook,render}/` (a PascalCase export of a `.tsx`
      file that is not a story or test) has a sibling `<File>.stories.tsx` with at least the stories `Light` and `Dark`
      (Calm in each mode). A [unit] test enumerates the components, finds the sibling file through Vite's
      `import.meta.glob` (whose keys are `./`-relative in the test's own directory and `../`-relative elsewhere),
      asserts both stories, and renders every story through Storybook's `composeStories` in jsdom without an error. `npm run build-storybook` is
      part of the local gate. [unit] [story]
  - id: FR-UI-9
    text: >-
      Build: Vite with `build.assetsInlineLimit: 0`, so fonts and images are emitted as files and never inlined as
      `data:` URLs (the app CSP allows none); markdown, math, code highlighting and the lesson view are lazy chunks.
      [unit] by inspecting the build output for `data:` URLs. The only `data:` URL allowed in the output is the one
      literal that the vendored library's own stylesheet carries at v0.1.0 (a `mask: url("data:image/svg+xml,…")` for
      the table sort indicator, a component the slice does not render; under the app CSP that mask would be blocked, so
      it is an owner note for a library change, not an inlined asset). Design pass (2026-11-23, reviewed here):
      CodeMirror's `@codemirror/view` base theme carries one more literal, a `url('data:image/svg+xml,…')` background for
      `.cm-highlightTab`, a class only the `highlightWhitespace()` extension sets, which the lab editor does not load
      (WEB-NOTEBOOK FR-NOTEBOOK-9); it lives in the lazy editor chunk only, inside the editor's shadow root, and the
      app CSP's `img-src 'self' blob:` would block it anyway. The test pins the distinct `data:` URLs at exactly these
      2 — the library's (in the CSS) and CodeMirror's (in the chunk whose source map lists `@codemirror/view`, never
      an initial chunk) — so any new literal fails the build check until it is reviewed.
  - id: FR-UI-10
    text: >-
      Layout and type (WEB polish, from the live screenshots of 2026-11-23; design pass, from the audit of the same
      day). Spacing uses the library's `--acme-space-1..7` steps only; colours only Calm tokens (INV-UI-1 unchanged).
      - **Two typefaces with fixed jobs.** Reading content (lesson markdown, the tutor's answers) is set in the serif
        stack `ui-serif, Georgia, 'Iowan Old Style', serif` (system fonts only: no web font is fetched for text; KaTeX's
        bundled math fonts are the only font files, FR-UI-9) at 1.0625rem (17px) with line height 1.65, in a reading
        column at most 38rem wide (the `ui` step records an estimated median of characters per line, not asserted: 60
        at 1280 and 1024 px and 35 at 390 px on L02, 2026-11-23). Everything else (header, navigation, page titles,
        labels, buttons, references, list rows and metadata, forms, state blocks) uses the library's sans
        `--acme-font`; code uses the library's `--acme-font-mono`, whose value app.css overrides (like calm.css does
        for colours) to `ui-monospace, Menlo, 'SF Mono', 'Cascadia Mono', Consolas, monospace`: the library's stack led
        with fonts Chromium could not use for Cyrillic, so Russian comments and strings in code fell back to a serif
        (after-screenshots, 2026-11-24). Heading scale: an app page title (`h1` of the list,
        import, not-found and state pages) 1.75rem sans (1.5rem below 40rem); the lesson title `h1` 2rem serif
        (1.75rem below 40rem); markdown `h2` 1.375rem and `h3` 1.125rem serif; line height 1.25 for headings.
      - **Figures.** Headings, lesson titles and table cells use `font-variant-numeric: lining-nums` (Georgia's
        default old-style figures made "pp. 9–10" and "1964" look small, audit 2026-11-23); ordinals, dates, counts,
        prices and other metadata use `tabular-nums`.
      - **Language.** The lesson container (`div.lesson`, WEB-NOTEBOOK's lesson view root) carries `lang`: `ru` when
        Cyrillic letters are more than half of the letters in the lesson's markdown sources, else `en` (review: no
        metadata field exists for it today; a server field is a follow-up); the chrome stays `lang="en"`. Prose paragraphs, list items and table cells
        set `hyphens: auto`. (The live L02 is Russian under `lang="en"`: no hyphenation, and the table rule below broke
        "Отказоустойчивость" mid-letter; audit 2026-11-23.)
      - **Widths.** Lesson cells sit in a container at most 50rem wide whose prose children keep the 38rem reading
        column; wide blocks (class `wide`) — the lab (WEB-NOTEBOOK FR-NOTEBOOK-9), code blocks (WEB-RENDER
        FR-RENDER-4), markdown tables of 5 or more columns and display math — take the container's full width. At 60rem and wider the lesson
        shows its contents column beside the cells (WEB-NOTEBOOK FR-NOTEBOOK-11), at 75rem and wider also the course
        sidebar (FR-UI-17); below 60rem one column. Markdown tables fit their width (cells wrap; long words hyphenate,
        and break with `overflow-wrap: break-word` only where no hyphenation point fits, never `anywhere`; a scrolling
        table is a scroll region keyboard users cannot reach, axe `scrollable-region-focusable`); display math scrolls
        inside its own box. At 1280, 1024 and 390 px no page scrolls horizontally.
      - **Shape and controls.** Three radii, declared once in `app.css` as `--radius-control: 6px` (buttons, inputs,
        text areas, chips other than pills), `--radius-block: 8px` (code, lab, callouts, notices, cards of the recall
        deck, the estimate) and `--radius-panel: 12px` (the tutor panel, the sidebar drawer, menus). Library buttons
        take `--radius-control` (the library's 12px made 32px buttons read as pills); size `sm` is 28px tall (toolbars,
        rows, cell toolbars) and the default size 32px (forms, state blocks). Actions are ghost neutral buttons
        (transparent at rest, `--acme-hover` fill on hover, `--acme-pressed` when pressed); a view's one primary
        action is solid: the lab's Run (per lab block), the tutor's Ask, the import's "Create the course" and a
        dialog's confirm; the lesson toolbar has no solid button and the destructive "Reset kernel" sits in its "More"
        menu (WEB-NOTEBOOK FR-NOTEBOOK-7). Rows, ghost buttons and menu items change background with a transition of
        at most 150 ms (`calc(var(--acme-duration) * 0.75)`, so 0 under `prefers-reduced-motion`).
      - **Focus.** Every interactive element (links, buttons, text areas, inputs, the disclosure summary, the skip link,
        menu items, the editor) shows a 2px `--acme-focus` outline on `:focus-visible`.
      [unit] a scan of `web/src/ui/app.css` (and every other `.css` file under `web/src/`): no literal colour (no hex
      value and no colour function, `color-mix` included; every value of `color`, `background`, `background-color`,
      `border`, `border-*`, `outline`, `outline-color`, `box-shadow`, `fill` and `caret-color` uses colours only as
      `var(--acme-…)`, `var(--shiki-…)`, `transparent`, `inherit` or `currentColor`), every `padding`, `margin`, `gap`,
      `inset`, `top`, `right`, `bottom` and `left` value made of `0`, `auto` and `var(--acme-space-N)` only (KaTeX's
      inline box, WEB-RENDER FR-RENDER-3, is the one declared exception, in em), every `border-radius` one of `0`,
      `50%`, `999px` or `var(--radius-control|block|panel)`, the reading column's `max-width: 38rem`, the cells'
      `max-width: 50rem`, every `transition` duration a `var(…)` expression, and a `:focus-visible` rule whose outline
      is `2px solid var(--acme-focus)`; [unit] the lesson `lang` rule (Cyrillic majority, Latin majority, code cells
      not counted) and the attribute on `div.lesson`; [live] the `ui` step of e2e/web/live/owner.slice.ts on the
      running stack (light): at each width the document element's `scrollWidth` ≤ its `clientWidth` on the list, L02,
      an unpublished lesson, `/import` and not-found, and the numbers-only `ui` object of slice-results.json is
      committed to e2e/live/results/; on L02 the widest `[data-markdown] p` is > 0 and ≤ 608px, its computed
      `font-size` is 17px, its `line-height` 28.05px (± 0.1) and its `font-family` begins with `ui-serif`; the lesson
      `h1` is 32px at 1280 and 1024 px and 28px at 390 px; the list's `#content h1` "Lessons" is 28px at 1280 and
      1024 px and 24px at 390 px and its `font-family` does not begin with `ui-serif`; `#content div.lesson` has
      `lang="ru"`; a `[data-markdown] td` has computed `hyphens: auto` and `overflow-wrap: break-word`; the first
      `.lesson-toolbar .acme-button` has computed `border-radius: 6px` and height 28px; the lab block
      (`.cell[data-kind="lab"] .lab`) is at least 64px wider than the widest paragraph and at most 800px wide at 1280
      and 1024 px, and no wider than the column at 390 px; every one of these hooks is asserted present (non-null)
      before its value; axe reports no serious or critical issue; and in dark at 1280 px only, the list and L02 have no
      horizontal scroll and no serious or critical axe issue.
  - id: FR-UI-11
    text: >-
      Keyboard and states of the shell: the shell renders exactly one `<main id="content" tabIndex={-1}>`, around the
      router outlet and around the not-found view; pages render sections inside it, never a `main` of their own. The
      first Tab stop is a "Skip to content" link (visible when focused) to `#content`; following it moves focus to that
      `main`. While `/api/me` loads, the shell shows a header-height bar, a `role="status"` element with the visually
      hidden text "Loading" (no `aria-busy`, which would make screen readers skip the status) and the library's
      `Skeleton` hidden from assistive technology, not a bare "Loading…" line; the lesson list's loading state follows
      the same pattern ("Loading the lessons"). The not-found view keeps FR-UI-3's link. Lists styled without bullets
      (`list-style: none`) carry `role="list"`.
      **Header (design pass, 2026-11-23).** In order: below 75rem a "Courses" ghost button (an app-owned inline SVG
      menu icon, `aria-expanded`, `aria-controls`) that opens the course sidebar (FR-UI-17); the brand, a link to `/`
      holding the reader-ai mark (an inline SVG, `aria-hidden`) and the text "reader-ai" (the auth pages' name and
      mark, SRV-AUTH FR-AUTH-19); a `nav` labelled "Main" whose links come from one declared array `NAV_ITEMS` of
      `{label, to, owner_only, useBadge?}` (today "Lessons" `/`, "Import" `/import` owner-only, FR-UI-14's "Sign-ups"
      `/signups` owner-only with the pending count as its badge, and FR-UI-18's "Observability" owner-only; other
      branches append entries without changing the header's code; `useBadge` is an optional hook returning
      `{shown, after}` or `null`: with a badge the link is "<label> <span class=nav-badge><shown></span><span
      class=visually-hidden> <after></span>", so it shows "Sign-ups 3" and reads "Sign-ups 3 waiting"; without one
      it reads "<label>". No punctuation sits in hidden text: Chromium computed "Sign-ups , 1 waiting" for a hidden
      ", " (live run 2026-11-24), and an `aria-label` fails axe's label-content-name-mismatch), each a ghost link with `aria-current="page"` and the
      `--acme-hover` fill when its route is the current one (`/` also for `/lessons/*`); then, at the end, the user
      menu: a plain ghost button showing the `display_name`, with the accessible name "Account menu for
      <display_name>" (the visible text is part of it, WCAG 2.5.3) and `aria-haspopup="menu"`, whose first activation
      loads the library `Menu` as a lazy chunk and opens it, holding the theme choice (FR-UI-16) and "Sign out"
      (FR-UI-5). If a lazy chunk (the user menu, the course drawer) fails to load, an error boundary keeps the plain
      trigger on screen (code review) instead of removing it; when the drawer's chunk fails, the main nav also stays
      reachable as plain links (`nav.nav-fallback` labelled "Main", a wrapping row in the header, displayed below
      75rem), since the header's own nav is hidden there. **Initial chunk (review B1):** the header and the shell import no `@acme/ui/menu`, `@acme/ui/drawer`
      or `@acme/ui/icon` module statically (the initial chunk measured 111,507 B against NFR-UI-1's 121,153 B, and those
      modules add about 18 KB); icons in the shell are app-owned inline SVGs. The header is one row at every width
      down to 360px (below 40rem the brand text and the display name are visually hidden, their icons stay); its
      height is its declared `min-height: 3.5rem` (56px, the WEB polish value in app.css).
      **Below the Courses breakpoint (live fix 2026-11-24).** With four owner entries the header overflowed a 390px
      viewport by 119px on every page; a first fix at 40rem still overflowed above it (code review: 42px at 641px
      with "Ivan", up to about 847px with a 12rem name). Below 75rem — the breakpoint where the "Courses" button
      appears and the sidebar leaves (FR-UI-17), i.e. `max-width: 74.98rem`, the complement of the `min-width: 75rem`
      rules, so a viewport is below it exactly when its CSS width is under 1200px — the header's `nav.main-nav` is not
      displayed, and the "Courses" drawer holds the same `nav` labelled "Main" (`nav.drawer-nav`, the same
      `NAV_ITEMS`, owner-only rules and badge names) above the course sidebar; following one of its links closes the
      drawer. From 75rem up the drawer's copy is not displayed, so one "Main" navigation is rendered at any width.
      **State blocks.** Every empty, not-found, not-published and error state renders one `StateBlock` component
      (`web/src/ui/StateBlock.tsx`, root class `state-block`): an
      icon (`aria-hidden`), its `h1` in the app page title style (FR-UI-10), a muted explanation line and its actions
      in one row (Retry as the default-size outline button, links as ghost links). No error text is an `h1` in the
      serif (the audit found "The lesson could not be loaded." as a 36px serif heading).
      [unit] on `/`, `/lessons/w01` (loaded and error states) and `/no-such-page`: one `main#content` with tabindex -1
      and the skip link first; following the skip link focuses it; the header's order, `NAV_ITEMS` driving the links
      (an added test entry, with a badge, appears without other changes, shows its badge and has the name
      "<label> <shown> <after>"), the drawer's copy of the nav with the same entries and, for a learner, without the
      owner entries, the fallback nav when the drawer's chunk fails, `aria-current` on `/`,
      `/lessons/w01` and `/import`, the Import entry absent for a learner, the user menu holding the theme group and
      Sign out; every state view rendered by `StateBlock`; [unit] in the production build (the build test of NFR-UI-1)
      the initial chunks' source maps list no module of `@acme/ui`'s menu, drawer or icon entries; [live] the `ui` step
      follows the skip link with the keyboard and finds focus on `main#content`; overflow is measured as
      `scrollWidth − clientWidth` of the document element; `header.app-header` is present and one row (its height ≤ the
      declared 56px) at every width; [browser] e2e/web/ui/header.spec.ts, for the owner with the display names "Ivan",
      a 64-code-point name and a 36-character Cyrillic name: at 390, 641, 768, 1024 and 1199 px no horizontal scroll
      on `/`, a lesson, not-found and `/import`, the header's nav hidden, and the Courses drawer's "Main" nav holding
      Lessons, Import, "Sign-ups 1 waiting" (the name Chromium computes) and Observability, with no serious or
      critical axe issue while the drawer is open; at 1200 and 1280 px no horizontal scroll, the header's nav visible
      with the same four names. [story] the shell's loading state, the header for an owner, an owner with a pending
      sign-up (the badge) and a learner, the drawer's nav with the badge, `StateBlock` Light and Dark.
  # Amendment (2026-11-23, V/plan; reviewed with SRV-PLAN, deep-reviewer round 4 approve on d9f655a), promoted with
