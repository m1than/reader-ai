requirements:
  - id: FR-UI-1
    text: >-
      The library is the npm dependency `"@acme/ui": "file:vendor/acme-ui-v0.1.0.tgz"`. `npm pack` at the tag names its
      output after the source version (`acme-ui-0.0.0.tgz`; the release workflow sets the version only when
      publishing), so the script renames it to `acme-ui-v0.1.0.tgz`; the package inside stays `@acme/ui@0.0.0`.
      `web/vendor/acme-ui.lock.json` records `{tag: "v0.1.0", commit: <40-hex sha>, tarball: "acme-ui-v0.1.0.tgz",
      sha256, node: <version>, npm: <version>}`. `web/scripts/vendor-ui.mjs <library checkout>` refuses unless
      `git rev-parse v0.1.0^{commit}` in that checkout equals the recorded commit, then builds in a temporary clone at
      that commit with the library's own `npm ci && npm run build && npm pack` under the recorded Node version, writes
      the tarball and rewrites the lock file; it runs no git command that writes to a remote. A unit test hashes the
      committed tarball and compares it with the lock file. Imports use one entry per component (`@acme/ui/<entry>`),
      plus `@acme/ui/styles.css`. The slice uses these entries only: button, toast, progress, skeleton, tooltip,
      dialog, chip, divider, link, typography, stack, container, app-bar, list-view, alert, and (design pass,
      2026-11-23) breadcrumbs, menu, drawer and icon. `tree-view` is not used: it is an ARIA `tree` whose items are
      selected, not followed, so a tree of lesson links would announce links as tree items and take the arrow keys.
      `collapsible` is not used either: its panel hides all of its content when closed, while a collapsed course group
      keeps its published rows visible (FR-UI-6, FR-UI-17), so the groups use the app's own disclosure buttons
      (`aria-expanded`, `aria-controls`; WAI-ARIA disclosure pattern). The allowed list in `web/src/app/sourceScan.ts`
      equals this list in this order, then `styles.css`. [unit]
  - id: FR-UI-2
    text: >-
      Calm tokens are data: `web/src/ui/tokens/calm.tokens.json` (W3C Design Tokens, light and dark, starting from the
      spike's adjusted draft), compiled by `web/src/ui/tokens/build.mjs` into `calm.css`, which overrides the
      library's `--acme-*` variables unlayered, maps holo, glass and glow to flat values, and sets every duration to 0
      under `prefers-reduced-motion: reduce`. The generator is deterministic (same input, byte-identical output) and the
      committed `calm.css` equals its output (test). The app shell paints `--acme-canvas` on `html` (spike finding 4)
      and follows `prefers-color-scheme`, unless the user chose Light or Dark (FR-UI-16). [unit]
  - id: FR-UI-3
    text: >-
      Routes (TanStack Router, declared as one route table): `/` the lesson list; `/lessons/$lessonId` the lesson view
      (WEB-NOTEBOOK); anything else a not-found view with a link to `/`. `$lessonId` must match
      `^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$` and must not be `.` or `..` (VEC-UI-2 `bad_ids`), otherwise the not-found
      view renders and no request is made. [unit]
  - id: FR-UI-4
    text: >-
      API client: one module with a typed function per route the slice calls (`me`, `signOut`, `listLessons`,
      `getLesson`, `getRevision`, and the kernel session routes used by WEB-NOTEBOOK). Path segments are encoded with
      `encodeURIComponent`. Every request is same-origin with `credentials: "same-origin"`; a request with a body sends
      JSON with `Content-Type: application/json`; bodiless POST and DELETE send no body (SRV-AUTH FR-AUTH-12, SRV-KERNEL
      FR-KERNEL-3). Every response body is validated at run time against its declared shape (VEC-UI-2 for the lesson
      routes); a mismatch is an error `bad_response`, never a partially typed value. TanStack Query caches the list and
      lesson metadata with a stale time of 30 s (a structural choice: lessons change only on republish) and a revision
      with an infinite stale time keyed by its sha256 (revisions are immutable). [unit]
  - id: FR-UI-5
    text: >-
      Authentication: on app start the app calls `GET /api/me`, whose body is SRV-AUTH FR-AUTH-9's
      `{id, handle, role, display_name, consent: {evaluation, tuning}}` with `id` the user's UUID as a string (found by
      the live run, 2026-11-22: the client had expected a number and rejected every real response); on a 401 from it, or
      from any later API call, the app
      navigates the whole page to `/api/auth/signin` (SRV-AUTH FR-AUTH-14, which returns to `/` on success). The header
      shows the signed-in `display_name` as the user menu's trigger (FR-UI-11), and that menu's "Sign out" item calls
      `POST /api/auth/signout`, clears the query cache and then navigates to `/api/auth/signin`. The SPA never reads, stores or logs the session cookie, and keeps
      no credential in `localStorage`, `sessionStorage` or IndexedDB. [unit]
  - id: FR-UI-6
    text: >-
      Lesson list: `GET /api/lessons`, grouped by course (`course_title`, courses sorted by title in the user's locale)
      and within a course by `ordinal`. A lesson with `latest_sha256` set is published: a link to `/lessons/<lesson_id>`
      with its title and updated date; a lesson with `latest_sha256: null` is shown without a link and with "not
      published yet".
      Each lesson is one row: its ordinal, its title, then the status ("not published yet") and the date as separate
      muted elements at the row's end (under the title below 40rem), so status and date never read as part of the
      title (the live list ran them together; live run 2026-11-23).
      **Design pass (2026-11-23; the owner's live list: 128 rows in two courses, 2 published, L02 about 107 rows down,
      "the list of paragraphs, but no hyperlinks to courses"):**
      - **Continue.** Above the courses, a section "Continue" (`h2`) lists the published lessons of every course,
        most recent `updated_at` first, at most 5 rows (structural: a short block); each row shows the lesson title as
        a link and its course title muted. No published lesson: no section.
      - **Course groups.** Each course is a `section` with `id="course-<course_id>"`, labelled by its heading (`h2`),
        which contains a disclosure button (`aria-expanded`, `aria-controls` the group's list; the chevron icon,
        `aria-hidden`) whose text is the course title, followed by a muted summary "<P> of <N> published" and, when some
        lesson is unpublished, " · next: <title of the lowest-ordinal unpublished lesson>". Expanded, the group shows
        all its rows; collapsed, only the rows of its published lessons (so every published lesson is a visible link on
        `/` without a click). Under the list a button toggles the same state: "Show all <N> lessons" while collapsed,
        "Show published only" while expanded; a group whose lessons are all published has no such button and its
        heading button is not a disclosure (a plain heading). A group with at most 12 lessons (structural: one screen of
        rows) starts expanded; a larger group starts collapsed. Opening `/#course-<course_id>` expands that group and
        scrolls to it. The state is per course and lives in memory.
      - **Rows.** A row is full width with a hairline `--acme-border` separator and a `--acme-hover` fill on hover; a
        published row's link covers the whole row (its hit area is the row). Ordinal, date and metadata use tabular
        figures. The status "not published yet" is a neutral chip (WEB-UI FR-UI-15's compile status replaces its text).
        An unpublished title is muted. **Compile slot:** the app's `Services` carry an optional
        `compileAction?: (lesson: LessonSummary) => ReactNode`; when present, every unpublished row (here, in the
        sidebar FR-UI-17 and on the unpublished lesson page WEB-NOTEBOOK FR-NOTEBOOK-1) renders its result at the row's
        end, revealed on row hover and focus-within and always shown under `(hover: none)`; when absent nothing is
        rendered. This pass renders no Compile control of its own.
      States: loading (skeleton), empty ("No lessons yet"), error (FR-UI-11's state block with Retry). [unit] the
      Continue block (order, cap, absence), the summary text, the 12-row rule both ways, published rows visible while
      collapsed, the two toggles, the hash expand, the compile slot present and absent; [story] Light, Dark, Empty,
      a large course (30 lessons, 2 published) and WithCompileSlot (a stub slot); [live] the `ui` step: on `/` every
      published lesson of `GET /api/lessons` has a visible `a[href="/lessons/<id>"]` before any click, and each group
      of more than 12 lessons starts collapsed with exactly its published rows shown.
  - id: FR-UI-7
    text: >-
      Notices: one toast region for app-level messages (sign-out failure, network loss, the notebook's kernel notices
      handed over by WEB-NOTEBOOK). At most 3 toasts are visible (a structural bound for a calm screen); older ones
      collapse. Every message is plain text from a fixed catalogue keyed by code; no server text is shown as HTML.
      Design pass (2026-11-23): every catalogue message is one or more sentences in sentence case, starting with a
      capital letter and ending with a full stop (the live catalogue had "too many open lessons; close one or reset");
      each notice shows an info icon (the library's `InfoIcon`, `aria-hidden`) before its text, and the collapsed
      count reads "+<n> more" in a muted chip. The region stays this app's own (not the library's toast manager, whose
      timeout would drop kernel notices before they are read). [unit] the catalogue rule over every entry, the icon and
      the "+n more" text; [story]
  - id: FR-UI-8
    text: >-
      Stories: every exported React component in `web/src/{ui,app,notebook,render}/` (a PascalCase export of a `.tsx`
      file that is not a story or test) has a sibling `<File>.stories.tsx` with at least the stories `Light` and `Dark`
      (Calm in each mode). A [unit] test enumerates the components, finds the sibling file through Vite's
      `import.meta.glob` (whose keys are `./`-relative in the test's own directory and `../`-relative elsewhere),
      asserts both stories, and renders every story through Storybook's `composeStories` in jsdom without an error. `npm run build-storybook` is
      part of the local gate. [unit] [story]
  - id: FR-UI-9
    text: >-
      Build: Vite with `build.assetsInlineLimit: 0`, so fonts and images are emitted as files and never inlined as
      `data:` URLs (the app CSP allows none); markdown, math, code highlighting and the lesson view are lazy chunks.
      [unit] by inspecting the build output for `data:` URLs. The only `data:` URL allowed in the output is the one
      literal that the vendored library's own stylesheet carries at v0.1.0 (a `mask: url("data:image/svg+xml,…")` for
      the table sort indicator, a component the slice does not render; under the app CSP that mask would be blocked, so
      it is an owner note for a library change, not an inlined asset). The test pins the number of distinct `data:`
      URLs at exactly 1 (the minifier repeats it for `-webkit-mask`), so a new library literal fails the build check
      until it is reviewed.
  - id: FR-UI-10
    text: >-
      Layout and type (WEB polish, from the live screenshots of 2026-11-23; design pass, from the audit of the same
      day). Spacing uses the library's `--acme-space-1..7` steps only; colours only Calm tokens (INV-UI-1 unchanged).
      - **Two typefaces with fixed jobs.** Reading content (lesson markdown, the tutor's answers) is set in the serif
        stack `ui-serif, Georgia, 'Iowan Old Style', serif` (system fonts only: no web font is fetched for text; KaTeX's
        bundled math fonts are the only font files, FR-UI-9) at 1.0625rem (17px) with line height 1.65, in a reading
        column at most 38rem wide (the `ui` step records an estimated median of characters per line, not asserted: 60
        at 1280 and 1024 px and 35 at 390 px on L02, 2026-11-23). Everything else (header, navigation, page titles,
        labels, buttons, references, list rows and metadata, forms, state blocks) uses the library's sans
        `--acme-font`; code uses the library's `--acme-font-mono`. Heading scale: an app page title (`h1` of the list,
        import, not-found and state pages) 1.75rem sans (1.5rem below 40rem); the lesson title `h1` 2rem serif
        (1.75rem below 40rem); markdown `h2` 1.375rem and `h3` 1.125rem serif; line height 1.25 for headings.
      - **Figures.** Headings, lesson titles and table cells use `font-variant-numeric: lining-nums` (Georgia's
        default old-style figures made "pp. 9–10" and "1964" look small, audit 2026-11-23); ordinals, dates, counts,
        prices and other metadata use `tabular-nums`.
      - **Language.** The lesson's `article` carries `lang`: `metadata.reader.language` when it is a string matching
        `^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$`, else `ru` when Cyrillic letters are more than half of the letters in the
        lesson's markdown sources, else `en`; the chrome stays `lang="en"`. Prose paragraphs, list items and table cells
        set `hyphens: auto`. (The live L02 is Russian under `lang="en"`: no hyphenation, and the table rule below broke
        "Отказоустойчивость" mid-letter; audit 2026-11-23.)
      - **Widths.** Lesson cells sit in a container at most 50rem wide whose prose children keep the 38rem reading
        column; wide blocks (class `wide`) — the lab (WEB-NOTEBOOK FR-NOTEBOOK-9), code blocks (WEB-RENDER
        FR-RENDER-4), markdown tables of 5 or more columns and display math — take the container's full width. At 60rem and wider the lesson
        shows its contents column beside the cells (WEB-NOTEBOOK FR-NOTEBOOK-11), at 75rem and wider also the course
        sidebar (FR-UI-17); below 60rem one column. Markdown tables fit their width (cells wrap; long words hyphenate,
        and break with `overflow-wrap: break-word` only where no hyphenation point fits, never `anywhere`; a scrolling
        table is a scroll region keyboard users cannot reach, axe `scrollable-region-focusable`); display math scrolls
        inside its own box. At 1280, 1024 and 390 px no page scrolls horizontally.
      - **Shape and controls.** Three radii, declared once in `app.css` as `--radius-control: 6px` (buttons, inputs,
        text areas, chips other than pills), `--radius-block: 8px` (code, lab, callouts, notices, cards of the recall
        deck, the estimate) and `--radius-panel: 12px` (the tutor panel, the sidebar drawer, menus). Library buttons
        take `--radius-control` (the library's 12px made 32px buttons read as pills); size `sm` is 28px tall (toolbars,
        rows, cell toolbars) and the default size 32px (forms, state blocks). Actions are ghost neutral buttons
        (transparent at rest, `--acme-hover` fill on hover, `--acme-pressed` when pressed); a view's one primary
        action is solid: the lab's Run (per lab block), the tutor's Ask, the import's "Create the course" and a
        dialog's confirm; the lesson toolbar has no solid button and the destructive "Reset kernel" sits in its "More"
        menu (WEB-NOTEBOOK FR-NOTEBOOK-7). Rows, ghost buttons and menu items change background with a transition of
        at most 150 ms (`calc(var(--acme-duration) * 0.75)`, so 0 under `prefers-reduced-motion`).
      - **Focus.** Every interactive element (links, buttons, text areas, inputs, the disclosure summary, the skip link,
        menu items, the editor) shows a 2px `--acme-focus` outline on `:focus-visible`.
      [unit] a scan of `web/src/ui/app.css` (and every other `.css` file under `web/src/`): no literal colour (no hex
      value and no colour function, `color-mix` included; every value of `color`, `background`, `background-color`,
      `border`, `border-*`, `outline`, `outline-color`, `box-shadow`, `fill` and `caret-color` uses colours only as
      `var(--acme-…)`, `var(--shiki-…)`, `transparent`, `inherit` or `currentColor`), every `padding`, `margin`, `gap`,
      `inset`, `top`, `right`, `bottom` and `left` value made of `0`, `auto` and `var(--acme-space-N)` only (KaTeX's
      inline box, WEB-RENDER FR-RENDER-3, is the one declared exception, in em), every `border-radius` one of `0`,
