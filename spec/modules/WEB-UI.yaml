  # and plan steps for already-imported materials; the drop zone joins later.
  - id: FR-UI-12
    text: >-
      **Import route and link.** The route table adds `/import` (the page component in `web/src/import/plan/`,
      WEB-PLAN, loaded as a lazy chunk) and the header an "Import" link, shown only for a user with role `owner` (from
      `/api/me`); a non-owner who opens `/import` sees the app's not-found view (web/src/app/routes.tsx `NotFound`).
      The page renders inside the shell's `main#content`. [unit] the link for owner and learner, the lazy route;
      [browser] `/import` under the production CSP.
  # FR-UI-14: V/signup (ADR-0031, accepted 2026-11-23); FR-UI-12 is V/plan's, FR-UI-13 is V/onboarding's.
  - id: FR-UI-14
    text: >-
      **Sign-ups entry points (WEB-ACCOUNTS).** The route table adds `/signups`, WEB-ACCOUNTS's page as a lazy chunk.
      For a user whose `/api/me` role is `owner`, the header shows a link "Sign-ups" to `/signups`, with the pending
      count of WEB-ACCOUNTS FR-ACCOUNTS-4; a learner sees no link, and on `/signups` a learner gets the not-found view
      (FR-UI-3) without any request to `/api/auth/signups`. The shell's behaviour is otherwise unchanged: one
      `main#content` (FR-UI-11), the skip link first, the 401 redirect of FR-UI-5. `web/test-server/` stubs
      `GET /api/auth/signups` and the three POST routes from VEC-ACCOUNTS-1, and its fixed map of static auth files
      adds `/api/auth/signup` → signup.html (SRV-AUTH FR-AUTH-31), five entries in all. [unit] the route table, the
      link for owner and learner, the learner's request log on `/signups`; [browser] WEB-ACCOUNTS FR-ACCOUNTS-5's
      matrix covers the link at 1280, 1024 and 390 px in both schemes.
  # Amendment (2026-11-23, V/compile-ui): the owner could not study the 105 planned lessons, because the list links
  # only published lessons and the only UI path that starts a compile is /import's "Start compiling lesson 1". Base:
  # the "compile status in the list" bullet of V/onboarding's draft FR-UI-13 (WEB-UI.yaml `proposed_requirements`),
  # extended with the Compile action. Ids (coordinator, 2026-11-23): FR-UI-13 stays the upload track's id, FR-UI-14 is
  # V/signup's, FR-UI-16 and above are the design pass's. The upload track keeps its FR-UI-13 (first run) and drops
  # its compile-status bullet at merge; this item supersedes it.
  - id: FR-UI-15
    text: >-
      **Compile from the lesson list (owner).** One component, `CompileControl` in `web/src/app/compile/` (with its
      status mapping and copy there; the five client functions `openCompiles`, `latestCompile`, `startCompile`,
      `resumeCompile` and `lessonEstimate` join FR-UI-4's API module, validated at run time like the others), used by
      the list rows and by WEB-NOTEBOOK FR-NOTEBOOK-12.
      - **"Has a revision" is not "compiled".** The `draft` step writes a revision (L02: about 157 s into a 210 s
        compile), so `latest_sha256` turns a row into FR-UI-6's link long before the run ends, and a run that stops
        later leaves a linked draft behind. The control is therefore keyed on the run's state, never on
        `latest_sha256` alone.
      - **Who:** only for a user with role `owner` (from `/api/me`). For anyone else the list is FR-UI-6 unchanged: no
        button, no status, no chip, and no request to a compile or estimate route.
      - **The list's run-state source:** one `GET /api/compiles` (SRV-PIPELINE FR-PIPELINE-17) per list view gives
        the owner's open runs: the latest run of each lesson whose state is not `converged` or `open_findings`.
        A lesson in that answer shows its run's state; a lesson absent from it has no open run: "not compiled yet"
        and a "Compile" button when `latest_sha256` is null, nothing beyond FR-UI-6 when it is set. The list makes
        no per-lesson status read.
      - **Draft chip:** a linked row (with `latest_sha256`) whose lesson has an open run shows, after the link, a
        muted chip "draft, compile not finished" before its status text, so a draft whose compile still runs or has
        stopped never reads as finished (owner feedback 2026-11-23: plan lesson 1 looked published, with open
        findings, while its compile was not finished).
      - **Status**, in FR-UI-6's status slot instead of "not published yet" (the stage labels: `draft` drafting,
        `fact_check` checking facts, `adversarial_review` reviewing, `revise` revising, `findings` collecting
        findings, `lab_verification` verifying labs; the stage is that of the last listed step that carries a
        `status`, else of the last step), the same with or without `latest_sha256`:
        - no run: "not compiled yet" and a "Compile" button;
        - `running` or `stalled`: "Compiling: <stage label>", no button;
        - `stage_failed`: "Compile stopped at <stage label>", then the message of the status's `error` code when it
          has one (SRV-PIPELINE FR-PIPELINE-16; `provider_missing`: "No AI provider is connected for your account.
          Connect one, then retry."; any other code: no extra text), and a "Retry" button;
        - `budget_exhausted`: "Compile stopped:" and the message of `refusals[0]` (`budget_exhausted`: "it reached
          its $<cap_usd> cap"; `task_budget_exhausted`: "a stage reached its own budget"; `monthly_budget_exhausted`:
          "the monthly budget is used up"; `daily_budget_exhausted`: "the daily budget is used up"; any other:
          "a budget was reached"), then "Spent $<spent_usd>.", and a "Compile" button (a new run);
        - `converged` or `open_findings` (the lesson page's single read only; the list never sees them): nothing
          beyond FR-UI-6;
        - a failed read of the run state: no status text of its own (an unpublished row keeps "not published yet")
          and, on an unpublished row, the "Compile" button (a running compile then answers 409, below).
      - **Polling:** while any run in the list's answer (or the lesson page's run) is `running` or `stalled`, that
        query refetches every `COMPILE_POLL_MS` = 5,000 ms (chosen: a stage takes tens of seconds, L02's whole
        compile 210 s); otherwise never. TanStack Query does not refetch in a background tab. Polling stops
        `COMPILE_POLL_MAX_MS` = 30 min (chosen: more than eight times L02's compile) after the query was last started
        or refreshed; the status then adds a "Refresh" button that refetches once and restarts the window. The window
        also restarts whenever a run starts, from any source: after this control's own POST, and whenever the
        query's answer holds a `running` or `stalled` run whose `run_id` that query has not polled before (a run
        started on another page or in another tab). So a run started after 30 idle minutes is polled. A status
        read calls SRV-PIPELINE's `ensure` (FR-PIPELINE-6, -11, -17), so an owner's page view can re-enqueue a
        stalled run; that is the server's recovery path, not a side effect to avoid.
      - **Revisions:** when a run's `latest_sha256` is not null and differs from the row's (or the page's), or a run
        leaves the answer or leaves `running`/`stalled`, the app invalidates the `['lessons']` and `['lesson', id]`
        queries, so the row becomes FR-UI-6's link (with the chip while its run is open) and the lesson page loads
        the newer revision.
      - **Confirm:** "Compile" opens a dialog (the library's `Dialog`) titled "Compile lesson <ordinal>?" with the
        lesson title, then:
        - the estimate from `GET /api/lessons/{lesson_id}/estimate` (SRV-PLAN FR-PLAN-13, the plan's own per-lesson
          formula, FR-PLAN-8): "Estimate: $<low_usd>–$<high_usd>" and "An estimate from one measured lesson (L02),
          scaled by this lesson's <kchars> thousand characters; not a bound." (kchars with one decimal); when
          `extrapolated`, also "This lesson is R× shorter than the measured one; the real cost is likely higher than
          this range." (R = `basis_kchars / kchars`, one decimal) or, when longer, "This lesson is R× longer than the
          measured one; the real cost may differ from this range." (R = `kchars / basis_kchars`); "Estimating…" while
          it loads; "No estimate for this lesson." on 404 or any error; when `kchars` is "0.000", instead "This
          lesson's pages have no text to compile." and the dialog's "Compile" is disabled (the server would answer
          `no_source_spans`);
        - "Stops at $<run_cap_usd>." (the estimate's `run_cap_usd`, else the client constant `RUN_CAP_USD` = "8.00",
          which a unit test pins to SRV-PIPELINE `bounds.run_cap_usd`);
        - "Compile" and "Cancel". "Compile" sends `POST /api/lessons/{lesson_id}/compile` with no body (the default
          cap, FR-PIPELINE-11; bodiless, FR-UI-4) and is disabled while the request is in flight; an in-flight ref
          guards it too, so two clicks in the same event-loop turn (before the disabled state renders) or Enter send
          one request.
        "Retry" opens the same dialog titled "Resume the compile of lesson <ordinal>?" with "Spent so far: $<spent_usd>
        of $<cap_usd>." in place of the estimate and "Stops at $<cap_usd>."; its "Resume" sends
        `POST /api/compiles/{run_id}/resume`. The decision is a pure function `submitAction(open, mode, run)`:
        nothing while the dialog is not open; in resume mode with no run (the run left the state after the dialog
        opened) it closes the dialog and posts nothing, never a new compile; otherwise resume or compile.
      - **After the request:** a 202 closes the dialog, refetches the run state (the list's `GET /api/compiles`, or
        the page's status) and moves focus to the row's (or page's) status text (`tabIndex={-1}`; the button that
        opened the dialog is gone). `compile_running` (409),
        `already_started` (409; not sent by this route today, FR-PIPELINE-15, mapped for completeness) and
        `not_failed` (409, resume) close the dialog the same way, so the row shows the run, and add a notice (FR-UI-7)
        "A compile of this lesson is already running.", "A lesson of this course is already compiled or compiling.",
        "This compile is no longer stopped.". Any other error keeps the dialog open with a `role="alert"` line:
        `lesson_unknown` and `not_found` "This lesson no longer exists. Reload the list." (and the list is
        invalidated), `no_material` "The source of this lesson is not imported.", `no_source_spans` "This lesson's
        pages have no text to compile.", `source_too_large` "This lesson is too long to compile in one run.",
        `network` "The server could not be reached. Check the connection and try again.", anything else "Something
        went wrong. Try again.". Budget refusals and `provider_missing` never come from these POSTs (a step meets
        them); they reach the row through the status above.
      - **Polish:** FR-UI-10 holds for the new CSS (tokens and spacing steps only, the 2px focus outline); the row's
