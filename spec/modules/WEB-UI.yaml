requirements:
  - id: FR-UI-1
    text: >-
      The library is the npm dependency `"@acme/ui": "file:vendor/acme-ui-v0.1.0.tgz"`. `npm pack` at the tag names its
      output after the source version (`acme-ui-0.0.0.tgz`; the release workflow sets the version only when
      publishing), so the script renames it to `acme-ui-v0.1.0.tgz`; the package inside stays `@acme/ui@0.0.0`.
      `web/vendor/acme-ui.lock.json` records `{tag: "v0.1.0", commit: <40-hex sha>, tarball: "acme-ui-v0.1.0.tgz",
      sha256, node: <version>, npm: <version>}`. `web/scripts/vendor-ui.mjs <library checkout>` refuses unless
      `git rev-parse v0.1.0^{commit}` in that checkout equals the recorded commit, then builds in a temporary clone at
      that commit with the library's own `npm ci && npm run build && npm pack` under the recorded Node version, writes
      the tarball and rewrites the lock file; it runs no git command that writes to a remote. A unit test hashes the
      committed tarball and compares it with the lock file. Imports use one entry per component (`@acme/ui/<entry>`),
      plus `@acme/ui/styles.css`. The slice uses these entries only: button, toast, progress, skeleton, tooltip,
      dialog, chip, divider, link, typography, stack, container, app-bar, list-view, alert. [unit]
  - id: FR-UI-2
    text: >-
      Calm tokens are data: `web/src/ui/tokens/calm.tokens.json` (W3C Design Tokens, light and dark, starting from the
      spike's adjusted draft), compiled by `web/src/ui/tokens/build.mjs` into `calm.css`, which overrides the
      library's `--acme-*` variables unlayered, maps holo, glass and glow to flat values, and sets every duration to 0
      under `prefers-reduced-motion: reduce`. The generator is deterministic (same input, byte-identical output) and the
      committed `calm.css` equals its output (test). The app shell paints `--acme-canvas` on `html` (spike finding 4)
      and follows `prefers-color-scheme`. [unit]
  - id: FR-UI-3
    text: >-
      Routes (TanStack Router, declared as one route table): `/` the lesson list; `/lessons/$lessonId` the lesson view
      (WEB-NOTEBOOK); anything else a not-found view with a link to `/`. `$lessonId` must match
      `^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$` and must not be `.` or `..` (VEC-UI-2 `bad_ids`), otherwise the not-found
      view renders and no request is made. [unit]
  - id: FR-UI-4
    text: >-
      API client: one module with a typed function per route the slice calls (`me`, `signOut`, `listLessons`,
      `getLesson`, `getRevision`, and the kernel session routes used by WEB-NOTEBOOK). Path segments are encoded with
      `encodeURIComponent`. Every request is same-origin with `credentials: "same-origin"`; a request with a body sends
      JSON with `Content-Type: application/json`; bodiless POST and DELETE send no body (SRV-AUTH FR-AUTH-12, SRV-KERNEL
      FR-KERNEL-3). Every response body is validated at run time against its declared shape (VEC-UI-2 for the lesson
      routes); a mismatch is an error `bad_response`, never a partially typed value. TanStack Query caches the list and
      lesson metadata with a stale time of 30 s (a structural choice: lessons change only on republish) and a revision
      with an infinite stale time keyed by its sha256 (revisions are immutable). [unit]
  - id: FR-UI-5
    text: >-
      Authentication: on app start the app calls `GET /api/me`, whose body is SRV-AUTH FR-AUTH-9's
      `{id, handle, role, display_name, consent: {evaluation, tuning}}` with `id` the user's UUID as a string (found by
      the live run, 2026-11-22: the client had expected a number and rejected every real response); on a 401 from it, or
      from any later API call, the app
      navigates the whole page to `/api/auth/signin` (SRV-AUTH FR-AUTH-14, which returns to `/` on success). The header
      shows the signed-in `display_name` and a Sign out button that calls `POST /api/auth/signout`, clears the query
      cache and then navigates to `/api/auth/signin`. The SPA never reads, stores or logs the session cookie, and keeps
      no credential in `localStorage`, `sessionStorage` or IndexedDB. [unit]
  - id: FR-UI-6
    text: >-
      Lesson list: `GET /api/lessons`, grouped by course (`course_title`, courses sorted by title in the user's locale)
      and within a course by `ordinal`. A lesson with `latest_sha256` set is a link to `/lessons/<lesson_id>` with its
      title and updated date; a lesson with `latest_sha256: null` is shown without a link and with "not published yet".
      Each lesson is one row: its ordinal, its title, then the status ("not published yet") and the date as separate
      muted elements at the row's end (under the title below 40rem), so status and date never read as part of the
      title (the live list ran them together; live run 2026-11-23).
      States: loading (skeleton), empty ("No lessons yet"), error (a calm message with Retry). For a user with role
      `owner`, FR-UI-15 adds each lesson's compile state, a draft chip and the Compile and Retry actions to the rows;
      everything above holds for everyone else unchanged. [unit] [story]
  - id: FR-UI-7
    text: >-
      Notices: one toast region for app-level messages (sign-out failure, network loss, the notebook's kernel notices
      handed over by WEB-NOTEBOOK). At most 3 toasts are visible (a structural bound for a calm screen); older ones
      collapse. Every message is plain text from a fixed catalogue keyed by code; no server text is shown as HTML.
      [unit] [story]
  - id: FR-UI-8
    text: >-
      Stories: every exported React component in `web/src/{ui,app,notebook,render}/` (a PascalCase export of a `.tsx`
      file that is not a story or test) has a sibling `<File>.stories.tsx` with at least the stories `Light` and `Dark`
      (Calm in each mode). A [unit] test enumerates the components, finds the sibling file through Vite's
      `import.meta.glob` (whose keys are `./`-relative in the test's own directory and `../`-relative elsewhere),
      asserts both stories, and renders every story through Storybook's `composeStories` in jsdom without an error. `npm run build-storybook` is
      part of the local gate. [unit] [story]
  - id: FR-UI-9
    text: >-
      Build: Vite with `build.assetsInlineLimit: 0`, so fonts and images are emitted as files and never inlined as
      `data:` URLs (the app CSP allows none); markdown, math, code highlighting and the lesson view are lazy chunks.
      [unit] by inspecting the build output for `data:` URLs. The only `data:` URL allowed in the output is the one
      literal that the vendored library's own stylesheet carries at v0.1.0 (a `mask: url("data:image/svg+xml,…")` for
      the table sort indicator, a component the slice does not render; under the app CSP that mask would be blocked, so
      it is an owner note for a library change, not an inlined asset). The test pins the number of distinct `data:`
      URLs at exactly 1 (the minifier repeats it for `-webkit-mask`), so a new library literal fails the build check
      until it is reviewed.
  - id: FR-UI-10
    text: >-
      Layout and type (WEB polish, from the live screenshots of 2026-11-23). Spacing uses the library's
      `--acme-space-1..7` steps only; colours only Calm tokens (INV-UI-1 unchanged). Prose (lesson markdown, the
      tutor's answers) is set in the serif stack `ui-serif, Georgia, 'Iowan Old Style', serif` (system fonts only: no
      web font is fetched for text; KaTeX's bundled math fonts are the only font files, FR-UI-9) at 1.0625rem (17px) with line height 1.65, in a reading column at most 38rem wide (the `ui` step
      records an estimated median of characters per line in slice-results.json, not asserted: 60 at 1280 and 1024 px
      and 35 at 390 px on L02, 2026-11-23; the slice's 46rem column at 16px was estimated at about 90); the lesson `h1` is 2.25rem (1.875rem below
      40rem), markdown headings
      1.5 and 1.2rem; UI chrome (header, labels, buttons, references, list metadata) uses the library's sans
      `--acme-font` at 0.8125–0.875rem. Widths: at 1280 and 1024 px the lesson shows its contents column beside the
      reading column (WEB-NOTEBOOK FR-NOTEBOOK-11), below 60rem one column. Markdown tables fit the column (cells
      wrap and long words break; a scrolling table is a scroll region keyboard users cannot reach, axe
      `scrollable-region-focusable`, measured on L02 2026-11-23); display math scrolls inside its own box. At 1280, 1024 and 390 px no page scrolls horizontally. Every interactive element (links,
      buttons, text areas, the disclosure summary, the skip link) shows a 2px `--acme-focus` outline on
      `:focus-visible`.
      [unit] a scan of `web/src/ui/app.css`: no literal colour (no hex value and no colour function, `color-mix`
      included; every value of `color`, `background`, `background-color`, `border`, `border-*`, `outline`,
      `outline-color`, `box-shadow`, `fill` and `caret-color` uses colours only as `var(--acme-…)`, `transparent`,
      `inherit` or `currentColor`), every `padding`, `margin`, `gap`, `inset`, `top`, `right`, `bottom` and `left`
      value made of `0`, `auto` and `var(--acme-space-N)` only, the reading column's `max-width: 38rem`, and a
      `:focus-visible` rule whose outline is `2px solid var(--acme-focus)`. [live] the `ui` step of
      e2e/web/live/owner.slice.ts on the running stack: at each width the document element's `scrollWidth` ≤ its
      `clientWidth` (the viewport without a scrollbar) on the list and on L02, and the numbers-only `ui` object of
      slice-results.json is committed to e2e/live/results/; on L02 the widest `[data-markdown] p` is > 0 and ≤ 608px, its computed `font-size` is 17px, its
      `line-height` 28.05px (± 0.1) and its `font-family` begins with `ui-serif`, and the `h1` is 36px at 1280 and
      1024 px and 30px at 390 px; axe reports no
      serious or critical issue.
  - id: FR-UI-11
    text: >-
      Keyboard and states of the shell: the shell renders exactly one `<main id="content" tabIndex={-1}>`, around the
      router outlet and around the not-found view; pages render sections inside it, never a `main` of their own. The
      first Tab stop is a "Skip to content" link (visible when focused) to `#content`; following it moves focus to that
      `main`. While `/api/me` loads, the shell shows a header-height bar, a `role="status"` element with the visually
      hidden text "Loading" (no `aria-busy`, which would make screen readers skip the status) and the library's
      `Skeleton` hidden from assistive technology, not a bare "Loading…" line; the lesson list's loading state follows
      the same pattern ("Loading the lessons"). The not-found view keeps FR-UI-3's link. Lists styled without bullets
      (`list-style: none`) carry `role="list"`. [unit] on `/`, `/lessons/w01` (loaded and error states) and
      `/no-such-page`: one `main#content` with tabindex -1 and the skip link first; following the skip link focuses
      it; [live] the `ui` step follows the skip link with the keyboard and finds focus on `main#content`; overflow is
      measured as `scrollWidth − clientWidth` of the document element. [story] the shell's loading state.
  # Amendment (2026-11-23, V/plan; reviewed with SRV-PLAN, deep-reviewer round 4 approve on d9f655a), promoted with
  # its Red tests. Until the upload track lands, `/import` shows WEB-PLAN's "Your sources" list and the study-time
  # and plan steps for already-imported materials; the drop zone joins later.
  - id: FR-UI-12
    text: >-
      **Import route and link.** The route table adds `/import` (the page component in `web/src/import/plan/`,
      WEB-PLAN, loaded as a lazy chunk) and the header an "Import" link, shown only for a user with role `owner` (from
      `/api/me`); a non-owner who opens `/import` sees the app's not-found view (web/src/app/routes.tsx `NotFound`).
      The page renders inside the shell's `main#content`. [unit] the link for owner and learner, the lazy route;
      [browser] `/import` under the production CSP.
  # FR-UI-14: V/signup (ADR-0031, accepted 2026-11-23); FR-UI-12 is V/plan's, FR-UI-13 is V/onboarding's.
  - id: FR-UI-14
    text: >-
      **Sign-ups entry points (WEB-ACCOUNTS).** The route table adds `/signups`, WEB-ACCOUNTS's page as a lazy chunk.
      For a user whose `/api/me` role is `owner`, the header shows a link "Sign-ups" to `/signups`, with the pending
      count of WEB-ACCOUNTS FR-ACCOUNTS-4; a learner sees no link, and on `/signups` a learner gets the not-found view
      (FR-UI-3) without any request to `/api/auth/signups`. The shell's behaviour is otherwise unchanged: one
      `main#content` (FR-UI-11), the skip link first, the 401 redirect of FR-UI-5. `web/test-server/` stubs
      `GET /api/auth/signups` and the three POST routes from VEC-ACCOUNTS-1, and its fixed map of static auth files
      adds `/api/auth/signup` → signup.html (SRV-AUTH FR-AUTH-31), five entries in all. [unit] the route table, the
      link for owner and learner, the learner's request log on `/signups`; [browser] WEB-ACCOUNTS FR-ACCOUNTS-5's
      matrix covers the link at 1280, 1024 and 390 px in both schemes.
  # Amendment (2026-11-23, V/compile-ui): the owner could not study the 105 planned lessons, because the list links
  # only published lessons and the only UI path that starts a compile is /import's "Start compiling lesson 1". Base:
  # the "compile status in the list" bullet of V/onboarding's draft FR-UI-13 (WEB-UI.yaml `proposed_requirements`),
  # extended with the Compile action. Ids (coordinator, 2026-11-23): FR-UI-13 stays the upload track's id, FR-UI-14 is
  # V/signup's, FR-UI-16 and above are the design pass's. The upload track keeps its FR-UI-13 (first run) and drops
  # its compile-status bullet at merge; this item supersedes it.
  - id: FR-UI-15
    text: >-
      **Compile from the lesson list (owner).** One component, `CompileControl` in `web/src/app/compile/` (with its
      status mapping and copy there; the five client functions `openCompiles`, `latestCompile`, `startCompile`,
      `resumeCompile` and `lessonEstimate` join FR-UI-4's API module, validated at run time like the others), used by
      the list rows and by WEB-NOTEBOOK FR-NOTEBOOK-12.
      - **"Has a revision" is not "compiled".** The `draft` step writes a revision (L02: about 157 s into a 210 s
        compile), so `latest_sha256` turns a row into FR-UI-6's link long before the run ends, and a run that stops
        later leaves a linked draft behind. The control is therefore keyed on the run's state, never on
        `latest_sha256` alone.
      - **Who:** only for a user with role `owner` (from `/api/me`). For anyone else the list is FR-UI-6 unchanged: no
        button, no status, no chip, and no request to a compile or estimate route.
      - **The list's run-state source:** one `GET /api/compiles` (SRV-PIPELINE FR-PIPELINE-17) per list view gives
        the owner's open runs: the latest run of each lesson whose state is not `converged` or `open_findings`.
        A lesson in that answer shows its run's state; a lesson absent from it has no open run: "not compiled yet"
        and a "Compile" button when `latest_sha256` is null, nothing beyond FR-UI-6 when it is set. The list makes
        no per-lesson status read.
      - **Draft chip:** a linked row (with `latest_sha256`) whose lesson has an open run shows, after the link, a
        muted chip "draft, compile not finished" before its status text, so a draft whose compile still runs or has
        stopped never reads as finished (owner feedback 2026-11-23: plan lesson 1 looked published, with open
        findings, while its compile was not finished).
      - **Status**, in FR-UI-6's status slot instead of "not published yet" (the stage labels: `draft` drafting,
        `fact_check` checking facts, `adversarial_review` reviewing, `revise` revising, `findings` collecting
        findings, `lab_verification` verifying labs; the stage is that of the last listed step that carries a
        `status`, else of the last step), the same with or without `latest_sha256`:
        - no run: "not compiled yet" and a "Compile" button;
        - `running` or `stalled`: "Compiling: <stage label>", no button;
        - `stage_failed`: "Compile stopped at <stage label>", then the message of the status's `error` code when it
          has one (SRV-PIPELINE FR-PIPELINE-16; `provider_missing`: "No AI provider is connected for your account.
          Connect one, then retry."; any other code: no extra text), and a "Retry" button;
        - `budget_exhausted`: "Compile stopped:" and the message of `refusals[0]` (`budget_exhausted`: "it reached
          its $<cap_usd> cap"; `task_budget_exhausted`: "a stage reached its own budget"; `monthly_budget_exhausted`:
          "the monthly budget is used up"; `daily_budget_exhausted`: "the daily budget is used up"; any other:
          "a budget was reached"), then "Spent $<spent_usd>.", and a "Compile" button (a new run);
        - `converged` or `open_findings` (the lesson page's single read only; the list never sees them): nothing
          beyond FR-UI-6;
        - a failed read of the run state: no status text of its own (an unpublished row keeps "not published yet")
          and, on an unpublished row, the "Compile" button (a running compile then answers 409, below).
      - **Polling:** while any run in the list's answer (or the lesson page's run) is `running` or `stalled`, that
        query refetches every `COMPILE_POLL_MS` = 5,000 ms (chosen: a stage takes tens of seconds, L02's whole
        compile 210 s); otherwise never. TanStack Query does not refetch in a background tab. Polling stops
        `COMPILE_POLL_MAX_MS` = 30 min (chosen: more than eight times L02's compile) after the query was last started
        or refreshed; the status then adds a "Refresh" button that refetches once and restarts the window. The window
        also restarts whenever a run starts, from any source: after this control's own POST, and whenever the
        query's answer holds a `running` or `stalled` run whose `run_id` that query has not polled before (a run
        started on another page or in another tab). So a run started after 30 idle minutes is polled. A status
        read calls SRV-PIPELINE's `ensure` (FR-PIPELINE-6, -11, -17), so an owner's page view can re-enqueue a
        stalled run; that is the server's recovery path, not a side effect to avoid.
      - **Revisions:** when a run's `latest_sha256` is not null and differs from the row's (or the page's), or a run
        leaves the answer or leaves `running`/`stalled`, the app invalidates the `['lessons']` and `['lesson', id]`
        queries, so the row becomes FR-UI-6's link (with the chip while its run is open) and the lesson page loads
        the newer revision.
      - **Confirm:** "Compile" opens a dialog (the library's `Dialog`) titled "Compile lesson <ordinal>?" with the
        lesson title, then:
        - the estimate from `GET /api/lessons/{lesson_id}/estimate` (SRV-PLAN FR-PLAN-13, the plan's own per-lesson
          formula, FR-PLAN-8): "Estimate: $<low_usd>–$<high_usd>" and "An estimate from one measured lesson (L02),
          scaled by this lesson's <kchars> thousand characters; not a bound." (kchars with one decimal); when
          `extrapolated`, also "This lesson is R× shorter than the measured one; the real cost is likely higher than
          this range." (R = `basis_kchars / kchars`, one decimal) or, when longer, "This lesson is R× longer than the
          measured one; the real cost may differ from this range." (R = `kchars / basis_kchars`); "Estimating…" while
          it loads; "No estimate for this lesson." on 404 or any error; when `kchars` is "0.000", instead "This
          lesson's pages have no text to compile." and the dialog's "Compile" is disabled (the server would answer
          `no_source_spans`);
        - "Stops at $<run_cap_usd>." (the estimate's `run_cap_usd`, else the client constant `RUN_CAP_USD` = "8.00",
          which a unit test pins to SRV-PIPELINE `bounds.run_cap_usd`);
        - "Compile" and "Cancel". "Compile" sends `POST /api/lessons/{lesson_id}/compile` with no body (the default
          cap, FR-PIPELINE-11; bodiless, FR-UI-4) and is disabled while the request is in flight; an in-flight ref
          guards it too, so two clicks in the same event-loop turn (before the disabled state renders) or Enter send
          one request.
        "Retry" opens the same dialog titled "Resume the compile of lesson <ordinal>?" with "Spent so far: $<spent_usd>
        of $<cap_usd>." in place of the estimate and "Stops at $<cap_usd>."; its "Resume" sends
        `POST /api/compiles/{run_id}/resume`. The decision is a pure function `submitAction(open, mode, run)`:
        nothing while the dialog is not open; in resume mode with no run (the run left the state after the dialog
        opened) it closes the dialog and posts nothing, never a new compile; otherwise resume or compile.
      - **After the request:** a 202 closes the dialog, refetches the run state (the list's `GET /api/compiles`, or
        the page's status) and moves focus to the row's (or page's) status text (`tabIndex={-1}`; the button that
        opened the dialog is gone). `compile_running` (409),
        `already_started` (409; not sent by this route today, FR-PIPELINE-15, mapped for completeness) and
        `not_failed` (409, resume) close the dialog the same way, so the row shows the run, and add a notice (FR-UI-7)
        "A compile of this lesson is already running.", "A lesson of this course is already compiled or compiling.",
        "This compile is no longer stopped.". Any other error keeps the dialog open with a `role="alert"` line:
        `lesson_unknown` and `not_found` "This lesson no longer exists. Reload the list." (and the list is
        invalidated), `no_material` "The source of this lesson is not imported.", `no_source_spans` "This lesson's
        pages have no text to compile.", `source_too_large` "This lesson is too long to compile in one run.",
        `network` "The server could not be reached. Check the connection and try again.", anything else "Something
        went wrong. Try again.". Budget refusals and `provider_missing` never come from these POSTs (a step meets
        them); they reach the row through the status above.
      - **Polish:** FR-UI-10 holds for the new CSS (tokens and spacing steps only, the 2px focus outline); the row's
        buttons are the library's small outline buttons. At 1280, 1024 and 390 px no page scrolls horizontally and
        axe reports no serious or critical issue on the list with a compiling row, a stopped row, the Compile dialog
        and the Resume dialog open, in light and in dark. The library's dialog fades in over `--acme-duration-slow`
        (280 ms in the library, 0 under `prefers-reduced-motion`; Calm does not change it), so the [browser] test
        runs axe only after the dialog's animations have finished, waiting at most 2 s (a longer fade fails the test).
      - **Test server:** `web/test-server/` serves, for the owner fixture, `GET /api/lessons/w02/estimate`, and a
        compile of `w02` shaped like a real one: no run until `POST /api/lessons/w02/compile` (202); then `running`
        at `fact_check` with a `latest_sha256` already set (the draft's revision) for two reads, while
        `GET /api/lessons` lists w02 with that sha256 (a link with the draft chip); then `converged`, when w02 leaves
        `GET /api/compiles`. `GET /api/compiles` and `GET /api/lessons/w02/compile` answer from the same state.
        `POST /__test__/reset` (204) restores the start; `POST /__test__/reset?w02=stopped` starts from a
        `stage_failed` run at `fact_check` with the draft's `latest_sha256` set and `error: "provider_missing"`.
        Every other lesson has no run. Because this state is global, web/playwright.config.ts runs with
        `workers: 1`.
      [unit] web/src/app/compile.test.tsx: owner and learner, one `GET /api/compiles` and no per-lesson status read
      on the list, every status and refusal mapping with and without `latest_sha256` (`stage_failed` and
      `budget_exhausted` on a linked row keep the chip and their button), the chip only for open runs, the stage of
      the last step with a `status`, the poll interval per state and its 30-minute stop with Refresh, a run started
      after 31 idle minutes is polled, `submitAction` (closed dialog, resume without a run, resume, compile), the
      confirm (estimate, extrapolated in both directions, missing estimate, zero characters, the cap, the bodiless
      POST, two clicks inside one `act` send one request), resume, every error mapping, focus after success, the list refetch
      that turns the row into a link, `RUN_CAP_USD` against SRV-PIPELINE's bounds; [story] CompileControl in each
      state and the dialog, Light and Dark; [browser] e2e/web/ui/compile.spec.ts at 1280, 1024 and 390 px against
      the test server: Compile, confirm, a link with the draft chip and "Compiling: checking facts", then the chip
      gone; the stopped state with the chip, Retry and the Resume dialog; light and dark; axe and horizontal scroll as
      above; no CSP violation.


# ---- Amendment (DRAFT, 2026-11-23, V/onboarding, for WEB-IMPORT). Held under `proposed_requirements` (not read by
# trace-check; this spec is approved) until reviewed; then it moves into `requirements` with its Red tests.
# FR-UI-12 (route and header link) was promoted on V/plan; FR-UI-13 stays with V/onboarding. ----
proposed_requirements:
  - id: FR-UI-13
    text: >-
      **Import first run and compile status.**
      - **First run:** on `/`, when `GET /api/lessons` returns no lessons and the user is the owner, the app asks
        `GET /api/materials`; if it lists no material at all (neither declared nor uploaded), the app replaces the
        location with `/import` (history `replace`, so Back does not loop). Any error of that call keeps the empty
        lesson list. A non-owner never calls it.
      - **Compile status in the list:** for each lesson with `latest_sha256: null`, at most 10 per render in list
        order (structural: one plan confirm starts one compile), the list asks `GET /api/lessons/{lesson_id}/compile`
        (SRV-PIPELINE FR-PIPELINE-11); 404 shows "not compiled yet", a `running` or `stalled` run "Compiling", a
        `stage_failed` or `budget_exhausted` run "Compile stopped", replacing "not published yet" in FR-UI-6's status
        slot. While any shown lesson is compiling, these queries refetch every 10 s.
      - `web/test-server/` stubs WEB-IMPORT's routes from VEC-IMPORT-1 and `/api/materials` with an empty and a
        non-empty list.
      [unit] the redirect (owner with nothing, owner with a material, non-owner, an error), the status mapping; [live]
      the owner slice suite sees the new course's first lesson as "Compiling" or later after a confirm with compile,
      run only with the owner's consent to spend; without it, "not compiled yet".

invariants:
  - id: INV-UI-1
    text: >-
      Contrast: under the committed Calm tokens every pair that VEC-UI-1's recipes expand to (109 per mode) meets its
      minimum (text 4.5:1, UI 3:1) in light and dark. The test derives every colour from the committed token file and
      computes composited backgrounds per the recipe (alpha composite in gamma sRGB; `color-mix` in sRGB and in Oklab,
      REF-UI-6); no colour value is stored in the fixture. [unit]
  - id: INV-UI-2
    text: >-
      No HTML string ever reaches the app document: no source file under `web/src/` uses `dangerouslySetInnerHTML`,
      `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`, `DOMParser`, `createContextualFragment`, `eval`,
      `new Function` or a string `setTimeout`/`setInterval`. A source scan test enforces it. Dependencies whose browser
      build parses HTML with the DOM are resolved to their JavaScript builds by `web/vite.config.ts` aliases
      (`hast-util-from-html-isomorphic` → its parse5 build; `decode-named-character-reference` → its table build); a
      test checks both aliases. [unit]
  - id: INV-UI-3
    text: >-
      No gradients, glass or glow: no value in the committed Calm token file contains `gradient`, and every story of
      the slice's own components (FR-UI-8), rendered in a browser in light and dark, has on every element a computed
      `background-image` of `none` (except `url(blob:…)` images), a computed `backdrop-filter` of `none`, and no
      `box-shadow` layer with a blur radius over 12 px. [unit] for the tokens; [browser] for the computed styles.
  - id: INV-UI-4
    text: >-
      Under the production CSP (the test server's header, read from `deploy/Caddyfile` as amended by
      V.OPS-DEPLOY-web), loading `/` and `/lessons/w01` with VEC-NOTEBOOK-1 raises zero `securitypolicyviolation`
      events. [browser]

