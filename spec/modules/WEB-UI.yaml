proposed_requirements:
  - id: FR-UI-13
    text: >-
      **Import first run and compile status.**
      - **First run:** on `/`, when `GET /api/lessons` returns no lessons and the user is the owner, the app asks
        `GET /api/materials`; if it lists no material at all (neither declared nor uploaded), the app replaces the
        location with `/import` (history `replace`, so Back does not loop). Any error of that call keeps the empty
        lesson list. A non-owner never calls it.
      - **Compile status in the list:** for each lesson with `latest_sha256: null`, at most 10 per render in list
        order (structural: one plan confirm starts one compile), the list asks `GET /api/lessons/{lesson_id}/compile`
        (SRV-PIPELINE FR-PIPELINE-11); 404 shows "not compiled yet", a `running` or `stalled` run "Compiling", a
        `stage_failed` or `budget_exhausted` run "Compile stopped", replacing "not published yet" in FR-UI-6's status
        slot. While any shown lesson is compiling, these queries refetch every 10 s.
      - `web/test-server/` stubs WEB-IMPORT's routes from VEC-IMPORT-1 and `/api/materials` with an empty and a
        non-empty list.
      [unit] the redirect (owner with nothing, owner with a material, non-owner, an error), the status mapping; [live]
      the owner slice suite sees the new course's first lesson as "Compiling" or later after a confirm with compile,
      run only with the owner's consent to spend; without it, "not compiled yet".

invariants:
  - id: INV-UI-1
    text: >-
      Contrast: under the committed Calm tokens every pair that VEC-UI-1's recipes expand to (109 per mode) meets its
      minimum (text 4.5:1, UI 3:1) in light and dark. The test derives every colour from the committed token file and
      computes composited backgrounds per the recipe (alpha composite in gamma sRGB; `color-mix` in sRGB and in Oklab,
      REF-UI-6); no colour value is stored in the fixture. [unit]
  - id: INV-UI-2
    text: >-
      No HTML string ever reaches the app document: no source file under `web/src/` uses `dangerouslySetInnerHTML`,
      `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`, `DOMParser`, `createContextualFragment`, `eval`,
      `new Function` or a string `setTimeout`/`setInterval`. A source scan test enforces it. Dependencies whose browser
      build parses HTML with the DOM are resolved to their JavaScript builds by `web/vite.config.ts` aliases
      (`hast-util-from-html-isomorphic` → its parse5 build; `decode-named-character-reference` → its table build); a
      test checks both aliases. [unit]
  - id: INV-UI-3
    text: >-
      No gradients, glass or glow: no value in the committed Calm token file contains `gradient`, and every story of
      the slice's own components (FR-UI-8), rendered in a browser in light and dark, has on every element a computed
      `background-image` of `none` (except `url(blob:…)` images), a computed `backdrop-filter` of `none`, and no
      `box-shadow` layer with a blur radius over 12 px. [unit] for the tokens; [browser] for the computed styles.
  - id: INV-UI-4
    text: >-
      Under the production CSP (the test server's header, read from `deploy/Caddyfile` as amended by
      V.OPS-DEPLOY-web), loading `/` and `/lessons/w01` with VEC-NOTEBOOK-1 raises zero `securitypolicyviolation`
      events. [browser] Live fix 2026-11-24 (7 `style-src-attr` reports per learner session, each when text replaced
      a selection in the lab editor): the interactions raise none either — for the owner at 1280 and 390 px the user
      menu, the Courses drawer, the lesson's "More lesson actions" menu, the tutor panel, text typed and inserted over
      a selection in the lab editor (WEB-NOTEBOOK FR-NOTEBOOK-9) and the Compile dialog of FR-UI-15 (the drawer only
      below 75rem, where its button shows). [browser] e2e/web/ui/csp.spec.ts.
      **Fresh builds.** The [browser] tests run against the builds they test: `web/test-server/server.mjs` refuses to
      start (exit 1, naming the stale build and the rebuild command) when `web/dist/index.html` or
      `web/storybook-static/index.json` is older than the newest of `web/src/**`, `web/.storybook/**`,
      `web/vendor/**`, `web/index.html`, `web/package.json`, `web/package-lock.json` and `web/vite.config.ts`
      (`.DS_Store` files ignored). Live run 2026-11-24: a Storybook build from before the design pass failed two
      render.spec checks with no product fault. [unit] web/src/app/stale.test.ts (over web/test-server/stale.mjs): fresh, a stale dist, a stale
      Storybook build, a missing build, each listed input newer than the builds, a newer `.DS_Store` ignored.

