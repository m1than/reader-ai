requirements:
  - id: FR-UI-1
    text: >-
      The library is the npm dependency `"@acme/ui": "file:vendor/acme-ui-v0.1.0.tgz"`. `npm pack` at the tag names its
      output after the source version (`acme-ui-0.0.0.tgz`; the release workflow sets the version only when
      publishing), so the script renames it to `acme-ui-v0.1.0.tgz`; the package inside stays `@acme/ui@0.0.0`.
      `web/vendor/acme-ui.lock.json` records `{tag: "v0.1.0", commit: <40-hex sha>, tarball: "acme-ui-v0.1.0.tgz",
      sha256, node: <version>, npm: <version>}`. `web/scripts/vendor-ui.mjs <library checkout>` refuses unless
      `git rev-parse v0.1.0^{commit}` in that checkout equals the recorded commit, then builds in a temporary clone at
      that commit with the library's own `npm ci && npm run build && npm pack` under the recorded Node version, writes
      the tarball and rewrites the lock file; it runs no git command that writes to a remote. A unit test hashes the
      committed tarball and compares it with the lock file. Imports use one entry per component (`@acme/ui/<entry>`),
      plus `@acme/ui/styles.css`. The slice uses these entries only: button, toast, progress, skeleton, tooltip,
      dialog, chip, divider, link, typography, stack, container, app-bar, list-view, alert. [unit]
  - id: FR-UI-2
    text: >-
      Calm tokens are data: `web/src/ui/tokens/calm.tokens.json` (W3C Design Tokens, light and dark, starting from the
      spike's adjusted draft), compiled by `web/src/ui/tokens/build.mjs` into `calm.css`, which overrides the
      library's `--acme-*` variables unlayered, maps holo, glass and glow to flat values, and sets every duration to 0
      under `prefers-reduced-motion: reduce`. The generator is deterministic (same input, byte-identical output) and the
      committed `calm.css` equals its output (test). The app shell paints `--acme-canvas` on `html` (spike finding 4)
      and follows `prefers-color-scheme`. [unit]
  - id: FR-UI-3
    text: >-
      Routes (TanStack Router, declared as one route table): `/` the lesson list; `/lessons/$lessonId` the lesson view
      (WEB-NOTEBOOK); anything else a not-found view with a link to `/`. `$lessonId` must match
      `^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$` and must not be `.` or `..` (VEC-UI-2 `bad_ids`), otherwise the not-found
      view renders and no request is made. [unit]
  - id: FR-UI-4
    text: >-
      API client: one module with a typed function per route the slice calls (`me`, `signOut`, `listLessons`,
      `getLesson`, `getRevision`, and the kernel session routes used by WEB-NOTEBOOK). Path segments are encoded with
      `encodeURIComponent`. Every request is same-origin with `credentials: "same-origin"`; a request with a body sends
      JSON with `Content-Type: application/json`; bodiless POST and DELETE send no body (SRV-AUTH FR-AUTH-12, SRV-KERNEL
      FR-KERNEL-3). Every response body is validated at run time against its declared shape (VEC-UI-2 for the lesson
      routes); a mismatch is an error `bad_response`, never a partially typed value. TanStack Query caches the list and
      lesson metadata with a stale time of 30 s (a structural choice: lessons change only on republish) and a revision
      with an infinite stale time keyed by its sha256 (revisions are immutable). [unit]
  - id: FR-UI-5
    text: >-
      Authentication: on app start the app calls `GET /api/me`, whose body is SRV-AUTH FR-AUTH-9's
      `{id, handle, role, display_name, consent: {evaluation, tuning}}` with `id` the user's UUID as a string (found by
      the live run, 2026-11-22: the client had expected a number and rejected every real response); on a 401 from it, or
      from any later API call, the app
      navigates the whole page to `/api/auth/signin` (SRV-AUTH FR-AUTH-14, which returns to `/` on success). The header
      shows the signed-in `display_name` and a Sign out button that calls `POST /api/auth/signout`, clears the query
      cache and then navigates to `/api/auth/signin`. The SPA never reads, stores or logs the session cookie, and keeps
      no credential in `localStorage`, `sessionStorage` or IndexedDB. [unit]
  - id: FR-UI-6
    text: >-
      Lesson list: `GET /api/lessons`, grouped by course (`course_title`, courses sorted by title in the user's locale)
      and within a course by `ordinal`. A lesson with `latest_sha256` set is a link to `/lessons/<lesson_id>` with its
      title and updated date; a lesson with `latest_sha256: null` is shown without a link and with "not published yet".
      Each lesson is one row: its ordinal, its title, then the status ("not published yet") and the date as separate
      muted elements at the row's end (under the title below 40rem), so status and date never read as part of the
      title (the live list ran them together; live run 2026-11-23).
      States: loading (skeleton), empty ("No lessons yet"), error (a calm message with Retry). [unit] [story]
  - id: FR-UI-7
    text: >-
      Notices: one toast region for app-level messages (sign-out failure, network loss, the notebook's kernel notices
      handed over by WEB-NOTEBOOK). At most 3 toasts are visible (a structural bound for a calm screen); older ones
      collapse. Every message is plain text from a fixed catalogue keyed by code; no server text is shown as HTML.
      [unit] [story]
  - id: FR-UI-8
    text: >-
      Stories: every exported React component in `web/src/{ui,app,notebook,render}/` (a PascalCase export of a `.tsx`
      file that is not a story or test) has a sibling `<File>.stories.tsx` with at least the stories `Light` and `Dark`
      (Calm in each mode). A [unit] test enumerates the components, finds the sibling file through Vite's
      `import.meta.glob` (whose keys are `./`-relative in the test's own directory and `../`-relative elsewhere),
      asserts both stories, and renders every story through Storybook's `composeStories` in jsdom without an error. `npm run build-storybook` is
      part of the local gate. [unit] [story]
  - id: FR-UI-9
    text: >-
      Build: Vite with `build.assetsInlineLimit: 0`, so fonts and images are emitted as files and never inlined as
      `data:` URLs (the app CSP allows none); markdown, math, code highlighting and the lesson view are lazy chunks.
      [unit] by inspecting the build output for `data:` URLs. The only `data:` URL allowed in the output is the one
      literal that the vendored library's own stylesheet carries at v0.1.0 (a `mask: url("data:image/svg+xml,…")` for
      the table sort indicator, a component the slice does not render; under the app CSP that mask would be blocked, so
      it is an owner note for a library change, not an inlined asset). The test pins the number of distinct `data:`
      URLs at exactly 1 (the minifier repeats it for `-webkit-mask`), so a new library literal fails the build check
      until it is reviewed.
  - id: FR-UI-10
    text: >-
      Layout and type (WEB polish, from the live screenshots of 2026-11-23). Spacing uses the library's
      `--acme-space-1..7` steps only; colours only Calm tokens (INV-UI-1 unchanged). Prose (lesson markdown, the
      tutor's answers) is set in the serif stack at 17px with line height 1.65 in a reading column at most 38rem wide
      (about 70 Cyrillic characters per line; the slice's 46rem column gave about 92); headings step 2.25 / 1.5 /
      1.2rem; UI chrome (header, labels, buttons, references, list metadata) uses the library's sans `--acme-font` at
      0.8125–0.875rem. Widths: at 1280 and 1024 px the lesson shows its contents column beside the reading column
      (WEB-NOTEBOOK FR-NOTEBOOK-11), below 60rem one column with 1rem page padding. Markdown tables and display math
      scroll inside their own box. At 1280, 1024 and 390 px no page scrolls horizontally. Every interactive element
      (links, buttons, text areas, the disclosure summary) shows a 2px `--acme-focus` outline on `:focus-visible`.
      [unit] a scan of `web/src/ui/app.css`: no literal colour (no hex value or colour function; every `color` and
      `background` value is `var(--acme-…)`, `transparent`, `inherit`, `currentColor` or `none`), every `padding`,
      `margin`, `gap` and `inset` value made of `0`, `auto` and `var(--acme-space-N)` only, the
      reading column's `max-width: 38rem`, and a `:focus-visible` rule whose outline uses `var(--acme-focus)`. [live]
      the `ui` step of e2e/web/live/owner.slice.ts on the running stack: at each width `scrollWidth` ≤ the viewport
      width on the list and on L02, the widest `[data-markdown] p` ≤ 608px, and axe reports no serious or critical
      issue.
  - id: FR-UI-11
    text: >-
      Keyboard and states of the shell: the first Tab stop is a "Skip to content" link (visible when focused) to the
      page's `main` (`id="content"`, `tabIndex={-1}`); the header and every page share one horizontal padding. While
      `/api/me` loads, the shell shows a header-height bar and a skeleton, not a bare "Loading…" line. The not-found
      view keeps FR-UI-3's link. [unit] [story]

invariants:
  - id: INV-UI-1
    text: >-
      Contrast: under the committed Calm tokens every pair that VEC-UI-1's recipes expand to (109 per mode) meets its
      minimum (text 4.5:1, UI 3:1) in light and dark. The test derives every colour from the committed token file and
      computes composited backgrounds per the recipe (alpha composite in gamma sRGB; `color-mix` in sRGB and in Oklab,
      REF-UI-6); no colour value is stored in the fixture. [unit]
  - id: INV-UI-2
    text: >-
      No HTML string ever reaches the app document: no source file under `web/src/` uses `dangerouslySetInnerHTML`,
      `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`, `DOMParser`, `createContextualFragment`, `eval`,
      `new Function` or a string `setTimeout`/`setInterval`. A source scan test enforces it. Dependencies whose browser
      build parses HTML with the DOM are resolved to their JavaScript builds by `web/vite.config.ts` aliases
      (`hast-util-from-html-isomorphic` → its parse5 build; `decode-named-character-reference` → its table build); a
      test checks both aliases. [unit]
  - id: INV-UI-3
    text: >-
      No gradients, glass or glow: no value in the committed Calm token file contains `gradient`, and every story of
      the slice's own components (FR-UI-8), rendered in a browser in light and dark, has on every element a computed
      `background-image` of `none` (except `url(blob:…)` images), a computed `backdrop-filter` of `none`, and no
      `box-shadow` layer with a blur radius over 12 px. [unit] for the tokens; [browser] for the computed styles.
  - id: INV-UI-4
    text: >-
      Under the production CSP (the test server's header, read from `deploy/Caddyfile` as amended by
      V.OPS-DEPLOY-web), loading `/` and `/lessons/w01` with VEC-NOTEBOOK-1 raises zero `securitypolicyviolation`
      events. [browser]

nfr:
  - id: NFR-UI-1
    metric: >-
      gzip size in bytes (Node zlib, level 9) of the initial JavaScript chunks of the lesson-list route in the `vite
      build` output (lazy chunks excluded), production mode. Measured after the code review (2026-11-22, Vite 8.3.8,
      Node 26.13.0): one initial chunk, 350,012 B raw, 110,139 B gzip (React 19 + ReactDOM, TanStack Router and Query,
      valibot, the library parts used, the app shell); threshold = measured + 10 %. Lazy chunks, for the record, from
      the same build: the lesson view with markdown, KaTeX (parsed by parse5) and the notebook 199,283 B; Shiki core and
      engine 47,284 B; the python grammar 9,012 B. For comparison, the spike's React-plus-20-component gallery measured
      124,206 B (REF-UI-2).
    threshold: 121153
    verified_by: test

vectors:
  - id: VEC-UI-1
    source: >-
      Contrast pair recipes (groups, token sets, mix operations and minimums) from spikes/library-publish/consumer/calm.mjs
      and the library CSS lines it cites; expands to the spike's 218 pairs
    file: spec/fixtures/WEB-UI/contrast-recipes.yaml
  - id: VEC-UI-2
    source: >-
      SRV-LESSON response shapes as fixed by the coordinator (2026-11-21), synthetic values, plus lesson ids the router
      must refuse
    file: spec/fixtures/WEB-UI/lessons.json

