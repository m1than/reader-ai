  - web/src/ui/**
  - web/src/app/**
  - web/src/main.tsx
  - web/.storybook/**
  - web/scripts/**
  - web/vendor/**
  - web/index.html
  - web/package.json
  - web/package-lock.json
  - web/vite.config.ts
  - web/tsconfig.json
  - web/test-server/**
  - e2e/web/ui/**
