      published lessons are links to their view, the current lesson's link has `aria-current="page"` and the
      `--acme-hover` fill; unpublished rows are muted text, without the compile slot (review: the sidebar is
      navigation, the list and the not-published page carry the slot). A closed group shows no rows; an
      open group of at most 12 lessons shows them all; an open group of more than 12 shows its published rows and the
      current one, plus "Show all <N>" (then "Show fewer"), as FR-UI-6. The group holding the current lesson starts
      open, the others closed. It is links in disclosure lists, not the library's `tree-view` (FR-UI-1). While the
      lessons load, the sidebar shows the library `Skeleton` hidden from assistive technology and no `role="status"`
      (the page's own status speaks, FR-UI-11); if the query fails it shows "Courses could not be loaded." with a
