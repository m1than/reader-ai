  - id: FR-UI-16
    text: >-
      **Theme.** The user menu (FR-UI-11) holds a radio group "Theme" with "System", "Light" and "Dark" (the library
      `Menu`'s radio items). System removes `data-theme` from `html`, so `calm.css` follows `prefers-color-scheme`;
      Light and Dark set `data-theme` to `light` or `dark`. The choice is stored in `localStorage` under
      `reader-ai.theme` as `system`, `light` or `dark` (a display preference, not a credential: FR-UI-5's rule is about
      credentials). **Before first paint (review B5):** `web/index.html` loads the classic external script
      `/theme.js` (`web/src/public/theme.js`; vite.config.ts sets `publicDir: 'src/public'`, so the file is copied to
      the build's root and reaches the production image, whose Caddy build copies `src` but not `web/public` — code
      review B1; `<script src="/theme.js"></script>` in `<head>`,
      before any stylesheet and the module script, no inline script, so the app CSP's `script-src 'self'` allows it),
      which reads the stored value and sets the attribute synchronously while the document is parsed, so the first
      painted frame already has the chosen scheme; the app's `web/src/ui/theme.ts` (`readTheme`, `applyTheme`) applies
      later changes with the same rule. A missing, unreadable (storage blocked) or other value means System. Every
      component follows a change without a reload, code blocks included (WEB-RENDER FR-RENDER-4) and the lab editor
      (WEB-NOTEBOOK FR-NOTEBOOK-9). Declared gap: SRV-AUTH's sign-in and bootstrap pages read no app storage and keep
      following the system scheme only (changing them is SRV-AUTH work, a complex area; not in this pass). [unit] the
      apply function for each stored value, a throwing storage, the menu's radio state and the attribute after a
      choice; `theme.js` run in a `node:vm` context with a fake document and storage gives the same attribute as
      `applyTheme` for every stored value and a throwing storage; `index.html` loads it from `<head>` before the module
      script and has no inline script (this regex check on index.html is the oracle for the placement; the build test
      also finds `theme.js` at the build's root); [live] the `ui` step: `GET /theme.js` answers 200 with a JavaScript
      content type, and with `dark` stored a reload gives `html[data-theme="dark"]`; [browser] with `colorScheme: 'dark'` and Light stored, `documentElement.dataset.theme`
      read in the first `requestAnimationFrame` (an `addInitScript` hook) is `light`, `html`'s computed background is
      the light `--acme-canvas`, and a python code token's colour changes without a reload after Dark is chosen; [story]
      the user menu open in Light and Dark.
  - id: FR-UI-17
    text: >-
      **Course sidebar.** A `nav` labelled "Courses" built from the same `GET /api/lessons` query (no other request):
      one group per course in FR-UI-6's order, each headed by a disclosure button (`aria-expanded`, `aria-controls`)
      with the course title and the count "<P>/<N>" (published of all, tabular figures, the visible text followed by a
