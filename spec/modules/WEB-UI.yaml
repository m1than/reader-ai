# WEB-UI — the app shell: the owner's component library consumed from a pinned build, the Calm tokens, routing,
# the API client, sign-in and sign-out, the lesson list and Storybook (vertical slice V6, `V.WEB-min`; full module in
# stage 4b).
#
# Scope (slice): a signed-in learner sees their lessons and opens one; the lesson view itself is WEB-NOTEBOOK, output
# rendering is WEB-RENDER. Sign-in uses SRV-AUTH's own pages (FR-AUTH-14), which WEB-UI replaces only in stage 4.
#
# Library consumption (ADR-0013, spike library-publish): the owner tagged `v0.1.0` on the library's
# `web3/material-parity` line (commit eae463bc, merge of the release workflow); its GitHub Packages release has not run
# (Actions billing). Until it has, reader-ai consumes a tarball built from that tag by a committed script, checked in
# with its sha256 (FR-UI-1). The script only clones, builds and packs locally; it never pushes, tags or publishes in the
# library repository (the library's AGENTS.md). When the registry release exists, a paired change switches the
# dependency to `@m1than/ui@0.1.0` and the imports from `@acme/ui/*` to `@m1than/ui/*` (spike finding 1).
#
# Declared deviations from proposed ADR-0013, for the owner:
# - API client: hand-written typed wrappers with runtime validation for the slice's few routes, not a client generated
#   from the server's OpenAPI. Generation comes in stage 4 when the API surface grows (it needs an exported
#   openapi.json, a SRV-AUTH `reader-server` change).
# - Storybook's live token editor and the library gallery under Calm are deferred to stage 4b; the slice builds
#   Storybook with stories for its own components only. The owner's design gate (roadmap 4b) is still required before
#   anything in 4b is marked implemented.
#
# Content Security Policy: the app never sets `innerHTML` and never injects `<style>` or `<script>` at run time
# (INV-UI-2), so it needs no 'unsafe-inline'.
#
# Cross-spec items (paired change in OPS-DEPLOY, task V.OPS-DEPLOY-web, before V.WEB-min Green):
# - Caddyfile app CSP: keep `default-src 'self'` and `frame-ancestors 'none'`; add `img-src 'self' blob:`
#   (image outputs as blob: URLs), `connect-src 'self' wss://localhost` (explicit, for engines where 'self' does not
#   cover wss), `frame-src 'none'`, `object-src 'none'`, `base-uri 'none'`, `form-action 'self'`. No data: anywhere
#   (FR-UI-9).
# - Serving (done in V.OPS-DEPLOY-web: the derived image `reader-caddy:local`): the built `web/dist` at `/srv/spa`;
#   `/assets/*` served as files only (a missing asset is a 404); an SPA fallback (`try_files {path} /index.html`) for
#   every other path outside `/api/*` and `/mcp`, so deep links such as `/lessons/w01` load.
# - SRV-LESSON (V4; API fixed by the coordinator 2026-11-21): `GET /api/lessons` →
#   `{"lessons": [{lesson_id, course_id, course_title, ordinal, title, updated_at, latest_sha256}]}` (VEC-UI-2);
#   `GET /api/lessons/{lesson_id}` → `{"lesson": {…the list fields}, "revisions": [{sha256, byte_size, cell_count,
#   created_at, stages}]}` exactly as SRV-LESSON FR-LESSON-8 (nested; the live run of 2026-11-22 found the client and
#   VEC-UI-2 expecting the fields flat, so every lesson page failed); the notebook only from
#   `GET /api/lessons/{lesson_id}/revisions/{sha256}` (immutable, ETag).
# - SRV-AUTH (approved): `GET /api/me`, `POST /api/auth/signout`, the sign-in page `GET /api/auth/signin`, the
#   `Origin` and Content-Type rule (FR-AUTH-12), the session cookie (HttpOnly; the SPA never reads it).
#
# Test levels: [unit] Vitest in jsdom; [story] the story builds in `npm run build-storybook` (ci-local); [browser]
# Playwright (Chromium) against `vite preview` behind the committed test server (`web/test-server/`), which reads the
# CSP header from `deploy/Caddyfile` and stubs `/api/me` and the lesson routes with VEC-UI-2, run on request and in the
# slice live check. Paired SRV-AUTH change (2026-11-23, FR-AUTH-21): the test server also serves SRV-AUTH's four
# static auth files from a fixed map of exactly four entries (`GET /api/auth/signin` → signin.html,
# `/api/auth/bootstrap` → bootstrap.html, `/api/auth/static/passkey.js`, `/api/auth/static/auth.css`, read from
# `server/src/reader/auth/static`, no other path) with the Caddyfile's Content-Security-Policy header and the api's
# content types, and web/playwright.config.ts runs e2e/web/auth/** in two projects of its own, `auth-dark` and
# `auth-light` (`colorScheme`), while the existing `chromium` project keeps the ui, render and tutor specs; the
# ceremony POSTs are stubbed by the auth spec itself (page.route) (Playwright's browsers are not installed by ci-local).
# Design pass (2026-11-23): the `chromium` project also matches e2e/web/notebook/** (WEB-NOTEBOOK's lab editor under
# the CSP, its kernel WebSocket routed by Playwright's `routeWebSocket`); [live] `e2e/live/slice.sh` against
# `reader up`, signed in with the S1 `live-check` learner through a Chromium virtual authenticator.

