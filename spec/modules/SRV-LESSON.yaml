test_levels:
  unit: "FR-LESSON-1, 2, 3, 5 and VEC-LESSON-1..3 without a database (blobs in a temporary directory)."
  db: "FR-LESSON-4, 6..14 and every INV against Postgres via testcontainers on the pinned postgres:18-trixie digest, with SRV-AUTH's migrations applied; skipped without a Docker daemon. Routes are exercised in-process through SRV-AUTH's app factory with a session created through SRV-AUTH's internal session function (no WebAuthn ceremony needed)."
  live: "e2e/live/slice.sh, on a fresh `blobs` volume: `docker compose exec api python -m reader.lessons.fixture load --handle live-check` must exit 0 (the first blob write on the fresh volume, which proves the OPS-DEPLOY ownership item), then `GET /api/lessons` and the revision route with the live-check session return F01's sha256 and bytes."

defers:
  - "Gate G2 (ADR-0009) and its publish route, to SRV-PIPELINE, including the three checks the round-1 review found missing here: (a) lab verification bound to the lesson's ordered list of labs with their asserts (not per cell in isolation); (b) an `explain` cell with no claims counts as uncited, and a blocking finding closed as `wontfix` still blocks until the owner decides; (c) stage completions per revision (lesson_revision_stages) as the evidence that stages 4–6 ran on that exact revision. VEC-LESSON-3's `g2` cases are its first inputs."
  - "Resolving span ids to source text and the stage-4 citation checks (SRV-PIPELINE with SRV-INGEST)."
  - "Hidden expected lab values (ADR-0004 `expected`, hashed); the slice schema refuses the key until its design exists."
  - "Learner state keyed by cell id: progress, notes text, recall schedule (stage 4 SRV-LESSON, SRV-RECALL, WEB-NOTEBOOK)."
  - "Course index notebook `index.ipynb` (ADR-0004); course routes; the slice lists lessons from Postgres."
  - "Kinds beyond the slice's lab settings: `kernel` rust and deno, `network: allowlist` (stage 4 with OPS-SANDBOX)."
  - "Sharing and roles (viewer, learner, editor; ADR-0016), exports (SRV-EXPORT), KB sectors use (ADR-0015)."
  - "Garbage collection of unreferenced blobs."
  - "Migration of the Chapter 1 lesson from Claude Docs (ADR-0004 consequences)."
  - "Per-lab timeout from cell metadata (SRV-KERNEL defers it here; stage 4)."

owner_notes:
  - "In the slice you study L02 as a draft revision; there is no publish step yet. Publishing (G2) arrives with SRV-PIPELINE, with ADR-0009's checks and no override."
  - "cell.schema.json lives under spec/fixtures/SRV-LESSON/ (ADR-0004 named spec/fixtures/lesson/); ADR-0004 is proposed and its path was a placeholder ('to be drafted with SRV-LESSON')."
