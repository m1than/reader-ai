  # Amendment (2026-11-24, V/manage, WEB-MANAGE): FR-LESSON-20..31 and INV-LESSON-20..23; see the note at the end.
  - id: FR-LESSON-20
    text: >-
      **Migration and new courses.** One migration on the `lessons` branch adds the FR-LESSON-20 columns and the
      three learner tables of `tables`. Existing
      courses get `position` = their rank by `created_at` descending per owner (1 = newest, the list's order today),
      `version` 1; existing lessons `version` 1. A course created later (SRV-PIPELINE's course import, SRV-PLAN's
      confirm) goes first: `store.create_course` (store.py) shifts every positioned course of the owner by one, then
      inserts the new course at position 1, in reorder_lessons' two statements. `store.place_at(conn, owner_id,
      course_id, p)` does the same for an existing course at position p (clamped to 1..n+1); `place_first` is
      `place_at(…, 1)`. **Position lock:** every write of `courses.position` — create, place_at, the order route,
      and the archive and delete that null a position — first takes one owner-level advisory lock
      `pg_advisory_xact_lock(<namespace "RCPO">, hashtext(owner_id))`, after any course and lesson locks the same
      request takes (INV-LESSON-23's order, extended), so two position writes of one owner never interleave. Every
      new foreign key is ON DELETE RESTRICT, not deferrable (FR-LESSON-15's catalog check covers them). `user_id`
      is the reader; `owner_id` is the course owner (INV-LESSON-7); they are equal until SRV-SHARE. [db] the
      migration's order for three courses; a new course goes first; the CHECK refuses a positioned archived
      course; a create and an order route of one owner run together 50 times and always leave positions 1..n.
  - id: FR-LESSON-21
    text: >-
      **Courses list.** `GET /api/courses?state=active|archived|deleted` (session; default `active`) lists the
      caller's own courses in that state by `position`, then `created_at`: `{courses: [{course_id, title,
      description, position, state, archived_at, deleted_at, version, lesson_count, material_id | null, plan:
      {total_weeks, minutes_per_day, start_date, finish_by} | null}]}` (`plan` from SRV-PLAN's study_plans;
      `material_id` from SRV-INGEST by `material_sha256`). Active courses come by `position`; archived and deleted
      ones (no position) by `archived_at` or `deleted_at`, newest first. A non-owner of every course gets an empty
      list (the list is scoped, never 403). `GET /api/courses/{id}/lessons?state=deleted` (owner of a course that
      is not deleted, else 404) lists that course's deleted lessons `{lessons: [{lesson_id, title, ordinal,
      deleted_at}]}`, newest deletion first, for WEB-MANAGE's "Recently deleted". [db] each state, ordering,
      another owner's courses absent; the deleted-lessons list.
  - id: FR-LESSON-22
    text: >-
      **Edit a course.** `POST /api/courses/{id}` with `{version, title?, description?}` (at least one field) →
      200 the course row as in FR-LESSON-21 with `version + 1`. Order of checks: a deleted course → 404; field
      validation — `title` trimmed and NFC-normalised, 1..200 characters, no Cc characters (else 400
      `title_invalid`), `description` trimmed, ≤ 2000 characters, `""` clears it (else 400 `description_invalid`);
      then the **no-op check**: when every given field equals the stored value, 200 with the current row and
      version, nothing written, whatever `version` says (INV-LESSON-21); then `version` not equal to the stored one
      → 409 `{"error": "stale", "course": <current>}`; then, for a course without material, a title that another
      course of the owner that is not deleted holds → 409 `title_taken`. Renaming a planned course does not change
      its plan id (SRV-PLAN keys plans by `plan_course_id`, not by title). Revisions written before a rename keep
      the old course name wherever they quote it (citations and the notebook's metadata are immutable revisions;
      stated, not changed). [db] each field, each refusal, the no-op with a stale version.
  - id: FR-LESSON-23
    text: >-
      **Order courses.** `POST /api/courses/order` with `{course_ids: [...]}` — exactly the caller's active courses
      (archived and deleted ones have no position), else 409 `order_mismatch` with the current list — sets
      `position` 1..n in list order in one transaction, in two statements (the partial unique index is not
      deferrable). The exact-set check is this route's concurrency guard: it carries no `version`, and of two
      concurrent orders of the same set the later one wins (stated; the order is one owner's own arrangement).
      Repeating the current order is a no-op. [db] order, mismatch, no-op.
  - id: FR-LESSON-24
    text: >-
      **Archive.** `POST /api/courses/{id}/archive` with `{}` takes the header's locks, refuses with 409
      `compile_running` while any of its lessons has an open run, then sets `archived_at`, copies `position` into
      `last_position` and clears `position`; `/unarchive` with `{at?: "previous" | "first"}` (default `"first"`)
      on a deleted course answers 404 `not_found` (restore it first; nothing written); otherwise it clears
      `archived_at` and places it with `place_at` at `last_position`
      for `"previous"` (WEB-MANAGE's Undo toast sends it, so Undo puts the course back where it was) or at 1 for
      `"first"`. Repeating either returns 200 with the same body (idempotent). An archived course's lessons still
      open by link (FR-LESSON-8/-9) and its tutor works; SRV-PIPELINE refuses to compile them (FR-PIPELINE-22). [db]
      archive with an open run refused; archive → unarchive `"first"` returns the course to position 1; archive →
      unarchive `"previous"` returns it to its old position with the others shifted.
  - id: FR-LESSON-25
    text: >-
      **Delete and restore a course.** `GET /api/courses/{id}/impact` → `{lessons, revisions, tutor_questions,
      compile_runs, spend_rows, open_runs}` (counts over the course; `spend_rows` counts SRV-AGENT rows whose
      `lesson_id` is one of its lessons; read-only). `DELETE /api/courses/{id}` with `{confirm}`: the target is
      the stored title NFC-normalised, cut to its first 40 code points, then trimmed of leading and trailing white
      space; the request's `confirm` is NFC-normalised and trimmed; they must be equal (else 400
      `confirm_mismatch`; WEB-MANAGE FR-MANAGE-2 asks for exactly that text; SRV-INGEST FR-INGEST-31 uses the same
      rule); an empty target (a title whose first 40 code points are all white space) matches nothing: the delete
      answers 400 `confirm_mismatch` for every `confirm`, the empty one included, and the web confirm button stays
      disabled;
      under the header's locks, a course with an open run → 409 `compile_running` (cancel it first,
      FR-PIPELINE-20); otherwise `deleted_at` = now, `last_position` = `position` (when it had one) and `position` =
      null in one transaction, and the response is the impact body plus `deleted_at`. A second DELETE of a deleted
      course returns 200 with the same body. `POST /api/courses/{id}/restore` with `{at?: "previous" | "first"}`
      (default `"first"`) clears `deleted_at` and `deleted_by_material`; then, **only when `archived_at IS NULL`**,
      it places the course with `place_at` (`last_position` for `"previous"`, the Undo toast's choice; 1 for
      `"first"`); otherwise the course returns to the archived list with no position, so the CHECK of
      `tables.courses` holds (a course has a position exactly when it is neither archived nor deleted).
      SRV-INGEST FR-INGEST-31's cascade restore applies the same rule with `"first"`. 409 `material_deleted` while
      its material is deleted (restore the material, which restores this
      course too if its cascade deleted it, SRV-INGEST FR-INGEST-31); 409 `title_taken` when a course without
      material that is not deleted took the title meanwhile; repeating it is a no-op. Nothing else is deleted or
      updated: lessons, revisions, stage records, compile runs, tutor questions, notes and spend rows stay
      (INV-LESSON-22). [db] the counts; delete → every read of its lessons is 404 → restore → readable again; the
      rows of every table unchanged across delete and restore; restore refused while the material is deleted; a
      41-character title confirmed by its first 40; the title `"a"*39 + " tail words"` (40th code point a space)
      confirmed by `"a"*39` and refused for `"a"*39 + " t"`; an NFD-typed Cyrillic title matches; archive → delete →
      restore returns the course archived with a null position (no CHECK violation), then unarchive places it;
      delete → restore `"previous"` returns it to its old position.
  - id: FR-LESSON-26
    text: >-
      **Rename a lesson.** `POST /api/lessons/{id}` with `{version, title}` (owner of the course): FR-LESSON-22's
      title, no-op and `stale` rules, in that order; under the lesson's run lock, 409 `compile_running` while the
      lesson has an open run (the running steps read the title). 200 the lesson row of FR-LESSON-7. A re-plan keeps
