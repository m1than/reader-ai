      deletes the row (hard: a note is the reader's private text and nothing else refers to it, so keeping a
      tombstone would only keep text the reader asked to remove; WEB-MANAGE's Undo posts the same body again as a
      new note). `body` is 1..10,000 characters after trimming (else 400 `note_invalid`); `cell_id`, when given,
      must be a cell of the current revision (else 400 `cell_unknown`). `POST` and `DELETE
      /api/lessons/{id}/bookmarks/{cell_id}` add or remove a bookmark (idempotent; adding validates `cell_id`
      against the current revision, else 400 `cell_unknown`; a 201st bookmark on the lesson → 409 `limit`); `GET
      /api/bookmarks` lists the caller's bookmarks across lessons that are not deleted, a bookmark whose cell left
      the current revision marked `stale: true`. Another user's note id → 404. [db] each route, both caps, an
      unknown cell.

invariants:
  - id: INV-LESSON-1
    text: >-
      Every blob referenced by a `lesson_revisions` row passes FR-LESSON-1 and hashes to its sha256. Property test:
      for notebooks generated by Hypothesis from the schema's kinds (valid and mutated), `write_revision` either raises
      one of `write_errors` and leaves no row (no revision, no stage record), or stores bytes that re-validate.
  - id: INV-LESSON-2
    text: >-
      Round trip (ADR-0004): for every stored revision, validating its canonical bytes and producing canonical bytes
      again yields the same bytes; writing the same notebook (any key order or indentation of the input) twice yields
      one blob, one revision row, two stage records and `created` false the second time.
  - id: INV-LESSON-3
    text: >-
      For any sequence of successful writes to one lesson, taken in stage-record order (id), the set of `notes` cell
      ids of each recorded revision contains the set of the one recorded before it (republishing never drops a
      learner-owned cell id, also when a stage makes an earlier revision current again). Holds under concurrent
      writers to one lesson (FR-LESSON-4 step 1; tested with two connections) and for Hypothesis-generated write
      sequences.
  - id: INV-LESSON-4
    text: >-
      Isolation: for two users A and B and every route of this module, a request by A about B's lesson or revision
      gets the same response (FR-LESSON-12's definition) as one for a random non-existent lowercase UUID.
  - id: INV-LESSON-6
    text: >-
      Immutability: rows of `lesson_revisions` and `lesson_revision_stages` are never updated, deleted or truncated
      (row triggers refuse UPDATE and DELETE, a `BEFORE TRUNCATE … FOR EACH STATEMENT` trigger refuses TRUNCATE; a test
      attempts each), and `reader.blobs.put` never changes the bytes at a final name whose bytes already hash to it.
  - id: INV-LESSON-7
    text: >-
      `owner_id` of lessons, revisions and stage records always equals the owning course's `owner_id` (composite
      foreign keys; a test inserts a mismatching row and expects the database to refuse it).
  - id: INV-LESSON-20
    text: >-
      **Access.** Every route of this amendment is `auth: session` and runs FR-AUTH-12's Origin and content-type
      checks before its handler. An id of a course or lesson that the caller does not own (or cannot open, for
      FR-LESSON-29/-31) answers 404 `not_found`, exactly as a missing id, with no row written; no route here answers
      403, so a learner cannot learn that an object exists. [db] for every route: a learner and a second owner get
      404 with zero rows changed in every table; a foreign Origin gets 403 `origin` with zero rows changed; the
      owner posting progress, a note and a bookmark to a deleted lesson gets 404 with zero rows changed.
  - id: INV-LESSON-21
    text: >-
      **Idempotency.** Every mutation is idempotent by state: the same request repeated returns the same status
      and body and writes no further row (no second audit row, SRV-EVENTS FR-EVENTS-30), except note creation
      (each POST is a new note). The edit routes that carry `version` (course edit, lesson rename; SRV-INGEST's
      material rename) check for a no-op first and the version second, so a repeated edit is 200 even after its
      own version bump, and a different concurrent edit is 409 `stale`. The order routes carry no version and are
      guarded by their exact-set check (FR-LESSON-23/-27). [db] each route twice; two concurrent different edits
      with the same version: one 200, one 409; the same edit twice with the same version: 200 and 200.
  - id: INV-LESSON-22
    text: >-
      **Tombstones only.** No route of this amendment issues UPDATE or DELETE on lesson_revisions,
      lesson_revision_stages or agent_spend, or removes a blob; a deleted course or lesson (or a lesson of a
      deleted course) is `not_found` on FR-LESSON-7/-8/-9, SRV-TUTOR's routes and SRV-PIPELINE's routes until
      restored, through the reads named in the amendment note. [db] the triggers stay installed; table row counts
      before and after a delete–restore cycle.
  - id: INV-LESSON-23
    text: >-
      **Lock order.** Every route here that refuses on an open run takes `lock_course` (when the course has a plan),
      then the affected lessons' run locks in ascending lesson id order, then reads run state and tombstones; and
      `create_run` reads the tombstones and archive state after the same two locks. So no compile run starts on a
      deleted, skipped or archived lesson, and no lesson is deleted, skipped, archived or reverted under an open
      run. Multi-object writes (a course delete or archive over its lessons, SRV-INGEST FR-INGEST-31's cascade over
      several courses) take all their course locks in ascending `plan_course_id` order, then all lesson locks in
      ascending lesson id order, then the owner's position lock "RCPO", before any check. [db] the race: a delete and
      a compile of one lesson started together, 50 times; every outcome is either (compile 202, delete 409
      `compile_running`) or (delete 200, compile 404), never both applied; a material cascade over two courses and a
      compile of a lesson in the second course started together, 50 times: either the cascade is refused with 409
      `compile_running` and nothing is deleted, or the compile gets 404, with no deadlock (each request finishes
      within 10 s); a cascade and a course order route of the same owner together, 50 times: positions stay 1..n.
      [db] the order itself, deterministically: a test connection holds one lesson's run lock in an open
      transaction; a course delete, a course archive, a lesson delete, a lesson skip, a compile (`create_run`) and a
      material cascade (SRV-INGEST FR-INGEST-31) each start in their own task; `pg_locks` then shows the request's
      backend waiting for exactly that run lock while it already holds the plan-course lock "RCPC" (and, when the
      held lock is the higher of a course's two lessons, the lower lesson's run lock) and does not hold "RCPO"; once
      the test commits, each request completes.

