# ---- Amendment (2026-11-24, V/manage, WEB-MANAGE): FR-LESSON-20..31 and INV-LESSON-20..23 (16..19 left free for
# parallel branches), promoted with their Red tests after deep-review rounds 1–3 (round 1 on 840af4b: changes; round 3
# on 2a7d86f: VERDICT approve). The column and table text moved into `tables`; two references to the former
# `proposed_manage.tables` key now name `tables` (wording only). The notes below are the amendment's rationale.
#
# Why soft delete: a hard delete of a course or a started lesson is impossible by design — lesson_revisions and
# lesson_revision_stages refuse DELETE (INV-LESSON-6), compile runs and tutor questions refer to lessons with RESTRICT,
# and agent_spend is append-only (SRV-AGENT). So delete is a tombstone (`deleted_at`) that every read honours, and
# restore clears it. The owner chose soft delete only, with restore and no purge (WEB-MANAGE D1).
#
# Open run (used by every refusal below): a compile run of the lesson with `finished_at IS NULL AND cancelled_at IS
# NULL` (SRV-PIPELINE FR-PIPELINE-20). That covers the derived states `running`, `stalled` and `stage_failed`: a
# stopped run still holds a dead key that Resume would requeue, so it must be cancelled before its lesson is deleted,
# archived, skipped or reverted (FR-PIPELINE-11's `compile_running` on a new compile still counts only `running` and
