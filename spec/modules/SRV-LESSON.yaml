      notebook the draft step builds (`metadata.reader`, FR-PIPELINE-3) and so of every step's input hash; the next
      compile after a rename reuses no step and costs about a full compile (SRV-PLAN FR-PLAN-13's estimate). This is
      stated, not changed: removing the title from the hash would need an SRV-PIPELINE change to FR-PIPELINE-3, and
      WEB-MANAGE warns in the rename field instead. The current revision keeps the old title in its metadata until
      that compile. [db] rename with an open run refused; the next compile's first step is not reused.
  - id: FR-LESSON-27
    text: >-
      **Order lessons.** `POST /api/courses/{id}/lessons/order` with `{lesson_ids}` — exactly the course's lessons
      that are not deleted, else 409 `order_mismatch` — calls `reorder_lessons` (FR-LESSON-15) with the deleted
