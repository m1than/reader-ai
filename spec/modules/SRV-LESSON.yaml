      `version`: the exact-set check guards it, and the later of two concurrent orders wins. It runs under the
      plan-course lock, so it cannot interleave with a re-plan's renumbering. [db]
  - id: FR-LESSON-28
    text: >-
      **Skip and delete a lesson.** Under the header's locks: `POST /api/lessons/{id}/skip` and `/unskip` set or
      clear `skipped_at` (skip → 409 `compile_running` while the lesson has an open run); `DELETE
      /api/lessons/{id}` with `{}` sets `deleted_at` (409 `compile_running` likewise); `POST
      /api/lessons/{id}/restore` clears it (404 while its course is deleted). All four are idempotent. A deleted
      lesson is `not_found` on every read but keeps its ordinal, so ordinals have gaps; clients number the visible
      lessons 1..n on display and never show the stored ordinal (WEB-MANAGE). A re-plan that still contains it keeps
      it deleted, and one that drops it and finds it unstarted removes it through FR-LESSON-15 (SRV-PLAN
      FR-PLAN-21). [db] each route twice; skip and delete refused with an open run.
  - id: FR-LESSON-29
    text: >-
      **Done.** `POST /api/lessons/{id}/progress` with `{done: true | false}` for the caller (any reader who can open
      the lesson): `true` upserts `lesson_progress` with `done_at` = now (an existing row keeps its first
      `done_at`), `false` deletes the row. 200 `{done, done_at | null}`; idempotent. Input to WEB-SESSION later. [db]
  - id: FR-LESSON-30
    text: >-
      **Revert.** `POST /api/lessons/{id}/revert` with `{sha256}` (owner of the course): the sha256 must be one of
      the lesson's revisions (else 404 `unknown_revision`) and not the current one (else 200 `{applied: false}`);
      the stored blob is passed to `write_revision` with stage `revert` and provenance `{input_sha256: <the
      current sha256>}`, so the revision becomes current by FR-LESSON-4's rule (a new stage record, no UPDATE).
      FR-LESSON-4's checks apply, so a revert that would drop a notes cell id of the current revision fails with
      400 `notes_cell_removed` (INV-LESSON-3). Under the header's locks, 409 `compile_running` while the lesson has
      an open run. 200 `{applied: true, latest_sha256}`. **Status after a revert:** a run's G2 report and state
      belong to that run's `final_sha256` (SRV-PIPELINE); after a revert the current revision may be one that no
      run reported on, so clients show a run's status only while `latest_sha256` equals that run's
      `final_sha256`, and otherwise "Reverted to an earlier revision" (WEB-MANAGE). **Recompile after a revert:**
      a new run starts from the current (reverted) revision; steps whose input hash equals an earlier step's are
      reused (FR-PIPELINE-5), so recompiling a revision that an earlier run started from replays that run's cached
      chain at no model cost until an input differs. Both stated, not changed. [db] revert to the first revision
      and back; the stage records appended; the refusal; a late step of a cancelled run after a revert writes no
      revision (SRV-PIPELINE FR-PIPELINE-20).
  - id: FR-LESSON-31
    text: >-
      **Notes and bookmarks** (any reader who can open the lesson; rows are the caller's own). `GET
      /api/lessons/{id}/notes` → the caller's notes, newest first; `POST` with `{body, cell_id?}` → 201 the note (a
