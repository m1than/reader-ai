# OPS-SANDBOX — the kernel image `reader-kernel:local` and its in-container supervisor (vertical slice V5,
# `V.KERNEL-min`; full module in stage 4a).
#
# Scope (slice): python3 only. The image runs under OPS-DEPLOY's `x-kernel` template unchanged (read-only root, uid
# 1000, tmpfs /home/lab, /tmp and /run/evcxr, cap_drop ALL, no-new-privileges, 2 GiB with swap equal, 2 CPUs, 256 PIDs,
# `restart: always`). The per-user service is `kernel-user-<handle>` (OPS-DEPLOY VEC-DEPLOY-3, OPS-CLI FR-CLI-4). This
# spec owns what OPS-DEPLOY leaves to it: the image, the health command `/usr/local/bin/reader-kernel-health` and the
# start nonce (OPS-DEPLOY header, FR-DEPLOY-8).
#
# Reset without a Docker socket (ADR-0022 "Reset between principals"): an in-image supervisor is PID 1. It holds a
# start nonce generated at boot and exposes a control endpoint on the kernel's own network. A caller asks it to exit;
# PID 1 exiting ends every process in the container's PID namespace (REF-SANDBOX-5); `restart: always` (OPS-DEPLOY)
# brings a fresh container with empty tmpfs; the caller confirms the new nonce (SRV-KERNEL FR-KERNEL-5). The supervisor
# is fail-stop: a gateway exit, an exception or SIGINT ends PID 1, which is itself a full reset, so the only states a
# caller can observe are "same container, same nonce" and "fresh container, new nonce".
#
# Facts measured by deep-reviewer round 1 in throwaway containers under the template's settings (uid 1000, cap_drop
# ALL, no-new-privileges, default seccomp), used below:
# - from a cell, `ptrace(PTRACE_ATTACH, 1)` and `process_vm_readv` on PID 1 fail with EPERM; opening `/proc/1/mem`,
#   `/proc/1/environ` and `/proc/1/fd` is denied once PID 1 is non-dumpable;
# - binding 0.0.0.0:8889 while the supervisor holds it fails with EADDRINUSE;
# - Kernel Gateway's traits are `JupyterWebsocketPersonality.env_whitelist` and `JupyterWebsocketPersonality.list_kernels`;
#   a key of a kernel-creation request's `env` reaches the kernel if it starts with `KERNEL_` **or** is in the
#   whitelist. With the empty whitelist, `KERNEL_*` keys always pass and other keys never do (round 2, re-measured).
#   Harmless here: SRV-KERNEL sends no `env`, and only a cell can call the gateway with one, into its own container;
# - the environment a python3 kernel created without `env` sees, with the gateway started under the explicit
#   environment of FR-SANDBOX-8, is VEC-SANDBOX-1 `env-names`.
# Derived from REF-SANDBOX-4: the Docker restart delay doubles from 100 ms on each restart of a container that ran less
# than 10 s, so the tenth reset in quick succession waits 51.2 s, longer than SRV-KERNEL's 30 s deadline.
#
# Dependencies:
# - OPS-DEPLOY: the `x-kernel` template, per-kernel internal IPv4 networks `sb-user-<handle>` shared only with `api`,
#   and api serving HTTP only on its `front` address (FR-DEPLOY-4).
# - OPS-CLI: generates `kernel-user-<handle>` from the template. Starting profile `kernels` is task `V.OPS-CLI-kernels`
#   (docs/progress.yaml); that profile also starts kernel-verify, kernel-agent and kernel-pair-1 from the same image.
# - SRV-KERNEL: the only caller (the api relay).
#
# Declared deviations and security notes:
# - ADR-0014's `verified_by` says the kernel "cannot resolve postgres or api". With OPS-DEPLOY's per-kernel networks
#   the kernel resolves its declared caller `api` by design but cannot connect to any port of it (OPS-DEPLOY header
#   proposes the ADR rewording; owner's decision). INV-SANDBOX-3 tests the reworded form.
# - ADR-0022's Kernel Gateway "auth token, or reachable only from its declared caller": this spec takes network-only
#   reachability. A token would be a secret delivered to a kernel service, and ADR-0026 keeps kernels secret-free.
#   Consequence: a cell can call the gateway on 127.0.0.1:8888 and create or delete kernels, and call
#   `POST /control/exit`. Both act only on its own principal's container (one principal per container, ADR-0022); the
#   recovery from a confused kernel set is a reset (SRV-KERNEL FR-KERNEL-5).
# - The boundary is the container limits and the network (ADR-0014); SRV-KERNEL's execution timeout is a usability
#   control, not a security one.
#
# Test levels: [image] runs the built image with `docker run` flags equal to the rendered `x-kernel` template plus
# `--restart always` on a throwaway `--internal` IPv4 network with a probe container in the caller's place; exits and
# attacks are triggered from inside the container (a cell or `docker exec` as uid 1000), never by `docker stop`/`kill`.
# [live] runs in `e2e/live/slice.sh` against `reader up`: it signs in with the stage-1 `live-check` software-
# authenticator session (SRV-AUTH), opens a kernel session through SRV-KERNEL and runs the probe cells there.
#
# Test isolation ([image]; 2026-11-22): the Docker daemon is shared by concurrent test sessions (other worktrees,
# other gates). Each pytest session labels every container and network it creates with
# `org.reader-ai.test.sandbox-run=<pid>.<random>`, removes only objects carrying its own value at the end, and at the
# start removes only objects whose `<pid>` is no longer a live process on this host (a killed session runs no
# finalizer). It never removes another live session's objects. Checked by `test_session_sweep_spares_other_runs`
# (traced to FR-SANDBOX-9, whose reset round trip the shared-label sweep broke).

id: OPS-SANDBOX
title: Kernel image (python3), fail-stop in-container supervisor with start nonce and control endpoint, sandbox probes
status: approved
approved_by: agent
approved_at: 2026-11-21
review: "deep-reviewer (Fable) rounds 1–2 changes, round 3 approve (2026-11-21). Green: INV-SANDBOX-5's survivor scan excludes the scanning process itself (its own command line holds the marker); no requirement changed. Code review round 1 changes (SIGTERM deadlock, connection-table veto): paired amendments to FR-SANDBOX-5 (no lock, self-pipe), FR-SANDBOX-6 (d) (local/remote slots), FR-SANDBOX-7 and FR-SANDBOX-8 (PATH without duplicates), with tests. Code review round 2 changes (own-address source classed remote; double close crashed PID 1): FR-SANDBOX-6 (d) classification by destination, peer and interface addresses, idempotent close, per-connection errors contained, with tests. Code review round 3 approve (2026-11-21); applied its notes: own-address test asserts more than 64 open, begin_exit runs outside the contained block. Test-infrastructure fix (2026-11-22, after the investigator's root cause of the load flakes: the session finalizer removed every object with the shared label `org.reader-ai.test=sandbox`, killing concurrent sessions' live containers; supervisor restarts measured 480/480 within 4.0 s under load): per-run labels and scoped sweeps (header note), with a test"
