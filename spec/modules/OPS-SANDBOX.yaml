# OPS-SANDBOX — the kernel image `reader-kernel:local` and its in-container supervisor (vertical slice V5,
# `V.KERNEL-min`; full module in stage 4a).
#
# Scope (slice): python3 only. The image runs under OPS-DEPLOY's `x-kernel` template unchanged (read-only root, uid
# 1000, tmpfs /home/lab, /tmp and /run/evcxr, cap_drop ALL, no-new-privileges, 2 GiB with swap equal, 2 CPUs, 256 PIDs,
# `restart: always`). This spec owns what OPS-DEPLOY leaves to it: the image, the health command
# `/usr/local/bin/reader-kernel-health` and the start nonce (OPS-DEPLOY header, FR-DEPLOY-8).
#
# Reset without a Docker socket (ADR-0022 "Reset between principals"): an in-image supervisor is PID 1. It holds a
# start nonce generated at boot and exposes a control endpoint on the kernel's own network. A caller asks it to exit;
# PID 1 exiting ends every process in the container's PID namespace; `restart: always` (OPS-DEPLOY) brings a fresh
# container with empty tmpfs; the caller confirms the new nonce (SRV-KERNEL FR-KERNEL-5).
#
# Dependencies:
# - OPS-DEPLOY: the `x-kernel` template, per-kernel internal networks `sb-user-<handle>` shared only with `api`, and
#   api serving HTTP only on its `front` address (FR-DEPLOY-4).
# - OPS-CLI: generates `kernel-<user>` from the template and must start profile `kernels` once this image exists.
#   OPS-CLI's current draft starts the default profile only (stage 1); the slice needs a paired OPS-CLI change.
# - SRV-KERNEL: the only caller (the api relay).
#
# Declared deviations:
# - ADR-0014's `verified_by` says the kernel "cannot resolve postgres or api". With OPS-DEPLOY's per-kernel networks
#   the kernel resolves its declared caller `api` by design but cannot connect to any port of it (OPS-DEPLOY header
#   proposes the ADR rewording; owner's decision). INV-SANDBOX-3 tests the reworded form.
# - ADR-0022's Kernel Gateway "auth token, or reachable only from its declared caller": this spec takes network-only
#   reachability. A token would be a secret delivered to a kernel service, and ADR-0026 keeps kernels secret-free.
#
# Test levels: [image] runs the built image with `docker run` flags equal to the rendered `x-kernel` template on a
# throwaway `--internal` network with a probe container in the caller's place; [live] runs against `reader up`.

id: OPS-SANDBOX
title: Kernel image (python3), in-container supervisor with start nonce and control endpoint, sandbox probes
status: draft
approved_by: null
approved_at: null
layer: ops
track: engineering
adr: [ADR-0014, ADR-0020, ADR-0022, ADR-0026, ADR-0012]

paths:
  - sandbox/**
  - server/tests/sandbox/**

defers:
  - "rust (evcxr) and deno kernels, the evcxr launcher with per-kernel cache and sweep (ADR-0022 Process): stage 4a"
  - "pilot crates pre-built into the image: stage 4a"
  - "lab egress proxy with per-lab allowlist (ADR-0014 Egress): stage 4a"
  - "per-lab scoped RPC values (ADR-0014 Secrets): stage 4a, needs its own ADR-0026 reading"
  - "kernel-verify, kernel-agent, kernel-pair-* and the lease-based hand-off between principals: stages 5 and 8"
  - "course-specific pip packages: added to the lock when V.COMPILE-min fixes L02's labs (image rebuild)"
  - "idle culling: stage 4a (the slice bounds kernels by count, FR-SANDBOX-3)"

normative:
  - id: REF-SANDBOX-1
    title: ADR-0014 — Sandbox for lab execution (controls table)
    url: docs/adr/0014-sandbox-security.md
  - id: REF-SANDBOX-2
    title: ADR-0022 — exec tmpfs, enforced memory, declared static kernel services, reset by fresh container and start nonce
    url: docs/adr/0022-kernel-sandbox-evcxr-memory-declared-services.md
  - id: REF-SANDBOX-3
    title: Jupyter Kernel Gateway — configuration options (jupyter_websocket personality, max_kernels, list_kernels)
    url: https://jupyter-kernel-gateway.readthedocs.io/en/latest/config-options.html
  - id: REF-SANDBOX-4
    title: Docker — restart policies (`always`; restart delay doubling from 100 ms, reset after 10 s of running)
    url: https://docs.docker.com/engine/containers/start-containers-automatically/
  - id: REF-SANDBOX-5
    title: Linux pid_namespaces(7) — termination of the init process kills every process in the namespace; signals to init
    url: https://man7.org/linux/man-pages/man7/pid_namespaces.7.html
  - id: REF-SANDBOX-6
    title: Linux prctl(2) PR_SET_DUMPABLE — a non-dumpable process cannot be ptrace-attached or have /proc/<pid>/mem opened by a same-uid process without CAP_SYS_PTRACE
    url: https://man7.org/linux/man-pages/man2/prctl.2.html
  - id: REF-SANDBOX-7
    title: spikes/kernel-roundtrip/RESULT.md — Kernel Gateway 3.0.1 + ipykernel 7.4.0 under ADR-0014 controls (python3 numbers)
    url: spikes/kernel-roundtrip/RESULT.md

requirements:
  # Image
  - id: FR-SANDBOX-1
    text: >-
      `sandbox/Dockerfile` builds `reader-kernel:local` for linux/arm64 `FROM` `python:3.14-slim-trixie` pinned by the
      index digest OPS-DEPLOY uses for the server image (ADR-0020). Python packages are installed only from
      `sandbox/requirements.lock` with `pip install --require-hashes --no-deps`; the lock pins
      `jupyter_kernel_gateway==3.0.1` and `ipykernel==7.4.0` (the versions the kernel-roundtrip spike verified) and their
      dependency closure. No `curl | sh`, no apt build tools, no compiler. [image] The build succeeds without network
      access to anything but the base registry and PyPI, and `pip check` passes in the image.
  - id: FR-SANDBOX-2
    text: >-
      The image has a user `lab` with uid 1000, gid 1000 and home /home/lab, and ends with `USER 1000:1000`. Every file
      under /usr/local (the supervisor, the health command, the kernelspec, site-packages) is owned by root and not
      writable by uid 1000. Exactly one kernelspec is installed, `python3`, from the system data dir. [image]
      `GET /api/kernelspecs` lists exactly `python3`.
  - id: FR-SANDBOX-3
    text: >-
      Kernel Gateway runs with: personality `kernel_gateway.jupyter_websocket`; ip 0.0.0.0, port 8888; `auth_token`
      empty (network-only reachability, header note); `list_kernels` false; `max_kernels` 4; `default_kernel_name`
      python3; no `allow_origin`; `env_process_whitelist` empty, so a kernel-creation request cannot pass environment
      variables into the kernel. `max_kernels` 4 is a structural bound: one kernel per open lesson (SRV-KERNEL
      FR-KERNEL-6) with headroom under the 2 GiB limit; the spike measured 53.5–54.0 MiB idle per container but did not
      measure an idle python3 kernel, so the [image] test records the memory of 4 idle python3 kernels and fails above
      1 GiB. [image] A fifth `POST /api/kernels` is refused.

  # Supervisor, start nonce, control endpoint
  - id: FR-SANDBOX-4
    text: >-
      The image's entrypoint is the supervisor `/usr/local/bin/reader-kernel-entry` (Python, standard library only),
      running as PID 1. At start it (a) calls `prctl(PR_SET_DUMPABLE, 0)`; (b) generates the start nonce as 16 bytes from
      `os.urandom`, hex-encoded, held only in its memory and never written to a file; (c) starts Kernel Gateway as its
      child in a new process group; (d) serves the control endpoint on 0.0.0.0:8889 (FR-SANDBOX-5). If the gateway
      child exits for any reason, the supervisor exits with status 1. On SIGTERM it ends the gateway as in
      FR-SANDBOX-5 (b) and exits 0. [image]
  - id: FR-SANDBOX-5
    text: >-
      Control endpoint (HTTP/1.1, JSON, no authentication, reachable only on the kernel's network, header note):
      (a) `GET /control/state` answers 200 `{"nonce": "<32 hex>", "gateway": "starting" | "up"}`; `up` means the
      gateway's `GET /api` on 127.0.0.1:8888 answered 200 at least once since this start. (b) `POST /control/exit`
      answers 202 with an empty body, then sends SIGTERM to the gateway's process group, waits up to 2 s, sends SIGKILL
      to the group, and exits 0. The 2 s grace is a structural bound: Kernel Gateway's own shutdown of idle python3
      kernels is not measured; the reset does not depend on it because PID 1's exit kills every remaining process
      (REF-SANDBOX-5). (c) Any other method or path answers 404; a request body over 1 KiB is refused with 413 (the
      endpoint takes no body). [image]
  - id: FR-SANDBOX-6
    text: >-
      `/usr/local/bin/reader-kernel-health` (the command OPS-DEPLOY's template names) exits 0 only when
      `GET http://127.0.0.1:8889/control/state` answers `gateway: up` within 2 s, and 1 otherwise. It prints nothing
      but a one-word state. [image]
  - id: FR-SANDBOX-7
    text: >-
      Reset round trip: after `POST /control/exit`, with the container run under `--restart always` and the template's
      settings, `GET /control/state` answers again with a different nonce and `gateway: up`. [image] The time from the
      202 to `up` is recorded (not a threshold; Docker's restart delay starts at 100 ms and doubles on restarts within
      10 s of each other, REF-SANDBOX-4); three resets in a row all complete within SRV-KERNEL's 30 s deadline.

  # Environment and egress
  - id: FR-SANDBOX-8
    text: >-
      The image declares no `ENV` other than PATH, LANG, PYTHONDONTWRITEBYTECODE, PYTHONUNBUFFERED, JUPYTER_PATH,
      JUPYTER_RUNTIME_DIR (on /tmp) and HOME. [image] Inside a python3 kernel, the names in `os.environ` equal
      VEC-SANDBOX-1 `env-names` exactly (that list plus HOSTNAME from the runtime and the names Kernel Gateway and
      ipykernel set at kernel start, recorded once), none carries a value from outside the image or the gateway, and
      `/run/secrets` does not exist.
  - id: FR-SANDBOX-9
    text: >-
      The image works under exactly the rendered `x-kernel` template: read-only root; /home/lab and /tmp `noexec`;
      uid 1000; no capabilities. Kernel Gateway's runtime files (connection files, `JUPYTER_RUNTIME_DIR`) live under
      /tmp. [image] A kernel starts, executes `print(1)` and streams `1`; a write to `/usr/local` or `/` from a cell
      fails with a read-only or permission error; executing a file copied to /tmp fails with permission denied.

invariants:
  - id: INV-SANDBOX-1
    text: >-
      No egress: from a python3 kernel cell, resolving any name other than the container's own and its declared caller
      fails, and every TCP connect to an address outside the kernel's network fails (VEC-SANDBOX-1 targets). [image]
      on a `--internal` network; [live] against `reader up`.
  - id: INV-SANDBOX-2
    text: >-
      No secret reaches a kernel: `/run/secrets` is absent; the kernel environment is FR-SANDBOX-8's list; no file in
      the image or the running container matches a value delivered to any other service (live check scans for the
      canaries OPS-CLI delivers); the Docker socket path does not exist. [image] and [live]
  - id: INV-SANDBOX-3
    text: >-
      From a kernel, `postgres`, `worker`, `caddy`, `mcp` and `agent-proxy` do not resolve, and no TCP port of `api` is
      connectable on any of its addresses (ADR-0014 as reworded by OPS-DEPLOY, header note). [live]
  - id: INV-SANDBOX-4
    text: >-
      Limits hold from a cell: the process runs as uid 1000 with `CapEff` 0, `NoNewPrivs` 1 and `Seccomp` 2 in
      `/proc/self/status`; a 2.6 GB allocation ends the kernel process, not the container (the supervisor's nonce is
      unchanged afterwards); creating processes beyond the 256-PID limit fails with an error while the control
      endpoint keeps answering. [image]
  - id: INV-SANDBOX-5
    text: >-
      Reset leaves nothing behind: a file written by a cell to /home/lab, /tmp and /run/evcxr, and a background process
      started by a cell that detaches (new session) and ignores SIGTERM, are all absent after `POST /control/exit` and
      the restart, and the nonce differs. [image]
  - id: INV-SANDBOX-6
    text: >-
      Kernel code cannot forge the reset signal: from a cell, attempts to (a) ptrace-attach to PID 1, (b) open
      `/proc/1/mem` for writing, (c) send SIGSTOP or SIGKILL to PID 1, and (d) bind 0.0.0.0:8889 all fail, and
      afterwards `GET /control/state` returns the same nonce as before the attempts. [image] (A cell may still call
      `POST /control/exit` itself; that resets its own principal's container only, which ADR-0022 permits.)

nfr: []

vectors:
  - id: VEC-SANDBOX-1
    source: >-
      Probe targets derived from OPS-DEPLOY's network table (VEC-DEPLOY-2) and ADR-0014's controls; expected outcomes
      per target and test level
    file: spec/fixtures/OPS-SANDBOX/probes.yaml

