#   because the template is fixed by OPS-DEPLOY and ADR-0022, and it is empty after every reset (INV-SANDBOX-5).
# - Re-run of the kernel-roundtrip numbers on Python 3.14 / trixie (ADR-0022 hypothesis) is covered for python3 by
