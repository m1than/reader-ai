normative:
  - id: REF-AUTH-1
    title: W3C Web Authentication Level 3 — §7.1 Registering a new credential, §7.2 Verifying an authentication assertion, §6.1.1 signature counter
    url: https://www.w3.org/TR/webauthn-3/
  - id: REF-AUTH-2
    title: py_webauthn 3.0.1 — verify_registration_response / verify_authentication_response (Duo Labs, BSD-3-Clause)
    url: https://github.com/duo-labs/py_webauthn
  - id: REF-AUTH-3
    title: RFC 6265bis — cookie prefixes `__Host-`, SameSite (draft-ietf-httpbis-rfc6265bis)
    url: https://datatracker.ietf.org/doc/draft-ietf-httpbis-rfc6265bis/
  - id: REF-AUTH-4
    title: OWASP Cheat Sheet — Session Management; Cross-Site Request Forgery Prevention (Origin verification)
    url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  - id: REF-AUTH-5
    title: spikes/passkey-localhost/RESULT.md — RP ID `localhost`, origin `https://localhost`, synced passkeys report sign count 0, gaps for the product
    url: spikes/passkey-localhost/RESULT.md
  - id: REF-AUTH-6
    title: ADR-0006 — FastAPI, SQLAlchemy 2 async with asyncpg, Alembic
    url: docs/adr/0006-backend-architecture.md
  - id: REF-AUTH-7
    title: RFC 9110 §8.3.1 — media type comparison (type/subtype case-insensitive, parameters separate)
    url: https://www.rfc-editor.org/rfc/rfc9110#section-8.3.1

# Policy values (not measurements; changing one is a spec change). Clocks are the database's `now()`.
policy:
  challenge_bytes: 32
  challenge_ttl_s: 300
  bootstrap_token_bytes: 32
  bootstrap_token_ttl_s: 900
  session_id_bytes: 32
  session_absolute_ttl_s: 1209600      # 14 days; no sliding renewal
  recent_session_s: 600               # adding a passkey needs a session this young (FR-AUTH-6)
  # A DoS and row-growth bound, not brute-force protection (a passkey assertion cannot be guessed): failed ceremonies
  # across all clients. A 429 is not a failure and adds no row.
  failure_limit: { max: 100, window_s: 3600 }
  cleanup_interval_s: 3600
  algorithms: [-7, -8, -257]            # ES256, EdDSA, RS256
  attestation_formats: [none]           # any other fmt is refused
  cookies:
    session: __Host-reader_session
    ceremony: __Host-reader_ceremony

# Tables of the first migration. `owner_id` is NOT NULL with a foreign key to users.id. System tables carry no
# user-owned content; INV-AUTH-8 checks every other table.
tables:
  users: { system: true, columns: "id uuid pk, handle text unique, role text CHECK (role IN ('owner','learner')), webauthn_user_id bytea unique CHECK (octet_length = 64), display_name text, consent_evaluation bool, consent_tuning bool, disabled_at timestamptz null, created_at" }
  webauthn_credentials: { owner_id: true, columns: "credential_id bytea pk, public_key bytea, sign_count bigint CHECK (>= 0), transports text[], aaguid uuid, backed_up bool, created_at, last_used_at" }
  sessions: { owner_id: true, columns: "id_sha256 bytea pk, created_at, expires_at, revoked_at" }
  auth_challenges: { system: true, columns: "ceremony_sha256 bytea pk, kind text CHECK (kind IN ('register','authenticate','bootstrap')), challenge bytea, user_id uuid null, bootstrap_token_sha256 bytea null, expires_at, consumed_at" }
  bootstrap_tokens: { system: true, columns: "token_sha256 bytea pk, user_id uuid, expires_at, consumed_at, revoked_at" }
  auth_failures: { system: true, columns: "id bigserial, reason text, at timestamptz" }
  invitations: { owner_id: true, columns: "id uuid pk, created_at (stub; stage 8)" }

# Internal failure reasons of the verify seam and the routes (FR-AUTH-15). Logged as the enum name only; never
# returned to clients.
failure_reasons: [malformed, wrong_type, unknown_credential, challenge_mismatch, origin_mismatch, rp_id_mismatch,
  user_present_missing, user_verified_missing, bad_signature, user_handle_missing, user_handle_mismatch,
  counter_regressed, attestation_format_refused, algorithm_refused, credential_id_taken, ceremony_invalid,
  token_invalid, owner_has_credential, user_disabled, library_rejected]

# Signature counter rule (REF-AUTH-1 §6.1.1 as py_webauthn 3.0.1 applies it; stored m, received n).
counter_cases:
  - { stored: 0, received: 0, result: pass }
  - { stored: 0, received: "n > 0", result: pass }
  - { stored: "m > 0", received: "n > m", result: pass }
  - { stored: "m > 0", received: "n <= m (0 included)", result: fail }

# Configuration inputs and their startup error codes (FR-AUTH-16), checked in this order.
config_errors:
  - { code: instance_url_path, when: "instance.url has a path other than empty or `/`" }
  - { code: instance_url_query, when: "instance.url has a query or fragment" }
  - { code: instance_url_userinfo, when: "instance.url has userinfo" }
  - { code: instance_url_ip_host, when: "instance.url host is an IPv4 or IPv6 literal (WebAuthn RP IDs are domains)" }
  - { code: instance_url_host_form, when: "instance.url host has a non-ASCII (IDN) character or a trailing dot, or
      browsers would parse it as IPv4 (WHATWG URL: its last label is all digits or a 0x hex number, as in `127.1`,
      `1234` or `0x7f.1`)" }
  - { code: owner_count, when: "the number of users[] entries with role owner is not 1" }
  - { code: unknown_role, when: "a users[] role is not owner or learner" }
  - { code: signup_not_supported, when: "sharing.signup is present and not boolean false" }

requirements:
  - id: FR-AUTH-1
    text: >-
      `reader-server --role api --bind <ip:port>` loads the configuration through SRV-CONFIG's `load_config` from
      `READER_CONFIG`, validates it (FR-AUTH-16), reads the database password from
      `secret://file/run/secrets/db-password`, connects with the password passed as a separate connect parameter (the
      DSN string never contains it), migrates (below), deletes expired rows (FR-AUTH-17), ensures a `users` row for
      every `users[]` entry (handle, role; existing rows keep their id and webauthn_user_id; a disabled user named
      again is re-enabled), disables every user row whose handle is no longer in `users[]` (sets `disabled_at`,
      revokes its sessions, keeps its rows; INV-AUTH-9), and serves the app with Uvicorn. Migration: `alembic upgrade
      heads` (the history has several heads: SRV-EVENTS adds procrastinate's shipped chain, branch label
      `procrastinate`), under `pg_advisory_lock(<namespace>, 1)` in the two-key form with a fixed migration namespace
      constant declared in `reader.db`, distinct from SRV-EVENTS's job-key namespace. Alembic runs through the app's
      asyncpg engine (`run_sync` in env.py; procrastinate 3.12.0's `execute_script` has its own asyncpg path through the
      raw driver connection for multi-statement SQL). `reader.db` sets `version_locations` on the programmatic Alembic
      `Config` before `command.upgrade`, from a declared list of directories (Alembic does not glob; no scan): in stage
      1 only `reader/db/migrations/versions`; SRV-LESSON appends `reader/lessons/migrations` (paired change,
      2026-11-22); SRV-EVENTS appends its own directory and the installed
      `procrastinate/contrib/alembic/versions`. "At all heads" in FR-AUTH-2 means every head of that history.
      Since SRV-LESSON and SRV-EVENTS (2026-11-22, paired changes): the list is `reader/db/migrations/versions`,
      `reader/lessons/migrations`, `reader/jobs/migrations` and procrastinate's versions directory; SRV-INGEST
      appends `reader/ingest/migrations`, then SRV-AGENT and SRV-PIPELINE (2026-11-22, paired changes) append
      `reader/agent/migrations` and `reader/pipeline/migrations` (integrated order: db, lessons, jobs, ingest, agent,
      pipeline, procrastinate);
      "all heads" are the effective heads
      (`get_revisions("heads")`, so `procrastinate_0043`, reached through `jobs_0001`'s `depends_on`, is not compared);
      and the lock is taken by polling `pg_try_advisory_lock` on a dedicated autocommit connection, because
      procrastinate's `CREATE INDEX CONCURRENTLY` deadlocks against a waiter holding an open transaction. The poll
      gives up after 300 s (structural: far above a full upgrade, which takes seconds) with `MigrationError`
      `migration_lock_timeout`, and an unlock that returns false raises `migration_unlock_failed`.
      procrastinate's `autocommit_block` path on asyncpg is tested by SRV-EVENTS against Postgres, not here.
      Paired SRV-SEARCH change (2026-11-22): the list becomes `reader/db/migrations/versions`, `reader/lessons/migrations`,
      `reader/jobs/migrations`, `reader/search/migrations` and procrastinate's directory; `search_0001` creates the
      `vector` extension, so the database these tests migrate runs the pinned pgvector-enabled postgres image
      (SRV-SEARCH header). The engine is created with `hide_parameters=True`, so a SQL error never logs bound
      parameters (a search query text, a token hash). SRV-TUTOR (2026-11-23, paired change) adds
      `reader/tutor/migrations`. Integrated order (V/slice-integration): db, lessons, jobs, ingest, search, agent,
      pipeline, tutor, procrastinate. SRV-FRESH (2026-11-23, paired change) adds `reader/freshness/migrations`
      after tutor.
      Paths and endpoints default to the container's and may be overridden by six variables (tests, and OPS-DEPLOY's
      static `READER_CONFIG`): `READER_CONFIG` (default `/etc/reader/reader.yaml`), `READER_SECRETS_ROOT`
      (`/run/secrets`), `READER_RUN_DIR` (`/tmp`, where the api writes its bound address to `reader-api.addr` for
      the healthcheck), `READER_DB_HOST` (`postgres`), `READER_DB_PORT` (`5432`), `READER_DB_USER` (`postgres`),
      `READER_DB_NAME` (`postgres`). While the api runs, a database failure in a request answers 503
      `{"error":"unavailable"}` and logs one line without detail.
  - id: FR-AUTH-2
    text: >-
      `reader-server --role <role> --healthcheck` exits 0 only when `/run/secrets/db-password` exists, the database
      answers `SELECT 1`, the schema is at all Alembic heads and, for `api`, `GET /api/healthz` on the bound address
      returns 200; otherwise it exits 1. Every `reader-server` failure prints exactly one line, `reader-server:
      <code>`, and no value or traceback; the codes are `secret_missing` (absent or empty file),
      `database_unreachable`, `schema_not_at_heads`, `api_unhealthy`, `bind_invalid` (`--bind` not `host:port` with a
      numeric port), `config_env_invalid` (a non-numeric `READER_DB_PORT`), `run_dir_unwritable`, the
      `config_errors` codes and SRV-CONFIG's problem codes. `--role worker` without `--healthcheck` waits until the
      schema is at all heads without migrating, writing `reader-server: database_unreachable` at most once per 30 s
      while the database cannot be polled, then runs until SIGTERM and exits 0. `--role mcp` exits 2 with "mcp role
      arrives with SRV-MCP". Logging: the one-shot paths (`--healthcheck`, `bootstrap-link`, startup before
      serving) silence library records, so their output stays the one line. Once the api serves (and once the
      worker sees all heads), any logger's WARNING and above reaches stderr as one line with the logger name, the
      level, the first line of the message template (asyncio puts the task repr, with the exception text, on later
      lines), the exception type and its innermost frame as `file:line function` (no message, no locals), never the
      stack or the args; `reader.*` records add their own args (route, failure reason), one line, never a stack.
  - id: FR-AUTH-3
    text: >-
      RP ID is the lower-cased host of `instance.url`; the only accepted origin is `scheme://host[:port]`, lower-cased,
      with the port only when it is not the scheme default (`https://localhost` for the example config). Registration
      options: `residentKey: required`, `userVerification: required`, `attestation: none`, `policy.algorithms`,
      `excludeCredentials` listing the user's credentials, `user.id` = the user's `webauthn_user_id` (64 random bytes,
      created once). Authentication options: `userVerification: required`, empty `allowCredentials`.
  - id: FR-AUTH-4
    text: >-
      `reader-server bootstrap-link [--handle <h>]` (default: the owner) locks the user's `users` row `FOR UPDATE`,
      exits 1 with "user_disabled" if the user is disabled, exits 1 with "user already has a passkey" if the user has a
      credential, else marks earlier unconsumed tokens of
      that user revoked, stores the SHA-256 of a fresh `bootstrap_token_bytes` token valid for `bootstrap_token_ttl_s`,
      commits, and writes `<origin>/api/auth/bootstrap#<token>` to stdout only. An unknown handle exits 1. Stderr never
      carries the token or the database password.
  - id: FR-AUTH-5
    text: >-
      `POST /api/auth/bootstrap/options` with `{token}` returns registration options for the token's user and sets the
      ceremony cookie when the token is unconsumed, unrevoked and unexpired; the ceremony row stores the token's
      SHA-256. A token that is not a string or not UTF-8-encodable is `token_invalid` (400 `bootstrap_failed` and a
      failure row). `POST /api/auth/bootstrap/verify`, in one transaction: locks the user's row `FOR UPDATE`; refuses a
      disabled user with `user_disabled` (also when the token predates the disabling); re-checks that the user has no
      credential; consumes the token with `UPDATE … WHERE consumed_at IS NULL AND revoked_at IS NULL AND
      expires_at > now() RETURNING`; consumes the challenge (INV-AUTH-1); verifies through the seam (FR-AUTH-15); stores
      the credential; starts a session (FR-AUTH-8). On any failure that transaction rolls back, so the token and the
      challenge stay usable until they expire; the `auth_failures` row is inserted in a separate committed transaction;
      the answer is 400 `bootstrap_failed`.
  - id: FR-AUTH-6
    text: >-
      `POST /api/auth/register/{options,verify}` add a passkey to the signed-in user. Both require a session created
      less than `recent_session_s` ago (401 `reauth_required` otherwise), because a stolen long-lived cookie must not be
      able to plant a persistent credential. The ceremony is bound to that user; verify runs the FR-AUTH-15 checks and,
      on success, rotates the session (FR-AUTH-8). On failure the ceremony transaction rolls back (the challenge stays
      usable until it expires), the `auth_failures` row is inserted in a separate committed transaction, and the
      answer is 400 `register_failed`. The route dispatcher enforces `recent_session` (FR-AUTH-10).
  - id: FR-AUTH-7
    text: >-
      `POST /api/auth/signin/options` returns authentication options and sets the ceremony cookie.
      `POST /api/auth/signin/verify` consumes the challenge and, on failure, records an `auth_failures` row, both in a
      transaction that commits even when verification fails; it looks up the credential by raw id and verifies through
      the seam with the stored public key, the stored counter and the `webauthn_user_id` of the credential's
      `owner_id`; a credential of a disabled user fails `user_disabled`. On success, in a second transaction on one
      connection, it updates `sign_count` conditionally (`finish_signin(conn, …)`: `WHERE credential_id = :id AND
      (sign_count < :n OR (sign_count = 0 AND :n = 0))`), `last_used_at` and `backed_up`, and starts a session; zero
      rows updated rolls that transaction back and is `counter_regressed`, which writes a failure row like any other
      failure. Two transactions in all. Every failure answers 400 `signin_failed` with no detail.
  - id: FR-AUTH-8
    text: >-
      Starting a session creates a random `session_id_bytes` id, stores its SHA-256 with `expires_at = now() +
      session_absolute_ttl_s`, revokes the session presented in the request (if any), and sets
      `__Host-reader_session=<id>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<ttl>` with no Domain.
  - id: FR-AUTH-9
    text: >-
      `POST /api/auth/signout` revokes the current session and clears the cookie (`Max-Age=0`, same attributes); it
      answers 204 with or without a session. `GET /api/me` answers 200 `{id, handle, role, display_name, consent:
      {evaluation, tuning}}` for a valid session and 401 `{"error":"unauthenticated"}` otherwise.
  - id: FR-AUTH-10
    text: >-
      A request is authenticated only by a session cookie whose SHA-256 matches a row that is not revoked and not
      expired and whose user is not disabled. Routes are declared as data with `auth: public | session |
      recent_session` and `method`, and the dispatcher enforces `auth` (401 `unauthenticated`, or `reauth_required`
      for a `recent_session` route with an older session); `public` are exactly `/api/healthz`, the bootstrap and sign-in ceremonies,
      `/api/auth/signout`, and the pages and script of FR-AUTH-14. No GET route writes to the database. The app
      factory includes routers from a declared list, `reader.api.app.ROUTERS`; stage 1 lists only the api and auth
      routers; SRV-LESSON adds `reader.lessons.routes` (paired change, 2026-11-22). Paired SRV-KERNEL change
      (2026-11-22): ROUTERS adds `reader.kernels.routes`; a route's `method` may also be `DELETE`; a router module may
      export `WS_ROUTES` (WebSocket routes, registered under the same CSRF gate, whose handlers authenticate through
      `store.session_user` themselves); the server dependency `websockets` gives Uvicorn its WebSocket support.
      Integrated order (V/slice-integration): api, auth, lessons, kernels. Paired SRV-PIPELINE change (2026-11-22):
      ROUTERS adds `reader.pipeline.routes`; the api role builds one SRV-EVENTS `Jobs` (the declared catalog, a
      procrastinate app on its own DbTarget, opened before serving and closed after) on `app.state.jobs`, so routes
      can enqueue; a factory argument `jobs` lets tests pass their own. SRV-INGEST adds `reader.ingest.routes`
      (paired change). Paired SRV-SEARCH change (2026-11-22): ROUTERS appends `reader.search.routes`. Paired
      SRV-TUTOR change (2026-11-23): ROUTERS appends `reader.tutor.routes`, and `reader/tutor/migrations` joins
      VERSION_LOCATIONS after `pipeline`; the tutor's ask route enqueues through the same `app.state.jobs`.
      Integrated order: api, auth, lessons, kernels, ingest, search, pipeline, tutor. Paired SRV-FRESH change
      (2026-11-23): ROUTERS appends `reader.freshness.routes`, and a route's `method` may also be `PUT` (its
      `PUT /api/materials/{material_id}/bibliography`; non-GET, so under the same CSRF gate and JSON body rule).
  - id: FR-AUTH-11
    text: >-
      Failure limit. Every failed ceremony verification or invalid bootstrap token inserts an `auth_failures` row
      with its reason. While `failure_limit.max` rows exist within `failure_limit.window_s`, the `/options` and
      `/verify` routes of FR-AUTH-5..7 answer 429 with `Retry-After` (seconds until the oldest counted row leaves the
      window) without inserting a row. The check runs before each request, so requests already in flight when the
      limit is reached may each still add one row: the overshoot is bounded by the number of concurrent requests,
      and accepted.
  - id: FR-AUTH-12
    text: >-
      CSRF. Every non-GET `/api/*` request and every WebSocket upgrade under `/api/*` must carry an `Origin` header
      equal to the origin of FR-AUTH-3; every non-GET request with a body must have a Content-Type whose media type
      (compared per REF-AUTH-7, parameters ignored) is `application/json`. A request with more than one `Origin`
      header is refused. Otherwise 403 `{"error":"origin"}` (a WebSocket is closed with code 1008) or 415
      `{"error":"content_type"}`, before any handler runs or any row is written. A JSON body over 64 KiB (a
      structural bound: the largest stage-1 body, a registration response, is a few KiB; reading stops at the
      bound), not JSON, or nested deeper than the parser's recursion limit is unparseable: the ceremony treats it
      as an empty body (`token_invalid`, `ceremony_invalid` or `malformed`, with a failure row), never a 500.
  - id: FR-AUTH-13
    text: >-
      Groundwork (ADR-0017, ADR-0018). `users.consent_evaluation` defaults to true for role owner and false otherwise;
      `consent_tuning` defaults to false. The routes `POST /api/auth/signup/{options,verify}` always answer 404 in
      stage 1; `sharing.signup` is accepted only absent or false (FR-AUTH-16); sign-up is finished in stage 8. The
      `invitations` table exists; no route uses it.
  - id: FR-AUTH-14
    text: >-
      `GET /api/auth/bootstrap` and `GET /api/auth/signin` serve static HTML pages with one same-origin script
      (`/api/auth/static/passkey.js`, no inline script, so a `script-src 'self'` CSP holds). The bootstrap page reads
      the token from the URL fragment and clears it at once with `history.replaceState`; both pages run the ceremonies
      with `PublicKeyCredential.parse*OptionsFromJSON` and `toJSON()` and on success navigate to `/`. WEB-UI replaces
      them in stage 4. Amendment 2026-11-23 (V.auth-page-style, owner: "a fully pretty log in page"): FR-AUTH-19..21
      change only the pages' look, their copy and how the script reports a failure; the ceremony is unchanged — the
      same routes in the same order (bootstrap: `POST /api/auth/bootstrap/options` with `{token}`, then
      `navigator.credentials.create`, then `POST /api/auth/bootstrap/verify` with `credential.toJSON()`; sign-in: `POST
      /api/auth/signin/options` with `{}`, then `navigator.credentials.get`, then `POST /api/auth/signin/verify` with
      `credential.toJSON()`), the same request headers and `credentials: "same-origin"`, the same fragment handling, the
      same cookies set by the server, and `location.assign("/")` on success. [unit] the existing page test; [browser]
      FR-AUTH-21's recorded request sequence; [live] the real passkey flow (FR-AUTH-21).
  - id: FR-AUTH-19
    text: >-
      Page look (both pages; they match the web app, WEB-UI FR-UI-10). Each page links exactly one stylesheet,
      `<link rel="stylesheet" href="/api/auth/static/auth.css">`, before the script. Markup: `main.auth` centres one
      card (`section.auth-card`, at most 26rem wide, the Calm surface-raised colour, 1px border, radius
      `--acme-radius-lg`, padding `--acme-space-6`, `--acme-space-5` below 30rem) horizontally and vertically in the
      viewport (`min-height: 100vh` grid). The card holds, in order: a mark (an inline `<svg>` of 32px with
      `aria-hidden="true"` and `focusable="false"`, drawn only with presentation attributes and `currentColor`, no
      `style` attribute, in the accent colour), the product name "reader-ai" (a `p.auth-brand`, not a heading), the
      tagline "Study material, turned into verified courses.", the `h1` ("Sign in"; on bootstrap "Register your
      passkey"), one lead sentence (sign-in: "Use the passkey saved on this device or on your phone."; bootstrap:
      "Create your passkey for this reader-ai. You do this once." — the bootstrap link also serves configured learners,
      so the copy does not say "owner"), the status line (FR-AUTH-20) and one
      full-width primary button (sign-in: "Sign in with a passkey"; bootstrap: "Create your passkey"), with the
      library's solid button metrics: height `--acme-control-lg`, radius `--acme-radius`, weight 600, accent fill,
      on-tone text, opacity 0.45 and `cursor: not-allowed` while disabled. Type: the library sans `--acme-font` for
      everything (h1 1.5rem, body 0.9375rem, line height 1.5); no web font is fetched. Colours: the Calm tokens, dark
      by default and light under `prefers-color-scheme: light`, exactly as WEB-UI's calm.css (the auth pages have no
      theme switch). Focus: a 2px `--acme-focus` outline, offset 2px, on `:focus-visible` of every interactive
      element. Motion: transitions only on the button's colours, none under `prefers-reduced-motion: reduce`.
      Tokens are copied, not fetched: auth.css declares every `--acme-*` property it uses, with values equal to WEB-UI's
      committed `web/src/ui/tokens/calm.css` (colours, both schemes) and to the vendored library's
      `package/dist/styles.css` inside `web/vendor/acme-ui-v0.1.0.tgz` (font, space, radius, control and text sizes,
      duration, ease), so the auth pages never load the SPA bundle and cannot drift silently; outside its token blocks
      auth.css holds no colour literal (no hex value and no colour function), only `var(--acme-…)` references. Asserted
      numbers: card width ≤ 26rem and centred, button height 48px (`--acme-control-lg`) and radius 12px
      (`--acme-radius`), h1 1.5rem, the font family starting with Manrope, the 2px solid focus outline; the remaining
      sizes (paddings, the 32px mark, body size and line height, the 30rem breakpoint) are design values, not asserted.
      [unit] a test parses auth.css and both sources (the `@layer acme.tokens` block found by pattern, whatever its
      whitespace; `var(--x, fallback)` counted as a use of `--x`) and compares every declared value, and scans auth.css
      outside the token blocks for colour literals (hex values, colour functions and named colour keywords such as
      `white` or `black`); [browser] FR-AUTH-21.
  - id: FR-AUTH-20
    text: >-
      States and messages (copy only; driven by the signals the script already receives). The status line is
      `<p id="status" role="status" aria-live="polite">`. The static markup carries `data-state="loading"` (no state of
      the table, so a page whose script did not run shows the card with no button: the button is hidden in the markup
      of both pages and only the script shows it), and the status line of both pages holds the static text
      "Preparing… If nothing happens, reload the page.", which the script replaces with its first state's message, so
      a page whose script failed to load is never blank; the script sets `data-state` on `main.auth` to one of the
      states below (auth.css styles each; an error state shows the message in the danger colour with a 3px danger
      border on its start side). Messages are plain text from one fixed table in passkey.js; no server or exception text
      is ever shown. A state is retryable when its button is enabled. Focus: after a ceremony ends in a retryable
      state, focus returns to the button; after it ends in a state that hides the button, focus moves to the status
      line (`tabindex="-1"`); states set at page load move no focus, and `waiting` and `done` move no focus (the
      script calls no `focus()`; the status line is not focused). The bootstrap token never returns to the URL: the
      fragment stays cleared in every state.
      | state | when | message | button |
      | `ready` | the page loaded (bootstrap: with a token) and the browser supports passkeys | "" | shown, enabled |
      | `unsupported` | `window.PublicKeyCredential` is missing, or the page's `parseCreationOptionsFromJSON` (bootstrap)
      or `parseRequestOptionsFromJSON` (sign-in) is not a function; `credential.toJSON()` is implied by them (WebAuthn
      Level 3 ships the three together) and not probed | "This browser cannot use passkeys here. Use a current Safari,
      Chrome, Edge or Firefox." | hidden |
      | `no_token` | bootstrap without a fragment token | "This setup link is incomplete. Run `reader bootstrap` again
      for a new link." | hidden |
      | `waiting` | after a click, until the ceremony ends | "Waiting for your passkey…" | shown, disabled |
      | `cancelled` | the WebAuthn call rejects with `NotAllowedError` or `AbortError` | "The passkey request was
      cancelled or timed out. Try again when you are ready." | enabled |
      | `rejected` | sign-in verify (not options) answers 400 `signin_failed` | "That passkey was not accepted here. Try again, or use
      another passkey saved for this site." | enabled |
      | `expired` | bootstrap options answers 400 `bootstrap_failed` (the token is unknown, expired or used) | "This
      setup link has expired or was already used. Run `reader bootstrap` again for a new link." | hidden |
      | `not_registered` | bootstrap verify answers 400 `bootstrap_failed` (the token stays usable after a failed
      verify, FR-AUTH-5, INV-AUTH-7) | "That passkey could not be registered. Try again; if it keeps failing, run
      `reader bootstrap` again." | enabled |
      | `rate_limited` | any ceremony POST answers 429 `rate_limited` | "Too many attempts. Try again in <n> minutes."
      with n = ceil(Retry-After / 60), at least 1 ("1 minute" when n is 1, so `0` and `60` both read "1 minute"),
      where Retry-After must match `^\d{1,6}$` (whole seconds, at most six digits; FR-AUTH-11's limit is at most an
      hour); any other value (absent, a fraction, an HTTP-date, more digits) gives "Too many attempts. Try again
      later." A 429 with any other code is `failed`. | enabled |
      | `unreachable` | a POST fails without a response (network) or answers 5xx | "reader-ai could not be reached.
      Check that it is running, then try again." | enabled |
      | `failed` | anything else (another status or code, another exception, `InvalidStateError` included: bootstrap
      refuses once the owner has a credential, so `excludeCredentials` is always empty and that error is not
      expected) | "Something went wrong. Try again." | enabled |
      | `done` | verify succeeded | "Signed in. Opening reader-ai…" (bootstrap: "Passkey created. Opening reader-ai…"),
      then `location.assign("/")` | disabled |
      [browser] each state at 1280, 1024 and 390 px (FR-AUTH-21), with the request routes stubbed and the WebAuthn
      calls replaced in the page.
  - id: FR-AUTH-21
    text: >-
      Assets, CSP and checks. `GET /api/auth/static/auth.css` is a fourth public static route (FR-AUTH-14's list),
      `text/css; charset=utf-8`; the four static GET routes (two pages, passkey.js, auth.css) answer with
      `Cache-Control: no-cache`: a cache must revalidate before each reuse, and since the routes send no validator
      (no ETag or Last-Modified) that means the browser fetches the file again on every load — a few kilobytes, never
      stale after an upgrade. The edge CSP in deploy/Caddyfile does not change (it is OPS-DEPLOY's and already allows
      same-origin styles and scripts through `default-src 'self'`); the pages use no `<style>` element, no `style`
      attribute, no inline script or event handler attribute, no `@import`, no `url(` in auth.css, and no external
      origin. Route registries (paired changes): `test_route_table_is_declared_as_data` lists the new public route, and
      OPS-DOD's spec/fixtures/OPS-DOD/operations.yaml adds `GET /api/auth/static/auth.css` to the `routes` of both
      `auth.bootstrap` and `auth.signin` (no `not_user_facing` entry). The two auth `a11y` cells there stay `missing`:
      OPS-DOD accepts only `pages` evidence from the live run's `axe.json` for a web operation's a11y, the [browser]
      axe runs below are not that evidence, and `axe.json` has no producer yet (OPS-DOD's follow-up).
      [unit] pytest in server/tests/auth: content types and `Cache-Control` of the four routes; the pages' single
      stylesheet and single script, no inline style, script or handler, the svg without `style`; auth.css without
      `@import` or `url(`; the Caddyfile CSP string equals the one pinned in the test; the token test of FR-AUTH-19;
      the route table.
      [browser] e2e/web/auth/pages.spec.ts against WEB-UI's test server, which serves the four files under the
      Caddyfile CSP, in two Playwright projects, `auth-dark` (the pages' default scheme) and `auth-light`
      (`colorScheme`). For
      every FR-AUTH-20 state at 1280, 1024 and 390 px in each scheme: its message, button state, `data-state` and
      focus target; axe with no serious or critical issue; `scrollWidth ≤ clientWidth`; no `securitypolicyviolation`
      event; the URL without a fragment. The request oracle: every non-GET request is recorded with
      `page.on('request')` and equals the case's exact expected list (method, path, `content-type: application/json`,
      body; FR-AUTH-14's sequence cut where the case stops), and the full list of every request the page makes (any
      path, so a same-origin beacon fails) equals the page's static GETs (the page, auth.css, passkey.js) followed by
      those POSTs (and, for `done`, the navigation to `/`). The rate-limit and failure mapping has a case for each
      edge: Retry-After `60`, `0`, `1.5`, an HTTP-date and seven digits; a 500 on options; a 429 with another code; a
      400 `signin_failed` on sign-in options. A case blocks passkey.js and asserts `data-state="loading"` with the
      button hidden and the static status text shown; an `unsupported` case without the parse
      function exists for both pages; the WebAuthn stub records the `publicKey` argument it receives and it equals the options
      the stubbed server returned. `done` is asserted (state, message, disabled button, focus, no fragment) from a
      snapshot the page reports through an exposed function the moment `data-state` becomes `done` (Playwright's
      locators wait for a pending navigation), while the response to the navigation to `/` is held, then released. A case with a distinctive server error body and a distinctive
      exception message asserts that neither appears in `#status`. Look: card ≤ 26rem and centred, button 48px high
      with radius 12px, h1 1.5rem, the font family matching `/^["']?Manrope/`, a 2px solid outline after a keyboard Tab.
      [live] (a) e2e/web/live/slice.live.ts, the learner suite of `verify-all.sh`: line 103 clicks the bootstrap button
      by its old name "Register passkey" and changes to "Create your passkey"; its existing test "sign out, then sign
      in through the real page with the same passkey" is the real sign-in proof and is unchanged. (b)
      e2e/web/live/owner.slice.ts, the owner suite of `verify-all.sh --slice`: line 113 makes the same button-name
      change; a new spend-free `auth` step (added to slice.sh's default steps) screenshots both pages at three widths
      outside the repository with axe, overflow and focus checks, then repeats slice.live.ts's sign-out and sign-in
      sequence for the owner (the same calls: Sign out in the app, wait for `/api/auth/signin`, `/api/me` 401, click
      "Sign in with a passkey" with the CDP virtual passkey, `/api/me` 200) — the passkey flow proven unchanged.
  - id: FR-AUTH-15
    text: >-
      Verify seam. `reader.auth.webauthn.verify_registration(rp_id, origin, challenge, response)` and
      `verify_authentication(rp_id, origin, challenge, response, public_key, stored_count, expected_user_handle)` are
      pure functions over py_webauthn 3.0.1 that return either the verified data or one `failure_reasons` member. They
      classify with their own checks, in a fixed order, over the library's parsers (`parse_registration_credential_json`,
      `parse_authentication_credential_json`, the parsed clientDataJSON, authenticatorData and attestation object),
      then call the library's `verify_*` as the final gate; an error from that gate that the own checks did not
      classify maps to `library_rejected`. Classification never matches exception message strings; the signature is
      checked by the seam itself through py_webauthn's `verify_signature` helper (over authenticatorData ‖
      SHA-256(clientDataJSON) with the decoded credential public key), so `bad_signature` comes from the
      `InvalidSignature` exception type. Check order, first failure wins.
      Registration: parse (`malformed`); clientData type `webauthn.create` (`wrong_type`); challenge
      (`challenge_mismatch`); origin (`origin_mismatch`); attestation object parse (`malformed`); fmt in
      `policy.attestation_formats` (`attestation_format_refused`); RP ID hash (`rp_id_mismatch`); UP
      (`user_present_missing`); UV (`user_verified_missing`); attested credential data present (`malformed`); public
      key algorithm in `policy.algorithms` (`algorithm_refused`); public key loadable as a usable key (`malformed`:
      an off-curve EC2 point, an unknown curve, an OKP key that is not 32 bytes, an RSA modulus under 2048 bits);
      library gate (`library_rejected`).
      Authentication: parse (`malformed`); clientData type `webauthn.get` (`wrong_type`); challenge; origin;
      authenticatorData parse (`malformed`); RP ID hash; UP; UV; userHandle present (`user_handle_missing`); userHandle
      equal (`user_handle_mismatch`); signature (`bad_signature`); `counter_cases` (`counter_regressed`); library gate
      (`library_rejected`). UV precedes userHandle, so the upstream EC2 and OKP vectors yield `user_verified_missing`.
      Both functions are total: for any JSON value, CBOR or key bytes they return, never raise.
      The route layer adds the
      database checks: `credential_id_taken` (a registration whose credential id exists, for any user),
      `unknown_credential`, `ceremony_invalid`, `token_invalid`, `owner_has_credential`, `user_disabled`.
  - id: FR-AUTH-16
    text: >-
      Startup validation. `reader-server --role api|worker` exits 1 with exactly one `config_errors` code (the first in
      table order) when the configuration matches its condition, before connecting to the database.
  - id: FR-AUTH-17
    text: >-
      Cleanup. At api startup and every `cleanup_interval_s` from a task in the app lifespan (no job queue), the api
      deletes challenges and bootstrap tokens expired or consumed more than `challenge_ttl_s` ago, sessions expired or
      revoked, and `auth_failures` rows older than `failure_limit.window_s`.
  - id: FR-AUTH-18
    text: >-
      Logging. A failed ceremony logs one record with the route and the `failure_reasons` member, and nothing else from
      the request or the response.

invariants:
  - id: INV-AUTH-1
    text: >-
      A challenge is used at most once: concurrent or repeated verifies of one ceremony yield at most one success
      (consume is a single `UPDATE … WHERE consumed_at IS NULL AND expires_at > now() RETURNING`). An expired, consumed,
      unknown or other-kind ceremony never verifies, and a ceremony created for one user never registers a credential
      for another.
  - id: INV-AUTH-2
    text: >-
      No session row is created and no session cookie is set except by a successful bootstrap, add-passkey or sign-in
      verification in the same request.
  - id: INV-AUTH-3
    text: >-
      A response that sets the session cookie always sets `Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/`, the
      `__Host-` prefix and no `Domain`; the ceremony cookie has the same attributes and `Max-Age=challenge_ttl_s`.
  - id: INV-AUTH-4
    text: >-
      Through the verify seam, a valid recorded response (VEC-AUTH-1) passes, and each single mutation below, re-signed
      by the software authenticator so that only the mutated field is wrong, fails with its own reason: origin
      (`origin_mismatch`), RP ID hash (`rp_id_mismatch`), challenge (`challenge_mismatch`), the UP flag cleared
      (`user_present_missing`), the UV flag cleared (`user_verified_missing`), `clientDataJSON.type` swapped between
      `webauthn.create` and `webauthn.get` (`wrong_type`), the signature without re-signing (`bad_signature`), the
      userHandle set to another user's id (`user_handle_mismatch`), the userHandle absent (`user_handle_missing`), and
      an attestation fmt other than `none` (`attestation_format_refused`).
  - id: INV-AUTH-5
    text: >-
      Session ids, ceremony ids and bootstrap tokens are stored only as SHA-256. They and the database password never
      appear in any log record, error body, exception message or traceback — canary test across: Uvicorn access logs,
      captured logging, HTTP responses, startup failure, connection refused, authentication failed, `--healthcheck`
      output and `bootstrap-link` stderr. Challenges are public by design and stored raw.
  - id: INV-AUTH-6
    text: >-
      A stored `sign_count` never decreases, and each row of `counter_cases` holds (one test per row).
  - id: INV-AUTH-7
    text: >-
      No bootstrap registers a credential while the user has a credential, so at most one bootstrap succeeds until the
      user's credentials are deleted (owner note 1): a token revoked after its options fails; a token expiring between
      options and verify fails; two concurrent `bootstrap-link` runs followed by two concurrent verifies (one per
      token) leave exactly one credential; a bad response with a valid token, then a good one with the same token,
      succeeds and leaves exactly one `auth_failures` row (FR-AUTH-5 failure path; likewise for add-passkey with its
      challenge, FR-AUTH-6).
  - id: INV-AUTH-8
    text: >-
      Every table in the migrated schema has a NOT NULL `owner_id` column with a foreign key to `users.id`, except the
      system tables declared by any spec (checked against the live schema after `alembic upgrade heads`; the test reads
      the `tables` entries with `system: true` from every spec in spec/modules/, and a `procrastinate_*` prefix entry
      covers every table it matches). Here: users, auth_challenges, bootstrap_tokens, auth_failures; SRV-EVENTS
      declares job_keys and procrastinate_*.
  - id: INV-AUTH-9
    text: >-
      A user whose handle is removed from `users[]` is disabled at the next api startup: its sessions are revoked, its
      session cookies no longer authenticate, its sign-in fails, and all its rows remain.

nfr: []

vectors:
  - id: VEC-AUTH-1
    source: >-
      Software authenticator (server/tests/auth/softauthn.py, committed with Red; it also generates the fixture): a
      P-256 key from the fixed 32-byte scalar 0x01…01, `none` attestation, flags UP|UV|BE|BS, sign count 0, AAGUID all
      zero, RP ID `localhost`, origin `https://localhost`, challenge 32 bytes of 0x02, userHandle 64 bytes of 0x03; one
      registration and one authentication response. It models the shape the spike recorded for Apple Passwords
      (REF-AUTH-5); it is a regression oracle for this code, not evidence of browser behaviour. The real-authenticator
      oracle is the stage-1 owner live check (Safari, Apple Passwords).
    file: spec/fixtures/SRV-AUTH/softauthn-es256.json
  - id: VEC-AUTH-2
    source: >-
      py_webauthn 3.0.1 test vectors (BSD-3-Clause, copied with attribution in the file, each with its upstream test
      name, challenge, origin and RP ID), run through the verify seam only (FR-AUTH-15), with expected results: the
      `none`-attestation registration vector of tests/test_verify_registration_response.py passes; the RSA
      authentication vector of tests/test_verify_authentication_response.py passes; its EC2 and OKP authentication
      vectors fail with `user_verified_missing` (recorded without UV; this module requires UV).
    file: spec/fixtures/SRV-AUTH/py-webauthn-vectors.json

# Stage-1 live check (S1.live; e2e/live/stage-1.sh is written in that task). The automated part uses the software
# authenticator against `https://localhost` for the learner `live-check`, declared in the owner's reader.yaml and shown
# in deploy/reader.example.yaml. Each run first deletes `live-check`'s credentials and sessions through `docker compose
# exec postgres psql` (owner note 1's procedure), then: `reader-server bootstrap-link --handle live-check` (through
# `docker compose exec`), a registration with a key generated for this run (no key is committed), `GET /api/me` →
# role learner, sign-out → 401, a sign-in, `GET /api/me` → 200. The cookie jar is a mktemp file with mode 0600, deleted
# on exit. This gives a standing learner account with no usable credential between runs (each run's key is
# discarded); its `kernel-user-live-check` service exists only in the `kernels` profile, so it does not start by default.
# The owner part is manual: the owner registers in Safari through `reader bootstrap`, then the script asks the owner to
# open `https://localhost/api/me` and confirm `"role":"owner"`. The roadmap's `curl -b ~/.reader/cookie` line changes
