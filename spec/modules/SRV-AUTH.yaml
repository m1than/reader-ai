# SRV-AUTH — passkey sign-in, server-side sessions, the owner bootstrap, and the stage-1 server skeleton (ADR-0012).
#
# Scope. docs/roadmap.md stage 1 hands "database, api skeleton, auth middleware" to stage 2, and SRV-AUTH is the only
# stage-1 server module that needs them, so this spec also owns:
#   - `reader.db`: the async engine, the Alembic environment and the first migration (ADR-0006);
#   - `reader.api`: the FastAPI app factory, routes declared as data, `/api/healthz`, `/api/me`;
#   - `reader.serve`: the `reader-server --role api|worker|mcp [--bind] [--healthcheck]` entrypoint that
#     OPS-DEPLOY's compose.yaml runs (FR-DEPLOY-11), and the `bootstrap-link` subcommand. The worker role is an idle
#     process in stage 1 (jobs arrive with V.SRV-JOBS-min) and never migrates. The mcp role exits with code 2 until
#     SRV-MCP (stage 7); it is not in the default profile.
# Later modules add their routes and tables to these packages under their own specs.
#
# Out of scope for stage 1: invitations beyond a stub table and self-service sign-up (stage 8, ADR-0016, ADR-0017);
# MCP OAuth and personal access tokens (SRV-MCP, ADR-0015); the web UI (WEB-UI, stage 4) — until then the api serves
# two minimal pages (FR-AUTH-14); passkey recovery (owner note 1).
#
# Deviation from ADR-0012, declared: ADR-0012 says "the first start prints a one-time bootstrap link". Here no process
# prints it to a log: `reader-server bootstrap-link` writes it to the stdout of a `docker compose exec` that OPS-CLI's
# `reader bootstrap` runs, and OPS-CLI opens it in the browser without printing it. Reason: a link in container logs
# is a credential in `docker logs`, in log backups and in agent context. The same command, with `--handle`, lets a
# configured learner register before invitations exist (stage 8); ADR-0012's "others join by invitation link" stays the
# stage-8 target. No ADR status changes.
#
# Cross-spec requirements (paired changes sent by the coordinator, 2026-11-20):
#   - OPS-DEPLOY: compose.yaml sets `READER_CONFIG=/etc/reader/reader.yaml` statically for api, worker and mcp (no `$`
#     interpolation); FR-DEPLOY-5 is amended to allow exactly one override bind: OPS-CLI's in-memory Compose override
#     (the one that already declares kernel networks) adds only the read-only bind of the owner's reader.yaml at
#     `/etc/reader/reader.yaml`. reader.yaml holds secret references only (ADR-0011), so the bind carries no secret.
#   - OPS-DEPLOY: deploy/reader.example.yaml shows the learner `live-check` (stage-1 live check, end of this file).
#   - OPS-CLI: `reader bootstrap [--handle <h>]` runs `docker compose exec -T api reader-server bootstrap-link
#     [--handle <h>]`, captures stdout, and opens the link with `open` without printing it.
#
# Owner notes (no action required in stage 1):
#   1. Recovery. If the owner loses every passkey: `docker compose exec postgres psql` deletes the owner's rows in
#      `webauthn_credentials`, then `reader bootstrap` registers a new one. A `reader-server reset-owner-passkeys`
#      command is deferred to a later stage. Trust boundary: any process that can use the owner's Docker socket can
#      bootstrap (and can already read every container's secrets, ADR-0026's accepted exposure). A Claude Code deny
#      rule on `docker exec`/`docker compose exec` against the api is the owner's decision, not this spec's.
#   2. The server connects as the `postgres` superuser (image default) until a dedicated least-privilege role arrives
#      in stage 9 (hardening).
#   3. The global failure limit (FR-AUTH-11) is also a lockout lever: anyone who can reach the ceremony routes can fill
#      it and block every user's sign-in for up to an hour. Harmless on `localhost`; revisit before the VPS.
#
# Red phase: tests import the module inside each test body, so that each test fails on its own assertion.

id: SRV-AUTH
title: Passkey sign-in, Postgres sessions, owner bootstrap, and the server skeleton (db, api, reader-server)
