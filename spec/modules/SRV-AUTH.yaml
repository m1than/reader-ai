#   only, ADR-0011) — not in the OPS-DEPLOY branch today. The database user and name are the image defaults
#   (`postgres`/`postgres`); a dedicated `reader` role is a later hardening.
# - OPS-CLI: `reader bootstrap` runs `docker compose exec api reader-server bootstrap-link` and opens the link in the
#   default browser without printing it, so the token stays out of terminals and agent context.
# Dependencies added to server/pyproject.toml with Green: fastapi, uvicorn, sqlalchemy[asyncio], asyncpg, alembic,
