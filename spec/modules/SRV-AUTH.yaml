# SRV-AUTH — passkey sign-in, server-side sessions, the owner bootstrap, and the stage-1 server skeleton (ADR-0012).
#
# Scope. docs/roadmap.md stage 1 hands "database, api skeleton, auth middleware" to stage 2, and SRV-AUTH is the only
# stage-1 server module that needs them, so this spec also owns:
#   - `reader.db`: the async engine, the Alembic environment and the first migration (ADR-0006);
#   - `reader.api`: the FastAPI app factory, routes declared as data, `/api/healthz`, `/api/me`;
#   - `reader.serve`: the `reader-server --role api|worker|mcp [--bind] [--healthcheck]` entrypoint that
#     OPS-DEPLOY's compose.yaml runs (FR-DEPLOY-11), and the `bootstrap-link` subcommand. The worker role is an idle
#     process in stage 1 (jobs arrive with V.SRV-JOBS-min) and never migrates. The mcp role exits with code 2 until
#     SRV-MCP (stage 7); it is not in the default profile.
# Later modules add their routes and tables to these packages under their own specs.
#
# Out of scope for stage 1: invitations beyond a stub table and self-service sign-up (stage 8, ADR-0016, ADR-0017);
# MCP OAuth and personal access tokens (SRV-MCP, ADR-0015); the web UI (WEB-UI, stage 4) — until then the api serves
# two minimal pages (FR-AUTH-14); passkey recovery (owner note 1).
#
# Deviation from ADR-0012, declared: ADR-0012 says "the first start prints a one-time bootstrap link". Here no process
# prints it to a log: `reader-server bootstrap-link` writes it to the stdout of a `docker compose exec` that OPS-CLI's
# `reader bootstrap` runs, and OPS-CLI opens it in the browser without printing it. Reason: a link in container logs
# is a credential in `docker logs`, in log backups and in agent context. The same command, with `--handle`, lets a
# configured learner register before invitations exist (stage 8); ADR-0012's "others join by invitation link" stays the
# stage-8 target. No ADR status changes.
#
# Cross-spec requirements (paired changes sent by the coordinator, 2026-11-20):
#   - OPS-DEPLOY: compose.yaml sets `READER_CONFIG=/etc/reader/reader.yaml` statically for api, worker and mcp (no `$`
#     interpolation); FR-DEPLOY-5 is amended to allow exactly one override bind: OPS-CLI's in-memory Compose override
#     (the one that already declares kernel networks) adds only the read-only bind of the owner's reader.yaml at
#     `/etc/reader/reader.yaml`. reader.yaml holds secret references only (ADR-0011), so the bind carries no secret.
#   - OPS-DEPLOY: deploy/reader.example.yaml shows the learner `live-check` (stage-1 live check, end of this file).
#   - OPS-CLI: `reader bootstrap [--handle <h>]` runs `docker compose exec -T api reader-server bootstrap-link
#     [--handle <h>]`, captures stdout, and opens the link with `open` without printing it.
#
# Owner notes (no action required in stage 1):
#   1. Recovery. If the owner loses every passkey: `docker compose exec postgres psql` deletes the owner's rows in
#      `webauthn_credentials`, then `reader bootstrap` registers a new one. A `reader-server reset-owner-passkeys`
#      command is deferred to a later stage. Trust boundary: any process that can use the owner's Docker socket can
#      bootstrap (and can already read every container's secrets, ADR-0026's accepted exposure). A Claude Code deny
#      rule on `docker exec`/`docker compose exec` against the api is the owner's decision, not this spec's.
#   2. The server connects as the `postgres` superuser (image default) until a dedicated least-privilege role arrives
#      in stage 9 (hardening).
#   3. The global failure limit (FR-AUTH-11) is also a lockout lever: anyone who can reach the ceremony routes can fill
#      it and block every user's sign-in for up to an hour. Harmless on `localhost`; revisit before the VPS.
#
# Red phase: tests import the module inside each test body, so that each test fails on its own assertion.

id: SRV-AUTH
title: Passkey sign-in, Postgres sessions, owner bootstrap, and the server skeleton (db, api, reader-server)
status: draft
approved_by: null
approved_at: null
review: "deep-reviewer (Fable) round 1: changes (B1–B10); round 2: changes (N1–N4 plus non-blocking); revised 2026-11-20"
layer: server
track: product
adr: [ADR-0012, ADR-0006, ADR-0011, ADR-0016, ADR-0017, ADR-0018, ADR-0020, ADR-0024, ADR-0026]

paths:
  - server/src/reader/auth/**
  - server/src/reader/db/**
  - server/src/reader/api/**
  - server/src/reader/serve/**
  - server/tests/auth/**
  - spec/fixtures/SRV-AUTH/**

normative:
  - id: REF-AUTH-1
    title: W3C Web Authentication Level 3 — §7.1 Registering a new credential, §7.2 Verifying an authentication assertion, §6.1.1 signature counter
    url: https://www.w3.org/TR/webauthn-3/
  - id: REF-AUTH-2
    title: py_webauthn 3.0.1 — verify_registration_response / verify_authentication_response (Duo Labs, BSD-3-Clause)
    url: https://github.com/duo-labs/py_webauthn
  - id: REF-AUTH-3
    title: RFC 6265bis — cookie prefixes `__Host-`, SameSite (draft-ietf-httpbis-rfc6265bis)
    url: https://datatracker.ietf.org/doc/draft-ietf-httpbis-rfc6265bis/
  - id: REF-AUTH-4
    title: OWASP Cheat Sheet — Session Management; Cross-Site Request Forgery Prevention (Origin verification)
    url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  - id: REF-AUTH-5
    title: spikes/passkey-localhost/RESULT.md — RP ID `localhost`, origin `https://localhost`, synced passkeys report sign count 0, gaps for the product
    url: spikes/passkey-localhost/RESULT.md
  - id: REF-AUTH-6
    title: ADR-0006 — FastAPI, SQLAlchemy 2 async with asyncpg, Alembic
    url: docs/adr/0006-backend-architecture.md
  - id: REF-AUTH-7
    title: RFC 9110 §8.3.1 — media type comparison (type/subtype case-insensitive, parameters separate)
    url: https://www.rfc-editor.org/rfc/rfc9110#section-8.3.1

# Policy values (not measurements; changing one is a spec change). Clocks are the database's `now()`.
policy:
  challenge_bytes: 32
  challenge_ttl_s: 300
  bootstrap_token_bytes: 32
  bootstrap_token_ttl_s: 900
  session_id_bytes: 32
  session_absolute_ttl_s: 1209600      # 14 days; no sliding renewal
  recent_session_s: 600               # adding a passkey needs a session this young (FR-AUTH-6)
  # A DoS and row-growth bound, not brute-force protection (a passkey assertion cannot be guessed): failed ceremonies
  # across all clients. A 429 is not a failure and adds no row.
  failure_limit: { max: 100, window_s: 3600 }
  cleanup_interval_s: 3600
  algorithms: [-7, -8, -257]            # ES256, EdDSA, RS256
  attestation_formats: [none]           # any other fmt is refused
  cookies:
    session: __Host-reader_session
    ceremony: __Host-reader_ceremony

# Tables of the first migration. `owner_id` is NOT NULL with a foreign key to users.id. System tables carry no
# user-owned content; INV-AUTH-8 checks every other table.
tables:
  users: { system: true, columns: "id uuid pk, handle text unique, role text CHECK (role IN ('owner','learner')), webauthn_user_id bytea unique CHECK (octet_length = 64), display_name text, consent_evaluation bool, consent_tuning bool, disabled_at timestamptz null, created_at" }
  webauthn_credentials: { owner_id: true, columns: "credential_id bytea pk, public_key bytea, sign_count bigint CHECK (>= 0), transports text[], aaguid uuid, backed_up bool, created_at, last_used_at" }
  sessions: { owner_id: true, columns: "id_sha256 bytea pk, created_at, expires_at, revoked_at" }
  auth_challenges: { system: true, columns: "ceremony_sha256 bytea pk, kind text CHECK (kind IN ('register','authenticate','bootstrap')), challenge bytea, user_id uuid null, bootstrap_token_sha256 bytea null, expires_at, consumed_at" }
  bootstrap_tokens: { system: true, columns: "token_sha256 bytea pk, user_id uuid, expires_at, consumed_at, revoked_at" }
  auth_failures: { system: true, columns: "id bigserial, reason text, at timestamptz" }
  invitations: { owner_id: true, columns: "id uuid pk, created_at (stub; stage 8)" }

# Internal failure reasons of the verify seam and the routes (FR-AUTH-15). Logged as the enum name only; never
# returned to clients.
failure_reasons: [malformed, wrong_type, unknown_credential, challenge_mismatch, origin_mismatch, rp_id_mismatch,
  user_present_missing, user_verified_missing, bad_signature, user_handle_missing, user_handle_mismatch,
  counter_regressed, attestation_format_refused, algorithm_refused, credential_id_taken, ceremony_invalid,
  token_invalid, owner_has_credential, user_disabled, library_rejected]

# Signature counter rule (REF-AUTH-1 §6.1.1 as py_webauthn 3.0.1 applies it; stored m, received n).
counter_cases:
  - { stored: 0, received: 0, result: pass }
  - { stored: 0, received: "n > 0", result: pass }
  - { stored: "m > 0", received: "n > m", result: pass }
  - { stored: "m > 0", received: "n <= m (0 included)", result: fail }

# Configuration inputs and their startup error codes (FR-AUTH-16), checked in this order.
config_errors:
  - { code: instance_url_path, when: "instance.url has a path other than empty or `/`" }
  - { code: instance_url_query, when: "instance.url has a query or fragment" }
  - { code: instance_url_userinfo, when: "instance.url has userinfo" }
  - { code: instance_url_ip_host, when: "instance.url host is an IPv4 or IPv6 literal (WebAuthn RP IDs are domains)" }
  - { code: instance_url_host_form, when: "instance.url host has a non-ASCII (IDN) character or a trailing dot" }
  - { code: owner_count, when: "the number of users[] entries with role owner is not 1" }
  - { code: unknown_role, when: "a users[] role is not owner or learner" }
  - { code: signup_not_supported, when: "sharing.signup is present and not boolean false" }

requirements:
  - id: FR-AUTH-1
    text: >-
      `reader-server --role api --bind <ip:port>` loads the configuration through SRV-CONFIG's `load_config` from
      `READER_CONFIG`, validates it (FR-AUTH-16), reads the database password from
      `secret://file/run/secrets/db-password`, connects with the password passed as a separate connect parameter (the
      DSN string never contains it), migrates (below), deletes expired rows (FR-AUTH-17), ensures a `users` row for
      every `users[]` entry (handle, role; existing rows keep their id and webauthn_user_id; a disabled user named
      again is re-enabled), disables every user row whose handle is no longer in `users[]` (sets `disabled_at`,
      revokes its sessions, keeps its rows; INV-AUTH-9), and serves the app with Uvicorn. Migration: `alembic upgrade
      heads` (the history has several heads: SRV-EVENTS adds procrastinate's shipped chain, branch label
      `procrastinate`), under `pg_advisory_lock(<namespace>, 1)` in the two-key form with a fixed migration namespace
      constant declared in `reader.db`, distinct from SRV-EVENTS's job-key namespace. Alembic runs through the app's
      asyncpg engine (`run_sync` in env.py; procrastinate 3.12.0's `execute_script` has its own asyncpg path through the
      raw driver connection for multi-statement SQL). `reader.db` sets `version_locations` on the programmatic Alembic
      `Config` before `command.upgrade`, from a declared list of directories (Alembic does not glob; no scan): in stage
      1 only `reader/db/migrations/versions`; SRV-EVENTS appends its own directory and the installed
      `procrastinate/contrib/alembic/versions`. "At all heads" in FR-AUTH-2 means every head of that history.
  - id: FR-AUTH-2
    text: >-
      `reader-server --role <role> --healthcheck` exits 0 only when `/run/secrets/db-password` exists, the database
      answers `SELECT 1`, the schema is at all Alembic heads and, for `api`, `GET /api/healthz` on the bound address
      returns 200; otherwise it exits 1 and prints one line naming the failed check (no values). `--role worker` without
      `--healthcheck` waits until the schema is at all heads without migrating, then runs until SIGTERM and exits 0. `--role mcp`
      exits 2 with "mcp role arrives with SRV-MCP".
  - id: FR-AUTH-3
    text: >-
      RP ID is the lower-cased host of `instance.url`; the only accepted origin is `scheme://host[:port]`, lower-cased,
      with the port only when it is not the scheme default (`https://localhost` for the example config). Registration
      options: `residentKey: required`, `userVerification: required`, `attestation: none`, `policy.algorithms`,
      `excludeCredentials` listing the user's credentials, `user.id` = the user's `webauthn_user_id` (64 random bytes,
      created once). Authentication options: `userVerification: required`, empty `allowCredentials`.
  - id: FR-AUTH-4
    text: >-
      `reader-server bootstrap-link [--handle <h>]` (default: the owner) locks the user's `users` row `FOR UPDATE`,
      exits 1 with "user already has a passkey" if the user has a credential, else marks earlier unconsumed tokens of
      that user revoked, stores the SHA-256 of a fresh `bootstrap_token_bytes` token valid for `bootstrap_token_ttl_s`,
      commits, and writes `<origin>/api/auth/bootstrap#<token>` to stdout only. An unknown handle exits 1. Stderr never
      carries the token or the database password.
  - id: FR-AUTH-5
    text: >-
      `POST /api/auth/bootstrap/options` with `{token}` returns registration options for the token's user and sets the
      ceremony cookie when the token is unconsumed, unrevoked and unexpired; the ceremony row stores the token's
      SHA-256. `POST /api/auth/bootstrap/verify`, in one transaction: locks the user's row `FOR UPDATE`; re-checks that
      the user has no credential; consumes the token with `UPDATE … WHERE consumed_at IS NULL AND revoked_at IS NULL AND
      expires_at > now() RETURNING`; consumes the challenge (INV-AUTH-1); verifies through the seam (FR-AUTH-15); stores
      the credential; starts a session (FR-AUTH-8). On any failure that transaction rolls back, so the token and the
      challenge stay usable until they expire; the `auth_failures` row is inserted in a separate committed transaction;
      the answer is 400 `bootstrap_failed`.
  - id: FR-AUTH-6
    text: >-
      `POST /api/auth/register/{options,verify}` add a passkey to the signed-in user. Both require a session created
      less than `recent_session_s` ago (401 `reauth_required` otherwise), because a stolen long-lived cookie must not be
      able to plant a persistent credential. The ceremony is bound to that user; verify runs the FR-AUTH-15 checks and,
      on success, rotates the session (FR-AUTH-8). On failure the ceremony transaction rolls back (the challenge stays
      usable until it expires) and the `auth_failures` row is inserted in a separate committed transaction.
  - id: FR-AUTH-7
    text: >-
      `POST /api/auth/signin/options` returns authentication options and sets the ceremony cookie.
      `POST /api/auth/signin/verify` consumes the challenge and, on failure, records an `auth_failures` row, both in a
      transaction that commits even when verification fails; it looks up the credential by raw id and verifies through
      the seam with the stored public key, the stored counter and the `webauthn_user_id` of the credential's
      `owner_id`; a credential of a disabled user fails `user_disabled`. On success, in a second transaction, it updates
      `sign_count` conditionally (`WHERE credential_id = :id AND (sign_count < :n OR (sign_count = 0 AND :n = 0))`;
      zero rows updated is `counter_regressed`), `last_used_at` and `backed_up`, and starts a session. Every failure
      answers 400 `signin_failed` with no detail.
  - id: FR-AUTH-8
    text: >-
      Starting a session creates a random `session_id_bytes` id, stores its SHA-256 with `expires_at = now() +
      session_absolute_ttl_s`, revokes the session presented in the request (if any), and sets
      `__Host-reader_session=<id>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<ttl>` with no Domain.
  - id: FR-AUTH-9
    text: >-
      `POST /api/auth/signout` revokes the current session and clears the cookie (`Max-Age=0`, same attributes); it
      answers 204 with or without a session. `GET /api/me` answers 200 `{id, handle, role, display_name, consent:
      {evaluation, tuning}}` for a valid session and 401 `{"error":"unauthenticated"}` otherwise.
  - id: FR-AUTH-10
    text: >-
      A request is authenticated only by a session cookie whose SHA-256 matches a row that is not revoked and not
      expired and whose user is not disabled. Routes are declared as data with `auth: public | session | recent_session` and `method`; `public` are
      exactly `/api/healthz`, the bootstrap and sign-in ceremonies, `/api/auth/signout`, and the pages and script of
      FR-AUTH-14. No GET route writes to the database.
  - id: FR-AUTH-11
    text: >-
      Failure limit. Every failed ceremony verification or invalid bootstrap token inserts an `auth_failures` row
      with its reason. While `failure_limit.max` rows exist within `failure_limit.window_s`, the `/options` and
      `/verify` routes of FR-AUTH-5..7 answer 429 with `Retry-After` (seconds until the oldest counted row leaves the
      window) without inserting a row.
  - id: FR-AUTH-12
    text: >-
      CSRF. Every non-GET `/api/*` request and every WebSocket upgrade under `/api/*` must carry an `Origin` header
      equal to the origin of FR-AUTH-3; every non-GET request with a body must have a Content-Type whose media type
      (compared per REF-AUTH-7, parameters ignored) is `application/json`. Otherwise 403 `{"error":"origin"}` or 415
      before any handler runs or any row is written.
  - id: FR-AUTH-13
    text: >-
      Groundwork (ADR-0017, ADR-0018). `users.consent_evaluation` defaults to true for role owner and false otherwise;
      `consent_tuning` defaults to false. The routes `POST /api/auth/signup/{options,verify}` always answer 404 in
      stage 1; `sharing.signup` is accepted only absent or false (FR-AUTH-16); sign-up is finished in stage 8. The
      `invitations` table exists; no route uses it.
  - id: FR-AUTH-14
    text: >-
      `GET /api/auth/bootstrap` and `GET /api/auth/signin` serve static HTML pages with one same-origin script
      (`/api/auth/static/passkey.js`, no inline script, so a `script-src 'self'` CSP holds). The bootstrap page reads
      the token from the URL fragment and clears it at once with `history.replaceState`; both pages run the ceremonies
      with `PublicKeyCredential.parse*OptionsFromJSON` and `toJSON()` and on success navigate to `/`. WEB-UI replaces
      them in stage 4.
  - id: FR-AUTH-15
    text: >-
      Verify seam. `reader.auth.webauthn.verify_registration(rp_id, origin, challenge, response)` and
      `verify_authentication(rp_id, origin, challenge, response, public_key, stored_count, expected_user_handle)` are
      pure functions over py_webauthn 3.0.1 that return either the verified data or one `failure_reasons` member. They
      classify with their own checks, in a fixed order, over the library's parsers (`parse_registration_credential_json`,
      `parse_authentication_credential_json`, the parsed clientDataJSON, authenticatorData and attestation object),
      then call the library's `verify_*` as the final gate; an error from that gate that the own checks did not
      classify maps to `library_rejected`. Classification never matches exception message strings. They refuse attestation formats outside `policy.attestation_formats` and algorithms outside `policy.algorithms`, apply
      `counter_cases`, and fail `user_handle_missing` when the assertion has no userHandle. The route layer adds the
      database checks: `credential_id_taken` (a registration whose credential id exists, for any user),
      `unknown_credential`, `ceremony_invalid`, `token_invalid`, `owner_has_credential`, `user_disabled`.
  - id: FR-AUTH-16
    text: >-
      Startup validation. `reader-server --role api|worker` exits 1 with exactly one `config_errors` code (the first in
      table order) when the configuration matches its condition, before connecting to the database.
  - id: FR-AUTH-17
    text: >-
      Cleanup. At api startup and every `cleanup_interval_s` from a task in the app lifespan (no job queue), the api
      deletes challenges and bootstrap tokens expired or consumed more than `challenge_ttl_s` ago, sessions expired or
      revoked, and `auth_failures` rows older than `failure_limit.window_s`.
  - id: FR-AUTH-18
    text: >-
      Logging. A failed ceremony logs one record with the route and the `failure_reasons` member, and nothing else from
      the request or the response.

invariants:
  - id: INV-AUTH-1
    text: >-
      A challenge is used at most once: concurrent or repeated verifies of one ceremony yield at most one success
      (consume is a single `UPDATE … WHERE consumed_at IS NULL AND expires_at > now() RETURNING`). An expired, consumed,
      unknown or other-kind ceremony never verifies, and a ceremony created for one user never registers a credential
      for another.
  - id: INV-AUTH-2
    text: >-
      No session row is created and no session cookie is set except by a successful bootstrap, add-passkey or sign-in
      verification in the same request.
  - id: INV-AUTH-3
    text: >-
      A response that sets the session cookie always sets `Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/`, the
      `__Host-` prefix and no `Domain`; the ceremony cookie has the same attributes and `Max-Age=challenge_ttl_s`.
  - id: INV-AUTH-4
    text: >-
      Through the verify seam, a valid recorded response (VEC-AUTH-1) passes, and each single mutation below, re-signed
      by the software authenticator so that only the mutated field is wrong, fails with its own reason: origin
      (`origin_mismatch`), RP ID hash (`rp_id_mismatch`), challenge (`challenge_mismatch`), the UP flag cleared
      (`user_present_missing`), the UV flag cleared (`user_verified_missing`), `clientDataJSON.type` swapped between
      `webauthn.create` and `webauthn.get` (`wrong_type`), the signature without re-signing (`bad_signature`), the
      userHandle set to another user's id (`user_handle_mismatch`), the userHandle absent (`user_handle_missing`), and
      an attestation fmt other than `none` (`attestation_format_refused`).
  - id: INV-AUTH-5
    text: >-
      Session ids, ceremony ids and bootstrap tokens are stored only as SHA-256. They and the database password never
      appear in any log record, error body, exception message or traceback — canary test across: Uvicorn access logs,
      captured logging, HTTP responses, startup failure, connection refused, authentication failed, `--healthcheck`
      output and `bootstrap-link` stderr. Challenges are public by design and stored raw.
  - id: INV-AUTH-6
    text: >-
      A stored `sign_count` never decreases, and each row of `counter_cases` holds (one test per row).
  - id: INV-AUTH-7
    text: >-
      No bootstrap registers a credential while the user has a credential, so at most one bootstrap succeeds until the
      user's credentials are deleted (owner note 1): a token revoked after its options fails; a token expiring between
      options and verify fails; two concurrent `bootstrap-link` runs followed by two concurrent verifies (one per
      token) leave exactly one credential; a bad response with a valid token, then a good one with the same token,
      succeeds and leaves exactly one `auth_failures` row (FR-AUTH-5 failure path; likewise for add-passkey with its
      challenge, FR-AUTH-6).
  - id: INV-AUTH-8
    text: >-
      Every table in the migrated schema has a NOT NULL `owner_id` column with a foreign key to `users.id`, except the
      system tables declared by any spec (checked against the live schema after `alembic upgrade heads`; the test reads
      the `tables` entries with `system: true` from every spec in spec/modules/, and a `procrastinate_*` prefix entry
      covers every table it matches). Here: users, auth_challenges, bootstrap_tokens, auth_failures; SRV-EVENTS
      declares job_keys, job_outcomes and procrastinate_*.
  - id: INV-AUTH-9
    text: >-
      A user whose handle is removed from `users[]` is disabled at the next api startup: its sessions are revoked, its
      session cookies no longer authenticate, its sign-in fails, and all its rows remain.

nfr: []

vectors:
  - id: VEC-AUTH-1
    source: >-
      Software authenticator (server/tests/auth/softauthn.py, committed with Red; it also generates the fixture): a
      P-256 key from the fixed 32-byte scalar 0x01…01, `none` attestation, flags UP|UV|BE|BS, sign count 0, AAGUID all
      zero, RP ID `localhost`, origin `https://localhost`, challenge 32 bytes of 0x02, userHandle 64 bytes of 0x03; one
      registration and one authentication response. It models the shape the spike recorded for Apple Passwords
      (REF-AUTH-5); it is a regression oracle for this code, not evidence of browser behaviour. The real-authenticator
      oracle is the stage-1 owner live check (Safari, Apple Passwords).
    file: spec/fixtures/SRV-AUTH/softauthn-es256.json
  - id: VEC-AUTH-2
    source: >-
      py_webauthn 3.0.1 test vectors (BSD-3-Clause, copied with attribution in the file, each with its upstream test
      name, challenge, origin and RP ID), run through the verify seam only (FR-AUTH-15), with expected results: the
      `none`-attestation registration vector of tests/test_verify_registration_response.py passes; the RSA
      authentication vector of tests/test_verify_authentication_response.py passes; its EC2 and OKP authentication
      vectors fail with `user_verified_missing` (recorded without UV; this module requires UV).
    file: spec/fixtures/SRV-AUTH/py-webauthn-vectors.json

# Stage-1 live check (S1.live; e2e/live/stage-1.sh is written in that task). The automated part uses the software
# authenticator against `https://localhost` for the learner `live-check`, declared in the owner's reader.yaml and shown
# in deploy/reader.example.yaml. Each run first deletes `live-check`'s credentials and sessions through `docker compose
# exec postgres psql` (owner note 1's procedure), then: `reader-server bootstrap-link --handle live-check` (through
# `docker compose exec`), a registration with a key generated for this run (no key is committed), `GET /api/me` →
# role learner, sign-out → 401, a sign-in, `GET /api/me` → 200. The cookie jar is a mktemp file with mode 0600, deleted
# on exit. This gives a standing learner account with no usable credential between runs (each run's key is
# discarded); its `kernel-live-check` service exists only in the `kernels` profile, so it does not start by default.
# The owner part is manual: the owner registers in Safari through `reader bootstrap`, then the script asks the owner to
# open `https://localhost/api/me` and confirm `"role":"owner"`. The roadmap's `curl -b ~/.reader/cookie` line changes
