owner_notes:
  - "The dashboard is a second origin, https://localhost:8443, not https://localhost/traces/ (ADR-0032): MLflow's UI then runs its JavaScript outside the app's origin, so a flaw in it cannot call /api/* with your session (the app's Origin check refuses it). Your existing passkey session is reused: browsers send the localhost cookie to every port, and the api checks it, and the request's Origin, on every request to 8443."
  - "If 8443 shows 401, you are not signed in: open https://localhost, sign in with your passkey, and reload the dashboard. It does not redirect to the sign-in page itself."
  - "Turning tracing off: `observability: {enabled: false}` in reader.yaml, then `reader up`; rotel and mlflow are removed, port 8443 is closed and the api and worker stop exporting. The traces volume stays (not backed up) until you delete it; turning tracing on again shows the old traces until retention trims them."
  - "With open sign-up (ADR-0031), other users' jobs are traced too: the dashboard at 8443 shows every user's job traces (ids, costs, timings, error codes; no handles, no text), and the summary page shows other users' dead system jobs marked `system`. Only you can open either."
  - "What the traces never hold: book text, prompts, answers, notebook code or output, tokens, secrets, user handles. What they hold: route templates, job kinds and ids, lesson/course/run/question ids, stage names, model ids, token counts, the ledger's per-call cost, the tutor's question state, child-span counts (claims, cells, citations, pages, chunks), durations, status and error codes. MLflow shows the per-call cost in its Cost column and Usage dashboard; /observability's lesson and run totals also count open reserves. MLflow's Prompts tab holds the repository's own static instruction files (never book text), and its Quality tab deterministic pass/fail results (ADR-0035)."
  - "Jaeger (ADR-0033) at https://localhost:8444 shows the same traces as a full-width waterfall; it keeps the newest 450 traces in memory and starts empty after any restart. MLflow stays the store."
