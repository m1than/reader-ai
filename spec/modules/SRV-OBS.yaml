  networks and VEC-DEPLOY-2 pairs, ADR-0025 rule 5 amended; B2 gate Origin rules and Access-Control-* stripped; B3 no
  Cookie/Authorization up, no Set-Cookie down; B4 CSP and deep link measured in a browser; B5 CLI pin test and key-subset
  checks; B6 retention order and real-cutoff test; B7 cost from the ledger) plus non-blocking items, applied in fc208f8
  with spikes/obs-stack round 2. Round 2 (fc208f8): changes, 3 blockers (N1 same-site top-level navigation; N2 a wrong
  fixture trace id, ids now generated; N3 job_keys only through published SRV-EVENTS reads, FR-EVENTS-18 paired) plus
  non-blocking items, applied in dfa6f9e with spike round 3 (cross-port click). Round 3 (dfa6f9e): changes, 1 blocker
  (R1 fixture keys were placeholders; real FR-EVENTS-2 keys, spot-checked against idempotency_key) plus non-blocking
  items, applied in 5677fb3. Round 4 (5677fb3): VERDICT approve; its three nits applied at approval (view (c)'s
  key_rows_of for failed questions, one kind per stage in view (a), 'more rows may exist'). The owner accepted ADR-0018 and
  ADR-0032 on 2026-11-24 (973cd62). Approved by agent with Red on V/obs-impl (2026-11-24); the paired items live in
  their own specs. Paired note 2026-11-24 (V/manage, SRV-CONFIG FR-CONFIG-26, ADR-0036 accepted): `setup` takes the
  file's retention through `reader.config.effective`, and the retention job (FR-OBS-11) and the summary (FR-OBS-1)
