# Per-tab plan for phase 2. Privacy: every listed value is an id, an enum, a number or pinned committed repository
# data. "Writes" names the worker → MLflow requests (ADR-0035 or ADR-0038); "none" means OTLP or read-only.
phase2_tabs:
  - tab: Experiment 0 Training runs and Evaluation runs (Runs)
    shows: one Run per compile run and import, with params, metrics and a cumulative-cost chart; the Run's Traces tab lists its stage traces with assessments (round 6; a Run in another experiment found none, round 7)
    source: agent_spend, the pipeline and ingest tables, linked traces
    privacy: ids, model ids, sha256s, numbers
    writes: runs/search, runs/create, log-batch, runs/update, runs/set-tag, traces/search, traces/link-to-run (ADR-0038)
  - tab: Experiment `bench` Datasets
    shows: tutor-bench-v2 (40) and search-bench-v1 (26) with question ids, questions, chapters and gold pages
    source: the owner's upload of a set whose sha256 is pinned (FR-OBS-22)
    privacy: the agent's own committed questions, with no 5-word run shared with the book (measured); ids and page numbers
    writes: datasets/search, datasets/create, datasets/{id}/records (ADR-0038); the experiment comes from obs.setup
  - tab: Experiment `bench` Evaluation runs
    shows: one Run per bench upload; the tab's chart shows hit@k, reciprocal rank, grounded and gold-cited shares, latency and cost over time
    source: the owner's uploads, recorded in obs_bench_results (FR-OBS-23)
    privacy: ids, numbers, model names, commit shas
    writes: runs/search, runs/create, log-batch, log-inputs, runs/update, runs/set-tag (ADR-0038)
  - tab: Agent versions
    shows: one LoggedModel per version key, with its params (prompt-set sha256, the stage → model map, the pipeline config sha256); traces are compared by the tag reader.version_key
    source: obs.setup (FR-OBS-21 b, FR-OBS-26)
    privacy: sha256s, model ids
    writes: logged-models/search, logged-models create, logged-models/{id} PATCH status READY (ADR-0038); the root tag goes through OTLP
  - tab: Trace view, assessments (owner labels)
    shows: owner.lesson_ok / owner.answer_ok HUMAN assessments on the labelled traces, a relabel's new revision with the old one marked invalid (round 8); Review queues and label schemas are not used (B8)
    source: owner_labels in Postgres (FR-OBS-24), mirrored by obs.label
    privacy: pass/fail, reason enum, ids, a revision number
    writes: traces/{id}/assessments POST (with overrides for a relabel), GET by id (ADR-0038 Decision 2)
  - tab: Experiments list
    shows: "`reader` (experiment 0, renamed) and `bench`, each with its description and reader.* tags (round 10)"
    source: deploy/otel/mlflow-setup.yaml through obs.setup (FR-OBS-26)
    privacy: committed configuration only
    writes: experiments/get|get-by-name|update|create|set-experiment-tag (ADR-0038)
  - tab: Traces, Sessions, Overview, Dashboard, Prompts, Issues
    shows: as in phase 1, plus the tags reader.version_key and mlflow.sourceRun (from the link) as filters
    source: OTLP, FR-OBS-14/-15
    privacy: unchanged (phase 1)
    writes: none new
  - tab: AI Gateway budgets
    shows: disabled (MLFLOW_ENABLE_AI_GATEWAY=false answers 501, round 9); budgets count gateway traffic only and alert by an outbound webhook
    source: none
    privacy: n/a
    writes: none (FR-OBS-25 keeps alerts on /observability)

# B3: the phase 2 job kinds, declared like FR-OBS-14's (SRV-EVENTS `JobKind`, queue `obs`, delays 5 s and 25 s).
# Every handler with tracing off ends without a request; every 4xx other than the listed transients ends `dead` with
# the class name; HTTP 5xx, timeouts and transport errors are transient; INV-OBS-3 holds for every enqueue.
phase2_job_kinds:
  - { kind: obs.setup, args: "{digest: sha256}", key: [digest], max_attempts: 3, timeout_s: 60,
      enqueued_by: "the worker's start hook (enqueue-only)", dead: [ObsSetupRefused],
      note: "a dead key blocks nothing: ensure_setup() also runs inline in obs.runs, obs.bench and obs.label (N2)" }
  - { kind: obs.runs, args: "{kind: compile|ingest, id: uuid, end: int 1..100}", key: [kind, id, end],
      max_attempts: 3, timeout_s: 60, schedule_in_s: 60, lock: "advisory lock_id(obs.runs:<kind>:<id>)",
      enqueued_by: "SRV-PIPELINE / SRV-INGEST after the end's transaction commits (FR-PIPELINE-18, FR-INGEST-26)",
      dead: [ObsRunsRefused, ObsRunsDuplicate] }
  - { kind: obs.bench, args: "{upload_id: uuid}", key: [upload_id], max_attempts: 3, timeout_s: 60,
      enqueued_by: "POST /api/obs/bench, in the transaction that stores the upload",
      idempotent_by: "the Run tag reader.bench_upload", dead: [ObsBenchRefused] }
  - { kind: obs.label, args: "{label_id: uuid, revision: int}", key: [label_id, revision], max_attempts: 3,
      timeout_s: 30, schedule_in_s: 0, enqueued_by: "POST /api/obs/labels in its transaction",
      idempotent_by: "assessment_name + metadata.revision on the trace; a revision below the row's ends at once (N4)",
      transient: [TraceMissing], dead: [ObsLabelRefused] }
  - { kind: obs.health, args: "{slot: datetime truncated to 30 min}", key: [slot], max_attempts: 1, timeout_s: 20,
      traced: false, enqueued_by: "the worker's periodic scheduler (SRV-EVENTS), every 30 minutes", dead: [] }
  - { kind: obs.retention, change: "also deletes old Runs and LoggedModels (FR-OBS-31)" }

# Edits to approved text: ALL APPLIED at Red (V/obs-mlflow-phase2-impl, 2026-11-25) in INV-OBS-2, INV-OBS-3, `adr`,
# FR-OBS-5 (f), FR-OBS-9, FR-OBS-31, `tables` and VEC-OBS-4; kept here as the record of what changed.
phase2_in_place_edits:
  - "INV-OBS-2 gains a phase 2 clause: with the canaries placed in a lesson's text, a tutor question and answer, a
    bench upload's unknown or prose keys and an upload's set file (a non-pinned set), no `obs.runs`, `obs.bench`,
    `obs.label`, `obs.setup` or `obs.health` request body (captured by the in-test MLflow receiver) and no row of
    `obs_bench_results`, `owner_labels` or `obs_stack_status` contains any of them; for arbitrary uploads only
    those passing VEC-OBS-5 produce a row and a job; the pinned questions are the only text that reaches MLflow."
  - "INV-OBS-3 is extended: a failing `obs.runs` enqueue (outside the run's final transaction), `obs.label` or
    `obs.bench` enqueue, and any phase 2 job failure never changes a compile run's, an import's or a question's
    outcome, and a failed mirror never changes a label's record."
  - "ADR list gains ADR-0038; FR-OBS-9's blocked list is unchanged (the gateway, assistant, MCP and v1 ingest stay
    blocked; /graphql stays open, FR-OBS-33)."
  - "FR-OBS-9 residual list (review round 1, non-blocking) is restated: (1) MLflow's UI JavaScript runs on 8443
    with the owner's session through the gate, so a flaw in it can call any open MLflow route as the owner: the
    blocked list, no CORS and the read-only Jaeger site bound it; (2) a comment the owner types in MLflow is stored
    as typed (owner note); (3) `/health` ignores --allowed-hosts (round 10); (4) MLflow logs a 500 for an empty
    /graphql body; (5) a soft-deleted Run keeps its rows (lifecycle stage `deleted`) because reader never runs
    `mlflow gc` (FR-OBS-31)."
  - "Unbounded growth is declared and pruned: traces and compile/import Runs by retention_days, LoggedModels of
    unused version keys by retention_days, bench Runs and datasets kept (bounded by uploads: one Run and at most 40
    records each), Postgres `obs_bench_results` and `owner_labels` kept (the record), `obs_stack_status` keeps
    the newest row per member only; soft-deleted Run rows stay (no `mlflow gc`) and count in the store size."
  - "`tables` gains: `obs_bench_results` (FR-OBS-23; owner: true), `owner_labels` (FR-OBS-24; owner: true),
    `obs_stack_status` (FR-OBS-32; system: true, one row per member: member text pk, ok bool, detail text CHECK in
    an enum of probe outcomes, checked_at timestamptz), all in migration `obs_0002`."
  - "VEC-OBS-4 `trace_tags` gains `reader.material_sha256` (the import job's root key, so FR-OBS-20 (d) finds
    import traces by tag) and `reader.version_key` (FR-OBS-21 a)."
  - "FR-OBS-5's job root is skipped for kinds declared `traced: false` (only `obs.health`), so the 30-minute probe
    adds no trace."

