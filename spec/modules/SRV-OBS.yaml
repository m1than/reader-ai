kl_paired_changes:
  - { spec: SRV-SEARCH, task: V.kl-search-find, change: "opens FR-OBS-36's spans through reader.obs.find helpers; publishes the route ids (find_routes) and the loaded policy for policy_version; a card-text-by-id reader for FR-OBS-39/40/41 that applies B8 entitlement; the policy file declares `judge.find.sufficiency_threshold` and `judge.eval.<name>.pass_threshold` per judge.eval slot (initial values, hashed into policy_version), which FR-OBS-41's agreement and FR-OBS-40's queue read" }
  - { spec: SRV-AGENT, task: V.kl-agent-judges, change: "already planned there: slot names judge.eval.{relevance, sufficiency, groundedness, self_contained, citation_supports_claim} and judge.align on the eval line, JudgeInputsSink.copy(conn, request_row, output) inside the output transaction (SRV-OBS supplies reader.obs.judge_inputs.SINK), judge_version(slot, prompt_bytes) for SRV-OBS's files. To ask (the coordinator raises it): (1) `prompts/judge_find.md` becomes a fixed frame plus one instructions section between FR-OBS-43's delimiter lines, with SRV-AGENT's test that its production system prompt equals wrap(judge.find, section) byte for byte, and judge.find's input renderer puts all data in the user message with every `READER-INSTRUCTIONS` in a data value replaced by `READER_INSTRUCTIONS_DATA` (FR-OBS-43's rule; a unit case with both delimiter lines in a query and a card); (2) a `judge.find` call on the worker through the Provider port on line `eval` with a caller-given system prompt (only ever a wrap of that frame), thinking_off and abort_on_retry, not recorded to judge_outputs and not looked up there, plus a capability flag SRV-OBS reads; FR-OBS-41's judge.find half goes Red only after both are approved; (3) code review round 1: the lane passes the judge string (and the input hash) to `copy` instead of the sink reading the newest judge_outputs row of the transaction, and SRV-AGENT's `neutralise` replaces the token in every data value as FR-OBS-43 does (it replaces only on delimiter lines today)" }
  - { spec: SRV-EVENTS, task: V.kl-deploy-judge-lane, change: "catalogue gains kl_job_kinds (obs.eval, obs.eval_run, obs.eval_sample, obs.judge_score, obs.align; queue obs, the worker) and the periodic obs.eval_sample entry (off by default); judge_requests is unchanged" }
  - { spec: SRV-INGEST, task: V.kl-ingest-packs, change: "pack.build spans; its purge calls reader.obs.judge_inputs.purge_pack under the pack locks; a material text reader for the guard" }
  - { spec: SRV-KB, task: S7.SRV-KB, change: "link.run spans" }
  - { spec: OPS-DEPLOY, task: V.kl-deploy-judge-lane, change: "worker-judge on otel (FR-DEPLOY-3, VEC-DEPLOY-2: worker-judge–rotel allowed, worker-judge–mlflow never)" }
  - { spec: OPS-CLI, task: V.kl-deploy-judge-lane, change: "`reader obs proposals --out DIR` (owner-run): calls FR-OBS-42's export in a one-shot worker-image container, refuses a DIR inside a git work tree; `reader obs eval --set FILE --profile mcp|tutor`: calls reader.obs.eval.start with the instance owner as payer in a one-shot worker-image container and prints the eval id or the refusal code; the agent may run it within the eval cap and budget.live_runs_usd" }
  - { spec: WEB-MANAGE, task: V.kl-obs-spans, change: "FR-MANAGE-6: an owner tab 'Judges' on /settings over FR-OBS-40's routes and FR-OBS-24's judge labels (pass/fail, optional one-line note), batches of 25" }
  - { spec: WEB-UI, task: V.kl-obs-spans, change: "/observability: start an evaluation (set file picker, budget profile) through POST /api/obs/eval" }
  - { spec: SRV-AUTH, task: V.kl-obs-spans, change: "withdrawing `users.consent_evaluation` (when a route for it exists) calls reader.obs.judge_inputs.forget_queries(conn, user_id) in the same transaction: query NULL, labelable false" }

kl_open_points:
  - "1. ADR-0039's Rework row lists FR-OBS-14, -21..-24 only; FR-OBS-7, -8, -11, -12, -13, -15, -16, -20, -26 and VEC-OBS-6 contradict or must name the ADR's additions, so they are edited too (kl_in_place_edits)."
  - "2. Settled: `worker-judge` runs `reader-server --role worker` restricted to the judge.find queue, so FR-OBS-1 and the resource are unchanged (OPS-DEPLOY confirms in V.kl-deploy-judge-lane)."
  - "3. MLflow 3.18.0 storing a custom span type `ROUTER` over OTLP, and a cross-experiment dataset input, are not measured; the first Red [image] test pins both. If MLflow rewrites ROUTER, find.route falls back to UNKNOWN with this spec revised; the dataset has its declared fallback (FR-OBS-39 c)."
  - "4. Settled: B7a's no-regression evaluation runs through reader.obs.eval.start, called by the route (owner) or the paired OPS-CLI `reader obs eval` (agent or owner), inside the eval cap and budget.live_runs_usd."
  - "4a. FR-OBS-41's judge.find re-runs depend on SRV-AGENT allowing a worker-side judge.find call on line `eval` with a caller-given prompt, unrecorded (kl_paired_changes); until then step 0 refuses judge.find with slot_unsupported, judge.eval.* alignment works, and that half goes Red only after the SRV-AGENT change is approved."
  - "5. Caller `none` only: obs.eval measures retrieval with the question as the single query. B9's caller-model matrix (Haiku vs a strong model driving find/open, calls per answer) needs an agent loop with a declared {find, open} tool set (ADR-0025 rule 2, SRV-AGENT); `caller` admits only `none` until that paired change exists."
  - "6. judge_inputs follow `observability.retention_days` (default 30, ADR-0039's initial value) rather than a separate setting; alignment loses labels whose inputs expired."
  - "7. A hash of a short identifier or span is confirmable by guessing (FR-OBS-36 residual); ADR-0039 allows hashes, so no keyed hash is added."

