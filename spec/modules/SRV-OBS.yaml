owner_notes:
  - "The dashboard is a second origin, https://localhost:8443, not https://localhost/traces/ (ADR-0032): MLflow's UI then runs its JavaScript outside the app's origin, so a flaw in it cannot call /api/* with your session (the app's Origin check refuses it). Your existing passkey session is reused: browsers send the localhost cookie to every port, and the api checks it on every request to 8443."
  - "Turning tracing off: `observability: {enabled: false}` in reader.yaml, then `reader up`; rotel and mlflow are removed and the api and worker stop exporting. The traces volume stays until you delete it."
  - "What the traces never hold: book text, prompts, answers, notebook code or output, tokens, secrets, user handles. What they hold: route templates, job kinds and ids, lesson/run/question ids, stage names, model ids, token counts, cost, durations, status and error codes."
