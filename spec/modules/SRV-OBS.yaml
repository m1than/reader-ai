  obs_tracing: { system: true, columns: "started_at timestamptz pk, enabled boolean" }
  # Phase 2 (ADR-0038), migration `obs_0002`.
  obs_bench_results: { owner_id: true, columns: "id uuid pk, owner_id → users.id, digest char(64) UNIQUE, kind text CHECK in (search, tutor), set_name text, model text null, commit text null, scores jsonb, created_at timestamptz (FR-OBS-23)" }
  owner_labels: { owner_id: true, columns: "id uuid pk, owner_id → users.id, target text CHECK in (lesson, answer, judge) (judge added by migration obs_0003), target_id uuid (for a judge target: judge_inputs.id or obs_eval_scores.id), lesson_revision_sha256 char(64) (for a judge target: the judged input's sha256; the column keeps its name: what the owner saw), ok bool, reason text null CHECK in VEC-OBS-5 labels.reasons, slot text null (obs_0003; CHECK: NULL exactly when target <> 'judge'; a value of VEC-OBS-5 labels.judge_slots), note text null (obs_0003; judge targets only, ≤ 200 characters, one line), revision int ≥ 1, assessment_id text null, created_at, updated_at; UNIQUE (owner_id, target, target_id, lesson_revision_sha256), unchanged (FR-OBS-24)" }
