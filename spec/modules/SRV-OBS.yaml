# Test levels.
#   [unit]   pure Python with OTel's in-memory pieces and an in-test OTLP/HTTP receiver (no Docker): the allow-list
#            (FR-OBS-2, INV-OBS-1, Hypothesis), the middleware with a test app (FR-OBS-3, -4), the derived trace ids and
#            link parsing (FR-OBS-5, INV-OBS-4), the CLI environment builder and the uv.lock pin check against VEC-OBS-2
#            (FR-OBS-6 a), the gate's decision table over (Origin, X-Forwarded-Method, Sec-Fetch-Site/-Mode/-Dest,
#            session role) (FR-OBS-9, INV-OBS-5), the summary's percentile, scoping and join functions over rows
#            (FR-OBS-10), VEC-OBS-3's keys recomputed from its args with reader.jobs.model.idempotency_key and its
#            trace ids from FR-OBS-5's derivation (the gate for the fixture; trace-ids.mjs only generates), the
#            `truncated` flag shown when recent_keys_of hits its limit, the retention cutoff and the
#            next-day-first order (FR-OBS-11), the canary for our process (INV-OBS-2 first half), failure isolation
#            (INV-OBS-3: a failing exporter, and a tracer whose start, attribute or end call raises inside the
#            middleware). Code review round 1 added: an oracle of VEC-OBS-1 read from the YAML independently of
#            reader.obs.attributes (used by the INV-OBS-1 property test) with example rows at every bound; the gate's
#            remaining Sec-Fetch, OPTIONS and inexact-Origin rows; the regexp of FR-OBS-9 on its own. Round 2 added:
#            an upper-case traceparent is refused (W3C: lower-case hex only), and the retention handler takes
#            `enabled` and `retention_days` from `current_settings()`.
#   [db]     testcontainers Postgres (SRV-EVENTS' pinned digest): enqueue → run → retry → handler enqueue → sweep with a
#            capturing exporter (INV-OBS-4 end to end), the summary queries on VEC-OBS-3 (FR-OBS-10; the fixture's ISO
#            times are seeded as timezone-aware datetimes), the gate route on real sessions (FR-OBS-9).
#   [config] OPS-DEPLOY's rendered-model tests for the paired services, networks, ports and env (FR-OBS-8, INV-OBS-5),
#            and `caddy adapt` of the Caddyfile: both sites' upstreams, the handle order, every blocked pattern, the
#            header_up/header_down removals and the 8443 CSP (FR-OBS-9).
#   [image]  opt-in READER_TEST_IMAGE_BUILD=1: rotel and reader-mlflow:local start healthy under the compose
#            hardening; a span sent to rotel is returned by MLflow (FR-OBS-8); retention against real MLflow: a trace
#            ingested with a 40-day-old timestamp is deleted by the handler and a fresh one stays (FR-OBS-11, measured
#            in spikes/obs-stack round 2); the Caddy + gate + echo upstream case of INV-OBS-5 (no Cookie or
#            Authorization upstream, no Set-Cookie or Access-Control-* down; every blocked path of FR-OBS-9, deep,
#            upper-case, with repeated slashes and with an encoded slash, answers Caddy's empty 404); the CLI canary of
#            INV-OBS-2 and
#            FR-OBS-6 (b) in server/tests/obs/cli_canary/ (no network, stub upstream, zero credit). The backend
#            tests' internal networks take explicit subnets 10.233.<n>.0/24 (random n per network, a new n on an
#            overlap), because Docker Desktop's predefined pools run out (measured 2026-11-24); nothing else in the
#            repository or on the owner's Docker uses 10.233/16. The ingest check reads the spans of
#            `GET /api/3.0/mlflow/traces/get` at `trace.spans` (MLflow 3.18.0's response, measured 2026-11-24);
#            span attributes come back as OTLP values, a JSON object such as `mlflow.llm.cost` as a kvlist
#            `{values: [{key, value: {double_value}}]}` (measured on the V.obs-analytics image run), which the
#            FR-OBS-12 image test decodes. The V.obs-analytics image tests (test_images_analytics.py) use images by id
#            and allow MLflow 180 s to turn healthy (over 60 s was measured on a loaded Mac). Phase 2: the hardened
#            migrate test (test_images_migrate.py: uid 10004, read-only rootfs, --network none, the volume the only
#            writable path, previous pin MLflow 3.10.0 by digest) is the first; the no-egress probe and the opt-in
#            burst test (READER_TEST_BURST=1) are [image] too.
#   [live]   `bash e2e/live/obs.sh --out DIR [--with-credit]` against `reader up` (e2e/live/lib/obs_live.py, run
#            as `python -I`, and obs_browser.mjs, which finds the summary's trace links by the exact name `Trace`:
#            the page's "traces dashboard" link also contains it, live check 2026-11-24). It is run by hand until the stage-2 live check script
#            (`e2e/live/stage-2.sh`, docs/roadmap.md) exists; that script will call it. DIR is resolved and checked to
#            lie outside the repository before anything is created. Sessions: one owner and one live-check learner
#            row, each created and deleted by its id hash only (each statement must report exactly one row), through
#            the live library's `docker compose exec -T postgres psql` helper (the script itself runs no `docker
#            exec`); it never runs OWNER_RESET_SQL and never touches the owner's passkeys or other sessions. Caddy's
#            public root is read the way `reader trust` reads it and is never trusted system-wide. Zero credit by
#            default: 8443 answers 401 without a cookie, 403 for a learner, 2xx for the owner; the INV-OBS-5 Origin,
#            method and Sec-Fetch cases; FR-OBS-9's blocked paths (deep, upper-case, repeated slashes) answer
#            Caddy's empty 404; no Set-Cookie or Access-Control-* and the CSP on 8443; the summary is refused to a
#            learner; the first 20 summary trace ids (FR-OBS-10) each open an existing MLflow trace. In the browser
#            (Playwright, real Chromium over TLS): a trace link on /observability opens https://localhost:8443 with
#            the span tree; the newest trace from MLflow's own traces/search (request traces exist at zero credit)
#            gives the detail page, its CSP and one UI write (an assessment note saved; the probe's assessments are
#            then deleted through MLflow's REST whatever happened); no CSP violation anywhere. A check that cannot
#            run on the stack's data (the link click when the summary gives no trace id) prints SKIP, counted apart
#            from the passes. `--with-credit` (off by default; spends Agent SDK credit; the canary question stays in
#            the owner's tutor history): within NFR-OBS-1 a `job tutor.answer` trace with each link of the chain job →
#            agent.call → claude_code.interaction → claude_code.llm_request; the CLI's span names, attribute keys
#            (MLflow's own `mlflow.*` keys aside) and the trace's resource keys (MLflow keeps them as trace tags; the
#            CLI's and FR-OBS-1's allowed) within VEC-OBS-2 (FR-OBS-6 c); the canary absent from the trace JSON. The
#            live stack has no stub provider, so those checks need real credit; without it, the nesting against a
#            stub upstream is covered by the [image] CLI canary and [db] propagation tests (declared, live check
#            2026-11-24).
