# SRV-OBS — tracing, the trace dashboard and the owner's observability page (stage 2, task S2.SRV-OBS).
#
# Owner request, 2026-11-24: "the tracing system via dashboard for this system".
#
# What it is:
#   - in-process tracing for the api and worker roles: one span per HTTP request and WebSocket session (route
#     template only), one trace per job (linked to the span that enqueued it), one span per agent call with tokens and
#     cost; the Agent SDK's bundled CLI nests its own spans under that agent span through TRACEPARENT;
#   - one exporter that rebuilds every span against a declared allow-list (VEC-OBS-1), so book text, prompts,
#     answers, secrets, tokens and handles cannot become span names, attributes, events or status messages;
#   - Rotel (collector) and MLflow (trace backend and UI) in Compose profile `observability`, on internal networks,
#     with MLflow's store on its own volume (ADR-0032);
#   - the MLflow UI at https://localhost:8443/, owner-only through a Caddy `forward_auth` to the api, which also checks
#     the request's Origin (ADR-0032);
#   - an owner page fed by `GET /api/obs/summary`, computed from reader-ai's own tables, for the four views MLflow
#     cannot express (FR-OBS-10);
#   - retention: a daily job deletes traces older than `observability.retention_days` (default 30).
#
# Complex areas (AGENTS.md): OTel context propagation, auth and sessions, secrets. Full deep-reviewer rounds until
# approve before `approved`.
#
# Evidence (all zero credit):
#   - spikes/trace-backend (2026-11-20): MLflow 3.18.0 minimal (`--workers 1`, job execution off) and Phoenix 22 both
#     nest reader.stage → claude_code.interaction → claude_code.llm_request; MLflow idle 372–581 MiB (581 at the
#     first start); Rotel 8–41 MiB.
#   - spikes/cli-otel-content (2026-11-24): under SRV-AGENT FR-AGENT-6's exact CLI environment (DISABLE_TELEMETRY=1
#     and CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 included) the bundled CLI 2.1.330 (claude-agent-sdk 0.2.187) still
#     exports its trace spans; they nest under our span; with the content flags unset or set to 0 no prompt, system
#     prompt, response or credential canary reaches the OTLP receiver; the positive control (OTEL_LOG_USER_PROMPTS=1)
#     finds the prompt canary. CLI spans carry tokens but no cost. Measured against a stub upstream with a fake
#     credential; keys under the owner's real account are not yet measured (the [live] step covers them).
#   - spikes/obs-stack (2026-11-24), round 1: Rotel → MLflow hardened (non-root, read-only root, cap_drop ALL) on
#     SQLite and on Postgres over an 8-minute lesson replay plus a 10,080-span bulk; Caddy forward_auth to a stub gate;
#     927 bytes per span; deletion. Round 2: the gate's Origin rules, header stripping, MLflow's credentialed CORS for
#     any localhost Origin (the threat), text/plain bodies (400), retention with a real cutoff, the blocked-path bug in
#     the round-1 Caddyfile, and a headless-browser pass for the UI's CSP and the deep link. Numbers in its RESULT.md
#     and in `bounds`.
#
# ADR status: ADR-0018 (agent bus and traces) and ADR-0032 (this module's deployment, accepted with ADR-0018 by the
# owner on 2026-11-24): MLflow keeps its own SQLite volume instead of ADR-0018's "one server on our Postgres", and
# ADR-0032 amends ADR-0025 rule 5 (the worker reaches mlflow, for retention only). ADR-0011 (proposed), ADR-0012
# (proposed), ADR-0024, ADR-0025 and ADR-0026 (accepted) bind as written.
#
# Deviations from the roadmap row (docs/roadmap.md stage 2, SRV-OBS), declared:
#   - "structlog JSON": not added. Log lines keep reader-server's one-line `key=value` format (SRV-AUTH serving_logs)
#     and gain ` trace=<32 hex>` (FR-OBS-4); no new dependency. JSON logs are deferred until a log backend exists.
#   - "metrics registry where later stages declare their stage metrics": deferred. The owner's views come from
#     reader-ai's own tables (FR-OBS-10); OTel metrics export stays off (ADR-0018 rule 1: the ledger and run records
#     never come from telemetry).
#
# SRV-EVENTS is read as origin/V/slice-integration has it (cc6f300 and later): FR-EVENTS-17 publishes
# `dead_error_code_of` and states that no module queries `job_keys` directly, so FR-OBS-10 reads key rows only through
# the paired FR-EVENTS-18 functions.
#
# Paired changes (listed in `paired_changes` below as designed) are applied in their own specs with their tests:
# OPS-DEPLOY FR-DEPLOY-13 and VEC-DEPLOY-2, OPS-CLI FR-CLI-22, SRV-CONFIG FR-CONFIG-17, SRV-AUTH FR-AUTH-33, SRV-EVENTS
# FR-EVENTS-18/-19, SRV-AGENT FR-AGENT-14, WEB-UI FR-UI-18, and the OPS-DOD operation `obs.view`.
#
# The default `observability.enabled: true` follows the owner's request; it costs about 1.25 GiB of memory limits
# (mlflow 1g, rotel 256m) and two image pulls.
#
# ADR-0039 revision (V.kl-obs-spans), drafted 2026-11-26, promoted at Red on V/kl-obs-spans (deep-reviewer round 8
# VERDICT approve): FR-OBS-36..43, INV-OBS-6..8, VEC-OBS-7/-8 and the new tables are in `requirements`,
# `invariants`, `vectors` and `tables`, and the in-place edits are appended to their ids with their tests (H2), as
# phase 2 did. The remaining `kl_*` keys near the end of this file are the design record.

id: SRV-OBS
title: Tracing with an attribute allow-list, Rotel and MLflow behind an owner-only gate, retention and the owner's views
# Approved with Red on V/obs-impl (from V/slice-integration 04b2563), with the `obs.view` operation and the paired
# items applied: OPS-DEPLOY FR-DEPLOY-13, OPS-CLI FR-CLI-22, SRV-CONFIG FR-CONFIG-17, SRV-AUTH FR-AUTH-33, SRV-EVENTS
