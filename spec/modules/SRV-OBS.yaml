      dashboard lists `verify.lab`. [unit, image]
  - id: FR-OBS-16
    text: >-
      Every tab of MLflow 3.18.0's GenAI experiment UI, and what reader-ai puts there (measured before and after in
      spikes/obs-stack round 4, results/20261124T105821-round4-tabs/tabs/): Traces — FR-OBS-12's types, tokens,
      previews, tags, names; the execution timeline ("Show execution timeline", narrow; ADR-0033 offers
      Jaeger). Sessions (Traces/Sessions switch) — FR-OBS-12 (e). Dashboard › Usage — counts, latency p50/p90/p99,
      errors, tokens with the cache split, cost = the ledger's per-call amounts (FR-OBS-12 c). Dashboard › Quality —
      FR-OBS-14. Dashboard › Tool calls — FR-OBS-13's TOOL spans. Prompts — FR-OBS-15. Overview — MLflow's onboarding guide; stays as is.
      Empty, with reasons: Issues (LLM-based issue detection: credit and a provider key in MLflow); Judges and
      Evaluation runs (server-side judges and scorers run as MLflow jobs, and FR-OBS-8 sets
      `MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false`; LLM judges would also spend credit, and code scorers' docker
      executor would need the Docker socket, which ADR-0025 and ADR-0032 keep away from every container; the owner
      may run code scorers locally with `mlflow.genai.evaluate` over exported traces, not built);
      Review (labeling queues need text to label, and traces hold none: the content mode of ADR-0034 was rejected,
      2026-11-24); Datasets (evaluation records need inputs and
      expectations as text; an ids-only dataset has no use in the UI); Agent versions (needs logged models and
      `mlflow.modelId` trace metadata, which an OTLP client cannot set; not measured further); Playground and AI
      Gateway (provider keys and egress; their routes are blocked at the edge, FR-OBS-9). Saved views:
      /observability links ready-made dashboard views; measured that the traces tab's URL carries only `q` (full text
      over span content), `groupBy`, `startTimeLabel`/`startTime`/`endTime` (its filters live in local view state; a
      `filter=` URL showed all rows): dead jobs `?q=dead`, a stage `?q=<stage>`, an error code `?q=<code>`, tutor
      answers `?q=job%20tutor.answer`, sessions `?groupBy=session`, and the Usage, Quality and Tool calls dashboards
      (`#/experiments/0/dashboard/usage|quality|tool-calls`). "Slowest first" has no working URL in 3.18.0
      (`sort`/`dir` did not reorder); the Usage dashboard's latency percentiles stand in. [image, live]
  - id: FR-OBS-17
    text: >-
      Cost per lesson (owner, 2026-11-24: "pricing of each lesson in traces and other data"). In MLflow (measured,
      round 4): the traces table has a Cost column (Display › Columns › Cost; shows each trace's ledger cost after
      FR-OBS-12 c) and tag columns such as `reader.lesson.id`, but it cannot sort by cost (Sort
      offers only Time, Duration and State; the column's menu offers only "Hide column"); the trace metrics API
      groups span cost only by `span_model_name` or `span_model_provider` (a tag dimension is refused with 400) and
      has no trace-level cost metric; a `trace.tag.\`reader.lesson.id\` = '<id>'` filter works on span cost (0.88 and
      0.67 for the two seeded lessons, equal to their ledger sums). So MLflow shows a lesson's traces and their costs
      (saved view `?q=<lesson id>`: 5 of 10 traces, exactly that lesson's; FR-OBS-16), and the ranking lives in
      reader-ai. FR-OBS-10 gains a fifth view, (e) `lessons`, from the ledger, owner-scoped, over the window. Spend
      is grouped by `agent_spend.lesson_id` (SRV-AGENT writes it on every reserve, settle and void of a call that has
      a lesson; review, non-blocking): ONE grouped query over the owner's `agent_spend` rows created in the window
      with a non-null `lesson_id`, grouping by (lesson_id, run_id, task = 'tutor'), where a group's amount is
      spent(·) of FR-AGENT-9 over its rows: `settled_usd` of settle rows plus `usd` of reserves with neither a settle
      nor a void. So open reserves (a call killed before its settle) count, in compile and tutor alike, and a voided
      reserve counts 0; the page says so ("includes N open reserves" from the same query's count). Per lesson:
      `compile_usd` = the sum over its non-tutor groups (failed attempts and abandoned runs included), `runs` = the
      number of distinct non-tutor run ids, `last_compile_usd` = the amount of the run whose newest row is newest,
      `tutor_usd` = the sum over its tutor groups, `total_usd` = compile_usd + tutor_usd, `open_reserves` = the count
      of open reserves. Then one query for the lessons' and courses' ids and titles (`lessons.owner_id` = the caller;
      this page may show titles, MLflow never gets them), and one for source lengths: `sum(char_length(s.text))` of
      the `material_spans` rows SRV-PIPELINE's `DbSpanReader` loads for the lesson (its `course_plans` row's material
      and pages pdf_first..pdf_last), joined through `materials` with `materials.owner_id` = the caller and
      `course_plans.owner_id` = the caller (owner scope on the length too; review, non-blocking); the database
      returns the number only. `usd_per_1k_chars` = total_usd ÷ (chars ÷ 1000), null when chars is null or 0 (no
      division by zero). `mlflow_url` = `https://localhost:8443/#/experiments/0/traces?q=<lesson id>`. Rows: at most
      200 lessons, those with the largest `total_usd` (ties by lesson id), with `truncated` true when more exist; a
      course total row per course over the returned rows (`usd_per_1k_chars` over their summed non-null lengths).
      No text column but the two titles is returned. Spend on a lesson id with no `lessons` row of the caller (the
      lesson was deleted) is kept as a row with `title`, `course_id` and `course_title` null and `deleted` true
      (every other row has `deleted` false), so the rows' totals equal the ledger's; the page shows it as "deleted
      lesson", and it joins no course total (code review round 1). A soft-deleted lesson (SRV-LESSON FR-LESSON-20:
      `lessons.deleted_at` set) or a lesson of a soft-deleted course (`courses.deleted_at` set) counts as deleted the
      same way: its title is never returned, the page shows "deleted lesson", its spend stays in the totals
      (management code review, 2026-11-24; [db] a test tombstones one lesson, then its course, and expects those
      rows deleted with the same total). The page sorts the rows by any column
      (client-side; default total_usd descending). VEC-OBS-3 gains a lesson whose run has a failed paid attempt (a settle row on an
      attempt whose job ended failed) and an open reserve, so `compile_usd` counts both, a voided reserve (counts 0),
      an open reserve and a settle row created before the window (both excluded: the query filters on
      `agent_spend.created_at`, so a reserve opened before the window counts nowhere in it),
      a second lesson with tutor spend only and no source (null per 1k chars), a lesson with 0 source characters
      (null), another owner's lesson (absent), a second owner who imported the same book (same material sha256)
      with their own spans, which must not change the first owner's chars, a lesson with two compile runs
      (`last_compile_usd` = the newer run's), a deleted lesson's spend, and the expected `lessons` JSON; a [db] test
      also sets the row limit to 1 and expects `truncated` true. [unit, db, live]
  - id: FR-OBS-14
    text: >-
      Under ADR-0035 (accepted 2026-11-24: the worker's assessment and prompt writes to MLflow). Code-sourced
      assessments (MLflow "Quality" dashboard; deterministic outcomes we already compute, never an LLM judge, zero
      credit). The catalogue is data: VEC-OBS-4 `assessments` (name, value type or enum, metadata keys with ranges,
      `source_id`): `fact_check.passed` bool {claims, supported}; `verify.passed` bool; `verify.lab_passed` bool
      {cells, cells_ok}; `tutor.citations_valid` bool {total, valid}; `tutor.citation_share` float 0..1. Freshness is
      not in this revision (review, non-blocking): its assessment is proposed with the freshness spec. The POST body
      is built only by `reader.obs.feedback.body(name, value, metadata)` from that catalogue: `assessment_name` =
      name, `feedback.value` = the value after its rule, `source` = {`source_type`: CODE, `source_id`: the entry's},
      `metadata` = the entry's keys only, each a decimal string within its range, `trace_id` = `tr-<FR-OBS-5 trace
      id>` (MLflow requires it in the body), no `rationale`, no other field; a name, value or metadata key outside
      the catalogue raises before any request. `record` checks the catalogue before it enqueues and, with tracing
      off, returns without enqueueing (code review round 1). Job kind `obs.feedback` (declared
      in `reader.obs.jobs` with SRV-EVENTS' `JobKind`): args {job_id, key, name, value, metadata} (the metadata
      travels in the args, so a retry posts the same body); idempotency key [job_id, name]; `max_attempts` 3 with
      SRV-EVENTS' delays (5 s, 25 s); `timeout_s` 30; the HTTP client timeout 10 s. The code that computes the
      outcome enqueues it with `schedule_in` 60 s (NFR-OBS-1's 30 s plus margin), inside its own try/except: an
      enqueue failure is logged (`obs feedback_enqueue_failed name=<name>`) and never changes the job's outcome or
      result. The run: with tracing off it ends without a request; otherwise it first GETs the trace
      (`…/mlflow/traces/tr-<FR-OBS-5 trace id>`) and ends without a request when an assessment with the same name and
      `source_id` exists (idempotent across retries and a lost response); then it POSTs `…/assessments`. A 404 from
      either call is transient (raised as a `transient` type) while attempts remain; on the last attempt a 404 ends
      without a request with the log line `obs feedback_no_trace name=<name>` (INFO after the GET, WARNING when the
      POST answered 404: the trace existed and then went away), not `dead` (a trace that never
      arrived, e.g. tracing turned off in between, is not a failure of the job); other HTTP errors and timeouts are
      transient; a 4xx other than 404 raises `FeedbackRefused` (the key ends `dead` with that class name). "Ends
      without a request" means the handler returns, so the key ends `succeeded`: SRV-EVENTS gives a handler no
      `skipped` outcome (Green, 2026-11-24). Paths: GET `/ajax-api/3.0/mlflow/traces/get?trace_id=tr-<id>`, POST
      `/ajax-api/3.0/mlflow/traces/tr-<id>/assessments` (the spike's). Measured: 8 of 8 created; the Quality dashboard showed a
      summary row, counts and averages per name, and per-value bars. [unit, db, image]
  - id: FR-OBS-15
    text: >-
      Under ADR-0035 (as FR-OBS-14). Prompts tab: our own static prompt templates, never book text, listed as data in
      VEC-OBS-4 `prompts` (name → file: the four stage instruction files under `server/src/reader/pipeline/prompts/`
      and the tutor's `server/src/reader/tutor/prompts/answer-v1.md`; FR-PIPELINE-3's runtime system prompt is the
      rendered book source plus these, and only the static file is registered). A job kind `obs.prompts` (args
      {version: the package version, digest}; key [digest], where digest = sha256 of the templates' sha256s in
      VEC-OBS-4 order joined with the worker's start day (UTC, YYYY-MM-DD), so changed templates register at the
      next start and a key that ended dead, e.g. MLflow down at start, is retried by the first start of the next
      day; registration is idempotent by sha, so a repeat is harmless (code review round 1); `max_attempts` 3,
      SRV-EVENTS' delays) is enqueued by the worker's start hook (SRV-EVENTS
      FR-EVENTS-1 hooks: enqueue-only, so registration never blocks the worker's start; a failed enqueue is logged
      and the next start retries) and by every daily `obs.retention` run with that day's digest (code review round
      2: a worker that runs for days without a restart still retries a dead key and registers changed templates;
      the same day's key is a no-op, and a failure to enqueue never changes retention's outcome). Per file: the version is looked up by sha (`search` of the prompt's versions,
      filtered by the name AND the version tag mlflow.prompt.is_prompt = 'true', for tag `reader.prompt_sha256` = the
      file's sha256; without the prompt tag in the filter MLflow 3.18 returns no prompt version, so every start
      would create a new one: found by the [image] test, code review round 1); only when none matches is a version created, with tags
      `reader.prompt_sha256` and `reader.version` (the package version; the image has no git sha). The body is the
      file's bytes; INV-OBS-2's canary covers it (no book text, secret or run token can be in a static file; a unit
      test also runs the secret scanner over each file and refuses a `{{…}}` placeholder that a renderer would fill).
      With tracing off the run ends without a request. The worker reads the stage → version map from MLflow on demand for
      FR-OBS-18 (linked prompts), cached per process: the handler fills the cache with every version it registers or
      finds; a lookup (timeout `LOOKUP_TIMEOUT_S` = 2 s) caches a found version for the process and a miss or a
      failure for `MISS_TTL_S` = 600 s, so a job never waits on MLflow more than once per name per 10 minutes; an
      unknown version links nothing. Measured: 3 prompts
      registered, listed with their tags, and "1 linked prompt" on a trace. [unit, image]
  - id: FR-OBS-18
    text: >-
      Under ADR-0035 (with FR-OBS-15; split out of FR-OBS-12 (g), review round 3). Linked prompts: the root's
      `mlflow.traceTag.mlflow.linkedPrompts` = `[{"name": "reader.<stage>" or "reader.tutor", "version": "<n>"}]`,
      derived by the exporter from the root's `reader.stage` or job kind and a validated `reader.prompt.version` (int
      1..100000; VEC-OBS-4 `linked_prompts`). [unit, image]
  - id: FR-OBS-19
    text: >-
      A Jaeger waterfall view beside MLflow (ADR-0033, accepted 2026-11-24; paired OPS-DEPLOY and OPS-CLI changes).
      Service `jaeger` in profile `observability`:
      `jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e`,
      user 10006, `read_only`, tmpfs `/tmp`, `cap_drop: [ALL]`, `no-new-privileges`, `mem_limit` = `memswap_limit` =
      256m, environment exactly `GOMEMLIMIT=200MiB`, command `--config /etc/jaeger/config.yaml` with the read-only
      file `deploy/otel/jaeger.yaml`: OTLP/HTTP receiver on 4318, in-memory storage with `max_traces: 450`, the query
      UI on 16686, telemetry metrics `none` (sizing in ADR-0033: 3.3 KB per full-key span, 72 spans per trace, 85 MiB
      idle). Retention is by count; Jaeger restarts empty. Rotel exports to both backends: `--exporters
      mlflow:otlp,jaeger:otlp --exporters-traces mlflow,jaeger` with `ROTEL_EXPORTER_MLFLOW_ENDPOINT=http://mlflow:5000`,
      `ROTEL_EXPORTER_MLFLOW_PROTOCOL=http`, `ROTEL_EXPORTER_MLFLOW_CUSTOM_HEADERS=x-mlflow-experiment-id=0`,
      `ROTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:4318`, `ROTEL_EXPORTER_JAEGER_PROTOCOL=http` (measured: the
      `ROTEL_OTLP_EXPORTER_<NAME>_*` form is not read). Networks: `jaeger-in` 10.230.5.0/24 with exactly rotel and
      jaeger, `jaeger-ui` 10.230.6.0/24 with exactly caddy and jaeger (both internal; checked unused like FR-OBS-8's
      subnets); jaeger is on no other network. Caddy serves `localhost:8444` (`tls internal`; published as
      `127.0.0.1:8444:8444` by `reader up`'s override only while the profile is active) with the same forward_auth
      (`header_up X-Reader-Site jaeger`), only GET and HEAD (any other method answers 405 at the edge: measured
      against the pinned image with no network, Jaeger 2.23.0 answers POST `/api/archive/<id>` (500, no archive
      storage) and POST `/api/transform` (200), every other non-GET route 404/405 or the SPA's 200; code review
      round 1), `/api/archive*` and `/api/transform*` answering 404 for every method, `reverse_proxy jaeger:16686`
      with FR-OBS-9's header removals, and the CSP of
      FR-OBS-9 except `script-src 'self' 'sha256-eoBUh2b2awnlKCd0fkQUIXAAxPdxWV4aIas48E/3hLU='
      'sha256-07X4W69Q7ST165IvjVZwZU+G34LWjkh2Xj2s9fMwqYQ='` and `base-uri 'self'`. `/observability` links each
      trace to `https://localhost:8444/trace/<trace id>` beside the MLflow link, labelled "Jaeger (recent traces
      only)" with the title "Jaeger keeps the newest 450 traces and starts empty after a restart; an older trace may
      have rotated out" (code review round 1). Tests: [config] networks, VEC-DEPLOY-2
      pairs (rotel–jaeger, caddy–jaeger, and jaeger never with api, worker, mlflow, postgres, embed, agent-proxy, mcp
      or a kernel), the 8444 site, its CSP and the X-Reader-Site headers; [image] jaeger starts under the hardening and
      receives a span through rotel; the inline-script hashes recomputed from the served index equal the configured
      ones; `max_traces` × 72 = 32,400 spans with VEC-OBS-2's full key sets stay under the limit with no OOM kill
      (`docker inspect`, `docker stats`, never `docker exec`), recording the fill's wall time, Jaeger's CPU and the
