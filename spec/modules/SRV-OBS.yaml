  # V.obs-mlflow-phase2 (FR-OBS-20..35): moved here from `proposed_requirements` at Red (V/obs-mlflow-phase2-impl,
  # ADR-0038 accepted by the owner 2026-11-25). Design: spikes/obs-stack rounds 6-13; design review rounds 1-7
  # (round 7, aedd89a, VERDICT approve; the verdicts are in docs/progress.yaml). Red order: FR-OBS-29's hardened
  # [image] test first (server/tests/obs/test_images_migrate.py). The invariants, NFR, vectors, test levels and
  # paired-change lists that stood here follow the last requirement now.
  - id: FR-OBS-20
    text: >-
      Experiment Runs for compile runs and imports (ADR-0038 Decision 1; job kind declared in `phase2_job_kinds`).
      When a compile run ends (finished, failed or dead; a resumed run that ends again ends again) or an import
      ends, the code that records the end enqueues `obs.runs` {kind: compile | ingest, id, end: n} with
      `schedule_in` 60 s, AFTER the transaction that records the end has committed and inside its own try/except
      (INV-OBS-3, extended: an enqueue failure is logged as `obs runs_enqueue_failed kind=<kind>` and never changes
      the run's outcome; paired SRV-PIPELINE FR-PIPELINE-18 and SRV-INGEST FR-INGEST-26). `end` is the run's count
      of recorded ends (1 for the first), so the key [kind, id, end] gives each end its own job and a retry of one
      end the same job. The handler holds the Postgres advisory lock `lock_id("obs.runs:<kind>:<id>")` for its whole
      run, so two ends of one run never write the same Run at once (the create race that would give
      `ObsRunsDuplicate`). The job, from VEC-OBS-5 `runs` only:
      (a) Searches experiment 0 for the Run tagged `reader.run_id` (or `reader.ingest_id`) = id (`runs/search`,
          `max_results` 2; two found → `ObsRunsDuplicate`, dead: only a Run created by hand or by a job that ran
          without the lock can cause it, declared).
      (b) None found: creates it (`runs/create`: name, start time = the run's start, tags `reader.kind` and the id
          tag).
      (c) While the Run is incomplete (no `reader.complete`; a new one included), the attempt logs only the params
          the Run lacks (`log-batch`: version_key, reader_version, `model.<stage>`), reading the Run's params from
          the `runs/search` answer of (a) (round 12: the answer carries them, and logging a lacking one is 200).
          Params are write-once (rounds 8 and 12: a different value is 400; the same value again is 200), so a
          Run's params are always those of its first end. Every attempt also logs the metrics at step = `end` (a second end re-logs the
          same keys at step 2, which MLflow keeps as history; round 8) and the tags `reader.outcome`,
          `reader.ends`, `reader.lesson.id`, `reader.course.id` and `reader.snapshot_at` = the time this job read
          the ledger. On a second end whose values differ, the tags and the metrics' latest values are the second
          end's and the params stay the first end's (a changed model or version key shows only in the tags of the
          job roots, FR-OBS-21, not in the Run's params; declared). The ledger snapshot is read once per job and
          never refreshed: a settle that lands after `reader.snapshot_at` shows at the next end only (declared).
      (d) Links the run's traces: `traces/search` in experiment 0 for `tag.reader.run_id` (compile) or
          `tag.reader.material_sha256` (ingest: the import job's root carries the material, not an ingest id;
          paired VEC-OBS-4 edit in `phase2_in_place_edits`) = the value, `max_results` 500 with `page_token`
          paging until no token remains, then `link-to-run` in batches of at most 100 ids (round 8: 120 in one call
          is 400; 100 + 20 linked all 120). Re-linking a linked trace is accepted (measured).
          An import has one end per job that writes its traces: end 1 when `ingest.import` succeeds, and end
          1 + n when its n-th `search.embed` succeeds (n = the ingest's `search_embeds` rows; paired FR-INGEST-26),
          so the embed's traces, which start after the import's end, are linked late, and that step's metrics
          carry `chunks` (code review of 8466329).
      (e) Ends the Run: `runs/update` with status and end time, then, LAST, `set-tag`
          `reader.complete` = `true`. Status: FINISHED for a finished run and an import; FAILED for a failed or
          dead run, whose end time is the newest `finished_at` of its step keys (a failed run has no
          `finished_at`); KILLED with `reader.outcome` = `cancelled` for a cancelled run (FR-PIPELINE-20; its end
          is counted by the cancel, paired FR-PIPELINE-18). A Run whose `reader.complete` is missing (a job that
          died between (b) and
          (e)) is incomplete: the next attempt or end finds it in (a) and redoes (c)-(e), so an incomplete Run is
          completed, never duplicated.
      (f) Metrics, from the snapshot: compile as VEC-OBS-5 `runs.compile.metrics` (the ledger's keys); import
          `pages` (the material's page count), `spans`, `chunks` (the ingest's `search_chunks` rows),
          `import_s` (the `ingest.import` key's `finished_at` − `created_at`) and `pages_per_min_import`
          (pages ÷ import_s × 60; left out when import_s is 0). Each lookup is scoped to the ingest's owner.
      Every value is an id, an enum, a model id from pricing.yaml, a sha256 or a number. A failure is logged by
      code and never changes the run's outcome. With tracing off the job ends without a request. An MLflow that is
      down for longer than the job's 3 attempts (SRV-EVENTS' 5 s and 25 s delays, about 90 s with the timeouts)
      makes the job dead: that end's Run stays missing or incomplete until the run's next end (declared; the dead
      job shows on /observability's failures). Why experiment 0 (spike round 7): a Run in its own experiment
      accepted the link, but its Traces tab showed "No traces found", because the UI searches only the Run's own
      experiment (the client's run-scoped search refuses with "Run … belongs to experiment 1, which is not in the
      list of locations"). In experiment 0, the Run's Traces tab lists its traces with their assessments (round 6).
      Bench runs go to their own experiment (FR-OBS-23), so experiment 0's Evaluation runs tab lists only compile
      and import Runs, which can be filtered by `tags.reader.kind`.
      Known limit (declared, code review of 8466329): VEC-OBS-5's patterns for the code-sourced params
      `reader_version` (`^[0-9A-Za-z.+-]{1,64}$`) and the bench's `hf_model` model names are shapes, not
      allow-lists (a pricing.yaml `model` is an enum), so a bare canary of that shape (letters, digits, dashes)
      passes them; INV-OBS-2's phase 2 clause holds because these values come from the package version and the
      owner's own bench result file, never from material, questions or answers, not because the pattern would
      refuse a canary.
  - id: FR-OBS-21
    text: >-
      Agent versions. A version key is the sha256 of the canonical JSON of {prompt_set_sha256, stage_models,
      pipeline_config_sha256}:
      - prompt_set_sha256 is the sha256 over FR-OBS-15's registered templates, by name;
      - stage_models maps each declared (task, stage) to its model;
      - pipeline_config_sha256 is the sha256 of the pipeline's declared stage table and caps.
      (a) OTLP: the worker computes the key once at start and passes its first 12 hex characters as the
          validated root attribute `reader.version_key` (VEC-OBS-1, pattern `^[0-9a-f]{12}$`). AllowListExporter
          derives `mlflow.traceTag.reader.version_key` from it (VEC-OBS-4 `trace_tags`), so traces filter and group
          by version.
      (b) ADR-0038 Decision 1: `obs.setup` (FR-OBS-26) creates one LoggedModel `reader-agent` per new key
          (`logged-models/search` by the tag `reader.version_key` first; none → `logged-models` create with the
          three inputs as params and the tag, then PATCH status `LOGGED_MODEL_READY`, round 10: without it the tab
          shows "Pending", round 8).
      The Agent versions tab lists versions with their params. OTLP cannot set `mlflow.modelId` metadata (measured),
      so the tab's own per-version trace list stays empty; versions are compared in MLflow only, through the
      Traces tab filtered by `tag.reader.version_key` (cost, latency and assessment columns). The api gains no
      per-version view (review round 1, B9).
  - id: FR-OBS-22
    text: >-
      Evaluation datasets (ADR-0038 Decision 1). VEC-OBS-5 `bench_sets` pins each committed bench set by ONE file
      and its sha256, with the records it may register (review round 1, B5):
      - `tutor-bench-v2`: spec/fixtures/SRV-OBS/bench-tutor-v2.yaml, generated by compose-bench.mjs from
        questions-v2 with v03 replaced by t01 (VEC-TUTOR-7's replacement), 40 records, sha256 1ff4434c…6fce; CI runs
        `node spec/fixtures/SRV-OBS/compose-bench.mjs --check`, so the composed file cannot drift from its sources;
      - `search-bench-v1`: spikes/embeddings-local/questions.yaml without q04, q07, q08 and q13, 26 records.
      A record is pinned only if its question shares no run of 5 or more consecutive words with the pilot's text
      layer. The check (spikes/obs-stack/check_bench_quotes.py) is VERBATIM ONLY: on both sides NFC, pdfium's
      U+FFFE marker, U+00AD and line-end hyphens joined, lower case, ё→е, words only; a paraphrase that keeps the
      meaning is not detected, and the questions' own rules (the agent's wording, no key terms) are the guard for
      that. Round 8 (pdf sha256 61e8d4c3…, 247,927 words): bench-tutor-v2 longest run 4, v1 four records at 5
      (excluded), bench-fixed 1; the output records each set's and the PDF's sha256 and prints ids and counts
      only. A dataset record holds exactly `inputs` {question_id, question, chapter (an integer 1..23)} and
      `expectations` {gold_pages} (VEC-OBS-5 `dataset_record`). The question text is the agent's own committed
      wording, the only non-numeric content in phase 2. Shipped code never reads `spikes/`: the owner's upload
      (FR-OBS-23) carries the set file, which the api accepts only if its sha256 is pinned, and only the pinned
      record ids are registered (`datasets/records` upserts: a repeat updates, never duplicates; round 8).
  - id: FR-OBS-23
    text: >-
      Evaluation runs. The upload route records results; it NEVER starts a bench (no model call, no search, no job
      that asks anything; review round 1). `POST /api/obs/bench` is owner-only (FR-OBS-10's session and Origin
      checks), JSON at most 256 KiB, {set: <set file text>, result: <bench result object>}. Errors (body `{"error":
      code}`): 401/403 as FR-OBS-10; 413 `too_large`; 400 `set_not_pinned` (the set's sha256 is not in VEC-OBS-5),
      400 `bench_invalid` (the result's required `kind` (search | tutor) differs from the pinned set's kind, or the
      result fails VEC-OBS-5 `bench_results` for that kind: unknown key, pattern, enum or range, an id not in
      the set's registered records, an id twice, or no rows); 409 `already_recorded` (the same upload digest
      exists; known limit, declared in the code review of 8466329: the digest is UNIQUE across all users, not per
      owner, so a second owner uploading a byte-identical result gets 409 too; v1 has one owner, ADR-0012); 202
      {upload_id}
      otherwise. The route is used from /observability only (paired WEB-UI FR-UI-33: a file picker for the two
      files); there is no CLI command (review round 1, B10).
      The api stores the upload in Postgres table `obs_bench_results` (paired migration `obs_0002`: id uuid pk,
      owner_id, digest char(64) UNIQUE = sha256 of the canonical JSON of {set sha256, result}, kind search | tutor,
      set_name, model text null (pattern hf_model or a pricing.yaml model), commit text null, scores jsonb = the
      scores the api recomputes by code over the per-question rows whose ids are registered records of the set
      (the file's own aggregates, such as `recall_at_10`, `mrr` or `grounded_share`, are validated but never
      stored; review round 3, R4), created_at), which is the record (ADR-0038 Decision 4), and enqueues
      `obs.bench` {upload_id} in the same transaction (the outbox). The job, with tracing off ending without a
      request:
      (a) finds the experiment `bench`; missing → it calls FR-OBS-26's setup function inline (idempotent; it
          reads first, so a repeat makes 0 writes);
      (b) finds the pinned dataset by name in `bench` (`datasets/search`), creates it if missing, and upserts the
          pinned records (`datasets/{id}/records`);
      (c) finds a Run tagged `reader.bench_upload` = upload id (`runs/search`): found and tagged `reader.complete`
          → ends `succeeded` without a request; otherwise creates it (tags `reader.bench` = kind, `reader.bench_upload`)
          or reuses the incomplete one, logs the params that apply to the kind (search: model, chunk_chars,
          overlap; tutor: lesson_id, date, since a tutor bench has no model or chunking; both: set_sha256, and
          commit when the result has one; code review round 1 of phase 2) and the
          stored row's scores as metrics: search, from `per_question` over registered ids: hit@1, hit@3, hit@10,
          reciprocal rank (mean; an absent rank counts 0), and the per-question rank as a metric `rank` at step =
          the record's index; tutor, from the records file's per-question rows over registered ids (VEC-TUTOR-7's
          records: state, grounded, gold_cited, insufficient, wall_s, usd): grounded_share, gold_cited_share,
          insufficient_share, latency p50/p95 (nearest rank), mean_usd over costed rows, total_usd. While the Run
          is incomplete an attempt logs only the params it lacks (FR-OBS-20 c's rule); every value comes from the
          stored `obs_bench_results` row, which never changes, so a re-log can never differ;
      (d) logs the dataset as the Run's input (`runs/log-inputs`, the client's shape measured in round 8:
          source_type `mlflow_evaluation_dataset`, source {dataset_id}, tag `mlflow.data.context` = evaluation),
          ends the Run FINISHED and tags `reader.complete` last.
      Scores come from code over ids and page numbers: no model call, no judge, no `mlflow.genai.evaluate`
      (round 6: evaluate writes a client-side trace per row with its inputs, outside the allow-list, and exhausted
      the SQLite pool at default parallelism). A bench Run has no traces, so its own experiment loses nothing (round
      7: a separate experiment's Evaluation runs tab lists and charts its Runs' metrics). Each upload is a new Run,
      so `bench`'s Evaluation runs tab charts regressions from the earliest run to the latest (round 6; round 8
      shows the tutor bench Run there with its dataset). Because scores are recomputed from per-question rows,
      the tutor upload is the bench's records file (VEC-TUTOR-7's `tutor-bench-<UTC time>.json`), not the
      summary: paired SRV-TUTOR FR-TUTOR-15 gives that file a header (kind `tutor`, date, branch, commit sha,
      lesson_id, set `tutor-bench-v2`) above its records, numbers, ids, states and flags only; the committed
      summary (e2e/live/results/2026-11-23-tutor-bench.json) is migrated to the numbers-only shape of
      spec/fixtures/SRV-TUTOR/bench-summary.yaml (commit `66fba58`, prose keys dropped) and stays a report, not an
      upload (review rounds 1, 3 and 4). The 2026-11-23 run's records file was not committed, so the first tutor
      upload needs a new bench run (VEC-TUTOR-7: about 40 × $0.027 ≈ $1.10 at the measured mean), which spends
      Agent SDK credit from `budget.live_runs_usd` and waits for the owner's go-ahead like every live run
      (declared; phase 2 itself spends nothing).
  - id: FR-OBS-24
    text: >-
      Owner labels (ADR-0038 Decisions 2 and 3). Postgres is the record; MLflow gets a mirror. MLflow's labeling
      sessions are Databricks-only and its Review queues and label schemas show nothing on text-free traces, so
      neither is used (review round 1, B8; the round 6 queue was dropped).
      (a) The record: table `owner_labels` (paired migration `obs_0002`: id uuid pk, owner_id, target lesson |
          answer, target_id uuid (lesson id or question id), lesson_revision_sha256 char(64) (the lesson revision
          the owner saw: the lesson's current revision for a lesson label (`reader.lessons.store.current_sha256`,
          FR-LESSON-4, not `published_sha256`; '' when the lesson has no revision yet), the question's
          `revision_sha256` for an answer label), ok bool, reason text null CHECK in VEC-OBS-5
          `labels.reasons`, revision int ≥ 1 (the
          label's own revision), assessment_id text null (the mirror's), created_at, updated_at; UNIQUE (owner_id,
          target, target_id, lesson_revision_sha256)). A relabel of the same lesson revision updates the row and
          increments `revision`; a label on a newer lesson revision is a new row.
      (b) The route: `POST /api/obs/labels` {target, id, ok, reason?} is owner-only (FR-OBS-10's checks); body keys
          beyond these → 400 `bad_request`. Errors: 401/403 as FR-OBS-10; 404 `not_found` when the lesson or
          question is not the caller's (another owner's id is indistinguishable from a missing one); 400
          `bad_request` (unknown target, reason outside the enum, a non-bool ok). 200 {revision, mirror} otherwise,
          where `mirror` is `queued` (tracing on: `obs.label` {label_id, revision} is enqueued in the same
          transaction as the row) or `off` (tracing off: stored, nothing enqueued). A lesson or answer the owner
          can label has a job behind it, so there is no "label first, trace later" path (review round 2: the tutor's
          `no_trace` path is dropped); a trace that is missing anyway (tracing turned on later, or rotated out by
          retention) is FR-OBS-14's transient-then-no-trace rule, and the record stays.
      (c) The mirror: `obs.label` first reads the row: a job whose revision is below the row's current revision
          ends without a request (a newer relabel's job will post). It resolves the target's trace, exactly one row
          per label (code review round 1 of phase 2, B5): lesson: the compile run of the lesson (same owner) whose
          `final_sha256` equals the row's `lesson_revision_sha256` (the lesson's current revision when labelled,
          `reader.lessons.store.current_sha256`), the newest such run by (created_at, id); in it the `revise`
          stage's job, or the `draft` stage's when the run has no `revise` (a first pass that converged), the
          newest key by (created_at, job_id); a revision no compile run produced (edited by hand) has no trace, so
          the job ends without a request (logged `obs label no_trace`); answer: the question's `tutor.answer` job
          (newest by (created_at, job_id)); FR-OBS-5's derivation. A 404 from the GET or the POST follows FR-OBS-14's
          rule: transient while attempts remain, on the last attempt the job ends without a request (logged), never
          dead. It GETs the trace and looks for an assessment whose `assessment_name` is the
          label's and whose `metadata.revision` equals the job's revision: found → stores its id and ends (a retry
          or a lost response never posts twice). Otherwise it POSTs a HUMAN assessment (`owner.lesson_ok` |
          `owner.answer_ok`, source {HUMAN, owner}, value ok, metadata {lesson_id | question_id, reason, revision});
          for revision > 1 the body carries `overrides` = the stored assessment_id, so MLflow marks the previous one
          `valid: false` (measured round 8); it stores the new assessment_id. Free text never enters a label, on
          either side.
      The owner can still type a label or comment in MLflow's own trace view; that is the owner's own text in the
      owner's own store and is not read back (owner note).
  - id: FR-OBS-25
    text: >-
      Budgets and alerts. MLflow 3.18.0 has budgets only as AI-gateway policies: they count gateway traffic only
      (round 6: a GLOBAL USD policy kept `current_spend` 0.0 after priced OTLP traces), and an exceeded window
      fires a webhook from MLflow, which has no egress. The gateway is not used. /observability is therefore the
      alert surface: the summary gains `alerts`, a list of {code, subject, value, limit} (VEC-OBS-5 `alerts`)
      computed on each request from Postgres only (the api never reads MLflow):
      - `daily_spend_high`: per task (FR-AGENT-12's caps are per task), today's (UTC) spend of that task ≥ 80 % of
        its daily cap; subject = the task (`tutor`: SRV-TUTOR's daily cap), or `freshness` for the three
        freshness tasks summed against FR-FRESH-9's one daily cap (code review round 1 of phase 2);
      - `run_over_cap`: an open run's spend ≥ 80 % of its run cap; subject = the run id;
      - `dead_jobs`: dead jobs in the window > 0; subject = the kind;
      - `bench_regressed`: from `obs_bench_results` only, the newest upload's hit@10 (search) or grounded_share
        (tutor) is below the previous upload of the SAME (kind, set_name, model) by more than 0.05; subject =
        kind/set/model; no previous upload → no alert;
      - `obs_unhealthy`: FR-OBS-32 (from `obs_stack_status`), only while tracing is on: with tracing off
        nothing probes, so the rows are stale by design and raise no alert. A member alerts when its last probe
        failed or when `reader.obs.health.stale(checked_at, now, tracing_on)` (FR-OBS-32's one staleness
        rule) is true, with `tracing_on` from the api's `phase2.tracing_on()` (code review of 8466329;
        [unit] tracing off with an old row: none; tracing on with a row older than 75 minutes: one; a fresh
        row: none). The rows are read in a savepoint;
        a missing table reads as no rows, any other database error fails the request (it never reads as "no
        alert"). The store size alert is `reader doctor`/`status`
        output, not an api alert (FR-OBS-31; review round 2, N8).
      The page shows a banner per alert (paired WEB-UI FR-UI-33). A push notification waits for SRV-NOTIFY.
  # --- MLflow operations (owner, 2026-11-24: "production-ready"; rounds 9 and 10) ---
  - id: FR-OBS-26
    text: >-
      Declarative bootstrap (ADR-0038 Decision 5). `deploy/otel/mlflow-setup.yaml` (VEC-OBS-6, committed; proposed
      content in spec/fixtures/SRV-OBS/mlflow-setup.yaml; the worker reads it at the code constant
      `/etc/reader/mlflow-setup.yaml`, compose's read-only bind, when that file exists, else the package's copy,
      which a [unit] test keeps equal to the fixture) is the only source of MLflow's experiments (experiment 0
      renamed `reader`, and `bench`), their descriptions (`mlflow.note.content`) and tags, the dataset names, the
      LoggedModel naming and the Run tag keys (the trace tag keys stay VEC-OBS-4's only; the file does not restate
      them, review round 2, N5). Nothing is created by hand. Setup is ONE idempotent function, `ensure_setup()`:
      it reads MLflow's state (`experiments/get`, `get-by-name`, `logged-models/search`), compares it with the
      file and writes only the difference (`experiments/update` for a name, `set-experiment-tag` per missing or
      differing tag of every experiment the file names, an existing `bench` included, `experiments/create` with
      tags, FR-OBS-21 b's LoggedModel, and `PATCH logged-models/{id}` status LOGGED_MODEL_READY whenever the
      version's LoggedModel is not READY, a new one or one left PENDING by a setup that died after its create); a tag or experiment in MLflow that the file
      does not name is left alone and listed in the log line by key only. A repeat on the same UTC day makes 0
      writes (round 10: the state dump before and after a re-run is equal, `drift` false); the first run of a new
      day makes exactly one, FR-OBS-31's `reader.last_started` tag (round 12: `PATCH logged-models/{id}/tags`
      {tags: [{key: reader.last_started, value: <day>}]} answers 200, `logged-models/search` reads the day back,
      and a second PATCH with the next day replaces it). It runs (1) in the job `obs.setup` {digest},
      which the worker's start hook enqueues (enqueue-only, like FR-OBS-15; digest = sha256 of the file's canonical
      JSON, the version key and the UTC start day), and (2) inline, at the start of `obs.runs`, `obs.bench` and `obs.label` when the
      experiment they need is missing. So an `obs.setup` key that ended dead never blocks anything: the key only
      records that a start ran setup (review round 2, N2). With tracing off neither path makes a request.
  - id: FR-OBS-27
    text: >-
      Server settings, pinned in deploy/compose.yaml with a comment and a source each (paired OPS-DEPLOY
      FR-DEPLOY-15). Command: `mlflow server --host 0.0.0.0 --port 5000 --workers 1` (one uvicorn worker: SQLite has
      one writer, round 9's 8 concurrent writers had 0 errors with WAL), `--backend-store-uri
      sqlite:////var/lib/mlflow/mlflow.db`, `--artifacts-destination /var/lib/mlflow/artifacts`,
      `--default-artifact-root mlflow-artifacts:/` with `--serve-artifacts` (datasets and LoggedModel files go
      through the server, no direct-to-storage client), `--allowed-hosts localhost:8443,mlflow:5000,mlflow`, no
      `--cors-allowed-origins` (none allowed: round 9, a cross-origin request got no Access-Control-Allow-Origin),
      `--x-frame-options DENY` (the edge's frame-ancestors 'none' already holds; both), no `--static-prefix` (the
      8443 site is MLflow's own origin), no `--dev`, no `--expose-prometheus`, no `--app-name`. Environment, exactly:
      `MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false` (no job runner), `MLFLOW_DISABLE_TELEMETRY=true` and
      `DO_NOT_TRACK=true` (both read by 3.18.0's `is_telemetry_disabled`), `MLFLOW_ENABLE_AI_GATEWAY=false` (default
      true in 3.18.0; round 9: the gateway answers 501), `MLFLOW_ENABLE_REMOTE_ASSISTANT=false` (its default,
      pinned), `MLFLOW_MODEL_CATALOG_URI=` (FR-OBS-12 c). The assistant, jobs and MCP routes answer 404 (round 9)
      and the edge blocks them too (FR-OBS-9). Request sizes: the edge caps request bodies on 8443 at 10 MiB
      (`request_body max_size 10MiB`); the worker's own bodies are bounded by VEC-OBS-5 (an upload of 256 KiB at
      most); 10 MiB is structural (an MLflow UI write is a small JSON body; no artifact upload goes through the
      edge), not measured. `--allowed-hosts` (round 10): a foreign Host gets 403 on the API and 200 only on /health, which 3.18.0
      exempts. CORS preflight (round 10): 400 with `Access-Control-Allow-Methods` and `-Allow-Credentials` but no
      `-Allow-Origin`; the edge strips every `Access-Control-*` header downstream (FR-OBS-9), so none reaches a
      browser. The obs [image] tests start MLflow with exactly this command and environment (tests/obs/
      test_images.py `_backend`), so the image tests check the shipped flags.
  - id: FR-OBS-28
    text: >-
      Backend store: SQLite stays, in WAL mode, decided by measurement (round 9). Under 8 concurrent writers (the
      worker's job concurrency) doing runs/create, log-batch, update and assessments while OTLP spans stream in:
      WAL 1,280 requests, 0 errors, p50 0.027 s, p95 0.20 s, max 2.26 s; the default journal p95 0.43 s and 68
      answers of 404 for assessments posted before their trace was ingested (ingestion lagged). MLflow 3.18.0
      already sets `busy_timeout` 20,000 ms on every SQLite connection (mlflow/store/db/utils.py); WAL is set once
      by `mlflow-migrate` (FR-OBS-29: `PRAGMA journal_mode=WAL`, persistent in the file) and checked by `reader
      doctor`. Pool: SQLAlchemy's defaults (QueuePool 5 + 10 overflow) stay; round 6's pool exhaustion came from
      `mlflow.genai.evaluate`'s parallel client, which phase 2 never uses. Postgres is the documented way out when
      FR-OBS-35's limits are reached (one more container, its own volume and backup); not now. The artifact store
      is `/var/lib/mlflow/artifacts` on the same `obs_mlflow` volume.
  - id: FR-OBS-29
    text: >-
      Schema migrations on upgrade. A one-shot service `mlflow-migrate` (same image, same volume and hardening,
      `restart: "no"`); `mlflow` depends on it with `condition: service_completed_successfully`. Its command is a
      shell script of exactly these steps, all under an exclusive `flock /var/lib/mlflow/.migrate.lock` (so two
      concurrent `reader up` runs cannot migrate twice). Files, all in the volume: `store.version` (the MLflow
      version that last migrated the store), `backup/pre-migrate.db` and `backup/pre-migrate.version`,
      `backup/in-progress`, `backup/restored-for`, `backup/fresh`. Exit codes are mlflow-migrate's own (10..13,
      distinct from the restore command's 0..7):
      (0) if `backup/fresh` exists (an earlier first start of an empty volume was interrupted inside this script;
          design review rounds 5 and 6, G1 and H1), first run `mlflow db upgrade` on the file and, if it exits 0,
          go on to (4); only if it fails, remove `mlflow.db`, `mlflow.db-wal`, `mlflow.db-shm` and
          `backup/in-progress` and go on as a fresh volume. `fresh` exists only before the server has ever started
          on this volume (both initialisation paths below run inside this script and clear it in (4)), so the wipe
          can never hit a store that holds data. Otherwise, if `backup/in-progress`
          exists (a previous run died or failed in step 3 or 4 on a store with data), exit 10
          `obs_migration_incomplete` before anything else, naming `reader restore-obs-premigrate`: the backup is
          never overwritten while a migration is unfinished. If `backup/restored-for` exists and differs from this
          image's MLflow version, exit 11 `obs_restored_for_other_version`; if it matches, remove it and go on;
      (1) if `mlflow.db` does not exist, write `backup/fresh` and skip to (3); if `store.version` equals this
          image's MLflow version, skip to (4) (a normal start: no backup, no in-progress window);
      (2) take the one pre-migration backup through SQLite's backup API to `backup/pre-migrate.db` (replacing the
          previous one: exactly one is kept), and copy `store.version` into `backup/pre-migrate.version` (a store
          without `store.version` was made before this change by MLflow 3.18.0's own start, the only version reader
          shipped before it, so `3.18.0` is written; declared);
      (3) write `backup/in-progress`, then `mlflow db upgrade sqlite:////var/lib/mlflow/mlflow.db`; a non-zero exit
          stops here with exit 12 `obs_migration_failed`, leaving `in-progress` in place, so `mlflow` does not start
          and every later run stops at (0);
      (4) `PRAGMA journal_mode=WAL` (persistent; FR-OBS-28), write `store.version` = this image's MLflow version,
          remove `backup/in-progress` and `backup/fresh`, exit 0. A failure here exits 13
          `obs_migration_finish_failed`, with `in-progress` still in place. Declared: a crash in (4) on a store with
          data costs a restore (`reader restore-obs-premigrate`) and a second bump, although (3) succeeded.
      Fresh volume: step (3) on a missing file builds the schema from empty (measured, spike round 13: `mlflow db
      upgrade` on a missing file exits 0 with 71 tables at alembic head f4a9b2c7d1e6, a second upgrade is a no-op,
      and the server then serves /health 200; the hypothesis held for 3.18.0, and the [image] test keeps checking
      it for every pin). If a future pin breaks that, the fallback still runs inside this script, never in the
      server: on a missing file write `backup/fresh` and initialise the store with one Python call that
      constructs MLflow's own SQLAlchemy store, `python -c "from mlflow.store.tracking.sqlalchemy_store import
      SqlAlchemyStore as S; S('sqlite:////var/lib/mlflow/mlflow.db', '/var/lib/mlflow/artifacts')"` (round 13:
      the same 71 tables and head, then a no-op upgrade and health 200), then go to (4). The fallback is automatic:
      on a fresh volume the script tries `db upgrade` first and, if it fails, removes the half-made file and runs
      the Python call (Green: MLflow 3.10.0, the [image] test's N pin, fails `db upgrade` on a missing file with
      "no such table: metrics"); `READER_MLFLOW_MIGRATE_FALLBACK=1` skips the `db upgrade` try, for the test's
      forced-fallback case only. So `backup/fresh` is
      always cleared before the server's first start (design review round 6, H1). That first start is a
      migration too, and `reader doctor` prints `obs mlflow: fresh store, schema <revision>` after it.
      Manual restore after a failed migration, with the stack down: `reader restore-obs-premigrate` (paired OPS-CLI
      FR-CLI-24, its exit codes there) refuses unless `backup/in-progress` exists (a store that migrated fine is
      never rolled back by accident) or `--force` is given (a `--force` restore prints the version it rolls back to,
      from `pre-migrate.version`, before it copies anything; a missing or empty `pre-migrate.version` refuses with
      exit 7 before any copy, never restoring for an "unknown" version); it then copies `backup/pre-migrate.db`
      through the backup API into a temporary file in the volume, and only then removes any stale `mlflow.db-wal`
      and `mlflow.db-shm` and moves the copy over `mlflow.db` (a failed copy leaves the store whole), sets `store.version` from
      `pre-migrate.version`, prints that version, writes `backup/restored-for` holding it, and removes
      `backup/in-progress`. Then `mlflow-migrate` of any other version exits 11 at (0) until the image matches,
      so a newer image never re-migrates the restored file by accident. Going back to the old pin (reverting the
      image bump in deploy/compose.yaml) is the owner's own git action; reader does not change the pin. Why: a server stopped during its own first-start migration left the file
      half-migrated ("table _alembic_tmp_experiments already exists") and never started again (round 9); and
      3.18.0's server runs pending migrations itself at start (round 9: on a volume written by 3.10.0 it ran without
      an error until the test's 60 s limit, so it does not refuse an old schema), so without the one-shot every
      first start after a bump is that window. Test [image], the FIRST Red test of phase 2 (it pins the riskiest
      behaviour before any code): under the service's own hardening (non-root uid, read-only root filesystem, only
      the volume writable), a volume written by the previous pin is started by the new pin through
      `mlflow-migrate`; it serves its data, `pre-migrate.db` exists and opens, `store.version` names the new
      pin; two `mlflow-migrate` started at once serialise on the `flock` (the second waits, then finds nothing to
      upgrade); a second run is a no-op upgrade. With named versions N (the previous pin) and N+1 (the new one): a
      volume written by N whose step (3) under N+1 fails (forced by a read-only file or an injected failing
      upgrade) exits 12; a second N+1 `mlflow-migrate` exits 10 and leaves `pre-migrate.db` byte-identical
      (sha256 before and after); `reader restore-obs-premigrate` exits 0 and prints N; then N+1 exits 11 and N
      starts and serves the data. A fresh volume reaches a served, empty store through `db upgrade`, and through
      the fallback's Python call with `db upgrade` forced off; a fresh volume whose first `mlflow-migrate` is
      killed mid-way (either path) reaches a served, empty store at the next `reader up` (G1); a store made by the
      fallback, then served and holding a trace, still holds that trace after the next `mlflow-migrate` (H1); a
      backup taken under N and restored by `reader restore` under N+1 goes through steps (2)-(3) (its restored
      `store.version` is N) and serves its data (H2); a start whose `store.version` equals the image's makes no
      backup and writes no marker; the restore command without `in-progress` and without `--force` refuses.
      Each case asserts which path ran (the `db upgrade` or the fallback's line in the log); a failing step (4)
      exits 13; the restore command exits 2 while a container holds the volume, 4 when the copy fails (and
      `mlflow.db` is byte-identical), 5 when the marker cannot be written, 7 without `pre-migrate.version` (code
      review round 1 of phase 2).
  - id: FR-OBS-30
    text: >-
      Backup and restore (paired OPS-CLI FR-CLI-24, OPS-DEPLOY FR-DEPLOY-15). `obs_mlflow` joins `reader backup`
      (ADR-0038 Decision 6 replaces ADR-0032 Decision 1's exclusion of the trace store): a one-shot container on
      the volume ALWAYS uses SQLite's backup API, with the stack up or down (round 9: 5.1 MB in 0.02 s, every
      table's count equal; a plain file copy is never used, so a WAL file is never split from its database), to
      `<DIR>/obs_mlflow.db`, plus the artifacts directory as files, and copies the volume's `store.version` (when
      present) to `<DIR>/obs_mlflow.store.version`. Traces are in the same file and come along; they stay
      diagnostic (retention trims them). `reader restore`, with the stack down, in this order: removes the
      volume's `store.version` (so a crash part-way never leaves a newer version beside an older file), removes
      `backup/in-progress`, `backup/fresh` and `backup/restored-for` (markers of the replaced store, which would
      otherwise stop or wipe the restored one), puts the file back through the backup API (copy into a temporary
      file in the volume first, then remove the old `-wal`/`-shm`, then move into place), and then writes
      `store.version` from `<DIR>/obs_mlflow.store.version`, or leaves it absent when the backup has none (design
      review rounds 6 and 7, H2: otherwise a restored older store would carry the newer version and skip its
      migration); then `reader restore` runs `mlflow-migrate` itself and starts mlflow only when it exited 0
      (OPS-CLI FR-CLI-24 (b); round 9: a second MLflow served the backup's 98 traces and its Runs).
      Labels and bench results have Postgres as the record (FR-OBS-23, -24) and come back with the Postgres
      restore; a mirror missing after a restore stays missing until that label or upload is posted again (there is
      no repair command; review round 2, N2).
  - id: FR-OBS-31
    text: >-
      Retention and size. `obs.retention` (FR-OBS-11) also deletes compile and import Runs in experiment 0 whose
      `end_time` (the Run's last end; MLflow's own column) is older than `retention_days`, found by one
      `runs/search` per kind (filter ``tags.`reader.kind` = 'compile'``, then `'ingest'`, each with
      ``attributes.end_time < <cutoff ms>``, `max_results` 1000 and `page_token` paging until no token remains;
      code review of 8466329: MLflow 3.18 refuses `IN` on a tag, so one search per kind) (`runs/delete`: MLflow's
      soft delete, the Run's lifecycle stage becomes `deleted`; round 10: it leaves `runs/search` at once; its rows
      stay until `mlflow gc` removes them, which reader does not run, so soft-deleted rows are part of the store's
      size, declared) and LoggedModels whose version key is not "used": a key is used while a worker started
      with it within `retention_days`, recorded by `ensure_setup()` as the LoggedModel's tag `reader.last_started`
      = the UTC start day (written only when it differs, so at most one write per day; the setup digest
      includes the day for this) (`logged-models/{id}` DELETE when `reader.last_started` is older than
      `retention_days` and the key is not the running worker's). Bench Runs and
      datasets are kept (small: one Run and at most 40 records per upload; their record is Postgres). There is no
      VACUUM: SQLite reuses freed pages, and the size alert covers growth (review round 2, N6). Size:
      `reader doctor`/`status` measure the `obs_mlflow` volume on the host (`docker system df -v` for the volume;
      no worker mount; the size includes `backup/pre-migrate.db`, at most one copy of the store) and print a
      warning `obs_store_large` at 80 % of `store_bytes_max` = 4 GiB. The 4 GiB is
      structural, not measured (round 9: a whole book plus 100 questions added 51.6 MB, 1.45 KB a span, so 30
      days of one book a day is about 1.6 GB, leaving more than half free). Growth, declared and pruned: traces and
      compile/import Runs by `retention_days`, LoggedModels of unused version keys by `retention_days`, bench Runs
      and datasets kept (bounded by uploads: one Run and at most 40 records each), Postgres `obs_bench_results` and
      `owner_labels` kept (the record), `obs_stack_status` keeps the newest row per member only; soft-deleted Run
      rows stay (no `mlflow gc`) and count in the store size.
  - id: FR-OBS-32
    text: >-
      Health and self-monitoring (paired OPS-DEPLOY FR-DEPLOY-15, OPS-CLI FR-CLI-24, WEB-UI FR-UI-33).
      Healthchecks: `mlflow` its /health (existing); `rotel` none in compose (its image has no shell or client;
      `obs.health` probes it, below); `jaeger` none (distroless; no sidecar, review round 2, N8). `reader doctor`
      and `reader status` print one line each for mlflow, rotel and jaeger from `docker inspect` (image, running,
      restart count, and the Docker health where there is one), plus for mlflow the store size and
      `obs_store_large` (FR-OBS-31), the journal mode (read through the existing one-off helper with the backup
      API's read-only open), and the last `obs.retention` and `obs.setup` (from the jobs table). A job
      `obs.health` (every 30 minutes, queue obs; excluded from tracing, so it adds no trace: its kind is not
      traced, FR-OBS-5's root is skipped for it) records in Postgres table `obs_stack_status` (paired migration
      `obs_0002`): mlflow's /health and rotel's probe (a POST of `{}` to its OTLP receiver: 400 means listening,
      round 9; Rotel 0.2.7 has no health endpoint; any other answer is `unhealthy`, no answer `unreachable`). With
      tracing off the job ends without a probe, so the rows go stale by design: `reader.obs.health.stale(checked_at,
      now, tracing_on)` is the one staleness rule (older than 75 minutes, and never while tracing is off), which
      the alerts use. The api's summary gains `stack` from that table only and
      `obs_unhealthy` when a member failed its last probe or the row is older than 75 minutes (two missed runs plus
      margin). Jaeger is shown by `reader doctor`/`status` only; /observability shows "see reader doctor" for it.
  - id: FR-OBS-33
    text: >-
      Security hardening, unchanged rules extended to the new service `mlflow-migrate`: non-root users, read-only
      root filesystems, `cap_drop: [ALL]`, `no-new-privileges`, pinned image digests, `mem_limit` =
      `memswap_limit` from FR-OBS-35, no secrets. No egress: every obs network is `internal: true` (FR-OBS-8) and a
      [config] test asserts no obs service is on a non-internal network. An [image] test (review round 2, N9) runs
      a probe container on exactly mlflow's networks: a TCP connect to an IP literal (1.1.1.1:443) fails, an
      external name (example.com) does not resolve, and the same probe on a non-internal network connects and
      resolves (the positive control); on mlflow's networks the probe also reaches `http://mlflow:5000/health`
      (200), so the failures are the networks', not the probe's. Spike round 11
      (results/20261124T154753-round11-egress): on mlflow's two internal networks the connect failed (OSError) and
      the lookup failed (gaierror); on a normal network both succeeded. Round 12
      (results/20261124T155700-round12-rest), with MLflow healthy: the same two failures, and MLflow's /health
      answered 200 to the probe. The gate, the CSP and header
      stripping are re-checked against every new endpoint: the bench and labels routes are on the main site
      (SRV-AUTH's Origin rules), MLflow's new paths (datasets, logged-models, runs) are reachable through 8443 only
      for the owner (INV-OBS-5's [image] test gains them). `/graphql` stays open behind the gate: MLflow's own run
      pages query it (round 10: a query answers 200; an empty body is a 500 from MLflow, logged, harmless).
  - id: FR-OBS-34
    text: >-
      Upgrade policy. A pin (MLflow, Rotel, Jaeger) changes only with this checklist in the PR: (1) the image digest
      and the release notes' breaking changes read; (2) `python deploy/otel/mlflow_catalog.py --check` passes (the
      bundled catalog list is regenerated for a new MLflow); (3) the CLI canary (INV-OBS-2) passes; (4) every obs
      [image] test passes, including FR-OBS-29's upgrade test from the previous pin and FR-OBS-19's Jaeger CSP
      hashes; (5) spike-style replay of VEC-OBS-5 `writes` against the new image (an [image] test) passes; (6)
      FR-OBS-35's burst test runs and its numbers are recorded. A [config] test checks that the compose pins and the test
      pins agree.
  - id: FR-OBS-35
    text: >-
      Load limits from a burst test (not a soak: it lasts seconds, review round 2), round 9 (a whole book of 60 lessons × 8 jobs × 72 spans plus 100 tutor questions of
      10 spans, 35,560 spans in 12.5 s, far denser than a real compile, and a bench upload): 0 spans dropped (sent =
      stored), ingest p50 1.2 s and p95 11.5 s (the burst; NFR-OBS-1's 30 s holds), MLflow peak 560 MiB and 90 %
      CPU, Rotel 32 MiB, Jaeger 50 MiB, the database +51.6 MB. Limits: mlflow 1g (stays; 45 % headroom at the
      burst), rotel 256m and jaeger 256m (unchanged), `store_bytes_max` 4 GiB (structural, FR-OBS-31). Growth:
      1.45 KB a stored span (51.6 MB / 35,560). An opt-in [image] burst test replays the same load and fails on a
      dropped span, p95 above 30 s, or a peak above 80 % of a limit. Not verified until implemented (code review
      of 8466329): the replay is not built yet, so the limits above rest on round 9's spike only; the burst test
      lives in the test suite (its replay is the test's own code, never shipped) and skips with that reason; the
      shipped `reader.obs.burst` holds only the limits.

invariants:
  - id: INV-OBS-1
    text: >-
      For any span the api or worker builds, with any name, attributes, events, status description, tracestate,
      instrumentation scope and links (Hypothesis-generated, including the canary strings below), what
      AllowListExporter hands to the OTLP exporter has a name matching VEC-OBS-1 or `reader.unlisted`, only keys
      listed for that span with values passing their rules, no events, no status description, empty tracestate on the
      span and its links, link attributes empty, the instrumentation scope `reader`, and the resource of FR-OBS-1;
      the only `mlflow.*` and `session.id` keys are those FR-OBS-12 and FR-OBS-18 derive, each JSON value parses
      with exactly its table's keys and values passing their rules, and `mlflow.llm.cost`'s parts sum to its total
      at 6 places (hostile inputs of FR-OBS-12 included).
  - id: INV-OBS-2
    text: >-
      Canary. With book-text, question, answer, system-prompt, run_token and secret canaries placed in a request path
      parameter, query string, header, cookie and body, in a tutor question and answer, a stage's prompt and output,
      a job's args, an exception message and the process's resolved settings, the bytes the OTLP exporter sends
      (captured by an in-test OTLP/HTTP receiver) contain none of them, decoded or raw. For the CLI: under FR-OBS-6's
      environment the bundled CLI's OTLP export contains no prompt, system-prompt, response or run_token canary, its
      span names and attribute and resource keys are a subset of VEC-OBS-2, and the same harness with
      OTEL_LOG_USER_PROMPTS=1 finds the prompt canary (positive control). The worker's MLflow writes (ADR-0035) too:
      the canaries are absent from every `obs.feedback` job's args, every assessment request body and every prompt
      registration request body (captured by an in-test HTTP receiver standing in for MLflow); and for arbitrary
      (name, value, metadata) only VEC-OBS-4 catalogue entries produce a request, whose body's keys and values are
      exactly the catalogue's. Phase 2 (ADR-0038): with the canaries placed in a lesson's text, a tutor question and
      answer, a bench upload's unknown or prose keys and an upload's set file (a non-pinned set), no `obs.runs`,
      `obs.bench`, `obs.label`, `obs.setup` or `obs.health` request body (captured by the in-test MLflow receiver)
      and no row of `obs_bench_results`, `owner_labels` or `obs_stack_status` contains any of them; for arbitrary
      uploads only those passing VEC-OBS-5 produce a row and a job; the pinned questions are the only text that
      reaches MLflow.
  - id: INV-OBS-3
    text: >-
      Telemetry never changes an outcome: with Rotel unreachable, refusing, slow (beyond the export timeout) or
      returning 500, every request's status and body and every job's outcome equal those with tracing disabled, no
      exception leaves an OTel call, and no export runs on the request's or job's own task (export runs only on the
      BatchSpanProcessor's thread or the session marker's daemon flush thread; a full queue drops spans instead of
      waiting); a failing `obs.feedback` enqueue never changes the computing job's outcome. Phase 2: a failing
      `obs.runs` enqueue (made outside the run's final transaction), `obs.label` or `obs.bench` enqueue, and any
      phase 2 job failure never changes a compile run's, an import's or a question's outcome, and a failed mirror
      never changes a label's record.
  - id: INV-OBS-4
    text: >-
      Propagation. A job enqueued inside an active span has exactly one link, to that span's context; its root span
      is in a new trace whose id equals FR-OBS-5's derivation from (job id, key); a malformed, unsampled or all-zero
      `trace` gives no link and no error; a retry or a handler enqueue made inside a run links to the running job's
      root span; a sweep re-enqueue has no link.
  - id: INV-OBS-5
    text: >-
      Owner-only, through Caddy on localhost:8443, before any byte reaches MLflow: every path answers 401 without a
      session cookie and 403 with a learner's session; with the owner's cookie, a POST whose Origin is a foreign
      localhost origin (`https://localhost:3000`), the app origin (`https://localhost`) or absent answers 403, a GET
      with a foreign Origin answers 403, and a POST with `Origin: https://localhost:8443` reaches MLflow; by the
      gate's decision table, `Sec-Fetch-Site: same-site` with Mode `navigate`, Dest `document` and method GET gives
      204, and `same-site` with Dest `script`, `image` or `empty` (or Mode other than `navigate`) gives 403, as does
      any `cross-site`; no response
      carries an `Access-Control-*` header or `Set-Cookie`, and an echo upstream behind the same proxy settings sees
      no `Cookie` or `Authorization`; every blocked pattern answers Caddy's own 404. The app's side holds too: a POST to
      https://localhost/api/* and the kernel WebSocket upgrade with `Origin: https://localhost:8443` and the owner's
      cookie answer 403 (SRV-AUTH's Origin check). MLflow and Rotel publish no port and share no network with
      postgres, embed, agent-proxy, mcp or any kernel; caddy shares none with rotel or the worker. Per site
      (ADR-0033): the same holds on localhost:8444 for Jaeger; the 8443 site refuses `Origin: https://localhost:8444`
      and the 8444 site refuses `https://localhost:8443` with the owner's cookie; a client-sent `X-Reader-Site` is
      overridden; a gate request with no site header is 403; `https://localhost/api/obs/gate` answers as before
      (site `app`); Jaeger shares no network with mlflow, the worker or the api.

nfr:
  - id: NFR-OBS-1
    metric: seconds from a job's end to its trace being returned by MLflow's get-trace with every span, on the Mac
    threshold: 30
    verified_by: test
    # Source: structural. 5 s processor delay + Rotel batching + MLflow write; the spike waited 10 s after a flush and
    # found every trace complete (RESULT.md). The [live] step polls up to 30 s, and checks a tutor trace's session
    # equals its lesson id (FR-OBS-12 e).

vectors:
  - id: VEC-OBS-1
    source: "Hand-derived from FR-OBS-3, -5, -6 and the route, kind and error catalogs: span name patterns, attribute keys with types, value rules and span kinds, and job_args per kind"
    file: spec/fixtures/SRV-OBS/attributes.yaml
  - id: VEC-OBS-2
    source: "spikes/cli-otel-content/results/20261124T002020/report.json, mode agent-env: the bundled CLI 2.1.330's span names, attribute keys and resource keys under FR-OBS-6's environment (stub upstream, fake credential); the WebSearch run's tool spans from spikes/web-search-otel/results/20261124T122933/report.json, mode content-off"
