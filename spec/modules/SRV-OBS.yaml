# Numbers used below, each with its kind.
bounds:
  - { name: batch export, value: "BatchSpanProcessor schedule_delay 5,000 ms, max_queue_size 2,048, max_export_batch_size 512, export timeout 10 s", kind: "library defaults (REF-OBS-2), except the timeout: structural, so a dead Rotel never holds a flush longer than one compose stop budget (10 s). Limit, measured (spikes/obs-stack round 1): a burst of more than 2,048 spans faster than the exporter drains drops spans in the SDK ('Queue full, dropping Span'); one lesson stage is 72 spans over minutes" }
  - { name: shutdown flush, value: "2 s", kind: "structural: below SRV-EVENTS' 8 s graceful timeout and Compose's 10 s stop timeout; spans not flushed by then are dropped (telemetry is lossy, ADR-0018)" }
  - { name: load, value: "≈ 3 spans/s for a whole-book compile in one hour (ADR-0018 hypothesis); a lesson ≈ 7 job traces × 72 spans", kind: "hypothesis (ADR-0018), replayed in spikes/obs-stack" }
  - { name: retention, value: "30 days default, 1..365 allowed (`observability.retention_days`)", kind: "structural: traces are diagnostic; evaluation data of record is agent_spend, compile_steps and tutor_questions, which never come from telemetry (ADR-0018 rule 1). Storage is not the constraint (spikes/obs-stack: 927 bytes per span)" }
  - { name: retention period, value: "once per day at 03:00 UTC, plus once per worker start", kind: "structural: deletion is idempotent; one REST call deleted 132–178 traces in ≤ 0.08 s (spikes/obs-stack)" }
  - { name: memory, value: "mlflow mem_limit 1g, rotel 256m", kind: "measured (docker stats incl. page cache): MLflow 581 MiB at its first idle start (spikes/trace-backend; × 1.25 = 726 ≤ 1,024) and 443 MiB peak under an 8-minute lesson replay plus a 10,080-span bulk (spikes/obs-stack); Rotel ≤ 41 MiB (spikes/trace-backend; × 1.25 = 51 ≤ 256). Revised from the stage-2 live check's cgroup memory.peak" }
  - { name: storage, value: "927 bytes per span (SQLite); a whole-book compile ≈ 10 MB", kind: "measured: spikes/obs-stack, 10,080 spans → +9,342,976 bytes" }
  - { name: summary limits, value: "compile runs: the newest 50 in the window; ingest: the newest 50 imports; failures: up to 5 trace ids per group; tutor: the slowest 10; recent_keys_of: at most 500 key rows per call", kind: "structural: one owner, one page. The 500 bounds a published read that limits before owner scoping; when it is reached the view says so (`truncated`), it never silently undercounts" }
  - { name: attribute string length, value: "≤ 128 characters after the value rule", kind: "structural: every allowed string is an id, an enum or a route template (VEC-OBS-1); the longest is a route template" }

requirements:
  - id: FR-OBS-1
    text: >-
      Setup. `reader.obs.setup(role, settings)` is called once by `reader-server --role api|worker` before serving
      (paired SRV-AUTH change) and returns a handle whose `shutdown()` flushes for at most 2 s. When
      `settings.observability.enabled` is false (paired SRV-CONFIG change; default true), it installs nothing: the
      global tracer provider stays OTel's no-op provider, no exporter, thread or socket exists, and every FR-OBS-3..6
      call path still runs. When enabled, it installs one `TracerProvider` with the resource exactly
      `{service.name: "reader-<role>", service.version: <reader package version>}`, the parent-based always-on sampler,
      the `IdGenerator` of FR-OBS-5, one BatchSpanProcessor built with exactly `BATCH` (the `bounds` values) feeding the
      AllowListExporter (FR-OBS-2), which wraps an OTLP/HTTP protobuf exporter built with exactly the endpoint
      `http://rotel:4318/v1/traces`, a 10 s timeout and no headers (`EXPORTER_KWARGS`, checked by a unit test); the
      exporter merges `OTEL_EXPORTER_OTLP_HEADERS` and `OTEL_EXPORTER_OTLP_TRACES_HEADERS` from the environment
      whatever its `headers` argument says, so both are absent from the environment while it is built (code review
      round 1). Every tracer is obtained under the one instrumentation scope `reader` (a constant, no version). The
      global propagator is W3C tracecontext only (no baggage). The direct dependencies `opentelemetry-sdk` and
      `opentelemetry-exporter-otlp-proto-http` are pinned at 1.45.2 (the spike versions; `opentelemetry-api` 1.45.2 is
      already in uv.lock); uv.lock adds only what those two require (opentelemetry-proto, -semantic-conventions,
      -exporter-otlp-proto-common, -exporter-otlp-common and -exporter-http-transport). No instrumentation library and
      no other OpenTelemetry package is added. The `mcp` role is not traced in this revision (declared gap).
  - id: FR-OBS-2
    text: >-
      Allow-list. VEC-OBS-1 (spec/fixtures/SRV-OBS/attributes.yaml) declares, as data, every span name pattern and
      every attribute key the api and worker may export, each key with a type (string, int, float, bool), a value rule
      (an enum, an enum computed at setup from a code-declared catalog, a regular expression anchored at both ends, or
      a numeric range) and the span kinds that may carry it. `AllowListExporter.export` rebuilds every span before the
      OTLP exporter sees it: a name matching no pattern becomes `reader.unlisted`; an attribute whose key is not
      listed for that span, whose type differs or whose value fails its rule is removed; the status keeps its code
      and loses its description; every event is removed; links keep trace id, span id and flags and lose their
      attributes and tracestate; the span's own tracestate is cleared; the resource is replaced by FR-OBS-1's two
      keys; the instrumentation scope is replaced by the constant `reader`. A removed key is logged once per process
      at WARNING as `obs dropped key=<key>` (the key only, never a value; a key that fails `^[a-z][a-z0-9_.]{0,63}$`
      is logged as `key=<invalid>`); nothing else is counted. The exporter never raises: any exception inside it
      drops that batch and returns FAILURE. Spans from the Agent SDK's CLI do not pass through this exporter (the CLI
      exports to Rotel itself); FR-OBS-6 bounds what they carry. After validation the exporter derives the MLflow
      keys of FR-OBS-12 and FR-OBS-18 from the span's name and its validated attributes, by VEC-OBS-4's tables; a
      caller key starting with `mlflow.` or equal to `session.id` is unlisted and removed like any other.
  - id: FR-OBS-3
    text: >-
      HTTP and WebSocket spans. An ASGI middleware (`reader.obs.asgi.TraceMiddleware`, installed outermost by the api
      app factory, paired SRV-AUTH change) opens one SERVER span per HTTP request and per WebSocket session whose path
      starts with `/api/`, except `/api/healthz` and `/api/obs/gate` (the gate runs on every dashboard request and
      would bury the app's traffic). Name `<METHOD> <route>` for HTTP and `WS <route>` for WebSocket, where `<route>`
      is the template of the registry route that served the request (`/api/lessons/{lesson_id}`), or `other` when no
      route matched. Attributes: `http.request.method` (the nine standard methods, else `_OTHER`), `http.route` (as in
      the name), and at the end `http.response.status_code` (HTTP) or `reader.ws.close_code` (WebSocket); an
      unhandled exception sets status ERROR without a description. The span never carries the raw path, path
      parameter values, query string, headers, cookies, client address or body. A `traceparent` header from the
      client is ignored: every request starts a new trace (the edge is untrusted input). The WebSocket span covers the
      session from accept to close (kernel session lifecycle); no span is opened per message, and no kernel code,
      output or message field becomes an attribute.
  - id: FR-OBS-4
    text: >-
      Log lines. The middleware writes one INFO line per traced request on logger `reader.obs.http`, after the
      response: `request method=<m> route=<route> status=<code> ms=<int> trace=<32 hex>` (WebSocket: `ws route=<route>
      close=<code> ms=<int> trace=<32 hex>`), with the same values as the span and nothing else; uvicorn's access log
      stays off; `/api/healthz` and `/api/obs/gate` get no line. A logging filter on reader-server's `reader` handler
      (paired SRV-AUTH change) appends ` trace=<32 hex>` to every `reader.*` record emitted while a recording span is
      current, so every request and job line carries its trace id; with tracing disabled no ` trace=` suffix is
      added. The filter never adds anything else and is idempotent (a record passing it twice gets one suffix).
  - id: FR-OBS-5
    text: >-
      Jobs (paired SRV-EVENTS change). (a) Enqueue: `Jobs.enqueue` and every internal re-defer pass a second
      procrastinate task kwarg `trace`, the W3C traceparent (REF-OBS-1) of the current span when it is valid and
      sampled, and omit it otherwise; `job_keys.args`, the idempotency key and FR-EVENTS-10's payload checks are
      unchanged (`trace` is not part of `args`). (b) Run: the wrapper opens the job's root span `job <kind>` (kind
      CONSUMER) in a new trace, with exactly one link to the parsed `trace` context when it parses and is valid, and
      none otherwise; parsing never raises. Its trace id is derived, not random: the first 16 bytes of the SHA-256
      of the bytes `reader.job`, NUL, the job id written as decimal ASCII digits (no sign, no leading zeros), NUL,
      and the idempotency key encoded UTF-8; an all-zero result is replaced by bytes 16..31. VEC-OBS-3's keys and
      ids are generated, never hand-written, by `spec/fixtures/SRV-OBS/trace-ids.mjs` (a fixture helper only); the
      gate is the [unit] test that recomputes every key with `reader.jobs.model.idempotency_key` and every id with
      this derivation in Python and fails CI on a difference. Installed through the `IdGenerator` FR-OBS-1 installs (a context variable set only around the root span's creation;
      every other span gets a random id). So the owner's views (FR-OBS-10) compute any job's trace id from a key row's
      `job_id` and `key` (read through SRV-EVENTS' published functions) without storing it. Attributes: `reader.job.kind`, `reader.job.id`,
      `reader.job.attempt` (the key's attempt count at claim), the per-kind argument attributes of VEC-OBS-1
      `job_args` (no other argument is read), and at the end `reader.job.outcome` ∈ {succeeded, skipped, failed,
      dead, aborted} with `reader.error_code` (FR-OBS-2's catalog rule) or `reader.error_class` (the exception class
      name FR-EVENTS-6 records when the code is not in the catalog). (c) Re-enqueues made inside a run (FR-EVENTS-6's
      retry, FR-EVENTS-4's lost-run re-enqueue, and handler enqueues through `running()`, e.g. a pipeline stage
      enqueuing the next) carry the running job span's context, so consecutive jobs are linked; enqueues from the
      sweep (FR-EVENTS-7, -15) and from start hooks carry none and start unlinked traces. (d) Declared gaps:
      an enqueue that returns `already_queued` keeps the waiting job's original `trace` (or none), so the second
      caller's link is lost; after a rollback to a worker without this change, procrastinate refuses jobs whose kwargs
      carry `trace` (unexpected keyword) until they are re-deferred by the new worker or cancelled (never run two
      worker versions, SRV-EVENTS owner note); a derived id collides only for the same (job id, key), which a database
      reset or a `reader restore` of an older dump re-issues, merging spans into an older trace inside the retention
      window; a worker killed mid-run never exports its root span, so the trace's children appear without a root
      until retention deletes them; when stage-2's outbox takes over enqueueing (SRV-EVENTS defers), the outbox row
      must capture the traceparent at the state change, or the link is lost. (e) V.obs-analytics: for `pipeline.*`
      kinds the wrapper calls `reader.obs.session_marker("reader.run_id", <args run_id>)` right after opening the
      root; the tutor handler calls it itself (FR-OBS-12 e). A handler adds root attributes it learns from its own
      rows (VEC-OBS-4 `job_root_keys_from_handler`: `reader.lesson.id`, `reader.course.id`, `reader.tutor.state`,
      `reader.prompt.version`) through `reader.obs.annotate_job(**attributes)`, which sets them on the current job
      root and never raises. (f) A kind declared `traced: false` (phase 2: only `obs.health`, FR-OBS-32) gets no
      root span and no trace context, so its 30-minute probe adds no trace (V.obs-mlflow-phase2).
  - id: FR-OBS-6
    text: >-
      Agent calls (paired SRV-AGENT change). `Provider.run` opens span `agent.call` (kind CLIENT) and keeps it current
      while the CLI runs, so the SDK injects TRACEPARENT and TRACESTATE into the CLI environment (claude-agent-sdk
      0.2.187 `subprocess_cli.py`; measured, spikes/cli-otel-content) and the CLI's `claude_code.interaction` span is a
      child of `agent.call`. Attributes: `reader.task`, `reader.stage` (when the call has one), `gen_ai.request.model`
      (the resolved id), `gen_ai.operation.name: invoke_agent`, `gen_ai.provider.name: anthropic`,
      `reader.lesson.id`, `reader.course.id` and `reader.step` (when the call has them), and after the result
      `gen_ai.usage.input_tokens` (input + cache read + cache write), `gen_ai.usage.output_tokens`,
      `gen_ai.usage.cache_read.input_tokens`, `gen_ai.usage.cache_write.input_tokens` (FR-OBS-12 b),
      `reader.cost_usd` (the call's settled amount, FR-AGENT-9), `reader.cost_input_usd` (FR-OBS-12 c),
      `reader.stop_reason` and `reader.error_code`; cost is ours because the CLI's spans carry tokens but no cost
      (measured), and reader-mlflow's catalog prices the CLI's spans at 0 (FR-OBS-12 c). When tracing is enabled, FR-AGENT-6's CLI environment gains exactly:
      `CLAUDE_CODE_ENABLE_TELEMETRY=1`, `CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1`, `OTEL_TRACES_EXPORTER=otlp`,
      `OTEL_METRICS_EXPORTER=none`, `OTEL_LOGS_EXPORTER=none`, `OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf`,
      `OTEL_EXPORTER_OTLP_ENDPOINT=http://rotel:4318`, and the content flags `OTEL_LOG_USER_PROMPTS=0`,
      `OTEL_LOG_ASSISTANT_RESPONSES=0`, `OTEL_LOG_TOOL_CONTENT=0`, `OTEL_LOG_TOOL_DETAILS=0` (the CLI's defaults are
      already off, measured; set explicitly so an inherited value cannot turn them on). `OTEL_LOG_RAW_API_BODIES`,
      `ENABLE_BETA_TRACING_DETAILED` and `BETA_TRACING_ENDPOINT` are left blank like every other variable FR-AGENT-6
      passes blank (`OTEL_LOG_RAW_API_BODIES` takes `inline` or a directory, so `0` is not a documented "off").
      When tracing is disabled none of these is added. The CLI privacy bound is enforced by tests, not by this
      process's exporter: (a) [unit] the `claude-agent-sdk` version in `server/uv.lock` equals `cli.sdk` of VEC-OBS-2,
      so a pin change fails CI until the canary is rerun and VEC-OBS-2 regenerated; (b) [image] the canary harness
      (`server/tests/obs/cli_canary/`, moved from spikes/cli-otel-content in Red: Dockerfile, stub upstream, capturing
      OTLP receiver, probe) asserts INV-OBS-2's CLI half and that every exported CLI span name, attribute key and
      resource key is in VEC-OBS-2; (c) [live] the same subset check on the CLI spans of the live tutor trace, under
      the owner's real account. The one call that declares tools, SRV-FRESH's WebSearch run (SRV-AGENT FR-AGENT-15),
      is in the harness too (the stub flow of spikes/web-search-otel), in an allow and a deny variant of its
      PreToolUse gate: no query, result title, URL or summary canary is exported, its `claude_code.tool*` span names
      and keys are in VEC-OBS-2, and with `OTEL_LOG_TOOL_CONTENT=1` the scan finds them (positive control). Any
      other tool, or a change of that call's flow, reruns the canary first.
  - id: FR-OBS-7
    text: >-
      Coverage of the owner's flows, by construction from FR-OBS-3, -5 and -6 (no module-specific span beyond
      `agent.call`, FR-OBS-13's children and FR-OBS-12's `job.session` marker): a tutor answer is the `job tutor.answer` trace (linked from `POST` of the question) with its
      `agent.call` and the CLI's spans; a compile is one `job pipeline.stage` or `job pipeline.verify` trace per
      stage, linked in order; ingest import is `job ingest.import` (the host-side conversion of SRV-INGEST runs outside
      the stack and is not traced); search is the request span of its route plus `job search.embed` for embedding;
      a kernel session is its WebSocket span (FR-OBS-3). agent-proxy, the mcp role and the kernel containers are not
      instrumented and have no route to Rotel.
      ADR-0039 amendment (V.kl-obs-spans, 2026-11-26): The list of module-specific spans gains FR-OBS-36's `find`
      subtree and FR-OBS-37's `pack.build` and `link.run`; a tutor or pipeline job that calls `find` shows it under
      its root, and a `judge.find` job is its own trace linked from `find.judge_wait`.
  - id: FR-OBS-8
    text: >-
      Collector and backend (deploy/otel/**, wired by the paired OPS-DEPLOY change). Profile `observability`:
      `rotel` runs `streamfold/rotel:v0.2.7@sha256:<digest>` with the image's entrypoint (receivers 4317 and 4318) and
      command `--exporter otlp --otlp-exporter-endpoint http://mlflow:5000 --otlp-exporter-protocol http
      --otlp-exporter-custom-headers x-mlflow-experiment-id=0` (experiment 0, which a fresh MLflow store creates);
      `mlflow` runs `reader-mlflow:local`, built from `deploy/otel/mlflow.Dockerfile` `FROM
      ghcr.io/mlflow/mlflow:v3.18.0@sha256:<digest>`, which creates `/var/lib/mlflow` owned by `10004:10004` before
      `USER 10004` and adds nothing else (no driver: the store is SQLite, ADR-0032), with command `mlflow server
      --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri sqlite:////var/lib/mlflow/mlflow.db
      --artifacts-destination /var/lib/mlflow/artifacts --default-artifact-root mlflow-artifacts:/ --allowed-hosts
      localhost:8443,mlflow:5000,mlflow` and the environment exactly `MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false`,
      `MLFLOW_DISABLE_TELEMETRY=true` and `MLFLOW_MODEL_CATALOG_URI=` (empty; FR-OBS-12 c) (no secret: MLflow holds
      none); the image also replaces MLflow's bundled model catalog (FR-OBS-12 c). Both run non-root (rotel 10005), `read_only:
      true`, tmpfs `/tmp`, `cap_drop: [ALL]`, `no-new-privileges`, `mem_limit` equal to `memswap_limit` (bounds);
      measured to start so in spikes/obs-stack. Healthchecks: rotel `["CMD", "bash", "-c", "exec
      3<>/dev/tcp/127.0.0.1/4318"]` (the image has bash and no HTTP client; Rotel has no health endpoint), mlflow
      `["CMD", "python", "-c", "import urllib.request,sys;
      sys.exit(urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=2).status!=200)"]`. Networks, internal,
      with explicit subnets (the owner's Docker Desktop has no free predefined pool, measured; 10.230.2.0/24,
      10.230.3.0/24 and 10.230.4.0/24 were unused on 2026-11-24 by `docker network inspect` of every network, where
      only 10.230.1.0/24 (reader_front) and two /28s in 10.231.0.0/16 exist): `otel` 10.230.2.0/24 with exactly api,
      worker and rotel; `obs` 10.230.3.0/24 with exactly rotel, mlflow and worker (the retention job, FR-OBS-11;
      ADR-0032 amends ADR-0025 rule 5 for it); `obs-ui` 10.230.4.0/24 with exactly caddy and mlflow. So caddy shares no
      network with rotel or the worker. The volume `obs_mlflow` is mounted only by mlflow, label
      `org.reader-ai.backup=exclude` (traces are diagnostic; the data of record is in Postgres). Turning tracing off
      removes rotel and mlflow and keeps the volume; turning it on again finds the old traces, which the next
      retention run trims. Egress: none; no service of the profile is on `edge` or `egress`, and MLflow's server
      telemetry is off.
      ADR-0039 amendment (V.kl-obs-spans, 2026-11-26): Network `otel` holds exactly api, worker, worker-judge and
      rotel (ADR-0032 Decision 1 as amended by ADR-0039); `worker-judge` is on no other obs network (no `obs`, no
      route to mlflow). Paired OPS-DEPLOY FR-DEPLOY-3 and VEC-DEPLOY-2 (worker-judge–rotel allowed;
      worker-judge–mlflow never).
  - id: FR-OBS-9
    text: >-
      Dashboard access (ADR-0032; paired OPS-DEPLOY and OPS-CLI changes). Caddy serves a second site `localhost:8443`
      (`tls internal`); `127.0.0.1:8443:8443` is published by `reader up`'s in-memory override only while the profile
      is active (the base compose.yaml publishes 443 only). Every request is first sent by `forward_auth
      10.230.1.10:8000 { uri /api/obs/gate }`. Then, in this order, as mutually exclusive `handle` blocks (a `respond`
      next to a catch-all `handle` never runs, because Caddy orders `handle` first: measured, spikes/obs-stack round
      2, where /v1/traces reached MLflow): `handle @blocked { respond 404 }` with `@blocked path_regexp
      (?i)^/+(?:(?:v1|gateway)(?:/|$)|mcp|(?:ajax-api|api)/+[^/]+/+mlflow/+(?:assistant|gateway|gateway-proxy)(?:/|$))`
      (exactly this regexp in the Caddyfile; the adapt test checks it): the OTLP receiver, the AI gateway, MLflow's
      MCP server, and the assistant, gateway and gateway-proxy routes at any depth under both `/api/<v>/mlflow/` and
      `/ajax-api/<v>/mlflow/`, case-insensitive and with repeated slashes (code review round 1 measured on the pinned
      caddy that a middle `*` of a `path` pattern matches one segment only, so deep gateway, assistant and
      gateway-proxy paths reached MLflow); and `handle { reverse_proxy mlflow:5000
      { header_up -Cookie; header_up -Authorization; header_down -Set-Cookie; header_down -Access-Control-* } }` with
      the Host header unchanged (MLflow's `--allowed-hosts` accepts only `localhost:8443` from the edge). The site's
      response headers are the main site's except the Content-Security-Policy, which is exactly `default-src 'self';
      script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;
      worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none';
      form-action 'self'` (measured in a headless browser, spikes/obs-stack round 2: the strictest base policy blocked
      only inline styles; with this policy no violation on the UI, the traces list or a trace's detail, and no request
      to another host). It stays within the ceiling: no `'unsafe-inline'` or `'unsafe-eval'` in script-src, no host
      source other than `'self'`, `connect-src 'self'`; a future MLflow that needs more blocks its upgrade for the
      owner. The route `GET /api/obs/gate` (`reader.obs.routes`, registered through ROUTERS, paired SRV-AUTH change)
      answers, in this order: 403 when an `Origin` header is present and is not exactly `https://localhost:8443`; 403
      when `X-Forwarded-Method` is not GET or HEAD and `Origin` is not exactly `https://localhost:8443` (MLflow 3.18.0
      answers every localhost origin with credentialed CORS: measured, `Access-Control-Allow-Origin:
      http://localhost:3000` on a direct request, so a page on any other localhost port could otherwise read or write
      with the owner's cookie); 403 when `Sec-Fetch-Site` is present and is neither `same-origin` nor `none`, except a
      top-level navigation: `Sec-Fetch-Site: same-site` together with `Sec-Fetch-Mode: navigate`,
      `Sec-Fetch-Dest: document` and a forwarded method of GET passes on (a click from
      https://localhost/observability arrives `same-site`); every other `same-site` or `cross-site` request (an image,
      script, worker or fetch included) is 403; then 204 with no body for a session (SRV-AUTH's cookie lookup) whose
      user has role `owner`, 401 without a valid session, 403 for any other user. Measured in a real browser
      (spikes/obs-stack round 3, from a page on another port of the same site): the click arrived
      `same-site/navigate/document`, passed, and opened the trace's span tree; an `<img>`, a `<script>`, a no-cors
      fetch and a CORS fetch from that page arrived `same-site` with Dest `image`, `script`, `empty`, `empty` and were
      all refused. Caddy appends the original query string to the gate's URI (measured), so the gate ignores its own
      query. It never sets or refreshes a cookie, never extends a session, is GET only (forward_auth always sends GET),
      and is neither traced nor logged per request (FR-OBS-3, -4). Declared residual, not audited: the navigation
      exception lets a same-site page open any MLflow UI route with a URL fragment it chose; if some MLflow UI route
      performs a write on load from its fragment (rather than on a user action), such a page could trigger it with the
      owner's session. The MLflow 3.18.0 UI routes were not audited for this; the writes it could reach are MLflow's
      own (traces, assessments, tags, experiments), never reader-ai's, and the app's routes stay behind SRV-AUTH's
      Origin check. A 401 is returned to the browser
      as is: the dashboard does not redirect to sign-in; the owner signs in at https://localhost and reloads (owner
      note). The same route is also reachable as https://localhost/api/obs/gate through the main site, where it tells
      a caller only whether its own session is the owner's, which `GET /api/me` already does. Defence in depth only,
      not relied on: MLflow 3.18.0 answered a `text/plain` body with 400 on the two measured JSON endpoints
      (experiments search, delete-traces); other endpoints were not measured, and the gate's Origin rules are what
      refuse a cross-origin POST. Per-site origins (ADR-0033, accepted 2026-11-24): every forward_auth block sets
      `header_up X-Reader-Site <site>` (`mlflow` on 8443, `jaeger` on 8444, FR-OBS-19), overriding any value the
      client sent, and the main site's handler for `/api/obs/gate` sets `X-Reader-Site: app` the same way; every
      site also strips a client-sent `X-Reader-Site` first (`request_header -X-Reader-Site`, site-wide; code review
      round 1), so no upstream ever sees a client's value. The gate
      reads the site first: an absent or unknown value is 403; the expected Origin above is then the site's own
      (`https://localhost:8443` for `mlflow`, `https://localhost:8444` for `jaeger`, `https://localhost` for `app`),
      and every other rule is unchanged. Measured (spikes/obs-stack round 5, 18 cases): each site passed only with its
      own origin; the other site's origin and no origin on a POST were 403; a client-sent `X-Reader-Site` changed
      nothing. Phase 2 (ADR-0038) leaves the blocked list unchanged (the gateway, assistant, MCP and v1 ingest stay
      blocked; `/graphql` stays open, FR-OBS-33). Residuals, declared: (1) MLflow's UI JavaScript runs on 8443 with
      the owner's session through the gate, so a flaw in it can call any open MLflow route as the owner: the
      blocked list, no CORS and the read-only Jaeger site bound it; (2) a comment the owner types in MLflow is
      stored as typed (owner note); (3) `/health` ignores --allowed-hosts (spike round 10); (4) MLflow logs a 500
      for an empty /graphql body; (5) a soft-deleted Run keeps its rows (lifecycle stage `deleted`) because reader
      never runs `mlflow gc` (FR-OBS-31).
  - id: FR-OBS-10
    text: >-
      The owner's views. MLflow 3.18.0's trace metrics group span cost only by model name or provider and trace counts
      only by trace name or status (REF-OBS-5), so cost per stage per lesson and failures by error code cannot be
      expressed there. `GET /api/obs/summary?days=<1..90, default 7>` (owner only: 401 without a session, 403 for
      another role; `days` must fully match `^[0-9]{1,2}$`, ASCII digits only, and lie in 1..90, else 400 `days`:
      code review round 1 found `days=²` passing `str.isdigit` and failing `int` with a 500) returns JSON computed from reader-ai's own tables, read-only, over the window. User-owned tables
      are read with `owner_id` = the caller's id. `job_keys` is never queried by SQL from this module (SRV-EVENTS
      FR-EVENTS-17: no module queries it directly): its rows come only through the read functions the paired
      FR-EVENTS-18 publishes next to `job_status_of` and `dead_error_code_of`: `key_rows_of(conn, keys)` (keys of any
      kinds; the `<kind>:` prefix carries the kind; served by the primary key) and `recent_keys_of(conn, kind_names,
      outcome, since, limit)` (served by the index FR-EVENTS-18 adds on (kind, outcome, finished_at)), each returning
      rows of (kind, key, args, outcome, error_code, job_id, attempts, created_at, finished_at), and `recent_keys_of`
      also a `truncated` flag that is true when it returned `limit` rows. The keys this module asks for are computed
      with SRV-EVENTS' `idempotency_key` (FR-EVENTS-2) from the owner's own rows. What each view runs: (a) one query
      for the runs, one for their spend, one for their steps, then one `key_rows_of` for all steps' keys, one key per
      step under the one kind SRV-PIPELINE enqueues for that stage (`pipeline.verify` for lab verification,
      `pipeline.stage` for every other stage); (b) one query for the questions, one for the tutor settle rows, then one
      `key_rows_of` for the slowest 10; (c) one `recent_keys_of` over every kind, then ownership queries bounded by
      the ids the dead rows name (the owner's runs among their run_ids, the owner's questions among their
      question_ids, the materials rows of their material_sha256 values; code review round 1), one for failed questions, and one `key_rows_of` for those failed
      questions' `tutor.answer` keys (their trace ids); (d) one `recent_keys_of` for `ingest.import` and one query for
      the owner's materials. `recent_keys_of` limits before owner scoping, so a view built from it carries
      `truncated` and the page shows "more rows may exist" when it is true:
      (a) `compile_runs`: the newest 50 runs started in the window, each with lesson id, started and finished times,
      `spent_usd` = SRV-AGENT's spent(run) (FR-AGENT-9: settled_usd of settle rows plus the usd of reserves with neither
      a settle nor a void, over `agent_spend` rows of the run_id), and its steps from `compile_steps` (stage, cost_usd,
      duration_s, model; the per-step cost stays the step's own record) with `trace_id`: FR-OBS-5's derivation from
      the key row whose key is `idempotency_key` of the step's (run_id, step, stage, input_sha256) under the stage's
      one kind (above), using that row's `job_id` (the newest job that ran the key) and `key`; null when no row
      or no job id exists;
      (b) `tutor`: count, latency p50 and p95 in ms (`finished_at − created_at` of answered questions, nearest-rank
      percentiles), `cost_usd_sum` = the sum of `settled_usd` over the owner's `agent_spend` settle rows of task
      `tutor` in the window, `cost_usd_mean_per_settled_call` = that sum divided by the number of those settle rows
      (one per billed provider call, failed answers included; null when there are none), and the slowest 10 with their
      trace ids (the `tutor.answer` key of the question id);
      (c) `failures`: counts by (kind, error_code) of key rows with outcome `dead` finished in the window, from
      `recent_keys_of(all kinds, dead, window, 500)`. User kinds are scoped: `pipeline.*` rows count when their args run_id is one
      of the owner's runs, `tutor.answer` rows when their question_id is one of the owner's questions, `ingest.import`
      rows when a materials row of the owner has their material_sha256. System rows are shown unscoped and marked
      `system: true` on this owner-only page (`ingest.import` with no materials row, `search.embed`, `obs.retention`,
      and any kind not listed here); key rows hold ids, codes and times, no text. Plus counts by error_code of the
      owner's failed `tutor_questions`. Each group carries up to 5 most recent trace ids;
      (d) `ingest`: the newest 50 `ingest.import` key rows that succeeded in the window and belong to the owner's
      materials (from `recent_keys_of(["ingest.import"], succeeded, window, 500)`), each with the material's `page_count`, the import job's duration (`created_at` to `finished_at` of the
      key row, which includes queue wait) and `pages_per_min_import` = page_count over that duration in minutes (the
      in-stack import only; host-side conversion time is not included). No text column (questions, answers, reports, titles) is read. A web page `/observability`
      (paired WEB-UI change, owner only) renders the five views ((e) `lessons` is FR-OBS-17's; the page's cost note
      says MLflow's Cost column shows settled per-call amounts and this page's totals also count open reserves) and
      links every trace id to
      `https://localhost:8443/#/experiments/0/traces?selectedEvaluationId=tr-<trace id>` (measured: this opens the
      trace's detail with its span tree; `selectedTraceId` does not). A trace id is given only for a trace that can
      exist (live check 2026-11-24: links of jobs that ran before tracing existed left MLflow on its loading
      skeleton): table `obs_tracing (started_at timestamptz primary key, enabled boolean)`, Alembic branch `obs`
      (`server/src/reader/obs/migrations`, revision obs_0001, paired SRV-AUTH VERSION_LOCATIONS change), gets one row
      per worker start from `reader.obs.jobs.on_worker_start` (`clock_timestamp()`, `observability.enabled`; tried 3
      times, 1 s apart, then logged). A key row's moment is its `finished_at`, else its `created_at`; its trace id is
      shown only when tracing is enabled in the api now, the latest `obs_tracing` row at or before that moment (by
      `started_at`, whatever order the rows come in) says `enabled`, and the moment is not older than the last
      `retention_days` (a moment exactly at the cutoff counts; older traces are deleted, FR-OBS-11); otherwise
      `trace_id` is null (the page shows "no trace") and a group's `trace_ids` omit it. The rows read are those
      started within the window plus the one latest before it. obs_0001 backfills one `enabled` row at the
      `created_at` of the oldest `obs.retention` key row (the first worker start with the obs code, which enqueues
      that day's key), so jobs traced before the table existed keep their links; it assumes tracing was on then
      (the default). Declared (live-fixes review): one worker is assumed (with several, one start's row decides for
      all); a job still running when its worker was killed, and a job queued while tracing was on that never ran,
      can get a link to a trace that does not exist (their moment falls in an enabled period); so can every job of
      a start whose row could not be written after tracing was turned off.
  - id: FR-OBS-11
    text: >-
      Retention. Job kind `obs.retention` (`reader.obs.jobs`, listed in SRV-EVENTS' KIND_MODULES; args `{day:
      YYYY-MM-DD}`, key `[day]`, max_attempts 3, transient connection errors, timeout 60 s). Its handler first enqueues
      the next day's key, whose day is the argument day + 1 (a calendar day in UTC, never "today + 1", so a late or
      retried run cannot skip or repeat a day), with `schedule_in` the seconds from now to 03:00 UTC of that day (0
      when already past), so a day that ends dead never stops the chain (the enqueue is idempotent per key; a failed
      enqueue is tried 3 times in the run, 1 s apart, then logged and today's delete still runs); then it calls
      MLflow's REST `POST http://mlflow:5000/api/2.0/mlflow/traces/delete-traces`
      once with `{"experiment_id": "0", "max_timestamp_millis": now − retention_days × 86,400,000}` (no `max_traces`:
      MLflow 3.18.0 sets no server cap and one call deleted 178 traces in 0.05 s, measured). `on_worker_start`
      enqueues today's key. With tracing disabled the kind is still declared and its handler returns at once after
      enqueuing the next day (so a disabled profile never leaves dead keys). MLflow unreachable is transient; any other
      HTTP failure (any non-200, and a 200 whose body is not a JSON object or carries a non-integer `traces_deleted`;
      an absent `traces_deleted` is 0, as protobuf JSON omits zero values) raises
      `RetentionFailed`, so the day's key ends `dead` with `error_code` `RetentionFailed` (FR-EVENTS-6
      records a permanent failure by its class name; amended at Red, 2026-11-24, from `obs_retention_failed`, which no
      job wrapper can write). SQLite does not shrink on delete (measured);
      freed pages are reused, so the store's size stays bounded by the retained traces. In the same run the handler
      deletes the `obs_tracing` rows (FR-OBS-10) started before now − `retention_days`, except the latest of them,
      which still decides the rows between the cutoff and the next start.
      ADR-0039 amendment (V.kl-obs-spans, 2026-11-26): The handler's order becomes: enqueue the next day's key
      (unchanged); then the Postgres deletes, always, with tracing on or off and before any MLflow request:
      `judge_inputs` rows older than `retention_days` (FR-OBS-38), `obs_tracing` rows as today, and
      `judge_prompt_proposals` rows still `running` a day after their last step set `refused` `step_lost`
      (FR-OBS-41), each in its own transaction, a failure logged by code and never stopping the next step; then,
      only with tracing on, the MLflow deletes as written. With tracing off the handler no longer returns right
      after the enqueue: it does the Postgres deletes, then returns.
  # FR-OBS-12..19: the V.obs-analytics amendment (design review round 3 on 6ccbb08, deep-reviewer VERDICT approve),
  # moved here at Red. The owner accepted ADR-0033 and ADR-0035 and rejected ADR-0034 (2026-11-24), so FR-OBS-14,
  # -15 and -18 (held for ADR-0035) and FR-OBS-19 (ADR-0033's Jaeger view) are in scope too; no text-content mode
  # exists.
  - id: FR-OBS-12
    text: >-
      MLflow conventions on our spans (zero credit; values ids, enums and numbers only). Mechanism (review round 1,
      B3): callers set only VEC-OBS-1 attributes; every MLflow key is DERIVED by AllowListExporter after
      validation, from the span's name and its already-validated attributes, by the derivation tables of VEC-OBS-4
      (`spec/fixtures/SRV-OBS/analytics.yaml`; its attribute, span-name and key entries are merged into
      attributes.yaml): no caller-built JSON reaches an export, and no new value-rule type exists. A caller
      attribute whose key starts with `mlflow.` or equals `session.id` is unlisted and removed like any other.
      Derived values are serialized by the exporter (`json.dumps` of a dict of validated scalars, keys in table
      order, `ensure_ascii`), so a value cannot break out of its JSON string. (a) Span types: every span we own gets
      `mlflow.spanType` from VEC-OBS-4 `span_types` (the stored type column, used by span search and per-type
      metrics, takes only an explicit value; translated types are not stored, measured): job roots and `job.session`
      CHAIN; `agent.call` AGENT (with the validated `gen_ai.operation.name: invoke_agent`, so MLflow never types it
      LLM and never prices it); FR-OBS-13's children as listed there; HTTP and WS spans none. The CLI's spans are
      typed by MLflow's Claude Code translator (interaction AGENT, llm_request LLM, tool TOOL; measured) and are not
      changed. (b) Tokens: `agent.call` uses the current GenAI semconv keys:
      `gen_ai.usage.input_tokens` = input + cache read + cache write (semconv counts cached input in the input, as
      MLflow's Claude Code translator does), `gen_ai.usage.output_tokens`, `gen_ai.usage.cache_read.input_tokens`,
      `gen_ai.usage.cache_write.input_tokens`; the old `gen_ai.usage.cache_read_input_tokens` and
      `cache_creation_input_tokens` keys (not read by MLflow 3.18.0) leave VEC-OBS-1. Trace token usage then equals the
      call's (MLflow's tree aggregation lets `agent.call` hide the CLI's own counts; measured equal). (c) Cost, with
      the ledger as MLflow's source (owner, 2026-11-24: "our pricing.yaml is the source of truth"). SRV-AGENT sets on
      `agent.call`, after the settle, `reader.cost_usd` = the settle row's `settled_usd` (numeric(12,6), exact) and
      `reader.cost_input_usd` = the input part (B7). SRV-AGENT quantizes the settled amount once with the ledger's
      rounding (`pricing.micro`, 6 places, ROUND_HALF_UP; code review round 1) and passes that same value to both
      `ledger.settle` and the span. With P = pricing.yaml's rates for the call's model at the tier SRV-AGENT's
      `cost()` uses (FR-AGENT-17: the `above_100k` tier when the usage's prompt tokens exceed 100,000 and the model
      has one; a tool call's summed usage at the lower tier) and the settle row's token columns, `priced_in` = input
      × P.input + cache_read × P.cache_read + cache_write_5m × P.cache_write_5m + cache_write_1h × P.cache_write_1h
      (each cache write at its own TTL's rate, the columns SRV-AGENT's `map_usage` fills), `priced_out` = output ×
      P.output + web_search_requests × web_search_usd × 10^6 (the search fee counts on the output side; rates are
      per million tokens); `reader.cost_input_usd` = min(settled, round_half_up(settled × priced_in / (priced_in +
      priced_out), 6)), or 0 when priced_in + priced_out = 0 (a settle with no usage: the whole amount counts as
      output; with settled 0 both are 0). The exporter derives `mlflow.llm.cost` = {input_cost:
      reader.cost_input_usd, output_cost: reader.cost_usd − input_cost, total_cost: reader.cost_usd}, computed with
      `Decimal(str(value)).quantize(Decimal("0.000001"), ROUND_HALF_UP)` for both inputs and the subtraction done
      in Decimal (never in float; the output part is serialized from its Decimal), so the parts sum to the total
      exactly at 6 places; no `reader.cost_usd`, no `mlflow.llm.cost` (a
      reserve never settled, e.g. a killed call; /observability's spent(run) still counts it). An explicit cost on an
      AGENT span is kept by MLflow 3.18.0 (it auto-prices only non-AGENT spans; measured). MLflow would otherwise
      also price the CLI's `llm_request` spans and its span cost metrics sum every priced span with no dedup
      (measured round 4: 0.0401 on `agent.call` plus 0.0631 on the CLI span for one call). So reader-mlflow's image
      REPLACES MLflow's bundled model catalog (B1): `deploy/otel/mlflow.Dockerfile` deletes every
      `mlflow/utils/model_catalog/*.json` of the base image and copies one `anthropic.json` in, generated by the
      committed generator `deploy/otel/mlflow_catalog.py` (`--write` / `--check`) from pricing.yaml's model ids plus
      every model id of the pinned base image's bundled `anthropic.json` (kept in
      `deploy/otel/mlflow-bundled-anthropic.txt`), every price 0. And the mlflow service's environment gains
      `MLFLOW_MODEL_CATALOG_URI=` (empty): MLflow 3.18.0's default is a GitHub release URL that it would try first for
      any span with a provider (`utils/providers.py` `_load_provider`: remote, then bundled; read in source), and an
      empty value disables the remote fetch. No mount: a missing or broken mount cannot fall back to list prices.
      Measured (round 5, stack E, the replaced image): a CLI `llm_request` for a pricing.yaml model, for a bundled
      model absent from pricing.yaml (claude-haiku-4-5) and with NO provider key all cost 0.0; an unknown model gets
      no cost; the span cost metric over those four traces summed 0.48 = the four ledger amounts. For contrast,
      round 5 stack A (a `file://` catalog mount) priced the provider-less span at the bundled list price (0.0631),
      and stack B (mount empty) priced every CLI span (span sum 0.6062 for a ledger sum 0.48). Measured earlier
      (round 4): each trace's cost = its call's ledger amount (trace header, Cost column), span sum 1.55 = seven
      ledger amounts. (d) Trace name and tags (root spans): `mlflow.traceTag.mlflow.traceName` = the span name, and
      `mlflow.traceTag.<key>` = str(value) for each VEC-OBS-4 `trace_tags` key the root carries: `reader.job.kind`,
      `reader.job.outcome`, `reader.job.attempt`, `reader.error_code`, `reader.error_class`, `reader.stage`,
      `reader.step`, `reader.run_id`, `reader.lesson.id` and `reader.course.id` (new keys, UUIDs; ids only, never
      titles), `reader.question_id`. No cost, run-total, model or cache tag (review: they duplicated the Cost column,
      the span model dimension and the token counts; `reader.run.spent_usd` dropped, B7). `agent.call` also carries
      `reader.lesson.id`, `reader.course.id`, `reader.stage` and `reader.step` as validated attributes. (e) Session
      (B2): MLflow 3.18.0 sets a trace's session once, from the first span of the first batch it ingests that has
      `session.id` or `gen_ai.conversation.id` (`sqlalchemy_store.py` `log_spans`: `if session_id is None`, and a
      later batch never overwrites it; read in source). The CLI's spans carry both keys (VEC-OBS-2) with the CLI's
      own session id, and they reach MLflow before our root, which ends last. Measured (round 5, the CLI spans with
      VEC-OBS-2's full key sets): (s1) CLI first, root with `session.id` = the run → the trace's session was the
      CLI's; (s2) a `job.session` marker exported 1.5 s before the CLI → the run; (s3) the marker exported with no
      gap → the run. So a zero-length child `job.session` (CHAIN) is opened and ended under the job's root by
      `reader.obs.session_marker(session_key, value)`, from which the exporter derives `session.id` (R2-2):
      pipeline kinds: the job wrapper calls it right after opening the root, with `reader.run_id` from the job's
      validated args (VEC-OBS-1 `job_args`); `tutor.answer`: the tutor handler calls it with `reader.lesson.id` after
      it reads the question row and before `Provider.run` (the lesson id is not in the args). The helper then starts
      a daemon thread that calls `TracerProvider.force_flush(2000)`, so the job's own task never waits (INV-OBS-3).
      The 2000 ms is a request only: SDK 1.45.2's BatchSpanProcessor ignores the timeout and exports everything
      queued, each export bounded by the exporter's 10 s timeout (code review round 1, read from the SDK); the job
      never joins the thread, so only the thread's lifetime grows, and a failed flush is logged once as `obs
      session_marker_failed` (an [unit] test raises inside it);
      with tracing disabled it does nothing (no span, no thread); any exception from opening the span or starting
      the thread is caught and logged once per process as `obs session_marker_failed` (no value), and the job goes
      on. The CLI's first export comes at its exit or its batch interval, after process start-up, so the marker
      normally arrives first. The marker may reach MLflow before its root: MLflow then creates the trace from the
      marker, and the root's later batch must still set the trace's name, tags and cost (an [image] test sends the
      marker, the CLI spans and the root in that order and checks all three). Residual, declared: if the marker's
      export fails or is slower than the CLI's first export, the trace's session is the CLI's (a one-trace
      session); the [live] oracle checks that a tutor trace's session equals its lesson id. Other roots have no
      session. (f) Previews: `mlflow.spanInputs` / `mlflow.spanOutputs` = the JSON object of VEC-OBS-4 `previews`
      for the root's job kind, {preview key: validated value} for the keys the root carries (MLflow unwraps the
      JSON string, measured). The tutor's outcome has its own key, `reader.tutor.state` ∈ {answered, failed,
      refused, expired} (the `tutor_questions.state` at the job's end), beside `reader.job.outcome` (B3). No preview
      key is `model` or another of VEC-OBS-4 `forbidden_preview_keys` (a fixture test fails CI otherwise). (g)
      Linked prompts: FR-OBS-18 (review round 3). (h) Tool spans set status OK on success
      (MLflow's tool-call success rate counts only OK; measured 0.00% with UNSET). INV-OBS-1's property test is
      extended (B3): Hypothesis generates hostile values for every key that feeds a derivation (quotes,
      backslashes, braces, `</script>`, NUL, U+2028, 10 KB strings, NaN, ±inf, floats past the range, UUID
      look-alikes with extra characters) and caller-supplied `mlflow.*` and `session.id` keys; the output then has
      only derived `mlflow.*` keys, each `mlflow.spanInputs`/`Outputs`/`llm.cost` parses as JSON whose keys are
      exactly the table's and whose values pass their rules, `input_cost + output_cost = total_cost` at 6 places,
      and no generated canary appears. [unit, image]
      ADR-0039 amendment (V.kl-obs-spans, 2026-11-26): (f) gains: `mlflow.spanOutputs` is also derived for a span
      that carries `reader.doc.*` keys, by FR-OBS-36's `retriever_documents` table; no other span gains a preview.
  - id: FR-OBS-13
    text: >-
      Child spans where a stage has measurable parts (counts, sizes and durations as numbers; names fixed): tutor
      `tutor.retrieve` RETRIEVER {reader.retrieval.hits, reader.retrieval.candidates} and `tutor.citations` PARSER
      {reader.citations.total, reader.citations.valid}; pipeline `verify.claims` PARSER {reader.claims.total,
      reader.claims.supported} and `verify.lab` TOOL {reader.kernel.cells, reader.kernel.cells_ok, reader.kernel.ms};
      kernel runs inside lab verification `kernel.run` TOOL {reader.kernel.cells, reader.kernel.exit} (the kernel's
      code and output never); ingest `ingest.parse` PARSER {reader.pages, reader.bytes} in `ingest.import`, and
      `ingest.chunk` PARSER {reader.chunks} where the material is chunked, in `search.embed` (Green, 2026-11-24: the
      import writes spans, the embed job chunks them); `search.embed` batches `embed.batch` EMBEDDING
      {reader.embed.vectors, reader.embed.batch}. The
      round-1 draft's `reader.retrieval.top_score` (0..1) is dropped: SRV-SEARCH's fused score is a reciprocal-rank sum
      (`search/fusion.py`), not a 0..1 similarity, and no source bounds it (review, non-blocking). Every key's rule and
      each span's keys are in VEC-OBS-1 (merged from VEC-OBS-4); the span types come from VEC-OBS-4's `span_types`
      table (FR-OBS-12 a). A child that ends with an exception sets status ERROR (no description); otherwise OK
      (FR-OBS-12 h). Measured rendering: the trace detail shows each with its type icon and duration; the tool-calls
      dashboard lists `verify.lab`. [unit, image]
      ADR-0039 amendment (V.kl-obs-spans, 2026-11-26): Unchanged; one sentence added: `tutor.retrieve` stays until
      V.kl-tutor-find moves the tutor onto `find`, which then shows FR-OBS-36's subtree instead, and SRV-TUTOR's
      paired change removes it.
  - id: FR-OBS-16
    text: >-
      Every tab of MLflow 3.18.0's GenAI experiment UI, and what reader-ai puts there (measured before and after in
      spikes/obs-stack round 4, results/20261124T105821-round4-tabs/tabs/): Traces — FR-OBS-12's types, tokens,
      previews, tags, names; the execution timeline ("Show execution timeline", narrow; ADR-0033 offers
      Jaeger). Sessions (Traces/Sessions switch) — FR-OBS-12 (e). Dashboard › Usage — counts, latency p50/p90/p99,
      errors, tokens with the cache split, cost = the ledger's per-call amounts (FR-OBS-12 c). Dashboard › Quality —
      FR-OBS-14. Dashboard › Tool calls — FR-OBS-13's TOOL spans. Prompts — FR-OBS-15. Overview — MLflow's onboarding guide; stays as is.
      Empty, with reasons: Issues (LLM-based issue detection: credit and a provider key in MLflow); Judges and
      Evaluation runs (server-side judges and scorers run as MLflow jobs, and FR-OBS-8 sets
      `MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false`; LLM judges would also spend credit, and code scorers' docker
      executor would need the Docker socket, which ADR-0025 and ADR-0032 keep away from every container; the owner
      may run code scorers locally with `mlflow.genai.evaluate` over exported traces, not built);
      Review (labeling queues need text to label, and traces hold none: the content mode of ADR-0034 was rejected,
      2026-11-24); Datasets (evaluation records need inputs and
      expectations as text; an ids-only dataset has no use in the UI); Agent versions (needs logged models and
      `mlflow.modelId` trace metadata, which an OTLP client cannot set; not measured further); Playground and AI
      Gateway (provider keys and egress; their routes are blocked at the edge, FR-OBS-9). Saved views:
      /observability links ready-made dashboard views; measured that the traces tab's URL carries only `q` (full text
      over span content), `groupBy`, `startTimeLabel`/`startTime`/`endTime` (its filters live in local view state; a
      `filter=` URL showed all rows): dead jobs `?q=dead`, a stage `?q=<stage>`, an error code `?q=<code>`, tutor
      answers `?q=job%20tutor.answer`, sessions `?groupBy=session`, and the Usage, Quality and Tool calls dashboards
      (`#/experiments/0/dashboard/usage|quality|tool-calls`). "Slowest first" has no working URL in 3.18.0
      (`sort`/`dir` did not reorder); the Usage dashboard's latency percentiles stand in. [image, live]
      ADR-0039 amendment (V.kl-obs-spans, 2026-11-26): Evaluation runs (experiment 0) also lists `reader.kind` = eval
      Runs (FR-OBS-39) with their record traces; the Quality dashboard shows LLM_JUDGE assessments next to CODE and
      HUMAN ones; Judges stays empty (scores are computed in the worker, not by MLflow jobs); a saved view
      `?q=<policy_version>` is added.
  - id: FR-OBS-17
    text: >-
      Cost per lesson (owner, 2026-11-24: "pricing of each lesson in traces and other data"). In MLflow (measured,
      round 4): the traces table has a Cost column (Display › Columns › Cost; shows each trace's ledger cost after
      FR-OBS-12 c) and tag columns such as `reader.lesson.id`, but it cannot sort by cost (Sort
      offers only Time, Duration and State; the column's menu offers only "Hide column"); the trace metrics API
      groups span cost only by `span_model_name` or `span_model_provider` (a tag dimension is refused with 400) and
      has no trace-level cost metric; a `trace.tag.\`reader.lesson.id\` = '<id>'` filter works on span cost (0.88 and
      0.67 for the two seeded lessons, equal to their ledger sums). So MLflow shows a lesson's traces and their costs
      (saved view `?q=<lesson id>`: 5 of 10 traces, exactly that lesson's; FR-OBS-16), and the ranking lives in
      reader-ai. FR-OBS-10 gains a fifth view, (e) `lessons`, from the ledger, owner-scoped, over the window. Spend
      is grouped by `agent_spend.lesson_id` (SRV-AGENT writes it on every reserve, settle and void of a call that has
      a lesson; review, non-blocking): ONE grouped query over the owner's `agent_spend` rows created in the window
      with a non-null `lesson_id`, grouping by (lesson_id, run_id, task = 'tutor'), where a group's amount is
      spent(·) of FR-AGENT-9 over its rows: `settled_usd` of settle rows plus `usd` of reserves with neither a settle
      nor a void. So open reserves (a call killed before its settle) count, in compile and tutor alike, and a voided
      reserve counts 0; the page says so ("includes N open reserves" from the same query's count). Per lesson:
      `compile_usd` = the sum over its non-tutor groups (failed attempts and abandoned runs included), `runs` = the
      number of distinct non-tutor run ids, `last_compile_usd` = the amount of the run whose newest row is newest,
      `tutor_usd` = the sum over its tutor groups, `total_usd` = compile_usd + tutor_usd, `open_reserves` = the count
      of open reserves. Then one query for the lessons' and courses' ids and titles (`lessons.owner_id` = the caller;
      this page may show titles, MLflow never gets them), and one for source lengths: `sum(char_length(s.text))` of
      the `material_spans` rows SRV-PIPELINE's `DbSpanReader` loads for the lesson (its `course_plans` row's material
      and pages pdf_first..pdf_last), joined through `materials` with `materials.owner_id` = the caller and
      `course_plans.owner_id` = the caller (owner scope on the length too; review, non-blocking); the database
      returns the number only. `usd_per_1k_chars` = total_usd ÷ (chars ÷ 1000), null when chars is null or 0 (no
      division by zero). `mlflow_url` = `https://localhost:8443/#/experiments/0/traces?q=<lesson id>`. Rows: at most
      200 lessons, those with the largest `total_usd` (ties by lesson id), with `truncated` true when more exist; a
      course total row per course over the returned rows (`usd_per_1k_chars` over their summed non-null lengths).
      No text column but the two titles is returned. Spend on a lesson id with no `lessons` row of the caller (the
      lesson was deleted) is kept as a row with `title`, `course_id` and `course_title` null and `deleted` true
      (every other row has `deleted` false), so the rows' totals equal the ledger's; the page shows it as "deleted
      lesson", and it joins no course total (code review round 1). A soft-deleted lesson (SRV-LESSON FR-LESSON-20:
      `lessons.deleted_at` set) or a lesson of a soft-deleted course (`courses.deleted_at` set) counts as deleted the
      same way: its title is never returned, the page shows "deleted lesson", its spend stays in the totals
      (management code review, 2026-11-24; [db] a test tombstones one lesson, then its course, and expects those
      rows deleted with the same total). The page sorts the rows by any column
      (client-side; default total_usd descending). VEC-OBS-3 gains a lesson whose run has a failed paid attempt (a settle row on an
      attempt whose job ended failed) and an open reserve, so `compile_usd` counts both, a voided reserve (counts 0),
      an open reserve and a settle row created before the window (both excluded: the query filters on
      `agent_spend.created_at`, so a reserve opened before the window counts nowhere in it),
      a second lesson with tutor spend only and no source (null per 1k chars), a lesson with 0 source characters
      (null), another owner's lesson (absent), a second owner who imported the same book (same material sha256)
      with their own spans, which must not change the first owner's chars, a lesson with two compile runs
      (`last_compile_usd` = the newer run's), a deleted lesson's spend, and the expected `lessons` JSON; a [db] test
      also sets the row limit to 1 and expects `truncated` true. [unit, db, live]
  - id: FR-OBS-14
    text: >-
      Under ADR-0035 (accepted 2026-11-24: the worker's assessment and prompt writes to MLflow). Code-sourced
      assessments (MLflow "Quality" dashboard; deterministic outcomes we already compute, never an LLM judge, zero
      credit). The catalogue is data: VEC-OBS-4 `assessments` (name, value type or enum, metadata keys with ranges,
      `source_id`): `fact_check.passed` bool {claims, supported}; `verify.passed` bool; `verify.lab_passed` bool
      {cells, cells_ok}; `tutor.citations_valid` bool {total, valid}; `tutor.citation_share` float 0..1. Freshness is
      not in this revision (review, non-blocking): its assessment is proposed with the freshness spec. The POST body
      is built only by `reader.obs.feedback.body(name, value, metadata)` from that catalogue: `assessment_name` =
      name, `feedback.value` = the value after its rule, `source` = {`source_type`: CODE, `source_id`: the entry's},
      `metadata` = the entry's keys only, each a decimal string within its range, `trace_id` = `tr-<FR-OBS-5 trace
      id>` (MLflow requires it in the body), no `rationale`, no other field; a name, value or metadata key outside
      the catalogue raises before any request. `record` checks the catalogue before it enqueues and, with tracing
      off, returns without enqueueing (code review round 1). Job kind `obs.feedback` (declared
      in `reader.obs.jobs` with SRV-EVENTS' `JobKind`): args {job_id, key, name, value, metadata} (the metadata
      travels in the args, so a retry posts the same body); idempotency key [job_id, name]; `max_attempts` 3 with
      SRV-EVENTS' delays (5 s, 25 s); `timeout_s` 30; the HTTP client timeout 10 s. The code that computes the
      outcome enqueues it with `schedule_in` 60 s (NFR-OBS-1's 30 s plus margin), inside its own try/except: an
      enqueue failure is logged (`obs feedback_enqueue_failed name=<name>`) and never changes the job's outcome or
      result. The run: with tracing off it ends without a request; otherwise it first GETs the trace
      (`…/mlflow/traces/tr-<FR-OBS-5 trace id>`) and ends without a request when an assessment with the same name and
      `source_id` exists (idempotent across retries and a lost response); then it POSTs `…/assessments`. A 404 from
      either call is transient (raised as a `transient` type) while attempts remain; on the last attempt a 404 ends
      without a request with the log line `obs feedback_no_trace name=<name>` (INFO after the GET, WARNING when the
      POST answered 404: the trace existed and then went away), not `dead` (a trace that never
      arrived, e.g. tracing turned off in between, is not a failure of the job); other HTTP errors and timeouts are
      transient; a 4xx other than 404 raises `FeedbackRefused` (the key ends `dead` with that class name). "Ends
      without a request" means the handler returns, so the key ends `succeeded`: SRV-EVENTS gives a handler no
      `skipped` outcome (Green, 2026-11-24). Paths: GET `/ajax-api/3.0/mlflow/traces/get?trace_id=tr-<id>`, POST
      `/ajax-api/3.0/mlflow/traces/tr-<id>/assessments` (the spike's). Measured: 8 of 8 created; the Quality dashboard showed a
      summary row, counts and averages per name, and per-value bars. [unit, db, image]
      ADR-0039 amendment (V.kl-obs-spans, 2026-11-26): The catalogue (VEC-OBS-4 `assessments`) gains a
      `source_type` per entry, CODE or LLM_JUDGE. CODE entries are unchanged and posted only by `obs.feedback`.
      LLM_JUDGE entries (ADR-0035 Decision 1 as amended by ADR-0039) are posted only by the job kind
      `obs.judge_score` (kl_job_kinds; args {score_id} only, the value read from the `obs_eval_scores` row, so no
