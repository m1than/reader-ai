  - { id: R1, answer: "an incomplete Run logs only the params it lacks, read from the runs/search answer; obs.bench's values come from the stored, immutable upload row; round 12: a same-value re-log 200, a changed value 400, runs/search returns the params (FR-OBS-20 c, -23 c)" }
  - { id: R2, answer: "round 12: PATCH /api/2.0/mlflow/logged-models/{id}/tags {tags: [{key: reader.last_started, value: day}]} 200, read back through logged-models/search, a next-day PATCH replaces it (FR-OBS-26; round12.json raw)" }
  - { id: R3, answer: "restore-obs-premigrate removes stale -wal/-shm, prints pre-migrate.version, writes backup/restored-for; mlflow-migrate exits 3 obs_restored_for_other_version until the image matches; reverting the pin is the owner's git action; FR-CLI-24 has the exit-code table (FR-OBS-29)" }
  - { id: R4, answer: "scores recomputed by code over registered records only, file aggregates validated but never stored; the tutor upload is the per-question records file with FR-TUTOR-15's header; kind: search points at results/20261120T195713-draft-questions, noted in spikes/embeddings-local/RESULT.md (FR-OBS-23, VEC-OBS-5)" }
  - { id: non-blocking, answer: "fresh-volume first start declared as a migration with a doctor line; pre-migrate.db counted in the store size; FR-OBS-29's [image] test (flock, non-root, read-only) is the first Red test; the egress test shows the probe reaching MLflow (round 12: /health 200); 0 writes on the same day; the advisory-lock connection hold declared in FR-EVENTS-32" }
# Design review round 4 (03124aa, changes): F1 and the non-blocking items, answered in revision 5.
phase2_review_round4:
  - { id: F1, answer: "FR-OBS-29: step 4 writes store.version; step 2 copies store.version into pre-migrate.version (3.18.0 for a store made before this change); an in-progress marker is written before step 3 and removed after step 4; at start an existing marker exits 10 obs_migration_incomplete before step 2, so the backup is never overwritten; the [image] test names N and N+1: a failed N→N+1 exits 12, a second run exits 10 with pre-migrate.db byte-identical, the restore prints N, then N+1 exits 11 and N starts" }
  - { id: non-blocking, answer: "`db upgrade` from empty marked a hypothesis with its fallback (skip to the server's own initialisation, WAL and store.version at the next run); the first tutor records upload needs a new bench run that spends live-budget credit (declared); tutor_summary moved to spec/fixtures/SRV-TUTOR/bench-summary.yaml; mlflow-migrate exits 10..13, the restore command 0..5" }
# Design review round 5 (46e9017, changes): G1 and the non-blocking items, answered in revision 6.
phase2_review_round5:
  - { id: G1, answer: "a fresh volume writes backup/fresh in step 1 (and under the fallback); step 0 with backup/fresh wipes mlflow.db, -wal, -shm and in-progress and starts fresh, no restore; a successful step 4 clears it; the [image] test kills a fresh volume's first mlflow-migrate (or first server start under the fallback) and the next reader up reaches a served, empty store" }
  - { id: non-blocking, answer: "steps 2-3 skipped when store.version equals the image's (no backup or marker window on normal starts); restore-obs-premigrate requires in-progress or --force (exit 6 otherwise); a crash in step 4 costs a restore and a second bump (declared)" }
# Design review round 6 (4b81738, changes): H1, H2 and the non-blocking items, answered in revision 7.
phase2_review_round6:
  - { id: H1, answer: "the fallback initialises the empty store inside mlflow-migrate with one SqlAlchemyStore call, then step 4, so backup/fresh is always cleared before the server first starts; step 0 with fresh runs db upgrade first and wipes only if it fails; spike round 13 measured both paths (db upgrade on a missing file and the SqlAlchemyStore call: 71 tables, head f4a9b2c7d1e6, no-op second upgrade, health 200), so the hypothesis held for 3.18.0; [image] case: a fallback store served with a trace still holds it after the next migrate" }
  - { id: H2, answer: "reader backup writes obs_mlflow.store.version beside obs_mlflow.db; reader restore puts it back or removes the volume's store.version when the backup has none (FR-OBS-30, FR-CLI-24); [image] case: a backup from N restored under N+1 goes through steps 2-3 and serves its data" }
  - { id: non-blocking, answer: "a --force restore prints the version it rolls back to before copying; the restore exit codes are 0..6 in both FR-OBS-29 and FR-CLI-24" }

