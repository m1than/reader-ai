# The new job kinds (SRV-EVENTS `JobKind`, queue obs, the worker, SRV-EVENTS' delays 5 s and 25 s where retried).
# With tracing off every handler still does its Postgres work and makes no MLflow request.
kl_job_kinds:
  - { kind: obs.eval, args: "{eval_id: uuid, record_no: int 0..999}", key: [eval_id, record_no], max_attempts: 1,
      timeout_s: 180, enqueued_by: "reader.obs.eval.start, in the caller's transaction", note: "a record of a closed run ends without a call" }
  - { kind: obs.eval_run, args: "{eval_id: uuid, check: 0 | 1}", key: [eval_id, check], max_attempts: 3,
      timeout_s: 60, lock: "lock_id(obs.eval:<eval_id>)", enqueued_by: "check 1 by start with schedule_in to the run's deadline; check 0 by the last record", dead: [ObsRunsRefused, ObsRunsDuplicate] }
  - { kind: obs.eval_sample, args: "{slot: datetime truncated to the interval}", key: [slot], max_attempts: 1,
      timeout_s: 30, enqueued_by: "the worker's periodic scheduler at the policy interval; off by default", note: "calls start in mode sample" }
  - { kind: obs.judge_score, args: "{score_id: uuid}", key: [score_id], max_attempts: 3, timeout_s: 30,
      schedule_in_s: 60, enqueued_by: "obs.eval, after its rows commit", transient: [TraceMissing], dead: [FeedbackRefused] }
  - { kind: obs.align, args: "{proposal_id: uuid, step: int 0..100}", key: [proposal_id, step], max_attempts: 1,
      timeout_s: 180, enqueued_by: "POST /api/obs/labels (step 0) and each step (the next)", note: "a lost step leaves the row running until obs.retention sets step_lost" }

# ADR-0039 wording that this spec reads in a defined way (notes, not amendments).
kl_adr_notes:
  - "B7 labels item 6 and B7b: alignment's `judge.find` re-runs run on the worker on the `eval` line, not on the `worker-judge` lane. B7b places the online judge on the lane; an offline re-run of a candidate is evaluation work paid by the owner (B7 `judge.align` row: owner, `eval` line, worker), so this reads the ADR, not amends it; nothing of it is recorded as a judge output."
  - "B9 'only scores reach MLflow, as code-written assessments with source LLM_JUDGE' from the `obs.eval` job: the scores are computed in `obs.eval` and posted by its follow-up kind `obs.judge_score` (args {score_id}), so a failed post is retried without repeating a judge call."
  - "B9 'TOOL root': the `find` span is the root of the find subtree; it is a child of the current request or job span when one exists, and a trace root only when none does."
  - "B9 'ROUTER with the route and filters': single-valued facet filters are enums; question-derived filters are counts and hashes; a concept id is exported only as reader://h/<sha256>, since a term concept's id may carry book text (stricter than B9's 'a concept id or a hash')."
  - "B7 labels item 1 'an optional one-line reason': for judge targets this is the free-text `note` (Postgres only); lesson and answer labels keep FR-OBS-24's reason enum."
  - "B7b 'copies the query and card ids to judge_inputs': the output is stored as ordinals into the copied card ids (SRV-AGENT FR-AGENT-22's parsed form)."
  - "B9 'judges ... on sampled traces (by trace id)': sampling is over judge_inputs rows (gated, consenting finds); the trace id is where the score is posted."

# Text that does leave the span/MLflow boundary, all in Postgres and owner-only or lane-only (declared residuals).
kl_text_paths:
  - "judge_inputs.query: consenting callers only, for up to retention_days; when a caller withdraws `consent_evaluation`, the paired SRV-AUTH change nulls that caller's stored queries and sets labelable false in the same transaction (declared; a label already made keeps its row, without the query)."
  - "obs_eval_runs.set_doc: the pinned set (committed text: questions and expected facts)."
  - "judge_prompt_proposals.candidate_text / proposed_text: guarded model text, until discarded; the export's files outside the work tree."
  - "owner_labels.note: the owner's own one-line note."
  - "In memory only: card text in obs.eval, obs.align and the item route; model replies, dropped after parsing."

