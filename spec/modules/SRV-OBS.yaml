# Numbers used below, each with its kind.
bounds:
  - { name: batch export, value: "BatchSpanProcessor schedule_delay 5,000 ms, max_queue_size 2,048, max_export_batch_size 512, export timeout 10 s", kind: "library defaults (REF-OBS-2), except the timeout: structural, so a dead Rotel never holds a flush longer than one compose stop budget (10 s). Limit, measured (spikes/obs-stack round 1): a burst of more than 2,048 spans faster than the exporter drains drops spans in the SDK ('Queue full, dropping Span'); one lesson stage is 72 spans over minutes" }
  - { name: shutdown flush, value: "2 s", kind: "structural: below SRV-EVENTS' 8 s graceful timeout and Compose's 10 s stop timeout; spans not flushed by then are dropped (telemetry is lossy, ADR-0018)" }
  - { name: load, value: "≈ 3 spans/s for a whole-book compile in one hour (ADR-0018 hypothesis); a lesson ≈ 7 job traces × 72 spans", kind: "hypothesis (ADR-0018), replayed in spikes/obs-stack" }
  - { name: retention, value: "30 days default, 1..365 allowed (`observability.retention_days`)", kind: "structural: traces are diagnostic; evaluation data of record is agent_spend, compile_steps and tutor_questions, which never come from telemetry (ADR-0018 rule 1). Storage is not the constraint (spikes/obs-stack: 927 bytes per span)" }
  - { name: retention period, value: "once per day at 03:00 UTC, plus once per worker start", kind: "structural: deletion is idempotent; one REST call deleted 132–178 traces in ≤ 0.08 s (spikes/obs-stack)" }
  - { name: memory, value: "mlflow mem_limit 1g, rotel 256m", kind: "measured (docker stats incl. page cache): MLflow 581 MiB at its first idle start (spikes/trace-backend; × 1.25 = 726 ≤ 1,024) and 443 MiB peak under an 8-minute lesson replay plus a 10,080-span bulk (spikes/obs-stack); Rotel ≤ 41 MiB (spikes/trace-backend; × 1.25 = 51 ≤ 256). Revised from the stage-2 live check's cgroup memory.peak" }
  - { name: storage, value: "927 bytes per span (SQLite); a whole-book compile ≈ 10 MB", kind: "measured: spikes/obs-stack, 10,080 spans → +9,342,976 bytes" }
  - { name: summary limits, value: "compile runs: the newest 50 in the window; ingest: the newest 50 imports; failures: up to 5 trace ids per group; tutor: the slowest 10; recent_keys_of: at most 500 key rows per call", kind: "structural: one owner, one page. The 500 bounds a published read that limits before owner scoping; when it is reached the view says so (`truncated`), it never silently undercounts" }
  - { name: attribute string length, value: "≤ 128 characters after the value rule", kind: "structural: every allowed string is an id, an enum or a route template (VEC-OBS-1); the longest is a route template" }

requirements:
  - id: FR-OBS-1
    text: >-
      Setup. `reader.obs.setup(role, settings)` is called once by `reader-server --role api|worker` before serving
      (paired SRV-AUTH change) and returns a handle whose `shutdown()` flushes for at most 2 s. When
      `settings.observability.enabled` is false (paired SRV-CONFIG change; default true), it installs nothing: the
      global tracer provider stays OTel's no-op provider, no exporter, thread or socket exists, and every FR-OBS-3..6
      call path still runs. When enabled, it installs one `TracerProvider` with the resource exactly
      `{service.name: "reader-<role>", service.version: <reader package version>}`, the parent-based always-on sampler,
      the `IdGenerator` of FR-OBS-5, one BatchSpanProcessor built with exactly `BATCH` (the `bounds` values) feeding the
      AllowListExporter (FR-OBS-2), which wraps an OTLP/HTTP protobuf exporter built with exactly the endpoint
      `http://rotel:4318/v1/traces`, a 10 s timeout and no headers (`EXPORTER_KWARGS`, checked by a unit test); the
      exporter merges `OTEL_EXPORTER_OTLP_HEADERS` and `OTEL_EXPORTER_OTLP_TRACES_HEADERS` from the environment
      whatever its `headers` argument says, so both are absent from the environment while it is built (code review
      round 1). Every tracer is obtained under the one instrumentation scope `reader` (a constant, no version). The
      global propagator is W3C tracecontext only (no baggage). The direct dependencies `opentelemetry-sdk` and
      `opentelemetry-exporter-otlp-proto-http` are pinned at 1.45.2 (the spike versions; `opentelemetry-api` 1.45.2 is
      already in uv.lock); uv.lock adds only what those two require (opentelemetry-proto, -semantic-conventions,
      -exporter-otlp-proto-common, -exporter-otlp-common and -exporter-http-transport). No instrumentation library and
      no other OpenTelemetry package is added. The `mcp` role is not traced in this revision (declared gap).
  - id: FR-OBS-2
    text: >-
      Allow-list. VEC-OBS-1 (spec/fixtures/SRV-OBS/attributes.yaml) declares, as data, every span name pattern and
      every attribute key the api and worker may export, each key with a type (string, int, float, bool), a value rule
      (an enum, an enum computed at setup from a code-declared catalog, a regular expression anchored at both ends, or
      a numeric range) and the span kinds that may carry it. `AllowListExporter.export` rebuilds every span before the
      OTLP exporter sees it: a name matching no pattern becomes `reader.unlisted`; an attribute whose key is not
      listed for that span, whose type differs or whose value fails its rule is removed; the status keeps its code
      and loses its description; every event is removed; links keep trace id, span id and flags and lose their
      attributes and tracestate; the span's own tracestate is cleared; the resource is replaced by FR-OBS-1's two
      keys; the instrumentation scope is replaced by the constant `reader`. A removed key is logged once per process
      at WARNING as `obs dropped key=<key>` (the key only, never a value; a key that fails `^[a-z][a-z0-9_.]{0,63}$`
      is logged as `key=<invalid>`); nothing else is counted. The exporter never raises: any exception inside it
      drops that batch and returns FAILURE. Spans from the Agent SDK's CLI do not pass through this exporter (the CLI
      exports to Rotel itself); FR-OBS-6 bounds what they carry.
  - id: FR-OBS-3
    text: >-
      HTTP and WebSocket spans. An ASGI middleware (`reader.obs.asgi.TraceMiddleware`, installed outermost by the api
      app factory, paired SRV-AUTH change) opens one SERVER span per HTTP request and per WebSocket session whose path
      starts with `/api/`, except `/api/healthz` and `/api/obs/gate` (the gate runs on every dashboard request and
      would bury the app's traffic). Name `<METHOD> <route>` for HTTP and `WS <route>` for WebSocket, where `<route>`
      is the template of the registry route that served the request (`/api/lessons/{lesson_id}`), or `other` when no
      route matched. Attributes: `http.request.method` (the nine standard methods, else `_OTHER`), `http.route` (as in
      the name), and at the end `http.response.status_code` (HTTP) or `reader.ws.close_code` (WebSocket); an
      unhandled exception sets status ERROR without a description. The span never carries the raw path, path
      parameter values, query string, headers, cookies, client address or body. A `traceparent` header from the
      client is ignored: every request starts a new trace (the edge is untrusted input). The WebSocket span covers the
      session from accept to close (kernel session lifecycle); no span is opened per message, and no kernel code,
      output or message field becomes an attribute.
  - id: FR-OBS-4
    text: >-
      Log lines. The middleware writes one INFO line per traced request on logger `reader.obs.http`, after the
      response: `request method=<m> route=<route> status=<code> ms=<int> trace=<32 hex>` (WebSocket: `ws route=<route>
      close=<code> ms=<int> trace=<32 hex>`), with the same values as the span and nothing else; uvicorn's access log
      stays off; `/api/healthz` and `/api/obs/gate` get no line. A logging filter on reader-server's `reader` handler
      (paired SRV-AUTH change) appends ` trace=<32 hex>` to every `reader.*` record emitted while a recording span is
      current, so every request and job line carries its trace id; with tracing disabled no ` trace=` suffix is
      added. The filter never adds anything else and is idempotent (a record passing it twice gets one suffix).
  - id: FR-OBS-5
    text: >-
      Jobs (paired SRV-EVENTS change). (a) Enqueue: `Jobs.enqueue` and every internal re-defer pass a second
      procrastinate task kwarg `trace`, the W3C traceparent (REF-OBS-1) of the current span when it is valid and
      sampled, and omit it otherwise; `job_keys.args`, the idempotency key and FR-EVENTS-10's payload checks are
      unchanged (`trace` is not part of `args`). (b) Run: the wrapper opens the job's root span `job <kind>` (kind
      CONSUMER) in a new trace, with exactly one link to the parsed `trace` context when it parses and is valid, and
      none otherwise; parsing never raises. Its trace id is derived, not random: the first 16 bytes of the SHA-256
      of the bytes `reader.job`, NUL, the job id written as decimal ASCII digits (no sign, no leading zeros), NUL,
      and the idempotency key encoded UTF-8; an all-zero result is replaced by bytes 16..31. VEC-OBS-3's keys and
      ids are generated, never hand-written, by `spec/fixtures/SRV-OBS/trace-ids.mjs` (a fixture helper only); the
      gate is the [unit] test that recomputes every key with `reader.jobs.model.idempotency_key` and every id with
      this derivation in Python and fails CI on a difference. Installed through the `IdGenerator` FR-OBS-1 installs (a context variable set only around the root span's creation;
      every other span gets a random id). So the owner's views (FR-OBS-10) compute any job's trace id from a key row's
      `job_id` and `key` (read through SRV-EVENTS' published functions) without storing it. Attributes: `reader.job.kind`, `reader.job.id`,
      `reader.job.attempt` (the key's attempt count at claim), the per-kind argument attributes of VEC-OBS-1
      `job_args` (no other argument is read), and at the end `reader.job.outcome` ∈ {succeeded, skipped, failed,
      dead, aborted} with `reader.error_code` (FR-OBS-2's catalog rule) or `reader.error_class` (the exception class
      name FR-EVENTS-6 records when the code is not in the catalog). (c) Re-enqueues made inside a run (FR-EVENTS-6's
      retry, FR-EVENTS-4's lost-run re-enqueue, and handler enqueues through `running()`, e.g. a pipeline stage
      enqueuing the next) carry the running job span's context, so consecutive jobs are linked; enqueues from the
      sweep (FR-EVENTS-7, -15) and from start hooks carry none and start unlinked traces. (d) Declared gaps:
      an enqueue that returns `already_queued` keeps the waiting job's original `trace` (or none), so the second
      caller's link is lost; after a rollback to a worker without this change, procrastinate refuses jobs whose kwargs
      carry `trace` (unexpected keyword) until they are re-deferred by the new worker or cancelled (never run two
      worker versions, SRV-EVENTS owner note); a derived id collides only for the same (job id, key), which a database
      reset or a `reader restore` of an older dump re-issues, merging spans into an older trace inside the retention
      window; a worker killed mid-run never exports its root span, so the trace's children appear without a root
      until retention deletes them; when stage-2's outbox takes over enqueueing (SRV-EVENTS defers), the outbox row
      must capture the traceparent at the state change, or the link is lost.
  - id: FR-OBS-6
    text: >-
      Agent calls (paired SRV-AGENT change). `Provider.run` opens span `agent.call` (kind CLIENT) and keeps it current
      while the CLI runs, so the SDK injects TRACEPARENT and TRACESTATE into the CLI environment (claude-agent-sdk
      0.2.187 `subprocess_cli.py`; measured, spikes/cli-otel-content) and the CLI's `claude_code.interaction` span is a
      child of `agent.call`. Attributes: `reader.task`, `reader.stage` (when the call has one), `gen_ai.request.model`
      (the resolved id), and after the result `gen_ai.usage.input_tokens`, `gen_ai.usage.output_tokens`,
      `gen_ai.usage.cache_read_input_tokens`, `gen_ai.usage.cache_creation_input_tokens`, `reader.cost_usd` (the
      call's settled amount, FR-AGENT-9), `reader.stop_reason` and `reader.error_code`; cost is ours because the CLI's
      spans carry tokens but no cost (measured). When tracing is enabled, FR-AGENT-6's CLI environment gains exactly:
      `CLAUDE_CODE_ENABLE_TELEMETRY=1`, `CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1`, `OTEL_TRACES_EXPORTER=otlp`,
      `OTEL_METRICS_EXPORTER=none`, `OTEL_LOGS_EXPORTER=none`, `OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf`,
      `OTEL_EXPORTER_OTLP_ENDPOINT=http://rotel:4318`, and the content flags `OTEL_LOG_USER_PROMPTS=0`,
      `OTEL_LOG_ASSISTANT_RESPONSES=0`, `OTEL_LOG_TOOL_CONTENT=0`, `OTEL_LOG_TOOL_DETAILS=0` (the CLI's defaults are
      already off, measured; set explicitly so an inherited value cannot turn them on). `OTEL_LOG_RAW_API_BODIES`,
      `ENABLE_BETA_TRACING_DETAILED` and `BETA_TRACING_ENDPOINT` are left blank like every other variable FR-AGENT-6
      passes blank (`OTEL_LOG_RAW_API_BODIES` takes `inline` or a directory, so `0` is not a documented "off").
      When tracing is disabled none of these is added. The CLI privacy bound is enforced by tests, not by this
      process's exporter: (a) [unit] the `claude-agent-sdk` version in `server/uv.lock` equals `cli.sdk` of VEC-OBS-2,
      so a pin change fails CI until the canary is rerun and VEC-OBS-2 regenerated; (b) [image] the canary harness
      (`server/tests/obs/cli_canary/`, moved from spikes/cli-otel-content in Red: Dockerfile, stub upstream, capturing
      OTLP receiver, probe) asserts INV-OBS-2's CLI half and that every exported CLI span name, attribute key and
      resource key is in VEC-OBS-2; (c) [live] the same subset check on the CLI spans of the live tutor trace, under
      the owner's real account. The canary also reruns if any call ever declares tools (FR-AGENT-7 forbids it today;
      tool spans and tool content were not measured).
  - id: FR-OBS-7
    text: >-
      Coverage of the owner's flows, by construction from FR-OBS-3, -5 and -6 (no module-specific span beyond
      `agent.call`): a tutor answer is the `job tutor.answer` trace (linked from `POST` of the question) with its
      `agent.call` and the CLI's spans; a compile is one `job pipeline.stage` or `job pipeline.verify` trace per
      stage, linked in order; ingest import is `job ingest.import` (the host-side conversion of SRV-INGEST runs outside
      the stack and is not traced); search is the request span of its route plus `job search.embed` for embedding;
      a kernel session is its WebSocket span (FR-OBS-3). agent-proxy, the mcp role and the kernel containers are not
      instrumented and have no route to Rotel.
  - id: FR-OBS-8
    text: >-
      Collector and backend (deploy/otel/**, wired by the paired OPS-DEPLOY change). Profile `observability`:
      `rotel` runs `streamfold/rotel:v0.2.7@sha256:<digest>` with the image's entrypoint (receivers 4317 and 4318) and
      command `--exporter otlp --otlp-exporter-endpoint http://mlflow:5000 --otlp-exporter-protocol http
      --otlp-exporter-custom-headers x-mlflow-experiment-id=0` (experiment 0, which a fresh MLflow store creates);
      `mlflow` runs `reader-mlflow:local`, built from `deploy/otel/mlflow.Dockerfile` `FROM
      ghcr.io/mlflow/mlflow:v3.18.0@sha256:<digest>`, which creates `/var/lib/mlflow` owned by `10004:10004` before
      `USER 10004` and adds nothing else (no driver: the store is SQLite, ADR-0032), with command `mlflow server
      --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri sqlite:////var/lib/mlflow/mlflow.db
      --artifacts-destination /var/lib/mlflow/artifacts --default-artifact-root mlflow-artifacts:/ --allowed-hosts
      localhost:8443,mlflow:5000,mlflow` and the environment exactly `MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false` and
      `MLFLOW_DISABLE_TELEMETRY=true` (no secret: MLflow holds none). Both run non-root (rotel 10005), `read_only:
      true`, tmpfs `/tmp`, `cap_drop: [ALL]`, `no-new-privileges`, `mem_limit` equal to `memswap_limit` (bounds);
      measured to start so in spikes/obs-stack. Healthchecks: rotel `["CMD", "bash", "-c", "exec
      3<>/dev/tcp/127.0.0.1/4318"]` (the image has bash and no HTTP client; Rotel has no health endpoint), mlflow
      `["CMD", "python", "-c", "import urllib.request,sys;
      sys.exit(urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=2).status!=200)"]`. Networks, internal,
      with explicit subnets (the owner's Docker Desktop has no free predefined pool, measured; 10.230.2.0/24,
      10.230.3.0/24 and 10.230.4.0/24 were unused on 2026-11-24 by `docker network inspect` of every network, where
      only 10.230.1.0/24 (reader_front) and two /28s in 10.231.0.0/16 exist): `otel` 10.230.2.0/24 with exactly api,
      worker and rotel; `obs` 10.230.3.0/24 with exactly rotel, mlflow and worker (the retention job, FR-OBS-11;
      ADR-0032 amends ADR-0025 rule 5 for it); `obs-ui` 10.230.4.0/24 with exactly caddy and mlflow. So caddy shares no
      network with rotel or the worker. The volume `obs_mlflow` is mounted only by mlflow, label
      `org.reader-ai.backup=exclude` (traces are diagnostic; the data of record is in Postgres). Turning tracing off
      removes rotel and mlflow and keeps the volume; turning it on again finds the old traces, which the next
      retention run trims. Egress: none; no service of the profile is on `edge` or `egress`, and MLflow's server
      telemetry is off.
  - id: FR-OBS-9
    text: >-
      Dashboard access (ADR-0032; paired OPS-DEPLOY and OPS-CLI changes). Caddy serves a second site `localhost:8443`
      (`tls internal`); `127.0.0.1:8443:8443` is published by `reader up`'s in-memory override only while the profile
      is active (the base compose.yaml publishes 443 only). Every request is first sent by `forward_auth
      10.230.1.10:8000 { uri /api/obs/gate }`. Then, in this order, as mutually exclusive `handle` blocks (a `respond`
      next to a catch-all `handle` never runs, because Caddy orders `handle` first: measured, spikes/obs-stack round
      2, where /v1/traces reached MLflow): `handle @blocked { respond 404 }` with `@blocked path_regexp
      (?i)^/+(?:(?:v1|gateway)(?:/|$)|mcp|(?:ajax-api|api)/+[^/]+/+mlflow/+(?:assistant|gateway|gateway-proxy)(?:/|$))`
      (exactly this regexp in the Caddyfile; the adapt test checks it): the OTLP receiver, the AI gateway, MLflow's
      MCP server, and the assistant, gateway and gateway-proxy routes at any depth under both `/api/<v>/mlflow/` and
      `/ajax-api/<v>/mlflow/`, case-insensitive and with repeated slashes (code review round 1 measured on the pinned
      caddy that a middle `*` of a `path` pattern matches one segment only, so deep gateway, assistant and
      gateway-proxy paths reached MLflow); and `handle { reverse_proxy mlflow:5000
      { header_up -Cookie; header_up -Authorization; header_down -Set-Cookie; header_down -Access-Control-* } }` with
      the Host header unchanged (MLflow's `--allowed-hosts` accepts only `localhost:8443` from the edge). The site's
      response headers are the main site's except the Content-Security-Policy, which is exactly `default-src 'self';
      script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;
      worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none';
      form-action 'self'` (measured in a headless browser, spikes/obs-stack round 2: the strictest base policy blocked
      only inline styles; with this policy no violation on the UI, the traces list or a trace's detail, and no request
      to another host). It stays within the ceiling: no `'unsafe-inline'` or `'unsafe-eval'` in script-src, no host
      source other than `'self'`, `connect-src 'self'`; a future MLflow that needs more blocks its upgrade for the
      owner. The route `GET /api/obs/gate` (`reader.obs.routes`, registered through ROUTERS, paired SRV-AUTH change)
      answers, in this order: 403 when an `Origin` header is present and is not exactly `https://localhost:8443`; 403
      when `X-Forwarded-Method` is not GET or HEAD and `Origin` is not exactly `https://localhost:8443` (MLflow 3.18.0
      answers every localhost origin with credentialed CORS: measured, `Access-Control-Allow-Origin:
      http://localhost:3000` on a direct request, so a page on any other localhost port could otherwise read or write
      with the owner's cookie); 403 when `Sec-Fetch-Site` is present and is neither `same-origin` nor `none`, except a
      top-level navigation: `Sec-Fetch-Site: same-site` together with `Sec-Fetch-Mode: navigate`,
      `Sec-Fetch-Dest: document` and a forwarded method of GET passes on (a click from
      https://localhost/observability arrives `same-site`); every other `same-site` or `cross-site` request (an image,
      script, worker or fetch included) is 403; then 204 with no body for a session (SRV-AUTH's cookie lookup) whose
      user has role `owner`, 401 without a valid session, 403 for any other user. Measured in a real browser
      (spikes/obs-stack round 3, from a page on another port of the same site): the click arrived
      `same-site/navigate/document`, passed, and opened the trace's span tree; an `<img>`, a `<script>`, a no-cors
      fetch and a CORS fetch from that page arrived `same-site` with Dest `image`, `script`, `empty`, `empty` and were
      all refused. Caddy appends the original query string to the gate's URI (measured), so the gate ignores its own
      query. It never sets or refreshes a cookie, never extends a session, is GET only (forward_auth always sends GET),
      and is neither traced nor logged per request (FR-OBS-3, -4). Declared residual, not audited: the navigation
      exception lets a same-site page open any MLflow UI route with a URL fragment it chose; if some MLflow UI route
      performs a write on load from its fragment (rather than on a user action), such a page could trigger it with the
      owner's session. The MLflow 3.18.0 UI routes were not audited for this; the writes it could reach are MLflow's
      own (traces, assessments, tags, experiments), never reader-ai's, and the app's routes stay behind SRV-AUTH's
      Origin check. A 401 is returned to the browser
      as is: the dashboard does not redirect to sign-in; the owner signs in at https://localhost and reloads (owner
      note). The same route is also reachable as https://localhost/api/obs/gate through the main site, where it tells
      a caller only whether its own session is the owner's, which `GET /api/me` already does. Defence in depth only,
      not relied on: MLflow 3.18.0 answered a `text/plain` body with 400 on the two measured JSON endpoints
      (experiments search, delete-traces); other endpoints were not measured, and the gate's Origin rules are what
      refuse a cross-origin POST.
  - id: FR-OBS-10
    text: >-
      The owner's views. MLflow 3.18.0's trace metrics group span cost only by model name or provider and trace counts
      only by trace name or status (REF-OBS-5), so cost per stage per lesson and failures by error code cannot be
      expressed there. `GET /api/obs/summary?days=<1..90, default 7>` (owner only: 401 without a session, 403 for
      another role; `days` must fully match `^[0-9]{1,2}$`, ASCII digits only, and lie in 1..90, else 400 `days`:
      code review round 1 found `days=²` passing `str.isdigit` and failing `int` with a 500) returns JSON computed from reader-ai's own tables, read-only, over the window. User-owned tables
      are read with `owner_id` = the caller's id. `job_keys` is never queried by SQL from this module (SRV-EVENTS
      FR-EVENTS-17: no module queries it directly): its rows come only through the read functions the paired
      FR-EVENTS-18 publishes next to `job_status_of` and `dead_error_code_of`: `key_rows_of(conn, keys)` (keys of any
      kinds; the `<kind>:` prefix carries the kind; served by the primary key) and `recent_keys_of(conn, kind_names,
      outcome, since, limit)` (served by the index FR-EVENTS-18 adds on (kind, outcome, finished_at)), each returning
      rows of (kind, key, args, outcome, error_code, job_id, attempts, created_at, finished_at), and `recent_keys_of`
      also a `truncated` flag that is true when it returned `limit` rows. The keys this module asks for are computed
      with SRV-EVENTS' `idempotency_key` (FR-EVENTS-2) from the owner's own rows. What each view runs: (a) one query
      for the runs, one for their spend, one for their steps, then one `key_rows_of` for all steps' keys, one key per
      step under the one kind SRV-PIPELINE enqueues for that stage (`pipeline.verify` for lab verification,
      `pipeline.stage` for every other stage); (b) one query for the questions, one for the tutor settle rows, then one
      `key_rows_of` for the slowest 10; (c) one `recent_keys_of` over every kind, then ownership queries bounded by
      the ids the dead rows name (the owner's runs among their run_ids, the owner's questions among their
      question_ids, the materials rows of their material_sha256 values; code review round 1), one for failed questions, and one `key_rows_of` for those failed
      questions' `tutor.answer` keys (their trace ids); (d) one `recent_keys_of` for `ingest.import` and one query for
      the owner's materials. `recent_keys_of` limits before owner scoping, so a view built from it carries
      `truncated` and the page shows "more rows may exist" when it is true:
      (a) `compile_runs`: the newest 50 runs started in the window, each with lesson id, started and finished times,
      `spent_usd` = SRV-AGENT's spent(run) (FR-AGENT-9: settled_usd of settle rows plus the usd of reserves with neither
      a settle nor a void, over `agent_spend` rows of the run_id), and its steps from `compile_steps` (stage, cost_usd,
      duration_s, model; the per-step cost stays the step's own record) with `trace_id`: FR-OBS-5's derivation from
      the key row whose key is `idempotency_key` of the step's (run_id, step, stage, input_sha256) under the stage's
      one kind (above), using that row's `job_id` (the newest job that ran the key) and `key`; null when no row
      or no job id exists;
      (b) `tutor`: count, latency p50 and p95 in ms (`finished_at − created_at` of answered questions, nearest-rank
      percentiles), `cost_usd_sum` = the sum of `settled_usd` over the owner's `agent_spend` settle rows of task
      `tutor` in the window, `cost_usd_mean_per_settled_call` = that sum divided by the number of those settle rows
      (one per billed provider call, failed answers included; null when there are none), and the slowest 10 with their
      trace ids (the `tutor.answer` key of the question id);
      (c) `failures`: counts by (kind, error_code) of key rows with outcome `dead` finished in the window, from
      `recent_keys_of(all kinds, dead, window, 500)`. User kinds are scoped: `pipeline.*` rows count when their args run_id is one
      of the owner's runs, `tutor.answer` rows when their question_id is one of the owner's questions, `ingest.import`
      rows when a materials row of the owner has their material_sha256. System rows are shown unscoped and marked
      `system: true` on this owner-only page (`ingest.import` with no materials row, `search.embed`, `obs.retention`,
      and any kind not listed here); key rows hold ids, codes and times, no text. Plus counts by error_code of the
      owner's failed `tutor_questions`. Each group carries up to 5 most recent trace ids;
      (d) `ingest`: the newest 50 `ingest.import` key rows that succeeded in the window and belong to the owner's
      materials (from `recent_keys_of(["ingest.import"], succeeded, window, 500)`), each with the material's `page_count`, the import job's duration (`created_at` to `finished_at` of the
      key row, which includes queue wait) and `pages_per_min_import` = page_count over that duration in minutes (the
      in-stack import only; host-side conversion time is not included). No text column (questions, answers, reports, titles) is read. A web page `/observability`
      (paired WEB-UI change, owner only) renders the four views and links every trace id to
      `https://localhost:8443/#/experiments/0/traces?selectedEvaluationId=tr-<trace id>` (measured: this opens the
      trace's detail with its span tree; `selectedTraceId` does not). A trace id is given only for a trace that can
      exist (live check 2026-11-24: links of jobs that ran before tracing existed left MLflow on its loading
      skeleton): table `obs_tracing (started_at timestamptz primary key, enabled boolean)`, Alembic branch `obs`
      (`server/src/reader/obs/migrations`, revision obs_0001, paired SRV-AUTH VERSION_LOCATIONS change), gets one row
      per worker start from `reader.obs.jobs.on_worker_start` (`clock_timestamp()`, `observability.enabled`; tried 3
      times, 1 s apart, then logged). A key row's moment is its `finished_at`, else its `created_at`; its trace id is
      shown only when tracing is enabled in the api now, the latest `obs_tracing` row at or before that moment (by
      `started_at`, whatever order the rows come in) says `enabled`, and the moment is not older than the last
      `retention_days` (a moment exactly at the cutoff counts; older traces are deleted, FR-OBS-11); otherwise
      `trace_id` is null (the page shows "no trace") and a group's `trace_ids` omit it. The rows read are those
      started within the window plus the one latest before it. obs_0001 backfills one `enabled` row at the
      `created_at` of the oldest `obs.retention` key row (the first worker start with the obs code, which enqueues
      that day's key), so jobs traced before the table existed keep their links; it assumes tracing was on then
      (the default). Declared (live-fixes review): one worker is assumed (with several, one start's row decides for
      all); a job still running when its worker was killed, and a job queued while tracing was on that never ran,
      can get a link to a trace that does not exist (their moment falls in an enabled period); so can every job of
      a start whose row could not be written after tracing was turned off.
  - id: FR-OBS-11
    text: >-
      Retention. Job kind `obs.retention` (`reader.obs.jobs`, listed in SRV-EVENTS' KIND_MODULES; args `{day:
      YYYY-MM-DD}`, key `[day]`, max_attempts 3, transient connection errors, timeout 60 s). Its handler first enqueues
      the next day's key, whose day is the argument day + 1 (a calendar day in UTC, never "today + 1", so a late or
      retried run cannot skip or repeat a day), with `schedule_in` the seconds from now to 03:00 UTC of that day (0
      when already past), so a day that ends dead never stops the chain (the enqueue is idempotent per key; a failed
      enqueue is tried 3 times in the run, 1 s apart, then logged and today's delete still runs); then it calls
      MLflow's REST `POST http://mlflow:5000/api/2.0/mlflow/traces/delete-traces`
      once with `{"experiment_id": "0", "max_timestamp_millis": now − retention_days × 86,400,000}` (no `max_traces`:
      MLflow 3.18.0 sets no server cap and one call deleted 178 traces in 0.05 s, measured). `on_worker_start`
      enqueues today's key. With tracing disabled the kind is still declared and its handler returns at once after
      enqueuing the next day (so a disabled profile never leaves dead keys). MLflow unreachable is transient; any other
      HTTP failure (any non-200, and a 200 whose body is not a JSON object or carries a non-integer `traces_deleted`;
      an absent `traces_deleted` is 0, as protobuf JSON omits zero values) raises
      `RetentionFailed`, so the day's key ends `dead` with `error_code` `RetentionFailed` (FR-EVENTS-6
      records a permanent failure by its class name; amended at Red, 2026-11-24, from `obs_retention_failed`, which no
      job wrapper can write). SQLite does not shrink on delete (measured);
      freed pages are reused, so the store's size stays bounded by the retained traces. In the same run the handler
      deletes the `obs_tracing` rows (FR-OBS-10) started before now − `retention_days`, except the latest of them,
      which still decides the rows between the cutoff and the next start.

invariants:
  - id: INV-OBS-1
    text: >-
      For any span the api or worker builds, with any name, attributes, events, status description, tracestate,
      instrumentation scope and links (Hypothesis-generated, including the canary strings below), what
      AllowListExporter hands to the OTLP exporter has a name matching VEC-OBS-1 or `reader.unlisted`, only keys
      listed for that span with values passing their rules, no events, no status description, empty tracestate on the
      span and its links, link attributes empty, the instrumentation scope `reader`, and the resource of FR-OBS-1.
  - id: INV-OBS-2
    text: >-
      Canary. With book-text, question, answer, system-prompt, run_token and secret canaries placed in a request path
      parameter, query string, header, cookie and body, in a tutor question and answer, a stage's prompt and output,
      a job's args, an exception message and the process's resolved settings, the bytes the OTLP exporter sends
      (captured by an in-test OTLP/HTTP receiver) contain none of them, decoded or raw. For the CLI: under FR-OBS-6's
      environment the bundled CLI's OTLP export contains no prompt, system-prompt, response or run_token canary, its
      span names and attribute and resource keys are a subset of VEC-OBS-2, and the same harness with
      OTEL_LOG_USER_PROMPTS=1 finds the prompt canary (positive control).
  - id: INV-OBS-3
    text: >-
      Telemetry never changes an outcome: with Rotel unreachable, refusing, slow (beyond the export timeout) or
      returning 500, every request's status and body and every job's outcome equal those with tracing disabled, no
      exception leaves an OTel call, and no export runs on the request's or job's own task (export runs only on the
      BatchSpanProcessor's thread; a full queue drops spans instead of waiting).
  - id: INV-OBS-4
    text: >-
      Propagation. A job enqueued inside an active span has exactly one link, to that span's context; its root span
      is in a new trace whose id equals FR-OBS-5's derivation from (job id, key); a malformed, unsampled or all-zero
      `trace` gives no link and no error; a retry or a handler enqueue made inside a run links to the running job's
      root span; a sweep re-enqueue has no link.
  - id: INV-OBS-5
    text: >-
      Owner-only, through Caddy on localhost:8443, before any byte reaches MLflow: every path answers 401 without a
      session cookie and 403 with a learner's session; with the owner's cookie, a POST whose Origin is a foreign
      localhost origin (`https://localhost:3000`), the app origin (`https://localhost`) or absent answers 403, a GET
      with a foreign Origin answers 403, and a POST with `Origin: https://localhost:8443` reaches MLflow; by the
      gate's decision table, `Sec-Fetch-Site: same-site` with Mode `navigate`, Dest `document` and method GET gives
      204, and `same-site` with Dest `script`, `image` or `empty` (or Mode other than `navigate`) gives 403, as does
      any `cross-site`; no response
      carries an `Access-Control-*` header or `Set-Cookie`, and an echo upstream behind the same proxy settings sees
      no `Cookie` or `Authorization`; every blocked pattern answers Caddy's own 404. The app's side holds too: a POST to
      https://localhost/api/* and the kernel WebSocket upgrade with `Origin: https://localhost:8443` and the owner's
      cookie answer 403 (SRV-AUTH's Origin check). MLflow and Rotel publish no port and share no network with
      postgres, embed, agent-proxy, mcp or any kernel; caddy shares none with rotel or the worker.

nfr:
  - id: NFR-OBS-1
    metric: seconds from a job's end to its trace being returned by MLflow's get-trace with every span, on the Mac
    threshold: 30
    verified_by: test
    # Source: structural. 5 s processor delay + Rotel batching + MLflow write; the spike waited 10 s after a flush and
    # found every trace complete (RESULT.md). The [live] step polls up to 30 s.

vectors:
  - id: VEC-OBS-1
    source: "Hand-derived from FR-OBS-3, -5, -6 and the route, kind and error catalogs: span name patterns, attribute keys with types, value rules and span kinds, and job_args per kind"
    file: spec/fixtures/SRV-OBS/attributes.yaml
  - id: VEC-OBS-2
    source: "spikes/cli-otel-content/results/20261124T002020/report.json, mode agent-env: the bundled CLI 2.1.330's span names, attribute keys and resource keys under FR-OBS-6's environment (stub upstream, fake credential)"
    file: spec/fixtures/SRV-OBS/cli-span-keys.yaml
  - id: VEC-OBS-3
    source: "Hand-derived from FR-OBS-10 and SRV-AGENT FR-AGENT-9: seeded agent_spend, compile_runs/compile_steps, tutor_questions and job_keys rows, including a failed step attempt that billed money (a settle row with settled_usd > 0 on an attempt whose job ended failed) and an unsettled reserve, with the expected summary JSON"
    file: spec/fixtures/SRV-OBS/summary.yaml

# Test levels.
#   [unit]   pure Python with OTel's in-memory pieces and an in-test OTLP/HTTP receiver (no Docker): the allow-list
#            (FR-OBS-2, INV-OBS-1, Hypothesis), the middleware with a test app (FR-OBS-3, -4), the derived trace ids and
#            link parsing (FR-OBS-5, INV-OBS-4), the CLI environment builder and the uv.lock pin check against VEC-OBS-2
#            (FR-OBS-6 a), the gate's decision table over (Origin, X-Forwarded-Method, Sec-Fetch-Site/-Mode/-Dest,
#            session role) (FR-OBS-9, INV-OBS-5), the summary's percentile, scoping and join functions over rows
#            (FR-OBS-10), VEC-OBS-3's keys recomputed from its args with reader.jobs.model.idempotency_key and its
#            trace ids from FR-OBS-5's derivation (the gate for the fixture; trace-ids.mjs only generates), the
#            `truncated` flag shown when recent_keys_of hits its limit, the retention cutoff and the
#            next-day-first order (FR-OBS-11), the canary for our process (INV-OBS-2 first half), failure isolation
#            (INV-OBS-3: a failing exporter, and a tracer whose start, attribute or end call raises inside the
#            middleware). Code review round 1 added: an oracle of VEC-OBS-1 read from the YAML independently of
#            reader.obs.attributes (used by the INV-OBS-1 property test) with example rows at every bound; the gate's
#            remaining Sec-Fetch, OPTIONS and inexact-Origin rows; the regexp of FR-OBS-9 on its own. Round 2 added:
#            an upper-case traceparent is refused (W3C: lower-case hex only), and the retention handler takes
#            `enabled` and `retention_days` from `current_settings()`.
#   [db]     testcontainers Postgres (SRV-EVENTS' pinned digest): enqueue → run → retry → handler enqueue → sweep with a
#            capturing exporter (INV-OBS-4 end to end), the summary queries on VEC-OBS-3 (FR-OBS-10; the fixture's ISO
#            times are seeded as timezone-aware datetimes), the gate route on real sessions (FR-OBS-9).
#   [config] OPS-DEPLOY's rendered-model tests for the paired services, networks, ports and env (FR-OBS-8, INV-OBS-5),
#            and `caddy adapt` of the Caddyfile: both sites' upstreams, the handle order, every blocked pattern, the
#            header_up/header_down removals and the 8443 CSP (FR-OBS-9).
#   [image]  opt-in READER_TEST_IMAGE_BUILD=1: rotel and reader-mlflow:local start healthy under the compose
#            hardening; a span sent to rotel is returned by MLflow (FR-OBS-8); retention against real MLflow: a trace
#            ingested with a 40-day-old timestamp is deleted by the handler and a fresh one stays (FR-OBS-11, measured
#            in spikes/obs-stack round 2); the Caddy + gate + echo upstream case of INV-OBS-5 (no Cookie or
#            Authorization upstream, no Set-Cookie or Access-Control-* down; every blocked path of FR-OBS-9, deep,
#            upper-case, with repeated slashes and with an encoded slash, answers Caddy's empty 404); the CLI canary of
#            INV-OBS-2 and
#            FR-OBS-6 (b) in server/tests/obs/cli_canary/ (no network, stub upstream, zero credit). The backend
#            tests' internal networks take explicit subnets 10.233.<n>.0/24 (random n per network, a new n on an
#            overlap), because Docker Desktop's predefined pools run out (measured 2026-11-24); nothing else in the
#            repository or on the owner's Docker uses 10.233/16. The ingest check reads the spans of
#            `GET /api/3.0/mlflow/traces/get` at `trace.spans` (MLflow 3.18.0's response, measured 2026-11-24).
#   [live]   `bash e2e/live/obs.sh --out DIR [--with-credit]` against `reader up` (e2e/live/lib/obs_live.py, run
#            as `python -I`, and obs_browser.mjs). It is run by hand until the stage-2 live check script
#            (`e2e/live/stage-2.sh`, docs/roadmap.md) exists; that script will call it. DIR is resolved and checked to
#            lie outside the repository before anything is created. Sessions: one owner and one live-check learner
#            row, each created and deleted by its id hash only (each statement must report exactly one row), through
#            the live library's `docker compose exec -T postgres psql` helper (the script itself runs no `docker
#            exec`); it never runs OWNER_RESET_SQL and never touches the owner's passkeys or other sessions. Caddy's
#            public root is read the way `reader trust` reads it and is never trusted system-wide. Zero credit by
#            default: 8443 answers 401 without a cookie, 403 for a learner, 2xx for the owner; the INV-OBS-5 Origin,
#            method and Sec-Fetch cases; FR-OBS-9's blocked paths (deep, upper-case, repeated slashes) answer
#            Caddy's empty 404; no Set-Cookie or Access-Control-* and the CSP on 8443; the summary is refused to a
#            learner; the first 20 summary trace ids (FR-OBS-10) each open an existing MLflow trace. In the browser
#            (Playwright, real Chromium over TLS): a trace link on /observability opens https://localhost:8443 with
#            the span tree; the newest trace from MLflow's own traces/search (request traces exist at zero credit)
#            gives the detail page, its CSP and one UI write (an assessment note saved; the probe's assessments are
#            then deleted through MLflow's REST whatever happened); no CSP violation anywhere. A check that cannot
#            run on the stack's data (the link click when the summary gives no trace id) prints SKIP, counted apart
#            from the passes. `--with-credit` (off by default; spends Agent SDK credit; the canary question stays in
#            the owner's tutor history): within NFR-OBS-1 a `job tutor.answer` trace with each link of the chain job →
#            agent.call → claude_code.interaction → claude_code.llm_request; the CLI's span names, attribute keys
