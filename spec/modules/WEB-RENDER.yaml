defers:
  - >-
    Sandboxed frame for text/html and image/svg+xml (ADR-0013): stage 4b. Findings of the slice review to address there:
    (1) a top-level load of the frame page must not run in the app origin: serve it with a CSP `sandbox allow-scripts`
    directive and have its script refuse to run unless `self.origin === "null"`; (2) the frame's script is
    self-contained and inline in the frame page (no module graph shared with the app); (3) WebRTC can bypass
    `connect-src`, so whether outputs may use it is an owner decision; (4) probe navigation of the parent and top
    (`top.location`, `window.open`, forms) from the frame; (5) answer the frame's `ready` once only; (6) `document.open()`
    removes the frame's own message listener, so the render step must re-register or avoid it; (7) clamp the reported
    height and ignore non-finite values.
  - "Mermaid diagrams: stage 4b"
  - "ipywidgets rendering (html-manager): stage 4b"
  - "markdown images (relative lesson attachments): stage 4b, with an attachment route in SRV-LESSON"
  - "ANSI colours in text outputs: stage 4b"
  - "binary output buffers: with SRV-KERNEL in stage 4a"

