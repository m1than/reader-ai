requirements:
  - id: FR-RENDER-1
    text: >-
      Output dispatch: an output with several MIME types renders exactly one, the first present in VEC-RENDER-1's
      `preference` list (JupyterLab's order restricted to the slice's types); `text/html` renders as text: the
      output's `text/plain` when present, otherwise the HTML source. `stream` and `error` outputs render as text
      (an error as its traceback lines joined by newlines). An output with none of the listed types shows
      "unsupported output type: <type>" as text. [unit]
  - id: FR-RENDER-2
    text: >-
      Markdown (cell sources and `text/markdown` outputs): remark with GFM and math, then rehype without `rehype-raw`
      (raw HTML stays text; remark-rehype with `clobberPrefix: ''`, so the sanitiser adds its prefix once, and an
      in-page link `#x` is then pointed at `#user-content-x` when that id exists, so footnotes work), then
      `rehype-sanitize` with a schema derived from the default one that: allows on `code` only the classes
      `language-*`, `math-inline` and `math-display` and on no other element any class; allows no `style`, `srcset` or
      event attribute and keeps the default `id`/`name` clobber prefix; keeps the default protocol rules of every URL
      attribute and narrows `href` to http, https and mailto plus relative URLs; and removes `img`, `picture`, `source`,
      `video`, `audio`, `iframe`, `object`, `embed`, `form`, `input`, `button`, `base` and `style` elements (markdown
      images are not rendered in the slice). Then `rehype-katex` (FR-RENDER-3), then Shiki on `code` elements with
      `language-python` (FR-RENDER-4). Links get `rel="noopener noreferrer"` and, when absolute (a scheme, or a
      protocol-relative `//host`), `target="_blank"`. The tree is rendered with `hast-util-to-jsx-runtime`. [unit]
  - id: FR-RENDER-3
    text: >-
      Math (`$…$` and `$$…$$` in markdown, and `text/latex` outputs): KaTeX with `trust: false`, `strict: "ignore"`,
      `throwOnError: false` (a parse error renders the source in the error colour), `maxSize: 10` (em; a structural
      bound on rule and box sizes), `maxExpand: 1000` and output `htmlAndMathml`. Display math sits in a container with
      horizontal scrolling and clipped overflow; inline math is an inline block of at most 4em height with
      `overflow: hidden` and `contain: paint`, so a `\raisebox` or `\rule` cannot paint or lay out outside it (code
      review; a [browser] check renders `$\raisebox{-500em}{X}$` and the page stays short). For `text/latex` outputs one
      outer delimiter pair (`$$…$$`, `$…$`, `\[…\]`, `\(…\)`) is removed before rendering, and the output renders in
      display mode. `\href`, `\url` and `\includegraphics` render as text, never as links or attributes. [unit]
      [browser]
      Design pass (audit 2026-11-23: the inline box clipped the top of superscripts, the 2 of 2^{n/2} lost its upper
      third): the inline box keeps `max-height: 4em` on its content, `overflow: hidden` and `contain: paint`, and adds
      `padding-block: 0.4em` with `margin-block: -0.4em` (the line box does not grow), so ordinary superscripts and
      subscripts paint inside it; math is set at `font-size: 1.05em` (KaTeX's default 1.21em was a size step above the
      17px serif). [browser] for `$2^{n/2}$`, `$x_{i,j}^{2}$` and `$\frac{a}{b}$` inline in a paragraph, every
      descendant `span` of the `.katex-html` with a non-empty box lies within the `.katex` element's border box (±0.5px)
      — measured before the change, 8.2px above it for `2^{n/2}`, and with 0.4em inside it (probe 2026-11-23); the
      `.katex` font size is 1.05 × the paragraph's; the `\raisebox{-500em}` check above still holds.
  - id: FR-RENDER-4
    text: >-
      Code: Shiki with the JavaScript regex engine, the python grammar and one Calm theme per colour scheme, loaded as
      a lazy chunk; tokens become React elements. Until the chunk loads, and for any other language, code renders as
      plain monospace text. [unit]
      Design pass (2026-11-23):
      - **Both schemes at once.** Shiki renders with its two Calm themes (`themes: {light, dark}`, `defaultColor:
        false`), so every token carries `--shiki-light` and `--shiki-dark` (and the `-bg` pair on the `pre`) as React
        style custom properties; app CSS picks one with `[data-theme]` and `prefers-color-scheme` exactly as `calm.css`
        does, so a theme change (WEB-UI FR-UI-16) or an OS switch recolours code without re-rendering. The scheme is no
        longer read from `matchMedia` at render time (the audit's Storybook capture showed a light code block on the
        dark canvas), and the highlighter takes no scheme: `highlight(code, language)`.
      - **Block header.** Every code block (a fenced block in markdown, a code cell, and the plain fallback) is a wide
        block (WEB-UI FR-UI-10) with `--radius-block`: a header row with the language in muted text (`python`, the
        fence's language name when given, else `text`) and a "Copy" ghost button (`CopyIcon`, accessible name "Copy
        code") that writes the code's text exactly (`navigator.clipboard.writeText`) and then reads "Copied" for 2 s
        with a visually hidden `role="status"` "Code copied" ("Copy failed" on failure); the code below in
        `--acme-font-mono` at 0.8125rem with line height 1.55, scrolling horizontally inside the block. The block is a
        `role="group"` labelled "<language> code"; its scroll container takes `tabIndex={0}` only while its content is
        wider than it (measured on mount and on resize), so a block that does not scroll adds no tab stop and a block
        that does is a scroll region keyboard users can reach (axe `scrollable-region-focusable`; code review). Output
        blocks (FR-RENDER-5) keep their plain look without a header.
      [unit] both custom properties on tokens and the `pre`, no `matchMedia` call during render, the header's language
      for python, a named fence and none, Copy's written text, the button's exact text "Copy" then "Copied", the status
      texts and failure, with a stub clipboard, the group role and label, no tab stop without overflow and one with it; [browser] the computed colour of a python keyword differs between `data-theme="light"` and `"dark"`
      on one rendered block without a re-render; [story] Light and Dark.
  - id: FR-RENDER-5
    text: >-
      Safe types: `text/plain`, stream and error text render as text nodes in a monospace block with ANSI escape
      sequences removed; `image/png`, `image/jpeg` and `image/gif` decode base64 into a Blob and render as `<img>` with a
      `blob:` URL that is revoked as soon as the image has loaded or failed (and on unmount), with `alt` from the
      output's `text/plain` when present; `image/svg+xml` renders as text like `text/html` (its `text/plain`, or its
      source) and never becomes a blob. A malformed output (a traceback that is not a list of strings, a bundle that is
      not an object) is coerced, never thrown. `application/json` renders pretty-printed with 2-space
      indentation as text. A single text output longer than 1 MiB is cut at 1 MiB with a "truncated" note (a
      structural bound on DOM size; SRV-KERNEL caps an execution at 16 MiB). [unit]

invariants:
  - id: INV-RENDER-1
    text: >-
      For any markdown or `text/markdown` input, the rendered React tree contains no `script`, `style`, `img`,
      `iframe`, `object`, `embed`, `form` or `base` element; no attribute starting with `on`; no `style` or `srcset`
      attribute taken from the input (style objects come only from KaTeX and Shiki output); no `class` outside
      FR-RENDER-2's allowance except on elements KaTeX and Shiki create and on this module's own chrome (design pass:
      the code block's wrapper and header with its Copy button and status, FR-RENDER-4, and the wide-table wrapper,
      WEB-UI FR-UI-10), built from no input, where every element that carries a class carries `data-render-chrome`
      itself (the test trusts that element only, never its descendants; input cannot forge the mark: a raw
      `<p data-render-chrome class="x">` in markdown stays text, and a test case says so, next to a 5-column table whose
      wrapper is the trusted chrome); and no `href` whose scheme is not http, https, mailto or relative. [unit, property-based with fast-check over generated markup plus VEC-RENDER-1's hostile
      cases and VEC-NOTEBOOK-1's explain cell]
  - id: INV-RENDER-2
    text: >-
      Output content of type `text/html` or `image/svg+xml` is never parsed or loaded in the app document: for any
      such string, the rendered output is a text node whose text equals the `text/plain` alternative or the source, and
      no blob is created for it. [unit, property-based] [browser: VEC-RENDER-1 `svg-script` yields no
      `img[src^="blob:"]` and runs no script]

