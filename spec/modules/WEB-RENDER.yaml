# WEB-RENDER — rendering of lesson content and notebook outputs per ADR-0013's matrix: sanitised markdown, math, code
# and the safe output types (vertical slice V6, `V.WEB-min`; full module in stage 4b).
#
# Threat model: lesson markdown comes from the compile pipeline (agent output over a copyrighted source) and outputs
# come from code the learner runs; both are untrusted. The app document holds the learner's session (an HttpOnly
# cookie) and can call the api, so no untrusted markup may run or be parsed as HTML in it.
#
# Slice decision (coordinator, after deep-reviewer, 2026-11-21): the sandboxed frame for `text/html` and
# `image/svg+xml` is deferred to stage 4b. The review reproduced in Chromium a one-click session takeover through a
# frame page opened top-level, plus two more frame defects; the findings are recorded in `defers` for 4b. In the slice,
# `text/html` and `image/svg+xml` render their `text/plain` alternative (or their source as text). No SVG blob is
# ever created: the code review measured in Chromium that an `image/svg+xml` blob URL, opened top-level (a new tab
# from the image), runs its script in the app origin with the session. Raster images (PNG, JPEG, GIF) keep blob: URLs,
# revoked as soon as the image has loaded or failed. Nothing under `/sandbox/` exists.
#
# Design:
# - Everything shown in the app document is built as React elements from a syntax tree: remark (GFM, math) → rehype →
#   `rehype-sanitize` → `rehype-katex` → Shiki on `code` → `hast-util-to-jsx-runtime`. Sanitising runs before KaTeX
#   and Shiki, so the sanitiser sees only author input and the trusted renderers' output is not stripped. No
#   `rehype-raw`: raw HTML in markdown stays text. No HTML string is ever inserted (WEB-UI INV-UI-2). Inline styles
#   produced by KaTeX and Shiki become React style objects, applied through the CSSOM, so the app needs no
#   `style-src 'unsafe-inline'` (WEB-UI INV-UI-4 checks it in a browser). rehype-katex turns KaTeX's HTML into hast
#   through hast-util-from-html-isomorphic; its browser build parses with the DOM, which the Chromium run of INV-UI-4
#   reported as `style-src-attr` violations, so the build aliases it to its JavaScript (parse5) build
#   (web/vite.config.ts).
# - The MathML `annotation` element, which repeats the TeX source as text, is removed after KaTeX, so source such as
#   `\href{javascript:…}` never appears in the document even as text.
# - Math: KaTeX (ADR-0013) with `trust: false`; fonts are bundled as files (WEB-UI FR-UI-9: no data: URLs). KaTeX over
#   MathJax: ADR-0013 names it, it renders synchronously into the tree above, and MathJax would inject styles at run
#   time.
# - Code: Shiki with its JavaScript regex engine (no WebAssembly, so no `wasm-unsafe-eval`), only the python grammar,
#   loaded lazily.
#
# Cross-spec: the app CSP additions are in WEB-UI's header (task V.OPS-DEPLOY-web). This spec needs `img-src 'self'
# blob:` from them.
#
# Test levels: [unit] Vitest in jsdom on the hast and React output; [story] stories per output type and for VEC-RENDER-1;
# [browser] Playwright (Chromium) against `vite preview` behind WEB-UI's test server with the production CSP, run on
# request and in the slice live check.

