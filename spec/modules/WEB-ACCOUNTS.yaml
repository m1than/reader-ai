# WEB-ACCOUNTS — the owner's "Sign-ups" screen: pending sign-up requests with Approve and Reject, approved sign-up
# accounts with Disable, and the header link that shows how many requests wait (ADR-0031, accepted 2026-11-23; owner
# request 2026-11-23, task V.signup).
#
# Status: approved with the Red tests (2026-11-23) after the deep-reviewer's round-3 approve of ADR-0031 and SRV-AUTH's
# FR-AUTH-23..32. The screen calls SRV-AUTH FR-AUTH-29's routes; an approval decides who can use the instance, so this
# spec gets SRV-AUTH's full review rounds (auth is a complex area).
# Revision 1 (2026-11-23, ADR-0031 review round 1): Disable is stated as permanent in the copy; no passkey recovery
# for sign-up users is stated; [browser] levels on FR-ACCOUNTS-1 and -3; the route, the header link, axe and overflow
# are traced items here (FR-ACCOUNTS-5); after re-authentication the owner returns to `/signups` (SRV-AUTH FR-AUTH-31
# `next`).
#
# The "Sign up" link on the sign-in page is not here: the sign-in, bootstrap and sign-up pages are SRV-AUTH's static
# pages (FR-AUTH-14, FR-AUTH-31), outside the SPA, until WEB-UI replaces them in stage 4.
#
# Design: the same Calm system and polish rules as WEB-UI FR-UI-10/-11 — tokens only (INV-UI-1), the library's
# spacing steps, the sans `--acme-font` for UI chrome, a 2px `--acme-focus` outline, one `main#content` from the shell
# (this page renders a `section`), `role="status"` loading states with visually hidden text and the library's
# `Skeleton`, lists without bullets carry `role="list"`, no HTML strings (INV-UI-2). The checks are FR-ACCOUNTS-5's.
#
# Cross-spec items (paired changes, written with Green):
#   - WEB-UI FR-UI-14 (approved with the Red tests; FR-UI-12 is V/plan's, FR-UI-13 is V/onboarding's): the route
#     `/signups`, the owner's header link and the test-server stubs, in web/src/app and web/test-server under WEB-UI's
#     paths. The page-level checks are FR-ACCOUNTS-5 here.
#   - SRV-AUTH FR-AUTH-29: the routes and bodies; `recent_session` on approve, reject and disable (401
#     `reauth_required` for an older session). FR-AUTH-31: the sign-in page's `next=/signups` return.
#
# Owner notes:
#   1. Disable is permanent in the product: there is no enable route (SRV-AUTH FR-AUTH-29); only the owner's database
#      can undo it.
#   2. A sign-up user who loses every passkey has no recovery (bootstrap links refuse sign-up users, SRV-AUTH owner
#      note 6). The owner disables the account; the person signs up again under another handle.
#
# Test levels: [unit] Vitest in jsdom; [story] Storybook stories Light and Dark (FR-UI-8); [browser] Playwright
# against the WEB-UI test server with stubbed routes, in light and dark (`colorScheme`) at 1280, 1024 and 390 px;
# [live] SRV-AUTH FR-AUTH-32's `signup` step, which approves and rejects through this screen.

id: WEB-ACCOUNTS
title: Owner's Sign-ups screen — pending requests with Approve and Reject, approved sign-up accounts with Disable
status: approved
approved_by: agent
approved_at: 2026-11-23
review: "Reviewed with ADR-0031 and SRV-AUTH FR-AUTH-23..32 (auth, complex area; deep-reviewer, Fable): round 1 changes (Disable permanent in the copy, no passkey recovery stated, [browser] on FR-ACCOUNTS-1/-3, FR-ACCOUNTS-5 for route, link, axe and overflow, return to /signups after re-auth), round 2 changes (none for this spec beyond FR-UI-14 as a proposed WEB-UI item), round 3 VERDICT approve. ADR-0031 accepted by the owner 2026-11-23. Approved by agent with the Red tests; code review rounds follow Green."
layer: web
track: product
adr: [ADR-0031, ADR-0013, ADR-0012]

paths:
  - web/src/accounts/**
  - e2e/web/accounts/**
  - spec/fixtures/WEB-ACCOUNTS/**

normative:
  - id: REF-ACCOUNTS-1
    title: WCAG 2.2 — 2.4.3 Focus Order, 3.3.4 Error Prevention (Legal, Financial, Data), 4.1.3 Status Messages
    url: https://www.w3.org/TR/WCAG22/
  - id: REF-ACCOUNTS-2
    title: SRV-AUTH FR-AUTH-29 — the owner's sign-up routes, bodies and codes this screen shows
    url: spec/modules/SRV-AUTH.yaml

requirements:
  - id: FR-ACCOUNTS-1
    text: >-
      **Pending list.** `/signups` (owner only) shows a `section` with the `h1` "Sign-ups" and the lead "New accounts
      wait here until you approve them. Approved accounts can sign in as learners." Under the heading "Waiting for
      approval" a list (`role="list"`) of `GET /api/auth/signups`'s `pending`, oldest first; each row shows the handle
      (prefixed "@", weight 600), the display name, the request time as relative text with the exact time in a
      `<time datetime>` element, and two buttons, "Approve" (solid) and "Reject" (danger outline), whose accessible
      names include the handle ("Approve @lc-1a2b"). Empty: "No sign-ups are waiting." Handles and display names are
      rendered as text nodes only; a long display name wraps (no truncation, no hover-only text). Loading: FR-UI-11's
      pattern with the hidden text "Loading sign-ups". A load error shows FR-UI-7's notice with a Retry button.
      [unit] the list from VEC-ACCOUNTS-1 (order, text, accessible names), empty, loading, error; a display name
      holding `<b>` and U+202E characters renders as text; [story] Light and Dark with 0, 1 and 20 pending;
      [browser] the list with 0, 1 and 20 pending and a 64-code-point display name, at the three widths in both
      schemes (FR-ACCOUNTS-5's checks).
  - id: FR-ACCOUNTS-2
    text: >-
      **Approve and Reject.** Approve sends `POST /api/auth/signups/{id}/approve` with `{}` at once. Reject asks
      first: an inline confirmation in the row ("Reject @<handle>? The request is deleted and the handle becomes
      free." with "Reject" and "Cancel"; focus moves to "Cancel"), then sends `POST /api/auth/signups/{id}/reject`
      with `{}`. While a request runs, that row's buttons are disabled and show the library's busy state. On success
      the row leaves the list, the list is refetched, and a `role="status"` line says "@<handle> approved." or
      "@<handle> rejected."; focus moves to the next row's first button, or to the section heading when the list is
      empty. Responses: 401 `reauth_required` → the row shows "Sign in again to approve or reject (required every 10
      minutes for these actions)." with a link to `/api/auth/signin?next=/signups` (SRV-AUTH FR-AUTH-31 returns
      there after sign-in) and nothing changes; 404 `not_found` → "This request is no longer waiting." and the list
      is refetched (another tab or the 7-day expiry removed it); 401 `unauthenticated` → the shell's sign-in redirect
      (FR-UI-5); network or 5xx → "Could not reach reader-ai. Try again." with the buttons enabled. No server text is
      shown. [unit] each response for both actions with the exact request (method, path, body); the confirmation and
      its focus; the re-auth link's exact href; [browser] the flow at the three widths in both schemes with the
      request oracle (every non-GET request equals the case's list).
  - id: FR-ACCOUNTS-3
    text: >-
      **Approved accounts.** Under the heading "Accounts" a list of `accounts` by handle: handle, display name,
      "Requested <relative time>", and either a "Disable" button (danger outline) or the text "Disabled". Disable
      asks first, inline, with the copy "Disable @<handle>? Their sessions end and they can no longer sign in. This
      cannot be undone here." and the buttons "Disable" and "Cancel" (focus to "Cancel"); then it sends `POST
      /api/auth/signups/{id}/disable` with `{}` and handles responses as FR-ACCOUNTS-2. Empty: "No approved sign-up
      accounts." Accounts from reader.yaml are not listed (they are managed there). Below the list one line of help:
      "A sign-up account that loses its passkey cannot recover it. Disable it; the person can sign up again with
      another handle." [unit] list, disable flow with its confirmation copy, disabled row, the help line; [story]
      Light and Dark; [browser] the list and the disable flow at the three widths in both schemes with the request
      oracle.
  - id: FR-ACCOUNTS-4
    text: >-
      **Header count.** For the owner, the shell asks `GET /api/auth/signups` once per page load and after each
      approve, reject or disable, and shows the pending count in the "Sign-ups" header link (the count as WEB-UI
      FR-UI-11's nav badge, with the accessible name "Sign-ups n waiting", "waiting" visually hidden); no polling (structural: a sign-up waits for days, not seconds; the
      7-day expiry is the bound). A failure of that call shows the link without a count. A non-owner never calls it.
      Notification beyond the app (Telegram) waits for SRV-NOTIFY (ADR-0031). [unit] owner with 0 and 3 pending,
      the call failing, a learner (no call, no link).
  - id: FR-ACCOUNTS-5
    text: >-
      **Route, link and page checks.** The route table has `/signups` (this page, a lazy chunk, mounted by WEB-UI's
      FR-UI-14). For a user with role
      `owner` (from `/api/me`) the header shows the link "Sign-ups" (FR-ACCOUNTS-4's count); a non-owner sees no link,
      and `/signups` shows the not-found view to a non-owner without calling FR-AUTH-29's routes. At 1280, 1024 and
      390 px, in light and dark, every state of FR-ACCOUNTS-1..3 (loading, error, empty, 1 and 20 pending, a
      confirmation open, a row busy, each response message, accounts with a disabled row) has: axe with no serious or
      critical issue; `scrollWidth − clientWidth` of the document element ≤ 0; no `securitypolicyviolation` event;
      the 2px `--acme-focus` outline on a keyboard-focused button. [unit] the route and link for owner and learner,
      the learner's request log without `/api/auth/signups`; [browser] e2e/web/accounts/signups.spec.ts runs the
      matrix above; below 75rem (a width under 1200 px) it finds the link in the Courses drawer, which holds the main
      nav there (WEB-UI FR-UI-11, live fix 2026-11-24: the header overflowed 390 px by 119 px with four owner
      entries, and still above 40rem with a long display name).

invariants:
  - id: INV-ACCOUNTS-1
    text: >-
      The screen never sends a request that changes an account without a click on that account's own button (and, for
      Reject and Disable, its confirmation): no request on load, on refetch or on focus changes state. [unit] the
      request log over load, refetch, tab focus and keyboard navigation holds only GETs.
  - id: INV-ACCOUNTS-2
    text: >-
      Handles and display names reach the DOM only as text (INV-UI-2); the build's source scan finds no
      `dangerouslySetInnerHTML` or `innerHTML` in web/src/accounts.

nfr: []

vectors:
  - id: VEC-ACCOUNTS-1
    source: >-
      Synthetic `GET /api/auth/signups` bodies written for this spec (no real person): 0, 1 and 20 pending rows,
      Cyrillic and 64-code-point display names, a display name with `<b>` and U+202E, active and disabled accounts;
      and the response bodies of each FR-AUTH-29 outcome. Written with Red.
    file: spec/fixtures/WEB-ACCOUNTS/signups.json

