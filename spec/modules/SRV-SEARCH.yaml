review: "draft 2026-11-21. deep-reviewer round 1 (30a4120): changes (B1 ADR for the embed service, B2 limits, B3 concurrency, B4 key and transient classes, B5 ingest resolution, B6 health wait / ensure / status map, B7 OR full text, B8 acceptance bar, B9 exact scan, B10 total orders) — all applied with the non-blocking items; one round per policy (track ai, outside the complex areas), ADR-0028 gets its own review. Delta check (d273ca7): B1–B10 closed except D1 (512 tokens cut code and formula chunks: measured 266 / 603 / 740 / 887 tokens for prose / Rust / hex / LaTeX), fixed by max_seq_length 1,024; ADR-0028 approved as a proposed draft, its status is the owner's. Owner accepted ADR-0028 (2026-11-22). spikes/embed-service landed (559bc35): ≤ 8 texts per call, mem_limit 3g, query timeout 30 s. Review complete (one round plus the D1 delta). Approved by agent 2026-11-22 with the Red tests (one round per policy, D1 fixed, spike numbers: 2,410 MiB for 8 texts at cap 1,024 → mem_limit 3g; worst batch of 8 11–13 s at 8 CPUs → query timeout 30 s). At approval: the ingest dependency, the test image and the dev-environment typing are declared deviations (header). Green, 2026-11-22: test-data correction, no requirement changed — VEC-SEARCH-5's texts and the [db] tests' synthetic spans were shorter than CHUNK_MIN (80), so they made no chunk; lengthened with filler words that share no lexeme with the queries. VEC-SEARCH-3's `status:` value is quoted (the unquoted `: ` inside it made the copy invalid YAML), as in the fixed source on V/owner-housekeeping; no question changed. Paired change after the first bench (coordinator decision 2026-11-22): weighted RRF with w_dense chosen on v1 only (dev/test protocol, NFR-SEARCH-1), evaluated once on v2; hybrid stayed below dense-only (24 vs 27), so the slice serves the dense order (FR-SEARCH-7, measured negative result for stage 3); VEC-SEARCH-1 gains two weighted cases; the [db] hybrid test expects the dense order without an fts rank. Code review of dd364ba (2026-11-23): changes — B1 the precheck loads with mmap (RuntimeError refused too), memory re-measured (3g kept: memory.peak 2,114 MiB cold, events max 0; ADR-0028 gets a dated measurement note, its Decision unchanged) and an [image] memory test; B2 fetch_model unit test; B3 the fake encoder counts concurrent entries (max 1; the listen backlog raised to 64 after the test exposed refused connections); B4 material filter through search() and the route, and the current key by params match (replaces the newest row); B5 dead key requeued with attempts 0; B6 caplog before ingest and a forced SQL error with the canary; B7 more than 8 chunks, the client's 503/500/non-JSON/dimension mapping, span_id from the primary span and the tie rule, the full-text merge order, the [image] precheck and max_seq_length checks, hypothesis property tests for INV-SEARCH-1, -2, -4, -7. Non-blocking: httpx.TransportError transient; no in-handler ingest poll (IngestNotReady at once, SRV-EVENTS backoff); embed `init: true`; show_progress_bar=False; page_of moved into the tests; the [image] and [local] tests use one-shot containers or a healthcheck, never docker exec; the bench docstring corrected. Code review round 2 (deep-reviewer, Fable, 2026-11-23): VERDICT approve, with pre-merge fixes applied — the memory test and bounds size on memory.stat anon (683 MiB after load, max 1,192 MiB through a worst batch) and assert oom_kill 0, not memory.peak or events max (the mapped weights are reclaimable file cache; the reviewer measured peak 2,738–2,780 MiB cold); embed.Dockerfile fetches the model before copying the service; a broken or missing reader.yaml answers 503 config_unavailable (FR-SEARCH-8, [db] test). Follow-up: a comment line in the [image] test re-wrapped for ruff E501 (no assertion changed). Integration (V/SRV-TUTOR-impl, 2026-11-23): with SRV-INGEST's migration in the heads, the test fixture `add_material` fills the real tables' NOT NULL columns (materials.page_count, ingests.artifact_id, span_count, outline_count, outline_source, pages_without_text, material_spans boxes); no oracle changed. On V/slice-integration the same fixture fix landed as 840f16a (no ingest tables created by the tests; FR-SEARCH-4 note), and it is the version kept. Paired change FR-SEARCH-10 (2026-11-23, for SRV-INGEST revision 2, ADR-0029 accepted by the owner): drafted on V/onboarding, reviewed in its deep-reviewer rounds 2–7, promoted with SRV-CONFIG FR-CONFIG-17 on V/upload-impl with its Red test; FR-SEARCH-7's current key reads the same language as fts_config_of, so an uploaded material's current key matches its embed; its test reformatted for ruff (line length), no oracle change."

# ---- Proposed amendment (2026-11-24, V/manage, WEB-MANAGE; paired with SRV-INGEST FR-INGEST-31; status: draft).
# Held under `proposed_manage` until a deep-reviewer round approves it; id FR-SEARCH-20 (11..19 left free).
proposed_manage:
  requirements:
    - id: FR-SEARCH-20
      text: >-
        **Deleted materials leave results.** Both of search/store.py's candidate queries (dense and full text) join
        `materials` on `(owner_id, sha256) = (c.owner_id, c.material_sha256)` and add `m.deleted_at IS NULL`, so a
        deleted material's chunks are never ranked, whether or not the request filters by material; a request whose
        `material` filter names a deleted material answers 404 `not_found` (as an unknown material, FR-SEARCH-8).
        Chunks and embeddings are kept (SRV-INGEST FR-INGEST-32), so a restore makes them searchable again without a
        re-embed. SRV-TUTOR's retrieval calls the same `search()` and so excludes them too. [db] a query whose top
        hit is in material A: after A is deleted the hit is gone and B's results are unchanged; the material filter
        on A → 404; after restore the first result set returns exactly; no row of search_chunks or search_embeds
        changed across the cycle.
