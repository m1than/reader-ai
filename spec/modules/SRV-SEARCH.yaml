proposed_requirements:
  - id: FR-SEARCH-21
    text: >-
      **Policy and facets as data (B6, B7a, B3 F4).** `reader/search/policy/policy.json` declares: `channels` (mcp,
      owner, tutor, pipeline → `budget_default`, `budget_max`), `routes` (id `<channel>.<question type>` for every
      channel × {exact, thematic, current_state, fact_check} → `layers` (ordered subset of L0..L4), `filters` (role,
      form, reliability_min, newest_as_of), `rrf` (bool), `l5_boost` (tutor only, inert until S6.SRV-RECALL)),
      `question_rules` (identifier regexes and current-state wording regexes, per language), `card_budgets`,
      `candidates_max`, `expand_cap`, `expand_per_card`, `expand_decay`, `preselect_factor`, `objective` (weights),
      `same_point_tau` (null until SRV-KB sets it with its links),
      `gate` (`mode` ∈ never_judge | always_judge | margin, `margin` number or null, required when mode is margin),
      `judge` (`timeout_s`, `input_cap_tokens`), `thresholds` (flat keys exactly as SRV-OBS FR-OBS-40/41 read them:
      `judge.find.sufficiency_threshold` and `judge.eval.<name>.pass_threshold` for each judge.eval slot), `rrf_k`, `w_dense`, `k_max`, `open_depth_max`, `quote_max_chars`, `cache_entries`.
      `policy.schema.json` (Draft 2020-12) closes every object (`additionalProperties: false`) and bounds every number
      (`timeout_s` ≤ 8.0; `preselect_factor` ≥ 1; budgets ≥ 1; thresholds in [0, 1]). `facets.json` holds the B3
      vocabularies (role, reliability, credibility, as_of, license, form, topic as a reference to reader.yaml sectors),
      validated by `facets.schema.json`; free values are refused. Both files load once per process; a file that fails
      its schema stops the api and worker start with `policy_invalid` (no partial policy). `policy.declared()` returns
      the declared data FR-OBS-21 hashes: the policy file's parsed content, the facets file's sha256, the slot-to-model
      bindings of the judge slots from the effective config, the embedding model id(s) and the sha256 of each prompt
      file by name; never the code version. `policy.find_routes()` returns the route ids (SRV-OBS enum `find_routes`).
      [unit]
    tests_planned:
      - "add server/tests/search/test_policy_unit.py [unit]: the shipped files validate; each closed object refuses an extra key; out-of-range numbers refused; margin mode without margin refused; every channel × type has a route; declared() changes with each input (a route field, the facets bytes, a slot model, the embed model, a prompt's bytes) and not with the code version; find_routes() equals the route ids; judge.input_cap_tokens equals SRV-AGENT's judge_find_input_tokens_max"
  - id: FR-SEARCH-22
    text: >-
      **`find` entry, budget and response (B8).** `find(caller, channel, query, filters=None, k=None, budget=None,
      judge_ctx=None, question_type=None)`; `caller` = (user id, course roles, provider presence). `query` is NFC,
      trimmed, 1–1000 characters (`query_invalid`); `filters` keys come from the facets file (`filter_invalid`); `k`
      1..k_max (`k_invalid`), unset = no count cap; `budget` an integer ≥ 1 (`budget_invalid`), unset = the channel's
      default, above the channel's maximum clamped to it (not an error); `question_type` only from internal callers
      (the pipeline's fact-check route). Token counts use SRV-AGENT's estimator on the card's canonical JSON
      (sorted keys, no spaces); the response is `{brain_version, policy_version, budget: <effective>, cards: [...],
      judge_ran, judge_source?, degraded}` and the cards' budget is the effective budget minus the estimate of that
      envelope with empty cards. A card is `{id, layer, title, text, cite: [{spn, quote_sha256, quote?}], source: {id,
      role, as_of, reliability, license}, next: [ids], judged, more?}`; `more: true` only for a cut `shareable` L1
      card. L1 text is cut to its card budget (estimator) at the last whitespace at or before the limit, hard when
      there is none. The request hash = sha256 of the canonical JSON {user id, sorted roles, channel, query, filters,
      k, effective budget, brain_version, policy_version}. [unit, db]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: each validation code; budget above max → clamped and echoed; card JSON shape; cut at whitespace and hard; more only for shareable; request hash changes with each field"
  - id: FR-SEARCH-23
    text: >-
      **Step 1, route by rules (0 model calls).** Question type: the caller's `question_type` when given (only
      `fact_check` is accepted from internal callers); else `exact` when any identifier regex of `question_rules`
      matches the query; else `current_state` when a wording regex matches; else `thematic`. Route = `routes[<channel>.
      <type>]`. Layers not yet built (L3, L4, L5 before their specs) are skipped and the trace says which layers were
      available. Identifiers found become the `exact` route's filter and objective elements. [unit]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: VEC-SEARCH-8 classification and route lookup; unbuilt layers skipped"
  - id: FR-SEARCH-24
    text: >-
      **Steps 3–5: merge, gate, expansion and preselection (0 model calls).** (3) Cards linked by `same_point` above
      the policy's τ are merged by the pivot algorithm (FR-SEARCH-27 c); the merged card keeps the pivot's text and
      takes all members' citations and the maximum score. The links come from a `Links` port; its production default
      returns no links until SRV-KB, so step 3 is the identity in stage V. (4) Gate: `never_judge` → separated;
      `always_judge` → not separated; `margin` → separated iff there is at most one card or s1 − s2 ≥ margin over the
      merged cards' scores. Separated → step 7 on the merged cards with `judge_skip: gate`. (5) Otherwise expand 1 hop:
      each merged card adds its `next` targets (an L1 card: the next span in reading order and its section; L2: its
      children), at most `expand_per_card` per card; a card reached only by expansion scores max over its parents of
      parent score × `expand_decay`, a card that is also a candidate keeps its own score if higher. Keep the top
      `expand_cap` of the expanded set by (score desc, id), then select with FR-SEARCH-27's budgeted greedy under
      `preselect_factor` × the cards' budget. Expanded cards obey the channel's eligibility (FR-SEARCH-30): no link
      into an ineligible L1 card is followed. [unit, db]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: gate modes and the margin rule at the boundary; expansion score rule (only-by-expansion, both, two parents); cap 50 by (score, id); the preselection's cost ≤ 1.5 × budget; Links fake with edges merges as VEC-SEARCH-7"
      - "add server/tests/search/test_find_db.py [db]: expansion over real next links of an active pack; an ineligible L1 target is not added"
  - id: FR-SEARCH-25
    text: >-
      **The coverage objective (B5).** Query elements E = the lexemes of `to_tsvector(cfg, query)` for each fts_config
      of the eligible packs ∪ the identifiers of step 1 (lowercased); weights: identifier `objective.identifier_weight`,
      lexeme `objective.lexeme_weight`, normalised to sum 1 when E is non-empty. A card covers e when e is among the
      lexemes of its window `fts` values (L1) or of `to_tsvector(cfg, title || summary)` (L2), or, for an identifier,
      when it occurs case-insensitively in the card text. Each card c also covers a private element of weight λ ·
      rel(c), rel(c) = max(0, score(c)) / the top merged score of the request (fixed for the request). f(S) = the
      weight of the elements covered by S: a weighted coverage, monotone submodular with non-negative weights, so the
      bounds of FR-SEARCH-27 apply. License and supersession enter only as filters before selection. [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_unit.py [unit]: elements and weights over VEC-SEARCH-5 (revised); f is monotone and submodular on random instances (Hypothesis); rel normalisation fixed per request"
  - id: FR-SEARCH-26
    text: >-
      **Bounded work.** Every selection over the graph and the embeddings is FR-SEARCH-27's greedy over at most
      `candidates_max` (step 2) or `expand_cap` (step 5) cards; nothing enumerates subsets, calls a solver or
      recomputes globally (ADR-0039 invariant 3). Each greedy pass evaluates at most n² marginal gains for n ≤ 50. [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_unit.py [unit]: gain evaluations counted ≤ n² on n = 50"
  - id: FR-SEARCH-27
    text: >-
      **The B5 greedy algorithms (`reader.search.greedy`, pure).** (a) **Budgeted max coverage** `budgeted(cards, f,
      cost, B, order, k=None)`: G starts empty; repeatedly add, among the cards not in G that fit (cost(G) + cost(c) ≤
      B) and have Δ(c | G) > 0, the one with the largest Δ/cost (ties: higher score, then smaller id), stopping at k
      cards when k is set; c* = the fitting single card of largest f({c}) (same ties); T = G if f(G) ≥ f({c*}) else
      {c*}; then **fill**: walk `order` and add each card that still fits (and k allows). Bound, stated per pass over
      its own input and budget: f(T) ≥ (1 − 1/e)/2 · OPT ≈ 0.316 · OPT (Khuller, Moss and Naor 1999), for unset k; the
      fill only adds cards, so by monotonicity it never lowers f. This answers B6 step 7's two choices: a fitting
      zero-gain card is returned through the fill, and a fill after the best-single-card branch is allowed. When k
      binds no bound is claimed (declared). (b) **Weighted set cover** `set_cover(universe, sets, cost)`: lowest cost
      per newly covered weight first, ties by id; bound H(d) ≤ 1 + ln d, d the largest set size (Chvátal 1979; Feige
      1998 threshold). Its consumer is the atlas-gap and purchase-proposal path (SRV-KB, stage 7); stage V ships it
      only with its bound test (kl_open_points 5). (c) **Pivot** `pivot(cards, plus, seed)`: order the cards by
      sha256(seed ‖ id); take the first unassigned card, attach its unassigned + neighbours, repeat; seed = the request
      hash. Bound: expected disagreements ≤ 3 · OPT over seeds (Ailon, Charikar and Newman 2005). [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_unit.py [unit]: VEC-SEARCH-6 hand-computed cases (ratio pick, best-single branch wins, fill after each branch, zero-gain fitting card filled, k stop, ties); pivot over VEC-SEARCH-7; set_cover hand cases"
  - id: FR-SEARCH-28
    text: >-
      **Step 6, the `judge.find` waiter (B6, B7b).** Runs only when step 4 is not separated and the preselection is
      non-empty. (1) **Slice:** the longest prefix of the preselection in score order whose rendered input
      (`judges.render_find_input(query, cards)`) estimates ≤ min(`preselect_factor` × the cards' budget,
      `judge.input_cap_tokens`); the cards are rendered exactly as the channel serves them to this caller (so the
      judge reads the MCP row for a non-entitled caller, FR-SEARCH-30). (2) **Recorded:** input hash =
      `judges.find_input_sha256(caller id, query, [[id, text], …])`; a `judges.recorded` hit under the current judge
      name is applied with `judge_source: recorded`, no row, no job, $0. (3) **Preconditions**, each a degrade without
      a row or job: no provider handle for the caller → `no_provider`; no `judge_ctx` (line, run_id, run_cap_usd,
      lesson_id, daily_budget_usd) from the caller → `budget`; the slot missing from config → `error`. (4) **Request:**
      on one connection, `LISTEN judge_done`; then in one committed transaction insert the `judge_requests` row
      (owner_id, the ctx fields, created_at = now(), deadline = now() + `judge.timeout_s`, query, cards, pack_ids) and
      enqueue `judge.find` with args exactly `{request_id, input_sha256}` keyed by the request id. (5) **Wait** for a
      notification whose payload is the request id, at most `judge.timeout_s` from created_at: then `judges.recorded`
      hit → applied, `judge_source: live`; miss → degrade `error` (finer codes per kl_open_points 2); no notification
      in time → degrade `timeout` (the late job still records its output for replay; this response ignores it). Any
      database or enqueue error → `error`. The waiter never retries and makes at most one request per `find`. The
      same code runs in the api and in worker jobs that call `find`. [db]
    tests_planned:
      - "add server/tests/search/test_judge_wait_db.py [db] (fake lane that reads the row and records an output): slice within min(1.5 × budget, 3,000) by the rendered estimate and in score order (VEC-SEARCH-10); a recorded hit → no row, no job, judge_source recorded; no provider → no_provider; no ctx → budget; live output in time → applied, live; no notification within the timeout → timeout and the response returns by timeout + 0.5 s; notify without output → error; enqueue failure → error; exactly one row and one job per find; the job args are exactly {request_id, input_sha256}"
  - id: FR-SEARCH-29
    text: >-
      **Step 7, final selection and order (B6).** Cards budget B. **Without an applied judge output:** one
      FR-SEARCH-27 (a) pass over the merged cards (gate separated) or the capped expanded set (degraded), order by
      score; every card `judged: false`; `judge_ran: false`. **With an applied output:** pass 1 over the cards the
      judge kept, under B, fill order = the judge's order; pass 2 over the unjudged remainder (preselection minus the
      slice) under B − cost(pass 1), on f(· ∪ P1) − f(P1), fill order = score; cards the judge read and dropped are
      excluded. Response order: pass-1 cards in the judge's order, then pass-2 cards by score. `judged: true` exactly for
      pass-1 cards; `judge_ran: true`; `judge_source` live or recorded. A remainder card never displaces a kept one.
      The trace records judged and unjudged token counts and `judge_skip` (gate, timeout, error, budget, saturated,
      quota_refused, no_provider) when no judge ran (FR-SEARCH-33). The judge's `sufficiency` is recorded for the slice
      only and is not applied to the remainder. [unit]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: VEC-SEARCH-10 mixed responses — kept first in judge order, remainder by score, judged false on the remainder, dropped excluded, kept cards exceeding B chosen by the greedy not the judge order; degraded path selects from the capped expanded set; all-dropped → pass 2 only"
  - id: FR-SEARCH-30
    text: >-
      **Personal-use cards per channel and caller (B8 table).** `entitled(caller, pack)` is true iff the caller owns
      the pack, or the caller has a material row that is not soft-deleted whose sha256 our code computed from bytes
      that caller uploaded or imported (SRV-INGEST receive), equal to the pack's material sha256; a client-declared
      sha256 never counts. Eligibility for a pack with `license: personal-use`: on channel `mcp`, and on every channel
      for a caller who is not entitled, no L1 card is returned, no `next` link and no `open` child leads to an L1 id,
      and L2 (and, from SRV-KB, L4) cards carry quotes ≤ `quote_max_chars` per citation with no continuation; on
      `owner`, `tutor` and `pipeline` for an entitled caller, full L1 text cut at the card budget. `shareable` packs are
      eligible on every channel. Judge input follows the channel's row for that caller (FR-SEARCH-28 (1)). Scope stays
      the caller's own manifest (INV-SEARCH-1) until SRV-SHARE; the entitlement function is still implemented and
      tested on constructed rows, so SRV-SHARE only widens the scope. [unit, db]
    tests_planned:
      - "add server/tests/search/test_cards_db.py [db]: entitled for the owner; for another user with a live own copy of the same sha256; not with a soft-deleted copy; not with only an uploads row or a sha256 given by the client; VEC-SEARCH-9's channel × entitled × license → card shape"
  - id: FR-SEARCH-31
    text: >-
      **`open(caller, channel, id, depth=1, budget=None)` (B8).** `spn:` must equal the locator of a sealed span of an
      active pack in the caller's manifest; any other range, an inactive or another user's pack, or an ineligible L1
      span (FR-SEARCH-30) answers `not_found` (the same code, so a refusal never confirms existence). For a cut
      `shareable` span it returns the full text within the open budget (`more: true` again when still cut). `sec:`
      returns the node's card and its children down to `depth` (≤ `open_depth_max`, else `depth_invalid`), skipping
      ineligible L1 children; `src:` returns the L0 profile card and the top outline level. `con:`, `fnd:`, `les:`
      answer `not_found` until SRV-KB and SRV-LESSON provide them (declared). Malformed ids → `id_invalid`. Same
      budget clamping and card shape as `find`; no judge. [db]
    tests_planned:
      - "add server/tests/search/test_open_db.py [db]: a sealed locator resolves; a shifted range, a guessed offset, an empty-span ordinal that does not exist, an inactive pack and another owner's span → not_found; sec children to depth and depth_invalid; budget clamp; shareable more/continuation"
  - id: FR-SEARCH-32
    text: >-
      **Response cache (B8 reproducibility).** An in-process LRU of `cache_entries` whole responses, keyed by the
      request hash (FR-SEARCH-22: caller id, roles, channel, request, effective budget, brain_version, policy_version).
      Stored only when the judge was skipped by the gate or a judge output was applied; never a degraded response
      (embed degraded or judge timeout, error, budget, saturated, quota_refused, no_provider), so a repeat after a late
      judge output is served judged. The tutor channel is never cached (L5 and findings change outside the manifest).
      A hit is traced like a miss with the same attributes. [unit]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: hit on an identical request; miss when user, a role, channel, brain_version or policy_version differs; a degraded response is not stored; tutor never stored; LRU evicts at 256"
  - id: FR-SEARCH-33
    text: >-
      **Tracing and readers for SRV-OBS.** `find` opens FR-OBS-36's subtree through `reader.obs.find` helpers with
      ids, enums, counts and hashes only (channel, route, question type, entitled, layers, counts, token counts,
      `judge_ran`, `judge_source`, `judge_skip`, the gate outcome, card uris and sha256s); `find.judge_wait` is
      current while the waiter enqueues. `reader.search.cards.read(conn, caller, ids)` returns the cards' text as that
      caller may read it on the owner channel (B8: the MCP row for packs the caller is not entitled to), in memory, for
      SRV-OBS FR-OBS-39/40. Nothing in reader.search logs or traces a query, filter value or card text. [unit, db]
    tests_planned:
      - "add server/tests/search/test_find_obs_db.py [db]: the span tree and attributes for a gated, a judged and a degraded find (in-memory exporter); a canary in the query and in a span text appears in no span attribute and no log record; cards.read applies the MCP row for a non-entitled pack"

proposed_invariants:
  - id: INV-SEARCH-9
    text: >-
      **Budget never exceeded.** For any request (any budget, including one above the channel maximum, any k) and any
      corpus, the sum of the returned cards' estimates ≤ the effective cards' budget ≤ the channel maximum, and every
      L1 card ≤ its card budget. Property test. [unit]
    tests_planned:
      - "add server/tests/search/test_find_props.py [unit] (Hypothesis)"
  - id: INV-SEARCH-10
    text: >-
      **Greedy bounds against exhaustive search, per pass.** On random instances with n ≤ 12 cards: the step-5
      preselection, step-7 pass 1 and step-7 pass 2 (on its marginal objective with pass 1's output fixed) each reach
      ≥ (1 − 1/e)/2 of the optimum over all subsets within that pass's budget (k unset); `set_cover` costs ≤ H(d) ×
      the optimum; the pivot's disagreements averaged over 200 seeds ≤ 3 × the optimum clustering (n ≤ 8, all
      partitions). No bound over the union of the two step-7 passes is asserted (ADR-0039 B5). Enumeration exists only
      in the tests. [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_props.py [unit] (Hypothesis, exhaustive oracles)"
  - id: INV-SEARCH-11
    text: >-
      **One judge call at most, last, on the slice only.** For any `find`: no model call before step 6; at most one
      `judge_requests` row and one `judge.find` job; the cards in the row are a prefix in score order of the step-5
      selection whose rendered estimate ≤ min(1.5 × budget, the cap); a recorded hit makes no row. [db]
    tests_planned:
      - "add server/tests/search/test_judge_wait_db.py: property over random corpora and policies with a counting fake Provider and lane"
  - id: INV-SEARCH-12
    text: >-
      **Personal-use walk and cross-user tests (B1 navigation invariant, B8).** Starting from the sources' top cards
      with channel `mcp`, following every `next` and `open` child: no personal-use L1 card is returned, no citation
      quote exceeds 300 characters, and `open` on every cited `spn:` id and on guessed locators of the same material
      answers `not_found`. On every channel, a second user without an own copy gets no card of the owner's pack (trivial
      under INV-SEARCH-1, listed again as an SRV-SHARE required test) and no judge request carrying L1 text; with an own
      copy on tutor, L1 cards. For an entitled caller on tutor and owner every active span is reachable from the
      sources' top cards. [db]
    tests_planned:
      - "add server/tests/search/test_walk_db.py [db]"
  - id: INV-SEARCH-13
    text: >-
      **open resolves only sealed span ids.** For any string after `spn:`, `open` returns a card only when it equals a
      stored locator of a sealed span of an active pack in the caller's manifest. Property test over random ranges
      around real locators. [db]
    tests_planned:
      - "add server/tests/search/test_open_db.py: Hypothesis over shifted ranges and ordinals"
  - id: INV-SEARCH-14
    text: >-
      **No text in judge job args (waiter side).** With a canary in the query and in a card text, no `judge.find` job's
      args and no `job_keys` row contain it; the text is only in the `judge_requests` row. (The table-side canary and the
      collector are SRV-EVENTS'.) [db]
    tests_planned:
      - "add server/tests/search/test_judge_wait_db.py: canary over procrastinate_jobs args and job_keys"
  - id: INV-SEARCH-15
    text: >-
      **Unreviewed findings never returned.** Cards of layer L4 come from a `Findings` port (production default: empty
      until SRV-KB) and only reviewed findings are eligible on any channel or in judge input. [unit]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: a fake Findings port with reviewed and unreviewed findings"

