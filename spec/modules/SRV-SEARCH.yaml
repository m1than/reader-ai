kl_open_points:
  - "1. Owner-channel judge calls bill the `mcp` line (FR-SEARCH-28); a separate `owner` line is a possible owner follow-up (SRV-AGENT)."
  - "2. Until SRV-AGENT sends `<request_id>:<code>`, budget, saturated and quota_refused degrade as error (interim parse rule, FR-SEARCH-28)."
  - "3. When k binds together with the budget, no approximation bound is claimed (FR-SEARCH-27); B8 keeps k optional."
  - "4. Unmeasured values are marked initial in policy (expand_decay, objective weights, thresholds, quotes_per_card_max, walk_quote_fraction_max, owner_judge_run_cap_usd); the evaluation reports their effect, none gates a merge; judge-gate and the paid ablation arms replace the ones they measure."

proposed_owner_notes:
  - "Spans vs chunks (spikes/retrieval-ablation): at 10 cards, spans hit 71 of 90 against today's chunks' 76; the difference is not significant (thematic 17 vs 20, exact 25 vs 27, fact-check equal), and spans carry 3.8× less text. With the same amount of text spans hit 83. find selects under a token budget, not 10 cards, so the thematic route should not lose in practice; NFR-SEARCH-2's floor is 68 (the spike's 71 minus a margin of 3)."
  - "set_cover is kept as a pure function with its bound test and no caller in stage V (FR-SEARCH-27 b); you may drop it, and SRV-KB would then add it with its caller."
  - "Search-dark window: SRV-SEARCH reads no legacy chunks, so each material is not searchable (tutor and search return nothing for it) once, while its first span-vector overlay is built: for the existing pilot that is its legacy pack over backfilled locators (SRV-INGEST option (a)); a later re-conversion (r3) switches packs only after the new overlay is sealed. The window is about the re-embed time, 26.8 min measured at 13 CPUs (spikes/retrieval-ablation). Run it when you are not studying."
  - "Long spans are embedded in windows of 1,200 characters (72 pilot spans are longer) rather than raising the embed service's limit (declared deviation)."
  - "Tutor context in the interim: between this module's Green and V.kl-tutor-find, the tutor still calls search(k=8), which now returns 8 spans (about 223 characters each at the mean) instead of 8 chunks of up to 1,200 characters, so its source context is smaller than today until the tutor moves onto find with its own budget; NFR-TUTOR-3 is re-measured in V.kl-tutor-find."
  - "Quotes on MCP: at most 10% of a material's text can be quoted across all calls (initial value). This is an engineering bound with no legal basis claimed; it is tighter than ADR-0015, which limits only each citation to 300 characters."

proposed_defers:
  - "The caller of `greedy.set_cover` (atlas gaps, purchase proposals): SRV-KB, stage 7."
  - "Dropping search_chunks and search_embeds: a migration after V.kl-live."
  - "A response cache: not built; reproducibility rests on brain_version, policy_version and recorded judge outputs."
