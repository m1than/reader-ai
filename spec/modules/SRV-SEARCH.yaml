      - "change server/tests/search/test_search_unit.py: the job's args and key are exactly {owner_id, pack_id, overlay_id} / [owner_id, overlay_id]; overlay_id comes from SRV-INGEST's function (monkeypatched spy)"
  - id: FR-SEARCH-7
    text: >-
      **Candidates (B6 step 2).** `candidates(conn, caller, route, query)` reads, through the manifest views, the
      caller's active packs (INV-SEARCH-1) after the route's filters and the channel's eligibility (FR-SEARCH-30) are
