proposed_revisions:
  - id: FR-SEARCH-3
    text: >-
      **Span windows (replaces chunking across spans).** The unit of retrieval is the L1 span of an active base pack
      (ADR-0039 B1). For the vector overlay, every span with non-empty text yields its windows: the span's text
      alone, cut by VEC-SEARCH-2's algorithm with size 1,200, overlap 200 and no minimum for the first window (a short
      span is one window; trailing windows under 80 characters are merged into the previous one). When a context
      prefix overlay is active for the pack (only if `retrieval-ablation` keeps prefixes), the embedded text of each
      window is prefix + "\n" + window and the window size shrinks to 1,200 − len(prefix) − 1, so every embed passage
      stays ≤ 1,200 characters (FR-SEARCH-1). Each window records the span locator, `window_no`, `char_start`,
      `char_stop` (offsets into the span text). Empty-text spans get no window; they are reached only through `next`
      and outline links. Pure and deterministic. Windows replace the spike's one-vector-per-span form for the 72
      pilot spans over 1,200 characters (declared deviation in the header). [unit]
    tests_planned:
      - "change server/tests/search/test_search_unit.py: windows per span over VEC-SEARCH-2 (revised); a span under 80 chars is one window; a prefix shrinks the window and every passage ≤ 1,200 chars; empty span → no window"
      - "change server/tests/search/test_search_props.py: for any span text, the windows cover it and each passage ≤ 1,200 chars"
  - id: FR-SEARCH-4
    text: >-
      **Tables.** Migration `search_0002` (branch `search`; parents below; this absorbs V.SRV-SEARCH-fk) creates `search_span_vectors(owner_id → users.id, overlay_id text,
      pack_id text, locator text, window_no int, char_start int, char_stop int, model text, fts_config text CHECK in
      ('russian','english','simple'), fts tsvector NOT NULL, embedding vector(1024) NOT NULL)`, primary key
      (owner_id, overlay_id, locator, window_no) — owner-scoped, because two owners of the same bytes share a pack id
      (FR-INGEST-35) and must never share rows — plus `USING gin (fts)` and a foreign key (owner_id, overlay_id) →
      SRV-INGEST's `overlays` (ON DELETE RESTRICT). `fts` is a plain column computed at insert from the passage text
      (`to_tsvector(cfg, passage)`); the table stores no text column, so the window's text is read from the span
      through the active view at query time. Rows are written only by the build of their own overlay (P1) and deleted
      only by `forget_overlay` (FR-SEARCH-5): a trigger refuses INSERT, UPDATE and DELETE of a row whose overlay is
      `sealed`, and every UPDATE and TRUNCATE, unless the transaction-local setting `reader.search_delete` is `on`,
      which only `forget_overlay` sets (the pattern of SRV-AGENT's `reader.judge_delete`). Migration `search_0002` has
      `down_revision = search_0001` and `depends_on` SRV-INGEST's `ingest_0004_packs` (the `overlays` table its foreign
      key names). `search_chunks` and `search_embeds` are no longer read by any path; their
      rows are deleted only by `search.forget_legacy(conn, owner_id, ingest_id)`, which deletes that owner's
      `search_chunks` and `search_embeds` rows of that ingest and is called only by SRV-INGEST's GC and purge under
      their locks (FR-INGEST-44, -45); the tables are dropped by a later migration after V.kl-live (defers). No vector
      index (the spike kept the exact scan). [db]
    tests_planned:
      - "change server/tests/search/test_search_db.py: search_0002 (down_revision search_0001, depends_on ingest_0004_packs) upgrades and downgrades on the heads; the key and CHECK refuse duplicates and bad fts_config; two owners insert the same (overlay_id, locator, window_no) without conflict; no text column; after seal an INSERT, UPDATE or DELETE of that overlay's rows is refused, TRUNCATE refused, forget_overlay still deletes"
      - "add to server/tests/search/test_search_db.py: forget_legacy deletes exactly that owner's search_chunks and search_embeds rows of that ingest; another ingest's and another owner's rows (same ingest material) are unchanged; a second call deletes nothing"
      - "change server/tests/search/conftest.py: fixtures create packs and spans through SRV-INGEST's test helpers instead of chunks"
  - id: FR-SEARCH-5
    text: >-
      **The vector overlay build.** Kind `search.embed`, args `{owner_id, pack_id, overlay_id}`, key `[owner_id,
      overlay_id]`, max attempts 3, timeout 3,600 s, transient classes unchanged. `overlay_id` is computed only by
      SRV-INGEST's function (FR-INGEST-36) for kind `vectors` with inputs {model: the lock's id, params_sha256 of
      {max_seq_length, window size, overlap, minimum, fts_config}, prefix_overlay_id or null} and builder version
      `search.vectors/1`; SRV-SEARCH never hashes an overlay id itself. `fts_config` is FR-SEARCH-6's mapping of the
      language that `reader.ingest.packs.profile_for_pack(conn, owner_id, pack_id)` returns for the pack being built.
      **Buildable predicate** (one function, `buildable(conn, owner_id, pack_id)`, also used by FR-SEARCH-9): the
      pack is in the owner's head entry; or else it is the material's newest sealed pack for that owner — newest by
      converter-version order (FR-INGEST-35's parse config), never by `sealed_at` — not purged, not collected, and its
      material is not soft-deleted. A legacy pack (SRV-INGEST option (a), over backfilled locators) is buildable
      under the same rule. The handler: (1) checks the predicate and that the recomputed overlay id equals the arg,
      else fails permanently with `overlay_superseded`; an overlay with this id that GC collected also fails with
      `overlay_superseded` (it is never rebuilt under the same id); (2) a sealed overlay with this id → runs (4)'s
      activation calls only and ends (no embed call); (3) otherwise registers the overlay `building` with
      `reader.ingest.overlays.begin(conn, owner_id, overlay_id, kind="vectors", pack_id, inputs, builder_version)`,
      windows the pack's spans read through `pack_spans` (FR-SEARCH-3), embeds in passage batches
      of 8 and inserts every row with its owner and overlay id; (4) as the run transaction's last statements:
      `reader.ingest.overlays.seal(conn, owner_id, overlay_id)` (skipped in (2)), then
      `request_activation(conn, owner_id, pack_id, {"vectors": overlay_id})` naming exactly this overlay, then
      `try_activate(conn, owner_id, pack_id)` (FR-INGEST-39). This job never appends a manifest entry itself and
      enqueues no activation job. **try_activate's result:** `pack_purged`, `pack_collected` or `not_sealed` raise
      `overlay_superseded` (permanent), so the whole run transaction rolls back and no vector row, seal or pending
      row is left; every other result (an appended entry, `no_change`, `deleted`, `seqmap_missing`,
      `anchors_missing` and FR-INGEST-38's other waiting reasons) commits: the overlay is sealed and its activation
      stays pending in SRV-INGEST's row (a deleted material's waits there with reason `deleted` until restore).
      `search.forget_overlay(conn, owner_id, overlay_id)` deletes that owner's rows of that overlay (vectors and their
      fts in one row each) and is called only by SRV-INGEST's GC and purge under their locks (FR-INGEST-44, -45).
      Tracing as FR-OBS-13 (counts only). [db]
