  - "English plus Russian full-text on one material (mixed-language materials), language detection per chunk."
  - "Reranking, MMR diversification, snippets with highlighted terms (ts_headline)."
  - "bge-m3 sparse and multi-vector (ColBERT) outputs."
  - "A cpus limit on the embed service and its effect on the job time."
  - "Search across courses/lessons and the knowledge base (SRV-KB)."

owner_notes:
  - "A new internal service `embed` (no egress, no secrets) runs the 2.27 GB bge-m3 model; its memory limit is set from the spike spikes/embed-service. The image is several GB because the model is baked in."
  - "The pgvector extension is added to the reader-postgres image (PGDG package 0.8.7)."
