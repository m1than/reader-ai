proposed_requirements:
  # FR-SEARCH-21 of the draft (the policy) moved to `requirements` as FR-SEARCH-34 with its Red test (phase 2,
  # 2026-11-27): FR-SEARCH-21 is taken by forget_legacy (paired change of V.kl-ingest-packs).
  - id: FR-SEARCH-22
    text: >-
      **`find` entry, budget and response (B8).** `find(caller, channel, query, filters=None, k=None, budget=None,
      judge_ctx=None, question_type=None)`; `caller` = (user id, course roles, provider presence). `query` is NFC,
      trimmed, 1–1000 characters (`query_invalid`); `filters` keys come from the facets file (`filter_invalid`); `k`
      1..k_max (`k_invalid`), unset = no count cap; `budget` an integer, below `budget_min` → `budget_invalid`, unset
      = the channel's default, above the channel's maximum clamped to it (not an error); `question_type` only from
      internal callers (the pipeline's fact-check route); `judge_ctx` from the caller (tutor, pipeline, `obs.eval`)
      or, on the owner channel, built by FR-SEARCH-28. Token counts use SRV-AGENT's estimator on canonical JSON. The
      response is `{brain_version, policy_version, budget: <effective>, cards: [...], judge_ran, judge_source?,
      judge_skip?, degraded}`. **`degraded`** is true iff the query embed call failed (FR-SEARCH-7's full-text
      fallback) or `judge_skip` ∈ {timeout, error, budget, saturated, quota_refused, no_provider}; it is false when the
      judge ran or was skipped as `gate` or `slice_empty`. **Response budget accounting:** the cards' budget B = the
      effective budget − estimate(the envelope in its largest form: `judge_source` and `judge_skip` both present with
      their longest values, `degraded` and `judge_ran` as `false` (the longer literal), `budget` with the channel maximum's digits, `cards` empty) − one
      character's estimate per returned card for the `,` separating cards in the array, charged as each card is
      selected (a card's cost in the greedy = its JSON estimate + 0.5); so the estimate of the whole canonical
      response never exceeds the effective budget (INV-SEARCH-9). **A card's cost is the estimate of its whole
      canonical JSON** (id, cite with quotes, source, next and text included), and the card budgets of B1 bound only
      its `text`: L1 text is cut to `card_budgets.L1` estimated tokens; L2 text is cut to `leaf` for a node without
      children, `root` for a top-level node and `chapter` otherwise, in this order: the title path is kept first (cut
      itself only when it alone exceeds the budget, and then no quote), then the summary when an L2 summary overlay is
      active, and the node's quote (FR-SEARCH-30) takes what is left of that same L2 text budget, cut at whitespace,
      or is omitted when nothing is left (VEC-SEARCH-9 pins the order); L0 text to `L0`. On the pipeline channel for an entitled caller L1 text is
      not cut (B8 table: full span text; the pipeline's budget bounds the response). A cut is at the last whitespace at
      or before the limit, hard when there is none. A card is `{id, layer, title, text, cite: [{spn, quote_sha256,
      quote?}], source: {id, role, as_of, reliability, license}, next: [ids], judged, more?}`; `more: true` only for a
      cut `shareable` L1 card. The request hash = sha256 of the canonical JSON {user id, sorted roles, channel, query,
      filters, k, effective budget, brain_version, policy_version}. No response is cached (round 1). [unit, db]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: each validation code; budget_min − 1 → budget_invalid, budget_min accepted; budget above max → clamped and echoed; degraded true for an embed failure and for each of timeout, error, budget, saturated, quota_refused, no_provider, false for a judged response, gate and slice_empty; the whole response's estimate ≤ the effective budget at the boundary (a selection that fills B exactly, with the largest envelope and n separators); a card's cost equals the estimate of its whole JSON; L1, L2 (leaf, chapter, root, with a quote counted in the L2 text budget) and L0 cuts at whitespace and hard; pipeline L1 not cut for an entitled caller; more only for shareable; request hash changes with each field; two identical calls make two candidate reads (no cache)"
  - id: FR-SEARCH-23
    text: >-
      **Step 1, route by rules (0 model calls).** Question type: the caller's `question_type` when given (only
      `fact_check` is accepted from internal callers); else `exact` when any identifier regex of `question_rules`
      matches the query; else `current_state` when a wording regex matches; else `thematic`. Route = `routes[<channel>.
      <type>]`. Layers not yet built (L3, L4, L5 before their specs) are skipped and the trace says which layers were
      available. Identifiers found become the `exact` route's filter and objective elements. [unit]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: VEC-SEARCH-8 classification and route lookup; unbuilt layers skipped"
  - id: FR-SEARCH-24
    text: >-
      **Steps 3–5: merge, gate, expansion and preselection (0 model calls).** (3) Cards linked by `same_point` above
      the policy's τ are merged by the pivot algorithm (FR-SEARCH-27 c); the merged card keeps the pivot's text and
      takes all members' citations and the maximum score. The links come from a `Links` port; its production default
      returns no links until SRV-KB, so step 3 is the identity in stage V. (4) Gate: `never_judge` → separated;
      `always_judge` → not separated; `margin` → separated iff there is at most one card or s1 − s2 ≥ margin over the
      merged cards' scores. Separated → step 7 on the merged cards with `judge_skip: gate`. (5) Otherwise expand 1 hop:
      each merged card adds its `next` targets (an L1 card: the next span in reading order and its section; L2: its
      children), at most `expand_per_card` per card; a card reached only by expansion scores max over its parents of
      parent score × `expand_decay`, a card that is also a candidate keeps its own score if higher. Keep the top
      `expand_cap` of the expanded set by (score desc, id), then select with FR-SEARCH-27's budgeted greedy under
      `preselect_factor` × the cards' budget, with no k (k applies in step 7 only). Expanded cards obey the route's
      `layers` (a target of a layer the route does not list is not added, e.g. an L2 section on an L1-only route)
      and the channel's eligibility (FR-SEARCH-30): no link into an ineligible L1 card is followed. [unit, db]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: gate modes and the margin rule at the boundary; expansion score rule (only-by-expansion, both, two parents); cap 50 by (score, id); the preselection's cost ≤ 1.5 × budget; Links fake with edges merges as VEC-SEARCH-7; an L2 target is not added on an L1-only route"
      - "add server/tests/search/test_find_db.py [db]: expansion over real next links of an active pack; an ineligible L1 target is not added"
  - id: FR-SEARCH-25
    text: >-
      **The coverage objective (B5).** Query elements E = the lexemes of `to_tsvector(cfg, query)` for each fts_config
      of the eligible packs ∪ the identifiers of step 1 (lowercased); weights: identifier `objective.identifier_weight`,
      lexeme `objective.lexeme_weight`, normalised to sum 1 when E is non-empty. A card covers e when e is among the
      lexemes of its window `fts` values (L1) or of `to_tsvector(cfg, title || summary)` (L2), or, for an identifier,
      when it occurs case-insensitively in the card text. Each card c also covers a private element of weight λ ·
      rel(c), rel(c) = max(0, score(c)) / s_top with s_top the top merged score of the request (fixed for the
      request), and rel(c) = 0 for every card when s_top ≤ 0 (no division by zero or a negative scale). f(S) = the
      weight of the elements covered by S: a weighted coverage, monotone submodular with non-negative weights, so the
      bounds of FR-SEARCH-27 apply. License and supersession enter only as filters before selection. [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_unit.py [unit]: elements and weights over VEC-SEARCH-5 (revised); f is monotone and submodular on random instances (Hypothesis); rel normalisation fixed per request; s_top ≤ 0 → every rel 0"
  - id: FR-SEARCH-26
    text: >-
      **Bounded work.** Every selection over the graph and the embeddings is FR-SEARCH-27's greedy over at most
      `candidates_max` (step 2) or `expand_cap` (step 5) cards; nothing enumerates subsets, calls a solver or
      recomputes globally (ADR-0039 invariant 3). Each budgeted pass evaluates at most n(n+1)/2 marginal gains in its
      greedy loop plus n singleton values for the best-single branch, for n ≤ 50. [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_unit.py [unit]: gain and value evaluations counted ≤ n(n+1)/2 + n on n = 50"
  - id: FR-SEARCH-27
    text: >-
      **The B5 greedy algorithms (`reader.search.greedy`, pure).** (a) **Budgeted max coverage** `budgeted(cards, f,
      cost, B, order, k=None)`: G starts empty; repeatedly add, among the cards not in G that fit (cost(G) + cost(c) ≤
      B) and have Δ(c | G) > 0, the one with the largest Δ/cost (ties: higher score, then smaller id), stopping at k
      cards when k is set; c* = the fitting single card of largest f({c}) (same ties); T = G if f(G) ≥ f({c*}) else
      {c*}; then **fill**: walk `order` and add each card that still fits (and k allows). Bound, stated per pass over
      its own input and budget: f(T) ≥ (1 − 1/e)/2 · OPT ≈ 0.316 · OPT (Khuller, Moss and Naor 1999), for unset k; the
      fill only adds cards, so by monotonicity it never lowers f. This answers B6 step 7's two choices: a fitting
      zero-gain card is returned through the fill, and a fill after the best-single-card branch is allowed. **k:**
      when k is set and the k costliest input cards together fit in B, the budget cannot bind, so the pass picks by
      largest Δ instead of Δ/cost, which is the cardinality greedy with f(T) ≥ (1 − 1/e) · OPT over sets of ≤ k cards
      (Nemhauser, Wolsey and Fisher 1978); otherwise, when k binds together with the budget, no bound is claimed
      (declared). (b) **Weighted set cover** `set_cover(universe, sets, cost)`: a pure function, lowest cost per newly
      covered weight first, ties by id; bound H(d) ≤ 1 + ln d, d the largest set size (Chvátal 1979; Feige 1998
      threshold). Stage V ships it only with its bound test; its caller (atlas gaps, purchase proposals) is deferred to
      SRV-KB (proposed_defers). (c) **Pivot** `pivot(cards, plus, seed)`: order the cards by sha256(seed ‖ id); take
      the first unassigned card, attach its unassigned + neighbours, repeat; seed = the request hash. Bound: expected
      disagreements ≤ 3 · OPT over uniformly random orders (Ailon, Charikar and Newman 2005). [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_unit.py [unit]: VEC-SEARCH-6 hand-computed cases (ratio pick, best-single branch wins, fill after each branch, zero-gain fitting card filled, k stop, the k-costliest-fit switch to gain order, ties); pivot over VEC-SEARCH-7; set_cover hand cases"
  - id: FR-SEARCH-28
    text: >-
      **Step 6, the `judge.find` waiter (B6, B7b).** Runs only when step 4 is not separated. (1) **Slice:** the
      longest prefix of the preselection in score order whose rendered input (`judges.render_find_input(query,
      cards)`) estimates ≤ min(`preselect_factor` × the cards' budget, `judge.input_cap_tokens`). Each card is
      rendered as the channel serves it to this caller (so the judge reads the MCP row for a non-entitled caller,
      FR-SEARCH-30), with its L1 text cut at `card_budgets.L1` on every channel, pipeline included. **Empty slice**
      (an empty preselection, or a first card whose rendered input with the query and the frame already exceeds the
      limit, as with a small budget): no row, no job, no call, `judge_skip: slice_empty`, `degraded` false, and step 7
      selects from the capped expanded set, as when the judge degrades. (2) **Recorded:** input hash =
      `judges.find_input_sha256(caller id, query, [[id, text], …])`; a `judges.recorded` hit under the current judge
      name is applied with `judge_source: recorded`, no row, no job, $0. (3) **Context** (`judge_ctx` = line, run_id,
      run_cap_usd, lesson_id, daily_budget_usd): the caller's when given (tutor: line `tutor` and the question's run;
      pipeline: line `compile` and the compile run; `obs.eval` passes its own). On the owner channel without one,
      `find` builds {line `mcp`, run_id: a fresh uuid4 per request, run_cap_usd: policy `owner_judge_run_cap_usd`,
      lesson_id: null, daily_budget_usd: the user's effective daily budget}. Degrades without a row or job: no
      provider handle for the caller → `no_provider`; no context on another channel, or the slot missing from config
      → `error`. (4) **Request:** the process-wide listener (one connection per process holding `LISTEN judge_done`,
      dispatching payloads to waiting requests by request id; it is started before the first request and restarted on
      loss, and a request issued while it is down degrades `error`) registers the request id first; then one
      committed transaction inserts the `judge_requests` row (request_id, input_sha256, owner_id, the context fields,
      created_at = the database's `now()`, deadline = the database's `now()` + `judge.timeout_s`, never the process
      clock, query, cards, pack_ids); then `judge.find` is enqueued
      with args exactly `{request_id, input_sha256}` keyed by the request id; on an enqueue failure the row is deleted
      and the find degrades `error`. (5) **Wait** at most `judge.timeout_s` from created_at for the request's
      notification. Payload `<request_id>:<code>`, code in the closed set {ok, recorded, output_invalid, budget,
      saturated, quota_refused, expired, error} (paired SRV-AGENT ask, kl_paired_changes): ok or recorded →
      `judges.recorded`; a hit is applied with `judge_source: live`, a miss degrades `error`; budget, saturated and
      quota_refused degrade with that `judge_skip` (saturated = SRV-AGENT's lane_saturated); every other code →
      `error`. Interim rule while FR-AGENT-21 still sends the bare id: a payload without `:` is read as code `ok`. No
      notification in time → `timeout` (the late job still records its output for replay; this response ignores it).
      Any database error → `error`. The waiter never retries and makes at most one request per `find`. The same code
      runs in the api and in worker jobs that call `find`. A separate `owner` ledger line instead of `mcp` is a
      possible owner follow-up (kl_open_points 1). [db]
    tests_planned:
      - "add server/tests/search/test_judge_wait_db.py [db] (fake lane that reads the row, records an output and notifies): slice within min(1.5 × budget, 3,000) by the rendered estimate and in score order (VEC-SEARCH-10); a pipeline card over 600 tokens is cut in the judge input only; empty preselection → no row, no job, judge_skip slice_empty, degraded false; a budget so small that the first card's rendered input exceeds 1.5 × B → the same; created_at and deadline come from the database clock (a test with a skewed process clock); a recorded hit → no row, no job, judge_source recorded; no provider → no_provider; tutor channel without ctx → error; owner channel without ctx → a row with line mcp, a fresh run_id per request, run cap from policy, lesson_id null, the user's daily budget; a caller-given ctx is used unchanged; live output in time → applied, live; each payload code maps as stated; a bare-id payload → read as ok; no notification within the timeout → timeout, returned by timeout + 0.5 s; enqueue failure → the row deleted, error; listener down → error with no row; the row carries request_id and input_sha256; the registration precedes the insert (a lane that notifies at once is not missed); exactly one row and one job per find; the job args are exactly {request_id, input_sha256}; one LISTEN connection per process under 20 concurrent finds"
  - id: FR-SEARCH-29
    text: >-
      **Step 7, final selection and order (B6).** Cards budget B. **Without an applied judge output:** one
      FR-SEARCH-27 (a) pass over the merged cards (gate separated) or the capped expanded set (judge degraded or
      `slice_empty`), order by
      score, with the request's k; every card `judged: false`; `judge_ran: false`. **With an applied output:** pass 1
      over the cards the judge kept, under B and the request's k, fill order = the judge's order; pass 2 over the
      unjudged remainder (preselection minus the slice) under B − cost(pass 1) and k − |pass 1| (no pass 2 when that is
      0), on f(· ∪ P1) − f(P1), fill order = score; cards the judge read and dropped are excluded. Response order: pass-1 cards in the judge's order, then pass-2 cards by score. `judged: true` exactly for
      pass-1 cards; `judge_ran: true`; `judge_source` live or recorded. A remainder card never displaces a kept one.
      The response and the trace record `judge_skip` in the closed set {gate, slice_empty, timeout, error, budget,
      saturated, quota_refused, no_provider} when no judge ran, and the trace the judged and unjudged token counts
      (FR-SEARCH-33; `slice_empty` joins SRV-OBS's enum, kl_paired_changes). The judge's `sufficiency` is recorded for the slice
      only and is not applied to the remainder. [unit]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: VEC-SEARCH-10 mixed responses — kept first in judge order, remainder by score, judged false on the remainder, dropped excluded, kept cards exceeding B chosen by the greedy not the judge order; degraded path selects from the capped expanded set; all-dropped → pass 2 only; k = 3 with 2 kept → pass 2 takes at most 1; k reached in pass 1 → no pass 2"
  - id: FR-SEARCH-30
    text: >-
      **Personal-use cards per channel and caller (B8 table).** `entitled(caller, pack)` is true iff the caller owns
      the pack, or the caller has a material row that is not soft-deleted whose sha256 our code computed from bytes
      that caller uploaded or imported (SRV-INGEST receive), equal to the pack's material sha256; a client-declared
      sha256 never counts. Eligibility for a pack with `license: personal-use`: on channel `mcp`, and on every channel
      for a caller who is not entitled, no L1 card is returned, no `next` link and no `open` child leads to an L1 id,
      and L2 (and, from SRV-KB, L4) cards carry their citations with quotes and no continuation; on `owner` and
      `tutor` for an entitled caller, full L1 text cut at the card budget; on `pipeline` for an entitled caller, full
      span text, not cut (B8 table; the pipeline's budget bounds the response). `shareable` packs are eligible on
      every channel. **Quotes:** a quote is the first ≤ `quote_max_chars` (300) code points of the cited span's text,
      cut at the last whitespace at or before 300 (hard when there is none), so its position is fixed by the locator
      and repeated calls never reveal a different window; a non-L1 card carries at most `quotes_per_card_max` quoted
      citations (initial 1; further citations carry `spn` and `quote_sha256` only), and its quotes count in the card's
      cost against its L2 text budget (FR-SEARCH-22). L2 cards in stage V cite the first non-empty span of their node.
      **Quote allowance per material (deterministic):** `quote_allowance(owner_id, material_sha256)` is computed over
      the material's active pack only (an inactive pack serves no cards, so it has no allowance): it walks the pack's
      outline nodes in outline order (pre-order, then outline path) and grants node n its quote while the cumulative
      quoted code points stay ≤ `walk_quote_fraction_max` (initial 10%) × the pack's total span text code points. The
      allowance always counts the **full** quote (the ≤ 300-code-point prefix of the cited span), each distinct cited
      span once, even when a card later serves a shorter prefix of it because the L2 text budget cut it
      (FR-SEARCH-22); so what any card serves is ≤ what was counted. The quote sits in `cite[0].quote` of the node's
      card, the node's first citation; every non-granted node's citation carries `spn` and `quote_sha256` only. The
      allowance is a function of the active pack and the policy alone, so no sequence of calls on any channel obtains
      more quoted text of the material's active pack than that fraction (residual, declared: a pack switch after a
      converter upgrade computes a new allowance over the new pack). The 10% is an engineering bound with no legal
      basis claimed; it is tighter than ADR-0015, which bounds only each citation (300 characters). Judge input follows
      the channel's row for that caller (FR-SEARCH-28 (1)). Scope stays
      the caller's own manifest (INV-SEARCH-1) until SRV-SHARE; the entitlement function is still implemented and
      tested on constructed rows, so SRV-SHARE only widens the scope. [unit, db]
    tests_planned:
      - "add server/tests/search/test_cards_db.py [db]: entitled for the owner; for another user with a live own copy of the same sha256; not with a soft-deleted copy; not with only an uploads row or a sha256 given by the client; VEC-SEARCH-9's channel × entitled × license → card shape; a quote is the span's first ≤ 300 code points cut at whitespace (and hard without one); a card with two citations quotes one; the quote's estimate is inside the L2 text budget"
      - "add server/tests/search/test_cards_props.py [unit] (Hypothesis): over generated outlines (deep trees, many short sections, sections sharing a first span, spans shorter and longer than 300 code points), quote_allowance's total distinct quoted code points (full quotes) ≤ 10% of the active pack's text, nodes are granted in outline order with no gap (the granted set is a prefix of the order), every served quote is a prefix of its counted full quote and sits in cite[0].quote, the result is identical across calls, and an inactive pack of the same material has no allowance"
  - id: FR-SEARCH-31
    text: >-
      **`open(caller, channel, id, depth=1, budget=None)` (B8).** `spn:` must equal the locator of a sealed span of an
      active pack in the caller's manifest; any other range, an inactive or another user's pack, or an ineligible L1
      span (FR-SEARCH-30) answers `not_found` (the same code, so a refusal never confirms existence). For a cut
      `shareable` span it returns the full text within the open budget (`more: true` again when still cut). `sec:`
      returns the node's card and its children down to `depth` (≤ `open_depth_max`, else `depth_invalid`), skipping
      ineligible L1 children; `src:` returns the L0 profile card and the top outline level. `con:`, `fnd:`, `les:`
      answer `not_found` until SRV-KB and SRV-LESSON provide them (declared). Malformed ids → `id_invalid`. Same
      budget clamping and card shape as `find`; no judge. [db]
    tests_planned:
      - "add server/tests/search/test_open_db.py [db]: a sealed locator resolves; a shifted range, a guessed offset, an empty-span ordinal that does not exist, an inactive pack and another owner's span → not_found; sec children to depth and depth_invalid; budget clamp; shareable more/continuation"
  - id: FR-SEARCH-33
    text: >-
      **Tracing and readers for SRV-OBS.** `find` opens FR-OBS-36's subtree through `reader.obs.find` helpers with
      ids, enums, counts and hashes only (channel, route, question type, entitled, layers, counts, token counts,
      `judge_ran`, `judge_source`, `judge_skip`, the gate outcome, card uris and sha256s); `find.judge_wait` is
      current while the waiter enqueues. `reader.search.cards.read(conn, caller, ids)` returns the cards' text as that
      caller may read it on the owner channel (B8: the MCP row for packs the caller is not entitled to), in memory, for
      SRV-OBS FR-OBS-39/40. Nothing in reader.search logs or traces a query, filter value or card text. [unit, db]
    tests_planned:
      - "add server/tests/search/test_find_obs_db.py [db]: the span tree and attributes for a gated, a judged and a degraded find (in-memory exporter); a canary in the query and in a span text appears in no span attribute and no log record; cards.read applies the MCP row for a non-entitled pack"

proposed_invariants:
  - id: INV-SEARCH-9
    text: >-
      **Budget and count never exceeded.** For any request (any budget from `budget_min` up, including one above the
      channel maximum, any k) and any corpus, the estimate of the whole canonical response (envelope, cards and
      separators, as serialised) ≤ the effective budget ≤ the channel maximum, the number of returned cards ≤ k when k
      is set, and every card's `text` ≤ its layer's text budget (L1 not cut on the pipeline channel for an entitled
      caller). Property test. [unit]
    tests_planned:
      - "add server/tests/search/test_find_props.py [unit] (Hypothesis): estimate(canonical JSON of the returned response) ≤ effective budget for every judge outcome (judged, each judge_skip value, embed degraded), budgets from budget_min to above the maximum, k set and unset; card count ≤ k; text budgets per layer"
  - id: INV-SEARCH-10
    text: >-
      **Greedy bounds against exhaustive search, per pass.** On random instances with n ≤ 12 cards: the step-5
      preselection, step-7 pass 1 and step-7 pass 2 (on its marginal objective with pass 1's output fixed) each reach
      ≥ (1 − 1/e)/2 of the optimum over all subsets within that pass's budget (k unset); `set_cover` costs ≤ H(d) ×
      the optimum; the pivot's exact expected disagreements, averaged over all n! orders (n ≤ 6), ≤ 3 × the optimum
      clustering over all partitions; with k set and the k costliest cards fitting, the pass reaches ≥ (1 − 1/e) of the
      optimum over sets of ≤ k cards. No bound over the union of the two step-7 passes is asserted (ADR-0039 B5). Enumeration exists only
      in the tests. [unit]
    tests_planned:
      - "add server/tests/search/test_greedy_props.py [unit] (Hypothesis, exhaustive oracles)"
  - id: INV-SEARCH-11
    text: >-
      **One judge call at most, last, on the slice only.** For any `find`: no model call before step 6; at most one
      `judge_requests` row and one `judge.find` job; the cards in the row are a prefix in score order of the step-5
      selection whose rendered estimate ≤ min(1.5 × budget, the cap); a recorded hit makes no row; an empty slice
      makes no row, no job and no call and reports `slice_empty`. [db]
    tests_planned:
      - "add server/tests/search/test_judge_wait_db.py: property over random corpora, budgets (including ones below one rendered card) and policies with a counting fake Provider and lane; VEC-SEARCH-10's slice_empty cases"
  - id: INV-SEARCH-12
    text: >-
      **Personal-use walk and cross-user tests (B1 navigation invariant, B8).** Starting from the sources' top cards
      with channel `mcp`, following every `next` and `open` child of a personal-use pack: no L1 card is returned, no
      quote exceeds 300 characters, no card carries more than `quotes_per_card_max` quotes, the distinct quoted
      characters over the whole walk are ≤ `walk_quote_fraction_max` (initial 10%) of the material's span text (the
      per-pack allowance of FR-SEARCH-30 makes this hold by construction; the walk checks it end to end), and
      `open` on every cited `spn:` id and on guessed locators of the same material answers `not_found`. On every
      channel, a second user without an own copy gets no card of the owner's pack (trivial under INV-SEARCH-1, listed
      again as an SRV-SHARE required test) and no judge request carrying L1 text; with an own copy on tutor, L1 cards.
      Coverage: for an entitled caller on tutor, owner and pipeline, and for any caller on `mcp` for a `shareable`
      pack, every active non-empty span is reachable from the sources' top cards by `open` children and `next`
      links. [db]
    tests_planned:
      - "add server/tests/search/test_walk_db.py [db]: the MCP walk on a personal-use pack (no L1, quote length and count, distinct quoted characters ≤ 10% of the material, refusals); the cross-user case; reachability on tutor, owner and pipeline (entitled) and on mcp for a shareable pack"
  - id: INV-SEARCH-13
    text: >-
      **open resolves only sealed span ids.** For any string after `spn:`, `open` returns a card only when it equals a
      stored locator of a sealed span of an active pack in the caller's manifest. Property test over random ranges
      around real locators. [db]
    tests_planned:
      - "add server/tests/search/test_open_db.py: Hypothesis over shifted ranges and ordinals"
  - id: INV-SEARCH-14
    text: >-
      **No text in judge job args (waiter side).** With a canary in the query and in a card text, no `judge.find` job's
      args and no `job_keys` row contain it; the text is only in the `judge_requests` row. (The table-side canary and the
      collector are SRV-EVENTS'.) [db]
    tests_planned:
      - "add server/tests/search/test_judge_wait_db.py: canary over procrastinate_jobs args and job_keys"
  - id: INV-SEARCH-15
    text: >-
      **Unreviewed findings never returned.** Cards of layer L4 come from a `Findings` port (production default: empty
      until SRV-KB) and only reviewed findings are eligible on any channel or in judge input. [unit]
    tests_planned:
      - "add server/tests/search/test_find_unit.py [unit]: a fake Findings port with reviewed and unreviewed findings"

