defers:
  - "HNSW (or another vector index) once a measured row count or exact-scan p95 calls for it (ADR-0007, roadmap)."
  - "Re-embed on a model change as its own cleanup job; in the slice a new key makes new chunks and old ones are ignored, not deleted."
  - "Mixed-language materials and per-chunk language detection."
  - "Reranking, MMR diversification, highlighted snippets (ts_headline)."
  - "bge-m3 sparse and multi-vector (ColBERT) outputs."
  - "A cpus limit on the embed service and a second worker for embed jobs."
  - "Search across lessons and the knowledge base (SRV-KB)."

owner_notes:
  - "ADR-0028 (accepted 2026-11-22): a new internal service `embed` (no egress, no secrets, its own network with api and worker only) runs the 2.27 GB bge-m3 model; its image is about 5.6 GB because the model is baked in. Memory limit 3g (spikes/embed-service), with at most 8 texts per call."
  - "The pgvector extension is added to the reader-postgres image (PGDG package 0.8.7)."
  - "ADR-0007's revisit trigger says 'below 0.8 on the pilot question set'. Does that mean v1 (30 questions, dense 1.0) or v2 (40 harder questions, dense 0.675)? The slice reports both."
  - "While the full pilot embeds (about 22–36 min at 8 CPUs), the worker's single job slot is busy; compile stages wait."
  - "After changing a material's `language` in reader.yaml, run `reader.search.ensure <material>`: search keeps using the old chunks until the new key is embedded, and nothing re-embeds automatically."

