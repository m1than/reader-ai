proposed_revisions:
  - id: FR-SEARCH-3
    text: >-
      **Span windows (replaces chunking across spans).** The unit of retrieval is the L1 span of an active base pack
      (ADR-0039 B1). For the vector overlay, every span with non-empty text yields its windows: the span's text
      alone, cut by VEC-SEARCH-2's algorithm with size 1,200, overlap 200 and no minimum for the first window (a short
      span is one window; trailing windows under 80 characters are merged into the previous one). When a context
      prefix overlay is active for the pack (only if `retrieval-ablation` keeps prefixes), the embedded text of each
      window is prefix + "\n" + window and the window size shrinks to 1,200 − len(prefix) − 1, so every embed passage
