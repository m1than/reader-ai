kl_open_points:
  - "1. Ledger line for a judge.find made on the owner channel (/api/find, the stage-V evaluation): SRV-AGENT's lines for judge.find are tutor, compile, mcp, eval (lane refuses eval). Proposal: mcp until SRV-MCP; else a new `owner` line (SRV-AGENT paired change)."
  - "2. The waiter sees only 'notified without output', so SRV-OBS's judge_skip values budget, saturated and quota_refused cannot be told from error. Proposal: FR-AGENT-21 (10) notifies `<request_id>:<code>` (codes only, no text); until then they record as error."
  - "3. Tutor budget unit: 10,500 estimator tokens is 21,000 characters, about 2× the tutor's 21,000-byte cap for Cyrillic; the tutor's drop rule trims it. V.kl-tutor-find may set the tutor budget from the measured bytes per character."
  - "4. k with a budget: no approximation bound is claimed when k binds (FR-SEARCH-27); B8 keeps k optional."
  - "5. set_cover has no stage-V consumer (SRV-KB, stage 7); kept because the task asks for it, could move to SRV-KB."
  - "6. Unmeasured initial values in policy (expand_decay 0.5, objective weights, thresholds 0.5): AGENTS.md routes numbers without a spike to Fable; the evaluation reports their effect, none gates a merge."
  - "7. If retrieval-ablation's span-level V0 is significantly worse than the chunk baseline (27 of 40), the span unit (ADR-0039 B1) is an owner question: block, do not fall back silently."
  - "8. Long spans: windows with min-distance aggregation (FR-SEARCH-3) versus one vector of the first 1,200 characters; the ablation's span run should use the chosen form."
