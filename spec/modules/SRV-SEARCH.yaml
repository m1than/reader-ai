# SRV-SEARCH — vertical-slice revision (slice: V.SRV-SEARCH-min; docs/roadmap.md "Vertical slice first", step V3).
#
# What this revision covers: the spans of an imported material (SRV-INGEST) become chunks with BAAI/bge-m3 dense
# vectors and a Postgres full-text vector; a hybrid query (exact dense scan + OR full text, reciprocal rank fusion)
# returns the owner's top-k chunks, each with its span ids and page, for the api route and for the internal callers
# V.COMPILE-min and V.TUTOR-min.
#
# Where embedding runs: ADR-0028 (accepted by the owner 2026-11-22). A dedicated service `embed` on its own internal
# network `embed` (members api, worker, embed only; no route to postgres, mcp, agent-proxy, kernels or the internet),
# no secrets, model baked into the image from a pinned revision. spikes/embed-service measured it (fp32, cap 1,024,
# worst-case texts): peak RSS 877 MiB after load, 2,410 MiB for the worst request of 8 texts, 3,644 MiB for 32; at
# 8 CPUs an idle query takes 0.5–0.9 s, a worst batch of 8 takes 11–13 s, and the full pilot about 22–36 min. The
# service admits at most 8 texts per call, so its mem_limit is 3g. Re-measured 2026-11-23 for the service itself (its
# weights_only precheck now on mmap; before that it held the state in anonymous memory, 3,459 MiB peak, code review
# of dd364ba): the limit is sized on the cgroup's anonymous memory (memory.stat anon), about 1.1 GiB after a real start
# plus the worst request of 8; the 2.17 GiB of mapped weights are file cache the kernel can reclaim (OPS-DEPLOY
# FR-DEPLOY-9 has the numbers).
# The embeddings-local spike's 14.03 min (13 threads, batch 32, raw text layer) is the earlier speed reference.
#
# Cross-spec items (paired changes in their own specs):
#   - OPS-DEPLOY: service `embed` (mem_limit 3g, memswap_limit 3g, from spikes/embed-service; no cpus limit in the
#     slice) and network `embed` (internal: true; api, worker, embed), `deploy/images/embed.Dockerfile`
#     (HF_HUB_OFFLINE=1 and TRANSFORMERS_OFFLINE=1 as ENV; dependencies installed from the hash-locked
#     `deploy/images/embed.requirements.lock` with `--require-hashes`; only the files `reader/search/__init__.py`,
#     `embed_service.py`, `fetch_model.py` and `models.lock.json` copied into site-packages, so the image carries no
#     config, db or api code; healthcheck `["CMD", "python", "-I", "-m", "reader.search.embed_service",
#     "--healthcheck"]`), new
#     VEC-DEPLOY-2 reachability pairs (api→embed, worker→embed allowed; embed→postgres, embed→mcp, embed→agent-proxy,
#     embed→kernel-*, embed→internet refused); no `depends_on: embed` anywhere; and the reader-postgres image installs
#     `postgresql-18-pgvector` 0.8.7-1.pgdg13+2 from the image's PGDG apt source (measured 2026-11-21 with
#     `apt-cache policy` in the pinned postgres:18-trixie digest; the official image ships no pgvector). If PGDG drops
#     that exact version, the fallback is building pgvector from its v0.8.7 source tag in the same Dockerfile.
#   - SRV-AUTH: `reader.api.app.ROUTERS` adds `reader.search.routes`; the declared `version_locations` adds
#     `reader/search/migrations` (branch label `search`, down_revision SRV-AUTH's `0001_auth`; see FR-SEARCH-4 for the
#     ingest dependency); the engine is created with `hide_parameters=True`, so SQL errors never log bound parameters
#     such as a query text.
#   - Tests of every module that migrates to heads (auth, jobs, lessons, kernels, search) run Postgres from the pinned
#     image `pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa`
#     (the official postgres:18-trixie plus pgvector 0.8.7, the version reader-postgres installs), because this
#     module's migration is one of the heads and needs the `vector` extension. The conftests change, not the tests.
#   - SRV-EVENTS: the declared kind-module list adds `reader.search.jobs`.
#   - SRV-INGEST: after a successful `ingest.import`, the import handler enqueues `search.embed` for that ingest
#     (FR-SEARCH-5's key); enqueue is idempotent.
#   - V.COMPILE-min: SRV-EVENTS runs the worker at concurrency 1, so a full-pilot embed job (about 22–36 min at 8 CPUs) holds the only
#     job slot; compile stages queue behind it.
#
# Declared deviations:
#   - ADR-0007 (proposed) and the roadmap's stage-3 row name pgvector HNSW. The slice uses an exact scan (FR-SEARCH-7):
#     the pilot has 2,285 chunks, which is 2,285 × 1024 × 4 B ≈ 9.4 MB of vectors read in one pass per query, and an
#     exact scan has no recall loss and no tuning. The reviewer measured the exact scan at slice scale: a Seq Scan of
#     6.6 ms. HNSW is deferred until a measured row count or a measured p95 says otherwise.
#   - The roadmap's stage-3 row and ADR-0007 sketch a GET search route; this spec uses `POST /api/search` (FR-SEARCH-8),
#     so the query never appears in a URL or an access log. A POST must carry the exact Origin (SRV-AUTH FR-AUTH-12),
#     so the live check sends Origin with it.
#   - The roadmap's stage-3 bound is recall@10 ≥ 0.8 on the 30-question v1 set, and ADR-0007's revisit_when fires below
#     0.8 "on the pilot question set". The slice's acceptance is NFR-SEARCH-1 on the harder, owner-accepted v2 set.
#     Which set ADR-0007's trigger means is an owner question.
#   - Chunk text comes from SRV-INGEST spans (Docling text), not the raw pypdfium2 text layer the spike chunked, so the
#     spike's recall is a reference; the [local] run measures dense-only and hybrid on the same chunks.
#   - `models.lock.json` lives in the package (`server/src/reader/search/`), not under spec/fixtures, because the image
#     build reads it.
#   - REF URLs: the pgvector README is pinned to the v0.8.7 tag (the PGDG package version); the bge-m3 card is read at
#     the revision recorded in models.lock.json.
#   - SRV-INGEST's code and migration are not on the integration branch yet (built in parallel). So this module's
#     migration branches off `0001_auth`, `ingest_id` is a plain uuid column without a foreign key, and the [db] tests
#     create the three SRV-INGEST tables they read (`materials`, `ingests`, `material_spans`, columns as in
#     SRV-INGEST FR-INGEST-14) through a test-only helper in server/tests/search/. When SRV-INGEST's migration lands, a
#     follow-up revision (task V.SRV-SEARCH-fk) re-parents this branch onto the ingest head and adds the foreign keys.
#   - torch and sentence-transformers are not installed in the dev environment (several GB); the module that imports
#     them (`embed_service`) keeps them behind a typed `Encoder` protocol and mypy treats the two packages as untyped
#     (`ignore_missing_imports`), so `mypy --strict` still covers every line of reader.search. The real model is
#     exercised only by the [image] tests and the [local] bench.
#   - Job kinds are exported as `JOB_KINDS` (SRV-EVENTS' catalog contract), not `KINDS`.

