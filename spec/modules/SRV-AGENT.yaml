# ---- Proposed revision (ADR-0039 B7, B7a, B7b; DRAFT, not yet requirements) ----
#
# Ownership (ADR-0039 B11). SRV-AGENT: the judge slot table, judge versions, the recorded-output table and its
# replay, the `index` and `eval` ledger lines and their caps, the `judge.find` job handler that runs on the
# `worker-judge` lane, agent-proxy's client identity and per-client token table, and the loop-fit check the compile
# loop rule reads. Not here: the `worker-judge` Compose service, its fixed `agentnet` address and memory (OPS-DEPLOY);
# the `judge.find` queue, its consumer, the `judge_requests` table, its collector and the no-text-in-args canary
# (SRV-EVENTS); building the judge input, waiting by LISTEN/NOTIFY and applying the output (SRV-SEARCH); per-pack
# advisory locks, the active-pack check and the context-prefix batch job of 25 spans (SRV-INGEST); the `judge_inputs`
# copy and its consent rule (SRV-OBS); the loop order and the resized `budget_usd_per_lesson` values (SRV-PIPELINE);
# the new settings' schema (SRV-CONFIG); the per-token daily judge cap on MCP (SRV-MCP, stage 7).
#
# New files, all inside the existing `paths`: server/src/reader/agent/judges.py (slots, lines, versions, recorded
# outputs), server/src/reader/agent/lane.py (the `judge.find` job kind and handler),
# server/src/reader/agent/prompts/judge_find.md, migration agent_0004, fixtures VEC-AGENT-5/-6. `paths` is unchanged.
#
# Paired changes (each in its own spec, in V.kl-deploy-judge-lane unless named):
#   - OPS-DEPLOY: `agentnet` gets an explicit subnet with fixed IPv4 addresses for `worker` and `worker-judge`;
#     a test pins them equal to `reader.agent.proxy.CLIENTS`. deploy/reader.example.yaml binds the slots
#     (FR-AGENT-18) and, once `retrieval-ablation` and `judge-gate` have measured them, the new caps.
#   - SRV-EVENTS: KIND_MODULES gains `reader.agent.lane`; the `judge.find` queue is consumed only by worker-judge;
#     `judge_requests` carries the columns FR-AGENT-21 reads.
#   - SRV-CONFIG: `tasks` keys may contain dots (slot names; the schema already allows any non-empty key, but the
#     override key pattern `tasks.<name>.budget_usd_per_lesson` (`[a-z0-9][a-z0-9_-]*`) does not match them, so a
#     slot's task budget is a file setting only); `budgets.index_usd_per_pack`, `budgets.index_usd_per_pair_run`,
#     `budgets.eval_usd_per_run` (positive decimals, optional). They are file settings, not in ADR-0036's UI
#     allow-list (FR-CONFIG-25/-26 unchanged) unless the owner adds them; then `policy_version` hashes the effective
#     values (ADR-0039 B7).
#   - SRV-PIPELINE (V.kl-pipeline-checks): calls `loop_fits` (FR-AGENT-23) before each loop and resizes
#     `tasks.*.budget_usd_per_lesson` for the four checks; SRV-AGENT pins only the rule, not the values.
#   - SRV-INGEST (V.kl-ingest-packs): `PackGuard.lock_active(conn, pack_ids)` (sorted per-pack advisory xact locks,
#     the ones a purge takes; true iff every pack is active and not purged) and calls `judges.forget_pack` and
#     `judges.forget_overlay` under the same locks. Until it exists the lane takes the guard as an injected protocol.
#   - SRV-OBS (V.kl-obs-spans): `JudgeInputsSink.copy(conn, request_row, output)` under its consent rule, called in
#     the lane's write transaction; the `judge.find` job's linked trace.
#   - OPS-SANDBOX (V.kl-deploy-judge-lane; INV-SANDBOX-3 and the tests behind ADR-0025's `verified_by`): INV-AGENT-1
#     revised below names worker-judge; its [live] test and OPS-SANDBOX's "a request without a valid handle gets no
#     credential" test run against both services.
#   - OPS-CLI: `reader doctor` hints at a JUDGE_SLOTS slot missing from `reader.yaml` `tasks` (the call itself fails
#     closed with `unknown_model`).
#
# Promotion order (review round 1, blocker 1). FR-AGENT-3 revised (client identity) needs `agentnet`'s explicit
# subnet and fixed addresses (OPS-DEPLOY, V.kl-deploy-judge-lane); `deploy/compose.yaml` has none today, so merged
# alone it would refuse every worker request with `client_unknown`. FR-AGENT-3 revised, INV-AGENT-7 and VEC-AGENT-6
# therefore go Green only in the same integration merge as that OPS-DEPLOY change, never before it (recorded in
# docs/progress.yaml); the rest of this revision may merge earlier. The [image] oracle in FR-AGENT-3's
# tests_planned (a real worker issue succeeds through the Compose network) is the gate.
#
# Clock. Every deadline and retention comparison in the lane and in judges.py uses the database's `now()` (rows'
# `created_at` and `deadline` are database times); agent-proxy's TTLs use its own monotonic clock.
#
# Prompt shape. A slot call passes the slot's prompt file as `system` (so FR-AGENT-13 b's overhead applies) and the
# rendered input as `prompt`; `stage` = the slot name, `attempt` = 1 for `judge.find` (max attempts 1), the job
# attempt for offline slots.

proposed_bounds:
  run_tokens_max: 32               # unchanged: the table total, now split by client (FR-AGENT-3 revised)
  client_quota: { worker: 28, worker-judge: 4 }   # 28 + 4 = 32. worker: concurrency 1 (FR-EVENTS-9), 28 keeps
                                   # today's evict-oldest headroom; worker-judge: its concurrency (ADR-0039 B7b,
                                   # initial value set by judge-gate)
  lane_token_ttl_s: 30             # ADR-0039 B7b initial value; must stay >= the kill window (FR-AGENT-21 refuses a
                                   # request whose kill window does not fit under it, minus lane_ttl_margin_s)
  lane_ttl_margin_s: 5             # structural: revoke and settle after the kill take well under 1 s
  judge_kill_factor: 3             # ADR-0039 B7b: kill deadline = 3 x the B6 timeout (6.6 s at the initial 2.2 s)
  judge_find_output_retention_days: 30   # ADR-0039 B7 (the trace retention of ADR-0032 Decision 6), initial value
  judge_find_max_output_tokens: 512      # initial value: <= 13 cards fit the 3,000-token input cap at 230 tokens each,
                                   # so the output (ids + one number) is a few hundred tokens; judge-gate measures it
  judge_find_floor_usd: 0.002      # FR-AGENT-9's formula on Haiku for the cap: (1,000 + ceil(7,500 chars / 2.0))
                                   # x $0.20/M + 512 x $0.50/M = $0.0012; rounded up
  judge_find_input_tokens_max: 3000  # ADR-0039 B6 step 6 initial cap, counted with chars_per_token_floor; the lane
                                   # re-checks it (FR-AGENT-21), so a waiter bug cannot raise the reserve or latency
  lane_issue_timeout_s: 1.0        # the lane's agent-proxy client timeout (the worker keeps 10 s): a slow issue
                                   # degrades `find` instead of consuming the 2.2 s budget

proposed_errors: [lane_saturated, client_unknown, client_quota, line_invalid, cap_missing, index_budget_exhausted,
  eval_budget_exhausted, replay_miss, judge_window_too_long, judge_input_too_large]

proposed_tables:
  agent_spend: "agent_0004 adds `line text null`, CHECK line IN (compile, tutor, freshness, mcp, index, eval); the append-only trigger is unchanged; rows written before agent_0004 keep null"
  judge_outputs: { owner_id: true, columns: "owner_id → users.id, input_sha256 text, judge text (`<slot>@<version>`), output jsonb (parsed card ids and numbers only, never query, card or model text), pack_ids text[] (judge.find), overlay_id text null (offline slots), request_id uuid null, reservation_id bigint null → agent_spend.id, created_at default now(); PRIMARY KEY (owner_id, input_sha256, judge); a trigger refuses UPDATE and TRUNCATE, and refuses DELETE unless the transaction-local setting `reader.judge_delete` is `on`, which only FR-AGENT-20's expire and forget functions set (agent_0004)" }

proposed_revisions:
  - id: FR-AGENT-3
    text: >-
      Run tokens, per client. agent-proxy establishes the calling client from the connection's source address on
      `agentnet` and never from a request field or header: `CLIENTS` (data in proxy.py) maps each fixed IPv4
      address that OPS-DEPLOY declares to a client name with its quota, TTL and full-table rule — `worker`: quota
      `bounds.client_quota.worker`, TTL `bounds.run_token_ttl_s`, oldest own token revoked when exceeded;
      `worker-judge`: quota `bounds.client_quota.worker-judge`, TTL `bounds.lane_token_ttl_s`, the issue refused
      when full and, with `tools: false`, never given a tool allowance: a `web_search` field from worker-judge → 400
      `tools_not_allowed` whatever its task (only `worker` has `tools: true`). `main()` passes
      `proxy_headers=False` to `uvicorn.run`, so `X-Forwarded-For` is never read. Any request from an
      address not in `CLIENTS` (another service, the proxy's `egress` side) gets 403 `client_unknown` on every route,
      and nothing is issued, revoked or forwarded. `POST /run-tokens {"user": "<handle>", "max_output_tokens": n,
      "model": "<full id>"}` returns `{"run_token": "<43-char urlsafe base64 of 32 random bytes>"}` bound to that
      user, output cap, model and client for the client's TTL. Before every issue, revoke and forward the proxy
      purges every expired entry (age > its TTL), so an expired token never counts against a quota; purge, quota
      count and insert run with no `await` between them, so concurrent issues cannot both pass a quota. A client at its
      quota: `worker` revokes its own oldest token; `worker-judge` gets 429 `client_quota` and no token. One client's
      issue never evicts another client's token. `POST /run-tokens/revoke {"run_token": "..."}` revokes a token of the
      calling client only and returns its upstream record `{"requests": k, "statuses": [...], "any_2xx": bool,
      "refused": [...], "in_flight": n, "failed": m}` (meanings as before: upstream statuses in order, the proxy's own
      refusal codes, requests still relayed at revoke, requests failed after connect); an unknown, expired, evicted
      or other client's token answers 404 `run_token_unknown`, returns no record and leaves the other client's token
      live. `POST /run-tokens/revoke-all {}` revokes every token of the calling client and returns
      `{"revoked": n}`; records are dropped. A `worker` restart's revoke-all can only remove tokens of calls that the
      dead worker process held (worker concurrency 1, and the hook runs before the first job), so no live call loses
      its token. FR-AGENT-5's route templates gain `/run-tokens/revoke-all`, logged like the other two (no new
      field). A forwarded request's bearer must name a live token of the calling
      client (FR-AGENT-4's 401 `run_token_unknown` otherwise). A user without a loaded token gets 409
      `provider_missing`. Tokens are stored only as sha256 digests and compared in constant time. FR-AGENT-15's
      `task` and `web_search` fields are unchanged.
    tests_planned:
      - "change server/tests/agent/test_proxy.py: the ASGI transport sends from the worker's CLIENTS address; the eviction test uses the worker quota (28) instead of 32"
      - "change server/tests/agent/test_websearch.py: the same worker source address in its proxy fixture"
      - "add server/tests/agent/test_proxy_clients.py [unit]: unknown address 403 on all three routes and on /v1/messages; X-Forwarded-For ignored; fifth worker-judge issue 429 client_quota with 4 live; saturated lane never evicts a worker token; a 29th worker token evicts the worker's oldest only; expired lane token purged (clock) frees its slot and its revoke is 404; worker-judge revoke of a worker token 404 and the worker token still forwards; revoke-all revokes the caller's tokens only; a worker-judge token used from the worker address is 401"
      - "add the killed-lane case to test_proxy_clients.py: 4 lane tokens issued and never revoked (a crashed lane), revoke-all from the lane address → {revoked: 4}, lane count 0, worker token live"
      - "add to test_proxy_clients.py: worker-judge issue with web_search (task freshness_web and any other) → 400 tools_not_allowed; 8 concurrent lane issues (asyncio.gather) leave exactly 4 live; the revoke-all route logs its template and nothing else (caplog); main() calls uvicorn.run with proxy_headers=False (monkeypatched uvicorn.run)"
      - "add server/tests/agent/test_proxy_network.py [image]: on a Compose network with OPS-DEPLOY's subnet and fixed addresses, a real worker container's issue returns 200 and a container at another address gets 403 client_unknown (the promotion gate)"
  - id: FR-AGENT-6
    text: >-
      Provider port (as approved, with these changes). `StageCall` gains `line: str | None = None` (FR-AGENT-19); its
      `task` may be a judge slot name (FR-AGENT-18), resolved through `reader.yaml` `tasks` like any task. The
      adapter's issue maps agent-proxy's answers: 200 → the token; 409 → `provider_missing`; 429 `client_quota` →
      `lane_saturated`; 403 `client_unknown` and any 400 (`bad_request`, `tools_not_allowed`) → `sdk_error`; anything
      else or a transport error →
      `provider_unavailable`. In each refused or failed issue no run_token reached the CLI, so the call settles at $0
      (FR-AGENT-9 revised). `HttpProxyClient` gains `revoke_all() -> int | None` (None on any failure). A provider's
      `run` validates the line (FR-AGENT-19) before the reservation and before FR-AGENT-14's span, like FR-AGENT-15's
      `tools_mismatch`. The reserve is computed by one public numeric function, `ledger.reserve_for(model,
      prompt_chars, max_output_tokens, floor, custom_system, searches_max=0)` = max(floor, worst case +
      searches_max × `web_search_usd`), used by `run` (prompt_chars = len(system) + len(prompt); searches_max from
      the call's allowance, else 0) and by `loop_fits` (FR-AGENT-23). `HttpProxyClient(timeout_s=…)` takes its
      timeout; the lane builds it with `bounds.lane_issue_timeout_s`, the worker keeps 10 s. Everything else in the
      approved text is unchanged.
    tests_planned:
      - "change server/tests/agent/test_provider_db.py: a 429 client_quota issue raises lane_saturated and the settle row has settled_usd 0 and an empty record; 403 client_unknown raises sdk_error and settles 0; HttpProxyClient.revoke_all against a stub (200, 500, not JSON)"
      - "change server/tests/agent/test_provider_caps.py: a slot-named task (judge.find → haiku) resolves; reserve_for(...) equals the reserve row's usd for a plain call and for a web-search call (searches_max from the allowance)"
  - id: FR-AGENT-9
    text: >-
      Reservations, settlements and budgets (as approved, with these changes). (a) The reserve is `reserve_for`
      (FR-AGENT-6 revised), unchanged in value. (b) Each reserve row stores the call's line (FR-AGENT-19). (c) The run
      cap: for a call on the `index` or `eval` line the run cap is min(the call's `run_cap_usd`, the line's configured
      cap, FR-AGENT-19), refused with `index_budget_exhausted` or `eval_budget_exhausted` instead of
      `budget_exhausted`; every other line is as approved. The monthly cap applies to every line, since every line
      spends the same subscription credit. (d) `task_budget_exhausted` keeps its scope, spent(run, task) against
      `tasks.<task>.budget_usd_per_lesson`, one compile run for the compile tasks (the field name stays); a
      `judge.find` call on the `compile` line is in the compile run's scope through its `run_id`, so it counts in
      `budget.compile_cap_usd` (the run cap) and in the loop rule (FR-AGENT-23). The resized values for the four checks
      are SRV-PIPELINE's. (e) Settlement adds one explicit case before the record rules: a run_token issue refused or
      failed (no token reached the CLI) → $0 with an empty record, also for `lane_saturated`. Reservations of calls
      whose process died (a killed lane, then revoke-all at its start) stay unsettled and count at their reserve.
    tests_planned:
      - "change server/tests/agent/test_ledger_db.py: the line column is stored on reserve and copied to settle; an index call over the per-pack cap is refused index_budget_exhausted with nothing written, an eval call over the eval cap eval_budget_exhausted; the monthly cap still refuses an index call"
      - "change server/tests/agent/test_settlement.py: VEC-AGENT-1 gains `issue_refused` (no token: $0) and `issue_failed` cases"
      - "change spec/fixtures/SRV-AGENT/cost-vectors.yaml: the two settlement cases above (VEC-AGENT-1 changes with this spec)"
      - "change test_ledger_db.py's INV-AGENT-4 property test: sequences include index and eval calls under their caps and tutor-line judge.find rows in the FR-AGENT-12 composite tutor scope; no scope (run, task, day, month, line cap) exceeds its cap by more than one reserve"
  - id: FR-AGENT-12
    text: >-
      Daily scope (as approved, with one change). A call with `daily_budget_usd` set is refused with
      `daily_budget_exhausted` when spent(user, key, UTC calendar day) + reserve > that budget, where the scope key is
      the call's task, except that a `judge.find` row counts in the scope of its line: a tutor-channel judge (line
      `tutor`) counts in the `tutor` scope, so the tutor's daily cap covers its judges. `ledger.spent(owner_id=…,
      task=k, day=True)` returns that scope (rows with task k, plus `judge.find` rows with line k), so SRV-TUTOR's
      pre-check needs no change. Checked with the other caps under the same per-user lock before the reserve row.
    tests_planned:
      - "change server/tests/agent/test_call_options_db.py: a judge.find row on line tutor counts in spent(task='tutor', day=True); one on line compile does not; a tutor call is refused daily_budget_exhausted when tutor + tutor-line judge spend reach the cap"
      - "change server/tests/agent/test_ledger_lock_db.py: two concurrent reserves (a tutor call and a tutor-line judge) with room for one give one reserve and one refusal"
  - id: FR-AGENT-17
    text: >-
      Search fee, Haiku 5.5 and settlement (as approved, with one addition). The alias data also resolves judge slot
      bindings (FR-AGENT-18): `haiku` → `claude-haiku-5-5` for `judge.find`, `judge.link_type` and
      `ingest.context_prefix`, `opus` → `claude-opus-5-5` for `judge.eval.*` and `judge.align`; every v1 binding has a
      pricing row. A judge call's reserve and cost use the tier rule as approved (an `ingest.context_prefix` call with
      its section in context may pass 100,000 prompt tokens and is then reserved at the higher tier).
    tests_planned:
      - "change server/tests/agent/test_pricing.py: every JUDGE_SLOTS v1 binding resolves to a priced full id; a context-prefix-sized estimate over 100,000 tokens reserves at above_100k"
  # Not in ADR-0039's Rework table; revised at deep-reviewer round 1's request, because the new codes and the new
  # client need a classification and a verified_by. They change no approved behaviour of the worker.
  - id: FR-AGENT-10
    text: >-
      Job contract (as approved, extended to the new codes). Budget outcomes, not failures (SRV-PIPELINE
      FR-PIPELINE-5; for the index and eval lines the calling job stops with an event): `budget_exhausted`,
      `task_budget_exhausted`, `monthly_budget_exhausted`, `daily_budget_exhausted`, `index_budget_exhausted`,
      `eval_budget_exhausted`. Permanent: as approved plus `cap_missing`, `line_invalid`, `replay_miss`,
      `judge_window_too_long`, `judge_input_too_large`. Transient: as approved plus `lane_saturated`; a `judge.find`
      job has max attempts 1, so on the lane every code, transient or not, ends the job and `find` degrades.
      agent-proxy's own codes reach callers only through the adapter's mapping (FR-AGENT-6 revised): `client_quota`
      → `lane_saturated`; `client_unknown`, `tools_not_allowed` and `bad_request` → `sdk_error` (permanent).
    tests_planned:
      - "change server/tests/agent/test_settlement.py: a table test that every code in errors + proposed_errors has exactly one class (budget | permanent | transient | proxy-only mapped) and the adapter's mapping of each proxy code"
  - id: INV-AGENT-1
    text: >-
