# SRV-AGENT — the agent runtime for the slice (V.COMPILE-min, docs/roadmap.md "Vertical slice first", V7).
#
# What it is:
#   - `agent-proxy`, the credential-injecting reverse proxy of accepted ADR-0025 (c): the only holder of provider tokens,
#     reachable only by `worker` on `agentnet`, forwarding one method and path to one pinned host with the credential of
#     the user a per-run token names;
#   - the `Provider` port (ADR-0005) and its Agent SDK adapter, run inside `worker` with no tools;
#   - spend accounting: an append-only ledger of reservations and settlements, run and monthly budgets, and a pricing
#     table as data (ADR-0005).
#
# Complex areas (AGENTS.md): secrets, the egress proxy, cost math. Full deep-reviewer review until approve.
#
# Evidence:
#   - spikes/agent-proxy-handshake (2026-11-22, zero credit): with CLAUDE_CODE_OAUTH_TOKEN=<run token> and
#     ANTHROPIC_BASE_URL=<proxy>, the bundled CLI (claude-agent-sdk 0.2.187) sends `Authorization: Bearer <run token>`
#     on `POST /v1/messages?beta=true` only; with CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 exactly one request per
#     query and no other host; `tools=[]` gives an empty init tool list and an empty request `tools`. ADR-0025
#     hypothesis 1 holds against a stub; the real upstream is FR-AGENT-11.
#   - spikes/compile-cost: 12 stage costs; the pricing table recomputes them within 0.38–1.78 % (VEC-AGENT-1).
#
# Design decisions:
#   - The per-run token (`run_token`) IS the bearer placeholder the CLI sends. The worker asks agent-proxy for a
#     run_token bound to one user, starts the CLI with it, and agent-proxy swaps it for that user's token on the way out.
#     The worker never holds a provider token; a run_token is useless outside `agentnet` and expires.
#   - agent-proxy is a reverse proxy to one pinned upstream, not a forward proxy, with a method, path, query and header
#     allow-list (FR-AGENT-4), so injection cannot reach any other host by construction (still tested, INV-AGENT-3).
#   - Spend is what the SDK reports (`ResultMessage.total_cost_usd`). Before each call a reservation row is appended;
#     after it a settlement row. `spent` counts settlements plus unsettled reservations, so a crash, stall, timeout or
#     abort between the two still counts its worst case (FR-AGENT-9).
#   - No tools for any compile stage (`tools=[]`), checked twice: the init tool list must be empty before any assistant
#     output is read, and agent-proxy refuses a request body whose `tools` is not empty (FR-AGENT-7).
#   - Under ADR-0025's fallback (if FR-AGENT-11 fails on the real upstream): the worker receives the user's token file
#     (OPS-CLI delivery to worker), passes the token only in the CLI subprocess environment, and agent-proxy becomes a
#     plain egress proxy for the same allow-list without injection; FR-AGENT-3 and INV-AGENT-1 for the worker no longer
#     hold and are replaced by "token only in the CLI subprocess env"; FR-AGENT-7 is unchanged.
#
# ADRs: ADR-0025, ADR-0023, ADR-0026 accepted; ADR-0005, ADR-0006, ADR-0011, ADR-0017 proposed and followed as written.
# Upstream specs: SRV-CONFIG (merged), SRV-AUTH (merged), SRV-EVENTS (origin/V/V.SRV-JOBS-min, approved in review).
#
# Cross-spec (paired changes in their own specs):
#   - OPS-DEPLOY: FR-DEPLOY-5 adds agent-proxy to the read-only reader.yaml bind set (READER_CONFIG); a note that
#     `deploy/images/agent-proxy.Dockerfile` is owned by SRV-AGENT; agent-proxy's command is the image entrypoint;
#     `deploy/reader.example.yaml` task budgets become per-run and sized for two worst-case calls each (draft 4.00,
#     fact_check 2.00, review 4.00; today 2.0/1.0/1.2, which a second review or a revise would exceed).
#   - OPS-CLI: FR-CLI-4 adds agent-proxy to the override bind set; profile `agents` started for a compile (progress task
#     V.OPS-CLI-agents); it already delivers provider token files to agent-proxy (FR-CLI-5).
#   - SRV-EVENTS: an amendment allowing a handler to append spend rows (append-only, no outcome effect) on a separate
#     connection outside the run transaction (FR-EVENTS-4/5).
#   - SRV-AUTH: VERSION_LOCATIONS adds `reader/agent/migrations`. No route module in the slice (/api/spend deferred).
#   - SRV-CONFIG: a note that `tasks.<name>.budget_usd_per_lesson` is spent per compile run (FR-AGENT-9); the field
#     name stays for compatibility.
#   - server/pyproject.toml: `httpx` as a dependency (agent-proxy's upstream client); an optional extra `agent` with
#     `claude-agent-sdk==0.2.187`, also in the dev group (tests, mypy). OPS-DEPLOY: `server.Dockerfile` installs the extra
#     (api, worker and mcp share one image); `agent-proxy.Dockerfile` does not. Only `reader.agent.provider` imports
#     the SDK, and the api never imports that module.
#
# Review: deep-reviewer (Fable) rounds 1 and 2 changes, round 3 approve (2026-11-22); the approval items (unknown or
# evicted upstream record, multiple 2xx, INV-AGENT-4 wording, agent-proxy's config path) are folded in.
# Amendment (SRV-TUTOR review, 2026-11-22): FR-AGENT-12 (daily per-user, per-task scope) and FR-AGENT-13 (thinking
# off, custom system prompt and its reserve, stop reason, abort on the first api_retry, per-call deadline); covered by
# the implementation's code review.
# Paired from SRV-TUTOR's code review (2026-11-23): `ledger.spent(..., day=True)` is public (the tutor's daily
# pre-check reads FR-AGENT-12's scope through it); `HttpProxyClient.aclose()` closes its HTTP client; a [db] test
# pins FR-AGENT-9's per-user advisory lock: two concurrent reserves with room for one (under the daily scope, and
# separately under the run cap) give one reserve row and one refusal.
# Paired from SRV-TUTOR's code review round 2 (2026-11-23; no new review round): the settle row also stores
# `thinking`, the SDK's `usage.output_tokens_details.thinking_tokens` (measured present in spikes/tutor-call and
# spikes/compile-cost). It is already inside `output`, so it is not priced; null when the SDK gives none. Additive
# migration agent_0002 (a nullable column); VEC-AGENT-1's mapping and a [db] settle test cover it.
# Amendment (ADR-0030, accepted by the owner 2026-11-23; V/freshness): FR-AGENT-15..17 (FR-AGENT-14..16 on
# V/freshness and in ADR-0030's text; renumbered at the merge into V/slice-integration, 2026-11-24, because
# integration's FR-AGENT-14 is SRV-OBS's tracing amendment), INV-AGENT-6, VEC-AGENT-3/-4,
# REF-AGENT-8 — one task-scoped tool allowance (`freshness_web`: the CLI's WebSearch), the proxy-enforced search
# allowance with a `max_uses` rewrite (the only field the proxy rewrites), the per-search fee and a Haiku 5.5 row in
# pricing, and settlement of tool calls. Everything else here is unchanged for every other task. Promoted with its
# Red tests (2026-11-23) after the three-part gate held: deep-reviewer rounds 1–2 changes, round 3 approve (with
# SRV-FRESH); the shapes pinned by the stub run and confirmed by the owner's live call (spikes/web-search §§ 5a, 5b);
# the owner's acceptance of ADR-0030.
# Code review round 1 of V/freshness (2026-11-24; no requirement loosened): a WebSearchCall with no hook is
# `tools_mismatch` before the reservation (FR-AGENT-15); FR-AGENT-17 states that an error result never settles at the
# SDK cost, that a model_usage TTL breakdown that does not add up is `usage_unmapped`, and that the 100,000-token
# tier boundary is inclusive. New oracles: placeholder pins and the nested tool's `name` (VEC-AGENT-3), an
# error-result settlement (VEC-AGENT-4), the tier boundary, the lower tier for summed usage, and the search fee in
# the reserve.
# Code review round 3 of the freshness merge (2026-11-24; no requirement loosened): FR-AGENT-15 states that the
# `tools_mismatch` refusal also comes before the `agent.call` span opens, pinned by the [db] refusal test.
# Paired note 2026-11-24 (V/manage, SRV-CONFIG FR-CONFIG-26, ADR-0036 accepted): the provider's caps (task budget,
# monthly budget, warn level) are read per call through `reader.config.effective` (reader.yaml plus the owner's
# overrides), so a budget override applies to the next call without a worker restart; no oracle changed.
# Code review of the management layer (2026-11-24, V/manage-fix-auth; SRV-CONFIG FR-CONFIG-26 "Enforcement is
# live"): the reserve enforces the effective budgets per call, never `compile_runs.task_budgets` (a display snapshot).
# tests/agent/test_provider_db.py adds the [db] oracle: a lowered `budgets.monthly_usd` override refuses
# `monthly_budget_exhausted` and a lowered task budget override refuses `task_budget_exhausted` on calls the file's
# values allow, with nothing reserved; after the overrides are removed the same call succeeds.
# Phase 2 code review round 2 (2026-11-24, V/p2-fix3): a provider built without an engine (the freshness agent
# [image] check, whose ledger is in memory) reads the caps from reader.yaml alone (`file_settings`), since there
# is no database holding overrides; a [unit] test pins it. No oracle loosened.
# Revision for ADR-0039 (accepted 2026-11-26; V/kl-agent-judges): judge slots, ledger lines and the index and eval
# caps, recorded judge outputs, the `judge.find` lane job, the loop-fit check (B7, B7a, B7b; the ADR-0005
# amendment). deep-reviewer (Fable) round 1 changes, round 2 approve (2026-11-26); the round-2 notes are folded in.
# Promoted with Red tests: FR-AGENT-6, -9, -10, -12, -17 revised; FR-AGENT-18..23; INV-AGENT-8..10; VEC-AGENT-5.
# Promoted in V.kl-deploy-judge-lane (2026-11-26, with OPS-DEPLOY FR-DEPLOY-16's agentnet addresses; deep-reviewer
# (Fable) approve in round 3 of that task's spec review): FR-AGENT-3's client identity (plus `--bind`),
# INV-AGENT-1 and INV-AGENT-6 as revised for worker-judge, INV-AGENT-7, VEC-AGENT-6, `bounds.client_quota` and the
# errors `client_unknown`, `client_quota`; `reader.agent.lane` exports `JOB_KINDS` wired to SRV-EVENTS'
# `judge_requests.STORE` (the seam below gets its production default). Each item keeps its `tests_planned` (H2).
# `ProxySettings.clients` defaults to `CLIENTS`; the loopback harnesses (SRV-FRESH, conftest `make_proxy`) pass
# their own table. Red tests (2026-11-26): the in-process harness (conftest `Proxy.client`) sends from the worker's
# CLIENTS address by default and from the lane's on request; test_proxy_clients.py holds FR-AGENT-3's client cases,
# the INV-AGENT-7 state machine and VEC-AGENT-6; the INV-AGENT-6 property draws lane requests too.
#
# Ownership (ADR-0039 B11). SRV-AGENT: the judge slot table, judge versions, the recorded-output table and its
# replay, the `index` and `eval` ledger lines and their caps, the `judge.find` job handler that runs on the
# `worker-judge` lane, agent-proxy's client identity and per-client token table (proposed), and the loop-fit check.
# Not here: the `worker-judge` Compose service, its fixed `agentnet` address and memory (OPS-DEPLOY); the
# `judge.find` queue, its consumer, the `judge_requests` table, its collector and the no-text-in-args canary
# (SRV-EVENTS); building the judge input, waiting by LISTEN/NOTIFY and applying the output (SRV-SEARCH); per-pack
# advisory locks, the active-pack check and the context-prefix batch job of 25 spans (SRV-INGEST); the
# `judge_inputs` copy and its consent rule (SRV-OBS); the loop order and the resized `budget_usd_per_lesson` values
# (SRV-PIPELINE); the new settings' schema (SRV-CONFIG); the per-token daily judge cap on MCP (SRV-MCP, stage 7).
#
# New files inside the existing `paths`: server/src/reader/agent/judges.py, server/src/reader/agent/lane.py,
# server/src/reader/agent/prompts/judge_find.md, migration agent_0004, spec/fixtures/SRV-AGENT/judge-find-outputs.yaml.
#
# Seams until the owning specs land (each a Protocol with a stated production default):
#   - `JudgeRequests` (get, delete) over SRV-EVENTS's `judge_requests` table; no production default here: the lane's
#     kind joins KIND_MODULES only with that table (V.kl-deploy-judge-lane).
#   - `PackGuard.lock_active(conn, pack_ids)`: production default `always_active` (true) while no purge exists;
#     SRV-INGEST (V.kl-ingest-packs) switches the default to its per-pack lock check.
#   - `JudgeInputsSink.copy(conn, request, output)`: production default a no-op; SRV-OBS (V.kl-obs-spans) supplies it.
#   - The index and eval caps: `judges.line_caps(config)` returns None for `budgets.index_usd_per_pack`,
#     `budgets.index_usd_per_pair_run` and `budgets.eval_usd_per_run` (so `cap_missing`) until SRV-CONFIG's schema
#     rows land; its paired change supplies them through `reader.config.effective`, the only module that reads
#     overridable keys (SRV-CONFIG's test). The provider takes `line_caps=` for tests.
#
# Delimiter neutralising, two rules on purpose: SRV-AGENT's `render_find_input` replaces the token only on data
# lines that contain a delimiter (`<<<READER-INSTRUCTIONS` or `READER-INSTRUCTIONS>>>`), so ordinary text that
# merely names the token is kept; SRV-OBS neutralises every occurrence of the token (its spec states where). Both
# are intended, and both keep a raw delimiter out of a prompt.
#   - SRV-OBS: `reader.obs.attributes.SPEC_CODES` gains the new error codes (its catalogue test reads `errors`).
#
# Paired changes (each in its own spec, in V.kl-deploy-judge-lane unless named):
#   - OPS-DEPLOY: `agentnet` with an explicit subnet and fixed IPv4 addresses for `worker` and `worker-judge`, pinned
#     equal to `reader.agent.proxy.CLIENTS`; deploy/reader.example.yaml binds the slots and, once measured, the caps.
#   - SRV-EVENTS: KIND_MODULES gains `reader.agent.lane`; the `judge.find` queue (`judge`) consumed only by
#     worker-judge; `judge_requests` with the columns FR-AGENT-21 reads; its collector calls `judges.expire`.
#   - SRV-CONFIG: dotted `tasks` keys are allowed; the override key pattern does not match them, so a slot's task
#     budget is a file setting; the three caps above as optional positive decimals, file settings only (not in
#     ADR-0036's UI allow-list unless the owner adds them; then `policy_version` hashes the effective values).
#   - SRV-PIPELINE (V.kl-pipeline-checks): calls `loop_fits` before each loop and resizes the task budgets.
#   - SRV-FRESH: once FR-AGENT-3's client identity lands, the loopback harnesses server/tests/freshness/agent_check.py
#     and server/tests/agent/conftest.py (`make_proxy`) pass `ProxySettings(clients=…)` mapping their loopback
#     address to `worker`; `ProxySettings.clients` defaults to `CLIENTS`.
#   - SRV-OBS: `obs.align` may call `judge.find` from the worker through the Provider port with line `eval`, in
#     memory, with no judge_outputs lookup or record (FR-AGENT-19); `judge_requests` gains no instruction column.
#   - OPS-SANDBOX (INV-SANDBOX-3 and ADR-0025's `verified_by` tests) and OPS-CLI (`reader doctor` hint for a slot
#     missing from `tasks`).
#
# Clock: every deadline and retention comparison in the lane and judges.py uses the database's `now()`.
# Prompt shape: a slot call passes the slot's prompt file as `system` and the rendered input as `prompt`;
# `stage` = the slot name, `attempt` = 1 for `judge.find`, the job attempt for offline slots.
# Token estimate: FR-AGENT-9's estimator assumes 2.0 chars per token; the Russian pilot measured about 1.9 bytes
# (≈ 2.5 chars) per token (REF-AGENT-5), so the 3,000-token judge-input cap errs toward fewer real tokens; the
# lane's latency is measured by `judge-gate`, not assumed here.

id: SRV-AGENT
title: Agent runtime — credential-injecting agent-proxy, no-tool Agent SDK provider, reservation-based spend ledger and budgets (slice)
status: approved
approved_by: agent
approved_at: 2026-11-22
review: "deep-reviewer (Fable): rounds 1-2 changes, round 3 approve (2026-11-22); ADR-0030 amendment rounds 1-2 changes, round 3 approve (2026-11-23); ADR-0039 revision round 1 changes, round 2 approve (2026-11-26), approved_by agent; client-identity items promoted with V.kl-deploy-judge-lane after its deep-reviewer (Fable) rounds 1-2 changes, round 3 approve (2026-11-26)"
layer: server
track: ai
adr: [ADR-0005, ADR-0011, ADR-0023, ADR-0025, ADR-0026, ADR-0006, ADR-0017, ADR-0030, ADR-0039]
slice: V.COMPILE-min

paths:
  - server/src/reader/agent/**
  - server/tests/agent/**
  - deploy/images/agent-proxy.Dockerfile
  - spec/fixtures/SRV-AGENT/**

