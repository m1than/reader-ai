      - "add the killed-lane case to test_proxy_clients.py: 4 lane tokens issued and never revoked (a crashed lane), revoke-all from the lane address → {revoked: 4}, lane count 0, worker token live"
      - "add to test_proxy_clients.py: worker-judge issue with web_search (task freshness_web and any other) → 400 tools_not_allowed; 8 concurrent lane issues (asyncio.gather) leave exactly 4 live; the revoke-all route logs its template and nothing else (caplog); main() calls uvicorn.run with proxy_headers=False and the --bind host and port (monkeypatched uvicorn.run); a malformed --bind exits 2"
      - "add server/tests/agent/test_proxy_network.py [image: build; opt-in with READER_TEST_IMAGE_BUILD=1]: on a throwaway network with OPS-DEPLOY's subnet and fixed addresses, a container at the worker's address issues 200 and a container at another address gets 403 client_unknown"
  - id: FR-AGENT-4
    text: >-
      Forwarding allow-list (REF-AGENT-4). Only `POST /v1/messages` with the query exactly `beta=true` or empty is
      forwarded, to the pinned upstream `https://api.anthropic.com` with TLS verification on; every other method, path or
      query gets 404 and nothing is forwarded. The request's `Authorization: Bearer <run_token>` must name a live token,
      else 401 `run_token_unknown`. Forwarded request headers are exactly the allow-list `accept, accept-encoding,
      anthropic-beta, anthropic-dangerous-direct-browser-access, anthropic-version, content-type, user-agent, x-app,
      x-claude-code-session-id, x-stainless-*` plus `authorization: Bearer <user token>` set by the proxy; all others,
      including any `x-api-key` and any client `authorization`, are dropped. The body must be a JSON object (else 415
      `body_not_json`); a body whose `tools` or `mcp_servers` is present and non-empty is refused with 403
      `tools_mismatch`, one whose `model` differs from the run_token's model with 403 `model_mismatch`, and one whose
      `max_tokens` is missing or exceeds the run_token's bound with 403 `output_cap` (REF-AGENT-4 measured that the CLI
      sends CLAUDE_CODE_MAX_OUTPUT_TOKENS as `max_tokens`). The forwarded body is the checked object re-serialised, so
      what was checked is what is sent; a body that cannot be re-serialised as UTF-8 (a lone surrogate escape such as
      `\ud800`) is refused with 400 `body_not_utf8`, a 4xx the CLI does not retry (code review round 2; it was a 500,
      which the CLI retried for 3 minutes). The `model_mismatch` check is new against the real CLI: the first live
      Opus stage must be watched for a refusal (the CLI might send a dated or aliased model id). Bodies over `bounds.proxy_body_max_bytes` get 413. Responses,
      including SSE streams, pass through with hop-by-hop headers dropped. No redirect is followed.
  - id: FR-AGENT-5
    text: >-
      Proxy logging. One line per request: method, the route template (`/run-tokens`, `/run-tokens/revoke`,
      `/v1/messages` or `other`), status, duration and the run_token digest prefix (8 hex); never a raw path, a user
      handle, a header value, body, query string, token or run_token. The HTTP server's own access log is off.
  - id: FR-AGENT-6
    text: >-
      Provider port. `reader.agent.Provider.run(StageCall(owner_id, handle, run_id, lesson_id, stage, task, attempt,
      system, prompt, max_output_tokens, floor_usd, run_cap_usd, daily_budget_usd=None, thinking_off=False,
      abort_on_retry=False, deadline_s=None)) -> StageResult(text, usage, sdk_usd, model, stop_reason)` is the only
      way SRV-PIPELINE and SRV-TUTOR call a model (the optional fields: FR-AGENT-12, FR-AGENT-13). Model
      resolution happens first: the task's `model` from reader.yaml is resolved to a full model id (aliases `opus` →
      `claude-opus-5-5`, `sonnet` → `claude-sonnet-5-5`, as data next to the pricing table); a model not in the pricing
      table raises `unknown_model` before any reservation or call. The Agent SDK adapter then: takes a reservation
      (FR-AGENT-9); requests a run_token; starts the CLI with HOME a fresh per-run tmpfs directory and exactly the
      environment `PATH, HOME, LANG, CLAUDE_CODE_OAUTH_TOKEN=<run_token>, ANTHROPIC_BASE_URL=http://agent-proxy:8080,
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1, DISABLE_TELEMETRY=1, CLAUDE_CODE_MAX_OUTPUT_TOKENS=<max_output_tokens>`,
      plus `MAX_THINKING_TOKENS=0` for a call with `thinking_off`. The SDK merges the worker's own environment into
      the CLI's, so every other variable the worker holds is passed blank (empty string); the SDK itself adds
      `CLAUDE_CODE_ENTRYPOINT`, `CLAUDE_AGENT_SDK_VERSION`, its session-state flag and `PWD`. Options:
      `ClaudeAgentOptions(tools=[], allowed_tools=[], setting_sources=[], max_turns=1, model=<full id>,
      max_budget_usd=<this call's reserve>, system_prompt={"type": "file", "path": <HOME>/system.md})`, the system
      prompt written to a 0600 file in HOME because the SDK passes a string prompt as one argv argument, which fails
      above 131,071 bytes (code review B1); `system` None passes the `claude_code` preset (the SDK turns a missing
      prompt into an empty one). The CLI's stderr is read and discarded through the SDK's callback. On abort
      (FR-AGENT-13 d) or deadline (e) the adapter kills the CLI process at once (SIGKILL) before closing the SDK
      stream, so the call returns within a second. In a `finally`, revokes the run_token, removes HOME and settles. Errors are
      classified from what the SDK emits (REF-AGENT-4, error-mode runs): the CLI itself retries 429, 529 and 5xx with
      backoff (measured: 10 retries, 11 requests over 176–178 s for 429 and for 529, each announced by a
      `SystemMessage` subtype `api_retry` with `error_status`), then ends with an `AssistantMessage.error`, a
      `ResultMessage` with `is_error` true and cost 0, and a raised `ResultError`. The adapter maps `AssistantMessage.error`
      `rate_limit` (measured for 429) to `rate_limited`; `server_error` (measured for 529 and 500) to
      `provider_unavailable`; a proxy refusal (listed in `refused` of the run_token's upstream record) to
      `sdk_error`; any other non-success result or a missing `total_cost_usd` to `sdk_error`. The resolved model id is
      stored on the ledger rows. ADR-0039 revision: `StageCall` gains `line: str | None = None` (FR-AGENT-19) and its
      `task` may be a judge slot name (FR-AGENT-18), resolved through `reader.yaml` `tasks` like any task. The issue
      maps agent-proxy's answers: 200 → the token; 409 → `provider_missing`; 429 with `{"error": "client_quota"}` →
      `lane_saturated`; any 403 or 400 (`client_unknown`, `bad_request`, `tools_not_allowed`) → `sdk_error`;
      anything else or a transport error → `provider_unavailable`. A refused or failed issue settles at $0
      (FR-AGENT-9 e). `HttpProxyClient(base_url, transport, timeout_s=10.0)` gains `revoke_all() -> int | None`
      (`POST /run-tokens/revoke-all`; None on any failure, including the 404 of a proxy without that route). `run`
      checks the line (FR-AGENT-19) and the presence of its line cap (`cap_missing`) before the reservation and before
      FR-AGENT-14's span, like FR-AGENT-15's `tools_mismatch`. The reserve is one public numeric function,
      `ledger.reserve_for(model, prompt_chars, max_output_tokens, floor, custom_system=False, searches_max=0)` =
      max(floor, worst case + searches_max × `web_search_usd`), used by `run` (prompt_chars = len(system) +
      len(prompt); searches_max from the call's allowance, else 0) and by `loop_fits` (FR-AGENT-23).
  - id: FR-AGENT-7
    text: >-
      Init check (ADR-0025 rule 2). The init `SystemMessage` arrives before any assistant message (REF-AGENT-4). If its
      `tools` is missing or not empty, its `mcp_servers` is not empty, or its `model` differs from the resolved model id,
      the stage stops with `tools_mismatch` and no assistant output is used. The request may already have been sent by
      then, so agent-proxy's body checks (FR-AGENT-4: `tools`, `max_tokens`) are the controls that keep a tool-carrying
      or over-long request from reaching the provider.
  - id: FR-AGENT-8
    text: >-
      Pricing and cross-check. `reader.agent.pricing` loads a table equal to `spec/fixtures/SRV-AGENT/pricing.yaml`
      (VEC-AGENT-2), maps SDK usage to the five fields per VEC-AGENT-1 (`usage_unmapped` when the cache breakdown is
      missing) and computes `cost(model, usage)`. Each settlement stores `sdk_usd` (authoritative) and the recomputed
      `usd`; when they differ by more than max(relative × sdk_usd, absolute) of `bounds.crosscheck_tolerance`, a WARNING
      `cost_crosscheck` (model, both values) is logged.
  - id: FR-AGENT-9
    text: >-
      Reservations, settlements and budgets. Before each call, on a separate connection committed at once (SRV-EVENTS
      amendment), the adapter appends a `reserve` row with `usd = reserve`, where reserve = max(stage floor, worst-case
      estimate) and the worst case = (`bounds.cli_system_tokens`, or `bounds.cli_overhead_tokens` when the call sets its
      own system prompt (FR-AGENT-13), + ceil(prompt characters / `bounds.chars_per_token_floor`))
      × the model's `cache_write_1h` rate + max_output_tokens × its output rate (no cache sharing assumed). It refuses,
      before the reserve row, with: `budget_exhausted` when spent(run) + reserve > the run cap; `task_budget_exhausted`
      when spent(run, task) + reserve > the task's `budget_usd_per_lesson`, scoped to one compile run (the example config
      gives each task room for two worst-case calls; a recompile starts fresh); `monthly_budget_exhausted` when
      spent(user, UTC calendar month) + reserve > `budgets.monthly_usd`, with a WARNING `budget_warn` once per user and
      month (tracked in the worker process) when it first passes `budgets.warn_at` (ADR-0005; a log line, not yet an event — SRV-EVENTS stage 2). After the call it appends a
      `settle` row from the SDK cost and usage and the run_token's upstream record (FR-AGENT-3): no upstream 2xx → $0
      (nothing was billed; a non-zero SDK cost is logged as `settle_mismatch`); exactly one 2xx with an SDK cost → that
      cost; one 2xx without an SDK cost (a crash or exception after the response) → the reserve; more than one 2xx →
      max(SDK cost, reserve), logged as `multiple_2xx` (one turn should make one request); an unknown or evicted record
      (the revoke answered 404, failed or was not JSON) → the reserve, since the upstream outcome is not known; any
      request in flight at revoke or failed after connect → max(SDK cost, reserve), logged as `outcome_unknown`; one
      2xx with an SDK cost of 0 on an error result → the reserve (the SDK's 0 is not a bill). A reservation without a settlement (the
      worker died) keeps counting at its reserve, so overshoot of any cap is bounded by the call in flight; the owner can
      void it with `python -I -m reader.agent.void <reservation_id>`, which appends a logged `void` row that removes it
      from spent and is refused for a reservation that has a settlement. `max_budget_usd` passed to the SDK is a second,
      untested guard. ADR-0039 revision: (a) the reserve is `reserve_for` (FR-AGENT-6), unchanged in value. (b) Each
      reserve row stores the call's line and its settle or void row copies it. (c) For a call whose line cap applies
      (FR-AGENT-19) the run cap is min(the call's `run_cap_usd`, that cap), refused with `index_budget_exhausted` (index
      line) or `eval_budget_exhausted` (eval line, including obs.align's `judge.find` calls) instead of `budget_exhausted`. The monthly cap applies to every
      line, since every line spends the same subscription credit. (d) `task_budget_exhausted` keeps its scope,
      spent(run, task), one compile run for the compile tasks; a `judge.find` call on the `compile` line is in the
      compile run's scope through its `run_id`, so it counts in `budget.compile_cap_usd` and in the loop rule
      (FR-AGENT-23); the resized values for the four checks are SRV-PIPELINE's. (e) Before the record rules: a run_token
      issue refused or failed (no token reached the CLI) settles at $0 with an empty record, also for
      `lane_saturated`. Reservations of calls whose process died (a killed lane) stay unsettled and count at their
      reserve.
  - id: FR-AGENT-10
    text: >-
      Job contract for agent stages (used by SRV-PIPELINE's `pipeline.stage` kind): transient (retried within
      `max_attempts`, each attempt reserving and settling): `provider_unavailable`, `rate_limited`, `output_invalid`,
      `upstream_retry`, `deadline_exceeded`; permanent: `sdk_error`, `tools_mismatch`, `unknown_model`, `provider_missing`, `usage_unmapped`; budget refusals are
      not failures but a stage outcome (SRV-PIPELINE FR-PIPELINE-5). Because the CLI already retries 429/529/5xx for
      about 3 minutes inside one attempt (REF-AGENT-4), one stage attempt can take up to that long before it fails.
      ADR-0039 revision (`reader.agent.errors.ERROR_CLASSES`, one class per code): budget outcomes `budget_exhausted`,
      `task_budget_exhausted`, `monthly_budget_exhausted`, `daily_budget_exhausted`, `index_budget_exhausted`,
      `eval_budget_exhausted` (for the index and eval lines the calling job stops with an event); permanent as above
      plus `cap_missing`, `line_invalid`, `replay_miss`, `judge_window_too_long`, `judge_input_too_large`; transient as
      above plus `lane_saturated`. A `judge.find` job has max attempts 1, so on the lane every code ends the job and
      `find` degrades. agent-proxy's own codes reach callers only through FR-AGENT-6's mapping: `client_quota` →
      `lane_saturated`; `client_unknown`, `tools_not_allowed`, `bad_request` → `sdk_error`.
  - id: FR-AGENT-12
    text: >-
      Daily scope (SRV-TUTOR amendment, 2026-11-22; ADR-0039 revision). A call with `daily_budget_usd` set is refused
      with `daily_budget_exhausted` when spent(user, key, UTC calendar day) + reserve > that budget, where the key is
      the call's task, except that a `judge.find` call and row count in the scope of their line: a tutor-channel judge
      (line `tutor`) counts in the `tutor` scope, so the tutor's daily cap covers its judges.
      `ledger.spent(owner_id=…, task=k, day=True)` returns that scope (rows of other tasks with task k, plus
      `judge.find` rows with line k), so SRV-TUTOR's pre-check needs no change. Checked with the other caps under the same per-user lock
      before the reserve row (FR-AGENT-9), so two concurrent calls cannot both pass.
  - id: FR-AGENT-13
    text: >-
      Call options (SRV-TUTOR amendment, 2026-11-22; REF-AGENT-7). (a) `thinking_off` adds `MAX_THINKING_TOKENS=0` to the
      CLI environment. (b) `system`, when not None, is passed as `system_prompt` and replaces the CLI's default prompt,
      so the reserve counts `bounds.cli_overhead_tokens` instead of `bounds.cli_system_tokens`. (c) `StageResult.stop_reason`
      is the result's stop reason (`end_turn`, `max_tokens`, ...), or None when the SDK gives none, so a caller sees a
      truncated answer. (d) With `abort_on_retry`, the first `SystemMessage` subtype `api_retry` ends the call: the CLI is
      closed and the call raises `upstream_retry` (transient) instead of waiting out the CLI's own ~3-minute backoff.
      (e) With `deadline_s`, a call still running after that many seconds is closed and raises `deadline_exceeded`
      (transient). In (d) and (e) the run_token is still revoked and the reservation settled per FR-AGENT-9 from the
      upstream record (no 2xx → $0; a 2xx without an SDK cost → the reserve). Its [image] test builds the server image
      from `deploy/images/server.Dockerfile` and runs it by the id `docker build -q` prints, never by a tag, so the
      shared `reader-server:local` of other checkouts and the running stack is never rewritten.
  - id: FR-AGENT-11
    text: >-
      Live: one `claude-sonnet-5-5` call with `max_turns=1` and a one-word answer through agent-proxy with a run_token
      succeeds against the real upstream, and its reservation and settlement land in the ledger (about 7k input tokens
      written once: ≈ $0.03). [live]
  - id: FR-AGENT-14
    text: >-
      Tracing (paired SRV-OBS change, FR-OBS-6; ADR-0032 accepted 2026-11-24). `AgentProvider.run` runs the whole call
      inside SRV-OBS's `agent_call_span(task, stage, model)` so the span is current while the CLI starts (the SDK then
      injects TRACEPARENT); after settlement the span records the call's usage tokens, `reader.cost_usd` = the settled
      amount, the stop reason and the error code. When `config.observability.enabled`, FR-AGENT-6's environment gains
      exactly SRV-OBS's `cli_env_additions()` (telemetry on, traces only, OTLP to http://rotel:4318, four content flags
      `0`); `OTEL_LOG_RAW_API_BODIES`, `ENABLE_BETA_TRACING_DETAILED` and `BETA_TRACING_ENDPOINT` stay blank like every
      other variable. When disabled, the environment is exactly FR-AGENT-6's. `reader.stage` is set only when the
      call's stage is a declared pipeline stage (the tutor's calls carry none). The tokens are the mapped usage's
      input, output, cache read and cache write (5m + 1h); `reader.cost_usd` is the ledger's settled amount, also on a
      failed call, and differs from the SDK's figure whenever settlement does (e.g. two 2xx answers). A provider
      constructed without a configuration adds nothing to the environment. A FR-AGENT-15 tool call (SRV-FRESH's
      search run) gets the same additions plus FR-AGENT-15's `CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION` and nothing
      else; its four content flags stay `0`, which keeps the search query, the result titles and URLs and the
      nested model's summary out of the CLI's `claude_code.tool*` spans (measured zero-credit in
      spikes/web-search-otel: only `OTEL_LOG_TOOL_CONTENT=1` puts them, as a `tool.output` event; SRV-FRESH
      FR-FRESH-13). [unit, db] server/tests/agent/test_obs_env.py. Amended by SRV-OBS V.obs-analytics (FR-OBS-12 b-d; 2026-11-24, reviewed in
      SRV-OBS's design rounds 1-3 and its code review): the span also carries `gen_ai.operation.name: invoke_agent`,
      `gen_ai.provider.name: anthropic` and, when the call has them, `reader.lesson.id`, `reader.course.id` and
      `reader.step`; `StageCall` gains only `course_id: UUID | None = None` and `step: int | None = None` (no separate
      context object). The tokens use the GenAI semconv keys: `gen_ai.usage.input_tokens` = input + cache read +
      cache write (5m + 1h), `gen_ai.usage.output_tokens`, `gen_ai.usage.cache_read.input_tokens`,
      `gen_ai.usage.cache_write.input_tokens`. The settled amount is quantized once with `pricing.micro` (6 places,
      ROUND_HALF_UP) and that value goes to both `ledger.settle` and the span (code review round 1). With it the span
      also sets `reader.cost_input_usd`: the input share by pricing.yaml's rates at `cost()`'s tier (FR-AGENT-17) for
      the settle row's token columns, each cache write at its own TTL's rate, the search fee on the output side,
      rounded half-up to 6 places (SRV-OBS FR-OBS-12 c); 0 when no usage was mapped.
  - id: FR-AGENT-15
    text: >-
      Task-scoped tool allowance with pinned shapes (ADR-0030 Decision 1; VEC-AGENT-3). `POST /run-tokens` takes an
      optional `"task"` and, only with `"task": "freshness_web"`, an optional `"web_search": {"searches_max": n,
      "searches_per_request_max": m, "requests_max": r}` (JSON integers ≥ 1, not booleans; any other task, or no task,
      with `web_search` → 400 `tools_not_allowed`; a malformed allowance → 400 `bad_request`). A token without that
      allowance, **including a `freshness_web` token without it**, is tool-less: FR-AGENT-4 and FR-AGENT-7 ("tools must
      be empty") apply unchanged. With the allowance, a body is forwarded only in one of two shapes, else 403
      `tools_mismatch`:
      (a) **main loop** — `tools` holds exactly one element named `WebSearch` with exactly the keys `name`,
      `description`, `input_schema`, no `type`, a description of ≤ 1,000 characters (not pinned by bytes: the CLI may
      put dated text in it) and an `input_schema` whose canonical sha256 equals the pinned digest, plus at most one
      `DeferredToolPlaceholder` element (exactly the keys `name`, `description`, `input_schema`, `defer_loading: true`,
      pinned input_schema digest, description ≤ 200 characters); `tool_choice` absent or `{type: auto}`;
      (b) **nested search** — `tools` is exactly one object with `type` = WEB_SEARCH_VERSION (`web_search_20250305`),
      `name` = `web_search` and no keys beyond `type`, `name`, `max_uses`; `max_uses`, if present, a JSON integer ≥ 1
      (absent is allowed; 0, a negative, a float, a string or a boolean → 403 `tools_mismatch`); no `allowed_domains`,
      `blocked_domains`, `user_location`, `allowed_callers` or `search_profile`; `tool_choice` absent or
      `{type: auto}`.
      `mcp_servers` stays refused. Every request's `model` must equal the token's model, else 403 `model_mismatch`
      (a nested request moved to another model by a CLI flag fails closed). More than `requests_max` requests on one
      token → 403 `request_cap`. A refusal settles by FR-AGENT-9's record rule (no 2xx → $0; otherwise the reserve).
      The adapter (FR-AGENT-6) takes tool use only through one optional StageCall field, `web_search:
      WebSearchCall(allowance, hook, max_turns)`, so no StageCall field names a tool (SRV-TUTOR's no-tools test
      holds); the tools come from the code table `TOOL_STAGES = {("freshness_web", "search"): ("WebSearch",)}`, and a
      call with `web_search` for any other (task, stage), or with a `hook` of None (no tool runs ungated), raises
      `tools_mismatch` before the reservation and before FR-AGENT-14's `agent.call` span opens (a refused call
      leaves no span). For such a
      call it passes `tools=["WebSearch"]`, `allowed_tools=[]`, the caller's `PreToolUse` hook (the prompt is a
      string, so not `can_use_tool`), its `max_turns`, and `CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION=<searches_max>`;
      the init check (FR-AGENT-7) then requires `tools == ["WebSearch"]` and empty `mcp_servers`. Pinned data (from the stub run and the owner's
      live call, spikes/web-search §§ 3a, 5b): any other web search version or CLI pin needs a new deep-reviewer round;
      the CLI paths seen only in the binary (`search_profile`, the small-model flag `tengu_plum_vx3`,
      search-elsewhere, searchViaSearchService, a ccr-proxy, an auxiliary request) fail closed.
  - id: FR-AGENT-16
    text: >-
      Search allowance and request cap enforced by the proxy (ADR-0030 Decision 2; VEC-AGENT-4). For each nested
      search request, before forwarding, the proxy sets `max_uses` to min(the client's value or
      `searches_per_request_max` when absent, `searches_per_request_max`, remaining) — the **only field the proxy ever
      rewrites**, in the checked object it re-serialises (FR-AGENT-4) — and subtracts it from the token's remaining
      allowance; with 0 remaining it refuses with 403 `search_cap` and forwards nothing. Every forwarded request counts
      against `requests_max`, including the CLI's own retries of a 429, 529 or 5xx (REF-AGENT-4: up to 10 resends): a
      retried nested request finds the allowance used and is refused, so retries cannot buy more searches. SRV-FRESH
      sets `requests_max` = 3 (2 main-loop requests + 1 nested) and `abort_on_retry` (FR-AGENT-13 d). The upstream
      record (FR-AGENT-3) of every `freshness_web` token, with or without an allowance, adds `searches_forwarded`
      (0 without one); other tokens' records are unchanged. Failed searches still count against `max_uses` upstream
      (REF-AGENT-8), so the allowance bounds billed searches from above. The proxy log line (FR-AGENT-5) adds the route
      kind (`main` | `search`) and nothing else.
  - id: FR-AGENT-17
    text: >-
      Search fee, Haiku 5.5 and settlement (VEC-AGENT-2, VEC-AGENT-4). `spec/fixtures/SRV-AGENT/pricing.yaml` gains
      `web_search_usd: 0.01` per search (REF-AGENT-8, $10 per 1,000) and a row `claude-haiku-5-5` with two tiers by
      prompt size (the pricing page fetched 2026-11-23): prompts ≤ 100,000 tokens `{input: 0.10, output: 0.50,
      cache_write_5m: 0.125, cache_write_1h: 0.20, cache_read: 0.01}` and, under `above_100k`, `{input: 0.50, output:
      2.50, cache_write_5m: 0.625, cache_write_1h: 1.00, cache_read: 0.05}`; `cost(model, usage)` chooses the tier by
      the usage's prompt tokens (input + cache writes + cache reads), and the reserve uses the higher tier when the
      estimated prompt exceeds 100,000 tokens. The alias data (FR-AGENT-6) adds `haiku` → `claude-haiku-5-5`.
      `cost(model, usage)` adds `web_search_requests × web_search_usd` (absent → 0). Settle rows store
      `web_search_requests` (additive migration `agent_0003`, a nullable int). The SDK's `ResultMessage.usage` covers
      the main loop only, while `total_cost_usd` and `model_usage` include the nested request and the fee (stub run and
      the owner's live call, spikes/web-search § 5b: SDK = proxy, observed once); so for a tool call the settle row's
      usage fields and `web_search_requests` come from the sum over `model_usage` entries, and the cross-check
      (FR-AGENT-8) recomputes from that sum at the **lower** tier. `model_usage` is a per-model sum, not a per-request
      one, so it cannot say which request crossed 100,000 prompt tokens: when the summed prompt tokens of an entry
      with an `above_100k` tier exceed 100,000, the cross-check logs an INFO `tier_unknown` (model, summed prompt
      tokens) beside any `cost_crosscheck` warning, and the settle amount stays the SDK's (whether `total_cost_usd`
      knows the Haiku tiers stays open, H-WS-6). For a tool call several 2xx are expected: when the record shows no
      refusal, nothing in flight or failed, at most `requests_max` requests, the result is not an error result, and
      the SDK reports a cost, the settle amount is `total_cost_usd`; every other case keeps FR-AGENT-9's rule. A
      `model_usage` entry whose `cacheCreationInputTokens` is not the sum of its 5-minute and 1-hour parts is
      `usage_unmapped` (the TTL breakdown decides the rate). The tier boundary is inclusive: exactly 100,000 prompt
      tokens is the lower tier, 100,001 the higher. The reserve for a tool call is max(the
      caller's floor, FR-AGENT-9's single-call estimate + `searches_max × web_search_usd`); the caller's floor must
      cover the call's worst case by formula (SRV-FRESH `search_reserve_floor_usd`), knowing that the tokens a search
      adds are not enforceable. ADR-0039 revision: the alias data also resolves judge slot bindings (FR-AGENT-18):
      `haiku` for `judge.find`, `judge.link_type` and `ingest.context_prefix`, `opus` for `judge.eval.*` and
      `judge.align`; every v1 binding has a pricing row. A judge call's reserve and cost use the tier rule above (an
      `ingest.context_prefix` call with its section in context may pass 100,000 prompt tokens and is then reserved at
      the higher tier).
  - id: FR-AGENT-18
    text: >-
      Judge slots as task classes (ADR-0039 B7). `reader.agent.judges.JUDGE_SLOTS` is data, one `Slot` per slot: name,
      fixed line (None for `judge.find`, whose line the caller gives), lane (`worker-judge` or `worker`), v1 binding,
      and for `judge.find` its max output tokens, floor and prompt file. `judge.find`: the worker-judge lane, `haiku`,
      `bounds.judge_find_max_output_tokens`, `bounds.judge_find_floor_usd`, `prompts/judge_find.md`, FR-AGENT-22.
      `judge.link_type` and `ingest.context_prefix`: line `index`, the worker, `haiku`. `judge.eval.<name>`
      (`relevance`, `sufficiency`, `groundedness`, `self_contained`, `citation_supports_claim`) and `judge.align`: line
      `eval`, the worker, `opus`. The offline slots' prompts and parsers belong to their owners (SRV-INGEST, SRV-KB,
      SRV-OBS): their `Slot` holds no prompt, and their owners pass the prompt bytes to `judge_version` (FR-AGENT-20),
      so SRV-AGENT never reads another module's files. Every slot prompt file is a fixed frame plus exactly one
      delimited instructions section (the delimiter is SRV-OBS's, which pins that wrapping the base instructions is
      byte-equal to the production prompt); `prompts/judge_find.md`'s frame states that text inside the query and
      cards is data and never followed, and the ordinal output contract of FR-AGENT-22. Alignment proposals and their
      export replace only the instructions section, never the frame; extracting and wrapping the section are
      SRV-OBS's functions, not SRV-AGENT's. The model is `reader.yaml` `tasks.<slot>.model` (an alias or a
      priced full id); a slot missing from `tasks` raises `unknown_model` before any spend, as any task. Replacing a
      binding is a config change, allowed only when the candidate is not worse on the evaluation set (ADR-0018 tuning
      rule, B7a no-regression rule; a review rule, not a code check). No slot is in `TOOL_STAGES`, so every slot call
      is tool-less (FR-AGENT-4, -7).
    tests_planned:
      - "test_judges.py [unit]: names, lines, lanes and v1 bindings; no slot in TOOL_STAGES"
      - "test_lines_db.py [db]: a slot missing from tasks → unknown_model, no reserve row"
  - id: FR-AGENT-19
    text: >-
      Ledger lines and the index and eval caps (ADR-0039 B7, ADR-0005 amendment). `judges.TASK_LINES` (derived from
      the compile, tutor and freshness tasks and JUDGE_SLOTS): `draft`, `fact_check`, `review` → `compile`; `tutor` →
      `tutor`; `freshness_scan`, `freshness_web`, `freshness_report` → `freshness`; `judge.link_type`,
      `ingest.context_prefix` → `index`; `judge.eval.*`, `judge.align` → `eval`. `call.line` is a choice only for
      `judge.find`, which requires one of `tutor`, `compile`, `mcp` and `eval`. The `eval` line is for the `obs.align`
      job only (SRV-OBS): it calls `judge.find` from the worker, not the lane, through the Provider port, in memory,
      tool-less (judge.find is not in TOOL_STAGES), and nothing is looked up in or recorded to `judge_outputs` for it —
      offline evaluation like `judge.eval.*`, as ADR-0039 B7 runs `judge.align` offline in a worker job. The lane
      (FR-AGENT-21) refuses an `eval` request. For every other task it must be None
      or equal to the task's fixed line, and a task with no fixed line takes only None (its stored line is then null,
      as for the live check). Anything else is refused with `line_invalid` before the reservation and the span. The
      stored line is `call.line` or the task's fixed line. Line caps (file settings, `judges.line_caps(config)`):
      `ingest.context_prefix` → `budgets.index_usd_per_pack`; `judge.link_type` → `budgets.index_usd_per_pair_run`;
      every call on the `eval` line → `budgets.eval_usd_per_run`. A missing cap refuses with `cap_missing` before any
      spend. Their run scopes are owner-unique: `judges.scope_run_id(owner_id, kind, version_id)` = uuid5 over
      (kind, owner id, version id), with kind `overlay` (the prefix overlay's version id, which SRV-INGEST derives
      from the pack and the prompt version, so retries, re-enqueued batches and rebuilds share the cap), `pair_run`
      or `eval_run` (version id = one evaluation run's id; for `judge.align` and its alignment re-runs = the
      proposal id, so `budgets.eval_usd_per_run` spans the whole proposal). Contract on the callers (SRV-INGEST,
      SRV-KB, SRV-OBS): a line-capped call must pass `scope_run_id(...)` as its `run_id`; the ledger scopes the cap by
      `run_id` and cannot tell a fresh uuid from a legitimate scope, so a caller that passes another id gets a fresh
      cap per call. The refusals of FR-AGENT-9 (c) are budget outcomes: the calling job
      stops with an event and the pack stays usable. `ledger.spent(owner_id=…, line=…)` gives per-line totals.
    tests_planned:
      - "test_lines_db.py [db]: the stored line per TASK_LINES; judge.find with no line, line index → line_invalid, nothing reserved; judge.find on lines tutor, compile, mcp, eval → reserved; a draft call with line tutor and a live call with line index → line_invalid; cap_missing for each of the three caps; per-pack cap across two calls of one overlay refuses the second (index_budget_exhausted); pair-run cap refusal; eval cap over two calls of one run refuses the second (eval_budget_exhausted); two owners with the same overlay version id get different run ids and independent caps; a judge.find call with line eval through the Provider port runs under the eval cap and leaves judge_outputs empty; spent(line=...); a reserve row with a line outside the CHECK set is refused by the database"
      - "test_judges.py [unit]: scope_run_id differs by owner, kind and version id and is stable"
  - id: FR-AGENT-20
    text: >-
      Judge versions and recorded outputs (ADR-0039 B7, B7a). `judges.judge_version(prompt_bytes, model,
      schema_version)` = the first 12 hex of sha256 over the prompt bytes, the resolved model id and the schema
      version; `judges.judge_name(slot, prompt_bytes, model, schema_version)` = `<slot>@<version>`.
      `judges.find_input_sha256(owner_id, query, cards)` = FR-AGENT-15's `canonical_sha256` of `{"owner": <uuid text>,
      "query": <text>, "cards": [[id, text], ...]}` in judge order; SRV-SEARCH computes it, the lane recomputes it.
      Recorded outputs are owner-scoped, keyed (owner_id, input hash, judge): one user's output never serves another,
      even for identical input. `judges.record(conn, owner_id, input_sha256, judge, output, pack_ids=(),
      overlay_id=None, request_id=None)` inserts with ON CONFLICT DO NOTHING and returns whether
      it inserted; `judges.recorded(conn, owner_id, input_sha256, judge)` returns the parsed output or None. Rows hold
      card ids and numbers, never text. `judges.ReplayProvider(engine, owner_id, input_sha256)` (tests and rebuilds)
      returns, from `run(judge)`, that owner's parsed output for that input and judge, and raises `replay_miss` with no
      model call when there is none. `judges.expire(conn)` deletes `judge.find` rows older than
      `bounds.judge_find_output_retention_days` (database `now()`; SRV-EVENTS's collector calls it);
      `judges.forget_pack(conn, owner_id, pack_id)` deletes that owner's `judge.find` rows citing the pack, and
      `judges.forget_overlay(conn, owner_id, overlay_id)` the owner's offline rows of an overlay (SRV-INGEST and SRV-KB
      call them under their locks). The spend of a call stays in `agent_spend` (its reservation id is not exposed by
      the Provider port, so the output row carries none). These three set `reader.judge_delete` for the statement
      and reset it after it succeeds (a failed DELETE aborts the transaction, which ends the setting; its own error is
      the one raised); any other
      DELETE, every UPDATE and TRUNCATE are refused by the trigger. A new judge version sits next to the old one.
    tests_planned:
      - "test_judges.py [unit]: judge_version changes with the prompt bytes, the model id and the schema version only; find_input_sha256 changes with owner, query, card order, card id and card text"
      - "test_judges_db.py [db]: record twice → one row, the second False; UPDATE, a plain DELETE and TRUNCATE refused; recorded after record; two owners with one input and judge → two rows, each sees only its own (recorded, ReplayProvider), forget for owner A leaves B's rows; ReplayProvider miss → replay_miss; expire deletes only judge.find rows past 30 days; forget_pack deletes only rows citing the pack; forget_overlay"
  - id: FR-AGENT-21
    text: >-
      The `judge.find` job (ADR-0039 B6, B7b). `reader.agent.lane.make_kind(deps)` declares the kind `judge.find`
      (queue `judge`, max attempts 1, keyed by the request id, args exactly `{"request_id", "input_sha256"}`), which
      SRV-EVENTS routes to the worker-judge lane only. `Deps` holds the provider factory, the config, the
      `JudgeRequests` store, the `PackGuard` and the `JudgeInputsSink`. The handler: (1) reads the request (owner_id,
      line, run_id, run_cap_usd, lesson_id, daily_budget_usd, created_at, deadline, query, cards, pack_ids); none →
      done, no call. A request whose line is not `tutor`, `compile` or `mcp` (the `eval` line never comes through the
      lane, FR-AGENT-19) → log `line_invalid`, no call, nothing recorded. (2) database now ≥ deadline → no reserve,
      no call. (3) the recomputed `find_input_sha256` differs
      from the arg → log `judge_input_mismatch`, no call. (4) the kill window `judge_kill_factor` × (deadline −
      created_at) exceeds `lane_token_ttl_s` − `lane_ttl_margin_s` → `judge_window_too_long`, no call. (5) the
      rendered input's estimate (FR-AGENT-9's estimator) over `bounds.judge_find_input_tokens_max` →
      `judge_input_too_large`, no call. (6) a recorded output for (owner, input hash, current judge) → no call.
      (7) the provider handle is read from `users` by the owner_id (as the tutor job does), never from the request;
      no user → no call. (8) otherwise exactly one `Provider.run` of task and stage `judge.find`, attempt 1, the
      request's line, run_id, run cap and daily budget, the prompt file as `system`, `thinking_off`,
      `abort_on_retry`, max output and floor from the slot, and `deadline_s` = created_at + kill window − now
      (always positive: (2) passed, so now < deadline < created_at + kill window): today's per-call path, no
      pre-spawned process; the token is issued only after the reservation (FR-AGENT-6). (9) on an output that parses (FR-AGENT-22): one
      transaction takes `PackGuard.lock_active(pack_ids)`; false → nothing written; else `judges.record(...)` and,
      only when it inserted, `JudgeInputsSink.copy(...)`; a late output is written the same way. (10) in a `finally`,
      in its own transaction: the request is deleted and `pg_notify('judge_done', <request id>)` sent (payload the id
      only, delivered at commit). Every `AgentError` from the call or the parse ends the job without an output row and
      without retry (logged by code); (4) and (5) raise. `lane.on_worker_start(engine)` calls `revoke_all()` once
      and never raises; stale lane tokens expire within `lane_token_ttl_s` either way. The lane's proxy client uses
      `bounds.lane_issue_timeout_s`. Nothing in this module logs or writes a query or card text outside the request.
    tests_planned:
      - "test_lane_db.py [db] (fake CLI, fake proxy, in-memory JudgeRequests, fake guard and sink): no request → no call; a request with line eval → no call, no output row; deadline passed → no reserve; hash mismatch → no call; window over the TTL → judge_window_too_long; input over 3,000 estimated tokens → judge_input_too_large; recorded hit → no call; one call → one reserve, one settle, one output row, request deleted, one notify whose payload is the id; the StageCall fields (task, stage, attempt 1, line, system = prompt file, thinking_off, abort_on_retry, deadline_s ≈ created + 3 × (deadline − created) − now, max output 512, floor 0.002); the token issued after the reservation row exists; handle from users; an owner with no users row → no call; late output recorded; two jobs with one input → one row, one sink copy; guard false → nothing written; output_invalid, a budget refusal and lane_saturated → no output row, request deleted; an unexpected error after the call still deletes the request; the kind's max_attempts, queue, key and args"
      - "test_lane_db.py [unit]: on_worker_start calls revoke_all once and swallows a failing proxy; the lane proxy client's timeout"
  - id: FR-AGENT-22
    text: >-
      `judge.find` output (VEC-AGENT-5). The prompt labels the n input cards with ordinals 1..n in judge order (card ids
      never reach the model). The model's text, stripped, is one JSON object, optionally inside a single fence that
      opens with ```json and closes with ```, with the keys `keep` (required: ordinals in relevance order), `drop`
      (optional: ordinals) and `sufficiency` (required: a finite number in [0, 1]) and no others. Ordinals are JSON
      integers, not booleans or floats, in 1..n, with no duplicates; `drop`, when present, equals the complement of
      `keep` exactly, and when absent is that complement. `NaN`, `Infinity` and `-Infinity` are refused, as are
      booleans and strings for numbers, a sufficiency outside [0, 1] of any size (an integer of 400 digits is
      range-checked before any float conversion, so it is `output_invalid`, never an OverflowError), and an object
      with a duplicate key. Anything else is `output_invalid` (no output row, the waiter degrades).
      The system prompt is exactly the prompt file (frame plus instructions section); all data, the query and the
      cards, travels in the user message (`judges.render_find_input`), never in the system prompt, and the renderer
      neutralises every data line that contains `<<<READER-INSTRUCTIONS` or `READER-INSTRUCTIONS>>>` (SRV-OBS's
      delimiter) by replacing the token `READER-INSTRUCTIONS` with `READER_INSTRUCTIONS_DATA`.
      `judges.parse_find_output(text, card_ids)` maps ordinals back to card ids: `{"keep": [ids], "drop": [ids],
      "sufficiency": x}` is what is recorded and returned, never the model text.
    tests_planned:
      - "test_judges.py [unit]: the parser over VEC-AGENT-5 and the mapping back to card ids; a query and a card carrying both delimiter lines leave the system prompt bytes unchanged and put no raw delimiter in the rendered user message"
  - id: FR-AGENT-23
    text: >-
      Loop fit for the compile loop rule (ADR-0005 amendment, ADR-0039 decision 22). `AgentProvider.loop_fits(owner_id,
      run_id, run_cap_usd, planned)` takes the planned calls of one loop, each a `PlannedCall(task, prompt_chars,
      max_output_tokens, floor_usd, custom_system=False, searches_max=0)` (the arguments of `reserve_for` after model
      resolution; searches_max is 0 for every compile call today), and returns true iff, at the time of the check,
      spent(run) + the sum of their reserves ≤ `run_cap_usd`, for each task spent(run, task) + that task's summed
      reserves ≤ its effective `budget_usd_per_lesson` (when set), and the user's month spend + the sum ≤ the effective
      `budgets.monthly_usd` (when set). It writes nothing and takes no lock; each call still reserves under FR-AGENT-9.
      A `judge.find` call the fact-check route will make is a planned call of the loop. Revision (asked by
      SRV-PIPELINE's V.kl-pipeline-checks, D3): `AgentProvider.loop_fits_limit(owner_id, run_id, run_cap_usd,
      planned)` makes the same checks with the same arithmetic and returns None when the loop fits, else the first
      refusing limit in the fixed order `run` (the run cap, `budget.compile_cap_usd`), `task` (a planned task's
      `budget_usd_per_lesson`, tasks checked in their first-planned order), `month` (`budgets.monthly_usd`);
      `loop_fits(...)` is `loop_fits_limit(...) is None`.
    tests_planned:
      - "test_loop_fits_db.py [db]: true when the sum fits exactly; false when the run cap, one task budget or the monthly cap would be crossed by the sum though each call alone fits; open reservations count; nothing is written"
      - "test_loop_fits_db.py [db]: loop_fits_limit over VEC-AGENT-1's `loop_limits` cases — None, `run`, `task`, `month`, and `run` before `task` before `month` when several refuse; loop_fits agrees with it on every case"

invariants:
  - id: INV-AGENT-1
    text: >-
      No provider token in the worker, worker-judge or any kernel service: absent from env, `/proc/*/environ`,
      `/run/secrets`, `~/.claude`, `docker inspect` and logs, and a request from either service without a live
      run_token gets no credential (ADR-0025 verified_by, amended by ADR-0039 B7b). [live]
    tests_planned:
      - "change server/tests/agent/test_live.py: the INV-AGENT-1 checks parametrised over worker and worker-judge; OPS-SANDBOX's no-valid-handle test (INV-SANDBOX-7) runs against both"
  - id: INV-AGENT-2
    text: >-
      A run_token maps to exactly one user's token: user A's run_token never yields user B's token, a revoked or expired
      run_token yields nothing, and no request without a live run_token is forwarded (property test over sequences).
  - id: INV-AGENT-3
    text: >-
      agent-proxy opens connections only to the pinned upstream, only for `POST /v1/messages` with an allowed query, and
      forwards only allow-listed headers (property test over methods, paths, queries and header sets against a stub).
  - id: INV-AGENT-4
    text: >-
      For every run, task and month: spent counts every reservation until it is settled or voided, settled spend equals
      the sum of `settled_usd` (each computed by FR-AGENT-9's rule from the SDK cost, the reserve and the upstream
      record), and no scope's spent exceeds its cap by more than one call's reserve (property test over
      reserve/settle/void/crash sequences).
  - id: INV-AGENT-5
    text: No log line from agent-proxy or the adapter contains a token, a run_token, a prompt or model output (canary test).
  - id: INV-AGENT-6
    text: >-
      For any sequence of run_token requests and bodies, including retries: a body with non-empty `tools` is
      forwarded only on a token with a `web_search` allowance and only in one of FR-AGENT-15's two shapes; on such a
      token every forwarded `max_uses` ≤ `searches_per_request_max`, their sum ≤ `searches_max`, and at most
      `requests_max` requests are forwarded; `mcp_servers` is never forwarded non-empty (property test against a stub
      upstream). Amended (ADR-0039 B7b): no token issued to `worker-judge` ever carries a `web_search` allowance, so
      no body with non-empty `tools` is ever forwarded for worker-judge.
    tests_planned:
      - "change server/tests/agent/test_websearch.py's INV-AGENT-6 property test: requests drawn from both client addresses; worker-judge never gets an allowance and never forwards tools"
  - id: INV-AGENT-7
    text: >-
      For any sequence of issue, revoke, revoke-all and forward requests from `worker`, `worker-judge` and unknown
      addresses, with clock advances: each client's live tokens ≤ its quota (worker-judge ≤ 4); no request of one
      client revokes, evicts or forwards with another client's token; an unknown address is never issued a token and
      nothing it sends is forwarded; no expired token is forwarded; after a client's revoke-all it holds 0 tokens and
      the other client's tokens are unchanged; no worker-judge token carries a `web_search` allowance (property test
      against a stub upstream; extends INV-AGENT-2).
    tests_planned:
      - "add a Hypothesis state machine in server/tests/agent/test_proxy_clients.py"
  - id: INV-AGENT-8
    text: >-
      One call, one process, one token: a `judge.find` job makes at most one `Provider.run`; each run starts at most
      one CLI process, with its own fresh HOME and its own run_token, issued after its reservation; no two jobs share a
      process, HOME or token (property test over concurrent jobs with a fake CLI that records spawns). That no CLI
      outlives its `deadline_s` by more than 1 s is FR-AGENT-13 (e)'s kill, pinned by its [image] test.
  - id: INV-AGENT-9
    text: >-
      Recorded outputs: for any interleaving of `record` calls of one or two owners with equal (input hash, judge), at
      most one `judge_outputs` row exists per owner and none is ever updated; `recorded` and `ReplayProvider` return
      only the calling owner's output (property test).
  - id: INV-AGENT-10
    text: >-
      Text-free lane: no `judge.find` job's args, `agent_spend` row, `judge_outputs` row or log line of the adapter or
      the lane contains the query or a card text (canary test with marker strings in the query and every card;
      SRV-EVENTS's own canary covers `job_keys`).

nfr:
  # Structural bound: a first token takes 1.6–3.9 s on the measured models (spikes/agent-sdk-container), so 50 ms of
  # proxy overhead is under 3 % of it. Measured as p95 over at least 50 requests against a local stub upstream.
  - id: NFR-AGENT-1
    metric: agent-proxy added latency to first byte, p95 over ≥ 50 requests, ms
    threshold: 50
    verified_by: bench

vectors:
  - id: VEC-AGENT-1
    source: All 12 spikes/compile-cost stages (exact token counts, SDK-reported costs), usage-key mapping, edge cases, settlements from the measured error shapes; issue refusals (FR-AGENT-9 e) and loop-limit cases per limit (FR-AGENT-23), hand-built
    file: spec/fixtures/SRV-AGENT/cost-vectors.yaml
  - id: VEC-AGENT-2
    source: Pricing table (Anthropic API rates as cached 2026-11-03; cache multipliers from the prompt-caching economics; Haiku 5.5 tiers and the web search fee from the pricing page fetched 2026-11-23)
    file: spec/fixtures/SRV-AGENT/pricing.yaml
