bounds:
  run_token_ttl_s: 1500         # proxy_upstream_timeout_s + 600 s margin: a token outlives its longest call, and a
                                # leaked one dies within 25 min
  run_tokens_max: 32            # structural: one per running stage; worker concurrency is 1 (SRV-EVENTS FR-EVENTS-9)
  proxy_body_max_bytes: 33554432  # 32 MiB: the API's own request cap is 32 MB
  proxy_upstream_timeout_s: 900   # structural: the longest measured stage took 190 s (REF-AGENT-5); a stream keeps the
                                  # connection busy, so 15 min only stops a hung upstream
  crosscheck_tolerance: { relative: 0.05, absolute_usd: 0.005 }  # VEC-AGENT-1: 0.38–1.78 % and $0.0023–0.0043 observed
  chars_per_token_floor: 2.0    # estimator bound: L02 measured ~2.5 chars/token (60,034 chars ≈ 23,900 tokens,
                                # REF-AGENT-5); 2.0 overestimates tokens, so reserves err high
  cli_system_tokens: 6803       # the CLI's own system prompt, measured in every stage (REF-AGENT-5); used only
                                # when a call sets no system prompt of its own (FR-AGENT-13)
  cli_overhead_tokens: 1000     # the fixed overhead beside a custom system prompt: ≈ 410 measured (REF-AGENT-7), 2.4×
  # ADR-0039 (FR-AGENT-18..23):
  judge_kill_factor: 3          # B7b: kill deadline = 3 x the B6 timeout (6.6 s at the initial 2.2 s)
  lane_token_ttl_s: 30          # B7b initial value; FR-AGENT-21 refuses a request whose kill window exceeds it minus
  lane_ttl_margin_s: 5          # this margin, unmeasured: between the window check and the token's issue the lane
                                # makes four database round-trips (now, recorded, handle, reserve) and an issue of up
                                # to lane_issue_timeout_s (1 s); after a kill come revoke and settle. 5 s covers
                                # those plus scheduling slack; judge-gate measures the real gap
  judge_find_output_retention_days: 30   # B7 (ADR-0032 Decision 6's trace retention), initial value
  judge_find_max_output_tokens: 512      # initial value: ordinals for <= 13 cards and one number; judge-gate measures
  judge_find_floor_usd: 0.002   # FR-AGENT-9's formula on Haiku at the cap: (1,000 + ceil(7,500 / 2.0)) x $0.20/M
                                # + 512 x $0.50/M = $0.0012; rounded up
  judge_find_input_tokens_max: 3000  # B6 step 6 initial cap, by FR-AGENT-9's estimator; re-checked by the lane
  lane_issue_timeout_s: 1.0     # the lane's agent-proxy client timeout (the worker keeps 10 s)
  client_quota: { worker: 28, worker-judge: 4 }   # 28 + 4 = run_tokens_max 32. worker: concurrency 1 (FR-EVENTS-9),
                                   # 28 keeps today's evict-oldest headroom; worker-judge: its concurrency (B7b)

tables:
  agent_spend: { owner_id: true, columns: "id bigint identity pk, owner_id → users.id, run_id uuid, lesson_id uuid null, stage text, task text, attempt int, kind text (reserve|settle|void), reservation_id bigint null (settle and void → their reserve), model text, usd numeric(12,6), sdk_usd numeric(12,6) null, settled_usd numeric(12,6) null (settle only: the amount counted, FR-AGENT-9), upstream jsonb null (settle only: the run_token's upstream record), input, output, cache_write_5m, cache_write_1h, cache_read (bigint, settle only), thinking bigint null (settle only: output_tokens_details.thinking_tokens, part of output, not priced; agent_0002), created_at; append-only: a trigger refuses UPDATE, DELETE and TRUNCATE; agent_0004 adds line text null CHECK (line IN (compile, tutor, freshness, mcp, index, eval)), null on rows written before it" }
  judge_outputs: { owner_id: true, columns: "owner_id → users.id, input_sha256 text, judge text (`<slot>@<version>`), output jsonb (parsed card ids and numbers only, never query, card or model text), pack_ids text[] (judge.find), overlay_id text null (offline slots), request_id uuid null, created_at default now(); PRIMARY KEY (owner_id, input_sha256, judge); a trigger refuses UPDATE and TRUNCATE, and refuses DELETE unless the transaction-local setting `reader.judge_delete` is `on`, which only FR-AGENT-20's expire and forget functions set (agent_0004)" }

# One cost definition: `cost(model, usage) = sum(usage_k * rate_k) / 1e6` over the five fields of VEC-AGENT-1's mapping.
# `spent(scope) = sum(settle.settled_usd) + sum(reserve.usd for reserves with neither a settle nor a void)`, where
# settled_usd is the amount FR-AGENT-9 settles at (0, the SDK cost, or the reserve; VEC-AGENT-1 `settlements`).

errors: [budget_exhausted, task_budget_exhausted, monthly_budget_exhausted, provider_missing, provider_unavailable,
  rate_limited, run_token_unknown, tools_mismatch, model_mismatch, output_cap, body_not_json, sdk_error, output_invalid, unknown_model,
  usage_unmapped, daily_budget_exhausted, upstream_retry, deadline_exceeded, body_not_utf8, tools_not_allowed,
  search_cap, request_cap, lane_saturated, line_invalid, cap_missing, index_budget_exhausted,
  eval_budget_exhausted, replay_miss, judge_window_too_long, judge_input_too_large,
  client_unknown, client_quota]   # the last two are agent-proxy's own codes (FR-AGENT-3); FR-AGENT-6 maps them

requirements:
  - id: FR-AGENT-1
    text: >-
      agent-proxy image and entry point. `deploy/images/agent-proxy.Dockerfile` builds `reader-agent-proxy:local` from
      the pinned `python:3.14-slim-trixie` digest with the server package (no `agent` extra), entry point `python -I -m
      reader.agent.proxy`, uid 10002, `sh`, `cat` and `mv` for delivery (OPS-DEPLOY FR-DEPLOY-10), and the health command
      `/usr/local/bin/reader-agent-proxy-health`: exit 0 when listening on 8080 (with zero provider users this is
      healthy-idle), 1 otherwise. Only allow-listed COPY inputs (OPS-DEPLOY's allow-list test).
  - id: FR-AGENT-2
    text: >-
      Token loading. agent-proxy reads reader.yaml at the fixed path `/etc/reader/reader.yaml`, where OPS-CLI's override
      binds it read-only (OPS-DEPLOY sets no environment on agent-proxy, so no READER_CONFIG), to map each user to the reference of
      their `anthropic-subscription` provider, and reads the token from `/run/secrets/<secret_file_name(ref)>` (SRV-CONFIG
      FR-CONFIG-14) with SRV-CONFIG's host-resolved checks (O_NOFOLLOW, regular file, mode, size, UTF-8, non-empty). A
      missing file means that user has no provider until it appears (re-read on each run_token request); never another
      user's token. Tokens are held as `Secret` and never logged, echoed or written.
  - id: FR-AGENT-3
    text: >-
      Run tokens, per client (revised for ADR-0039 B7b; promoted in V.kl-deploy-judge-lane with OPS-DEPLOY's
      agentnet addresses). agent-proxy establishes the calling client from the connection's source address on
      `agentnet` and never from a request field or header: `CLIENTS` (data in proxy.py) maps each fixed IPv4
      address that OPS-DEPLOY declares to a client name with its quota, TTL and full-table rule — `worker`: quota
      `bounds.client_quota.worker`, TTL `bounds.run_token_ttl_s`, oldest own token revoked when exceeded;
      `worker-judge`: quota `bounds.client_quota.worker-judge`, TTL `bounds.lane_token_ttl_s`, the issue refused
      when full and, with `tools: false`, never given a tool allowance: a `web_search` field from worker-judge → 400
      `tools_not_allowed` whatever its task (only `worker` has `tools: true`). `main()` passes
      `proxy_headers=False` to `uvicorn.run`, so `X-Forwarded-For` is never read, and takes `--bind <ipv4>:<port>`
      (default `0.0.0.0:8080`; OPS-DEPLOY FR-DEPLOY-16 (d) passes the agentnet address, so nothing listens on
      loopback or on the `egress` side; a malformed value exits 2). Any request from an
      address not in `CLIENTS` (another service, the proxy's `egress` side) gets 403 `client_unknown` on every route,
      and nothing is issued, revoked or forwarded. `POST /run-tokens {"user": "<handle>", "max_output_tokens": n,
      "model": "<full id>"}` returns `{"run_token": "<43-char urlsafe base64 of 32 random bytes>"}` bound to that
      user, output cap, model and client for the client's TTL. Before every issue, revoke and forward the proxy
      purges every expired entry (age > its TTL), so an expired token never counts against a quota; purge, quota
      count and insert run with no `await` between them, so concurrent issues cannot both pass a quota. A client at its
      quota: `worker` revokes its own oldest token; `worker-judge` gets 429 `client_quota` and no token. One client's
      issue never evicts another client's token. `POST /run-tokens/revoke {"run_token": "..."}` revokes a token of the
      calling client only and returns its upstream record `{"requests": k, "statuses": [...], "any_2xx": bool,
      "refused": [...], "in_flight": n, "failed": m}` (upstream statuses in order, the proxy's own refusal codes,
      requests still relayed at revoke, requests failed after connect; the token travels in the body, never in a
      path); an unknown, expired, evicted or other client's token answers 404 `run_token_unknown`, returns no record
      and leaves the other client's token live. `POST /run-tokens/revoke-all {}` revokes every token of the calling
      client and returns `{"revoked": n}`; records are dropped. A `worker` restart's revoke-all removes tokens the
      dead worker process held (worker concurrency 1, and the hook runs before the first job); another worker-client
      caller sharing the address, such as a live check run by `docker exec` in the worker container, may lose its
      token, and its call then settles at the reserve (unknown record), the safe direction. FR-AGENT-5's route
      templates gain `/run-tokens/revoke-all`, logged like the other two (no new field). A forwarded request's bearer
      must name a live token of the calling client (FR-AGENT-4's 401 `run_token_unknown` otherwise). A user without
      a loaded token gets 409 `provider_missing`. Tokens are stored only as sha256 digests and compared in constant
      time. FR-AGENT-15's `task` and `web_search` fields are unchanged.
    tests_planned:
