    title: ADR-0025 — agent sandbox and credential separation (accepted)
    url: docs/adr/0025-agent-sandbox-and-credential-separation.md
  - id: REF-AGENT-2
    title: ADR-0005 — agent runtime, per-user providers and cost budgets
    url: docs/adr/0005-agent-runtime-and-providers.md
  - id: REF-AGENT-3
    title: Claude Agent SDK for Python (ClaudeAgentOptions, SystemMessage init, ResultMessage.total_cost_usd and usage)
    url: https://code.claude.com/docs/en/agent-sdk
  - id: REF-AGENT-4
    title: spikes/agent-proxy-handshake/RESULT.md — methods, paths, headers, hosts and init tools of the bundled CLI
    url: spikes/agent-proxy-handshake/RESULT.md
  - id: REF-AGENT-5
    title: spikes/compile-cost/RESULT.md — L02 stage costs and token counts
    url: spikes/compile-cost/RESULT.md
  - id: REF-AGENT-6
