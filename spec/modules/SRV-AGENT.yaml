proposed_requirements:
  - id: FR-AGENT-18
    text: >-
      Judge slots as task classes (ADR-0039 B7). `reader.agent.judges.JUDGE_SLOTS` is data, one entry per slot: name,
      line, where it runs, v1 binding, max output tokens, floor, prompt file and output parser. `judge.find`: line from
      the caller (`tutor`, `compile` or `mcp`), the worker-judge lane, `haiku`, `bounds.judge_find_max_output_tokens`,
      `bounds.judge_find_floor_usd`, `prompts/judge_find.md`, FR-AGENT-22. `judge.link_type` and
      `ingest.context_prefix`: line `index`, the worker, `haiku`; prompt and parser owned by SRV-KB and SRV-INGEST.
      For slots whose owner spec has not landed, the entry's prompt and parser are null and a call of that slot
      raises `unknown_model` before any spend; `judge_version` of such a slot takes the prompt bytes the owner passes
      (`judge_version(slot, prompt_bytes)`), so SRV-AGENT never reads another module's files. `judge.eval.<name>` (`relevance`, `sufficiency`, `groundedness`, `self_contained`,
      `citation_supports_claim`) and `judge.align`: line `eval`, the worker, `opus`; prompts and parsers owned by
      SRV-OBS. The model is the slot's `reader.yaml` `tasks.<slot>.model` (an alias or a priced full id); a slot
      missing from `tasks` raises `unknown_model` before any spend, as any task. Replacing a binding is a config
      change, allowed only when the candidate is not worse on the evaluation set (ADR-0018 tuning rule, B7a
      no-regression rule; a review rule, not a code check). Every slot call runs tool-less (FR-AGENT-4, -7): no slot
      is in `TOOL_STAGES`.
    tests_planned:
      - "add server/tests/agent/test_judges.py [unit]: the slot table's names, lines and v1 bindings; no slot in TOOL_STAGES; a slot missing from tasks → unknown_model with no reserve row (with test_provider_db's fakes); a slot with a null prompt → unknown_model, no reserve; a judge.find call passes the prompt file as system, stage judge.find, attempt 1"
  - id: FR-AGENT-19
    text: >-
      Ledger lines and the index and eval caps (ADR-0039 B7, ADR-0005 amendment). `TASK_LINES` (data in judges.py):
      `draft`, `fact_check`, `review`, `revise` → `compile`; `tutor` → `tutor`; `freshness_*` → `freshness`;
      `judge.link_type`, `ingest.context_prefix` → `index`; `judge.eval.*`, `judge.align` → `eval`. `call.line` is
      a free choice only for `judge.find`, which requires one of `tutor`, `compile`, `mcp`; for every other task it
      must be None or equal to the task's fixed line, and a task with no fixed line takes only None (its line is then
      null, as for the live check). Anything else is refused with `line_invalid` before the reservation and before
      the span. The stored line is `call.line` or the task's fixed line. Caps read per call through
      `reader.config.effective` (file settings): `ingest.context_prefix` → `budgets.index_usd_per_pack`, whose run
      scope is one prefix overlay (the caller's `run_id` = uuid5 of the overlay's version id, which SRV-INGEST derives
      from the pack and the prompt version, so retries, re-enqueued batches and rebuilds of the same overlay share the
      cap and cannot reset it); `judge.link_type` →
      `budgets.index_usd_per_pair_run` (run_id = the pair run id); the `eval` line → `budgets.eval_usd_per_run`
      (run_id = one evaluation run or one `judge.align` job). A missing cap refuses the call with `cap_missing`
      before any spend, so no index or eval credit is spent before the owner sets the measured caps (B10 cost + 20%).
      The refusals of FR-AGENT-9 (c) are budget outcomes, not job failures: the calling job stops with an event and
      leaves the pack usable (unprefixed spans keep their titles-only context, unjudged pairs stay unlinked).
      `ledger.spent` gains `line=` for per-line totals.
    tests_planned:
      - "add server/tests/agent/test_lines_db.py [db]: TASK_LINES applied to the stored line; judge.find with no line / line index → line_invalid, nothing reserved, no span; a draft call with line tutor → line_invalid; a task with no fixed line (live) with line index → line_invalid; cap_missing for each of index_usd_per_pack, index_usd_per_pair_run and eval_usd_per_run; per-pack cap across two batches of one overlay refuses the second batch's call once spend + reserve exceeds it; a pair-run cap refusal; eval cap over two calls of one evaluation run refuses the second; spent(line=...) per line"
  - id: FR-AGENT-20
    text: >-
      Judge versions and recorded outputs (ADR-0039 B7, B7a). `judge_version(slot)` = the first 12 hex of sha256 over
      the slot's prompt file bytes, the resolved model id and the parser's schema version; `judge` = `<slot>@<version>`.
      `judges.find_input_sha256(owner_id, query, cards)` = sha256 of canonical JSON (FR-AGENT-15's `canonical_sha256`)
      of `{"owner": <uuid>, "query": <text>, "cards": [[id, text], ...]}` in judge order; SRV-SEARCH computes it, the
      lane recomputes it. Recorded outputs are owner-scoped: the key is (owner_id, input hash, judge), so one user's
      output never serves another user, even for identical input. `judges.record(conn, owner_id, input_sha256, judge,
      output, pack_ids | overlay_id, request_id, reservation_id)` inserts with ON CONFLICT DO NOTHING and returns
      whether it inserted; `judges.recorded(conn, owner_id, input_sha256, judge)` returns the parsed output or None.
      Rows hold card ids and numbers, never text. Replay: `ReplayProvider(owner_id)` (tests and rebuilds) answers a
      slot call from that owner's recorded output for the current judge and raises `replay_miss` with no model call
      when there is none. Retention: `judge.find` rows older than `bounds.judge_find_output_retention_days` (database
      `now()`) are deleted by `judges.expire(conn)` (SRV-EVENTS's collector calls it);
      `judges.forget_pack(conn, owner_id, pack_id)` deletes that owner's `judge.find` rows citing the pack, and
      `judges.forget_overlay(conn, owner_id, overlay_id)` the owner's offline rows of an overlay, both called by
      SRV-INGEST and SRV-KB under their locks. These three set `reader.judge_delete` for their transaction; any other
      DELETE is refused by the trigger. A new judge version sits next to the old one; nothing is updated.
    tests_planned:
      - "add server/tests/agent/test_judges.py [unit]: judge_version changes with the prompt bytes, the model id and the schema version and with nothing else; find_input_sha256 changes with owner, query, card order, card id and card text"
      - "add server/tests/agent/test_judges_db.py [db]: record twice → one row, second returns False; UPDATE and a plain DELETE refused by the trigger; recorded() after record; two owners with the same input hash and judge → two rows, each owner's recorded() and ReplayProvider see only their own, forget_pack/forget_overlay for owner A leave B's rows; ReplayProvider hit makes no CLI call, miss raises replay_miss; expire deletes only judge.find rows past 30 days; forget_pack deletes rows citing the pack and no other; forget_overlay"
  - id: FR-AGENT-21
    text: >-
      The `judge.find` job (ADR-0039 B6, B7b). `reader.agent.lane` declares the job kind `judge.find` (max attempts 1,
      keyed by the request id, args exactly `{"request_id", "input_sha256"}`), consumed only on the worker-judge lane
      (SRV-EVENTS). The handler: (1) reads the `judge_requests` row by request id (owner_id, line, run_id,
      run_cap_usd, lesson_id, daily_budget_usd, created_at, deadline, query, cards, pack_ids); no row → done, no call.
      The provider handle is resolved from `users` by the row's owner_id, as the tutor job does, never read from the
      row, so a forged row cannot name another user's provider. The rendered input's estimated tokens (FR-AGENT-9's
      estimator) over `bounds.judge_find_input_tokens_max` → delete the row, raise `judge_input_too_large`, no call.
      (2) now ≥ deadline → delete the row, no reserve, no call. (3) the row's recomputed `find_input_sha256` differs
      from the arg → delete the row, log `judge_input_mismatch`, no call. (4) the kill window
      `judge_kill_factor` × (deadline − created_at) exceeds `lane_token_ttl_s` − `lane_ttl_margin_s` → delete the row,
      raise `judge_window_too_long`, no call (keeps lane TTL ≥ kill deadline when the timeout is retuned).
      (5) a recorded output for (owner, input hash, current judge) → no call. (6) otherwise exactly one `Provider.run` with
      task `judge.find`, the row's line, run_id, run cap and daily budget, `thinking_off`, `abort_on_retry`, and
      `deadline_s` = created_at + the kill window − now (≤ 0 → no call), today's per-call path (reserve, issue, one CLI
      with a fresh HOME, one call, revoke, settle), no pre-spawned process. (7) on a parsed output (FR-AGENT-22): one
      transaction takes `PackGuard.lock_active(pack_ids)`; if false (a pack purged meanwhile) it writes nothing;
      else `judges.record(...)` and, only when it inserted, `JudgeInputsSink.copy(...)`; a late output (after the
      deadline) is written the same way. (8) `pg_notify('judge_done', <request id>)` after commit, payload the id only;
      the row is deleted in a `finally`. `lane_saturated`, budget refusals, `deadline_exceeded`, `upstream_retry`,
      `output_invalid` and every provider error end the job without retry and without an output row (the waiter
      degrades). Lane start: an `on_worker_start` hook calls `revoke_all()` on every worker service (each revokes only
      its own client's tokens); a failed hook is isolated (FR-EVENTS-1) and stale lane tokens then expire within
      `lane_token_ttl_s`. Nothing in this module logs or puts into job args, ledger rows or `judge_outputs` any query
      or card text.
    tests_planned:
      - "add server/tests/agent/test_lane_db.py [db] with a fake CLI, stub proxy, fake PackGuard and sink: no row → no call; deadline passed → row deleted, no reserve row; hash mismatch → no call; window over the TTL → judge_window_too_long, no call; recorded hit → no call, notify; one call → one reserve, one settle, one output row, one notify, row deleted; late output still recorded; two jobs with one input → one output row, one sink copy; guard false → nothing written; lane_saturated → settle $0, no output, row deleted; the kind's max_attempts 1 and args keys"
      - "add to test_lane_db.py: the StageCall has thinking_off, abort_on_retry, task judge.find, attempt 1 and deadline_s = created_at + 3 × (deadline − created_at) − now within 10 ms; deadline_s ≤ 0 → no call; output_invalid and a budget refusal → no output row, request row deleted; the handler raising after the call still deletes the row; the notify payload is exactly the request id; the handle comes from users by owner_id (a row for owner A with a different user's handle in a stray column still calls with A's handle); input over 3,000 estimated tokens → judge_input_too_large, no call; the lane's HttpProxyClient timeout is lane_issue_timeout_s"
      - "add a [unit] case in test_lane_db.py: the start hook calls revoke_all once and a failing proxy does not raise out of the hook"
  - id: FR-AGENT-22
    text: >-
      `judge.find` output (VEC-AGENT-5). The prompt labels the n input cards with ordinals 1..n in judge order (card
      ids never reach the model, which keeps the output short under `bounds.judge_find_max_output_tokens` = 512). The
      model's text is one JSON object, optionally inside a single ```json fence, with exactly the keys `keep` (card
      ordinals in relevance order, JSON integers, not booleans), optionally `drop` (ordinals) and `sufficiency` (a
      finite JSON number in [0, 1], not a boolean or a string). `keep` holds no duplicates and every ordinal is in
      1..n; `drop`, when present, must equal the complement of `keep` exactly; when absent it is that complement.
      `NaN`, `Infinity` and `-Infinity` tokens (which Python's json accepts) are refused. Anything else is
      `output_invalid` (no output row, the waiter degrades). The parser maps ordinals back to the input's card ids;
      that parsed form, never the model text, is what is recorded and returned.
    tests_planned:
      - "add server/tests/agent/test_judges.py [unit]: the parser over VEC-AGENT-5 (valid, fenced, drop absent, drop given, unknown key, ordinal 0, ordinal n+1, duplicate, keep/drop overlap, drop not the complement, ordinal as string or true or 1.0, sufficiency 1.2, true, \"0.5\", NaN, Infinity, -Infinity) and the mapping back to card ids"
  - id: FR-AGENT-23
    text: >-
      Loop fit for the compile loop rule (ADR-0005 amendment, ADR-0039 decision 22). `AgentProvider.loop_fits(owner_id,
      run_id, run_cap_usd, planned)` takes the planned calls of one loop, each (task, prompt characters upper bound,
      max output tokens, floor, custom system, searches_max) with the run's run id — the arguments of `reserve_for`
      after model resolution; searches_max is 0 for every compile call today (no compile task is in TOOL_STAGES) —
      and returns true iff, at the time of the check,
      spent(run) + the sum of their `reserve_for` reserves ≤ `run_cap_usd` (the compile run's cap,
      `budget.compile_cap_usd`), for each task spent(run, task) + that task's summed reserves ≤ its
      `budget_usd_per_lesson` (when set), and the user's month spend + the sum ≤ `budgets.monthly_usd` (when set). It
      writes nothing and takes no lock; each call still reserves under FR-AGENT-9, which stays the enforcing check. A
      `judge.find` call the fact-check route will make is a planned call of the loop (line `compile`).
