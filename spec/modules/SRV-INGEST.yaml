# ======================================================================================================================
# Revision 3 — ADR-0039 knowledge layers (V.kl-ingest-packs, phase 1: DRAFT after deep-reviewer rounds 1–3, nothing
# promoted).
# ======================================================================================================================
# Source: ADR-0039 (accepted 2026-11-26) B1 (spans replace chunks; cards cut at read time), B2 P1–P10 (base packs,
# overlays, manifest, the P2 locator and its migration order, GC and purge), B3 F1–F6 (facets), owner decision 20,
# the Rework table and the agent decisions 9 and 10; docs/plans/adr-0039-execution.md "V.kl-ingest-packs". The
# approved SRV-AGENT revision on V/kl-agent-judges fixes the seams this revision fills: `PackGuard.lock_active`
# (FR-AGENT-21 step 9), `judges.scope_run_id(owner_id, "overlay", version_id)` (FR-AGENT-19) and
# `judges.forget_pack` / `forget_overlay` (FR-AGENT-20). The status line above stays as it is until the revision is
# reviewed (deep-reviewer: packs, GC, purge and locks are complex areas per AGENTS.md) and promoted with its Red tests;
# every revised approved id changes only together with its tests (H2), listed under `tests_planned`.
#
# Conditional on `V.spike.retrieval-ablation` (B10; not run on 2026-11-26): the context-prefix overlay
# (FR-INGEST-47) and the L2-summary overlay (FR-INGEST-48) are drafted as conditional. Each is promoted only if the
# ablation keeps it under B10's rule (significant on its question type, exact McNemar p < 0.05, at least a net 6 of
# 30); a dropped one is deleted from this revision before promotion, and its overlay kind leaves the CHECK set. The
# ablation also sets `budgets.index_usd_per_pack` (its measured cost per pack + 20%, B7). Everything else here is
# unconditional (owner decision 23).
#
# Ownership (ADR-0039 B11). SRV-INGEST: locator span ids, quote hash, base packs, overlays (profile, tags, the overlay
# registry of vectors, prefixes, summaries), the manifest and its views, GC and purge, per-pack advisory locks and the
# production `PackGuard`, the facets file, re-anchoring, the seq-to-locator map, the citation migration command and
# the read-time resolver, the packs property test. Not here: the span vector rows and the `find` cascade (SRV-SEARCH),
# judge slots and recorded outputs (SRV-AGENT), concept evidence, pair link runs and findings (SRV-KB, stage 7).
#
# Paired changes (notes only; each is drafted in its own spec by its own task, none is edited here):
#   - SRV-SEARCH (V.kl-search-find): `search_chunks` becomes the span-level vector overlay, rows keyed (owner_id,
#     overlay_id, pack_id, locator) with the embedding model and `params_sha256` folded into the overlay version
#     (FR-INGEST-36); the embed job (FR-SEARCH-5) builds one vector overlay per (pack, model, params) and seals it
#     through `reader.ingest.overlays.seal`; candidate queries read only rows of overlays in the owner's head
#     manifest entry (`reader.ingest.manifest.active_view`), which replaces "the current key of the frozen ingest"
#     (FR-SEARCH-7, -9) and the `deleted_at` join (FR-SEARCH-20: a deleted material is absent from the head entry,
#     FR-INGEST-39); INV-SEARCH-2 is restated as "every result's span id is a sealed locator of an active pack and its
#     card text is that span's text, cut at read time"; `search.forget_overlay(conn, owner_id, overlay_id)` deletes
#     its rows for GC and purge (FR-INGEST-44, -45; SRV-SEARCH defines it), and `search.forget_legacy(conn,
#     owner_id, ingest_id)` deletes the legacy `search_chunks` and `search_embeds` rows of an ingest (GC and purge
#     call it); the embed job seals the vector overlay and, in the same transaction, calls
#     `reader.ingest.manifest.request_activation(conn, owner_id, pack_id, {"vectors": <id>})` and then
#     `try_activate(conn, owner_id, pack_id)`, while activation itself stays here (FR-INGEST-39; the import has
#     already requested the profile). A pack in the head entry is always buildable: its overlays are never collected,
#     and `ensure` keeps the head's overlay when a rebuild meets `overlay_collected` (FR-INGEST-35). SRV-SEARCH has a single read path through vector overlays: legacy chunk rows
#     are never an overlay, so every material, the migrated r2 packs included, is dark in search for one span-level
#     embed (FR-INGEST-40; 26.8 min measured for the pilot, spikes/retrieval-ablation RESULT.md, which merges into
#     the integration branch before this revision is promoted). `policy_version` hashes the facets file.
#   - SRV-LESSON: the citation `span_ref` pattern (cell.schema.json, VEC-LESSON-3 mutations) accepts both
#     `<sha>:<seq>` (published revisions, never rewritten) and the locator form of FR-INGEST-33, and a citation gains
#     an optional `quote_sha256` (64 hex, required with a locator); INV-LESSON-6 is unchanged and retested: the
#     resolver (FR-INGEST-42) never writes a revision; a new append-only `revision_packs(revision_id, owner_id,
#     pack_id)` table is written in the same transaction as each new revision, from the pack ids its citations
#     resolve to, so GC can see what published revisions cite (FR-INGEST-44).
#   - SRV-PIPELINE: FR-PIPELINE-7 expands an alias to the locator span id plus `quote_sha256` of the span in the
#     material's active base pack, not `<sha>:<seq>`; FR-PIPELINE-3's `input_sha256` then misses once for every step
#     of every lesson after the migration, so the next compile of each lesson pays in full (P2 (6), stated to the owner).
#   - SRV-TUTOR: FR-TUTOR-5 loads candidate spans by locator through `reader.ingest.spanref.resolve`
#     (`tutor/store.spans_by_ids` reads both forms until FR-INGEST-41 has run); FR-TUTOR-8's rendered citation
#     `{span, page, material_title}` gains `quote_sha256`; SRV-TUTOR declares its rewriter for FR-INGEST-41
#     (`tutor_questions.answer` citations) as data in `reader.tutor.citations.REWRITERS`.
#   - SRV-FRESH: FR-FRESH-3's `scan_inputs_sha256` takes the pack id and the sample's locator span ids (FR-FRESH-2's
#     sample is drawn from the active pack in reading order); FR-FRESH-10's "its ingest is not the material's current
#     ingest" becomes "its pack is not the material's active base pack"; `claims[].span` holds a locator for new
#     reports; FR-FRESH-10 rows are never updated, so the pilot gets one new scan per lesson at its measured cost
#     (P2 (6)); FR-FRESH-8's prompt and VEC-FRESH-7's plans keep their aliases and change only in the span ids.
#   - WEB-NOTEBOOK: FR-NOTEBOOK-2 groups span citations by the material sha256 parsed with FR-INGEST-33's parser (the
#     64-hex field), for both forms; splitting on the last `:` would make each page of a locator its own material.
#     A citation the resolver reports `inactive`, `orphaned` or `removed` renders "<title>, p. <page> (source removed)"
#     or "(source changed)" as plain text (INV-NOTEBOOK-2's canary extends to the state label).
#   - SRV-AGENT: `PackGuard.lock_active(conn, pack_ids)` gains `owner_id` (`lock_active(conn, owner_id, pack_ids)`):
#     pack ids are not owner-unique (two owners of the same book share a pack id, FR-INGEST-35), and "active" is a
#     property of one owner's manifest; the lane passes the request's owner_id. FR-INGEST-45 (purge) and -46 are
#     promoted only together with that SRV-AGENT change and its tests (H2). If the ablation keeps L2 summaries,
#     a slot `ingest.summary` (line `index`, worker, `haiku`, cap `budgets.index_usd_per_pack`) joins JUDGE_SLOTS.
#   - SRV-EVENTS: KIND_MODULES gains the kinds of `reader.ingest.jobs.KINDS` added here, each with its key as
#     stated in its requirement (`ingest.seqmap`, `ingest.reanchor`, `ingest.retag`, `ingest.gc`,
#     `ingest.gc_pack`, `ingest.gc_overlay`, `ingest.purge`, and conditionally `ingest.prefix`, `ingest.summary`);
#     the periodic entry enqueues `ingest.gc` {slot} once a day (FR-INGEST-44).
#   - SRV-CONFIG: optional `ingest.gc.keep_entries` (integer ≥ 1) and `ingest.gc.age_floor_days` (integer ≥ 1), file
#     settings with the defaults of `proposed_bounds`.
#   - SRV-OBS: build spans `ingest.pack`, `ingest.overlay`, `ingest.manifest`, `ingest.gc`, `ingest.purge` with ids,
#     counts and hashes only (INV-OBS-1/2); their attributes join VEC-OBS-1's allow-list.
#   - SRV-KB (stage 7): concept evidence and pair link runs are overlay kinds added there; GC and purge call its
#     `forget_*` the same way; "not cited by a finding" becomes live with its findings table.
#   - **Every reader of the ingest tables** (P5; INV-INGEST-16). Today these modules join `ingests` by
#     `material_id` (one row per material under the frozen version) or read `material_spans` / `material_outline`
#     directly; with two packs per material each would read both or pick one arbitrarily. Each moves to
#     `reader.ingest.manifest.active_view` and the read helpers of `reader.ingest.packs` (`active_pack(conn, owner_id,
#     material_sha256)`, `pack_spans`, `pack_outline`, `pack_of_ingest`), in a paired change of its own spec:
#     SRV-PIPELINE FR-PIPELINE-2 (`pipeline/source.py`), SRV-PLAN (`plan/store.py`), SRV-OBS (`obs/summary.py`,
#     `obs/runs.py`), SRV-FRESH (`freshness/store.py`, `freshness/live.py`), SRV-SEARCH (`search/store.py`,
#     `search/jobs.py`), SRV-TUTOR (`tutor/store.py`).
#     **Sequencing:** no r3 import of any material (FR-INGEST-40 step 2) runs before all of these paired readers are
#     merged into the integration branch; until then a material holds exactly one ingest, so today's joins stay
#     correct. INV-INGEST-16's source scan is the gate.
#   - **Foreign keys onto `ingests`:** `freshness_reports.ingest_id` (SRV-FRESH) and `study_plans.ingest_id`
#     (SRV-PLAN) reference `ingests (id) ON DELETE RESTRICT`. GC and purge therefore never delete an `ingests` row: it
#     stays as the pack's tombstone (FR-INGEST-44, -45), so those rows stay valid. SRV-FRESH and SRV-PLAN each note
#     that their `ingest_id` may name a collected or purged pack whose spans are gone.
#   - SRV-OBS and SRV-EVENTS: purge also deletes `judge_inputs` rows (SRV-OBS seam `JudgeInputsForget.forget_pack`)
#     and pending `judge_requests` rows (SRV-EVENTS seam `JudgeRequestsForget.forget_pack`) whose cards cite the pack.
#     Until the SRV-AGENT change above lands, the production guard stays `AlwaysActive`.

proposed_bounds:
  gc_keep_entries: 20          # initial value (ADR-0039 P6 "last N manifest entries"); `ingest.gc.keep_entries`
  gc_age_floor_days: 30        # initial value (P6 "age floor"); equals judge.find output retention (B7), so a GC'd
                               # pack has no live judge output that cites it
  manifest_cas_retries: 3      # structural: an append that loses the compare-and-swap re-reads the head and retries
  active_packs_warn: 200       # ADR-0039 revisit_when: more than 200 active packs in one manifest is logged
  locator_path_bytes_max: 1024 # structural, non-PDF path field after percent-encoding
  prefix_batch_spans: 25       # ADR-0039 B7 initial value (conditional, FR-INGEST-47)
  pack_lock_namespace: "RKPK"  # advisory-lock namespace int, as SRV-LESSON's "RCPO" (four ASCII bytes as int4)

proposed_tables:
  base_packs: { owner_id: true, columns: "FR-INGEST-35: owner_id → users.id, pack_id text CHECK 64 hex, material_sha256, ingest_id → ingests.id, parse_config jsonb, state CHECK in (building, sealed), created_at, sealed_at null, collected_at null, purged_at null; PRIMARY KEY (owner_id, pack_id). The row and its `ingests` row are tombstones: never deleted (FR-INGEST-44, -45)" }
  overlays: { owner_id: true, columns: "FR-INGEST-36: owner_id, overlay_id text CHECK 64 hex, pack_id, kind CHECK in (profile, tags, vectors, prefixes, summaries), builder_version text, inputs jsonb (ids and hashes only), state CHECK in (building, sealed), created_at, sealed_at null, collected_at null (set by GC, or by purge with its pack); PRIMARY KEY (owner_id, overlay_id); the row stays as a tombstone when GC or purge deletes the overlay's rows, and its id is never built again (FR-INGEST-35)" }
  pack_profiles: { owner_id: true, columns: "FR-INGEST-36: owner_id, overlay_id, role null, reliability null, as_of date null, license, language, set_by CHECK in (rule, owner)" }
  span_tags: { owner_id: true, columns: "FR-INGEST-37: owner_id, overlay_id, pack_id, locator text, facet, value, by CHECK in (rule, model, owner), confidence real, tagger_version; PRIMARY KEY (owner_id, overlay_id, locator, facet, value)" }
  manifest_entries: { owner_id: true, columns: "FR-INGEST-38: owner_id, seq bigint ≥ 1, parent_seq bigint ≥ 0, entry jsonb, brain_version text CHECK 64 hex, reason text, created_at; PRIMARY KEY (owner_id, seq); UNIQUE (owner_id, parent_seq)" }
  seq_maps: { owner_id: true, columns: "FR-INGEST-40: owner_id, from_ingest_id → ingests.id ON DELETE RESTRICT, to_pack_id, state CHECK in (accepted, refused), reason null, span_count, created_at; PRIMARY KEY (owner_id, from_ingest_id, to_pack_id); (owner_id, to_pack_id) → base_packs; at most one `accepted` row per from_ingest_id (partial unique index)" }
  span_seq_map: { owner_id: true, columns: "FR-INGEST-40: owner_id, from_ingest_id, to_pack_id, seq, locator, quote_sha256; PRIMARY KEY (owner_id, from_ingest_id, seq); (owner_id, from_ingest_id, to_pack_id) → seq_maps; never collected while its legacy revisions exist (FR-INGEST-44)" }
  anchor_maps: { owner_id: true, columns: "FR-INGEST-43: owner_id, from_pack_id, to_pack_id, from_locator, quote_sha256, to_locator null, state CHECK in (mapped, orphaned); PRIMARY KEY (owner_id, from_pack_id, to_pack_id, from_locator)" }
  anchor_runs: { owner_id: true, columns: "FR-INGEST-43: owner_id, from_pack_id, to_pack_id, mapped int, orphaned int, finished_at; PRIMARY KEY (owner_id, from_pack_id, to_pack_id); written in the same transaction as the run's anchor_maps rows, so its presence proves the run completed" }
  pending_activations: { owner_id: true, columns: "FR-INGEST-39: owner_id, pack_id, material_sha256, overlays jsonb (kind → overlay_id, the desired overlays), reason text null (the last waiting reason), updated_at; PRIMARY KEY (owner_id, pack_id); deleted when the activation appends or finds no_change" }
  citation_migrations: { owner_id: true, columns: "FR-INGEST-41: owner_id, target text, rows int, finished_at" }
  span_prefixes: { owner_id: true, columns: "FR-INGEST-47 (conditional): owner_id, overlay_id, locator, text" }
  outline_summaries: { owner_id: true, columns: "FR-INGEST-48 (conditional): owner_id, overlay_id, outline_path, text" }

proposed_requirements:
  - id: FR-INGEST-33
    text: >-
      **Locator span ids** (ADR-0039 P2, owner decision 20; ADR-0008 Decision 3). `reader.ingest.locator` (stdlib only,
      so the converter, the worker and the tests share it) defines the span id of every span of a base pack:
      - **Canonical page text** of page p: the texts of the pack's spans whose `page` is p, in `seq` order (reading
        order, FR-INGEST-8), **non-empty texts only**, joined by one `\n`. Texts are the stored normalised text of
        FR-INGEST-6/-7: decoded LaTeX for a formula, the Markdown export for a table, the caption for a figure, the
        marker-prefixed text for a list item, the reconstructed code text for code. Offsets count Unicode code points
        of that text, which is NFC by INV-INGEST-1 (Python `len` of `str`, Postgres `length` and `substr` on a UTF-8
        database; never UTF-16 units or bytes).
      - **Non-empty span:** `spn:<material_sha256>:p<page>:<start>-<end>`, where `start` is the offset of its first
        code point and `end` = `start` + its length, so `page_text[start:end]` equals its text.
      - **Empty span** (a figure without a caption, an undecoded formula with text ""): a zero-length range at the
        offset where the next non-empty span of the page starts, or at the length of the page text when none follows,
        plus `#<n>`, its 0-based ordinal among the page's empty spans at that offset in reading order:
        `spn:<sha>:p<page>:<o>-<o>#<n>`. Empty spans add no separator, so a caption-less figure never shifts the
        offsets of the text around it (the reading of P2's "ordinal among the empty spans at that offset", decided
        by the agent; with every span joined, two empty spans could never share an offset and the ordinal would be
        vacuous). The pilot has 359 empty spans (deep-reviewer round 1 count over the r2 span dump, 2026-11-26), so
        the rule is exercised on real data.
      - **Non-PDF material** (no converter yet; the form, encoder and parser exist now):
        `spn:<material_sha256>:<path>:L<a>-<b>`, 1-based inclusive line range a ≤ b, `<path>` the NFC relative path
        with `%` encoded as `%25` first and then `:` as `%3A`, at most `bounds.locator_path_bytes_max` bytes encoded.
        A raw `:` therefore never occurs inside a field, so a split on `:` gives exactly four fields and a reader
        that splits on the last `:` still finds the range.
      - **Parser:** `parse(id) -> Locator` accepts exactly
        `^spn:[0-9a-f]{64}:p[1-9][0-9]{0,4}:(0|[1-9][0-9]{0,9})-(0|[1-9][0-9]{0,9})(#(0|[1-9][0-9]{0,5}))?$` with
        start ≤ end and `#n` present iff start = end, or the non-PDF form with `L` range, a path that decodes to
        valid UTF-8 with no control character and no `/`-leading or `..` segment; anything else is `locator_invalid`.
        `format(parse(x)) == x` for every accepted x.
      - **Outline ids** are `sec:<material_sha256>:<path>`, `<path>` the 1-based sibling ordinals from the root joined
        by `/` (`sec:<sha>:3/2/1`), derived from `material_outline` (level and order); titles never enter an id. An
        entry's parent is the nearest preceding entry with a lower level; a skipped level (a level-3 entry directly
        under a level-1 entry) makes it a child of that entry with no synthetic node between, and an entry with no
        lower-level predecessor is a root (sibling ordinal among roots).
      - The card budget is policy and never part of an id; spans are never split at ingest (B1, decision 9).
      - The legacy id `<material_sha256>:<seq>` (FR-INGEST-17) is never issued again; it is accepted only as input of
        the resolver (FR-INGEST-42) and of the citation migration (FR-INGEST-41).
    tests_planned:
      - "add server/tests/ingest/test_locator_unit.py [unit]: VEC-INGEST-8's cases (pages with empty spans before, between and after text, two figures at one offset → #0 and #1, a page of only figures, combining marks already composed, astral code points counted as one, a 3-line code span, a non-PDF path with `:` and `%` and a literal `%3A`; outline paths with a skipped level, a leading level-2 entry and two roots); page_text[start:end] equals every span's text; parse/format round trip; each malformed id refused (`p0`, leading zeros, start > end, `#` on a non-empty range, missing `#` on an empty one, 63-hex sha, raw `:` in a path, `..` segment)"
      - "add to test_locator_unit.py [property]: for generated pages (random texts incl. empty and NFC-stable astral text) every non-empty span's slice equals its text, locators are unique within a pack, and an empty span's offset equals the next non-empty span's start"
  - id: FR-INGEST-34
    text: >-
      **Quote hash.** Every span of a base pack stores `quote_sha256` = sha256 of the UTF-8 bytes of its stored
      normalised text (the empty text hashes to `e3b0c442…b855`). Every citation that names a locator carries the
      quote hash of the span it cited (SRV-LESSON, SRV-TUTOR, SRV-FRESH paired). The **equal-hash ordinal** of a span
      is its 0-based rank, in reading order, among the spans of the same page with the same `quote_sha256`; it is
      derived, never stored, and used only by re-anchoring (FR-INGEST-43). [unit, db]
    tests_planned:
      - "test_locator_unit.py [unit]: the hash of a known text, of the empty text, and equal-hash ordinals on a page with a repeated heading and three empty figures"
      - "test_packs_db.py [db]: every material_spans row of a sealed pack has quote_sha256 equal to sha256(text) (SQL `encode(sha256(convert_to(text,'UTF8')),'hex')`)"
  - id: FR-INGEST-35
    text: >-
      **Base packs** (ADR-0039 B2, P1). The **parse config** of a conversion is
      `{converter_version, docling: "2.151.1", pipeline: FR-INGEST-5's options, batch_pages: 50, profile_sha256: sha256
      of converter.sb}`; every field is a constant of `CONVERTER_VERSION`, so a change of any of them raises the `r`
      number (FR-INGEST-10 revised). `reader.ingest.PARSE_CONFIGS` pins them as data per version, with literal
      values, never computed at run time: `docling-2.151.1+r2` (the legacy imports, FR-INGEST-40) with the
      `profile_sha256` of converter.sb as committed at the r2 profile edit (V/ingest-profile-v2, recorded as a
      literal at Green), and `docling-2.151.1+r3`. `pack_id` = sha256 of the canonical JSON `{"material_sha256": s, "parse_config":
      c}` (FR-INGEST-10's canonical form). It carries no owner: two owners of the same bytes compute the same pack id,
      and each owner's rows are their own (`base_packs` primary key (owner_id, pack_id); INV-SEARCH-1, P10).
      - A pack is one `ingests` row plus its `material_spans` and `material_outline` rows; the `base_packs` row
        records its pack id, parse config and state. The import (FR-INGEST-13 revised) inserts the `base_packs` row
        `building`, writes the rows, checks the counts against the manifest and the locators against FR-INGEST-33,
        and sets `sealed` with `sealed_at` in the same run transaction.
      - **Immutability** (P1), enforced by triggers of the migration, each refusal a database error: an UPDATE of a
        `base_packs` row other than `building → sealed` and other than setting `collected_at` or `purged_at` once
        each; any DELETE of `base_packs` or `ingests` rows (they are the pack's tombstone, kept for the foreign keys
        of `freshness_reports` and `study_plans` and for the resolver's `removed` state); any INSERT, UPDATE or DELETE
        of `material_spans` or `material_outline` rows whose pack is `sealed`, except DELETE inside GC or purge, which
        set the transaction-local `reader.pack_delete = on` (the pattern of SRV-AGENT's `reader.judge_delete`).
      - A pack with `collected_at` or `purged_at` set is **gone**: its spans, outline, overlays and artifact are
        deleted, and no manifest entry can name it while it is gone (`pack_collected`, `pack_purged`).
      - **A gone pack is never rebuilt under its id.** A collected or purged pack returns only with the next converter
        revision (a new `r`, hence a new parse config and a new pack id): its import key [material_sha256,
        converter_version] has succeeded, so it never runs again, and FR-INGEST-12 reports it as `collected` or
        `purged` (`reader-ingest` exits 2 with that code and converts nothing). One pack per (owner, material,
        converter version), ever; no generations.
      - **A gone overlay is never rebuilt under its id.** An overlay id is content-addressed (FR-INGEST-36);
        `reader.ingest.overlays.begin(conn, owner_id, overlay_id, …)` refuses an id whose row is collected or purged
        with `overlay_collected`, writing nothing. The same inputs can therefore be built again only after the
        builder's `builder_version` is raised, which changes the id. A pack in the head entry is never collected
        (FR-INGEST-44) and its head overlays are never collected either, so the active view is always readable; a
        builder (SRV-SEARCH's `ensure`, `ingest.retag`) that meets `overlay_collected` for a head pack logs it and
        keeps the head's current overlay, so nothing goes dark.
      - **The import key carries no owner** ([material_sha256, converter_version]): v1 has one owner who imports
        (FR-INGEST-15, -18); a second owner's import of the same bytes is deferred (defers).
      - A `building` pack is never read by a view and never enters a manifest entry (FR-INGEST-38).
      - The converter is no longer frozen (P2: the `version_frozen` rule of FR-INGEST-11, -12, -13, -17 and INV-INGEST-2
        is lifted): a material may hold one pack per converter version; at most one of them is active (FR-INGEST-38).
    tests_planned:
      - "add server/tests/ingest/test_packs_db.py [db]: pack_id is sha256 of the canonical {material_sha256, parse_config} (fixed vector) and equal for two owners of the same bytes, each with their own rows; import ends sealed; each trigger refusal (UPDATE of a sealed row, a span INSERT into a sealed pack, a span DELETE without reader.pack_delete, any DELETE of base_packs or ingests even with it, a second collected_at or purged_at); building packs absent from active_view; FR-INGEST-12 reports a collected pack's key as `collected` and a purged one's as `purged`, and a receive and import of that same (material, version) appends no row; an import under the next r creates a new pack id; overlays.begin of a collected overlay id → overlay_collected and nothing written, while the same inputs with a raised builder_version build a new id"
      - "add to test_locator_unit.py [unit]: PARSE_CONFIGS holds literal r2 and r3 entries; r3's profile_sha256 equals the sha256 of reader/ingest/host/converter.sb; r2's equals its pinned literal"
  - id: FR-INGEST-36
    text: >-
      **Overlays** (ADR-0039 B2). An overlay is a versioned set of derived rows keyed by one base pack id. Kinds in
      this revision: `profile` (L0), `tags` (F2, FR-INGEST-37), `vectors` (rows in SRV-SEARCH's table), and,
      conditional on the ablation, `prefixes` (FR-INGEST-47) and `summaries` (FR-INGEST-48). SRV-KB adds concept
      evidence and pair link runs.
      - `overlay_id` = sha256 of the canonical JSON `{kind, pack_id, inputs, builder_version}`, where `inputs` holds
        only ids, versions and hashes: for `profile` the profile values; for `tags` the facets file's sha256 and the
        tagger version; for `vectors` the embedding model id and SRV-SEARCH's params hash (and the prefix overlay id
        when prefixes are kept); for `prefixes` the prompt file sha256 and the resolved model id; for `summaries` the
        same. A changed input, tagger, model, prompt or vocabulary is a new overlay, never a new pack (P2), so
        citations survive it.
      - States `building → sealed`, as for packs; only `reader.ingest.overlays.seal(conn, owner_id, overlay_id)` makes
        the flip, after the builder's own completeness check; rows of a sealed overlay are immutable by trigger, and a
        build writes only rows carrying its own overlay id (P1).
      - **Profile overlay** (L0, P3): `license` and `language` from reader.yaml `materials[]` or the upload row (rule),
        `role`, `reliability` and `as_of` null until the owner sets them (G1; owner route in a later task, WEB-MANAGE);
        a change is a new profile overlay plus one manifest entry, and nothing is re-indexed. A pack that replaces
        another pack of the same material (FR-INGEST-39) gets a profile overlay carrying the owner-set values
        (`set_by: owner`) of the replaced pack's active profile overlay, so G1 decisions survive a converter upgrade.
      - The import builds the profile overlay, and the tags overlay when the facets file enables at least one
        span-level facet (FR-INGEST-37; none today), seals them in its own run transaction (rule work, 0 model
        calls) and calls `request_activation(…, {profile, tags?})` there; the embed job builds the vector overlay,
        requests `{vectors}` and calls `try_activate` (SRV-SEARCH paired; FR-INGEST-39).
      - **Rebuilt tags overlay:** the job `ingest.retag` {owner_id, pack_id, overlay_id}, key [owner_id, pack_id,
        overlay_id], enqueued at worker start for every active pack whose active tags overlay's inputs (facets sha256,
        tagger version) differ from the current ones (as SRV-SEARCH's `ensure` does for vectors), builds and seals the
        new tags overlay, and in the same transaction calls `request_activation(…, {tags: <new id>})` and
        `try_activate` (FR-INGEST-39), so only `tags` is switched and the other kinds keep the head's ids.
    tests_planned:
      - "add server/tests/ingest/test_overlays_db.py [db]: overlay_id fixed vector per kind; a changed tagger version gives a new tags overlay and the same pack id; seal only from building; a row insert into a sealed overlay refused; a build cannot write a row with another overlay's id (CHECK via the builder API); profile change → new overlay and one manifest entry, no vector overlay rebuilt; a replacing pack's profile carries the owner-set role, reliability and as_of; retag with a test facets file enabling `form` builds a tags overlay and activates it with only `tags` switched; with the committed file no tags overlay is built"
  - id: FR-INGEST-37
    text: >-
      **Facets file** (ADR-0039 B3, F1–F6). `reader/ingest/facets.yaml` declares the facets with their level, closed
      value set (or `type: date`, or `tree: sectors` for `topic`), `by`, `enabled` and `consumer`, exactly B3's seven:
      role, reliability (A–F), credibility (1–6), as_of, license (personal-use, shareable), form, topic.
      `reader/ingest/facets.schema.json` (JSON Schema 2020-12) closes it: `additionalProperties: false` at every
      level, the facet names an enum of those seven, `level` in {source, span, concept, finding}, values unique
      strings, `enabled` a required boolean, and for `form` a required `rule` mapping whose keys are exactly
      INV-INGEST-1's span kinds. **Consumer (F6):** `consumer` is a requirement id (`FR-`, `INV-` or `NFR-` of some
      spec) or a view name from `reader.ingest.manifest.VIEWS`; an `enabled: true` facet must have a consumer that
      resolves, and a facet whose consumer does not resolve yet is `enabled: false` with the consumer it waits for.
      A disabled facet's values are still validated, but no tag of it is written and no query path may filter on
      it. The loader validates the file against the schema at import (a failure is a permanent error of the import,
      never a silent default).
      **Enabled at this revision:** `license` (consumer: view `pack_profile`, read by the entitlement and
      personal-use checks). `role`, `reliability`, `as_of`, `credibility` and `topic` are disabled until SRV-SEARCH,
      SRV-PIPELINE or SRV-KB name a requirement that consumes them; their paired change flips `enabled`. **`form` is
      disabled and no form tags are written** until SRV-SEARCH has a card-shape requirement that reads it: the
      ablation dropped the `form` filter, so the exact route has no consumer for it. Its rule below is specified and
      unit-tested so that enabling it is a data change.
      **`form` by rule** (F5, B3 note): heading, text and list_item → `prose`; code → `code`, or `test_vector` when the
      declared test-vector rule matches; formula → `formula`; table → `table`; figure → `figure`. The test-vector rule
      (initial value, data in the facets file): a code span with at least 2 lines each matching
      `^\s*([A-Za-z][\w .-]{0,40}\s*[:=]\s*)?((0x)?[0-9A-Fa-f]{32,}|[xt](prv|pub)[1-9A-HJ-NP-Za-km-z]{100,})\s*$`
      (hex, or a base58 extended key as BIP-32's test vectors print them). **Before promotion** the rule is measured
      on the pilot's r2 span dump on the owner's Mac ($0, no model call): the number of code spans it marks and a
      hand check of every marked span's page, recorded as counts and pages only in the RESULT of that measurement.
      Tags record `by: rule`, confidence 1.0 and
      the tagger version. A tag whose facet or value is not in the file is refused (`tag_value_unknown`); free-form
      tags do not exist (F4). Only `topic` grows, through SRV-KB. The facets file's sha256 is an input of the tags
      overlay (FR-INGEST-36) and of `policy_version` (SRV-SEARCH, SRV-OBS paired).
    tests_planned:
      - "add server/tests/ingest/test_facets_unit.py [unit]: the committed file validates; VEC-INGEST-9's invalid files are each refused (extra facet, extra key, duplicate value, missing consumer, a `form` rule missing a kind or naming an unknown kind, a free-form value list on a closed facet, `enabled` missing, an enabled facet with no consumer); form of every kind; test-vector rule on synthetic hex and base58 xprv/xpub vectors (no book text) and on code that is not a vector"
      - "add to test_facets_unit.py [unit]: every consumer resolves — a requirement id is declared in spec/modules/*.yaml or a view name is in manifest.VIEWS; every enabled facet's consumer resolves; `form` is disabled in the committed file"
      - "add to test_packs_db.py [db]: an import with the committed facets file writes no span_tags row"
      - "add to test_overlays_db.py [db]: a tag write with an unknown facet or value → tag_value_unknown, nothing written"
  - id: FR-INGEST-38
    text: >-
      **Manifest** (ADR-0039 B2, P4, P5, P10). One manifest per owner: `manifest_entries` rows (owner_id, seq,
      parent_seq, entry, brain_version, reason, created_at), append-only (UPDATE, DELETE and TRUNCATE refused by
      trigger). `entry` = `{"packs": [{"pack_id", "overlays": {kind: overlay_id}}] sorted by pack_id,
      "registry_view": null}` (`registry_view` is SRV-KB's version, null until it exists). `brain_version` = sha256 of
      the canonical JSON of `entry`, so two entries with the same active set have the same brain version.
      - **Compare-and-swap on the parent:** `reader.ingest.manifest.append(conn, owner_id, parent_seq, entry, reason)`
        inserts `seq = parent_seq + 1`; `UNIQUE (owner_id, parent_seq)` makes a concurrent append with the same parent
        fail, which returns `manifest_conflict`; callers re-read the head and retry up to
        `bounds.manifest_cas_retries` times. The first entry has parent 0.
      - **Locks before the insert:** `append` first takes `lock_packs` (FR-INGEST-46) on every pack whose element in
        the entry differs from the parent entry's (a pack added, or a pack kept with any overlay id changed), then
        re-checks those packs **and every overlay the entry names for them** (sealed, this owner's, of that pack, not
        collected or purged), then inserts. GC (`ingest.gc_pack`, `ingest.gc_overlay`) and purge delete a pack or an
        overlay only under its pack's lock after reading the head, so an append either commits before GC's check (and
        GC then sees the pack or overlay in the last N entries) or waits and is refused `pack_collected` /
        `pack_purged`. Removing a pack takes no lock (the remover never needs the rows). Because the locks are taken before the insert, an appender never holds the
        `(owner_id, parent_seq)` key while waiting for a pack lock.
      - **Lock order, global** (stated with FR-INGEST-31's): job key (SRV-EVENTS, for jobs) → FR-INGEST-31's course
        locks → lesson run locks → the owner's "RCPO" lock → pack locks (ascending, one call) → manifest insert and
        row writes. GC, purge, activation and the judge guard take no course, lesson or RCPO lock, so none of them
        can wait in the opposite order.
      - **Refusals** (nothing appended): a pack or overlay that is not `sealed` for this owner (`not_sealed`), a
        collected pack (`pack_collected`), a purged pack (`pack_purged`), an overlay whose `pack_id` is not its entry's pack (`overlay_mismatch`), two
        packs of one material (`material_twice`: the locator carries no pack id, so one active base pack per material,
        P2), and an entry equal to the head's (`no_change`).
      - **Views:** `active_view(conn, owner_id)` returns the head entry and its brain version; every read of spans,
        outline, tags, profiles and vectors by other modules goes through the active view's pack and overlay ids
        (P5). A material whose pack is absent from the head entry is invisible to them.
      - Adding, removing, restoring or rolling back a source, or switching an overlay, is exactly one entry (P4);
        more than `bounds.active_packs_warn` active packs logs `manifest active_packs=<n>` (ADR-0039 revisit_when).
    tests_planned:
      - "add server/tests/ingest/test_manifest_db.py [db]: brain_version fixed vector and equal for equal entries; append chain; two concurrent appends with one parent → one row and one manifest_conflict, the loser's retry succeeds; each refusal code with nothing appended (pack_collected and pack_purged included); UPDATE, DELETE and TRUNCATE refused; two owners' manifests independent; active_view hides a pack absent from the head entry; append takes pack locks exactly on the packs whose element differs from the parent's — an added pack and a kept pack with a changed overlay id are both locked, a kept unchanged pack and a removed pack are not (pg_locks while blocked)"
  - id: FR-INGEST-39
    text: >-
      **Activation, removal and restore** (P4, P9). **One contract, shared with SRV-SEARCH** (paired): activation is
      two functions, never a job.
      - `reader.ingest.manifest.request_activation(conn, owner_id, pack_id, overlays)` merges `overlays` (kind →
        overlay id, named **explicitly** by the caller) into the pack's `pending_activations` row, creating it if
        absent (a kind named again takes the new id; kinds not named keep the row's id). Overlays are **never chosen
        by `sealed_at`** or any recency order; the desired set is only what callers named.
      - `try_activate(conn, owner_id, pack_id)` attempts the append for that pack's pending row.
      - **Who calls what, inside its own transaction before it commits:**
        - the import (FR-INGEST-13), in its seal transaction: `request_activation(…, {profile: id, tags: id when a
          tags overlay was built})`; it does not call `try_activate` (no pack is activated without vectors when it
          replaces one that has them, and a new pack waits for its embed anyway);
        - SRV-SEARCH's embed job, when it seals a vector overlay: `request_activation(…, {vectors: id})`, then
          `try_activate`;
        - `ingest.seqmap` when it accepts a map, and `ingest.reanchor` when it writes its `anchor_runs` row:
          `try_activate`;
        - `ingest.retag` (FR-INGEST-36) and `ingest.summary` (conditional) when they seal:
          `request_activation(…, {<kind>: id})`, then `try_activate`; `ingest.prefix` (conditional) when it seals:
          `request_activation(…, {prefixes: id})` only, since the vectors built over the prefixes activate them
          (FR-INGEST-47);
        - restore (below), and a **worker-start sweep** that calls `try_activate` for every pending row, each in its
          own transaction, in (owner_id, pack_id) order.
      - **`try_activate`** first takes `lock_packs` on the pack and on the material's pack in the head entry (if any)
        in one call. With no pending row it does nothing. Otherwise it checks, in order; on the first failure it
        stores the reason on the row (`deleted`, FR-INGEST-38's refusal codes, `vectors_missing`, `seqmap_missing`,
        `anchors_missing`, `manifest_conflict`), logs `ingest activate_waiting <reason>`, appends nothing, keeps the
        row and returns the reason:
        - the material is not deleted (`deleted_at` null);
        - the pack and every desired overlay are `sealed`, this owner's, of this pack, and not collected or purged;
        - **no second dark window:** when the element this pack would replace in the head (the material's element,
          whether of this pack or another) names a `vectors` overlay, the new element must name a sealed `vectors`
          overlay too (`vectors_missing`); a pack replacing another therefore waits for its own embed;
        - the material has a legacy ingest (imported before this revision) **and this pack is not that ingest's own
          pack** → an `accepted` `seq_maps` row from that ingest to this pack exists (a `refused` one keeps the task
          blocked, FR-INGEST-40); the legacy pack itself needs no map (it is the map's source);
        - another pack of the material is in the head entry → an `anchor_runs` row (from that pack, to this one)
          exists; if not, it enqueues `ingest.reanchor` for the pair, whose end calls `try_activate` again.
        Then it builds the **entry**: the head's packs; this material's element (if any) is replaced by this pack's;
        each desired kind takes the desired id; kinds not desired keep the head's overlay id when the head's element
        is this same pack, and are absent otherwise. An entry equal to the head is `no_change`; otherwise it appends
        (FR-INGEST-38) with its CAS retries; a conflict left after the retries is the stored reason
        `manifest_conflict`, retried by the worker-start sweep or the next producer. On `no_change` or an append the
        pending row is deleted. Idempotency is `no_change` when the head already names the desired overlays.
      - FR-INGEST-31's **delete** appends one entry without the material's element, after FR-INGEST-31's locks;
        pending rows of the material stay.
      - FR-INGEST-31's **restore**, after FR-INGEST-31's locks:
        1. takes `lock_packs` once, in one call, on every pack with a pending row of the material plus the pack of
           the material's element in the last manifest entry that named the material (if any), ascending;
        2. calls `request_activation` for that last element's pack with the last element's overlay ids **merged
           under** existing desires: a kind already desired in the pending row keeps the desired id; the last
           element's id only fills kinds not desired;
        3. calls `try_activate` for **every** pending row of the material, in ascending converter-version order (from
           the pack's parse config, never `sealed_at`), so a newer pack whose preconditions hold ends active; before
           each, it runs re-anchoring **inline** when the material has another pack in the head and the pair's
           `anchor_runs` row is missing (FR-INGEST-43).
        A pack or overlay collected or purged meanwhile leaves that row waiting with its code; the material row is
        restored either way. A material never activated and with no pending row appends nothing.
      - **Rollback** to an earlier entry (`reader.ingest.manifest.rollback(conn, owner_id, to_seq)`) first takes
        `lock_packs` once, in one call, on every pack whose element differs between the head and the target entry
        (both sides), ascending; then runs re-anchoring inline for every material whose pack differs and whose
        `anchor_runs` row is missing (FR-INGEST-43); then appends the target entry's content as a new entry
        (`append`'s own lock call is then re-entrant, FR-INGEST-46).
      The course cascade of FR-INGEST-31 is unchanged (P9).
    tests_planned:
      - "add to test_manifest_db.py [db]: import (request_activation {profile}) → embed seal (request_activation {vectors}, try_activate) → one entry naming the pack with exactly that profile id and that vectors id; a retag switches only tags and keeps the head's vectors id; two sealed vector overlays where the older is named → the older is activated (no sealed_at choice); try_activate twice → one entry, the second no_change; a replacing pack with no sealed vectors → vectors_missing, nothing appended, the head unchanged; delete → one entry without it; restore → one entry with the same pack and overlays and the same brain_version as before the delete; restore with a pending row that already desires a newer vectors id keeps that id (merge under); restore of a never-activated material with no pending row appends nothing"
      - "add to test_manifest_db.py [db]: **a waiting activation runs through**: an r3 pack (import: profile requested) whose vectors seal before its seq map exists → reason seqmap_missing, nothing appended; the seq-map accept calls try_activate → anchors_missing and ingest.reanchor enqueued; the reanchor end calls try_activate → one entry naming the r3 pack with exactly its requested profile id and vectors id, pending row gone; the legacy pack's own vector overlay activates with no seq map"
      - "add to test_manifest_db.py [db]: **delete while waiting, then restore**: an r3 pack waiting on seqmap_missing; the material is deleted (one entry without it); the seq-map accept's try_activate stores reason deleted; restore takes all pack locks in one call (pg_locks), activates the legacy element from the last entry, re-anchors inline and activates the r3 pack in the same transaction: the head names the r3 pack with its requested overlays and no pending row is left"
