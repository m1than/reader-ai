      SRV-TUTOR's `tutor_questions.answer` citations; no findings table exists yet, so findings get locator ids when
      SRV-KB creates them) to the accepted map's locator, adding its `quote_sha256`. If any id has no accepted map
      (no map for its material, or a seq outside it), the transaction rolls back, nothing changes, and it exits 4
      `unmapped` with the count per material (never an id's text). Rows already in locator form are skipped, so a
      second run changes nothing; one `citation_migrations` row per target records the run. Published lesson
      revisions and freshness rows are not targets (steps 5 and 6).
      **Deviation from P2 (4)'s wording, for the owner:** P2 says "one Alembic migration". Migrations run at api
      start before the worker serves jobs (`reader.db.migrate`, `wait_for_heads`), and the map exists only after the
      re-conversion, which needs a running worker; an Alembic revision that refuses when the map is missing would
      therefore stop the stack before the map could ever be built. The command keeps the rule (one transaction,
      refuses to finish on any unmapped id) and runs when the map exists. **This item is not promoted until the owner
      has added an in-place amendment note to ADR-0039 P2 (4)** (ADR-0039 A2's exception) or chosen otherwise.
      Until the command has run, every reader accepts both id forms through FR-INGEST-42, so the stack and search
