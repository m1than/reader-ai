  - id: FR-INGEST-41
    text: >-
      **Migration step 4: mutable citations** (P2 (4)). `python -I -m reader.ingest.migrate_citations` (run by
      `reader-ingest --migrate-citations` after FR-INGEST-2's health check, as `--requeue` is) rewrites, in **one
