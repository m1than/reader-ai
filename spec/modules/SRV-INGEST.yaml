proposed_defers:
  remove:
    - "Re-ingesting a material under a new converter_version … (FR-INGEST-17): done by base packs, the seq map and re-anchoring (FR-INGEST-35, -40, -43)."
    - "Character offsets into the page text layer (ADR-0008 Decision 3): replaced by offsets into the canonical span text (FR-INGEST-33, ADR-0039 P2)."
    - "Deleting an imported material and its spans …: span, outline and overlay data are deleted by GC and purge (FR-INGEST-44, -45); material, ingests and base_packs rows stay."
  add:
    - "Owner editing of the profile overlay (role, reliability, as_of) at G1: a WEB-MANAGE route; until then they are null."
    - "Partition per pack (`DETACH PARTITION CONCURRENTLY`), only if GC deletion is measured to hurt (P6)."
    - "An owner in the import key: `ingest.import` is keyed [material_sha256, converter_version], correct while v1 has one owner who imports; a second importing owner (SRV-SHARE or multi-owner) adds the owner id to the key."
