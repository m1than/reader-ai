# SRV-INGEST — vertical-slice revision (slice: V.SRV-INGEST-min; docs/roadmap.md "Vertical slice first", step V2).
#
# What this revision covers: one declared PDF material (reader.yaml `materials[]`) becomes ordered source spans with
# stable public ids, plus an outline, in Postgres, owned by the owner, with its status visible through the api.
#
# Flow (ADR-0021 native decision; transport per ADR-0027, accepted by the owner in chat):
#   1. Host: `reader-ingest <material id>` takes a per-material lock, copies the PDF into a fresh work directory while
#      hashing it, checks the stack's health and the import status.
#   2. Host: it runs the converter from its own non-editable venv as a child under a deny-default macOS sandbox
#      profile: CPU only, no network, no Unix sockets, no mach services, reads only its runtime, the models and its
#      work directory, writes only its work directory, no secrets.
#      Docling 2.151.1, formula model on, code model off, code lines from the PDF text layer (ADR-0021 Decision 1).
#   3. Host: it validates the artifact (manifest, spans, outline) and streams it as a tar over stdin into
#      `docker exec -i <worker container> python -I -m reader.ingest.receive` (the image's default user is 10001).
#   4. Worker container: `receive` validates again, stores the artifact content-addressed on the blobs volume
#      (ADR-0007), and enqueues the job `ingest.import` (SRV-EVENTS).
#   5. Worker: the job writes the material, ingest, span and outline rows in its run transaction.
#   6. api: `GET /api/materials…` shows status, counts, outline and a page's spans with their public ids.
#
# Why not the loopback listener of ADR-0021 Decision 3: the worker sits only on internal networks (OPS-DEPLOY), so it
# cannot reach a host listener. ADR-0027 records the change. The owner accepted ADR-0027 and CLI-first ingestion in
# chat on 2026-11-21 (upload later); the owner sets its status line and adds ADR-0021's amendment note.
#
# Confinement evidence: `spikes/ingest-confine` (RESULT.md, converter.sb). The deny-default profile runs configuration D
# on CPU at 15.69–15.85 pages/min, against 15.85–16.57 unconfined on the same 20 pages, with identical output (6
# formulas, 11 tables). Every negative probe was denied. The dedicated-macOS-user fallback is not needed.
#
# Revision 2 (2026-11-23, owner request, ADR-0029 accepted by the owner with its amendment note): browser upload into
# an inbox on the blobs volume that no service in the stack parses; a host process `reader-ingest --watch` (started by
# `reader up`, OPS-CLI FR-CLI-23; no secrets) claims an upload by long-polling the worker over `docker exec`, fetches
# its bytes on the exec's stdout, checks sha256 and size against the claim, converts it under the profile with two
# edits (FR-INGEST-4), one converter run on the host at a time (`convert.lock`, FR-INGEST-1, FR-INGEST-22), and
# returns the artifact over the existing receive with the claim. Progress, cancel, retry and the converter's online
# state reach the UI through the `uploads` row and the existing jobs. Items FR-INGEST-18..24, INV-INGEST-8..10,
# VEC-INGEST-6..7, promoted with their Red tests (V/upload-impl).
# Cross-spec for revision 2, each in its own spec: SRV-AUTH FR-AUTH-22 (the raw-body route allow-list), OPS-DEPLOY
# FR-DEPLOY-14 (Caddy `request_body max_size 200MiB` on the upload path; the numeric body timeout lives in the api),
# OPS-CLI FR-CLI-23 (`reader up` starts the ingest watcher by default, owner 2026-11-23; `reader status` reports it;
# `reader down` stops it), SRV-SEARCH FR-SEARCH-10 (fts_config of uploaded materials), SRV-CONFIG FR-CONFIG-18 (the
# `up-` id prefix reserved for uploads).
#
# Declared deviations:
#   - The roadmap's slice says "Upload the Bashir PDF". The PDF is declared in reader.yaml and ingested with a host
#     command; browser upload is deferred (owner note 1). Revision 2 adds browser upload; the CLI path stays.
#   - ADR-0008 (proposed) names pypdf for bookmarks. This spec reads bookmarks and the text layer with pypdfium2, which
#     Docling already depends on, so one PDF library serves both and no second parser enters the host install.
#
# Span ids (coordinator decision, 2026-11-21): every span has the public id "<material_sha256>:<seq>". Lesson
# citations use it. A material's converter_version is frozen at its first successful import, so the id stays stable;
# re-ingesting under a new version is deferred and carries an obligation (defers).
#
# Cross-spec items (each a paired change in the owning spec):
#   - SRV-EVENTS: `reader.jobs.catalog.KINDS` includes the kinds of `reader.ingest.jobs.KINDS` through a declared list
#     of kind modules (today KINDS is one tuple in jobs/catalog).
#   - SRV-AUTH: `reader.api.app.ROUTERS` lists `reader.ingest.routes`; `reader.db`'s declared `version_locations`
#     list adds `reader/ingest/migrations`. The owner-only rule is an in-handler check here (FR-INGEST-15), so SRV-AUTH
#     needs no new access policy.
#   - OPS-DEPLOY: the server image creates `/var/lib/reader/blobs` owned by uid 10001 (scheduled as its own paired
#     change). Without it a fresh `blobs` volume is root-owned and receive cannot write.
#   - OPS-CLI: none. `reader-ingest` is its own console script and calls `reader status --json` (FR-CLI-13) for the
#     project name and health; it resolves the worker container with OPS-CLI FR-CLI-9's label rule.
#
# `server/pyproject.toml` is in this spec's paths for a narrow purpose only: the `reader-ingest` console script and the
# `reportlab` dev dependency for the fixture generator. Docling never enters the server environment or image: it lives
# only in the converter's own venv (FR-INGEST-3). Other specs keep their own entries in that file.
#
# Test levels:
#   [unit]   pure Python, no services.
#   [db]     Postgres through testcontainers on the pinned postgres:18-trixie digest (as SRV-AUTH); skips without a
#            Docker daemon.
#   [host]   needs the converter venv and models from `reader-ingest --setup` (FR-INGEST-3); pytest marker
#            `ingest_host`, run on request (READER_TEST_INGEST_HOST=1), not in every local gate: Docling with torch
#            and its 1.2 GB of models are a multi-GB install.
#   [local]  needs the sha256-matched pilot PDF on the owner's Mac; reported as a skip when absent, never as a pass
#            (ADR-0021 verified_by).
#   [live]   e2e/live/slice.sh against `reader up`.
#
# First exercised only in the [local] check, because unit and host tests use synthetic inputs:
#   - the real profile's behaviour on the pilot (FR-INGEST-4, INV-INGEST-4);
#   - code text from the pilot's text layer and the code-order correction on pages 461 and 468 (FR-INGEST-7,
#     FR-INGEST-8, VEC-INGEST-3);
#   - the pilot outline (FR-INGEST-9, VEC-INGEST-4);
#   - the full-run throughput (NFR-INGEST-1).

