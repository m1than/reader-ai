    - "Locators for the 6 pilot pages without a text layer arrive with OCR (their figure spans already have zero-length locators)."

proposed_owner_notes:
  - "8. (Revision 3, ADR-0039.) After this update every book you have imported is re-indexed once at its new span level: until that finishes, search and tutor answers find nothing in it. For the Bashir book that took 26.8 minutes (measured). The later move to the re-converted copy (about 12 minutes of conversion on your Mac, then its own indexing in the background) causes no second gap. Lessons and the notebook stay readable throughout."
  - "9. (Revision 3.) Old copies of a book's index that no recent state uses (absent from the last 20 changes and older than 30 days, and not cited by a published lesson) are cleaned up automatically. A cleaned-up copy, like one you purge yourself, cannot be rebuilt under the same converter version: it comes back only when a newer converter version converts the book again. This also applies to a book you deleted and left deleted that long: restoring it brings back the material row and its courses, but its index returns only with the next converter version."

# Round 1 (deep-reviewer, Fable, on fe2dc2b): changes, 7 blocking; all addressed in this draft:
#   B1 GC and purge keep `ingests` and `base_packs` rows as tombstones (FR-INGEST-35, -44, -45; FKs of
#      freshness_reports and study_plans; SRV-PLAN and SRV-FRESH notes); B2 paired readers listed with a sequencing
#      note and INV-INGEST-16's source scan; B3 activation checks seq map and anchor run itself (FR-INGEST-39);
#      B4 activation keyed by the entry it writes, explicit overlay ids, no sealed_at choice, restore of a
#      never-activated material, keys for every new kind, `ingest.retag`, INV-INGEST-12's model-derived expectation;
#      B5 append locks added packs, global lock order, `pack_collected`, restore-vs-GC test; B6 total resolver,
#      re-anchoring on rollback, the citation property; B7 facets with resolvable consumers and `enabled`, `form`
#      disabled. Non-blocking notes applied (amendment-note gate on FR-INGEST-41 and its never-run test, 359 empty
#      spans, owner_id on PackGuard only with SRV-AGENT, pinned parse configs, skipped outline levels, the
#      test-vector measurement before promotion, base58 keys, lock order, one job per pack, artifact removal after
#      commit, G1 values carried over, seq_maps keys, 702 s / 4.36 GB, judge_inputs and judge_requests on purge,
#      foreign pack 404, no GC after append).
# Cross-spec decision (SRV-SEARCH review, 2026-11-26): legacy chunk rows are not a vector overlay; SRV-SEARCH
# defines `search.forget_overlay` and `search.forget_legacy`, and its embed job seals the vector overlay and calls
# `try_activate` in the same transaction.
# Round 2 (deep-reviewer, on 8709ee0): changes, 5 blocking, with the coordinator's decisions applied:
#   B1 activation is `request_activation` + `try_activate`, called in-transaction by every producer of a
#      precondition, desired overlays in `pending_activations`, idempotent by `no_change`, inline re-anchoring in
#      restore and rollback, a waiting-to-appended test; B2 option (a): the legacy pack needs no seq map and gets its
#      own span-level vector overlay, so every material is dark for one embed (owner note 8, an r2-upload test);
#      B3 append locks every pack whose element differs from the parent and re-checks its overlays, rollback vs
#      gc_overlay test; B4 `removed` defined by a collected or purged pack of the material, test oracle fixed;
#      B5 `search.forget_legacy` in GC and purge. Non-blocking applied: header lines, the RESULT.md merge note, the
#      gc_overlay key, owner note 9, FR-INGEST-45 gated on the SRV-AGENT change, the packs listing route, resume
#      after a cap stop, lock re-entry wording, any anchor chain reaching the active pack wins.
# Round 3 (deep-reviewer, on 7282072): changes, 3 blocking, with the coordinator's decisions applied:
#   B1 one activation contract shared with SRV-SEARCH: the import requests {profile, tags?} in its seal
#      transaction, the embed job requests {vectors} then calls try_activate; precondition `vectors_missing` (no
#      second dark window); FR-INGEST-13 revised to match; the run-through test asserts the profile id.
#   B2 no rebuild after collection and no generations: a gone pack returns only with the next r, a gone overlay
#      id is refused (`overlay_collected`) and returns only with a raised builder_version; owner note 9 reworded;
#      FR-INGEST-12, -13, -14, -35, INV-INGEST-2 and the tests aligned.
#   B3 restore takes all pack locks in one first call and calls try_activate for every pending row of the
#      material in converter-version order; a worker-start sweep retries every pending row; `manifest_conflict` is a
#      stored waiting reason; a delete-while-waiting-then-restore [db] test.
#   Non-blocking applied: FR-INGEST-38's lock oracle (kept pack with a changed overlay locked), restore merges the
#   last entry's ids under existing desires, the head-entry pack always buildable, the owner-less import key
#   (defers), rollback's whole lock set in its first call; FR-INGEST-31 states how many entries a restore appends.
