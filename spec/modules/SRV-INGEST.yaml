    text: >-
      `status` reports the key (material_sha256, `CONVERTER_VERSION`) only; there is no frozen version. `reader-ingest`
      converts when that key is `none`, so a converter upgrade re-converts and creates a new pack (P2). A succeeded
      key whose pack is collected or purged reports `collected` or `purged`; `reader-ingest` then exits 2 with that
      code and converts nothing (FR-INGEST-35: such a pack returns only with the next converter revision).
    tests_planned:
      - "change test_ingest_db.py [db]: status of an r2-imported material under r3 is `none`"
  - id: FR-INGEST-13
    text: >-
      As approved, except: the handler no longer refuses `version_frozen`; it writes the base pack `building → sealed`
      (FR-INGEST-35) with its profile overlay and, when a span facet is enabled, its tags overlay (FR-INGEST-36,
      -37), and in the same seal transaction calls `request_activation(conn, owner_id, pack_id, {profile: id, tags:
      id when built})` without `try_activate`; then it enqueues `search.embed` for the pack, `ingest.seqmap` when the
      material has a legacy ingest (FR-INGEST-40), and `ingest.reanchor` when another pack of the material is in the
      head entry (FR-INGEST-43). The pack is activated by the first `try_activate` whose preconditions hold, normally
      the embed job's (FR-INGEST-39). The key stays [material_sha256, converter_version] (no owner, single-owner
      v1): the parse config is a function of the version, so the key names the pack, and a collected or purged pack
      never imports again under it (FR-INGEST-35).
    tests_planned:
      - "change test_ingest_db.py [db]: an import ends with a sealed pack, a sealed profile overlay (no tags overlay with the committed facets file) and one pending_activations row desiring exactly that profile id, with no manifest entry appended by the import; a second converter version imports a second pack; the enqueues per case"
  - id: FR-INGEST-14
    text: >-
      As approved, plus migration `ingest_0004_packs`: `ingests` drops UNIQUE (material_id) for UNIQUE (material_id,
      converter_version) (one pack per material and converter version, FR-INGEST-35); `material_spans` adds `locator text`, `quote_sha256 text` (NOT NULL after the backfill of
      FR-INGEST-40) and UNIQUE (ingest_id, locator); the tables of `proposed_tables` with their triggers. `ingests`
      rows are never deleted (tombstones, FR-INGEST-35), so the `ON DELETE CASCADE` of `material_spans` and
      `material_outline` never fires and the RESTRICT keys of `freshness_reports` and `study_plans` stay valid. The
      downgrade drops only what it added and refuses when a material holds more than one ingest.
    tests_planned:
      - "change test_ingest_db.py's migration test [db]: the new columns, constraints and triggers; the guarded downgrade"
  - id: FR-INGEST-15
    text: >-
      As approved, with: the spans route reads the material's active pack (FR-INGEST-38) and returns `span_id` = its
      locator, plus `quote_sha256`; `seq` stays as the reading-order number; a material with no active pack is 404
      `not_found`.
    tests_planned:
      - "change test_ingest_db.py's route tests [db]: span_id is the locator; quote_sha256 present; inactive material 404"
  - id: FR-INGEST-17
    text: >-
      **Retired** (owner decision 20): the public span id is the locator of FR-INGEST-33; the `<material_sha256>:<seq>`
      form is never issued and is resolved only by FR-INGEST-42; there is no frozen converter version.
    tests_planned:
      - "change test_ingest_db.py [db]: no route returns a legacy id; the frozen-version cases are replaced by FR-INGEST-35's two-pack case"
  - id: FR-INGEST-31
    text: >-
      As approved, plus: a delete appends exactly one manifest entry in its transaction, after the cascade's locks;
      a restore appends, in its transaction, one entry for each pending activation of the material whose
      preconditions hold (FR-INGEST-39): one in the ordinary case (the source comes back, P4), two when a newer pack
      was waiting while the material was deleted (the source comes back, then its newer pack replaces it), none when
      every pack of the material is gone. Deleted materials leave search because they leave the head entry.
    tests_planned:
      - "change test_manage_db.py [db]: see FR-INGEST-39"
  - id: FR-INGEST-32
    text: >-
      **No live course on a deleted material** (unchanged), and **routes delete nothing**: no route deletes a row of
      materials, ingests, material_spans, material_outline or uploads, or a file under the blobs root. Span, outline
      and overlay rows and artifact directories are deleted only by the GC and purge jobs (FR-INGEST-44, -45); rows
      of `materials`, `ingests` and `base_packs` are never deleted (`ingests` and `base_packs` are the pack's
      tombstone). P6 replaces the tombstone-only rule for span, outline and overlay data. The auth matrix is
      unchanged.
    tests_planned:
      - "change test_manage_db.py [db]: the row-count oracle is kept for routes; GC and purge are covered by test_gc_db.py and test_purge_db.py"
  - id: INV-INGEST-1
    text: >-
      As approved, plus: every span has a `locator` and `quote_sha256` equal to FR-INGEST-33/-34 over its page's
      spans; locators are unique within the artifact; the manifest's `pack_id` matches its parse config.
    tests_planned:
      - "change test_ingest_artifact.py's property test: generated artifacts carry valid locators; each locator rule broken alone is refused"
  - id: INV-INGEST-2
    text: >-
      Idempotency per pack: for one (material, converter version), any number of receives and imports leaves at most
      one `ingests` row, one `base_packs` row and one set of span and outline rows; an import never runs for a key
      whose job has succeeded, so a collected or purged pack never imports again under its version (FR-INGEST-35);
      `reader-ingest` never starts the converter when FR-INGEST-2 reports `succeeded`, `collected`, `purged`,
      `queued` or `running` for the current version, nor while another run holds the material lock.
    tests_planned:
      - "change test_ingest_db.py and test_ingest_host.py: the frozen-version oracles become per-version oracles; `collected` and `purged` start no converter"
  - id: INV-INGEST-7
    text: >-
      Span ids: for every sealed pack the locators the spans route returns are unique, equal FR-INGEST-33 over the
      pack's rows, and are the same before and after any number of further receives, imports, requeues, overlay
      rebuilds and api restarts (a tagger, model, prompt or vocabulary change creates an overlay, never a new locator).
    tests_planned:
      - "change test_ingest_db.py's INV-INGEST-7 test [db]: locators instead of seq ids; a tags overlay rebuild leaves every locator unchanged"
  - id: VEC-INGEST-1
    source: "As approved, regenerated in format reader-ingest/2 (locators, quote hashes, parse_config, pack_id)."
    tests_planned:
      - "change make_artifact_fixture.py and test_ingest_artifact.py"
  - id: VEC-INGEST-2
    source: "As approved; synthetic.expected.json adds each span's locator (span ids become locators)."
    tests_planned:
      - "change test_ingest_mapping.py and test_ingest_host.py"
  - id: VEC-INGEST-3
    source: >-
      As approved, plus for each of the 20 sample pages the sha256 of its canonical page text (FR-INGEST-33) and its
      span count, generated by pilot_expectations.py on the owner's Mac; the r3 re-conversion must reproduce them
