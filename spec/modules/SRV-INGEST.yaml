  - id: FR-INGEST-42
    text: >-
      **Migration step 5: read-time resolver** (P2 (5), P8). `reader.ingest.spanref.resolve(conn, owner_id, refs)`
      maps each citation reference — a legacy id, or a locator with its `quote_sha256` — to `{locator, quote_sha256,
      page, text | null, state}` and **never writes** (INV-LESSON-6: published revisions stay as they are; the next
      compile writes locator ids). The function is **total**: every reference gets exactly one state, decided in this
      order, and text is returned only from a span whose `quote_sha256` equals the reference's:
      1. a malformed reference → `invalid`; a legacy id with no accepted `span_seq_map` row → `unmapped`; otherwise
         the legacy id becomes that row's (locator, quote_sha256) and continues;
      2. the material's active pack holds a span at that locator with that hash → `active`;
      3. else follow `anchor_maps` hops from any pack of the owner where the locator had that hash: each hop's
         `from_locator` and `quote_sha256` must equal the current (locator, hash), the next hop starts at its
         `to_locator` with the target span's hash re-read and checked equal; a hop that is `orphaned`, a hash that
         differs, or a cycle ends that chain; at most one hop per pack of the material per chain. All chains from all
         starting packs are walked, and **any chain that reaches the active pack wins** → `reanchored` (text from the
         active pack); different chains reaching different active spans cannot happen (one active pack, one span per
         locator), and if they reach different locators the lowest locator in parse order is returned;
      4. else a sealed pack of the owner, not collected or purged, that holds a span at that locator with that hash
         (lowest pack id when several, a deterministic choice) → `inactive`, text from that pack;
      5. else, when the material has at least one collected or purged pack of this owner → `removed` (text null;
         locator and page stay displayable, P6): the cited span may have lived in it, and its rows are gone;
      6. else → `orphaned`.
      A reference to another owner's material is `unmapped` or `orphaned`, never served. Text is returned only to an
      entitled caller (ADR-0039 B8) and only to the calling module, never logged.
    tests_planned:
      - "add server/tests/ingest/test_spanref_db.py [db]: one ref per state (invalid, unmapped, active, reanchored over one and over two hops, inactive, removed, orphaned) — `removed` only when the material has a collected or purged pack of this owner and no active, anchored or inactive span matches, `orphaned` for the same ref when no pack of the material is collected or purged; a hop whose target hash differs stops that chain while another chain from a second starting pack still reaches the active pack (reanchored); an anchor cycle terminates; a legacy id resolves through the map and no lesson_revisions row or blob changes (row count and blob listing before and after); another owner's ref is never served"
  - id: FR-INGEST-43
    text: >-
      **Re-anchoring** (P2 quote hash and re-anchoring, P8). The job `ingest.reanchor` {owner_id, from_pack_id,
      to_pack_id}, key [owner_id, from_pack_id, to_pack_id], runs when a sealed pack is about to replace another pack
      of the same material: activation of a new pack, a restore onto another pack, and a **rollback** to an earlier
      manifest entry whose pack for the material differs from the head's (FR-INGEST-39); an existing `anchor_runs`
      row for the pair is reused. For every span of the old pack it writes one `anchor_maps` row: the new
      span on the **same page** with the **same quote_sha256** and the **same equal-hash ordinal** (FR-INGEST-34) →
      `mapped`; if the number of spans with that hash on that page differs between the two packs, or there is none →
      `orphaned` (never guessed). One transaction, ending with the pair's `anchor_runs` row and, as a job, a call to
      `try_activate(conn, owner_id, to_pack_id)` in the same transaction; restore and rollback run the same function
      inline in their own transaction instead (FR-INGEST-39). Rows belong to the target pack and are collected with it. Counts
      (mapped, orphaned) are recorded in the job's result and trace, never texts. Mutable rows are not rewritten by
      re-anchoring: every reader resolves through FR-INGEST-42, one rule for published and mutable citations.
    tests_planned:
      - "add server/tests/ingest/test_reanchor_db.py [db]: VEC-INGEST-11's cases — unchanged pack → all mapped to equal locators; a span inserted earlier on the page → mapped to shifted offsets; a repeated heading (two equal hashes) → mapped by ordinal; three empty figures in the old pack and two in the new → all three orphaned; a span moved to another page → orphaned; a rollback onto the old pack runs the reverse pair once and a second rollback reuses its anchor_runs row"
  - id: FR-INGEST-44
    text: >-
      **Garbage collection** (P6), background only, never by a route. The scanner job `ingest.gc` {slot}, key
      [slot] (the UTC date of the daily periodic entry, SRV-EVENTS paired), reads candidates without locks and
      enqueues **one job per pack**, `ingest.gc_pack` {owner_id, pack_id, slot}, key [owner_id, pack_id, slot], and
      one per lone overlay, `ingest.gc_overlay` {owner_id, overlay_id, slot}, key [owner_id, overlay_id, slot]. A
      deleter collects a pack (its
      `material_spans` and `material_outline` rows, its overlays and their rows; the `ingests` and `base_packs` rows
      stay as the tombstone with `collected_at` set) or an overlay only when all hold, re-checked under the pack's
      lock (FR-INGEST-46) in the deleting transaction, in the order job key → pack lock → reads and deletes:
      - it is absent from the owner's last `ingest.gc.keep_entries` manifest entries (`bounds.gc_keep_entries`);
      - it was sealed, or for a `building` one created, more than `ingest.gc.age_floor_days` ago;
      - it is not cited by a published lesson revision (`revision_packs`, SRV-LESSON paired), not the target of an
        accepted seq map (every legacy revision of its material cites it through the map), and not cited by a finding
        (a seam returning none until SRV-KB);
      - it is not the pack of, nor an overlay desired by, a `pending_activations` row (a waiting activation keeps
        what it waits to activate; a pack whose rows are only stale desires leaves with its row when the owner purges
        it).
      Each pack is collected in its own transaction with `reader.pack_delete = on`; the transaction also calls
      `judges.forget_pack`, `judges.forget_overlay` (SRV-AGENT), SRV-SEARCH's `forget_overlay` for each of its
      vector overlays and SRV-SEARCH's `search.forget_legacy(conn, owner_id, ingest_id)` for its `ingests` row, which
      deletes that ingest's legacy `search_chunks` and `search_embeds` rows (paired; a no-op for an r3 pack). **After it has
      committed**, the job removes the pack's artifact directory from the blobs volume when no `ingests` row of any
      owner whose pack is not collected or purged names that artifact id; a crash between the commit and the removal
      leaves a directory the next scanner removes by the same rule. `freshness_reports` and `study_plans` rows that
      reference the tombstoned `ingests` row stay valid (FK RESTRICT). Material rows, the owner's soft delete and the
      inbox originals are never touched (P6). This replaces FR-INGEST-32's tombstone-only rule for span, outline and
      overlay data.
    tests_planned:
      - "add server/tests/ingest/test_gc_db.py [db]: a pack outside the last N entries and older than the floor is collected — spans, outline, overlays, judge outputs, vector rows and the legacy search_chunks and search_embeds rows of its ingest gone, ingests and base_packs rows kept with collected_at — while a freshness_reports row and a study_plans row referencing its ingest stay and still read; kept when within N, younger than the floor, cited by a revision_packs row, the target of an accepted seq map, active, or named (pack or desired overlay) by a pending_activations row; an abandoned building pack past the floor is collected; the scanner enqueues one gc_pack job per candidate and a repeat in the same slot enqueues none; the artifact directory is removed only after commit (a rolled-back collection leaves it) and kept while another owner's live ingest names it; material and uploads rows unchanged; no route of reader.ingest.routes or any other api module calls the GC (import-graph test)"
  - id: FR-INGEST-45
    text: >-
      **Owner purge** (P6, ADR-0017 data ownership). Promoted only together with the paired SRV-AGENT `PackGuard`
      change (FR-INGEST-46), since a purge without the guard could race a judge write.
      `GET /api/materials/{material_id}/packs` (owner only) lists the material's packs of the session's owner as
      `[{pack_id, converter_version, state, active, collected_at, purged_at}]` in converter-version
      order, so the owner can name the pack to purge. `POST /api/materials/{material_id}/packs/{pack_id}/purge` with
      `{confirm}` (FR-INGEST-31's confirm rule, owner only, FR-AUTH-12) answers 202 and enqueues `ingest.purge`
      {owner_id, pack_id}, key [owner_id, pack_id]; the route itself deletes nothing (no deletion on a request path).
      The route answers 404 `not_found` when `pack_id` is not a pack of that material of the session's owner. The job,
      in the order job key → pack lock (FR-INGEST-46) → the rest, appends one manifest entry without the pack if it
      is active (CAS, FR-INGEST-38), sets `purged_at`, and collects as GC does but without the N, age and citation
      conditions (including `search.forget_legacy`); the `ingests` and `base_packs` rows stay as the tombstone. In the
      same transaction it also deletes
      the `judge_inputs` rows (SRV-OBS seam) and pending `judge_requests` rows (SRV-EVENTS seam) whose cards cite the
      pack, and the pack's `pending_activations` row; the artifact directory is removed after commit by GC's rule.
      Citations keep their locator and resolve as `removed` (FR-INGEST-42). An earlier manifest entry that names the
      purged pack stays (append-only); a rollback to it is refused `pack_purged`. A second purge answers 202 and its
      job does nothing.
    tests_planned:
      - "add server/tests/ingest/test_purge_db.py [db]: purge of an active pack → one entry without it; spans, outline, overlays, judge outputs, judge_inputs, pending judge_requests and vector rows gone; purge of a migrated r2 pack deletes its ingest's search_chunks and search_embeds rows (search.forget_legacy called once with that ingest id); ingests and base_packs rows kept with purged_at; the packs listing route shows each pack with its state, owner only; a freshness report and a study plan referencing it stay valid; citations resolve `removed`; purge of a cited inactive pack collects it anyway; purge of a pack with a pending_activations row deletes that row; rollback to an entry naming it → pack_purged; the route answers 202 with zero rows deleted before the job runs; learner 403 owner_only; another owner's material 404; a pack_id that exists only for another owner (same book) → 404 and nothing enqueued; a pack_id of another material of the same owner → 404; confirm_mismatch"
  - id: FR-INGEST-46
    text: >-
      **Per-pack advisory locks** (ADR-0039 B7b; the lock contract of SRV-AGENT FR-AGENT-21 step 9).
      `reader.ingest.packs.lock_packs(conn, pack_ids)` takes `pg_advisory_xact_lock(<"RKPK">, key(id))` for each
      distinct id in **ascending pack-id order**, in one call, where `key(id)` = int(id[0:8], 16) − 2^31 is monotone
      in the hex id, so ascending id order is non-decreasing key order and two ids that share a key are adjacent: no
      two transactions can wait on each other's keys in opposite order, collisions included. A transaction takes its
      pack locks after its job key and FR-INGEST-31's locks (FR-INGEST-38's global order) and before any other lock
      it waits on. **Later calls in the same transaction** (an inline re-anchoring followed by `try_activate`, or a
      producer's `try_activate` after its own locks): a key the transaction already holds is granted at once
      (Postgres advisory locks are re-entrant within a session) and never waits; a later call may add only keys
      greater than every key the transaction already holds, and otherwise raises `lock_order` before taking any lock,
      so ascending order holds across calls. Callers that know their whole set take it in the first call. The lock is not per owner: two owners of one book share it, which only serialises them.
      **`PackGuard`** (production default replacing `AlwaysActive`, only together with the paired SRV-AGENT revision
      that adds `owner_id` to the Protocol and changes its tests, H2): `PackLocks.lock_active(conn, owner_id,
      pack_ids)` takes the locks, then returns true iff every pack is in the owner's head manifest entry, `sealed`
      and neither collected nor purged. Because purge and GC delete under the same lock, a judge output is either written before a purge
      (and then deleted by its `forget_pack`) or not written at all.
    tests_planned:
      - "add server/tests/ingest/test_pack_locks_db.py [db]: key() is monotone over sorted random ids and colliding prefixes; lock_active true for active packs, false after purge, false for a building or inactive pack; a purge waiting on a held guard lock deletes after the guard's transaction and the guard's judge output is then gone; two transactions locking {a,b} and {b,a} both complete (no deadlock_detected), with held and awaited locks read from pg_locks as INV-LESSON-23's oracles do; a second call with held keys does not wait, with a greater key succeeds, with a smaller new key raises lock_order and takes nothing"
  - id: FR-INGEST-47
    text: >-
      **Conditional on retrieval-ablation keeping context prefixes.** Context-prefix overlay (B1, B7, decision 19):
      the job `ingest.prefix` {owner_id, overlay_id, batch_no, resume}, key [owner_id, overlay_id, batch_no, resume]
      (`resume` below), on the worker,
      builds a `prefixes` overlay over a sealed pack in batches of `bounds.prefix_batch_spans` (25) spans in reading
      order; each batch makes one SRV-AGENT call per span, task `ingest.context_prefix`, line `index`, with
      `run_id = judges.scope_run_id(owner_id, "overlay", overlay_id)` and the cap `budgets.index_usd_per_pack`
      (FR-AGENT-19), so retries, re-enqueued batches and rebuilds of one overlay share one cap; then it enqueues the
      next batch, so a tutor job waits at most one batch. Outputs are recorded by `judges.record` keyed (owner, input
      hash, judge) with the overlay id, and a rebuild replays them (`ReplayProvider`, no spend). A budget refusal
      stops the build with an event, leaves the overlay `building` and the pack active with its earlier overlays
      (titles-only context; the task then blocks for a top-up, owner decision 15); the refused batch ends `succeeded`
      with the event `ingest.prefix budget_stopped batch=<n>` and records the batch number on the overlay row.
      **Resume:** `resume` = the number of budget stops of
      that overlay so far (0 on the first pass). At worker start, every `building` prefix overlay whose pack is in a
      head entry and whose last batch stopped on the cap is re-enqueued at that batch with `resume` + 1. Because the
      run id is the same `scope_run_id`, the cap counts what the overlay already spent: the resume makes progress
      only once the owner has raised `budgets.index_usd_per_pack` (the top-up), and spans already prefixed in that
      batch replay from recorded outputs at no cost. The last batch seals the overlay, calls
      `request_activation(…, {prefixes: id})` **without** `try_activate`, and enqueues a vector rebuild (the vector
      overlay's inputs include the prefix overlay id); that embed's seal requests `{vectors}` and calls `try_activate`,
      so the prefixes and the vectors built from them become active in one entry (FR-INGEST-39).
    tests_planned:
      - "add server/tests/ingest/test_prefix_db.py [db] (fake provider): 60 spans → 3 batches, each re-enqueues the next, the third seals; run_id equals scope_run_id(owner, overlay, overlay_id) on every call; the cap refused mid-build leaves the overlay building, no next batch, the pack's head entry unchanged; a rebuild from recorded outputs makes no provider call and yields the same overlay id and rows; resume after a stop: with the cap unchanged the restarted batch stops again at once, after raising the cap it continues from the stopped batch with resume 1, replays the batch's recorded spans without calls and seals; the seal appends no entry, and the following vectors seal appends one entry naming both the prefix and the new vectors overlay"
  - id: FR-INGEST-48
    text: >-
      **Conditional on retrieval-ablation keeping L2 summaries.** Summary overlay (B1 L2): one summary per outline
      node within B1's budgets (leaf ≤ 100, chapter ≤ 300, root ≤ 500 tokens, initial values), built bottom-up by the
      job `ingest.summary` {owner_id, overlay_id, batch_no, resume}, key [owner_id, overlay_id, batch_no, resume],
      under the same cap, run id, resume and replay rules as FR-INGEST-47; its seal calls
      `request_activation(…, {summaries: id})` and `try_activate` (summaries feed no vector overlay). It runs through a slot SRV-AGENT does
      not have yet (`ingest.summary`, paired). Outline nodes deeper than 4 levels are folded into their level-4
      ancestor (B1 depth cap).
    tests_planned:
      - "add server/tests/ingest/test_summary_db.py [db] (fake provider): bottom-up order, depth fold at 4, cap and replay as FR-INGEST-47"

