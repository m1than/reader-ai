defers:
  - "Browser upload of materials (roadmap slice wording); this revision declares materials in reader.yaml and ingests with a host command (ADR-0027 revisit_when)."
  - "Re-ingesting a material under a new converter_version. Obligation when it arrives: it must map every old span id `<sha>:<seq>` to its new span, or keep the old spans, so that no lesson citation ever resolves to different text (FR-INGEST-17)."
  - "OCR for pages without a text layer (ADR-0008 resolved question 1; EasyOCR ru+en). The manifest lists such pages; the pilot has 6."
  - "Non-PDF formats (EPUB, DOCX, HTML, web and git snapshots; ADR-0008 Decision 2)."
  - "Figure image crops on the blobs volume; figure spans carry bbox and caption only."
  - "Character offsets into the page text layer (ADR-0008 Decision 3); spans cite page and bbox through their span id."
  - "Multi-column reading order beyond Docling's own."
  - "Per-material limits from ADR-0008 Decision 4 (page ranges, max size, fetch domains)."
  - "Page 378's emoji code block classified as a picture (ADR-0021 known miss): investigation in the full stage-3 module."
  - "Events on the outbox and notifications for import completion (stage 2)."
  - "MPS for Docling's layout and table models; CPU only keeps the sandbox free of mach services."

owner_notes:
  - "1. The roadmap's slice says 'Upload the Bashir PDF'. With a native converter and no host listener (ADR-0027), the slice declares the PDF in reader.yaml and runs `reader-ingest bashir-2025` on the Mac. The owner accepted CLI-first ingestion on 2026-11-21; browser upload comes later."
  - "2. ADR-0027 changes ADR-0021 Decision 3's transport. The owner accepted it and CLI-first ingestion in chat on 2026-11-21 (upload later); the owner sets ADR-0027's status line and adds ADR-0021's amendment note."
  - "3. Confinement uses sandbox-exec (deprecated by Apple, still shipped, works on macOS 27.2); spikes/ingest-confine measured no speed cost. The dedicated-user fallback is not needed."
  - "4. `reader-ingest --setup` creates a separate converter venv (Docling 2.151.1 with torch, several GB) and fetches 1.2 GB of models under `<data_dir>`."
  - "5. The converter version freezes at the first import (FR-INGEST-17), so no converter fix reaches the pilot after its first import without the deferred re-ingest. Run the 20-page fidelity loop (VEC-INGEST-3 [local] and NFR-INGEST-2's owner check) to its target before the first full import of the Bashir PDF."
  - "6. NFR-INGEST-2's rule-B count may be 3 of 20 against a threshold of 2: page 378 (known miss), page 133 (a curve-constant line labelled code) and page 468 (a filename label labelled a list item), all measured 2026-11-22. The owner judges these pages before the first full import, because the converter version freezes at that import. Owner judgement, 2026-11-23: rule B is 1 of 20 (page 378); pages 133 and 468 are label noise, not rule-B misses. The owner also chose to fix code-block indentation before the first full import (FR-INGEST-7, converter r2)."

