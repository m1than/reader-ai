  - id: VEC-INGEST-4
    source: "As approved, plus the sha256 of the sorted outline ids (`sec:` paths, FR-INGEST-33)."
    tests_planned:
      - "change the [local] outline test"

proposed_invariants:
  - id: INV-INGEST-11
    text: >-
      **Packs and overlays are immutable once sealed** (P1): for any sequence of imports, overlay builds, manifest
      appends, GC runs and purges, no sealed row of `base_packs` (other than `collected_at` and `purged_at`, once
      each), `overlays` (other than `collected_at`, once), `ingests`, `material_spans`, `material_outline`, `span_tags`, `pack_profiles`,
      `span_prefixes` or `outline_summaries` changes; span, outline and overlay rows disappear only in a GC or purge
      transaction; `ingests` and `base_packs` rows never disappear. [db] triggers attempted directly; property over
      the state machine of INV-INGEST-12.
    tests_planned:
      - "test_packs_db.py and test_packs_property_db.py"
  - id: INV-INGEST-12
    text: >-
      **Active view equals a fresh build** (ADR-0039 verified_by, plan "Main test"). A Hypothesis state machine over
      2–4 synthetic materials (VEC-INGEST-2-style artifacts, no book text) runs random sequences of: import under one
      of two converter versions (requesting its profile and tags), embed seal (requesting vectors, then
      `try_activate`), seq-map accept, re-anchor end, rebuild an overlay (tagger version or, when kept, prefix prompt
      version), delete, restore, roll back to an earlier entry, purge, GC with random N and clock, and the
      worker-start sweep; every activation goes through FR-INGEST-39's two functions only. Model outputs (prefixes,
      summaries) come only from recorded outputs through `ReplayProvider`; embeddings from a deterministic fake; the
      facets file is a test file with `form` enabled, so tags are exercised.
      - **Expected set from the model, not the database.** The state machine keeps its own model: per owner, the
        list of entries it expects (each a set of (material, converter version, overlay inputs per kind)), its
        pending desires with their expected waiting reason, and which packs and overlays it expects collected or
        purged, updated by each rule from the rule's own arguments and FR-INGEST-39's preconditions as written. The
        database head is never used to compute the expectation.
      - **After each step:** the active view (brain_version; for each active pack its spans as (locator,
        quote_sha256, page, kind, text), outline ids, tags, profile and, through SRV-SEARCH's fake, vector rows as
        (locator, overlay_id)) equals the view of a fresh database into which exactly the model's expected head set
        is built once; the pending rows and their reasons equal the model's; a rollback to any entry in the chain
        succeeds, or is refused with `pack_collected` or `pack_purged` exactly when the model says one of its packs or
        overlays is gone; no gone pack or overlay id is ever built or activated again.
      - **Citations:** every citation minted during the sequence (a locator and hash taken from a then-active span)
        resolves through FR-INGEST-42 to one of the declared states, and whenever text is returned its sha256 equals
        the citation's `quote_sha256`.
    tests_planned:
      - "add server/tests/ingest/test_packs_property_db.py [db, property]: the rules above; the model as a plain Python structure; a citation pool sampled after each activation"
  - id: INV-INGEST-13
    text: >-
      **One active base pack per material and a linear manifest**: in every entry no material appears twice; seq
      values of an owner form 1..n with parent_seq = seq − 1; concurrent appenders never fork the chain. [db]
    tests_planned:
      - "test_manifest_db.py: 8 concurrent appenders with one parent → one wins per round; property in test_packs_property_db.py"
  - id: INV-INGEST-14
    text: >-
      **No deletion on a request path; locks before deletes.** No module importable by the api role deletes from the
      tables of this revision or calls GC or purge internals (import-graph and source scan, as INV-INGEST-8); every
      DELETE of pack data runs in a transaction that holds the pack's lock and set `reader.pack_delete`. [unit, db]
    tests_planned:
      - "add to test_gc_db.py: the import-graph and source-scan test; a DELETE without the setting refused"
  - id: INV-INGEST-15
    text: >-
      **The migration never guesses**: a map is accepted only when FR-INGEST-40's 1:1 rule holds; FR-INGEST-41
      either rewrites every legacy id of every target or none; the resolver and re-anchoring write no citation-bearing
      row of another module; re-anchoring orphans whenever equal-hash counts differ. [db]
    tests_planned:
      - "test_seqmap_db.py, test_migrate_citations_db.py, test_spanref_db.py, test_reanchor_db.py"
  - id: INV-INGEST-16
    text: >-
      **Every read goes through the active view** (P5). No module of `reader.*` outside `reader.ingest` names the
      tables `ingests`, `material_spans` or `material_outline` in a string literal (SQL text; docstrings and comments
      excluded); they read packs through `reader.ingest.manifest.active_view` and the helpers of `reader.ingest.packs`.
      Foreign-key declarations in other modules' migrations (`REFERENCES ingests`) are the only exception, listed by
      file in the test. The source scan is also the sequencing gate of the header: no r3 import before it passes on
      the integration branch. [unit]
    tests_planned:
      - "add server/tests/ingest/test_readers_scan_unit.py [unit]: an AST scan of every reader.* module outside reader.ingest finds no string constant (docstrings excluded) matching \\b(ingests|material_spans|material_outline)\\b, except the listed REFERENCES lines in plan/migrations/plan_0001.py and freshness/migrations/freshness_0001.py; a planted literal in a temporary module is found"

