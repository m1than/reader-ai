      WEB-RENDER's sanitiser; no source material quoted
    file: spec/fixtures/WEB-NOTEBOOK/lesson-w01.ipynb
  - id: VEC-NOTEBOOK-2
    source: >-
      Relay message sequences derived from Jupyter messaging 5.3 (REF-NOTEBOOK-2) and SRV-KERNEL FR-KERNEL-7/8/10/11/12/14
      (notices, close codes, connection limit), one per row of FR-NOTEBOOK-8, with the expected cell states and slot
    file: spec/fixtures/WEB-NOTEBOOK/session.yaml

