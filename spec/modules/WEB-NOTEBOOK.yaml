requirements:
  - id: FR-NOTEBOOK-1
    text: >-
      The lesson view loads `GET /api/lessons/{lesson_id}`; when `latest_sha256` is null it shows the not-published
      page below (for the owner, FR-NOTEBOOK-12's compile control renders there through the compile slot); otherwise it loads `GET /api/lessons/{lesson_id}/revisions/{latest_sha256}` (cached for the life
      of the page under that sha256, since a revision is immutable) and renders the cells in order. A cell shows its kind
      as a quiet label (diagnostic, reading route, what changed, erratum, trade-off, notes) except: explanation cells,
      most of a lesson (10 of L02's 27), carry none (audit 2026-11-23: a label on every cell was noise); an open
      question's callout title names it (FR-NOTEBOOK-3); a lab's block header names it (FR-NOTEBOOK-9); recall cards sit
      under the deck's heading (FR-NOTEBOOK-10). Each cell shows its source: markdown cells through WEB-RENDER's
      markdown component, code cells as highlighted code (WEB-RENDER). A cell without `metadata.reader.kind`, or with an
      unknown kind, renders as a plain markdown or code cell without a label. Stored outputs of code cells render
      through WEB-RENDER. (A cell's heading text also appears in the lesson contents, FR-NOTEBOOK-11, so tests find the
      cell's own heading by its element.)
      **Not-published page (design pass; the live page was a title and one sentence, a dead end):** the breadcrumbs of
      FR-NOTEBOOK-11, then WEB-UI FR-UI-11's `StateBlock` with the lesson title as its `h1`, the line "Lesson <ordinal>
      of <course title> is not published yet.", the status — the neutral chip "Not published yet", replaced by the
      compile slot's `Status` component when that renders something (WEB-UI FR-UI-6's `compileSlot`, the shape
      FR-UI-15 fills) — and the slot's `Action` component (always visible here), both inside a `div`, and links "Previous: <title>" and "Next: <title>" to the
      nearest published lessons of the same course by ordinal (from the cached `GET /api/lessons`; each omitted when
      there is none) and "All lessons of <course title>" to `/#course-<course_id>`. [unit] the label rule, the
      not-published page (text, the default chip, a slot's `Status` replacing it and its `Action`, a `Status` rendering
      `null`, no slot, the parts in a `div`, both neighbours, none, one side); [story]
  - id: FR-NOTEBOOK-2
    text: >-
      Citations as references: for `explain`, `changed` and `erratum` cells, every citation in `claims[].citations[]`
      and `citations[]` is shown in a reference list labelled "Sources" under the cell, one entry per source, in order
      of first use. A citation with a non-empty string `url` is a URL citation, even when it also carries a `span`.
      Other citations are span citations, grouped by material (the part of `span` before the last `:`, or the whole
      span when it has no `:`; so "a:b:3" and "a:b:4" are one material "a:b"); a citation with neither a non-empty
      string `url` nor a non-empty string `span`, or whose material id is empty (":3"), is dropped.
      One entry per material, "<title>, p. <page>" for one distinct page and "<title>, pp. <pages>" for several, where
      a page counts only when it is a number that is a safe integer ≥ 1 (a numeric string, a fraction, 0, a negative,
      NaN, Infinity or an integer above 2^53 − 1 is ignored), and <pages> lists the distinct pages in ascending
      numeric order with each run of
      consecutive pages written as a range joined by an en dash ("pp. 69–70, 75"); a material none of whose citations
      carries a page renders as "<title>" alone. <title> is the
      first `material_title` among that material's citations in the cell, else the first among span citations of the
      same material anywhere in the lesson (the compiler's route `source_refs` carry no title, found by the live run of
      2026-11-23), else "source <first 8 characters of the material id>". The live L02 had explain cells with up to 29
      entries, 16 of them "…, p. 70" (live run 2026-11-23); grouping makes that one entry. URL citations stay one entry
      per distinct `url`: an external link only when its scheme is http or https (text: host and path;
      `rel="noopener noreferrer"`, `target="_blank"`) with its retrieved date; any other scheme renders as plain text.
      `route` cells list their `source_refs` the same way; `erratum` cells also show `source_ref` and the correction.
      A single grouping function is shared with SRV-TUTOR's Ask panel (FR-TUTOR-11). The reference list is an `ol`
      with `role="list"` (list style none). [unit] [story]
      **Promoted revision (r3_gates_revision, unit h):** this id's text in `proposed_revisions` (a locator
      `spn:<64 hex>:…` groups by its 64-hex material; any other span keeps the last-colon rule) replaces the
      material rule above. citations.test.ts.
  - id: FR-NOTEBOOK-3
    text: >-
      Open findings: an `open` cell whose `status` is not `answered` is shown with a visible marker that reads its
      status once (the marker reads "Open" for status `open`: the status in sentence case, its first letter
      capitalised and `_` shown as a space; the status is not repeated beside it), and, when `finding.gate` is `G2`, the
      text "Not yet confirmed by the source:" followed by the finding's reason as plain text, muted. The lesson header
      shows the count of such cells and links to the first one.
      Design pass: the cell is a callout block (class `callout`, `--acme-surface` background, `--radius-block`, a 3px `--acme-warning`
      bar at the inline start inside the block, so the bar no longer runs across the cell separators): a title row with
      the warning icon (`aria-hidden`), "Open question" and the status chip, then the G2 line, then the source. The header's count is a link styled as a warning chip ("4 open findings"). [unit] the chip
      text, the G2 line, the reason as text; [story]
  - id: FR-NOTEBOOK-4
    text: >-
      Kernel session: opening a lesson does not start a kernel; the first Run creates the session
      (`POST /api/kernel/sessions` with `{"lesson_id"}`) and opens `wss://<host>/api/kernel/sessions/<session_id>/channels`.
      One session and one WebSocket per open lesson view; leaving the view closes the WebSocket with 1000 (the session
      stays until reset or deletion). Every socket gets a generation number; events of a socket that is no longer
      current are ignored. [unit]
  - id: FR-NOTEBOOK-5
    text: >-
      Execution: Run on a lab cell sends one message `{channel: "shell", header: {msg_id, msg_type: "execute_request",
      username: "", session: "", date: <ISO 8601 UTC>, version: "5.3"}, parent_header: {}, metadata: {}, content: {code,
      silent: false, store_history: true, user_expressions: {}, allow_stdin: false, stop_on_error: true}}` with
      `msg_id` from `crypto.randomUUID()` without dashes (the relay overwrites `username` and `session`). The client
      keeps its own FIFO and has at most one execute_request in flight per session (the slot); other Run requests show
      the cell as `queued`. Only the matching `execute_reply` or a lost event (FR-NOTEBOOK-8) frees the slot.
      Shift+Enter runs the focused lab cell. Run all queues every lab cell in order; an `execute_reply` with status
      `error` returns the cells still queued from the same Run all to `idle`, whatever the cell's final label (error,
      interrupted or timed_out; code review); status `aborted` sets the cell to `not_run`. Output messages are checked
      and coerced to nbformat shapes before they are stored; a malformed one is dropped. Cell states and transitions
      follow VEC-NOTEBOOK-2. [unit]
  - id: FR-NOTEBOOK-6
    text: >-
      Outputs: messages are routed to a cell by `parent_header.msg_id`; messages with an unknown parent, and replies for
      an execute that is already terminal, change nothing. A `stream` message appends its text to the cell's last
      output if that output is a stream with the same `name`, otherwise it adds a new stream output. `display_data` and
      `execute_result` add an output; `update_display_data` replaces every output with the same `transient.display_id`
      in any cell of the lesson; `clear_output` clears at once, or with `wait: true` at the next output; `error` adds
      an error output; `execute_reply` sets the execution count and the final state. Running a cell clears its previous
      outputs first. [unit]
  - id: FR-NOTEBOOK-7
    text: >-
      Controls: Interrupt (while a cell runs) calls `POST /api/kernel/sessions/{id}/interrupt` with no body; Reset
      kernel asks for confirmation in a dialog that says it clears every open lesson's kernel state (SRV-KERNEL owner
      note), then calls `POST /api/kernel/reset` with no body. While a reset runs, Run (button and Shift+Enter) and
      Run all are disabled. A reset that fails (503 or any error other than 401) leaves a "Retry reset" control that
      calls the reset again. Design pass: "Run all" is a ghost button with the play icon (an app-owned inline SVG,
      `aria-hidden`; the library has no play glyph) in the lesson toolbar; "Reset kernel…" is an item of the toolbar's
      "More" menu (a ghost icon button with an app-owned "more" SVG and the accessible name "More lesson actions",
      opening the library `Menu`, which ships in the lazy lesson-route chunk, not the initial one), shown in the danger
      colour, still opening the same dialog; "Retry" and "Retry reset" stay visible toolbar buttons when they apply. [unit] the menu item opens the
      dialog, no solid button in the toolbar; [story]
  - id: FR-NOTEBOOK-8
    text: >-
      Notices, closes and the single reconnect procedure (VEC-NOTEBOOK-2 has a case for each row).
      A lost event marks the in-flight cell `lost` (outputs kept), returns client-queued cells to `idle` and frees the
      slot. Table — notice `timeout` (parent = in-flight): marker `timed_out` on the cell; the slot stays until the
      execute_reply (final state `timed_out`) or, when the relay's reset follows (SRV-KERNEL FR-KERNEL-10), the lost event
      of `kernel_reset` or of the close after it, which then frees the slot; an execute_reply that arrives for a cell no
      longer in flight is ignored; `output_truncated`: a note on the cell, nothing else;
      `busy` or `rejected` whose parent is the in-flight execute: lost event; with another parent: a notice only;
      `kernel_restarted`: lost event, socket and session kept; `kernel_reset`, `kernel_dead`, `kernel_unavailable`:
      lost event, then the close that follows decides. Close (any close the client did not start is a lost event first)
      — 4401: navigate to `/api/auth/signin`; 1013: state `unavailable`, no automatic reconnect, Retry or the next Run
      creates the session again; 1000, 1003, 1009, 1012: forget the session, the next Run creates it again (no
      automatic reconnect); 1006, 1011 and any other code, and a socket that fails before opening: reconnect after 1, 2
      and 4 s (structural: three tries cover a container restart, measured 0.2–3.3 s by SRV-KERNEL's review), where each
      try first calls `POST /api/kernel/sessions` for the lesson (idempotent: it returns the existing session, or creates
      a new one after an api restart) and then opens the WebSocket of the session it returns; after the third failed try
      (a failed POST counts), a lost event, then state `disconnected` with Retry, which runs the same procedure (Retry
      after `unavailable` too); a 401 from a try's POST is a lost event and navigates to sign-in, with no further try
      (a Run queued during the reconnect returns to `idle` in both cases). The `disconnected` notice says the lesson may be
      open in other tabs (SRV-KERNEL refuses a third connection, which a browser sees as a failed connection).
      HTTP results — `POST /api/kernel/sessions` (on Run and in every reconnect try): 401 navigates to
      `/api/auth/signin` (an expired session at the WebSocket upgrade shows only as 1006, so this call is how the client
      reaches sign-in instead of retrying); 409 `too_many_kernels` shows "too many open lessons; close one or reset" and
      the Run is not queued; 502 `kernel_upstream` or 503 `kernel_unavailable` shows its catalogue message, the Run is
      not queued, and the next Run tries again (during a reconnect it counts as a failed try). `POST …/interrupt`: 404
      means the session is gone and is a lost event (the session is forgotten and created again on the next Run); 401
      navigates to sign-in; 502 or 503 shows its message. `POST /api/kernel/reset`: 401 navigates to sign-in; 503 shows
      "kernel unavailable" with Retry. Every notice text comes from WEB-UI's fixed catalogue. [unit]
  - id: FR-NOTEBOOK-9
    text: >-
      Lab code is editable in the editor described below; until the editor has loaded, and if it cannot load, in a
      plain monospace text area (Tab inserts four spaces; the edited source lives in memory for the open view and is
      what Run sends); a Revert control restores the revision's source. A cell shows its
      execution count `[n]` after a reply. The text area does not wrap lines (`wrap="off"`, horizontal scroll), so
      Python indentation stays readable at 390 px; the run state label is in a `role="status"` element, so a screen
      reader hears "done", "error" and the other states of VEC-NOTEBOOK-2. [unit] [story]
      **Design pass (owner decision 2026-11-23: CodeMirror 6, lazy):**
      - **Block.** A lab is a wide block (WEB-UI FR-UI-10) with `--radius-block` and a `--acme-border` border: a header
        row — "Python · Lab <n>" (n as in FR-NOTEBOOK-11), the execution count `[n]` and the run state (`role="status"`)
        muted, then at the end "Copy" (ghost, `CopyIcon`), "Revert" (ghost, disabled while the code equals the
        revision's source), "Interrupt" (outline, only while running) and "Run" (solid, the app-owned inline SVG play
        icon, `title` "Run (Shift+Enter)") — then the editor, then the outputs inside the same block. Copy writes the editor's current text
        with `navigator.clipboard.writeText`; on success the button's text reads "Copied" for 2 s (structural) and a
        visually hidden `role="status"` says "Code copied"; on failure it says "Copy failed".
      - **Editor.** CodeMirror 6 (state, view, commands, language, lang-python, lezer highlight; REF-NOTEBOOK-6), loaded
        as a lazy chunk on the lesson route the first time a lab is rendered. Until it has loaded, and if it fails to
        load, the plain text area above is shown with the same source and rules, so a lab can always be edited and run.
        When the editor replaces the text area while it has focus (the user started typing before the chunk
        arrived), the editor takes the text area's current text and receives focus (code review).
        The editor is mounted in an open shadow root with `EditorView({root})` (REF-NOTEBOOK-7: in the document,
        style-mod injects a `<style>` element that the app CSP blocks and the editor renders unstyled; in a shadow root
        it uses an adopted stylesheet); its theme is `EditorView.theme` over `var(--acme-…)` and `var(--acme-font-mono)`
        at 0.875rem with line height 1.55, and its highlight style maps lezer tags to the same Calm colour variables as
        WEB-RENDER FR-RENDER-4's Shiki themes, so it follows the theme (WEB-UI FR-UI-16) without re-mounting. Line
        numbers; no line wrapping (horizontal scroll inside the editor); the editor grows with its content (no row cap,
        the slice's 24-row text area scrolled inside itself); a 4-space indent unit; Tab and Shift+Tab indent and
        dedent (`indentWithTab`), Escape then Tab moves focus out of the editor (CodeMirror's rule, stated in a visually
        hidden hint "Press Escape, then Tab, to leave the editor."); Shift+Enter and Mod+Enter run the lab with the
        editor's text; the content element, and the fallback text area, have the accessible name "Lab <n> code".
        **Accessibility inside the shadow root (review):** `aria-describedby` does not cross a shadow boundary, so the
        hint element is rendered inside the same shadow root and the content element's `aria-describedby` names its id
        there; the content element keeps CodeMirror's `role="textbox"` and `aria-multiline="true"`; the 2px
        `--acme-focus` outline on the focused editor (WEB-UI FR-UI-10) is declared in the editor's `EditorView.theme`,
        since app.css does not reach into the shadow root. The edited text lives in memory for the open view as
        before; Revert replaces the editor's text with the revision's source.
        **Inserted text (live fix 2026-11-24).** When typed or inserted text replaced a selection across highlighted
        spans, Chromium's contenteditable engine wrote markup with a `style` attribute, which the app CSP blocked and
        reported (`style-src-attr`, 7 per learner session). Only that case is taken over (narrowed in code review,
        2026-11-24): a `beforeinput` of type `insertText`, outside a composition, while some selection range is
        non-empty, is applied as a CodeMirror transaction and its default prevented — on the event's
        `getTargetRanges()` when it has any (mapped with `posAtDOM`; a platform edit such as macOS's double-space
        period targets a range that is not the selection), else on the selection. Caret-only typing, composition (IME)
        and `insertReplacementText` (text replacement, spelling) are left to CodeMirror and the browser. [browser]
        e2e/web/notebook/editor.spec.ts with synthetic `beforeinput` events: a caret-only insert is not taken over;
        over a selection an `isComposing` insert and an `insertReplacementText` are not taken over; an insert with a
        target range lands on that range; one without lands on the selection; a real insertion over a selection
        leaves zero CSP reports; WEB-UI INV-UI-4's e2e/web/ui/csp.spec.ts also inserts and types over a selection.
        [manual] on the owner's Mac, two spaces typed in the editor become ". " when the system setting is on
        (recorded in docs/progress.yaml `owner_notes`).
      The lesson view takes the chunk loader as an optional prop `loadEditor` (default: the lazy import of
      `web/src/notebook/editor.ts`), so tests and stories can hold it pending, fail it or hand in a stub editor; the
      chunk exports `mountEditor(host: HTMLElement, {doc, label, onChange(text), onRun(text)})` returning
      `{setDoc(text), focus(), destroy()}`; it attaches the open shadow root to `host` and mounts the editor there.
      [unit] the block header (texts, which buttons are visible in each run state, Revert disabled until an edit, Copy
      with a stub clipboard: written text, "Copied", the status texts, failure), the fallback text area before the chunk
      resolves and after it rejects, Shift+Enter and Mod+Enter calling `run` with the edited text through the editor
      component's key handler; [browser] under the production CSP, a lab renders the CodeMirror editor with no
      `securitypolicyviolation`, `.cm-gutters` computed `display: flex`, `.cm-content` with `role="textbox"` and an
      `aria-describedby` that resolves inside the shadow root to the hint, a focused editor with a 2px outline, an axe
      run that includes the lab block with no serious or critical issue, typing a line holding `j k / ?` lands in the
      editor (no lesson shortcut fires: focus stays in the editor, `#tutor` stays hidden, no dialog opens), then
      Shift+Enter sends the edited code (stubbed relay), and Escape then Tab moves focus out of the editor; [story] a
      lab idle, running with Interrupt, done with output, Dark.
  - id: FR-NOTEBOOK-10
    text: >-
      Kinds whose content lives in `metadata.reader` (ADR-0004), shown as plain text after the cell's source (the live
      L02 had 8 recall cells and a notes cell with empty sources that rendered as bare labels, and a diagnostic cell
      whose questions were not shown; live run 2026-11-23): `diagnostic` lists `questions[]` (each a string or an
      object with a string `text`) as an ordered list, unless every question text already occurs in the source;
      `recall` shows its source when non-empty, otherwise `front`, and a string `back` as plain text (never markdown)
      inside a native disclosure (`details`/`summary` "Show answer"), closed by default, and no disclosure when `back`
      is not a non-empty string; `notes` with an empty source shows "Notes are not saved in this version." in the
      muted colour. Values of any other type are ignored. Declared deviation: the disclosure is the native element,
      not the library's collapsible (`details` is keyboard- and screen-reader-operable without script, and a card's
      answer needs no animation). This is display only: diagnostic routing and recall review stay deferred.
      **Recall deck (design pass; L02's 8 recall cells were 8 full-height cells in a row):** each run of adjacent recall
      cells renders as one deck: a `section` (class `recall-deck`) with the heading (`h2`, sans) "Recall cards (<n>)" and a toggle button
      "Show all answers" / "Hide all answers" (it opens or closes every card's disclosure in the deck; shown only when
      at least one card has a `back`), then the cards in a grid (two columns at 40rem and wider, one below), each card
      a block (`--radius-block`, `--acme-border`) holding the front and its "Show answer" disclosure. Each card keeps
      its cell's `id="cell-<id>"`, `data-cell-id` and `tabIndex={-1}`, so the contents entry "Recall cards (<n>)" and the
      tutor's focused cell work as before. [unit] adjacent runs become one deck, non-adjacent runs separate decks, the
      count, the toggle both ways and its absence, card ids; [story]
  - id: FR-NOTEBOOK-11
    text: >-
      Lesson navigation for a long lesson (L02: 27 cells, about 17,000 px at 1280 px; live run 2026-11-23). The lesson
      header holds the breadcrumbs (the library `Breadcrumbs`, a `nav` labelled "Breadcrumb": "Lessons" → `/`, the
      course title → `/#course-<course_id>`, then the lesson title as the current page with `aria-current="page"`;
      the course title comes from `GET /api/lessons/{lesson_id}`), the title (`h1`) on its own line, then one row
      with the open-findings link, "Ask the tutor" (SRV-TUTOR FR-TUTOR-11) and the kernel controls (FR-NOTEBOOK-7). A contents list (`nav` labelled "Lesson contents", inside the page's `main`, before
      the cells) is built from the cells, in order: one entry per markdown cell, other than recall and open cells,
      whose source has a top-level heading (a direct child of the document root, so not inside a list or a block
      quote) of depth 1–3 in its markdown parse (remark with GFM and math, as WEB-RENDER FR-RENDER-2): the first such
      heading whose plain text, with whitespace collapsed and trimmed, is not empty; emphasis, code and link markup are
      gone, raw HTML contributes no text, and a `#` line inside a code fence or in a code cell is not a heading. Each
      lab cell is "Lab <n>", numbered from 1 in lesson order; one entry "Recall cards (<n>)" at the first recall cell,
      however many there are; one entry "Open questions (<n>)" at the first open cell whose status is not `answered`,
      counting only those; and "Ask the tutor" when the panel is available. With no entry at all, neither the list nor
      the "Contents" button is rendered. Every entry is an in-page link to `#cell-<id>` (the panel: `#tutor`, whose
      activation opens the tutor panel and focuses its text area, SRV-TUTOR FR-TUTOR-11); the list is
      an `ol` with `role="list"` (its list style is none, which drops the list role in WebKit);
      every cell container has `tabIndex={-1}`, so following an entry moves focus there. At a viewport of 60rem or
      wider the list is a sticky column beside the cells, at most the viewport height tall and scrolling inside itself
      (`max-height: calc(100vh - <top offset>)`, `overflow-y: auto`), and the "Contents" button is not displayed;
      below 60rem the list is not displayed (`display: none`, so its links are neither in the tab order nor in the
      accessibility tree) until the "Contents" button (`aria-expanded`, `aria-controls`) opens it, and following an
      entry closes it.
      **Design pass (2026-11-23; every item below was approved by the owner with the audit's P1 and P2 list — the
      current section, the cell toolbar and the recall deck (FR-NOTEBOOK-10) as part of the P2 navigation and
      component items, the keyboard shortcuts as the cheap P3 the owner allowed):**
      - **Current section.** While the lesson scrolls, the contents entry of the last entry target whose top has passed
        30% of the viewport height (an `IntersectionObserver`; the first entry before any has) carries
        `aria-current="location"` and the `--acme-hover` fill with the text in `--acme-text`; exactly one entry is
        current at a time.
      - **Cell toolbar.** Every cell other than a lab (whose block header has its own actions) has a toolbar at its
        inline end, revealed on hover and on `:focus-within` and always shown under `(hover: none)`. A markdown cell's
        toolbar has "Copy" (ghost icon button, accessible name "Copy cell text"; writes the cell's markdown source with
        `navigator.clipboard.writeText` and announces "Cell text copied" in a visually hidden `role="status"`) and
        "Ask"; a non-lab code cell's toolbar has only "Ask" (its code block header already has "Copy code",
        WEB-RENDER FR-RENDER-4). "Ask" (accessible name "Ask the tutor about this cell") focuses the cell, so the
        tutor's "About:" names it, and opens the tutor panel. **Tab order (review: 27 cells must not add 54 tab
        stops):** the toolbar's buttons have `tabIndex={-1}` until focus is inside their cell (the cell itself focused
        by `j`/`k` or a contents link, or one of its controls), then `0` (roving), so Tab from a focused cell reaches
        its toolbar and the rest of the lesson's tab order is unchanged.
      - **Tutor panel state.** The lesson view owns the tutor panel's open state (SRV-TUTOR FR-TUTOR-11) and passes
        `{open, close}` as the third argument of the `aside` render prop, after the focused cell's id and label; the
        toolbar's "Ask the tutor" (ghost), the contents entry, a cell toolbar's "Ask" and `/` set it open.
      - **Keyboard shortcuts.** One `keydown` listener on the document while the lesson page is shown. **Guard
        (review B4):** no shortcut fires when the event's `defaultPrevented` is set, when Ctrl, Alt or Meta is held, or
        when the event's composed path (`event.composedPath()`, which crosses the editor's shadow root) contains a
        `textarea`, an `input`, a `select`, an element with `isContentEditable` (the editor's content), or an element
        with `role="dialog"`, `role="menu"` or `role="alertdialog"`. Otherwise: `j` and `k` focus the next and previous
        cell (`tabIndex={-1}` targets, scrolled into view), matched by `event.code` `KeyJ` and `KeyK` so they work on a
        Russian layout (where those keys type "о" and "л"); `/` (`event.key` `/`, or `event.code` `Slash` without Shift,
        which types "." on a Russian layout) opens the tutor panel and focuses its text area; `?` (`event.key` `?`, or
        `event.code` `Slash` with Shift, "," on a Russian layout) opens a dialog "Keyboard shortcuts" listing these keys, Shift+Enter (run a
        lab), Ctrl+Enter or ⌘+Enter (ask the tutor) and Escape (close a panel or dialog); a handled key calls
        `preventDefault`.
      [unit] [story] the current-section rule with a stub `IntersectionObserver` (one current entry, moves with the
      reported targets), the toolbar's buttons, copy text, code-cell toolbar without Copy, the roving tab index, each
      shortcut, `j`, `/` and `?` matched by `code` with Russian-layout `key`s, `/` calling `preventDefault`, shortcuts
      ignored inside a text area, an input, a select, a contenteditable, with Ctrl, Alt or Meta, with
      `defaultPrevented`, inside a `role="menu"` or `role="alertdialog"` element and while the shortcuts dialog is open;
      [live] the `ui` step: at 390 px the nav's links are hidden before the toggle and visible after
      it; at every width following the last entry, whose target is not in the viewport before the click, scrolls to that
      target and focuses it; at 1280 and 1024 px the button is hidden and the nav is visible; after the scroll exactly
      one entry has `aria-current="location"` (at 390 px read after reopening the contents: following an entry closes
      them, and a hidden nav has no accessible role, so the live run counted 0 on 2026-11-24 although the marker was
      set); the last section entry is the last entry that is not "Ask the tutor" (`#tutor` opens the panel); the
      breadcrumb's current item reads L02's title.
  - id: FR-NOTEBOOK-12
    text: >-
      Lesson page states, inside WEB-UI FR-UI-11's single `main`: while the lesson or its revision loads, a page
      container holding a `role="status"` element with the visually hidden text "Loading the lesson" (no `aria-busy`,
      which would make screen readers skip the status) and the library's `Skeleton` (title and three text lines),
      hidden from assistive technology; a 404 for the lesson shows "Lesson not found" with only a "Back to
      lessons" link; any other error shows "The lesson could not be loaded." with a Retry button that refetches the
      failed query and a "Back to lessons" link; a lesson not published yet shows FR-NOTEBOOK-1's not-published page
      (its sentence and its default chip both say "not published yet"; the chip's text is exactly "Not published yet").
      Design pass: the not-found and error states render through WEB-UI FR-UI-11's `StateBlock` (their texts above as
      its `h1`, in the sans page-title style, with the explanation lines "The lesson may have been removed or the link
      is wrong." and "Check the connection, then retry." respectively).
      **Owner's compile state (WEB-UI FR-UI-15).** For a user with role `owner` (from `/api/me`), the lesson page,
      published or not, reads `GET /api/lessons/{lesson_id}/compile` once (and polls it per FR-UI-15 while the run is
      `running` or `stalled`), because a revision exists from the `draft` step on, long before the run ends. The control
      renders through WEB-UI FR-UI-6's compile slot (merge of V/design-pass, 2026-11-24: one control, not two):
      - not published: FR-UI-15's `CompileControl` as the slot's `Status` in the not-published page's status `div`,
        always (status, "Compile" or "Retry", the same confirm, error copy and polling);
      - published, while the run is `running`, `stalled`, `stage_failed` or `budget_exhausted`: the same control in a
        line above the lesson view, inside the page, led by the chip "draft, compile not finished"; for no run,
        `converged` or `open_findings`, or a failed read, nothing is added;
      - when the control invalidates `['lesson', id]` and the refetched lesson has a newer `latest_sha256`, the page
        loads that revision and renders it.
      A learner's page is unchanged and makes no compile or estimate request.
      [unit] [story] the page states; [unit] web/src/notebook/compile.test.tsx: owner not published (button, confirm,
      the revision rendered after the status reports one), owner published with a running and with a stopped run
      (chip, status, Retry above the cells), owner published and converged (nothing added), learner (no control, no
      compile request); [story] LessonPage's not-published and published-with-a-running-compile states for the
      owner.

invariants:
  - id: INV-NOTEBOOK-1
    text: >-
      For any sequence of user actions, relay messages, notices and closes (including unknown parents, duplicate and
      late replies, frames from a socket that is no longer current, notices for unknown cells and closes before open):
      at most one execute_request is in flight per session; the slot is freed only by the matching execute_reply or a
      lost event; every sent execute_request reaches exactly one terminal state (done, error, interrupted, timed_out,
      not_run or lost) and never leaves it; no event of a non-current socket changes any state; nothing is sent on a
      socket that is not open; every sent message is on channel `shell` with `allow_stdin: false` and the header shape
      of FR-NOTEBOOK-5; and every cell is always in one of VEC-NOTEBOOK-2's states. [unit, property-based with
      fast-check: after every step the client's cell states equal those of a reference model of FR-NOTEBOOK-5 and
      FR-NOTEBOOK-8 (FIFO order, Run-all groups cancelled on any error reply, lost events), over actions that include
      failures of the session POST (401, 409, 502, 503) on Run and in reconnect tries and an interrupt answered 404;
      the fake socket throws on any send before it opened or after it closed]
  - id: INV-NOTEBOOK-2
    text: >-
      Output text from the kernel, error tracebacks, citation fields and notice parameters are only ever rendered as
      text or through WEB-RENDER's components (never as HTML in the app document): a canary `<img src=x onerror=...>` in
      stream text, `evalue`, `traceback`, `material_title` and a `finding.reason` appears as literal text. [unit]
  - id: INV-NOTEBOOK-3
    text: >-
      The client adds nothing of its own to the WebSocket handshake: no subprotocol, no query string; the browser
      sends the session cookie and Origin. [unit]

nfr:
  - id: NFR-NOTEBOOK-1
    metric: >-
      gzip size in bytes (Node zlib, level 9) of the lazy chunks that hold CodeMirror (every chunk of the `vite build`
      output whose source map lists a `@codemirror/` or `@lezer/` module), production mode; none of those modules is in
      the initial chunk (WEB-UI NFR-UI-1 unchanged). Spike codemirror-bundle (REF-NOTEBOOK-7, esbuild, 2026-11-23):
      125,244 B; threshold = measured + 10 %. Green re-measures with Vite and records the number in the review. The
      test shares WEB-UI's build test production build (`build.sourcemap: 'hidden'`, review), finds the chunks through
      their source maps, asserts at least one exists and none is referenced by `index.html`, and sums their gzip sizes.
    threshold: 137768
    verified_by: test

