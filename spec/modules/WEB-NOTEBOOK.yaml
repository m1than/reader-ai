# ---- Proposed revision (2026-11-28, V/kl-r3-gates; approved by agent 2026-11-28, r3_gates_revision): SRV-INGEST FR-INGEST-40 gate (h). Found on
# V/slice-integration (83e1831): citations.ts `materialOf` takes the part before the last `:`, so a locator
# `spn:<sha>:p70:0-120` groups as material `spn:<sha>:p70` and every page becomes its own entry ("source spn:bfaf…").
# Only the grouping key changes; the "(source removed)" / "(source changed)" state labels of SRV-INGEST's cross-spec
# note need the resolver's state in the lesson response and are not part of this gate (recorded in `defers` with
# their trigger; deep-reviewer round 1, 340bc02). The fix also corrects a live bug: SRV-SEARCH already cites
# locators for legacy packs (reader/search/store.py), so the tutor's Ask panel, which shares this grouping
# (FR-TUTOR-11), shows each cited page of a search hit as its own "source spn:…" entry today.
proposed_revisions:
  - id: FR-NOTEBOOK-2
    text: >-
      As approved, with the material of a span citation defined by SRV-INGEST FR-INGEST-33's forms: a `span` that
      matches `^spn:([0-9a-f]{64}):` (a locator; SRV-LESSON's schema has already checked its whole form) has the
      64-hex field as its material; any other `span` keeps the approved rule (the part before the last `:`, or the
      whole span without `:`; for a legacy `<sha>:<seq>` that is the sha). So a lesson whose citations mix legacy ids
      and locators of one material shows one entry for it, its pages merged. `lessonTitles` uses the same key, so a
      title found on a legacy citation names the material's locator citations too. A `quote_sha256` on a citation is
      not shown. The shared grouping function (FR-TUTOR-11's Ask panel) changes with it.
    tests_planned:
      - "add to web/src/notebook/citations.test.ts [unit]: locators on pages 69, 70 and 75 of one material (synthetic 64-hex sha) → one entry \"<title>, pp. 69–70, 75\"; a legacy id and a locator of the same material → one entry with both pages; locators of two materials → two entries in first-use order; an empty-span locator (`:p3:40-40#0`) counts page 3; the fallback title of a locator-only material is \"source <first 8 hex of the sha>\", not \"source spn:…\"; a title on a legacy citation is used for the locator citations of its material (lessonTitles); `spn:` followed by fewer than 64 hex keeps the approved last-colon rule"
      # VEC-NOTEBOOK-1 (W01) is unchanged: the unit cases above carry their own synthetic citations.

