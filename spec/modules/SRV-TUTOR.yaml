# SRV-TUTOR — answer a learner's question about the open lesson from the material's spans, with citations checked by
# code. Slice subset (V.TUTOR-min, docs/roadmap.md "Vertical slice first", V8); the stage-6 SRV-TUTOR row adds what
# `defers` lists. One spec for the server module and the web Ask panel.
#
# Design (agent, 2026-11-22; deep-reviewer round 1 applied):
#   - The api cannot reach agent-proxy (ADR-0025: only the worker does). A question is a job: the api commits a
#     `tutor_questions` row, then enqueues `tutor.answer`; the worker retrieves, calls the SRV-AGENT Provider port once,
#     validates and stores the answer; the browser polls.
#   - No SSE in the slice: the answer is validated as a whole (quotes and ids checked by code, INV-TUTOR-2) before
#     anything is shown, so a token stream would show unchecked text. SSE and first-token p95 ≤ 3 s are in `defers`.
#   - Grounding is enforced by code: each block names short source aliases (s1…s8, mapped by code to span ids) and
#     carries a verbatim quote that must occur in the first named source. The model cannot forge an id (it never sees
#     one) or a quote (code checks it). Entailment (does the quote support the block's claim?) is not checked in the
#     slice (`defers`).
#   - Thinking: the compile spike's Sonnet stages printed 113–2,134 characters but spent 4,601–6,617 output tokens
#     (REF-TUTOR-6), so extended thinking dominates output by default. The tutor turns thinking off (cross-spec
#     SRV-AGENT) and caps output at a provisional 2,000 tokens until spikes/tutor-call measures it (REF-TUTOR-7).
#   - Spend: reserves count every byte sent (tokens ≤ UTF-8 bytes) plus the CLI's own system prompt; caps derive from
#     that worst case (VEC-TUTOR-3, computed by the test, not pinned).
#   - Model: reader.yaml `tasks.tutor.model` (example: `sonnet`), resolved to a full id by SRV-AGENT before any spend.
#   - Citation display: page and span id come from `material_spans`; `material_title` is the lesson's course title
#     (SRV-LESSON `courses.title`, the course bound by `courses.material_sha256`), because materials have no title
#     column (SRV-INGEST, SRV-CONFIG). Nothing in a citation comes from model text.
#   - ADR-0005, ADR-0010 and ADR-0017 are `status: proposed`; SRV-AGENT is a draft in review (V/V.COMPILE-min).
#     SRV-TUTOR's approval waits for SRV-AGENT's.
#
# Cross-spec requirements (paired changes):
#   - SRV-AGENT: (a) the Provider port takes the caller's cap scope — `run_id` = question id with run cap
#     `question_cap_usd`, and a per-user daily scope for task `tutor` (`spent(user, task=tutor, UTC day)`), refused
#     before the reserve row with `budget_exhausted` / `daily_budget_exhausted`; (b) the port can turn extended thinking
#     off per task (`MAX_THINKING_TOKENS=0` in the CLI environment for task `tutor`); (c) the reserve counts the system
#     prompt plus the user prompt, in UTF-8 bytes as an upper bound on tokens; (d) a `max_tokens` stop reason maps to
#     the permanent code `output_truncated`; (e) a settlement above its reserve logs WARNING `reserve_exceeded`;
#     (f) the adapter exposes the CLI's `api_retry` messages and accepts a per-call deadline, so the tutor can abort on
#     the first retry (FR-TUTOR-7); an aborted call with no 2xx settles at $0.
#   - SRV-EVENTS: KIND_MODULES lists `reader.tutor.jobs`; job kinds may declare a `priority` (FR-EVENTS-1 amendment),
#     used by `tutor.answer` to run before queued compile stages.
#   - SRV-AUTH: ROUTERS lists `reader.tutor.routes`; VERSION_LOCATIONS lists `reader/tutor/migrations`;
#     `tutor_questions` is a non-system table for INV-AUTH-8.
#   - WEB-NOTEBOOK: the lesson view mounts `web/src/tutor/AskPanel` and passes the focused cell id.
#   - SRV-INGEST: read helper `spans_by_ids(conn, owner_id, span_ids)`; until it exists this module reads
#     `material_spans` directly (read-only).
#   - V.cost-optimize: the tutor's prompt cache shape (the CLI system prompt warm in the 1-hour cache) and output caps
#     are inputs to that task's measurements.

id: SRV-TUTOR
title: Tutor (slice) — questions about the open lesson, answered by one model call from retrieved spans, citations and quotes checked by code
status: draft
approved_by: null
approved_at: null
layer: server
track: ai
slice: V.TUTOR-min
adr: [ADR-0010, ADR-0005, ADR-0025, ADR-0023, ADR-0026, ADR-0013, ADR-0017, ADR-0006]

paths:
  - server/src/reader/tutor/**
  - server/tests/tutor/**
  - web/src/tutor/**
  - e2e/web/tutor/**
  - spec/fixtures/SRV-TUTOR/**

normative:
  - id: REF-TUTOR-1
    title: "ADR-0010 — learning loop; the tutor is bound to the cell and every factual answer cites a source span"
    url: docs/adr/0010-learning-loop.md
  - id: REF-TUTOR-2
    title: "ADR-0025 — agent sandbox and credential separation: only the worker reaches agent-proxy"
    url: docs/adr/0025-agent-sandbox-and-credential-separation.md
  - id: REF-TUTOR-3
    title: "SRV-AGENT (draft, V/V.COMPILE-min) — Provider port, run_token, reservation/settlement ledger, pricing table"
    url: spec/modules/SRV-AGENT.yaml
  - id: REF-TUTOR-4
    title: "SRV-SEARCH — search(owner_id, query, k, material_sha256) with span ids"
    url: spec/modules/SRV-SEARCH.yaml
  - id: REF-TUTOR-5
    title: "Anthropic API pricing (SRV-AGENT pricing table, as_of 2026-11-03)"
    url: https://platform.claude.com/docs/en/about-claude/pricing
  - id: REF-TUTOR-6
    title: "Spike compile-cost: Sonnet fact-check stages, output tokens vs printed characters"
    url: spikes/compile-cost/RESULT.md
  - id: REF-TUTOR-7
    title: "Spike tutor-call: tutor-shaped calls, thinking off vs default (runner ready; not run yet)"
    url: spikes/tutor-call/RESULT.md
  - id: REF-TUTOR-8
    title: "Spike agent-proxy-handshake round 2 (V/V.COMPILE-min): the CLI retries 429/529/500 about 10 times over ~3 min, emitting api_retry"
    url: spikes/agent-proxy-handshake/RESULT.md

bounds:
  question_chars_max: 1000      # structural: one question; the same bound as SRV-SEARCH's q
  question_bytes_max: 3000      # UTF-8 bytes; 1000 characters of Cyrillic are ≤ 2000 bytes, emoji ≤ 4 bytes each
  retrieve_k: 8                 # structural: 8 sources fit prompt_bytes_max with span_bytes_max each
  span_bytes_max: 2000          # structural: a span's text cut at the last whitespace within 2000 bytes, hard cut if none
  cell_bytes_max: 4000          # structural: the focused cell's source text, cut the same way
  prompt_bytes_max: 24000       # user prompt: question + cell + 8 sources + JSON overhead (3000 + 4000 + 16000 + 1000)
  system_bytes_max: 4000        # the versioned system prompt file; a test asserts its size
  quote_words: [5, 30]          # structural: a verifiable excerpt, short enough not to copy the source wholesale
  spans_per_block_max: 3        # structural
  blocks_max: 20                # structural
  block_chars_max: 4000         # structural
  max_output_tokens: 2000       # PROVISIONAL until spikes/tutor-call (thinking off); fallback 8000 if thinking cannot
                                # be turned off (REF-TUTOR-6 measured 4.6–6.6k output tokens with thinking on)
  attempts_max: 2               # one retry for transient provider errors
  question_cap_usd: 0.35        # derived by VEC-TUTOR-3: ≥ attempts_max × worst-case reserve (2 × 0.1592), rounded up
  daily_cap_usd: 3.00           # structural, per user per UTC day for task tutor; the api pre-checks it
  question_ttl_s: 600           # a question older than this is expired, never answered (covers a wait behind one
                                # running compile stage; REF-TUTOR-6 stages took ≤ 190 s each)
  stale_without_job_s: 60       # a queued row with no job for this long is finalised `lost`
  call_deadline_s: 20           # structural: bounds a stuck or retrying call far below the CLI's ~3 min of retries
                                # (REF-TUTOR-8); one healthy attempt fits NFR-TUTOR-1's 30 s p95
  job_timeout_s: 120            # structural: one CLI turn of ≤ 2000 output tokens
  poll_backoff_ms: [1000, 2000, 5000]  # web: then 5000 until a terminal state or the deadline
  poll_deadline_s: 630          # question_ttl_s + 30 s
  history_max: 50               # list size

tables:
  tutor_questions: { owner_id: true, columns: "id uuid pk, owner_id → users.id, lesson_id uuid, revision_sha256 text, cell_id text null, question text CHECK (1..1000 chars), state text CHECK in (queued, answered, failed, refused, expired), answer jsonb null, grounded bool null, error_code text null, model text null, created_at, finished_at null; FK (lesson_id, owner_id) → lessons (id, owner_id); FK (lesson_id, revision_sha256) → lesson_revisions (lesson_id, sha256); UNIQUE (owner_id) WHERE state = 'queued'; index (owner_id, lesson_id, created_at)" }

errors:                         # fixed catalogue, shared by api, worker and web (VEC-TUTOR-5); unknown codes → tutor_failed
  [question_invalid, cell_unknown, unknown_revision, not_found, tutor_busy, daily_budget_exhausted, budget_exhausted,
   sources_unavailable, output_invalid, output_truncated, provider_unavailable, rate_limited, expired, lost,
   tutor_failed]

requirements:
  - id: FR-TUTOR-1
    text: >-
      Ask. `POST /api/lessons/{lesson_id}/ask` with JSON `{"question": str, "cell_id": str?, "revision": str?}`, `auth:
      session`, body cap per SRV-AUTH FR-AUTH-12. `can_open(user, lesson_id)` false → 404 `not_found` (the body of a
      missing lesson). `question` trimmed must be 1..`question_chars_max` characters and ≤ `question_bytes_max` UTF-8
      bytes, with no NUL and no C0 control other than newline and tab, else 400 `question_invalid`. `revision`
      (default: the lesson's current sha256, SRV-LESSON) must be a revision of this lesson, else 400 `unknown_revision`;
      `cell_id`, when present, a cell of that revision, else 400 `cell_unknown`. The busy check (FR-TUTOR-10) finds a
      live queued question → 409 `tutor_busy`. Daily pre-check: spent(user, tutor, UTC day) + the worst-case reserve >
      `daily_cap_usd` → 429 `daily_budget_exhausted`. Otherwise it commits the row (state `queued`), then enqueues job
      `tutor.answer` with key `[question_id]`; an enqueue error sets the row `failed` / `tutor_failed`. It answers 202
      `{"question_id": uuid}` and logs route, question length and outcome code, never the text. [db]
  - id: FR-TUTOR-2
    text: >-
      Read. `GET /api/lessons/{lesson_id}/questions/{question_id}` returns `{"state", "answer"?, "grounded"?,
      "error_code"?}` for a row of that user and that lesson; another user's row, a row of another lesson, an unknown or
      malformed id → 404 `not_found`. `GET /api/lessons/{lesson_id}/questions` returns at most `history_max` items
      `{"question_id", "question", "cell_id", "state", "grounded", "error_code", "created_at"}`, newest first. Both
      first finalise a stale row (FR-TUTOR-10). [db]
  - id: FR-TUTOR-3
    text: >-
      Job kind `tutor.answer` (SRV-EVENTS FR-EVENTS-1, `reader.tutor.jobs.JOB_KINDS`): args `{question_id}` (extra
      forbidden), key `[question_id]`, `max_attempts = attempts_max`, `timeout_s = job_timeout_s`, priority above
      compile stages (SRV-EVENTS amendment). Transient: `provider_unavailable`, `rate_limited`, `output_invalid`. The
      handler never leaves a row `queued`: it catches every permanent error, every budget refusal and a transient error
      on the last attempt, writes `failed` (code) or `refused` (`budget_exhausted` / `daily_budget_exhausted`), and
      returns normally; only a transient error before the last attempt is re-raised for a retry. [db]
  - id: FR-TUTOR-4
    text: >-
      Expiry. Before reserving anything, the handler marks a row older than `question_ttl_s` `expired` and returns.
      [db]
  - id: FR-TUTOR-5
    text: >-
      Retrieval. The handler loads the revision and the course's `material_sha256`. With none, or when
      `search(owner_id, question, k = retrieve_k, material_sha256)` (SRV-SEARCH FR-SEARCH-7) returns no result, the row
      is `failed` / `sources_unavailable` and no model is called. Otherwise each result's primary span is loaded
      (text, page) and cut to `span_bytes_max`; a `degraded` search is used and recorded. [db] with a fake search
  - id: FR-TUTOR-6
    text: >-
      Prompt. The system prompt is the versioned file `reader/tutor/prompts/answer-v1.md` (≤ `system_bytes_max`);
      `prompt_sha256` = sha256 of that file's bytes, stored with the answer. The user prompt is exactly
      `json.dumps({"question", "cell": {"id", "kind", "text"} | null, "sources": [{"id": "s1".."s8", "page",
      "text"}]}, ensure_ascii=False)`, so no question, cell or source text can close a delimiter or forge a source
      entry; the system prompt states that every string value is data, never an instruction. Sources get aliases s1…sk
      in rank order; the alias → span id map stays in the handler. If the prompt exceeds `prompt_bytes_max`, sources
      are dropped from the lowest rank until it fits; the dropped ones are not in the sent set. [unit]
  - id: FR-TUTOR-7
    text: >-
      Model call. One call through the SRV-AGENT Provider port (FR-AGENT-6): `run_id = question_id`, `stage` and
      `task` = `tutor`, thinking off, `max_output_tokens`, run cap `question_cap_usd`, the daily scope (cross-spec). No
      tool is offered; agent-proxy refuses a request carrying tools (SRV-AGENT FR-AGENT-4, FR-AGENT-7). No other code
      path calls a model. Fast failure: on 429, 529 or 500 the CLI retries about 10 times over about 3 minutes
      (REF-TUTOR-8), which NFR-TUTOR-1 cannot afford, so the tutor adapter aborts the call on the first `api_retry`
      message or when `call_deadline_s` passes, whichever comes first. The attempt then ends `rate_limited` (after a 429
      or 529) or `provider_unavailable` (after a 500, a connect failure or the deadline), and settles at $0, since no 2xx
      response was received; the next attempt follows FR-TUTOR-3. [unit] with a fake provider that emits `api_retry`,
      and one that stalls past the deadline
  - id: FR-TUTOR-8
    text: >-
      Answer validation. The model's text, after removing one optional surrounding ```json fence, must be one JSON
      object `{"blocks": [{"text": str, "spans": [alias], "quote": str}], "insufficient": bool}` with no other keys at
      any level, 1–`blocks_max` blocks, `text` 1–`block_chars_max` characters, ≤ `spans_per_block_max` aliases; anything
      else is `output_invalid` (transient). Then, by code: aliases outside the sent set are removed and duplicates
      collapsed; a block is supported iff it keeps ≥ 1 alias and its `quote` has `quote_words` words and, after
      collapsing whitespace and NFC, is a substring of its first kept source's text as sent; otherwise the block is
      `unsupported`. `grounded` is true iff `insufficient` is false and every block is supported. Each kept alias is
      rendered as a citation `{span, page, material_title}` read from the database (FR-TUTOR-9). [unit]
  - id: FR-TUTOR-9
    text: >-
      Storage. On success the row becomes `answered` with `answer = {"blocks": [{"text", "supported", "quote",
      "citations"}], "insufficient", "retrieval": "ok" | "degraded", "prompt_sha256", "model"}` and `grounded`, written
      as the handler's last statement (SRV-EVENTS FR-EVENTS-4). Ledger rows carry `run_id = question_id`, so a
      question's cost is spent(run). [db]
  - id: FR-TUTOR-10
    text: >-
      Stale rows. The busy check and FR-TUTOR-2 derive a queued row's state from the job: job `dead` → the row becomes
      `failed` with the mapped code (VEC-TUTOR-4); no job and older than `stale_without_job_s` → `failed` / `lost`;
      older than `question_ttl_s` → `expired`. The finalised row no longer blocks `UNIQUE (owner_id) WHERE state =
      'queued'`. [db]
  - id: FR-TUTOR-11
    text: >-
      Web Ask panel (`web/src/tutor/AskPanel.tsx`) in the lesson view: a labelled text area (counter, 1..1000
      characters), Ask (also Ctrl/Cmd+Enter), the history list, and an `aria-live="polite"` region for the answer.
      After Ask it polls with `poll_backoff_ms` until a terminal state, `poll_deadline_s`, a 401 (sign-in) or a 404
      (stop); polling pauses while the page is hidden and resumes when visible; on load, a `queued` history item
      resumes polling. Block text renders through WEB-RENDER's markdown pipeline with links rendered as plain text
      (VEC-TUTOR-6); citations render as "material_title, p. N"; an unsupported block is marked "not supported by the
      source"; `grounded: false` shows "This answer is not fully grounded in the book."; every code maps to a fixed
      catalogue message, unknown codes to `tutor_failed`'s. [unit] Vitest, [browser] Playwright with axe (no serious or
      critical issue in the panel)
  - id: FR-TUTOR-12
    text: >-
      Logging. api and worker log ids, lengths, codes, model, spent(run) and timings; never question, cell, source,
      quote or answer text, and never a run_token (SRV-AGENT FR-AGENT-5). [db]
  - id: FR-TUTOR-13
    text: >-
      DoD hook (V.DOD-index): operation `ask_tutor` declared in `reader/tutor/dod.yaml` with criteria and the test ids
      that prove each — functional (FR-TUTOR-1..10), grounding (INV-TUTOR-2), injection (INV-TUTOR-3), isolation
      (INV-TUTOR-1), cost (INV-TUTOR-5, NFR-TUTOR-2), latency (NFR-TUTOR-1), accessibility (FR-TUTOR-11's axe check).
      [unit] every listed test id exists
  - id: FR-TUTOR-14
    text: >-
      Live: on the stack with L02 compiled and its material embedded, a learner asks a question about an L02 cell in
      Chromium; within `poll_deadline_s` the answer shows ≥ 1 citation "material_title, p. N" whose span exists and
      whose quote is verified, and its ledger cost is ≤ `question_cap_usd`. Spends from `budget.test_budget_usd`.
      [live]

invariants:
  - id: INV-TUTOR-1
    text: >-
      Isolation: a user can ask about, read and list questions only for lessons `can_open` allows; a foreign or unknown
      lesson, a foreign question and a question of another lesson answer exactly like a missing one (status, body,
      header set). [db]
  - id: INV-TUTOR-2
    text: >-
      Grounding by code: for any model output (Hypothesis-generated JSON and text: invented aliases, real span ids,
      ids of other users' materials, quotes absent from the source, malformed shapes), every stored or shown citation
      names a span of the sent set, its page and title come from the database, and a block is supported only with a
      verified quote. [unit]
  - id: INV-TUTOR-3
    text: >-
      Injection (VEC-TUTOR-2, each case with a model output): question, cell or source text that asks to cite unsent or
      sent ids, closes the JSON, rewrites the instructions or requests a tool cannot produce a citation INV-TUTOR-2
      rejects, the prompt JSON round-trips to the same values, and the request carries no tools (asserted at the fake
      Provider; the proxy-side refusal is SRV-AGENT's test). [unit]
  - id: INV-TUTOR-4
    text: >-
      No text leaks: a canary planted in a question, a cell and a span appears in no log record of api or worker (all
      loggers) and in no job args. [db]
  - id: INV-TUTOR-5
    text: >-
      Spend bound: for any sequence of attempts, timeouts, kills and aborts, spent(question) ≤ `question_cap_usd` and
      spent(user, tutor, UTC day) ≤ `daily_cap_usd` plus one in-flight reserve; a settlement above its reserve is
      logged `reserve_exceeded` (a generated case covers it). [db] with a fake provider
  - id: INV-TUTOR-6
    text: >-
      No question stays `queued`: after a timeout, a kill mid-run, a crash between insert and enqueue, or exhaustion,
      the next read or busy check returns a terminal state (FR-TUTOR-10), and a new question can be asked. [db]
  - id: INV-TUTOR-7
    text: >-
      `tutor_questions.owner_id` equals the lesson's owner and `revision_sha256` names a revision of that lesson for
      every row (composite FKs). [db]

nfr:
  - id: NFR-TUTOR-1
    metric: >-
      p95 (nearest rank, 21 samples) seconds from Ask to the answer shown, idle worker, on the bench questions
      (VEC-TUTOR-7) against L02 ([live]); bench spend ≤ 21 × question_cap_usd = $7.35, from budget.test_budget_usd,
      with the daily cap raised for the run only
    threshold: 30
    verified_by: bench
  - id: NFR-TUTOR-2
    metric: mean USD per question over the NFR-TUTOR-1 run (ledger spent(run)); PROVISIONAL until spikes/tutor-call
    threshold: 0.06
    verified_by: bench
  - id: NFR-TUTOR-3
    metric: share of NFR-TUTOR-1 answers with grounded = true
    threshold: 0.8
    verified_by: bench

vectors:
  - id: VEC-TUTOR-1
    source: hand-written model outputs over a sent set of aliases; expected kept citations, quote checks, supported flags, grounded
    file: spec/fixtures/SRV-TUTOR/answers.yaml
  - id: VEC-TUTOR-2
    source: hand-written injection attempts in the question, the cell and a source span, each with a model output
    file: spec/fixtures/SRV-TUTOR/injection.yaml
  - id: VEC-TUTOR-3
    source: cost inputs (SRV-AGENT pricing table, bounds); the test derives reserve, caps and typical cost from them
    file: spec/fixtures/SRV-TUTOR/cost.yaml
  - id: VEC-TUTOR-4
    source: job and row state → question state and error code
    file: spec/fixtures/SRV-TUTOR/status-map.yaml
  - id: VEC-TUTOR-5
    source: the error catalogue with the web messages
    file: spec/fixtures/SRV-TUTOR/errors.yaml
  - id: VEC-TUTOR-6
    source: answer block text with markdown links, raw HTML and images; expected rendering (links and images as text)
    file: spec/fixtures/SRV-TUTOR/render.yaml
  - id: VEC-TUTOR-7
    source: >-
      bench questions: one question per `explain` cell of the compiled L02 revision, in cell order, first 20 cells,
      generated at run time as "Explain in your own words: <cell title>" (the cell titles are not committed; only the
      generator `e2e/web/tutor/bench_questions.py` is), plus questions-v2 `v03` (the only accepted question on L02's
      pages 60–84)
    file: spec/fixtures/SRV-TUTOR/bench.yaml

defers:
  - "SSE token streaming and first-token p95 ≤ 3 s (roadmap stage-6 row): needs a streaming Provider port and per-block validation"
  - "entailment: checking that a verified quote supports the block's claim (an NLI check or a second model pass): stage 6"
  - "ADR-0010 'asks before it tells' (diagnostic first) and 85 % difficulty calibration: stage 6 with SRV-RECALL"
  - "learner notes in the context (no learner state in the slice, SRV-LESSON)"
  - "one-tap answer feedback (useful / wrong / unclear) as a quality signal on the run: stage 6"
  - "URL citations and web search: stage 6+"
  - "a dedicated tutor worker lane so answers never wait behind a running compile stage (worker concurrency 1)"
  - "retention and export of tutor history (ADR-0017 data ownership; SRV-EXPORT stage 7)"
  - "findings from tutor sessions into the knowledge base: stage 7"

owner_notes:
  - "Cost (provisional, VEC-TUTOR-3): typical ≈ $0.028 warm / $0.055 cold per question with Sonnet 5.5; worst-case reserve ≈ $0.16 per attempt; caps $0.35 per question and $3 per user per day. spikes/tutor-call (≈ $0.25–0.60 of the $30 test budget) replaces these numbers; it needs the Keychain token, so the owner runs `bash spikes/tutor-call/run.sh` or extends the spike Keychain permission to it."
  - "While a lesson compile stage runs, a question waits for it (one worker); after 10 minutes it expires instead of being answered late."
  - "An answer says when it is not grounded in the book instead of hiding it."

review: "draft 2026-11-22. deep-reviewer round 1 (bfb7047): changes — B1 thinking/output cap (spike tutor-call written, not run: Keychain permission), B2 no stuck queued rows, B3 byte-based reserve, B4 queue priority and expiry, B5 verbatim quotes and aliases, B6 cost derivation, B7 input checks; non-blocking applied; plus the V7 review item: abort on the first api_retry or after call_deadline_s, settle at $0. Round 2 next; approval waits for SRV-AGENT's."
