proposed_bounds:
  retrieve_k: "removed: the tutor calls find on channel `tutor` with no budget and no k, so SRV-SEARCH policy `channels.tutor.budget_default` sets the response size (data, not code)"
  find_budget: "policy channels.tutor budget_default = budget_max = 10,500 estimator tokens (paired SRV-SEARCH change, from 5,250). Initial until M1, which records the real mean card cost. Estimate: an L1 card costs about 327.5 tokens with an empty title and text, plus (title + text characters) / 2 (reader.search.cards.cost, computed 2026-11-28); the envelope about 142. With ADR-0039's measured span mean (342 bytes, about 180 Cyrillic characters, 90 tokens) and a 40-character section path (20 tokens) a card is 327.5 + 20 + 90 ≈ 437 tokens, so 10,500 tokens hold about 23 spans, about 7.9 KB; their next spans (FR-TUTOR-5) about as much again, about 16 KB, below the 21,000-byte source budget FR-TUTOR-6 still enforces. At 5,250 the tutor would get about 11 spans, about 4 KB: the cut ADR-0039 B8 forbids without a measurement"
  sources_max: "88, kept, never binds: with empty titles and texts at most floor((10,500 − 142) / 327.5) = 31 cards fit, plus one neighbour each, 62 sources; the byte budget binds first"
  span_bytes_max: "2000, kept. The sent text is the stored span (FR-TUTOR-5), not the card's text, so the card's L1 cut (1,200 characters) does not apply to it; for Cyrillic text 2,000 bytes is about 1,000 characters, for ASCII 2,000"

proposed_revisions:
  - id: FR-TUTOR-1
    text: >-
      As approved, plus: the question's NFC form must also be 1..`question_chars_max` code points, else 400
      `question_invalid`, because `find` normalises to NFC before its 1,000-character check (FR-SEARCH-22) and NFC can
      lengthen text (1,000 × U+0958 become 2,000 code points). With that and the lone-surrogate refusal already in
      the ask validation (routes.py), a question the api accepts passes find's input check.
    tests_planned:
      - "change server/tests/tutor/test_tutor_db.py [db]: 1,000 × U+0958 → 400 question_invalid, no row (Red); a lone surrogate → 400 question_invalid (already enforced, pinned, not Red)"
  - id: FR-TUTOR-3
    text: >-
      As approved, except the `tutor.retrieve` child's `candidates` counts the cards `find` returned (no longer
      search results); `hits` still counts the span ids sent.
    tests_planned:
      - "change server/tests/tutor/test_tutor_obs_db.py [db]: candidates = the fake find's card count, hits = the sent span ids"
  - id: FR-TUTOR-5
    text: >-
      **Retrieval through `find`** (ADR-0039 B6, B8). The handler loads the revision and the course's
      `material_sha256`; with none the row is `failed` / `sources_unavailable` and no model is called. Otherwise it
      takes one (policy, version) pair from SRV-SEARCH `policy.current()` and calls `find(caller, "tutor", question,
      deps=Deps(corpus=StoreCorpus(conn, policy, material_sha256), policy=policy, policy_version=lambda: version))`
      (`Deps.policy_version` is a callable, find.py) with no
      budget, no k and no judge_ctx (the channel's default budget from policy), where caller = (the question's
      owner, the owner's role, provider presence from the question's handle); `Deps.judge` is None in this revision
      (kl_open_points 2), so no judge is called and nothing is spent on the judge line, whatever the gate. The
      judge context the Waiter will need ({line `tutor`, run_id the question id, run_cap_usd, lesson_id,
      daily_budget_usd}) is contract-only until then. A `PolicyError` from `current()` or a `FindError` →
      `failed` / `tutor_failed`, no model call. The candidate spans are the ids of the
      response's L1 cards in response order, then, in the same order, each such card's first `next` id that is a span
      locator (`spn:`; the next span in reading order), a span already taken not repeated (VEC-TUTOR-9); so FR-TUTOR-6's
      drop rule drops neighbours before any primary, as with chunks (the 2026-11-23 live run's fact sat in a
      neighbouring span). Non-L1 cards are ignored, and any candidate id that is not a locator (`spn:`) is dropped
      before loading, so it is never sent (fail-closed; FR-TUTOR-8). Each candidate is loaded (page, text, quote_sha256) through
      `store.spans_by_ids`, now over SRV-INGEST's `views.active_span_rows` (active packs only, as approved), and cut to `span_bytes_max`; the card's own text is not
      sent, so the database stays the only source of what is sent and cited. find returns locators only, so the
      legacy-id branch of `spans_by_ids` is unreachable from the handler; it stays for FR-TUTOR-22's never-run case
      and is removed after FR-INGEST-41 has run. No card, or no loadable candidate → `failed` /
      `sources_unavailable`, no model call. `degraded: true` (embed down, or a judge skip such as `error` under a
      test gate) → `retrieval: "degraded"`. The owner's material is `personal-use` and the asker owns it, so
      FR-SEARCH-30 gives the tutor channel full L1 cards cut only at the card budget. The tutor no longer imports
      `reader.search.store`; its `Hit` Protocol, `candidate_span_ids` and `params.RETRIEVE_K` are removed. [unit, db]
    tests_planned:
      - "change server/tests/tutor/test_tutor_unit.py [unit]: VEC-TUTOR-9 (cards → candidate ids: order, dedupe, L0/L2 cards ignored, a `sec:` next ignored, a card without next)"
      - "change server/tests/tutor/test_tutor_unit.py:50 [unit]: the bounds test drops RETRIEVE_K (retrieve_k removed from bounds)"
      - "change server/tests/tutor/test_tutor_db.py:72 [db]: the asserted call is the fake find's (owner, channel tutor, question, no budget, no k, material scope), not search(…, RETRIEVE_K, …)"
      - "add server/tests/tutor/test_tutor_find_db.py [db] (fake embed service, packseed.py): the handler's find call (channel tutor, no budget, no k, no judge_ctx, judge None, one policy pair for corpus and find); a nearer span of the owner's second material is never sent; a span of another owner never sent; empty cards → sources_unavailable with no provider call; FindError(policy_invalid) and a PolicyError from current() → tutor_failed with no provider call; embed down → retrieval degraded; with 29,000 bytes binding, a neighbour is dropped before the last primary; end to end over a sealed r2 pack and over an r3 pack with a fake provider; a test policy with gate always_judge and judge None → no judge_requests row and $0 on the judge line, retrieval degraded"
      - "add server/tests/tutor/test_tutor_unit.py [unit]: the shipped policy.json gate.mode is never_judge while the tutor's default deps carry no judge (fails when either changes alone)"
      - "change server/tests/tutor/test_tutor_chunks_db.py and test_tutor_db.py [db]: the fake search becomes a fake find returning cards"
      - "add server/tests/tutor/test_tutor_unit.py [unit]: no module under reader.tutor imports reader.search.store (source scan)"
  - id: FR-TUTOR-8
    text: >-
      As approved, except each kept alias renders as `{span, page, material_title, quote_sha256}`: `quote_sha256` is the
      cited span's stored hash (SRV-INGEST FR-INGEST-34) loaded with it (FR-TUTOR-5), never computed from model text;
      where the stored column is null, the sha256 of the span's stored text (`locator.quote_sha256`, the rule
      `opening.load_book` applies), returned by the paired SRV-INGEST read. A citation pairs `quote_sha256` only with a
      locator: a citation carrying `quote_sha256` beside a legacy `<sha>:<seq>` id is refused, because the resolver
      discards such a hash (spanref.py `_one`) and FR-INGEST-41 rewrites the id and the hash together. The refusal
      is fail-closed and cheap: FR-TUTOR-5 drops a non-locator candidate before it is sent, so no alias names one.
      This is SRV-INGEST FR-INGEST-40's r3 gate (g). The web reads it as an optional field (`web/src/tutor/api.ts`) and
      does not show it; answers stored before the revision have none until FR-INGEST-41 rewrites them (FR-TUTOR-22).
    tests_planned:
      - "change server/tests/tutor/test_tutor_unit.py [unit]: VEC-TUTOR-1's expected citations carry quote_sha256"
      - "add to server/tests/tutor/test_tutor_find_db.py [db]: a citation's quote_sha256 equals material_spans.quote_sha256 of its span, on an r2 legacy pack (backfilled hashes) and on an r3 pack"
      - "change web/src/tutor/AskPanel.test.tsx [unit]: an answer with and without quote_sha256 validates and renders the same citations"
      - "add to server/tests/tutor/test_tutor_unit.py [unit]: a find response whose card ids or next ids include a legacy <sha>:<seq> id → that id is dropped before loading (the loader never receives it), no alias names it, and no citation carries quote_sha256 beside it"
  - id: INV-TUTOR-2
    text: >-
      As approved, plus: every stored or shown citation's `quote_sha256` equals the hash `views.active_span_rows` returns for the span it names,
      for any model output (the model never sees a hash), and no stored or shown citation carries `quote_sha256`
      beside a legacy `<sha>:<seq>` id. [unit]
    tests_planned:
      - "change the INV-TUTOR-2 Hypothesis property in server/tests/tutor/test_tutor_unit.py, at the check-function level (the citation check over a generated sent set, not the handler): generated outputs, including hex strings in quotes and text, never change a citation's quote_sha256 from the sent span's; with sent sets mixing locators and legacy ids (as the check could receive them if FR-TUTOR-5's candidate filter were bypassed), every citation with quote_sha256 names a locator"
  - id: INV-TUTOR-4
    text: "As approved, with a case through the real find and StoreCorpus path (no fake find): the canary in the question and in a span appears in no log record and no job args."
    tests_planned:
      - "add to server/tests/tutor/test_tutor_find_db.py [db]: INV-TUTOR-4's canary case over the real find (fake embed service and provider)"
  - id: VEC-TUTOR-1
    text: "As approved, except every expected citation in spec/fixtures/SRV-TUTOR/answers.yaml is {span, page, material_title, quote_sha256} with the sent span's hash; the span ids in the fixture become locators."
    tests_planned:
      - "change server/tests/tutor/test_tutor_unit.py [unit]: VEC-TUTOR-1 cases read the new citation shape"
  - id: NFR-TUTOR-1
    text: "As approved; now includes `find` (its own p95 bound is SRV-SEARCH NFR-SEARCH-7). Re-measured by run P1; threshold 30 s unchanged."
    tests_planned: ["bench P1 [live] (paid, the owner's go)"]
  - id: NFR-TUTOR-2
    text: "As approved; the prompt bound (29,000 bytes) is unchanged. Measured mean $0.0267 per question (V.live, 2026-11-23; spec estimate $0.046). Re-measured by run P1; threshold $0.06 unchanged."
    tests_planned: ["bench P1 [live] (paid, the owner's go)"]
  - id: NFR-TUTOR-3
    text: >-
      As approved, threshold 0.8 unchanged; it gates done, the merge and `implemented` (kl_revision.gates; M1
      gates the promotion), except the predictor:
      `gold_in_top8` becomes `gold_in_find`, a gold page among the pages of the L1 card ids (the locator's `p<page>`)
      of `POST /api/find {q, budget: 10500}` on the owner channel, whose route table equals the tutor's and whose
      maximum is the tutor's (zero credit while the gate is `never_judge`); the summary splits grounded by it
      (`grounded_given_gold_in_find`). It omits the tutor's neighbour spans and the material scope (exact while the
      owner has one active material; the bench records the count). M1 measures the exact predictor first.
    tests_planned:
      - "change web/src/tutor/bench.ts and its test [unit]: the record key gold_in_find, the summary key grounded_given_gold_in_find (VEC-TUTOR-8, paired SRV-OBS VEC-OBS-5)"
      - "bench P1 [live] (paid, the owner's go)"
  - id: VEC-TUTOR-7
    text: "As approved, except the predictor read through POST /api/find (NFR-TUTOR-3); e2e/web/live/owner.slice.ts changes with it."
  - id: VEC-TUTOR-8
    text: "As approved, with gold_in_top8 → gold_in_find in the summary keys."

proposed_requirements:
  - id: FR-TUTOR-22
    text: >-
      **Citation rewrite target** (SRV-INGEST FR-INGEST-41, its declared targets). `reader.tutor.citations.REWRITERS`
      declares one `reader.ingest.migrate_citations.Target` over `tutor_questions.answer`: the select returns (id,
      owner_id, answer) of rows whose `answer` is not null, `FOR UPDATE`; the update writes `answer` by id. Cleared rows
      (answer null) are skipped. Data only; the command is SRV-INGEST's. [db]
    tests_planned:
      - "add server/tests/tutor/test_tutor_citations_db.py [db]: an answered row holding legacy ids is rewritten to locators with quote_sha256 by the FR-INGEST-41 command with an accepted map; a cleared row is untouched; a second run changes nothing; with the command never run, the tutor's span load returns the same (page, text) for the legacy and the locator id (SRV-INGEST's planned test_spanref_db.py case, paired)"

proposed_vectors:
  - id: VEC-TUTOR-9
    source: "hand-written find responses (L0, L1, L2 cards; next lists with spn: and sec: ids; repeated spans) → the candidate span ids in order"
    file: spec/fixtures/SRV-TUTOR/find-sources.yaml

proposed_defers:
  - "L5 boost (gaps first) on the tutor routes: inert until learner state exists (S6.SRV-RECALL); the tutor-route sufficiency comparison with and without it is measured then. Learner state is not in brain_version, so tutor responses are traced, not promised to replay (ADR-0039 reproducibility)"
  - "A `judge.find` call from the tutor: the worker-side Waiter, its judge_ctx and its cost in VEC-TUTOR-3 (kl_open_points 2; SRV-SEARCH kl_open_points 5 (c))"
  - "The previous span as a neighbour: `next` names only the following span; M1's variant (d) measures what it would add"

proposed_owner_notes:
  - "The tutor now retrieves through the same find as search: about 23 short passages plus the passage after each, within the same 21,000-byte source budget, so the cost per question does not rise (the last bench measured $0.0267 per question)."
  - "Grounding: to reach your 0.8 target, every one of the 40 bench questions (40 of 40 by the last bench's rates) must get a page with the answer into the tutor's sources. The free check M1 measures that first. The new tutor is built if M1 finds it at least as good as today's tutor and as the old chunks (26 of 40). The paid bench runs only at 40 of 40 or on your explicit go; M1 will probably fall short of that, and then the task stops for your decision (a larger budget, more neighbouring passages, the judge, or the target) before any money is spent."
  - "Deviation from the plan: the plan re-measured grounding before approving the spec, but the paid bench needs the built tutor. Now the free M1 decides whether the spec is promoted and built, and the paid bench (about $1.09 last time, at most $12) decides whether the work is done and merged; it waits for your go."

kl_paired_changes:
  - { spec: SRV-SEARCH, change: "see SRV-SEARCH kl_tutor_find: StoreCorpus material scope; policy.json channels.tutor.budget_default 5,250 → 10,500 (moves policy_version); the tutor's legacy search() call path removed here, search() and POST /api/search removed later" }
  - { spec: SRV-INGEST, change: "see SRV-INGEST kl_tutor_find: views.active_span_rows returns (page, text, quote_sha256), and active_span_texts is its unchanged (page, text) projection; FR-INGEST-40 gate (g) is met by FR-TUTOR-8 and FR-INGEST-41's target by FR-TUTOR-22" }
  - { spec: SRV-OBS, change: "VEC-OBS-5 tutor_record key gold_in_top8 → gold_in_find" }
  - { spec: e2e, change: "e2e/web/live/owner.slice.ts: the tutor-bench predictor through POST /api/find" }

kl_open_points:
  - "1. The 0.8 gate likely fails: by the baseline's rates it needs g ≥ 39.4, i.e. variant (c) of M1 with a gold page in the sources for 40 of 40 questions (chunks gave 26). The build proceeds when (c) is no worse than (a) and than 26 of 40; below 40 of 40 the agent blocks for the owner before P1 (the likely path), unless the owner gives an explicit go."
  - "2. Judge on the tutor channel: not wired (Deps.judge None, no judge_ctx; a [unit] test pins the shipped never_judge gate against the judge-less default deps). Before any gate.mode other than never_judge: a worker-side Waiter (SRV-EVENTS Jobs in the job context) and VEC-TUTOR-3 asserting question_cap_usd ≥ attempts_max × (tutor reserve + judge_find_floor_usd), today 2 × (0.148 + 0.002) = $0.30, no headroom. Recorded as condition (c) of SRV-SEARCH kl_open_points 5 (kl_tutor_find)."
  - "3. The material scope is a Corpus constructor argument, not a request field, so it is not in find's request hash (the pivot seed). Harmless only while Links is empty and no response is cached: the scope must enter the hash before SRV-KB's links or any response cache keyed by that hash."
