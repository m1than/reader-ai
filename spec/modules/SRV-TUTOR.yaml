  - id: FR-TUTOR-20
    text: >-
      **Clear history.** `POST /api/lessons/{lesson_id}/questions/clear` with `{}` (any reader who can open the
      lesson; their own questions only) sets, for each of the caller's questions on that lesson that is not
      `queued`, `question = ''`, `answer = null`, `cleared_at = now` in one transaction; `state`, `model`,
      `error_code`, timestamps and every agent_spend row stay. While the caller has a `queued` question on that
      lesson → 409 `tutor_busy` and nothing changes. 200 `{cleared: n}`; repeating it returns `{cleared: 0}`.
