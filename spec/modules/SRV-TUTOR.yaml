invariants:
  - id: INV-TUTOR-1
    text: >-
      Isolation: a user can ask about, read and list questions only for lessons `can_open` allows; a foreign or unknown
      lesson, a foreign question and a question of another lesson answer exactly like a missing one (status, body,
      header set). [db]
  - id: INV-TUTOR-2
    text: >-
      Grounding by code: for any model output (Hypothesis-generated JSON and text: invented aliases, real span ids,
      ids of other users' materials, quotes absent from the source, malformed shapes), every stored or shown citation
      names a span of the sent set, its page and title come from the database, and a block is supported only with a
      verified quote. [unit]
  - id: INV-TUTOR-3
    text: >-
      Injection (VEC-TUTOR-2, each case with a model output): question, cell or source text that asks to cite unsent or
      sent ids, closes the JSON, rewrites the instructions or requests a tool cannot produce a citation INV-TUTOR-2
      rejects, the prompt JSON round-trips to the same values, and the request carries no tools (asserted at the fake
      Provider; the proxy-side refusal is SRV-AGENT's test). [unit]
  - id: INV-TUTOR-4
    text: >-
      No text leaks: a canary planted in a question, a cell and a span appears in no log record of api or worker (all
      loggers) and in no job args. [db]
  - id: INV-TUTOR-5
    text: >-
      Spend bound: for any sequence of attempts, timeouts, kills and aborts, spent(question) ≤ `question_cap_usd` and
      spent(user, tutor, UTC day) ≤ `daily_cap_usd` plus one in-flight reserve; a settlement above its reserve is
      logged `reserve_exceeded` (a generated case covers it). [db] with a fake provider
  - id: INV-TUTOR-6
    text: >-
      No question stays `queued`: after a timeout, a kill mid-run, a crash between insert and enqueue, or exhaustion,
      the next read or busy check returns a terminal state (FR-TUTOR-10), and a new question can be asked. [db]
  - id: INV-TUTOR-7
    text: >-
      `tutor_questions.owner_id` equals the lesson's owner and `revision_sha256` names a revision of that lesson for
      every row (composite FKs). [db]

nfr:
  - id: NFR-TUTOR-1
    metric: >-
      p95 by nearest rank, rank ceil(0.95 × n), over the n = 40 bench samples (VEC-TUTOR-7), seconds from the ask
      (POST) to the terminal state, polled every 0.5 s over the HTTP API, idle worker, all asked from the L02 lesson
      ([live]). Bench spend ≤ 40 × question_cap_usd (≤ $12.00; expected ≈ 40 × $0.046 ≈ $1.8) from
      budget.test_budget_usd, inside the normal daily cap: a run stops at the first 429 whose body is
      daily_budget_exhausted, each run writes its own record file, the next UTC day resumes with the questions not yet
      recorded, and the runs are merged by question id before the summary. The bench also records thinking tokens per
      call, the share of blocks with a verified quote, the share of insufficient answers and a per-chapter breakdown
    threshold: 30
    verified_by: bench
  - id: NFR-TUTOR-2
    metric: >-
      mean USD per question over the NFR-TUTOR-1 run, counting `answered` questions and `expired` ones that spent
      something (usd > 0); failed, refused and unspent expired ones are excluded (ledger spent(run), read over HTTP
      as FR-TUTOR-2's `usage`). Expected about $0.046 for a bench question, asked without a cell (VEC-TUTOR-3: 8
      whole chunks and the question), and about $0.052 for a question from the Ask panel with a focused cell (up to
      cell_bytes_max more); both extrapolated from REF-TUTOR-7's measured rates; every new question writes its whole
      prompt to the 1-hour cache
    threshold: 0.06
    verified_by: bench
  - id: NFR-TUTOR-3
    metric: >-
      share of NFR-TUTOR-1 answers with grounded = true, over exactly the 40 bench questions (the gate: they are 40
      independent questions over all 23 chapters, so as iid samples a tutor whose true share is 0.9 passes 98.5 % of
      the time and one at 0.7 passes 11 %; the first live run's n = 3, 2 grounded, decides nothing; per-cell template
      questions were dropped in review round 1 as correlated, an effective n of about 10–16). No spike measured it (REF-TUTOR-7 used synthetic sources): the first full bench is
      its measurement, and a miss there reopens retrieval or the prompt before the slice's live check, not the
      threshold. Retrieval predicts it: in the live search bench a gold page was in the top 8 hits for 25 of the 39
      questions other than t01 (64 %), and a question whose gold page is not retrieved can at best be answered
      `insufficient`. So each record also carries `gold_in_top8` (a gold page among the question's top 8 search hits,
      read through POST /api/search, which spends nothing) and `gold_cited` (a cited page is a gold page), and the
      summary splits grounded by `gold_in_top8` (`grounded_given_gold_in_top8`) beside `insufficient_share`, so a
      miss is attributed to retrieval or to the tutor
    threshold: 0.8
    verified_by: bench

