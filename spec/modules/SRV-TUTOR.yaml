owner_notes:
  - "Cost (VEC-TUTOR-3, from spikes/tutor-call on 2026-11-22: 10 calls, $0.038, and spikes/tutor-chunks on 2026-11-23): about $0.046 per question asked without a cell and about $0.052 with a focused cell, with Sonnet 5.5, now that a hit sends its whole chunk (measured short calls cost $0.001–0.006); worst-case reserve $0.148 per attempt; caps $0.30 per question and $3 per user per day (about 58–65 questions); the 40-question bench about $1.8."
  - "Sources (2026-11-23): each of the 8 search hits now sends all spans of its chunk, not only its main span, because the first live run missed a fact one span away. The $0.30 cap limits the prompt to 29,000 bytes, so for long chunks the lowest-ranked hits are left out."
  - "Cost lever for V.cost-optimize (REF-TUTOR-7): the CLI writes each one-shot prompt to the 1-hour cache at 2× the input price; an uncached send would roughly halve the tutor's input cost, if the CLI allows it."
  - "While a lesson compile stage runs, a question waits for it (one worker); after 10 minutes it expires instead of being answered late."
  - "An answer says when it is not grounded in the book instead of hiding it."
  - "Model choice: with Opus 5.5 as `tasks.tutor.model` the worst-case reserve is $0.296 per attempt (8.00 and 20.00 per million tokens), so a second attempt no longer fits the $0.30 question cap (it is refused as budget_exhausted) and the $3 daily cap allows about 10 questions; Sonnet 5.5 is the example's choice."

review: "draft 2026-11-22. deep-reviewer round 1 (bfb7047): changes — B1 thinking/output cap (spike tutor-call run 2026-11-22, $0.038: 0 thinking tokens, 92–310 output tokens, custom system_prompt replaces the CLI prompt; bounds set from it), B2 no stuck queued rows, B3 byte-based reserve, B4 queue priority and expiry, B5 verbatim quotes and aliases, B6 cost derivation, B7 input checks; non-blocking applied; plus the V7 review item: abort on the first api_retry or after call_deadline_s. Round 2 (410314b): changes — 5 of 7 closed; bench daily-cap override removed (one bench run per UTC day), cache assumption removed (about $0.048 per question); non-blocking applied (settle per FR-AGENT-9 with the tutor's floor_usd, guarded transitions, 409 on the unique index, monthly_budget_exhausted and provider_missing messages, escaped prompt sizing, bench n and p95 rank, spike limits, no answer text in committed files). SRV-AGENT approved; its amendments are cross-spec items. Round 3 (30890d8): approve. Approved by agent with Red (2026-11-23), the round-3 notes folded in: FR-TUTOR-7's stalled-provider outcomes stated exactly as FR-AGENT-9/-13 settle them, with two [db] tests through the real adapter, and SRV-AGENT's `upstream_retry` / `deadline_exceeded` recorded as `provider_unavailable`; NFR-TUTOR-3's first bench run is its measurement; the bench generator confirms explain-cell titles on the compiled revision. Also: SRV-AGENT's remaining codes mapped (FR-TUTOR-3), priority 100 through the SRV-EVENTS amendment, enqueue through `app.state.jobs`. Green (2026-11-23): test corrections, no oracle weakened — the stale-row test's history order follows FR-TUTOR-2's newest-first; the Ask panel test reads the button's DOM `disabled` property (the web tests have no jest-dom matchers). Code review round 1 (25a5920): changes — five untested rules, all now pinned by tests: (1) span reads filter by owner (two owners with different text and page at one span id each see only their own); (2) SRV-AGENT's per-user lock (concurrent reserves, tests/agent); (3) the `finish` guard (a finished row refuses `answered`; a row flipped during the call is not overwritten); (4) VEC-TUTOR-1 cases for the first kept source and NFC; (5) the job key through the real SRV-EVENTS `Jobs`. Non-blocking applied: the Opus owner note, `ledger.spent(day=True)`, an insert-race 409 test, the handler logs the real `finish` outcome, the agent-proxy client closed after each call, VEC-TUTOR-4's queued + succeeded row, canary tests on the output_invalid and search-failure paths, the bench driver, citations through WEB-NOTEBOOK's formatter, the ask body read before a database connection, the stop-reason note. The new [db] tests are in server/tests/tutor/test_tutor_review_db.py; the Provider fakes became async context managers (Deps.provider). Code review round 2: approve (deep-reviewer, Fable); its non-blocking items applied: the bench records thinking tokens from SRV-AGENT's settle rows (`agent_spend.thinking`, paired SRV-AGENT change), and an empty assertion was removed from the search-failure canary test. Revision 2026-11-23 after the first live run (3 answered, 2 grounded; investigator: the ungrounded answer was correctly `insufficient`, its fact sat in a neighbouring span of the top chunk, never sent): FR-TUTOR-5 sends each hit's whole chunk (primary first, deduplicated, one alias per span); FR-TUTOR-6 caps aliases at sources_max 40; prompt_bytes_max 24000 → 29000 and system_bytes_max 4000 → 2000 from spikes/tutor-chunks (REF-TUTOR-9: reserve $0.148, two attempts $0.296 within the kept $0.30 cap; the sources budget is smaller than 8 hits at p95, said so in bounds); FR-TUTOR-2's GET adds the question's usage; VEC-TUTOR-1 pins partial-insufficient; VEC-TUTOR-7 replaces v03 (premise unsupported) with t01, four templates per explain cell for n = 40 + 1, and an HTTP driver in the owner slice suite; NFR-TUTOR-1/-3 gate on n ≥ 40 and report insufficient_share. Awaits deep-reviewer (cost math, new numbers); the prompt (answer-v1.md) is unchanged. Chunks review round 1: changes (the reserve math checked: $0.148, two attempts $0.296) — B1 alias cap: candidates are all primaries by rank first, then neighbours by rank, and sources_max 40 → 88 (8 × p95 spans per chunk) so only bytes bind; test: 8 hits of 9 small spans send all 8 primaries; B2 bench resume: READER_TUTOR_BENCH_FROM and READER_TUTOR_BENCH_DIR forwarded through slice.sh and slice_inputs, one record file per run, merged before summary() (unit test); B3 bench validity: the bench set is questions-v2 with v03 → t01 (40 independent questions, all 23 chapters), asked from L02 without a cell, gate on exactly those 40, a per-chapter breakdown; cell templates dropped. Non-blocking: a [db] test that a dropped alias's citation is removed, the prompt_bytes_max boundary pinned from below, a 429 counts as the daily cap only by its body code, mean_usd over answered and expired only, _USAGE filtered by owner, stale texts fixed, the one-span quote note. Chunks review round 2: approve (deep-reviewer, Fable); its pre-bench items applied: NFR-TUTOR-3 cites the retrieval predictor (gold page in the top 8 for 25 of 39) and the bench records `gold_in_top8` and `gold_cited` with a grounded split by `gold_in_top8`; `mean_usd` counts answered questions and expired ones with usd > 0; slice.sh resolves --tutor-bench-dir to an absolute path outside the repository and warns on --tutor-bench-from without it; bench.yaml states that failed, refused and timed-out questions stay in the 40 as not grounded and are never re-asked; the typical cost is for a question without a cell (about $0.046). Paired change from WEB polish (2026-11-23, V/WEB-polish; web only, nothing on the server): FR-TUTOR-11's citations grouped per material through WEB-NOTEBOOK FR-NOTEBOOK-2, and the panel layout (id, heading, hint, the focused cell's label); WEB polish deep-reviewer single round (2026-11-23): its tutor item applied (synthetic titles and headings in the Ask panel tests); approved by agent without a second round (coordinator). Amendment 2026-11-23 (V/design-pass, web only, the owner's approval of the design audit's P1 and P2 items): FR-TUTOR-11 the side panel (closed by default, openers, non-modal, focus and Escape, room beside the lesson at 75rem+) and the capped, expandable history; no server behaviour changes. deep-reviewer (Fable) single round on the design-pass spec diff (04e396b..d3c0a68): changes, applied without a second round (coordinator, 2026-11-23; findings and fixes in docs/progress.yaml V.design-pass `review`): B6 the history's injection oracle (a stored answer with a link and an image renders neither and fetches nothing); non-blocking: Escape reaches the panel from the page outside editable fields, dialogs and menus, and focus falls back to the toolbar's Ask the tutor. Approved by agent (coordinator, 2026-11-23). Amendment 2026-11-24 (V/manage, WEB-MANAGE FR-MANAGE-4): FR-TUTOR-20..21 promoted from `proposed_manage` with the Red tests (tests/tutor/test_tutor_manage_db.py) after deep-reviewer rounds 1–3 (round 3 approve on 2a7d86f); `tutor_questions.cleared_at` and the relaxed question CHECK (tutor_0002); FR-TUTOR-2's GETs omit cleared rows; the clear routes write SRV-EVENTS `tutor.clear` audit rows. Approved by agent with Red (2026-11-24)."

