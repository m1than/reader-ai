# SRV-TUTOR — answer a learner's question about the open lesson from the material's spans, with citations checked by
# code. Slice subset (V.TUTOR-min, docs/roadmap.md "Vertical slice first", V8); the stage-6 SRV-TUTOR row adds what
# `defers` lists. One spec for the server module and the web Ask panel.
#
# Design (agent, 2026-11-22; deep-reviewer round 1 applied):
#   - The api cannot reach agent-proxy (ADR-0025: only the worker does). A question is a job: the api commits a
#     `tutor_questions` row, then enqueues `tutor.answer`; the worker retrieves, calls the SRV-AGENT Provider port once,
#     validates and stores the answer; the browser polls.
#   - No SSE in the slice: the answer is validated as a whole (quotes and ids checked by code, INV-TUTOR-2) before
#     anything is shown, so a token stream would show unchecked text. SSE and first-token p95 ≤ 3 s are in `defers`.
#   - Grounding is enforced by code: each block names short source aliases (s1…sN, mapped by code to span ids) and
#     carries a verbatim quote that must occur in the first named source. The model cannot forge an id (it never sees
#     one) or a quote (code checks it). Entailment (does the quote support the block's claim?) is not checked in the
#     slice (`defers`).
#   - Thinking and output (REF-TUTOR-7, measured 2026-11-22, 10 calls, $0.038): tutor-shaped calls used 0 thinking
#     tokens with thinking off and with the CLI default, 92–310 output tokens, 1.5–3.5 s, valid JSON 10/10. The long
#     compile stages' 4.6–6.6k output tokens (REF-TUTOR-6) do not apply to this shape. The tutor still turns thinking
#     off (cross-spec SRV-AGENT) and caps output at 2,000 tokens (6.5× the measured maximum).
#   - Spend: a custom `system_prompt` replaces the CLI's own 6,803-token prompt (measured: 745–867 prompt tokens in
#     total, ≈ 410 of them fixed overhead). Reserves count `cli_overhead_tokens` + every byte sent (measured 0.3–0.5
#     tokens per byte, so one token per byte is an upper bound); caps derive from that worst case (VEC-TUTOR-3,
#     computed by the test, not pinned).
#   - Model: reader.yaml `tasks.tutor.model` (example: `sonnet`), resolved to a full id by SRV-AGENT before any spend.
#   - Citation display: page and span id come from `material_spans`; `material_title` is the lesson's course title
#     (SRV-LESSON `courses.title`, the course bound by `courses.material_sha256`), because materials have no title
#     column (SRV-INGEST, SRV-CONFIG). Nothing in a citation comes from model text.
#   - ADR-0005, ADR-0010 and ADR-0017 are `status: proposed`; SRV-AGENT is approved (V/V.COMPILE-min); the amendments
#     below are owned by SRV-AGENT's author and land there as paired changes.
#
# Cross-spec requirements (paired changes):
#   - SRV-AGENT (landed as FR-AGENT-12 and FR-AGENT-13 on V/V.COMPILE-min, dca70a2): (a) a per-user daily scope for task `tutor` (`spent(user, task=tutor,
#     UTC day)`) refused before the reserve row with `daily_budget_exhausted`, besides the run cap (`run_id` = question
#     id, cap `question_cap_usd`, refusal `budget_exhausted`); (b) extended thinking off per task (`MAX_THINKING_TOKENS=0`
#     in the CLI environment for task `tutor`); (c) a caller `system_prompt` option (with it the CLI sends no system
#     prompt of its own, REF-TUTOR-7); (d) the stop reason in `StageResult`, a `max_tokens` stop mapping to the
#     permanent code `output_truncated`; (e) the CLI's `api_retry` messages exposed and a per-call deadline accepted, so
#     the tutor can abort on the first retry (FR-TUTOR-7). The tutor passes its own byte-based worst case
#     (VEC-TUTOR-3) as the reserve floor `floor_usd` and logs `reserve_exceeded` itself when a settlement exceeds it.
#   - SRV-EVENTS: KIND_MODULES lists `reader.tutor.jobs`; job kinds may declare a `priority` (FR-EVENTS-1 amendment,
#     2026-11-23), used by `tutor.answer` to run before queued compile stages.
#   - SRV-AUTH: ROUTERS lists `reader.tutor.routes`; VERSION_LOCATIONS lists `reader/tutor/migrations`;
#     `tutor_questions` is a non-system table for INV-AUTH-8; the api role holds one SRV-EVENTS `Jobs` on
#     `app.state.jobs` (FR-AUTH-10 note from SRV-PIPELINE), which FR-TUTOR-1 enqueues through.
#   - WEB-NOTEBOOK: the lesson view mounts `web/src/tutor/AskPanel` and passes the focused cell id.
#   - SRV-INGEST: read helper `spans_by_ids(conn, owner_id, span_ids)`; until it exists this module reads
#     `material_spans` directly (read-only).
#   - V.cost-optimize: the tutor's prompt cache shape and output caps are inputs to that task's measurements. With a
#     custom `system_prompt` there is no CLI system prompt, and the fixed part is not cached separately: the CLI
#     writes the whole prompt (system + user) to the 1-hour cache at 2× input on every new question (REF-TUTOR-7).

id: SRV-TUTOR
title: Tutor (slice) — questions about the open lesson, answered by one model call from retrieved spans, citations and quotes checked by code
status: approved
approved_by: agent
approved_at: 2026-11-23
layer: server
track: ai
slice: V.TUTOR-min
adr: [ADR-0010, ADR-0005, ADR-0025, ADR-0023, ADR-0026, ADR-0013, ADR-0017, ADR-0006]

paths:
  - server/src/reader/tutor/**
  - server/tests/tutor/**
  - web/src/tutor/**
  - e2e/web/tutor/**
  - spec/fixtures/SRV-TUTOR/**

normative:
  - id: REF-TUTOR-1
    title: "ADR-0010 — learning loop; the tutor is bound to the cell and every factual answer cites a source span"
    url: docs/adr/0010-learning-loop.md
  - id: REF-TUTOR-2
    title: "ADR-0025 — agent sandbox and credential separation: only the worker reaches agent-proxy"
    url: docs/adr/0025-agent-sandbox-and-credential-separation.md
  - id: REF-TUTOR-3
    title: "SRV-AGENT (approved, V/V.COMPILE-min) — Provider port, run_token, reservation/settlement ledger, pricing table"
    url: spec/modules/SRV-AGENT.yaml
  - id: REF-TUTOR-4
    title: "SRV-SEARCH — search(owner_id, query, k, material_sha256) with span ids"
    url: spec/modules/SRV-SEARCH.yaml
  - id: REF-TUTOR-5
    title: "Anthropic API pricing (SRV-AGENT pricing table, as_of 2026-11-03)"
    url: https://platform.claude.com/docs/en/about-claude/pricing
  - id: REF-TUTOR-6
    title: "Spike compile-cost: Sonnet fact-check stages, output tokens vs printed characters"
    url: spikes/compile-cost/RESULT.md
  - id: REF-TUTOR-7
    title: "Spike tutor-call: 10 tutor-shaped Sonnet calls, thinking off vs default (2026-11-22, $0.038)"
    url: spikes/tutor-call/RESULT.md
  - id: REF-TUTOR-8
    title: "Spike agent-proxy-handshake round 2 (V/V.COMPILE-min): the CLI retries 429/529/500 about 10 times over ~3 min, emitting api_retry"
    url: spikes/agent-proxy-handshake/RESULT.md
  - id: REF-TUTOR-9
    title: "Spike tutor-chunks: bytes per hit when a hit sends its whole chunk, from the stack's own converter and chunker (2026-11-23, no spend)"
    url: spikes/tutor-chunks/RESULT.md

bounds:
  question_chars_max: 1000      # structural: one question; the same bound as SRV-SEARCH's q
  question_bytes_max: 3000      # UTF-8 bytes; 1000 characters of Cyrillic are ≤ 2000 bytes, emoji ≤ 4 bytes each
  retrieve_k: 8                 # search hits (SRV-SEARCH k); each sends its whole chunk (FR-TUTOR-5)
  span_bytes_max: 2000          # structural: a span's text cut at the last whitespace within 2000 bytes, hard cut if none
  cell_bytes_max: 4000          # structural: the focused cell's source text, cut the same way
  question_cell_bytes_max: 8000 # question + cell + JSON overhead (3000 + 4000 + 1000), escaped
  sources_max: 88               # REF-TUTOR-9: one alias per span; 8 hits × the p95 of 11 spans per chunk, so the
                                # byte budget, not the alias count, is the limit that binds (an alias's JSON, about
                                # 37 bytes, is inside prompt_bytes_max and so inside the reserve)
  prompt_bytes_max: 29000       # REF-TUTOR-9: the largest prompt whose reserve lets attempts_max attempts fit
                                # question_cap_usd (≤ $0.15 each); sources get 29000 − 8000 = 21000 = 8 × 2625, i.e.
                                # 8 median whole chunks (2206); at p90 (3119) the neighbours of the lowest ranks are
                                # dropped first, primaries last (FR-TUTOR-5)
  system_bytes_max: 2000        # the versioned system prompt file (1,440 bytes); a test asserts its size
  quote_words: [5, 30]          # structural: a verifiable excerpt, short enough not to copy the source wholesale
  spans_per_block_max: 3        # structural
  blocks_max: 20                # structural
  block_chars_max: 4000         # structural
  max_output_tokens: 2000       # REF-TUTOR-7: measured 92–310 output tokens, 0 thinking; 2000 is 6.5× the maximum
  cli_overhead_tokens: 1000     # REF-TUTOR-7: ≈ 410 fixed tokens beyond our bytes with a custom system_prompt; 2.4×
  attempts_max: 2               # one retry for transient provider errors
  question_cap_usd: 0.30        # kept (2026-11-23); VEC-TUTOR-3: ≥ attempts_max × worst-case reserve (2 × 0.148)
  daily_cap_usd: 3.00           # structural, per user per UTC day for task tutor; the api pre-checks it
  question_ttl_s: 600           # a question older than this is expired, never answered (covers a wait behind one
                                # running compile stage; REF-TUTOR-6 stages took ≤ 190 s each)
  stale_without_job_s: 60       # a queued row with no job for this long is finalised `lost`
  call_deadline_s: 20           # structural: bounds a stuck or retrying call far below the CLI's ~3 min of retries
                                # (REF-TUTOR-8); one healthy attempt fits NFR-TUTOR-1's 30 s p95. At the measured
                                # 1.5–3.5 s for ≤ 310 tokens it is effectively the output cap as well
  job_timeout_s: 120            # structural: one CLI turn of ≤ 2000 output tokens
  poll_backoff_ms: [1000, 2000, 5000]  # web: then 5000 until a terminal state or the deadline
  poll_deadline_s: 630          # question_ttl_s + 30 s
  history_max: 50               # list size

tables:
  tutor_questions: { owner_id: true, columns: "id uuid pk, owner_id → users.id, lesson_id uuid, revision_sha256 text, cell_id text null, question text CHECK (1..1000 chars while cleared_at is null; '' only when cleared_at is set — tutor_0002, FR-TUTOR-20), state text CHECK in (queued, answered, failed, refused, expired), answer jsonb null, grounded bool null, error_code text null, model text null, created_at, finished_at null; FK (lesson_id, owner_id) → lessons (id, owner_id); FK (lesson_id, revision_sha256) → lesson_revisions (lesson_id, sha256); UNIQUE (owner_id) WHERE state = 'queued'; index (owner_id, lesson_id, created_at); tutor_0002 (FR-TUTOR-20): cleared_at timestamptz null" }

errors:                         # fixed catalogue, shared by api, worker and web (VEC-TUTOR-5); unknown codes → tutor_failed
  [question_invalid, cell_unknown, unknown_revision, not_found, tutor_busy, daily_budget_exhausted, budget_exhausted,
   monthly_budget_exhausted, provider_missing, sources_unavailable, output_invalid, output_truncated,
   provider_unavailable, rate_limited, expired, lost, tutor_failed]

requirements:
  - id: FR-TUTOR-1
    text: >-
      Ask. `POST /api/lessons/{lesson_id}/ask` with JSON `{"question": str, "cell_id": str?, "revision": str?}`, `auth:
      session`, body cap per SRV-AUTH FR-AUTH-12. `can_open(user, lesson_id)` false → 404 `not_found` (the body of a
      missing lesson). `question` trimmed must be 1..`question_chars_max` characters and ≤ `question_bytes_max` UTF-8
      bytes, with no NUL and no C0 control other than newline and tab, else 400 `question_invalid`. `revision`
      (default: the lesson's current sha256, SRV-LESSON) must be a revision of this lesson, else 400 `unknown_revision`;
      `cell_id`, when present, a cell of that revision, else 400 `cell_unknown`. The busy check (FR-TUTOR-10) finds a
      live queued question → 409 `tutor_busy`. Daily pre-check: spent(user, tutor, UTC day) + the worst-case reserve >
      `daily_cap_usd` → 429 `daily_budget_exhausted` (spent read with the ledger's FR-AGENT-12 daily query, the
      reserve at the bounds' maximum, VEC-TUTOR-3). Otherwise it commits the row (state `queued`), then enqueues job
      `tutor.answer` with key `[question_id]` through the api's SRV-EVENTS `Jobs` (`app.state.jobs`, SRV-AUTH
      FR-AUTH-10 note); an enqueue error, or no `Jobs` on the app, sets the row `failed` / `tutor_failed`. It answers 202
      `{"question_id": uuid}` and logs route, question length and outcome code, never the text. [db]
  - id: FR-TUTOR-2
    text: >-
      Read. `GET /api/lessons/{lesson_id}/questions/{question_id}` returns `{"state", "answer"?, "grounded"?,
      "error_code"?, "usage"?}` for a row of that user and that lesson, where `usage` = `{"usd", "output_tokens",
      "thinking_tokens"}` for a row no longer queued (the question's own ledger rows: spent(run) and the settle rows'
      sums, `thinking_tokens` null when none recorded it), so the bench measures NFR-TUTOR-2 over HTTP; another user's row, a row of another lesson, an unknown or
      malformed id → 404 `not_found`. `GET /api/lessons/{lesson_id}/questions` returns at most `history_max` items
      `{"question_id", "question", "cell_id", "state", "grounded", "error_code", "created_at"}`, newest first. Both
      first finalise a stale row (FR-TUTOR-10). Amendment 2026-11-24 (FR-TUTOR-20): both GETs omit cleared rows (a
      cleared row's single GET answers 404 `not_found`). [db]
  - id: FR-TUTOR-3
    text: >-
      Job kind `tutor.answer` (SRV-EVENTS FR-EVENTS-1, `reader.tutor.jobs.JOB_KINDS`): args `{question_id}` (extra
      forbidden), key `[question_id]`, `max_attempts = attempts_max`, `timeout_s = job_timeout_s`, `priority = 100`
      (SRV-EVENTS FR-EVENTS-1 amendment; compile stages keep the default 0, so a question runs before queued compile
      stages). Transient: `provider_unavailable`, `rate_limited`, `output_invalid`. The
      handler never leaves a row `queued`: it catches every permanent error, every budget refusal and a transient error
      on the last attempt, writes `failed` (code) or `refused` (`budget_exhausted` / `daily_budget_exhausted`), and
      returns normally; only a transient error before the last attempt is re-raised for a retry. `monthly_budget_exhausted`
      (SRV-AGENT FR-AGENT-9) also ends `refused`, and SRV-AGENT's `task_budget_exhausted` (its per-run task budget,
      here per question) ends `refused` / `budget_exhausted`; `provider_missing` ends `failed` with its own message;
      any other SRV-AGENT code (`tools_mismatch`, `sdk_error`, `unknown_model`, …) ends `failed` / `tutor_failed`. Every row
      transition, in the api and the worker, is `UPDATE … WHERE state = 'queued'`; the handler first checks that the
      row is still `queued` and exits without a model call when it is not. [db] Amended by SRV-OBS V.obs-analytics
      (FR-OBS-12 d-f, -13, -14, -18; ADR-0035 accepted 2026-11-24; tracing only, no outcome changes): after loading the
      row the handler sets the job root's `reader.lesson.id`, `reader.course.id` (the question's lesson and its
      course, `store.load` reads `c.id`) and `reader.prompt.version` (SRV-OBS's registered version of the tutor's
      template, None when unknown) and calls `session_marker("reader.lesson.id", …)` before any reservation; it sets
      `reader.tutor.state` to the row's final state on every exit that writes one; retrieval runs inside a
      `tutor.retrieve` child (hits = the span ids sent, candidates = the search results) and the answer check inside
      a `tutor.citations` child (total = blocks, valid = supported blocks); then `obs.feedback` records
      `tutor.citations_valid` (blocks > 0 and every block supported, {total, valid}) and, when there are blocks,
      `tutor.citation_share` (valid ÷ total). The tutor's StageCall carries the course id. None of these can raise.
  - id: FR-TUTOR-4
    text: >-
      Expiry. Before reserving anything, the handler marks a row older than `question_ttl_s` `expired` and returns.
      [db]
  - id: FR-TUTOR-5
    text: >-
      Retrieval. The handler loads the revision and the course's `material_sha256`. With none, or when
      `search(owner_id, question, k = retrieve_k, material_sha256)` (SRV-SEARCH FR-SEARCH-7) returns no result, the row
      is `failed` / `sources_unavailable` and no model is called. Otherwise the candidate spans are every result's
      whole chunk (revised 2026-11-23, live run: the primary span alone missed the fact in a neighbouring span of the
      top chunk): first every result's primary `span_id` in rank order, then every result's other `span_ids` (in
      chunk order) in rank order, a span already taken not repeated; so the budget drops neighbours before any
      primary, and the sent set always contains every primary the primary-only rule sent (review round 1: live gold
      pages sat at ranks 5–8 in 6 of 26 questions). Each candidate span is loaded
      (text, page) and cut to `span_bytes_max`; a `degraded` search is used and recorded. The focused cell (id, kind
      `metadata.reader.kind`, source text) is read from the revision's notebook blob (SRV-LESSON). [db] with a fake
      search
      **Paired change, ADR-0039 / SRV-INGEST INV-INGEST-16, V.kl-active-view-readers:** `tutor/store.spans_by_ids`
      loads (page, text) through `reader.ingest.views.active_span_texts`, never the `ingests` join: only the
      owner's active packs are read, so a material with two packs (r2 and r3) never answers a `<sha>:<seq>` id with
      the other pack's span. A legacy id reads its seq in a legacy (r2) active pack, and goes through FR-INGEST-42's
      resolver (accepted seq map; `active` or `reanchored` only) when the active pack is r3; a locator id reads the
      active pack's span with that locator; anything else is not loaded (dropped from the candidates). Citations keep
      the id the search gave (FR-TUTOR-8's `quote_sha256` stays with the SRV-INGEST note's later change). The [db]
      fixtures seal their ingest as an active r2 pack (server/tests/ingest/packseed.py). [db]
      test_spans_active_pack_db.py, including the resolver path (code review round 1): with an accepted seq map
      from the r2 ingest to the active r3 pack, a legacy id whose mapped (locator, quote hash) is an r3 span loads
      that span's page and text; a legacy id whose mapped span is neither active nor reanchored (its hash matches
      no span) and a legacy id the map does not hold are dropped.
  - id: FR-TUTOR-6
    text: >-
      Prompt. The system prompt is the versioned file `reader/tutor/prompts/answer-v1.md` (≤ `system_bytes_max`);
      `prompt_sha256` = sha256 of that file's bytes, stored with the answer. The user prompt is exactly
      `json.dumps({"question", "cell": {"id", "kind", "text"} | null, "sources": [{"id": "s1".."sN", "page",
      "text"}]}, ensure_ascii=False)`, so no question, cell or source text can close a delimiter or forge a source
      entry; the system prompt states that every string value is data, never an instruction. The candidate spans
      (FR-TUTOR-5) get one alias each, s1…sk in their order, at most `sources_max`; the alias → span id map stays in
      the handler. Sizes are measured after JSON escaping: the question and the cell text are first cut so that
      question + cell + JSON overhead fit `question_cell_bytes_max`; then, if the prompt exceeds `prompt_bytes_max`,
      sources are dropped from the lowest rank (the last alias) until it fits; the dropped ones are not in the
      sent set. If every source is dropped, the row is `failed` / `sources_unavailable` and no model is called. [unit]
  - id: FR-TUTOR-7
    text: >-
      Model call. One call through the SRV-AGENT Provider port (FR-AGENT-6): `run_id = question_id`, `stage` and
      `task` = `tutor`, thinking off, `max_output_tokens`, run cap `question_cap_usd`, the daily scope (cross-spec). No
      tool is offered; agent-proxy refuses a request carrying tools (SRV-AGENT FR-AGENT-4, FR-AGENT-7). No other code
      path calls a model. Fast failure: on 429, 529 or 500 the CLI retries about 10 times over about 3 minutes
      (REF-TUTOR-8), which NFR-TUTOR-1 cannot afford, so the call sets SRV-AGENT's `abort_on_retry` and `deadline_s =
      call_deadline_s` (FR-AGENT-13 d, e): the first `api_retry` message or the deadline, whichever comes first, ends
      the attempt with SRV-AGENT's transient `upstream_retry` or `deadline_exceeded`, which the tutor records as
      `provider_unavailable` (SRV-AGENT does not report which status was being retried); SRV-AGENT's own
      `rate_limited` and `provider_unavailable` pass through unchanged. Such an attempt settles exactly as FR-AGENT-9
      and FR-AGENT-13 say: no upstream 2xx → $0; a 2xx without an SDK cost → the reserve; an unknown upstream record →
      the reserve. The next attempt follows FR-TUTOR-3. A `max_tokens` stop reason (FR-AGENT-13 c) is the permanent
      `output_truncated` (not yet observed on a real truncated reply: the first live run that truncates records the
      SDK's stop reason in docs/progress.yaml). The tutor passes its byte-based worst case (VEC-TUTOR-3, computed from the bytes actually
      sent) as the reserve floor `floor_usd` and logs WARNING `reserve_exceeded` when the SDK's reported cost exceeds
      it. [unit] with a fake provider that emits `api_retry`; [db] two stalled providers through the real SRV-AGENT
      adapter (a fake CLI and agent-proxy client): one stalls before any 2xx and settles $0, one stalls after a 2xx
      has started streaming and settles the reserve
  - id: FR-TUTOR-8
    text: >-
      Answer validation. The model's text, after removing one optional surrounding ```json fence, must be one JSON
      object `{"blocks": [{"text": str, "spans": [alias], "quote": str}], "insufficient": bool}` with no other keys at
      any level, 1–`blocks_max` blocks, `text` 1–`block_chars_max` characters, ≤ `spans_per_block_max` aliases; anything
      else is `output_invalid` (transient). Then, by code: aliases outside the sent set are removed and duplicates
      collapsed; a block is supported iff it keeps ≥ 1 alias and its `quote` has `quote_words` words and, after
      collapsing whitespace and NFC, is a substring of its first kept source's text as sent; otherwise the block is
      `unsupported`. A quote is checked against one span only, so a quote that crosses a span boundary (now that a
      chunk's neighbouring spans are sent as separate sources) is unsupported; the bench's `verified_block_share`
      watches for it. `grounded` is true iff `insufficient` is false and every block is supported. Each kept alias is
      rendered as a citation `{span, page, material_title}` read from the database (FR-TUTOR-9). [unit]
  - id: FR-TUTOR-9
    text: >-
      Storage. On success the row becomes `answered` with `answer = {"blocks": [{"text", "supported", "quote",
      "citations"}], "insufficient", "retrieval": "ok" | "degraded", "prompt_sha256", "model"}` and `grounded`, written
      as the handler's last statement (SRV-EVENTS FR-EVENTS-4). Ledger rows carry `run_id = question_id`, so a
      question's cost is spent(run). [db]
  - id: FR-TUTOR-10
    text: >-
      Stale rows. The busy check and FR-TUTOR-2 derive a queued row's state from the job: job `dead` → the row becomes
      `failed` with the mapped code (VEC-TUTOR-4); no job and older than `stale_without_job_s` → `failed` / `lost`;
      older than `question_ttl_s` → `expired`. The finalised row no longer blocks `UNIQUE (owner_id) WHERE state =
      'queued'`; an insert that violates that index (a concurrent ask) answers 409 `tutor_busy`. [db]
  - id: FR-TUTOR-11
    text: >-
      Web Ask panel (`web/src/tutor/AskPanel.tsx`) in the lesson view: a labelled text area (counter, 1..1000
      characters), Ask (also Ctrl/Cmd+Enter), the history list, and an `aria-live="polite"` region for the answer.
      After Ask it polls with `poll_backoff_ms` until a terminal state, `poll_deadline_s`, a 401 (sign-in) or a 404
      (stop); polling pauses while the page is hidden and resumes when visible; on load, a `queued` history item
      resumes polling. Block text renders through WEB-RENDER's markdown pipeline with links rendered as plain text
      (VEC-TUTOR-6); a block's citations render through WEB-NOTEBOOK FR-NOTEBOOK-2's grouping, one entry per material:
      "material_title, p. N", or "material_title, pp. N–M, K" when the block cites several pages (the live answers
      repeated the full title once per span; live run 2026-11-23); an unsupported block is marked "not supported by the
      source"; `grounded: false` shows "This answer is not fully grounded in the book."; every code maps to a fixed
      catalogue message, unknown codes to `tutor_failed`'s. Layout (WEB polish): the panel has `id="tutor"` (the lesson
      contents link to it) and the heading "Tutor"; the label "Ask the tutor" sits above a full-width text area; below
      it the counter, the hint "Ctrl+Enter or ⌘+Enter to ask" and Ask share one row; when a cell is focused, a muted
      line "About: <the cell's contents label>" names it (the label comes from the lesson view's `aside` prop, so a
      cell without one says "About: the selected cell"). [unit] Vitest, [browser] Playwright with axe (no serious or
      critical issue in the panel)
      **Design pass (web only, 2026-11-23; the audit found the panel after 27 cells at the foot of a 21,973px page,
      with a 3,575px history of questions whose answers could not be reopened):**
      - **Side panel.** The panel is closed by default and opens from the lesson toolbar's "Ask the tutor" button, the
        contents entry, each cell toolbar's "Ask" (WEB-NOTEBOOK FR-NOTEBOOK-11) and the `/` key. Open, it is fixed to
        the inline end of the viewport below the header, 24rem wide (the full viewport width below 30rem), at most the
        viewport height tall and scrolling inside itself, on `--acme-surface-raised` with a `--acme-border` start edge
        and no backdrop: it is non-modal, the lesson stays scrollable and interactive and keeps its focused cell. It
        keeps `id="tutor"`, the heading "Tutor" and a "Close" ghost icon button (accessible name "Close the tutor").
        Opening focuses the text area; Close, and Escape while focus is inside the panel or anywhere on the lesson page
        outside an editable field (a text area, an input, a contenteditable such as the lab editor) and outside an open
        dialog or menu (review: below 30rem the panel covers the page, so Escape must reach it from anywhere), close it
        and return focus to the control that opened it, or to the lesson toolbar's "Ask the tutor" when that control
        cannot take focus: it left the document, or it is hidden (below 60rem the contents entry sits in the closed
        contents list), so `document.activeElement` is not that control after `focus()` (focus-return fallback; code
        review B2). Asking, polling and the answer are unchanged; a question in flight keeps polling
        while the panel is closed, and reopening shows its state. At 75rem and wider, while the panel is open, the
        lesson's contents column is hidden and the cells' container ends where the panel begins, so the panel covers no
        lesson text (the reading column may narrow, to 30rem at the 75rem viewport); below 75rem it overlays the lesson.
        `AskPanel` takes `open` and `onClose` from the lesson view's panel state (WEB-NOTEBOOK FR-NOTEBOOK-11; without
        `open` it renders open, as a standalone panel); closed, it stays mounted with the `hidden` attribute, so a
        question in flight keeps its polling and state.
      - **History.** "Earlier questions" (an `h3` that labels the list) shows the 3 most recent entries, then a button "Show <n> earlier questions"
        (and "Show fewer") for the rest. Each entry is a disclosure button with the question text and its muted status;
        expanding a terminal entry fetches its state once with `GET /api/lessons/{lesson_id}/questions/{question_id}`
        and shows it with the same rendering as the current answer (blocks, citations, unsupported marks, the grounded
        notice, or its message); a failed fetch shows `tutor_failed`'s message and a Retry. A queued entry (a question
        still waiting when a newer one was asked, or a later queued one on load: the first resumes as the current one)
        fetches its state when expanded and, while it is still queued and expanded, again with `poll_backoff_ms`,
        showing "Waiting for the answer" until a terminal state, which it then shows like any other entry (code review:
        a queued question moved into the history keeps being fetched). An expanded answer renders through the same pipeline as the current one, links as
        plain text and no image (VEC-TUTOR-6), so a stored answer cannot inject a link or fetch a resource.
      [unit] closed by default, each opener, focus on open and on close (and the fallback to the toolbar's "Ask the
      tutor" when the opener was removed and when it is hidden), Escape inside the panel and from the page outside an editable field, not from inside a text area, the
      non-modal panel (no backdrop, a lesson control still clickable), polling while closed; the history cap, the
      toggle both ways, expanding fetches once and renders the answer, a failed fetch with Retry, an expanded answer
      whose text holds `[x](https://example.test)` and `![i](https://example.test/i.png)` renders zero `a` and zero
      `img` and makes no request other than the question's own GET; [browser] with axe on the open panel at 1280 and 390 px,
      and at 1280 px no `[data-markdown] p` of the lesson intersects the open panel; [story] `web/src/tutor/AskPanel.stories.tsx`
      exports `Light` and `Dark` (open, answered with citations) and `Closed`, `OpenEmpty`, `Waiting`, `Ungrounded`,
      `Failed` and `History` (8 entries), each rendered by a [unit] test through `composeStories` without an error.
