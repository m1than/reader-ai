# VEC-FRESH-1 — synthetic scan and report outputs (FR-FRESH-3, FR-FRESH-8) with the parsed result or
# `output_invalid`. No book text. Scan: aliases s1..s3 are sample spans [seq, page]; material sha256 "a" × 64;
# today 2026-11-23. Report: R entries r1..r3, claims c1 and c2, sections 1 and 7.

today: "2026-11-23"
material_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
aliases: { s1: [0, 1], s2: [5, 12], s3: [9, 40] }
# The non-front span texts behind the aliases (synthetic): the vocabulary a concatenated subject is cut into.
span_texts:
  s1: "t"
  s2: "alpha bravo charlie delta echo foxtrot golf hotel"
  s3: "india juliet kilo lima"

scan:
  - name: valid
    output: '{"bibliography": {"title": "Practical Distributed Ledgers", "authors": ["Ada Example"], "edition": "2nd", "year": 2017, "publisher": "Example Press", "isbn": "0306406152", "original_title": null, "original_authors": null, "original_edition": null, "original_year": null}, "claims": [{"span": "s2", "subject": "consensus protocol v1", "kind": "protocol", "why": "Protocols change.", "confidence": "high"}, {"span": "s3", "subject": "client library API", "kind": "api", "why": "APIs change.", "confidence": "medium"}]}'
    expect:
      bibliography: { title: "Practical Distributed Ledgers", authors: ["Ada Example"], edition: "2nd", year: 2017,
                      publisher: "Example Press", isbn: "0306406152", original_title: null, original_authors: null,
                      original_edition: null, original_year: null }
      claims:
        - { id: c1, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:5", page: 12,
            subject: "consensus protocol v1", kind: protocol, confidence: high }
        - { id: c2, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:9", page: 40,
            subject: "client library API", kind: api, confidence: medium }
      dropped: {}
  - name: fenced_json
    output: "```json\n{\"bibliography\": {\"title\": \"T\"}, \"claims\": []}\n```"
    expect:
      bibliography: { title: "T", authors: [], edition: null, year: null, publisher: null, isbn: null,
                      original_title: null, original_authors: null, original_edition: null, original_year: null }
      claims: []
      dropped: {}
  - name: bibliography_fields_out_of_bounds_dropped
    output: '{"bibliography": {"title": "T", "year": 1200, "isbn": "1234567890", "edition": "an edition string that is far longer than forty characters"}, "claims": []}'
    expect:
      bibliography: { title: "T", authors: [], edition: null, year: null, publisher: null, isbn: null,
                      original_title: null, original_authors: null, original_edition: null, original_year: null }
      claims: []
      dropped: {}
  - name: no_title_no_bibliography
    output: '{"bibliography": {"title": null}, "claims": []}'
    expect: { bibliography: null, claims: [], dropped: {} }
  - name: unknown_alias_and_long_subjects_dropped
    output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s9", "subject": "a", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "one two three four five six", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "averyveryverylongwordnumberone averyveryverylongwordnumbertwo x", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "five words is the limit", "kind": "tool", "why": "w", "confidence": "low"}]}'
    expect:
      bibliography: { title: "T", authors: [], edition: null, year: null, publisher: null, isbn: null,
                      original_title: null, original_authors: null, original_edition: null, original_year: null }
      claims:
        - { id: c1, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:0", page: 1,
            subject: "five words is the limit", kind: tool, confidence: low }
      dropped: { claim_span_unknown: 1, subject_too_long: 2 }
  - name: punctuation_joined_subjects_count_every_word
    # Words as FR-FRESH-3 counts them (INV-FRESH-1): "one-two.three/four,five six" is six words, so it is dropped;
    # "v1.2 API" is three words (v, 1.2, api: letters and digits split, a dotted number one word) and kept; "---" has
    # no word and is dropped.
    output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s1", "subject": "one-two.three/four,five six", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "alpha-beta-gamma-delta-epsilon-zeta", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "---", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "v1.2 API", "kind": "api", "why": "w", "confidence": "high"}]}'
    expect:
      bibliography: { title: "T", authors: [], edition: null, year: null, publisher: null, isbn: null,
                      original_title: null, original_authors: null, original_edition: null, original_year: null }
      claims:
        - { id: c1, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:5", page: 12,
            subject: "v1.2 API", kind: api, confidence: high }
      dropped: { subject_too_long: 3 }
  - name: joined_subjects_count_every_word
    # Over the span texts above (FR-FRESH-3): `_` separates (6 words, dropped); U+200B is removed, so
    # "alphabravo" is cut into alpha + bravo (6 words, dropped); U+200D joins one 33-character token (over
    # subject_token_chars_max 24, dropped); U+02BC and a digit are words of their own between the letters (7 words,
    # dropped); camelCase concatenates span words (3 + 3, dropped); "alphabravo charliedelta echo" is 2 + 2 + 1 = 5
    # words (kept as written); "Python 3.11 asyncio TaskGroup API" is 5 words (3.11 one word; taskgroup is no
    # concatenation of span words; kept); 40 CJK ideographs are 40 words (dropped), 4 are 4 words (kept).
    output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s2", "subject": "alpha_bravo_charlie_delta_echo_foxtrot", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "alpha​bravo charlie delta echo foxtrot", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "alpha‍bravo‍charlie‍delta‍echo‍foxtrot", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "alphaʼbravoʼcharlieʼdelta", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "alpha1bravo1charlie1delta", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "AlphaBravoCharlie DeltaEchoFoxtrot", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "alphabravo charliedelta echo", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s3", "subject": "Python 3.11 asyncio TaskGroup API", "kind": "api", "why": "w", "confidence": "high"}, {"span": "s1", "subject": "共识共识共识共识共识共识共识共识共识共识共识共识共识共识共识共识共识共识共识共识", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "共识算法", "kind": "tool", "why": "w", "confidence": "low"}]}'
    expect:
      bibliography: { title: "T", authors: [], edition: null, year: null, publisher: null, isbn: null,
                      original_title: null, original_authors: null, original_edition: null, original_year: null }
      claims:
        - { id: c1, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:5", page: 12,
            subject: "alphabravo charliedelta echo", kind: tool, confidence: low }
        - { id: c2, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:9", page: 40,
            subject: "Python 3.11 asyncio TaskGroup API", kind: api, confidence: high }
        - { id: c3, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:0", page: 1,
            subject: "共识算法", kind: tool, confidence: low }
      dropped: { subject_too_long: 7 }
  - name: token_caps_one_rule_at_a_time
    # Each subject fails (or passes) exactly one rule of FR-FRESH-3 over the span texts above: a 25-character
    # Latin token that is no concatenation of span words is over subject_token_chars_max (dropped), a 24-character
    # one is not (kept); 6 CJK ideographs are 6 words (dropped), 5 are 5 words (kept); "alphaʼbravo charlie delta
    # echo foxtrot" is 7 words (U+02BC a word of its own), every token ≤ 24 characters (dropped by count). Words
    # are taken over the NFKC form: the fullwidth "ａｌｐｈａｂｒａｖｏ" and the mathematical bold "𝐚𝐥𝐩𝐡𝐚𝐛𝐫𝐚𝐯𝐨" are
    # "alphabravo", cut into alpha + bravo, so both subjects are 6 words (dropped).
    output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s2", "subject": "abcdefghijklmnopqrstuvwxy", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "abcdefghijklmnopqrstuvwx", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "共识算法共识", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s1", "subject": "共识算法共", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "alphaʼbravo charlie delta echo foxtrot", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "ａｌｐｈａｂｒａｖｏ charlie delta echo foxtrot", "kind": "tool", "why": "w", "confidence": "low"}, {"span": "s2", "subject": "𝐚𝐥𝐩𝐡𝐚𝐛𝐫𝐚𝐯𝐨 charlie delta echo foxtrot", "kind": "tool", "why": "w", "confidence": "low"}]}'
    expect:
      bibliography: { title: "T", authors: [], edition: null, year: null, publisher: null, isbn: null,
                      original_title: null, original_authors: null, original_edition: null, original_year: null }
      claims:
        - { id: c1, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:5", page: 12,
            subject: "abcdefghijklmnopqrstuvwx", kind: tool, confidence: low }
        - { id: c2, span: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:0", page: 1,
            subject: "共识算法共", kind: tool, confidence: low }
      dropped: { subject_too_long: 5 }
  # A lone surrogate (UTF-8 cannot store it) as a JSON escape: output_invalid, never a crash at storage.
  - { name: escaped_lone_surrogate_in_a_subject, output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s1", "subject": "a\ud800b", "kind": "tool", "why": "w", "confidence": "low"}]}', error: output_invalid }
  - { name: escaped_lone_surrogate_in_the_bibliography, output: '{"bibliography": {"title": "T\udc00"}, "claims": []}', error: output_invalid }
  - { name: missing_claims_key, output: '{"bibliography": {"title": "T"}}', error: output_invalid }
  - { name: extra_top_key, output: '{"bibliography": {"title": "T"}, "claims": [], "notes": "x"}', error: output_invalid }
  - { name: unknown_bibliography_key, output: '{"bibliography": {"title": "T", "url": "https://x.example/"}, "claims": []}', error: output_invalid }
  - { name: wrong_kind, output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s1", "subject": "a", "kind": "rumor", "why": "w", "confidence": "low"}]}', error: output_invalid }
  - { name: wrong_confidence, output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s1", "subject": "a", "kind": "tool", "why": "w", "confidence": "sure"}]}', error: output_invalid }
  - { name: claim_extra_key, output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s1", "subject": "a", "kind": "tool", "why": "w", "confidence": "low", "quote": "book text"}]}', error: output_invalid }
  - { name: not_json, output: "The book is current.", error: output_invalid }
  - { name: kind_is_a_list, output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s1", "subject": "a", "kind": ["tool"], "why": "w", "confidence": "low"}]}', error: output_invalid }
  - { name: confidence_is_an_object, output: '{"bibliography": {"title": "T"}, "claims": [{"span": "s1", "subject": "a", "kind": "tool", "why": "w", "confidence": {"c": "low"}}]}', error: output_invalid }

report:
  r:
    - { id: r1, url: "https://publisher.example/books/pdl-4", host: publisher.example, title: "PDL, 4th edition" }
    - { id: r2, url: "https://spec.example/consensus/v3", host: spec.example, title: "Consensus v3" }
    - { id: r3, url: "https://courses.example/ledgers", host: courses.example, title: "Ledgers course" }
  claims: [c1, c2]
  sections: [1, 7]
  cases:
    - name: valid_partly_outdated
      output: '{"verdict": "partly_outdated", "reasons": [{"text": "A newer edition exists.", "citations": ["r1"]}], "claims": [{"id": "c1", "status": "changed", "note": "v3 is current.", "citations": ["r2"]}, {"id": "c2", "status": "unknown", "note": "No source.", "citations": []}], "recommendations": [{"source": "r1", "date": "2024-06", "kind": "book_edition", "why": "The current edition.", "covers": [1, 7]}, {"source": "r2", "date": "2025-01-15", "kind": "official_docs", "why": "The current protocol.", "covers": [7]}, {"source": "r3", "kind": "course", "why": "Hands-on.", "covers": [7]}]}'
      expect:
        verdict: partly_outdated
        reasons: [{ text: "A newer edition exists.", citations: [r1] }]
        claim_status:
          - { id: c1, status: changed, note: "v3 is current.", citations: [r2] }
          - { id: c2, status: unknown, note: "No source.", citations: [] }
        recommendations:
          - { source: r1, date: "2024-06", kind: book_edition, why: "The current edition.", covers: [1, 7] }
          - { source: r2, date: "2025-01-15", kind: official_docs, why: "The current protocol.", covers: [7] }
          - { source: r3, date: null, kind: course, why: "Hands-on.", covers: [7] }
        dropped: {}
    - name: unknown_claim_section_and_bad_dates
      output: '{"verdict": "outdated", "reasons": [], "claims": [{"id": "c9", "status": "changed", "note": "n", "citations": []}], "recommendations": [{"source": "r1", "date": "2027-01", "kind": "book", "why": "w", "covers": [99, 1]}, {"source": "r2", "date": "2024-13", "kind": "other", "why": "w", "covers": []}, {"source": "r3", "date": "2026-11-24", "kind": "course", "why": "w", "covers": []}]}'
      expect:
        verdict: outdated
        reasons: []
        claim_status: []
        recommendations:
          - { source: r1, date: null, kind: book, why: "w", covers: [1] }
          - { source: r2, date: null, kind: other, why: "w", covers: [] }
          - { source: r3, date: null, kind: course, why: "w", covers: [] }
        dropped: { claim_unknown: 1, date_invalid: 3, section_unknown: 1 }
    - name: too_few_recommendations_kept_as_is
      output: '{"verdict": "outdated", "reasons": [], "claims": [], "recommendations": [{"source": "r1", "kind": "book", "why": "w", "covers": []}, {"source": "r2", "kind": "book", "why": "w", "covers": []}]}'
      expect:
        verdict: outdated
        reasons: []
        claim_status: []
        recommendations:
          - { source: r1, date: null, kind: book, why: "w", covers: [] }
          - { source: r2, date: null, kind: book, why: "w", covers: [] }
        dropped: { recommendations_short: 1 }
    - name: more_than_five_recommendations
      output: '{"verdict": "outdated", "reasons": [], "claims": [], "recommendations": [{"source": "r1", "kind": "book", "why": "1", "covers": []}, {"source": "r2", "kind": "book", "why": "2", "covers": []}, {"source": "r3", "kind": "book", "why": "3", "covers": []}, {"source": "r1", "kind": "book", "why": "4", "covers": []}, {"source": "r2", "kind": "book", "why": "5", "covers": []}, {"source": "r3", "kind": "book", "why": "6", "covers": []}, {"source": "r1", "kind": "book", "why": "7", "covers": []}]}'
      expect: { count: 5, dropped: { recommendations_over_max: 2 } }
    - name: over_long_reason
      output_reason_words: 80        # "word " × 80 as one reason's text: cut to ≤ 300 characters at a word boundary
      expect: { reason_chars: 299 }
    - { name: missing_recommendations, output: '{"verdict": "current", "reasons": [], "claims": []}', error: output_invalid }
    - { name: wrong_verdict, output: '{"verdict": "fresh", "reasons": [], "claims": [], "recommendations": []}', error: output_invalid }
    - { name: extra_key, output: '{"verdict": "current", "reasons": [], "claims": [], "recommendations": [], "summary": "s"}', error: output_invalid }
    - { name: wrong_status, output: '{"verdict": "current", "reasons": [], "claims": [{"id": "c1", "status": "maybe", "note": "n", "citations": []}], "recommendations": []}', error: output_invalid }
    - { name: covers_not_ints, output: '{"verdict": "current", "reasons": [], "claims": [], "recommendations": [{"source": "r1", "kind": "book", "why": "w", "covers": ["1"]}]}', error: output_invalid }
    - { name: citation_not_string, output: '{"verdict": "current", "reasons": [{"text": "t", "citations": [1]}], "claims": [], "recommendations": []}', error: output_invalid }
    # Unhashable enum values: a list or an object where an enum string belongs is output_invalid, never a crash.
    - { name: verdict_is_a_list, output: '{"verdict": ["current"], "reasons": [], "claims": [], "recommendations": []}', error: output_invalid }
    - { name: verdict_is_an_object, output: '{"verdict": {"v": "current"}, "reasons": [], "claims": [], "recommendations": []}', error: output_invalid }
    - { name: status_is_a_list, output: '{"verdict": "current", "reasons": [], "claims": [{"id": "c1", "status": ["changed"], "note": "n", "citations": []}], "recommendations": []}', error: output_invalid }
    - { name: status_is_an_object, output: '{"verdict": "current", "reasons": [], "claims": [{"id": "c1", "status": {}, "note": "n", "citations": []}], "recommendations": []}', error: output_invalid }
    - { name: kind_is_a_list, output: '{"verdict": "current", "reasons": [], "claims": [], "recommendations": [{"source": "r1", "kind": ["book"], "why": "w", "covers": []}]}', error: output_invalid }
    - { name: kind_is_an_object, output: '{"verdict": "current", "reasons": [], "claims": [], "recommendations": [{"source": "r1", "kind": {"k": "book"}, "why": "w", "covers": []}]}', error: output_invalid }
    # A lone surrogate as a JSON escape in model text: output_invalid (the report would not store).
    - { name: escaped_lone_surrogate_in_a_reason, output: '{"verdict": "current", "reasons": [{"text": "x\ud83dy", "citations": []}], "claims": [], "recommendations": []}', error: output_invalid }
