# VEC-FRESH-7 — query plans (FR-FRESH-5) for synthetic bibliographies, topics and claims; worked by hand from the
# templates: (1) original_edition = original title, first original author's surname, "new edition after", original
# edition, original year (only with an original title); (2) edition = title, first author's surname, publisher,
# "new edition", year; (3–5) claim = subject + the kind's words, for the three claims of highest confidence then
# lowest page; missing claims → topic_docs = a level-1 topic + "official documentation", in topic order;
# (6) books = the first level-1 topic + "book" + the current year. Template words are the material's language plus
# English. Over 120 characters, words go from the end of the longest variable part. A query holding a 6-word run of
# a non-front span, once bibliography strings, surnames and topic titles are masked, is dropped (`query_unsafe`).
# Topics are [id, title, level]. No book text: every string is synthetic.

cases:
  - name: english_full
    language: en
    today: "2026-11-23"
    bibliography: { title: "Practical Distributed Ledgers", authors: ["Ada Example", "Grace Sample"], edition: "3rd",
                    year: 2019, publisher: "Example Press" }
    topics: [[0, "Ledgers", 1], [1, "Blocks", 2], [2, "Consensus", 1], [4, "Clients", 1]]
    claims:
      - { id: c1, subject: "consensus protocol v1", kind: protocol, confidence: medium, page: 40 }
      - { id: c2, subject: "client library v1 API", kind: api, confidence: high, page: 88 }
      - { id: c3, subject: "block size limit", kind: statistic, confidence: high, page: 50 }
      - { id: c4, subject: "wallet format", kind: standard, confidence: low, page: 10 }
    non_front: ["alpha beta gamma"]
    expect:
      queries:
        - [edition, "Practical Distributed Ledgers Example Example Press new edition 2019"]
        - [claim, "block size limit official documentation"]        # high, page 50
        - [claim, "client library v1 API latest version"]           # high, page 88
        - [claim, "consensus protocol v1 current specification"]    # medium
        - [books, "Ledgers book 2026"]
      dropped: {}

  - name: russian_with_original_and_one_claim
    language: ru
    today: "2026-11-23"
    bibliography: { title: "Распределённые реестры на практике", authors: ["Ада Пример"], edition: "4-е изд.",
                    year: 2023, publisher: "Пример Пресс", original_title: "Practical Distributed Ledgers",
                    original_authors: ["Example, Ada"], original_edition: "4th", original_year: 2022 }
    topics: [[3, "Реестры", 1], [5, "Консенсус", 1], [9, "Клиенты", 1]]
    claims:
      - { id: c1, subject: "протокол консенсуса v1", kind: protocol, confidence: high, page: 12 }
    non_front: []
    expect:
      queries:
        - [original_edition, "Practical Distributed Ledgers Example новое издание после new edition after 4th 2022"]
        - [edition, "Распределённые реестры на практике Пример Пример Пресс новое издание new edition 2023"]
        - [claim, "протокол консенсуса v1 актуальная спецификация current specification"]
        - [topic_docs, "Реестры официальная документация official documentation"]
        - [topic_docs, "Консенсус официальная документация official documentation"]
        - [books, "Реестры книга book 2026"]
      dropped: {}

  - name: over_long_title
    language: en
    today: "2026-11-23"
    # The title is "Longword01 … Longword25" (274 characters). Fixed parts: surname 7 + publisher 13 + words 11 + year
    # 4 + 4 spaces = 39, one more space before them: the title keeps 7 words (76 characters), 116 in all.
    bibliography: { title: "Longword01 Longword02 Longword03 Longword04 Longword05 Longword06 Longword07 Longword08 Longword09 Longword10 Longword11 Longword12 Longword13 Longword14 Longword15 Longword16 Longword17 Longword18 Longword19 Longword20 Longword21 Longword22 Longword23 Longword24 Longword25",
                    authors: ["Ada Example"], year: 2019, publisher: "Example Press" }
    topics: [[1, "Topic", 1]]
    claims: []
    non_front: []
    expect:
      queries:
        - [edition, "Longword01 Longword02 Longword03 Longword04 Longword05 Longword06 Longword07 Example Example Press new edition 2019"]
        - [topic_docs, "Topic official documentation"]
        - [books, "Topic book 2026"]
      dropped: {}

  - name: unsafe_claim_query_dropped_and_topic_masked
    language: en
    today: "2026-11-23"
    bibliography: { title: "Mining", authors: [] }
    topics: [[2, "Proof of work chains explained", 1]]
    claims:
      - { id: c1, subject: "nonce search target adjusts", kind: version, confidence: high, page: 20 }
      - { id: c2, subject: "difficulty rule", kind: law, confidence: low, page: 30 }
    # "nonce search target adjusts latest version" is a 6-word run of this span: that claim query is dropped. The
    # topic query "Proof of work chains explained official documentation" is also a run of it, but the topic title is
    # masked, so only 2 unmasked words remain and it is kept.
    non_front: ["We see the nonce search target adjusts latest version each time. Proof of work chains explained official documentation book 2026 here."]
    expect:
      queries:
        - [edition, "Mining new edition"]
        - [claim, "difficulty rule current specification"]
        - [topic_docs, "Proof of work chains explained official documentation"]
        - [books, "Proof of work chains explained book 2026"]
      dropped: { query_unsafe: 1 }
