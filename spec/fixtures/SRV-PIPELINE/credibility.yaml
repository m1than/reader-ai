# VEC-PIPELINE-6: Admiralty credibility by verdict (FR-PIPELINE-27; ADR-0039 owner decision 12).
# Each case: the verdict after FR-PIPELINE-4's forcing, the model's credibility, the cited span ids (material A or B;
# `A`/`B` stand for two 64-hex material sha256s), and the value code keeps.
# Allowed sets: supported 1–3, unsupported 4 or 6, contradicted 5, source_too_large 6. Out of set → 3, 6, 5, 6.
# 1 ("confirmed by independent sources") needs cited spans from two or more materials, else 2.
cases:
  - { name: supported-kept,                 verdict: supported,        given: 3, spans: ["A:1"],        expect: 3 }
  - { name: supported-2-kept,               verdict: supported,        given: 2, spans: ["A:1"],        expect: 2 }
  - { name: supported-1-one-material,       verdict: supported,        given: 1, spans: ["A:1", "A:2"], expect: 2 }
  - { name: supported-1-two-materials,      verdict: supported,        given: 1, spans: ["A:1", "B:4"], expect: 1 }
  - { name: supported-out-of-set,           verdict: supported,        given: 5, spans: ["A:1"],        expect: 3 }
  - { name: unsupported-4-kept,             verdict: unsupported,      given: 4, spans: [],             expect: 4 }
  - { name: unsupported-6-kept,             verdict: unsupported,      given: 6, spans: [],             expect: 6 }
  - { name: unsupported-out-of-set,         verdict: unsupported,      given: 2, spans: [],             expect: 6 }
  - { name: forced-unsupported-from-1,      verdict: unsupported,      given: 1, spans: [],             expect: 6 }
  - { name: contradicted-kept,              verdict: contradicted,     given: 5, spans: ["A:3"],        expect: 5 }
  - { name: contradicted-out-of-set,        verdict: contradicted,     given: 1, spans: ["A:3", "B:1"], expect: 5 }
  - { name: source-too-large,               verdict: source_too_large, given: 4, spans: [],             expect: 6 }
  # r3_gates_revision (FR-PIPELINE-27 revised): locators (`spn:A:p<n>:<s>-<e>`) count by their material field, and a
  # locator and a legacy id of one material count once.
  - { name: supported-1-two-locators-one-material, verdict: supported, given: 1, spans: ["spn:A:p1:0-5", "spn:A:p2:0-7"], expect: 2 }
  - { name: supported-1-locators-two-materials,    verdict: supported, given: 1, spans: ["spn:A:p1:0-5", "spn:B:p1:0-5"], expect: 1 }
  - { name: supported-1-locator-and-legacy-same-material, verdict: supported, given: 1, spans: ["spn:A:p1:0-5", "A:1"], expect: 2 }
