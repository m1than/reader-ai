# VEC-OBS-4 (proposed; SRV-OBS V.obs-analytics, not approved). The additions to VEC-OBS-1 (attributes.yaml) and the
# derivation tables of FR-OBS-12..15, as data. Not read by shipped code until the amendment is approved; then its
# attribute, span-name and key entries merge into attributes.yaml, and this file keeps the derivation tables. The
# `blocked_on_ADR-0035` block (assessments, prompts, linked prompts) does not move until the owner accepts ADR-0035.
# Value rules as in attributes.yaml.
# Design review round 1 (B3): every MLflow key (`mlflow.spanType`, `mlflow.traceTag.*`, `mlflow.spanInputs`,
# `mlflow.spanOutputs`, `mlflow.llm.cost`, `session.id`) is derived by AllowListExporter from the span's name and its
# already-validated attributes. A caller-supplied key starting with `mlflow.` or equal to `session.id` is removed like
# any unlisted key. No JSON comes from a caller; no new rule type exists.
version: 1

attributes:
  reader.lesson.id: { type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
  reader.course.id: { type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
  # SRV-TUTOR's tutor_questions.state at the job's end ('queued' never is one).
  reader.tutor.state: { type: string, enum: [answered, failed, refused, expired] }
  # GenAI semconv token keys MLflow 3.18.0 reads (measured); they replace the two cache keys of VEC-OBS-1.
  gen_ai.operation.name: { type: string, enum: [invoke_agent] }
  gen_ai.provider.name: { type: string, enum: [anthropic] }
  gen_ai.usage.cache_read.input_tokens: { type: int, range: [0, 1000000000] }
  gen_ai.usage.cache_write.input_tokens: { type: int, range: [0, 1000000000] }
  # FR-OBS-12 (c): the input part of reader.cost_usd, computed by SRV-AGENT at the settle (B7).
  reader.cost_input_usd: { type: float, range: [0, 1000] }
  # FR-OBS-13 children.
  reader.retrieval.hits: { type: int, range: [0, 1000] }
  reader.retrieval.candidates: { type: int, range: [0, 10000] }
  reader.citations.total: { type: int, range: [0, 1000] }
  reader.citations.valid: { type: int, range: [0, 1000] }
  reader.claims.total: { type: int, range: [0, 10000] }
  reader.claims.supported: { type: int, range: [0, 10000] }
  reader.kernel.cells: { type: int, range: [0, 10000] }
  reader.kernel.cells_ok: { type: int, range: [0, 10000] }
  reader.kernel.ms: { type: int, range: [0, 86400000] }
  reader.kernel.exit: { type: int, range: [-255, 255] }
  reader.pages: { type: int, range: [0, 100000] }
  reader.bytes: { type: int, range: [0, 10000000000] }
  reader.chunks: { type: int, range: [0, 10000000] }
  reader.embed.vectors: { type: int, range: [0, 10000000] }
  reader.embed.batch: { type: int, range: [0, 100000] }

removed_attributes: [gen_ai.usage.cache_read_input_tokens, gen_ai.usage.cache_creation_input_tokens]

span_names:
  - { pattern: "^job\\.session$" }
  - { pattern: "^(tutor\\.retrieve|tutor\\.citations|verify\\.claims|verify\\.lab|kernel\\.run|ingest\\.parse|ingest\\.chunk|embed\\.batch)$" }

keys_by_span:
  job: [reader.lesson.id, reader.course.id, reader.tutor.state]   # added to VEC-OBS-1's job keys
  job.session: [reader.run_id, reader.lesson.id]
  agent.call: [gen_ai.operation.name, gen_ai.provider.name, gen_ai.usage.cache_read.input_tokens,
    gen_ai.usage.cache_write.input_tokens, reader.cost_input_usd, reader.lesson.id, reader.course.id, reader.step]
  tutor.retrieve: [reader.retrieval.hits, reader.retrieval.candidates]
  tutor.citations: [reader.citations.total, reader.citations.valid]
  verify.claims: [reader.claims.total, reader.claims.supported]
  verify.lab: [reader.kernel.cells, reader.kernel.cells_ok, reader.kernel.ms]
  kernel.run: [reader.kernel.cells, reader.kernel.exit]
  ingest.parse: [reader.pages, reader.bytes]
  ingest.chunk: [reader.chunks]
  embed.batch: [reader.embed.vectors, reader.embed.batch]

# job_args additions (FR-OBS-5 b): the lesson and course ids come from the job's own rows, read by the handler, not
# from args; listed here so the root carries them.
job_root_keys_from_handler:
  pipeline.stage: [reader.lesson.id, reader.course.id]
  pipeline.verify: [reader.lesson.id, reader.course.id]
  tutor.answer: [reader.lesson.id, reader.course.id, reader.tutor.state]

# --- Derivations done by AllowListExporter after validation (FR-OBS-12) ---

span_types:          # mlflow.spanType by span name; HTTP and WS spans get none
  "job *": CHAIN
  job.session: CHAIN
  agent.call: AGENT
  tutor.retrieve: RETRIEVER
  tutor.citations: PARSER
  verify.claims: PARSER
  verify.lab: TOOL
  kernel.run: TOOL
  ingest.parse: PARSER
  ingest.chunk: PARSER
  embed.batch: EMBEDDING

# Root spans only: `mlflow.traceTag.mlflow.traceName` = the span name, and `mlflow.traceTag.<key>` = str(value) for
# each of these keys the root carries (already validated; ints in decimal). No cost or cache tag (B non-blocking: they
# duplicated the Cost column and the token counts).
trace_tags: [reader.job.kind, reader.job.outcome, reader.job.attempt, reader.error_code, reader.error_class,
  reader.stage, reader.step, reader.run_id, reader.lesson.id, reader.course.id, reader.question_id]

# Previews: `mlflow.spanInputs` / `mlflow.spanOutputs` = a JSON object of {preview key: validated value} for the keys
# the root carries, in this order; nothing else. A preview key is never `model` (B3), never a free-text name.
previews:
  tutor.answer:
    inputs: { question_id: reader.question_id, lesson_id: reader.lesson.id }
    outputs: { outcome: reader.job.outcome, tutor_state: reader.tutor.state, error_code: reader.error_code }
  pipeline.stage:
    inputs: { run_id: reader.run_id, lesson_id: reader.lesson.id, stage: reader.stage, step: reader.step }
    outputs: { outcome: reader.job.outcome, error_code: reader.error_code }
  pipeline.verify:
    inputs: { run_id: reader.run_id, lesson_id: reader.lesson.id, stage: reader.stage, step: reader.step }
    outputs: { outcome: reader.job.outcome, error_code: reader.error_code }
  ingest.import:
    inputs: { material_sha256: reader.material_sha256 }
    outputs: { outcome: reader.job.outcome, error_code: reader.error_code }
forbidden_preview_keys: [model, messages, prompt, input, output, content, text]

# agent.call only, when reader.cost_usd is present (B7): input_cost = reader.cost_input_usd (0 when absent, capped
# at the total), output_cost = reader.cost_usd − input_cost in 6-place Decimal arithmetic (never float),
# total_cost = reader.cost_usd (the ledger's numeric(12,6)); omitted when reader.cost_usd is absent.
llm_cost: { span: agent.call, total: reader.cost_usd, input: reader.cost_input_usd }

# session.id: on `job.session` only, = reader.run_id (pipeline) or reader.lesson.id (tutor); see FR-OBS-12 (e).
session: { span: job.session, from: [reader.run_id, reader.lesson.id] }

# --- Blocked on ADR-0035 (review round 2, R2-1): nothing below moves at the amendment's approval. It moves, with
# FR-OBS-14, FR-OBS-15 and FR-OBS-12 (g), only after the owner accepts ADR-0035. ---
blocked_on_ADR-0035:
  attributes:
    # FR-OBS-12 (g): the registered template version the job used.
    reader.prompt.version: { type: int, range: [1, 100000] }
  keys_by_span:
    job: [reader.prompt.version]
  # FR-OBS-12 (g): mlflow.linkedPrompts = [{"name": <prompt name>, "version": str(reader.prompt.version)}], the name
  # from the root's job kind and stage.
  linked_prompts: { tutor.answer: reader.tutor, pipeline.stage: "reader.<reader.stage>", pipeline.verify: none }
  # FR-OBS-14: the assessment catalogue. A POST body is built only from this.
  assessments:
    - { name: fact_check.passed, value: bool, source_id: reader.pipeline.fact_check,
        metadata: { claims: [0, 10000], supported: [0, 10000] } }
    - { name: verify.passed, value: bool, source_id: reader.pipeline.verify, metadata: {} }
    - { name: verify.lab_passed, value: bool, source_id: reader.pipeline.verify,
        metadata: { cells: [0, 10000], cells_ok: [0, 10000] } }
    - { name: tutor.citations_valid, value: bool, source_id: reader.tutor.citations,
        metadata: { total: [0, 1000], valid: [0, 1000] } }
    - { name: tutor.citation_share, value: { float: [0, 1] }, source_id: reader.tutor.citations, metadata: {} }
  assessment_body: { source_type: CODE, rationale: never, metadata_values: decimal_strings }
  # FR-OBS-15: the prompt templates registered, by name and file.
  prompts:
    reader.draft: server/src/reader/pipeline/prompts/draft.v1.md
    reader.fact_check: server/src/reader/pipeline/prompts/fact_check.v1.md
    reader.adversarial_review: server/src/reader/pipeline/prompts/adversarial_review.v1.md
    reader.revise: server/src/reader/pipeline/prompts/revise.v1.md
    reader.tutor: server/src/reader/tutor/prompts/answer-v1.md
  job_kinds: [obs.feedback, obs.prompts]
