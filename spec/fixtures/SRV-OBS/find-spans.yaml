# The find subtree, in the order the spans are opened; every child is under `find`. `documents: cards` means the
# span is handed all 26 cards (as reader.obs.find.doc over each card's id, sha256, tokens and, on find.select only,
# judged) and exports the first 25: reader.doc.<i>.{uri, sha256, tokens[, judged]} and mlflow.spanOutputs (VEC-OBS-4
# `retriever_documents`).
find:
  - name: find
    open: { channel: owner, question_type: exact, entitled: true, k: 8, budget_tokens: 4000,
      brain_version: "b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1",
      policy_version: "c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2" }
    # caller_model absent: the owner channel's caller model is not known to find (as for an external MCP agent).
    done: { cards: 26, tokens: 2925, judged_tokens: 2190, unjudged_tokens: 735,
      judge: { ran: true, source: live, skip: timeout } }   # a skip with ran true is never exported
    expected:
      reader.find.channel: owner
      reader.find.question_type: exact
      reader.find.entitled: true
      reader.find.k: 8
      reader.find.budget_tokens: 4000
      reader.brain_version: "b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1"
      reader.policy_version: "c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2"
      reader.find.cards: 26
      reader.find.tokens: 2925
      reader.find.judged_tokens: 2190
      reader.find.unjudged_tokens: 735
      reader.judge_ran: true
      reader.judge_source: live
      mlflow.spanType: TOOL
  - name: find.route
    open: {}
    done: { route: exact_lookup, role: definition, form: text, reliability_min: B, topic: networks/protocols,
      identifiers: 1,
      identifiers_sha256: "96cc51d9e2f2e4bb34feea87da247b4b8bd4ca254580119100a726969165735e",
      concept_uri: "reader://h/8d026aa46646ff6bb28cc3d920beca380e639a8224e87178b3b79f50a4d7db54" }
    stage7: { identifiers: ["Протокол  Х"], concept_id: "con:term:протокол-х" }
    expected:
      reader.find.route: exact_lookup
      reader.find.filter.role: definition
      reader.find.filter.form: text
      reader.find.filter.reliability_min: B
      reader.find.filter.topic: networks/protocols
      reader.find.filter.identifiers: 1
      reader.find.filter.identifiers_sha256: "96cc51d9e2f2e4bb34feea87da247b4b8bd4ca254580119100a726969165735e"
      reader.find.filter.concept_uri: "reader://h/8d026aa46646ff6bb28cc3d920beca380e639a8224e87178b3b79f50a4d7db54"
      mlflow.spanType: ROUTER
  - name: find.retrieve
    open: { layer: L1, method: dense_fts_rrf }
    done: { candidates: 120, hits: 26, documents: cards }
    expected:
      reader.layer: L1
      reader.find.method: dense_fts_rrf
      reader.retrieval.candidates: 120
      reader.retrieval.hits: 26
      mlflow.spanType: RETRIEVER
  - name: find.preselect
    open: {}
    done: { merged: 2, gate: not_separated, expanded: false, candidates_in: 28, cards: 26, tokens: 2925,
      budget_tokens: 6000, documents: cards }
    expected:
      reader.find.merged: 2
      reader.find.gate: not_separated
      reader.find.expanded: false
      reader.find.candidates_in: 28
      reader.find.cards: 26
      reader.find.tokens: 2925
      reader.find.budget_tokens: 6000
      mlflow.spanType: RERANKER
  - name: find.judge_wait
    open: { input_sha256: "d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3", input_tokens: 2400 }
    done: { kept: 18, dropped: 2, judge: { ran: true, source: live } }
    expected:
      reader.judge.input_sha256: "d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3"
      reader.judge.input_tokens: 2400
      reader.judge.kept: 18
      reader.judge.dropped: 2
      reader.judge_ran: true
      reader.judge_source: live
      mlflow.spanType: CHAIN
  - name: find.select
    open: {}
    done: { cards: 26, tokens: 2925, judged_tokens: 2190, unjudged_tokens: 735, budget_tokens: 4000,
      documents: cards }
    expected:
      reader.find.cards: 26
      reader.find.tokens: 2925
      reader.find.judged_tokens: 2190
      reader.find.unjudged_tokens: 735
      reader.find.budget_tokens: 4000
      mlflow.spanType: RERANKER

# A judge that did not run: the skip reason only; a source handed with ran false is never exported.
judge_skipped:
  judge: { ran: false, source: recorded, skip: gate }
  expected: { reader.judge_ran: false, reader.judge_skip: gate }

