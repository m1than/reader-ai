# VEC-OBS-7 (SRV-OBS FR-OBS-36, -37; ADR-0039 B9). Hand-derived: one recorded `find` on the owner channel with a
# sliced judge (it judged the first 20 of 26 returned cards), and one pack build and one link run, each as what the
# caller hands the reader.obs helpers (`open` and `done`, in the helpers' own parameter names) and the span the
# AllowListExporter exports (validated keys plus the derived mlflow.spanType and mlflow.spanOutputs).
#
# `cards` holds 26 cards of every id form, in rank order; the documents of a span are its first 25 (index 0..24):
# the 26th card is counted in reader.find.cards and listed nowhere. `uri` is the expected document uri: clear only
# for a PDF span locator `spn:<64 hex>:p<page>:<start>-<end>[#<n>]`, `fnd:<uuid>` and `les:<uuid>`; every other id
# (sec: outline paths, src:, con: and non-PDF spn: ids, and an spn: id in upper case) is reader://h/<sha256 of the
# id's UTF-8 bytes>, since it may carry heading, file-path or term text of the material.
#
# The stage-7 case: the question's one identifier "Протокол  Х" resolves to the term concept `con:term:протокол-х`
# (Cyrillic text in its id). The route span carries the identifier count, the sha256 of the sorted, normalised
# identifiers joined by U+001F (normalised: NFKC, casefolded, whitespace runs collapsed to one space, trimmed) and
# the concept only as reader://h/<sha256 of the concept id>. No exported byte holds "протокол" or "Протокол".
#
# `catalogs`: the code-declared sets this vector assumes (SRV-SEARCH's route ids, the facets file, reader.yaml
# sectors); tests pass them to reader.obs.attributes.Catalogs.
version: 1

catalogs:
  find_routes: [exact_lookup, thematic_overview, current_state, fact_check]
  facet_values: { role: [definition, procedure, example], form: [text, table, figure] }
  topic_paths: [networks/protocols, networks/security]

hidden_text: ["протокол", "Протокол", "Глава", "Протоколы", "bashir", "intro.md", "materials/"]

cards:
