# VEC-OBS-6 (proposed, SRV-OBS FR-OBS-26): the declarative MLflow bootstrap. At Green this file moves to
# deploy/otel/mlflow-setup.yaml (OPS-DEPLOY paired change) and is read by the worker's `obs.setup` job; it is the only
# source of MLflow's experiments, their descriptions and tags, the dataset names, the LoggedModel naming and the
# trace tag keys. Nothing is created by hand in the UI. `obs.setup` compares MLflow's state with this file and writes
# only the difference, so a re-run is a no-op (no drift).
version: 1
experiments:
  - id: "0"                 # MLflow's Default: OTLP sends every trace here (Rotel's x-mlflow-experiment-id=0)
    name: reader            # renamed from Default by obs.setup (experiments/update)
    description: "reader-ai traces, compile and import Runs, owner label mirrors (SRV-OBS)"
    tags:
      mlflow.note.content: "reader-ai traces, compile and import Runs, owner label mirrors (SRV-OBS)"
      reader.kind: traces
      reader.managed_by: obs.setup
  - name: bench
    description: "Bench datasets and evaluation Runs from owner uploads (SRV-OBS FR-OBS-22, -23)"
    tags:
      mlflow.note.content: "Bench datasets and evaluation Runs from owner uploads (SRV-OBS FR-OBS-22, -23)"
      reader.kind: bench
      reader.managed_by: obs.setup
datasets:                   # created by obs.bench from a pinned set, in experiment `bench` (VEC-OBS-5 bench_sets)
  names: [tutor-bench-v2, search-bench-v1, search-bench-v2]
logged_models:
  name: reader-agent        # one per version key (FR-OBS-21), experiment "0"
  tag: reader.version_key
  params: [prompt_set_sha256, stage_models, pipeline_config_sha256]
trace_tags:                 # the root tags AllowListExporter derives (VEC-OBS-4 trace_tags), listed for the owner
  - reader.job.kind
  - reader.job.outcome
  - reader.stage
  - reader.error_code
  - reader.lesson.id
  - reader.course.id
  - reader.run_id
  - reader.version_key
run_tags:                   # VEC-OBS-5 runs.*.tags
  - reader.kind
  - reader.run_id
  - reader.ingest_id
  - reader.complete
  - reader.bench
  - reader.bench_upload
