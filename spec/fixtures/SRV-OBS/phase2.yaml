# VEC-OBS-5 (proposed, SRV-OBS phase 2; design review round 1, B4): the catalogues every phase 2 write and upload is
# built from or checked against. Every object rejects unknown keys (`extra: forbid`); every string has a pattern or an
# enum; every number a range. No free text anywhere except the pinned bench questions, which are committed repository
# data (the agent's own wording, checked verbatim against the book: FR-OBS-22).
version: 1

patterns:
  uuid: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  sha256: "^[0-9a-f]{64}$"
  commit: "^[0-9a-f]{7,40}$"
  date: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  datetime: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z?$"
  branch: "^[A-Za-z0-9._/-]{1,100}$"
  question_id: "^[a-z][0-9]{2}$"
  version_key: "^[0-9a-f]{12}$"
  model: { enum_from: pricing.yaml models }
  hf_model: "^[A-Za-z0-9_.-]{1,64}/[A-Za-z0-9_.-]{1,96}$"
  stage: { enum_from: SRV-PIPELINE declared stages }

# FR-OBS-20: a compile or import Run. Params are write-once in MLflow (measured round 8: a changed value is 400
# "Changing param values is not allowed"), so everything that can change between two ends of one run is a metric or
# a tag.
runs:
  compile:
    name: "compile {run_id[:8]}"
    tags: { reader.kind: { enum: [compile] }, reader.run_id: uuid, reader.lesson.id: uuid, reader.course.id: uuid,
            reader.outcome: { enum: [finished, failed, dead, cancelled] }, reader.ends: { int: [1, 100] },
            reader.complete: { enum: ["true"] }, reader.snapshot_at: datetime }
    params: { version_key: version_key, reader_version: "^[0-9A-Za-z.+-]{1,64}$", "model.<stage>": model }
    metrics:
      "cost_usd.<stage>": { float: [0, 1000] }
      cost_usd.total: { float: [0, 1000] }
      open_reserves: { int: [0, 10000] }
      tokens.input: { int: [0, 1000000000] }
      tokens.output: { int: [0, 1000000000] }
      duration_s.total: { float: [0, 1000000] }
      claims.total: { int: [0, 100000] }
      claims.supported: { int: [0, 100000] }
      labs.cells: { int: [0, 100000] }
      labs.cells_ok: { int: [0, 100000] }
      pages: { int: [0, 100000] }
      loops: { int: [0, 100] }
  ingest:
    name: "import {material_sha256[:8]}"
    tags: { reader.kind: { enum: [ingest] }, reader.ingest_id: uuid, reader.material_sha256: sha256,
            reader.outcome: { enum: [succeeded, dead] }, reader.ends: { int: [1, 100] },
            reader.complete: { enum: ["true"] }, reader.snapshot_at: datetime }
    params: { converter_version: "^[0-9A-Za-z.+-]{1,32}$", material_sha256: sha256 }
    metrics: { pages: { int: [0, 100000] }, spans: { int: [0, 10000000] }, chunks: { int: [0, 10000000] },
               pages_per_min_import: { float: [0, 100000] }, import_s: { float: [0, 1000000] } }

# FR-OBS-22: the bench sets a dataset may be registered from, by file sha256, with the records each may register.
bench_sets:
  tutor-bench-v2:
    file: spec/fixtures/SRV-OBS/bench-tutor-v2.yaml   # generated by compose-bench.mjs (B5): one file, one sha256
    sha256: 1ff4434c027aa3d8f9aa981eb946d0dcef8e7fdf097de4c463f92384c8b6fdce
    kind: tutor
    records: all            # 40; round 8 check: longest shared run 4 words
  search-bench-v1:
    file: spikes/embeddings-local/questions.yaml
    sha256: e543202459cc89d896e99145a875fab7bf62d16bca2d1041aff2f042a7e40f04
    kind: search
    exclude: [q04, q07, q08, q13]   # each shares a 5-word run with the book (round 8 check)
# One set, one kind: the upload's result carries a required `kind`, which must equal its set's (review round 2, N3).
# A search set over questions-v2 is not pinned for now (its 2026-11-20 run used v03, which the composed file lacks).
# A dataset record: exactly these keys.
dataset_record:
  inputs: { question_id: question_id, question: { pinned: true }, chapter: { int: [1, 23] } }
  expectations: { gold_pages: { list: { int: [1, 2000] }, min: 1, max: 20 } }

# FR-OBS-23: the result files an upload may carry. Each carries a required `kind`, which must equal the pinned set's
# kind (else 400 bench_invalid; review round 2, N3).
bench_results:
  search:   # spikes/embeddings-local/bench.py's output plus `kind: search` (paired change at Green: bench.py writes it)
    required: { kind: { enum: [search] }, model: hf_model, chunk_chars: { int: [100, 100000] },
                overlap: { int: [0, 10000] },
                questions: { int: [1, 1000] }, per_question: { list: per_question, max: 1000 } }
    optional:
      pages: { list: { int: [1, 100000] }, max: 2 }
      chunks: { int: [0, 10000000] }
      full_pilot_chunks: { int: [0, 10000000] }
      max_seq_length: { int: [1, 1000000] }
      load_s: { float: [0, 100000] }
      cache: { enum: [hit, miss] }
      embed_s: { float: [0, 1000000] }
      chunks_per_s: { float: [0, 100000] }
      embed_measured_at: datetime
      embed_torch_threads: { int: [1, 1024] }
      torch_threads: { int: [1, 1024] }
      est_full_pilot_min: { float: [0, 100000] }
      questions_file: { enum: [/in/questions.yaml] }
      recall_at_1: { float: [0, 1] }
      recall_at_3: { float: [0, 1] }
      recall_at_10: { float: [0, 1] }
      mrr: { float: [0, 1] }
      worst_rank: { int: [1, 10000000] }
      cpu: { enum: [aarch64, x86_64] }
    per_question: { id: question_id, rank: { int_or_null: [1, 10000000] }, hit: bool,
                    top_pages: { list: { int: [1, 100000] }, max: 50 } }
    rule: "every per_question id is a record id of the uploaded set"
  tutor:    # the bench's records file (VEC-TUTOR-7 tutor-bench-<UTC time>.json) with SRV-TUTOR FR-TUTOR-15's header
    required:
      kind: { enum: [tutor] }
      date: date
      branch: branch
      commit: commit
      lesson_id: uuid
      set: { enum: [tutor-bench-v2] }
      records: { list: tutor_record, min: 1, max: 1000 }
    tutor_record:   # web/src/tutor/bench.ts BenchRecord, exactly these keys
      id: question_id
      chapter: { int: [1, 23] }
      question_id: { uuid_or_null: true }
      state: { enum_or_null: [answered, failed, insufficient, expired, refused, queued] }
      wall_s: { float: [0, 3600] }
      usd: { float: [0, 100] }
      output_tokens: { int: [0, 1000000] }
      thinking_tokens: { int_or_null: [0, 1000000] }
      grounded: bool
      insufficient: bool
      blocks: { int: [0, 1000] }
      blocks_with_verified_quote: { int: [0, 1000] }
      gold_in_top8: bool
      gold_cited: bool
    rule: "every record id is a record id of the uploaded set; scores are recomputed from the records (R4)"
# The tutor SUMMARY's numbers-only shape (a report, not an upload) lives with its owner:
# spec/fixtures/SRV-TUTOR/bench-summary.yaml (design review round 4).
upload: { max_bytes: 262144, content_type: application/json }

# FR-OBS-24: owner labels (Postgres `owner_labels` is the record; MLflow gets a HUMAN assessment mirror; the mirror is
# found again by assessment_name + metadata.revision).
labels:
  targets:
    lesson: { assessment: owner.lesson_ok, trace: "the lesson's newest compile run's revise-stage job" }
    answer: { assessment: owner.answer_ok, trace: "the question's tutor.answer job" }
  reasons: [wrong_fact, unclear, off_topic, broken_lab, bad_citation, other]
  source: { source_type: HUMAN, source_id: owner }
  metadata: { lesson_id: uuid, question_id: uuid, reason: { enum_from: reasons }, revision: { int: [1, 10000] } }

# FR-OBS-25: alert codes on /observability.
alerts:
  - { code: daily_spend_high, value: "a task's spend today", limit: "0.8 × that task's daily cap (FR-AGENT-12)" }
  - { code: run_over_cap, value: "an open run's spend", limit: "0.8 × its run cap" }
  - { code: dead_jobs, value: "dead jobs in the window", limit: 0 }
  - { code: bench_regressed, value: "newest bench result's hit@10 or grounded_share", limit: "previous same (kind, set, model) − 0.05" }
  - { code: obs_unhealthy, value: "a stack member's last probe", limit: "ok and younger than 75 minutes (FR-OBS-32)" }
# obs_store_large is a reader doctor/status warning (FR-OBS-31), not an api alert (review round 2, N8).

# The worker → MLflow requests of phase 2 (ADR-0038), measured as raw REST in round 8
# (results/20261124T150936-round8-rest/round8.json `raw`) and round 10 (results/20261124T153052-round10-setup:
# setup, finalize, dataset search, retention deletes) and round 12 (results/20261124T155700-round12-rest: a
# same-value param re-log, the LoggedModel tag PATCH). Body keys only; values come from the tables above.
writes:
  - { kind: obs.setup, method: GET, path: /api/2.0/mlflow/experiments/get, query: [experiment_id] }
  - { kind: obs.setup, method: GET, path: /api/2.0/mlflow/experiments/get-by-name, query: [experiment_name] }
  - { kind: obs.setup, method: PATCH, path: "/api/2.0/mlflow/logged-models/{id}", body: [model_id, status] }
  - { kind: obs.setup, method: POST, path: /api/2.0/mlflow/experiments/create, body: [name, tags] }
  - { kind: obs.setup, method: POST, path: /api/2.0/mlflow/experiments/update, body: [experiment_id, new_name] }
  - { kind: obs.setup, method: POST, path: /api/2.0/mlflow/experiments/set-experiment-tag, body: [experiment_id, key, value] }
  - { kind: obs.setup, method: POST, path: /api/2.0/mlflow/logged-models/search, body: [experiment_ids, filter] }
  - { kind: obs.setup, method: POST, path: /api/2.0/mlflow/logged-models, body: [experiment_id, name, params, tags] }
  - { kind: obs.runs, method: POST, path: /api/2.0/mlflow/runs/search, body: [experiment_ids, filter, max_results] }
  - { kind: obs.runs, method: POST, path: /api/2.0/mlflow/runs/create, body: [experiment_id, run_name, start_time, tags] }
  - { kind: obs.runs, method: POST, path: /api/2.0/mlflow/runs/log-batch, body: [run_id, params, metrics, tags] }
  - { kind: obs.runs, method: POST, path: /api/2.0/mlflow/runs/update, body: [run_id, status, end_time] }
  - { kind: obs.runs, method: POST, path: /api/2.0/mlflow/runs/set-tag, body: [run_id, key, value] }
  - { kind: obs.runs, method: POST, path: /ajax-api/3.0/mlflow/traces/search, body: [locations, filter, max_results, page_token],
      max_results: 500 }
  - { kind: obs.runs, method: POST, path: /api/2.0/mlflow/traces/link-to-run, body: [trace_ids, run_id], max_ids: 100 }
  - { kind: obs.bench, method: POST, path: /api/3.0/mlflow/datasets/search, body: [experiment_ids, filter_string] }
  - { kind: obs.bench, method: POST, path: /api/3.0/mlflow/datasets/create, body: [name, experiment_ids, tags] }
  - { kind: obs.bench, method: POST, path: "/api/3.0/mlflow/datasets/{id}/records", body: [records] }
  - { kind: obs.bench, method: POST, path: /api/2.0/mlflow/runs/log-inputs, body: [run_id, datasets] }
  - { kind: obs.label, method: POST, path: "/api/3.0/mlflow/traces/{trace_id}/assessments", body: [assessment],
      assessment_keys: [assessment_name, trace_id, source, feedback, metadata, overrides] }
  - { kind: obs.health, method: GET, path: /health }
  - { kind: obs.label, method: GET, path: /ajax-api/3.0/mlflow/traces/get, query: [trace_id] }
  - { kind: obs.retention, method: POST, path: /api/2.0/mlflow/runs/delete, body: [run_id] }
  - { kind: obs.retention, method: DELETE, path: "/api/2.0/mlflow/logged-models/{id}" }
  - { kind: obs.setup, method: PATCH, path: "/api/2.0/mlflow/logged-models/{id}/tags", body: [tags], tag: reader.last_started }
