# VEC-DEPLOY-3: the override OPS-CLI must emit, in memory, for one configured user (handle `ivan`).
# It carries no secrets: FR-DEPLOY-10 delivers them after start over `docker exec -i` (spikes/compose-secrets-ro).
# kernel-user-ivan is fully expanded: every key equals the base file's rendered `x-kernel` (FR-DEPLOY-8), and only
# `networks` differs. INV-DEPLOY-8 compares field by field; there is no merge step in the test.
services:
  kernel-user-ivan:
    image: reader-kernel:local
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /home/lab:noexec,size=256m,uid=1000
      - /tmp:noexec,size=256m,uid=1000
      - /run/evcxr:exec,nosuid,nodev,size=1g,uid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: always
    profiles: [kernels]
    healthcheck:
      test: ["CMD", "/usr/local/bin/reader-kernel-health"]
    networks: [sb-user-ivan]
  api:
    networks:
      sb-user-ivan: {}

networks:
  sb-user-ivan:
    internal: true
