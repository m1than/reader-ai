# VEC-DEPLOY-3: the override OPS-CLI must emit, in memory, for one configured user (handle `ivan`).
# It carries no secrets: FR-DEPLOY-10 delivers them after start over `docker exec -i` (spikes/compose-secrets-ro).
# kernel-user-ivan is fully expanded with FR-DEPLOY-8's literal values. INV-DEPLOY-8 asserts that all rendered kernel
# services (the base's static ones and this one) are equal to each other on every key except `networks`, and that one
# of them equals FR-DEPLOY-8's literals after size normalisation (Compose renders 2g as 2147483648; tmpfs options are
# compared as sets). There is no merge step in the test.
# The override also binds the owner's reader.yaml read-only into api, worker, worker-judge, mcp and agent-proxy, and only those
# (FR-DEPLOY-5); compose.yaml sets READER_CONFIG to the target path on the three server roles. The source path is the test path of OPS-CLI's VEC-CLI-2;
# at `reader up` OPS-CLI writes the owner's real path.
# `create_host_path: false`: a missing file fails the start instead of Docker creating a directory in its place.
x-reader-config: &reader-config
  type: bind
  source: /tmp/reader-ai-test/reader.yaml # equal to OPS-CLI's VEC-CLI-2, so the two fixtures stay equal
  target: /etc/reader/reader.yaml
  read_only: true
  bind:
    create_host_path: false

services:
  kernel-user-ivan:
    image: reader-kernel:local
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /home/lab:noexec,size=256m,uid=1000
      - /tmp:noexec,size=256m,uid=1000
      - /run/evcxr:exec,nosuid,nodev,size=1g,uid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: always
    profiles: [kernels]
    healthcheck:
      test: ["CMD", "/usr/local/bin/reader-kernel-health"]
    networks: [sb-user-ivan]
  api:
    networks:
      sb-user-ivan: {}
    volumes: [*reader-config]
  worker:
    volumes: [*reader-config]
  worker-judge: # FR-DEPLOY-16 (f): the judge lane reads tasks and budgets
    volumes: [*reader-config]
  mcp:
    volumes: [*reader-config]
  agent-proxy:
    volumes: [*reader-config]

networks:
  sb-user-ivan:
    internal: true
