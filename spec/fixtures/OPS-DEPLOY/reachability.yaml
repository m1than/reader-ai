# VEC-DEPLOY-2: allowed pairs of services that share at least one network.
# Sources: ADR-0012 (edge/core), ADR-0022 (kernel routes: api ↔ kernel-<user>, kernel-pair-*; worker ↔ kernel-verify,
# kernel-agent; no other service reaches a kernel), ADR-0025 (only worker ↔ agent-proxy; agent-proxy alone has
# provider egress). Rotel and the trace backend are SRV-OBS's (stage 2) and not part of this matrix.
# The [config] test renders the model with every profile (default, kernels, agents, mcp) plus cli-override.example.yaml
# and asserts that the set of unordered pairs sharing a network equals `allowed` exactly. `kernel-user-ivan` stands for
# every kernel-<user> service generated by OPS-CLI.
allowed:
  - [caddy, api]               # front
  - [caddy, mcp]               # front
  - [api, mcp]                 # front, core
  - [api, worker]              # core
  - [api, postgres]            # core
  - [api, kernel-user-ivan]    # sb-user-ivan
  - [api, kernel-pair-1]       # sb-pair-1
  - [worker, mcp]              # core
  - [worker, postgres]         # core
  - [worker, agent-proxy]      # agentnet
  - [worker, kernel-verify]    # sb-verify
  - [worker, kernel-agent]     # sb-agent
  - [mcp, postgres]            # core
internet_egress: [caddy, agent-proxy]   # members of the only non-internal networks (edge, egress)
never:
  # explicit negatives, also implied by `allowed` being exact
  - [kernel-verify, kernel-agent]
  - [kernel-user-ivan, kernel-pair-1]
  - [kernel-agent, agent-proxy]
  - [kernel-verify, postgres]
  - [api, agent-proxy]
  - [caddy, postgres]
  - [caddy, worker]
