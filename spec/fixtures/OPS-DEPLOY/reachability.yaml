# VEC-DEPLOY-2: allowed pairs of services that share at least one network.
# Sources: ADR-0012 (edge/core), ADR-0022 (kernel routes: api ↔ kernel-<user>, kernel-pair-*; worker ↔ kernel-verify,
# kernel-agent; no other service reaches a kernel), ADR-0025 (only worker ↔ agent-proxy; agent-proxy alone has
# provider egress), ADR-0032 (otel: api, worker, rotel; obs: rotel, mlflow, worker for retention only; obs-ui: caddy,
# mlflow). The [config] test renders the model with every profile (default, kernels, agents, mcp, observability) plus
# cli-override.example.yaml
# and asserts that the set of unordered pairs sharing a network equals `allowed` exactly. `kernel-user-ivan` stands for
# every kernel-<user> service generated by OPS-CLI.
allowed:
  - [caddy, api]               # front
  - [caddy, mcp]               # front
  - [api, mcp]                 # front, core
  - [api, worker]              # core
  - [api, postgres]            # core
  - [api, kernel-user-ivan]    # sb-user-ivan
  - [api, kernel-pair-1]       # sb-pair-1
  - [worker, mcp]              # core
  - [worker, postgres]         # core
  - [worker, agent-proxy]      # agentnet
  - [worker, kernel-verify]    # sb-verify
  - [worker, kernel-agent]     # sb-agent
  - [mcp, postgres]            # core
  - [api, embed]               # embed (ADR-0028)
  - [worker, embed]            # embed (ADR-0028)
  - [api, rotel]               # otel (ADR-0032)
  - [worker, rotel]            # otel
  - [rotel, mlflow]            # obs
  - [worker, mlflow]           # obs: the retention job only (ADR-0032 amends ADR-0025 rule 5)
  - [caddy, mlflow]            # obs-ui
  - [rotel, jaeger]            # jaeger-in (ADR-0033, SRV-OBS FR-OBS-19)
  - [caddy, jaeger]            # jaeger-ui
  # ADR-0039 B7b (OPS-DEPLOY FR-DEPLOY-16): worker-judge reaches agent-proxy, Postgres and Rotel only; it shares
  # agentnet and otel with the worker and otel with the api, none of which listens there (FR-DEPLOY-4).
  - [worker, worker-judge]     # agentnet, otel
  - [worker-judge, agent-proxy]  # agentnet
  - [worker-judge, postgres]   # judge-db
  - [worker-judge, rotel]      # otel
  - [api, worker-judge]        # otel
internet_egress: [caddy, agent-proxy]   # members of the only non-internal networks (edge, egress)
never:
  # explicit negatives, also implied by `allowed` being exact
  - [worker-judge, mcp]
  - [worker-judge, caddy]
  - [worker-judge, embed]
  - [worker-judge, mlflow]
  - [worker-judge, jaeger]
  - [worker-judge, kernel-verify]
  - [worker-judge, kernel-agent]
  - [worker-judge, kernel-pair-1]
  - [worker-judge, kernel-user-ivan]
  - [kernel-verify, kernel-agent]
  - [kernel-user-ivan, kernel-pair-1]
  - [kernel-agent, agent-proxy]
  - [kernel-verify, postgres]
  - [api, agent-proxy]
  - [caddy, postgres]
  - [caddy, worker]
  - [embed, postgres]          # ADR-0028: embed reaches no store
  - [embed, mcp]
  - [embed, agent-proxy]
  - [embed, caddy]
  - [embed, kernel-user-ivan]
  - [embed, kernel-pair-1]
  - [embed, kernel-verify]
  - [embed, kernel-agent]
  - [caddy, rotel]             # ADR-0032: the edge never reaches the collector
  - [mlflow, api]
  - [mlflow, postgres]
  - [mlflow, embed]
  - [mlflow, agent-proxy]
  - [mlflow, mcp]
  - [mlflow, kernel-verify]
  - [mlflow, kernel-agent]
  - [mlflow, kernel-pair-1]
  - [mlflow, kernel-user-ivan]
  - [rotel, postgres]
  - [rotel, embed]
  - [rotel, agent-proxy]
  - [rotel, mcp]
  - [rotel, kernel-verify]
  - [rotel, kernel-agent]
  - [rotel, kernel-pair-1]
  - [rotel, kernel-user-ivan]
  # ADR-0033: Jaeger reaches nothing and is reached by rotel and caddy only.
  - [jaeger, api]
  - [jaeger, worker]
  - [jaeger, mlflow]
  - [jaeger, postgres]
  - [jaeger, embed]
  - [jaeger, agent-proxy]
  - [jaeger, mcp]
  - [jaeger, kernel-verify]
  - [jaeger, kernel-agent]
  - [jaeger, kernel-pair-1]
  - [jaeger, kernel-user-ivan]
