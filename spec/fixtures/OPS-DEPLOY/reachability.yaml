# VEC-DEPLOY-2: allowed service-to-service reachability (two services share at least one network).
# Sources: ADR-0012 (edge/core/sandbox), ADR-0022 (kernel routes: api → kernel-<user>, kernel-pair-*; worker →
# kernel-verify, kernel-agent; no other service reaches a kernel), ADR-0025 (only worker ↔ agent-proxy; agent-proxy
# alone has internet egress), ADR-0018 (telemetry to rotel; rotel ↔ the trace backend).
# The [config] test renders the model with every profile (one traces-* at a time) plus cli-override.example.yaml and
# asserts that the set of unordered pairs sharing a network equals `allowed` exactly. `kernel-user-ivan` stands for
# every kernel-<user> service generated by OPS-CLI.
allowed:
  - [caddy, api]
  - [caddy, mcp]
  - [api, mcp]            # both on front/core/otel
  - [api, worker]         # core, otel
  - [api, postgres]
  - [api, rotel]
  - [api, kernel-user-ivan]
  - [api, kernel-pair-1]
  - [worker, mcp]         # core, otel
  - [worker, postgres]
  - [worker, rotel]
  - [worker, agent-proxy]
  - [worker, kernel-verify]
  - [worker, kernel-agent]
  - [mcp, postgres]
  - [mcp, rotel]
  - [rotel, trace-backend]   # the active traces-mlflow or traces-phoenix service
  - [api, trace-backend]     # otel members share the network with the backend
  - [worker, trace-backend]
  - [mcp, trace-backend]
internet_egress: [caddy, agent-proxy]   # members of the only non-internal networks (edge, egress)
never:
  # explicit negatives, also covered by `allowed` being exact
  - [kernel-verify, kernel-agent]
  - [kernel-user-ivan, kernel-pair-1]
  - [kernel-agent, agent-proxy]
  - [kernel-verify, postgres]
  - [api, agent-proxy]
  - [caddy, postgres]
