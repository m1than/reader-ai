# VEC-CLI-2: the override FR-CLI-4 must emit, in memory, for VEC-CLI-1 (users ivan and anna). The kernel service body is
# the `x-kernel` field of deploy/compose.yaml's parsed source; this fixture repeats OPS-DEPLOY's VEC-DEPLOY-3 body, and
# for `ivan` alone the expected override is VEC-DEPLOY-3 as OPS-DEPLOY amends it to the same shape. Comparison is
# INV-DEPLOY-8's equality. The test loads VEC-CLI-1 from /tmp/reader-ai-test/reader.yaml (already absolute and resolved,
# no `$`), so that path is the bind source on api, worker and mcp (FR-CLI-4). Further cases the test derives from this
# fixture: a config path containing `$`, and one that is not absolute after resolution, make `up` refuse before any
# `docker compose` call. No secrets.
services:
  kernel-user-ivan:
    image: reader-kernel:local
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /home/lab:noexec,size=256m,uid=1000
      - /tmp:noexec,size=256m,uid=1000
      - /run/evcxr:exec,nosuid,nodev,size=1g,uid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: always
    profiles: [kernels]
    healthcheck:
      test: ["CMD", "/usr/local/bin/reader-kernel-health"]
    networks: [sb-user-ivan]
  kernel-user-anna:
    image: reader-kernel:local
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /home/lab:noexec,size=256m,uid=1000
      - /tmp:noexec,size=256m,uid=1000
      - /run/evcxr:exec,nosuid,nodev,size=1g,uid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: always
    profiles: [kernels]
    healthcheck:
      test: ["CMD", "/usr/local/bin/reader-kernel-health"]
    networks: [sb-user-anna]
  api:
    networks:
      sb-user-ivan: {}
      sb-user-anna: {}
    volumes:
      - { type: bind, source: /tmp/reader-ai-test/reader.yaml, target: /etc/reader/reader.yaml, read_only: true }
    environment:
      READER_CONFIG: /etc/reader/reader.yaml
  worker:
    volumes:
      - { type: bind, source: /tmp/reader-ai-test/reader.yaml, target: /etc/reader/reader.yaml, read_only: true }
    environment:
      READER_CONFIG: /etc/reader/reader.yaml
  mcp:
    volumes:
      - { type: bind, source: /tmp/reader-ai-test/reader.yaml, target: /etc/reader/reader.yaml, read_only: true }
    environment:
      READER_CONFIG: /etc/reader/reader.yaml

networks:
  sb-user-ivan:
    internal: true
  sb-user-anna:
    internal: true
