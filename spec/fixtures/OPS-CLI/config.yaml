# VEC-CLI-1: a reader.yaml (SRV-CONFIG field table) with two users and env, keychain, op and hostfile references.
# References only; no secret values. The hostfile path is a placeholder the tests replace with a temporary file; the
# env variable is set by the test to a canary value and must never reach a subprocess environment (INV-CLI-2).
version: 1
instance:
  url: https://localhost
  data_dir: ./data
users:
  - handle: ivan
    role: owner
    providers:
      - kind: claude-subscription
        token: secret://keychain/reader-ai/claude-oauth-token
      - kind: api-key
        token: secret://env/READER_TEST_TOKEN
  - handle: anna
    role: learner
    providers:
      - kind: claude-subscription
        token: secret://op/Private/anna-claude/token
      - kind: api-key
        token: secret://hostfile/tmp/reader-ai-test/anna-api-key
# FR-CLI-22 (paired SRV-OBS change): off here, so the profile sets of the FR-CLI-5 tests stay as written;
# server/tests/cli/test_observability.py turns it on.
observability:
  enabled: false
