# Typed evaluation set of the Bashir pilot, version 1 (ADR-0039 B9; docs/plans/adr-0039-execution.md V.kl-eval-set).
# It extends the owner-accepted sets and replaces none of them: search-bench-v1 (spikes/embeddings-local/questions.yaml),
# questions-v2 (spikes/embeddings-local/questions-v2.yaml) and t01 (spec/fixtures/SRV-TUTOR/bench-fixed.yaml, which
# replaces v03 in tutor-bench-v2). Those files stay as they are.
#
# Rules:
#   - 90 records, 30 per type. exact: one specific fact (a name, number, address, command or list) found in one
#     place; thematic: a mechanism or comparison explained across a section; fact-check: a claim to verify against
#     the book (ADR-0039 route "L1 only"), with `claim_holds` true or false (14 true, 16 false).
#     Current-state questions wait for S7.spike.pack-links, which brings newer sources.
#   - Record: id, type, origin (v1 | v2 | t01: reused with its id, question and chapter byte-identical to the
#     source; new: written for this set, ids e01-e04 and f01-f30), chapter, topic, question (Russian),
#     gold_pages, expected_facts, claim_holds (fact-check only), note (optional).
#   - gold_pages: PDF page numbers (1-based, as in the sources), each entry "N" or "N-M" inclusive, all inside the
#     chapter. A retrieval hit is any gold page among the top-k results' pages. Reused records keep the source's
#     pages unless a note says what was added and why.
#   - expected_facts: 1-4 facts, each at most 300 characters, in the agent's own words, never copied from the book;
#     a judge marks an answer sufficient when it states them. They stay in this file only and are never sent to
#     MLflow (ADR-0039 B9). What may reach MLflow when the set is registered: ids, question text, chapter, gold pages.
#   - topic: one branch of the closed list below, at most 3 levels (ADR-0039 B3: sectors become the topic facet;
#     chains are branches).
#   - Verbatim check (check_eval_set.py next to this file): no question and no fact shares a run of 8 or more
#     consecutive words with the book's text layer, read locally at check time; the book text is never stored.
#   - Gold pages and facts found through the text layer of the local PDF and checked by reading each gold page
#     (2026-11-26). The book is personal-use: no book text is in this file.
#   - Accepted and frozen by the owner (2026-11-26). Registration as an MLflow dataset and a pinned sha256 come with
#     the SRV-OBS amendment of task V.kl-obs-spans; until then the frozen sha256 is recorded in docs/progress.yaml.
#
#     uv run --script spec/fixtures/eval/check_eval_set.py <pdf>
status: "accepted (owner 2026-11-26 reviewed the sample of 30, 10 per type, listed in docs/progress.yaml V.kl-eval-set: 'eval sample ok'); frozen"
