  # ---------------------------------------------------------------- thematic (30)
  - id: v01
    type: thematic
    origin: v2
    chapter: 1
    topic: blockchain/foundations
    question: "Чем сети, куда может войти любой желающий, отличаются от сетей с заранее отобранными участниками, и какие смешанные варианты встречаются?"
