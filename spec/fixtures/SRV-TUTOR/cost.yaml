# VEC-TUTOR-3 — cost inputs for SRV-TUTOR (bounds, NFR-TUTOR-2). The test DERIVES every result from these inputs and
# asserts the spec's bounds against them (question_cap_usd ≥ attempts × reserve; typical ≤ NFR-TUTOR-2); the values
# under `derived_by_test` are for readers and are not asserted from this file.
#
# Prices per million tokens: SRV-AGENT pricing table (as_of 2026-11-03), claude-sonnet-5-5; spikes/tutor-call
# recomputed every call within $0.000004 with these prices.
# Reserve rule (SRV-AGENT FR-AGENT-9 with this spec's cross-spec item c). With a caller `system_prompt` the CLI's own
# 6,803-token prompt is not sent (spikes/tutor-call), and tokens ≤ UTF-8 bytes (measured 0.3–0.5 tokens per byte), so
#   reserve = (cli_overhead_tokens + system_bytes_max + prompt_bytes_max) × cache_write_1h + max_output_tokens × output
# (the CLI writes the whole prompt to the 1-hour cache; no cache sharing assumed).
inputs:
  model: claude-sonnet-5-5
  price_per_mtok: {input: 2.00, output: 10.00, cache_write_1h: 4.00, cache_read: 0.10}
  cli_overhead_tokens: 1000      # spikes/tutor-call: ≈ 410 measured; 2.4× margin
  system_bytes_max: 2000         # 2026-11-23: the file is 1,440 bytes (REF-TUTOR-9 budget)
  prompt_bytes_max: 29000        # 2026-11-23: whole chunks (spikes/tutor-chunks), the largest under the cap
  max_output_tokens: 2000        # spikes/tutor-call: 92–310 measured
  attempts_max: 2
  daily_cap_usd: 3.00
  typical:                       # one bench question, asked without a cell (VEC-TUTOR-7), extrapolated from
                                 # spikes/tutor-call's measured rates
    prompt_tokens: 9500          # 8 whole chunks (8 × mean 2,145 bytes, spikes/tutor-chunks) + the question and the
                                 # JSON ≈ 17,800 bytes of Russian at 1.9 bytes/token (measured on q3); an Ask-panel
                                 # question with a focused cell adds up to cell_bytes_max (about $0.052 then)
    fixed_tokens: 900            # answer-v1.md (1,440 bytes of English ≈ 360 tokens) + ≈ 410 overhead, rounded up
    output_tokens: 400           # measured 92–310 on short sources; rounded up for 8 whole chunks
                                 # every new question writes its whole prompt to the 1-hour cache (measured: the first
                                 # call of each question read nothing from the cache)
derived_by_test:                 # USD, for readers
  reserve_per_attempt: 0.148     # (1000 + 2000 + 29000) × 4.00e-6 + 2000 × 10.00e-6 = 0.128 + 0.020
  question_cap_min: 0.296        # 2 × reserve ≤ bounds.question_cap_usd 0.30 (kept)
  typical: 0.0456                # (9500 + 900) × 4.00e-6 + 400 × 10.00e-6 — about $0.046
  daily_cap_questions: {at_reserve: 20, typical: 65}   # floor(3.00 / value)
measured:                        # spikes/tutor-call, 2026-11-22, short synthetic sources (not L02-shaped)
  calls: 10
  usd_total: 0.038299
  usd_per_call: [0.001008, 0.006480]
  output_tokens: [92, 310]
  thinking_tokens: 0
  wall_s: [1.54, 3.50]
