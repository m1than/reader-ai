# VEC-TUTOR-7 — bench question set for NFR-TUTOR-1..3 ([live], L02). No book text is committed: the questions are
# generated at run time from the compiled L02 revision by web/src/tutor/bench.ts and asked over the HTTP API with
# the owner's session (e2e/web/live/owner.slice.ts, step `tutor-bench`); the bench writes only ids, counts, flags,
# timings and costs to committed files.
lesson: L02                       # pilot/bashir/course.yaml, PDF pages 60–84; its compiled revision has 10 explain cells
generator:
  cells: explain                  # cell kind (ADR-0004)
  order: notebook                 # cell order of the revision under test; for each cell, every template in order
  templates:                      # the cell title is the first markdown heading of its source
    - "Explain in your own words: {cell_title}"
    - "Why does it matter: {cell_title}?"
    - "Give a concrete example for: {cell_title}"
    - "What is easy to get wrong about: {cell_title}?"
  take: 40                        # the first 40 (cell, template) questions; fewer than 40 stops the bench before asking
  cell_id: "{cell_id}"            # each question is asked on its cell
fixed:
  - {source: spec/fixtures/SRV-TUTOR/bench-fixed.yaml, id: t01}   # replaces questions-v2 v03 (premise unsupported)
gate_n: 40                        # n ≥ 40 generated questions (+ t01): a 0.9 tutor passes the 0.8 bar 98.5 % of the
                                  # time, a 0.7 tutor 11 % (binomial, investigator 2026-11-23); n = 3 or 11 decides nothing
samples: "n = 40 generated + 1 fixed = 41"
p95_rank: "ceil(0.95 × n) of the samples sorted ascending (nearest rank)"
spend_bound_usd: "n × question_cap_usd (≤ 12.30); expected ≈ n × 0.05 (≈ $2)"
daily_cap: >-
  the normal per-user daily cap (3.00): a run stops at the first 429 daily_budget_exhausted and records where it
  stopped; the next UTC day resumes from that index (READER_TUTOR_BENCH_FROM); the gate is computed over both days'
  records together
records: [wall_s, usd, output_tokens, thinking_tokens, state, grounded, insufficient, blocks, blocks_with_verified_quote]
summary: [n, p95_s, mean_usd, grounded_share, insufficient_share, verified_block_share, gate_n_met, pass]
