# VEC-INGEST-9 (SRV-INGEST FR-INGEST-37): synthetic facets cases, no book text.
# invalid: each case changes the committed server/src/reader/ingest/facets.yaml at `path` (keys from the root):
# `set` replaces or adds the value there, `delete: true` removes the key; the loader must refuse the result.
invalid:
  - { name: extra_facet, path: [facets, mood],
      set: { level: span, values: [calm], by: rule, enabled: false, consumer: SRV-KB } }
  - { name: extra_key, path: [facets, role, colour], set: blue }
  - { name: extra_top_key, path: [notes], set: anything }
  - { name: duplicate_value, path: [facets, license, values], set: [personal-use, personal-use] }
  - { name: empty_values, path: [facets, reliability, values], set: [] }
  - { name: non_string_value, path: [facets, credibility, values], set: [1, 2, 3, 4, 5, 6] }
  - { name: missing_consumer, path: [facets, role, consumer], delete: true }
  - { name: missing_enabled, path: [facets, license, enabled], delete: true }
  - { name: enabled_not_boolean, path: [facets, license, enabled], set: "yes" }
  - { name: free_form_values, path: [facets, role, values], set: "*" }
  - { name: missing_facet, path: [facets, topic], delete: true }
  - { name: unknown_level, path: [facets, role, level], set: chapter }
  - { name: unknown_by, path: [facets, role, by], set: guess }
  - { name: form_rule_missing_kind, path: [facets, form, rule, code], delete: true }
  - { name: form_rule_unknown_kind, path: [facets, form, rule, caption], set: prose }
  - { name: form_rule_unknown_form, path: [facets, form, rule, code], set: poem }
  - { name: form_without_rule, path: [facets, form, rule], delete: true }
  - { name: enabled_spec_consumer, path: [facets, role, enabled], set: true }
  - { name: enabled_bad_consumer, path: [facets, license, consumer], set: "not a consumer" }
  - { name: enabled_unknown_view, path: [facets, license, consumer], set: brain_map }
  - { name: rule_without_pattern, path: [test_vector_rule, pattern], delete: true }
  - { name: rule_bad_pattern, path: [test_vector_rule, pattern], set: "([" }

# kind → form for a span whose text is not a test vector.
forms:
  heading: prose
  text: prose
  list_item: prose
  code: code
  formula: formula
  table: table
  figure: figure

# code spans and the form the rule gives them (synthetic values).
