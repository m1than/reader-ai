# VEC-INGEST-7: magic-check cases as generator rules, no real documents (SRV-INGEST FR-INGEST-18 step 7).
# body = head (or head_hex) + `fill` bytes of "x" + eof + `after` bytes of "\n". `whole` replaces the rule with an
# exact ASCII body. A valid body starts with %PDF-1.[0-7] or %PDF-2.0 at offset 0, and its last 1,024 bytes (the
# whole body when shorter) contain %%EOF.
cases:
  - { name: "1.0", head: "%PDF-1.0\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "1.1", head: "%PDF-1.1\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "1.2", head: "%PDF-1.2\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "1.3", head: "%PDF-1.3\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "1.4", head: "%PDF-1.4\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "1.5", head: "%PDF-1.5\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "1.6", head: "%PDF-1.6\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "1.7", head: "%PDF-1.7\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "2.0", head: "%PDF-2.0\n", fill: 2000, eof: "%%EOF", after: 0, valid: true }
  - { name: "eof followed by a newline", head: "%PDF-1.7\n", fill: 2000, eof: "%%EOF", after: 1, valid: true }
  - { name: "eof 1,023 bytes from the end", head: "%PDF-1.7\n", fill: 2000, eof: "%%EOF", after: 1018, valid: true }
  - { name: "eof 1,025 bytes from the end", head: "%PDF-1.7\n", fill: 2000, eof: "%%EOF", after: 1020, valid: false }
  - { name: "short whole body, 14 bytes", whole: "%PDF-1.7\n%%EOF", valid: true }
  - { name: "shorter than 8 bytes", whole: "%PDF-1", valid: false }
  - { name: "empty", whole: "", valid: false }
  - { name: "1.8", head: "%PDF-1.8\n", fill: 2000, eof: "%%EOF", after: 0, valid: false }
  - { name: "3.0", head: "%PDF-3.0\n", fill: 2000, eof: "%%EOF", after: 0, valid: false }
  - { name: "2.1", head: "%PDF-2.1\n", fill: 2000, eof: "%%EOF", after: 0, valid: false }
  - { name: "utf-8 bom", head_hex: "efbbbf255044462d312e370a", fill: 2000, eof: "%%EOF", after: 0, valid: false }
  - { name: "a space first", head: " %PDF-1.7\n", fill: 2000, eof: "%%EOF", after: 0, valid: false }
  - { name: "junk first", head: "junk%PDF-1.7\n", fill: 2000, eof: "%%EOF", after: 0, valid: false }
  - { name: "no eof", head: "%PDF-1.7\n", fill: 2000, eof: "", after: 0, valid: false }
  - { name: "zip header", head_hex: "504b0304", fill: 2000, eof: "%%EOF", after: 0, valid: false }
  - { name: "png header", head_hex: "89504e470d0a1a0a", fill: 2000, eof: "%%EOF", after: 0, valid: false }
