# VEC-CONFIG-2: invalid configs and the EXACT expected error list (FR-CONFIG-3, FR-CONFIG-11).
# `line` is 1-based within `yaml`. Each error renders as `<file>:<line>: <path>: <code>: <fixed message>`.
# No secret values: "literal" cases use the canary placeholder, which must not appear in any error output.
cases:
  - name: inline literal instead of a reference
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      users:
        - handle: ivan
          role: owner
          providers:
            - kind: anthropic-subscription
              token: CANARY-not-a-reference-7f3a
    errors:
      - { line: 8, path: users.0.providers.0.token, code: not_secret_ref }

  - name: unknown secret scheme
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      users:
        - handle: ivan
          role: owner
          providers:
            - kind: anthropic-subscription
              token: secret://vault/reader-ai/token
    errors:
      - { line: 8, path: users.0.providers.0.token, code: not_secret_ref }

  - name: unsupported version
    yaml: |
      version: 2
      instance: { url: https://reader.local, data_dir: ./data }
    errors:
      - { line: 1, path: version, code: bad_version }

  - name: version as a string is not coerced
    yaml: |
      version: "1"
      instance: { url: https://reader.local, data_dir: ./data }
    errors:
      - { line: 1, path: version, code: wrong_type }

  - name: unknown top-level key, reported by position not text
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      CANARY-unknown-key-7f3a: true
    errors:
      - { line: 3, path: "<unknown key #3>", code: unknown_key }

  - name: missing required key, reported at the parent mapping's line
    yaml: |
      version: 1
      instance:
        url: https://reader.local
    errors:
      - { line: 3, path: instance.data_dir, code: missing_key }

  - name: block style, key line differs from parent line
    yaml: |
      version: 1
      instance:
        url: https://reader.local
        data_dir: ./data
      budgets:
        monthly_usd: 200
        warn_at: 1.5
    errors:
      - { line: 7, path: budgets.warn_at, code: out_of_range }

  - name: flow style warn_at above 1
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      budgets: { monthly_usd: 200, warn_at: 1.5 }
    errors:
      - { line: 3, path: budgets.warn_at, code: out_of_range }

  - name: budget not finite
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      budgets: { monthly_usd: .nan }
    errors:
      - { line: 3, path: budgets.monthly_usd, code: not_finite }

  - name: sha256 not 64 lowercase hex
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      materials:
        - id: bashir-2025
          file: ./materials/book.pdf
          sha256: 61E8D4C3
          license: personal-use
          language: ru
    errors:
      - { line: 6, path: materials.0.sha256, code: bad_sha256 }

  - name: several problems, ordered by line
    yaml: |
      version: 2
      instance: { url: https://reader.local, data_dir: ./data }
      kernels: [python3, python3]
      budgets:
        monthly_usd: -1
    errors:
      - { line: 1, path: version, code: bad_version }
      - { line: 3, path: kernels.1, code: not_unique }
      - { line: 5, path: budgets.monthly_usd, code: out_of_range }

  - name: open task key named by position, with a canary as the key
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      tasks:
        draft: { model: opus }
        CANARY-task-7f3a: { model: "" }
    errors:
      - { line: 5, path: "tasks.<key #2>.model", code: empty_string }

  - name: empty task key
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      tasks:
        "": { model: opus }
    errors:
      - { line: 4, path: "tasks.<key #1>", code: empty_key }

  - name: instance.url not https
    yaml: |
      version: 1
      instance: { url: http://reader.local, data_dir: ./data }
    errors:
      - { line: 2, path: instance.url, code: bad_url }

  - name: empty string in a required string field
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: "" }
    errors:
      - { line: 2, path: instance.data_dir, code: empty_string }

  - name: block style duplicate handle
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      users:
        - handle: ivan
          role: owner
        - handle: ivan
          role: viewer
    errors:
      - { line: 6, path: users.1.handle, code: not_unique }

  - name: three equal kernels give two errors, each at its own item
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      kernels:
        - python3
        - python3
        - python3
    errors:
      - { line: 5, path: kernels.1, code: not_unique }
      - { line: 6, path: kernels.2, code: not_unique }

  - name: non-finite float inside an opaque mapping, named by position
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      sectors: { a: 1, CANARY-sector-7f3a: .inf }
    errors:
      - { line: 3, path: "sectors.<key #2>", code: not_finite }

  - name: Decimal from a quoted string is not coerced
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      budgets: { monthly_usd: "200" }
    errors:
      - { line: 3, path: budgets.monthly_usd, code: wrong_type }

  - name: Decimal from a boolean is not coerced
    yaml: |
      version: 1
      instance: { url: https://reader.local, data_dir: ./data }
      budgets: { monthly_usd: true }
    errors:
      - { line: 3, path: budgets.monthly_usd, code: wrong_type }
