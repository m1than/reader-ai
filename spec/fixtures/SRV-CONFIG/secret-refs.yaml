# VEC-CONFIG-3: SecretRef grammar (FR-CONFIG-5). Double-quoted strings use YAML escapes: \0 is NUL, \n is a newline.
accept:
  - { ref: "secret://env/CLAUDE_CODE_OAUTH_TOKEN", scheme: env }
  - { ref: "secret://env/_x1", scheme: env }
  - { ref: "secret://file/run/secrets/claude_token", scheme: file, path: /run/secrets/claude_token }
  - { ref: "secret://file/run/secrets/a.b-c_1", scheme: file, path: /run/secrets/a.b-c_1 }
  - { ref: "secret://hostfile/Users/owner/Developer/.token_tg_bot", scheme: hostfile, path: /Users/owner/Developer/.token_tg_bot }
  - { ref: "secret://hostfile/x", scheme: hostfile, path: /x }
  - { ref: "secret://keychain/reader-ai/claude-oauth-token", scheme: keychain }
  - { ref: "secret://op/Private/Anthropic/token", scheme: op }

reject:
  - { ref: "", why: empty string }
  - { ref: "secret://env/", why: empty name }
  - { ref: "secret://env/1ABC", why: name starts with a digit }
  - { ref: "secret://env/A/B", why: extra segment }
  - { ref: "secret://env/A-B", why: hyphen not allowed in env names }
  - { ref: "secret://env", why: no name }
  - { ref: "secret:/env/X", why: one slash after the colon }
  - { ref: "SECRET://env/X", why: prefix case }
  - { ref: "Secret://env/X", why: prefix case }
  - { ref: "secret://ENV/X", why: scheme case }
  - { ref: "secret://vault/x/y", why: unknown scheme }
  - { ref: "secret://env/X\t", why: trailing tab }
  - { ref: "secret://keychain/svc/acc name", why: space inside a segment }
  - { ref: "secret://keychain/svc\tx/acc", why: tab inside a segment }
  - { ref: "secret://op/v/i/f\x01", why: C0 control character }
  - { ref: "secret://hostfile/a\x1fb", why: C0 control character inside a segment }
  - { ref: "secret://keychain/svc/acc ", why: no-break space (Unicode whitespace) }
  - { ref: "secret://keychain/svc x/acc", why: em space (Unicode whitespace) }
  - { ref: " secret://env/X", why: leading space }
  - { ref: "secret://env/X ", why: trailing space }
  - { ref: "secret://env/X\n", why: trailing newline }
  - { ref: "secret://env/X\0", why: NUL }
  - { ref: "secret://file/etc/passwd", why: file outside /run/secrets }
  - { ref: "secret://file/run/secrets/", why: empty file name }
  - { ref: "secret://file/run/secrets/..", why: dot-dot file name }
  - { ref: "secret://file/run/secrets/.", why: dot file name }
  - { ref: "secret://file/run/secrets/../x", why: dot-dot segment }
  - { ref: "secret://file/run/secrets/a/b", why: extra segment }
  - { ref: "secret://file//run/secrets/x", why: empty segment }
  - { ref: "secret://hostfile/", why: no segments }
  - { ref: "secret://hostfile/a//b", why: empty segment }
  - { ref: "secret://hostfile/a/../b", why: dot-dot segment }
  - { ref: "secret://hostfile/a/./b", why: dot segment }
  - { ref: "secret://hostfile/a/", why: trailing slash }
  - { ref: "secret://hostfile/a%2Fb", why: percent sign }
  - { ref: "secret://hostfile/a\0b", why: NUL in a segment }
  - { ref: "secret://keychain/reader-ai", why: missing account }
  - { ref: "secret://keychain/reader-ai/", why: empty account }
  - { ref: "secret://keychain/reader-ai/acc/x", why: extra segment }
  - { ref: "secret://keychain/svc/acc%41", why: percent sign }
  - { ref: "secret://op/v/i", why: missing field }
  - { ref: "secret://op/v/i/f/g", why: extra segment }
  - { ref: "secret://op/v//f", why: empty segment }
