# VEC-CONFIG-5: fixed reference → Compose secret name and environment variable (FR-CONFIG-14).
# name = <scheme>-<sha256(UTF-8 reference)[:32]>; env = READER_SECRET_<SCHEME>_<same 32 hex, upper case>.
# Computed with Python hashlib.sha256 on 2026-11-20.
names:
  - ref: "secret://keychain/reader-ai/claude-oauth-token"
    name: keychain-e35683c33bd94de8486a116f9c3efc47
    env: READER_SECRET_KEYCHAIN_E35683C33BD94DE8486A116F9C3EFC47
  - ref: "secret://env/CLAUDE_CODE_OAUTH_TOKEN"
    name: env-17c83e2b44fc9fffbf0fed7c752c8913
    env: READER_SECRET_ENV_17C83E2B44FC9FFFBF0FED7C752C8913
  - ref: "secret://hostfile/Users/owner/Developer/.token_tg_bot"
    name: hostfile-b3622bdb8270bf74a5126ab9e526a9fd
    env: READER_SECRET_HOSTFILE_B3622BDB8270BF74A5126AB9E526A9FD
  - ref: "secret://op/Private/Anthropic/token"
    name: op-b57a44a36aa5906f0c81eaace3e867ae
