# VEC-SEARCH-1 — reciprocal rank fusion, hand-computed (FR-SEARCH-7, REF-SEARCH-4).
# score(c) = sum over lists L containing c of 1 / (k + rank_L(c)), ranks start at 1, k = 60.
# Equal scores: the better (smaller) dense rank wins; a missing dense rank counts as worse than any present one.
# (Two chunks with equal scores and equal dense ranks cannot occur: equal dense ranks mean the same chunk, and two
# full-text-only chunks have different full-text ranks, hence different scores.)
# Values are rounded to 9 places, checked with a Python float sum.
k: 60
cases:
  - name: overlap-and-singletons
    dense: [a, b, c]
    fts: [b, d, a]
    expected:
      - { id: b, score: 0.032522475 }   # 1/62 + 1/61
      - { id: a, score: 0.032266458 }   # 1/61 + 1/63
      - { id: d, score: 0.016129032 }   # 1/62 (fts only)
      - { id: c, score: 0.015873016 }   # 1/63 (dense only)
  - name: tie-broken-by-dense-rank
    dense: [x, y]
    fts: [y, x]
    expected:
      - { id: x, score: 0.032522475 }   # 1/61 + 1/62, dense rank 1
      - { id: y, score: 0.032522475 }   # 1/62 + 1/61, dense rank 2
  - name: tie-dense-present-beats-missing
    dense: [p]
    fts: [q]
    expected:
      - { id: p, score: 0.016393443 }   # 1/61, dense rank 1
      - { id: q, score: 0.016393443 }   # 1/61, no dense rank
  - name: fts-empty
    dense: [p, q]
    fts: []
    expected:
      - { id: p, score: 0.016393443 }   # 1/61
      - { id: q, score: 0.016129032 }   # 1/62
  - name: dense-empty
    dense: []
    fts: [m]
    expected:
      - { id: m, score: 0.016393443 }
