# VEC-SEARCH-2 — span windows (FR-SEARCH-3, ADR-0039 revision): each span's own text, cut by hand-checkable small
# parameters; production parameters are size 1200, overlap 200, minimum 80 (spikes/embeddings-local/bench.py, the
# parameters behind the measured recall). The algorithm is the same for both.
#
# Width = size, or size - len(prefix) - 1 with a prefix. Windows start at range(0, max(len(text) - overlap, 1),
# width - overlap) and take text[start:start + width]. The first window has no minimum; a later window shorter than
# `min` is merged into the previous one (its stop moves). The passage is the window text, or prefix + "\n" + window
# text. Empty or whitespace-only text has no window. Here min (8) exceeds overlap + 1 (6) so that a merge can occur;
# with the production parameters (80 < 201) none does.
params: { size: 20, overlap: 5, min: 8 }
cases:
  - name: two-windows
    text: "Alpha beta gamma delta epsilon"
    expected:
      - { window_no: 0, start: 0, stop: 20, passage: "Alpha beta gamma del" }
      - { window_no: 1, start: 15, stop: 30, passage: "a delta epsilon" }
  - name: short-span-is-one-window
    text: "Hi"
    expected:
      - { window_no: 0, start: 0, stop: 2, passage: "Hi" }
  - name: empty
    text: ""
    expected: []
  - name: whitespace-only
    text: "  \n "
    expected: []
  - name: short-trailing-window-merged
    text: "abcdefghijklmnopqrstuvwxyz0123456789A"
    expected:
      - { window_no: 0, start: 0, stop: 20, passage: "abcdefghijklmnopqrst" }
      # starts 0, 15, 30: the window [30, 37) has 7 < 8 characters, so the previous one ends at 37
      - { window_no: 1, start: 15, stop: 37, passage: "pqrstuvwxyz0123456789A" }
  - name: prefix-shrinks-the-window
    text: "Alpha beta gamma delta epsilon"
    prefix: "Ch1"
    expected:
      # width 20 - 3 - 1 = 16, step 11: starts 0, 11, 22; every passage is at most 20 characters
      - { window_no: 0, start: 0, stop: 16, passage: "Ch1\nAlpha beta gamma" }
      - { window_no: 1, start: 11, stop: 27, passage: "Ch1\ngamma delta epsi" }
      - { window_no: 2, start: 22, stop: 30, passage: "Ch1\n epsilon" }
