        live: ["stage-1: sign-in options", "stage-1: sign-in with the same passkey", "stage-1: signed in again: /api/me is 200",
               "browser: sign out, then sign in through the real page with the same passkey"]
      security:
        items: [INV-AUTH-1, INV-AUTH-2, INV-AUTH-3, INV-AUTH-4, INV-AUTH-6, FR-AUTH-10, FR-AUTH-12]
        live: ["stage-1: anonymous /api/me is 401",
               "browser: /api/me reports the learner; session cookie is __Host-, HttpOnly, Secure, SameSite"]
