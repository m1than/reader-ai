# VEC-DOD-1 — Definition-of-Done index of every user operation (OPS-DOD).
# Written 2026-11-22 from the specs on V/V.DOD-index after merging V/slice-integration, V/live-e2e, V/V.TUTOR-min and
# V/V.COMPILE-min, the route registry (ROUTES/WS_ROUTES of the modules in reader.api.app.ROUTERS) and the CLI command
# registry (reader.cli.app), and the live labels of e2e/live (stage-1.sh incl. passkey_check.py; web_live.py and
# e2e/web/live/slice.live.ts under key `browser`).
# Rechecked 2026-11-23 on V/slice-integration (744997e; every other spec approved): routes renamed by SRV-INGEST and
# SRV-PIPELINE, the tutor items renumbered by SRV-TUTOR, the compile cap and the ledger's settled amount;
# lesson.compile_resume × cost closed by the run's stored cap. Review round 1 opened search.query and cell.* ×
# observability, auth.bootstrap and auth.signin × a11y, and a narrowed lesson.findings × recovery. 49 missing,
# 44 na, counting declared gaps only (OPS-DOD header); every mapped item is traced by a test.
# Every `na`, `missing` and `source` string that holds a comma or a colon is quoted: inside a `{ … }` flow mapping
# an unquoted comma ends the value and starts a second key.
#
# A cell (operation × criterion) holds any of:
#   items:   [spec item ids]     evidence = the test files that @trace them (FR-DOD-6); bench-only items are not used
#   live:    ["<key>: <label>"]  evidence = PASS/FAIL lines of the live run (FR-DOD-4)
#   budget:  {...}               latency/cost only; evidence = measurements with n ≥ n_min (FR-DOD-2)
#   pages:   ["/path"]           a11y only; evidence = one axe.json entry per page (FR-DOD-5)
#   na:      reason              criterion does not apply (allowed only per FR-DOD-2)
#   waived:  {reason, by, date}  owner only (FR-DOD-12); never written by the agent
#   missing: what is needed      a known gap; T10 error only when the operation is `enforced`
# Every operation starts at gate: tracked. V.DOD-index is done when every operation is `enforced` with 0 missing.

version: 1

criteria:
  functional:    the operation does what its spec says, end to end where a live check exists
  security:      authentication, authorisation, isolation, CSRF and hardening hold for this operation
  privacy:       no secret, token, book text, prompt or model output reaches a log, an artifact or a response it does not belong to
  a11y:          every page of the operation has no serious or critical axe-core violation (web operations only)
  latency:       p50/p95 within a sourced budget over at least n_min measurements
  cost:          provider $ and tokens within a sourced budget over at least n_min runs (operations that call a model)
  observability: the operation leaves a structured log line an owner can find it by
  recovery:      the failure path is defined and tested (fail closed, retry, resume or a clear message)

# Routes, commands and specs no user operation names, with the reason (FR-DOD-3). Agent additions are refused by the
# guard-tests ratchet (FR-DOD-13); the initial list is reviewed with this spec.
not_user_facing:
  - { spec: OPS-DOD, reason: "tooling: this index and its verifier" }
  - { route: "GET /api/healthz", reason: "container health probe (FR-AUTH-2), not a user action" }
  - { route: "GET /api/auth/static/passkey.js", reason: "static asset of the bootstrap and sign-in pages" }
  - { command: "reader-server", reason: "container entrypoint: the api, worker and mcp roles and --healthcheck (OPS-DEPLOY); its bootstrap-link runs only through `reader bootstrap` (FR-CLI-21)" }

operations:
  - id: auth.bootstrap
    title: Register the first passkey from a one-time bootstrap link
    surface: [cli, web]
    specs: [SRV-AUTH, OPS-CLI]
    routes: ["GET /api/auth/bootstrap", "GET /api/auth/static/auth.css", "POST /api/auth/bootstrap/options",
             "POST /api/auth/bootstrap/verify"]
    commands: ["reader bootstrap"]
    gate: tracked
    criteria:
      functional:
        items: [FR-AUTH-4, FR-AUTH-5, FR-AUTH-14, FR-CLI-21, INV-AUTH-7]
        live: ["stage-1: bootstrap link issued for live-check (not printed)", "stage-1: bootstrap options",
               "stage-1: registration with a per-run software passkey",
               "browser: passkey registration through the bootstrap page (learner live-check)"]
      security:
        items: [INV-AUTH-1, INV-AUTH-4, INV-AUTH-7, FR-AUTH-11, FR-AUTH-12]
        live: ["stage-1: POST without Origin is refused (403)"]
      privacy:
        items: [INV-AUTH-5, INV-CLI-9]
        live: ["browser: bootstrap token appears in no artifact"]
      a11y: { missing: "no axe run on /api/auth/bootstrap (the browser suite scans only / and the lesson page)" }
      latency: { missing: "no sourced budget for the bootstrap ceremony; record timings in the live suite" }
      cost: { na: no provider call }
      observability: { items: [FR-AUTH-18] }
      recovery: { items: [FR-AUTH-5, FR-AUTH-11] }

