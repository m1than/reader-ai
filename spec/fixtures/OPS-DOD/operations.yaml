    routes: ["POST /api/auth/signout"]
    gate: tracked
    criteria:
      functional:
        items: [FR-AUTH-9, FR-UI-5]
        live: ["stage-1: signed out: /api/me is 401"]
      security: { items: [INV-AUTH-3, FR-AUTH-12] }
      privacy: { items: [INV-AUTH-5] }
      a11y: { pages: ["/"] }
      latency: { missing: "no sourced budget" }
      cost: { na: no provider call }
      observability: { missing: "no spec requires a log line for sign-out (FR-AUTH-18 covers failures only)" }
