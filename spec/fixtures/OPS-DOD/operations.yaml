      security:
        items: [INV-AUTH-1, INV-AUTH-2, INV-AUTH-3, INV-AUTH-4, INV-AUTH-6, FR-AUTH-10, FR-AUTH-12]
        live: ["stage-1:anonymous /api/me is 401"]
      privacy: { items: [INV-AUTH-5] }
      a11y: { missing: "axe-core on /api/auth/signin in the Playwright live suite" }
      latency: { missing: "no sourced budget; measure sign-in ceremony p50/p95 in the live suite" }
      cost: { na: no provider call }
