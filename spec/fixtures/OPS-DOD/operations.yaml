    specs: [SRV-AUTH]
    routes: ["GET /api/auth/signup", "POST /api/auth/signup/options", "POST /api/auth/signup/verify"]
    gate: tracked
    criteria:
      functional:
        items: [FR-AUTH-23, FR-AUTH-24, FR-AUTH-25, FR-AUTH-26, FR-AUTH-27, FR-AUTH-31, FR-AUTH-32]
        missing: "no live run yet: the owner suite's `signup` step in open mode (FR-AUTH-32 [live])"
      security:
        items: [FR-AUTH-12, FR-AUTH-26, FR-AUTH-28, INV-AUTH-10, INV-AUTH-12, INV-AUTH-13, INV-AUTH-14, INV-AUTH-15]
      privacy: { items: [FR-AUTH-30] }
      a11y: { missing: "no live axe run on /api/auth/signup (the [browser] axe runs of FR-AUTH-32 are not pages evidence; axe.json has no producer yet)" }
      latency: { missing: "no sourced budget for the sign-up ceremony" }
      cost: { na: no provider call }
      observability: { items: [FR-AUTH-30] }
      recovery: { items: [FR-AUTH-27, FR-AUTH-30, FR-AUTH-31] }

