    specs: [SRV-AUTH, WEB-UI]
    routes: ["GET /api/auth/signin", "GET /api/auth/static/auth.css", "POST /api/auth/signin/options",
             "POST /api/auth/signin/verify", "GET /api/me"]
    gate: tracked
    criteria:
      functional:
        items: [FR-AUTH-7, FR-AUTH-8, FR-AUTH-14, FR-UI-5]
        live: ["stage-1: sign-in options", "stage-1: sign-in with the same passkey", "stage-1: signed in again: /api/me is 200",
               "browser: sign out, then sign in through the real page with the same passkey"]
      security:
        items: [INV-AUTH-1, INV-AUTH-2, INV-AUTH-3, INV-AUTH-4, INV-AUTH-6, FR-AUTH-10, FR-AUTH-12]
        live: ["stage-1: anonymous /api/me is 401",
               "browser: /api/me reports the learner; session cookie is __Host-, HttpOnly, Secure, SameSite"]
      privacy: { items: [INV-AUTH-5] }
      a11y: { missing: "no axe run on /api/auth/signin (the browser suite scans only / and the lesson page)" }
      latency: { missing: "no sourced budget for the sign-in ceremony; record timings in the live suite" }
      cost: { na: no provider call }
      observability: { items: [FR-AUTH-18] }
      recovery: { items: [FR-AUTH-11, INV-AUTH-9] }

  - id: auth.signout
    title: Sign out
    surface: [web]
