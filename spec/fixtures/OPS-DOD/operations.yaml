# VEC-DOD-1 — Definition-of-Done index of every user operation (OPS-DOD).
# Written for this spec on 2026-11-22 from the specs on V/slice-integration, SRV-AGENT/SRV-PIPELINE on
# V/V.COMPILE-min (draft) and e2e/live/stage-1.sh + e2e/live/lib/passkey_check.py. SRV-TUTOR is not drafted on any
# branch yet, so `tutor.ask` is all MISSING.
#
# A cell (operation × criterion) is exactly one of:
#   items:   [spec item IDs]        evidence = the tests that @trace those IDs (FR-DOD-5)
#   live:    [<script>:<label>]     evidence = PASS/FAIL lines of e2e/live scripts (FR-DOD-4)
#   na:      reason                 criterion does not apply (allowed only per FR-DOD-2)
#   waived:  {reason, by, date}     owner sign-off; by must be "owner"
#   missing: what check is needed   a known gap (FR-DOD-3: an error only for operations with gate: enforced)
# `items` and `live` may appear together. `budget` (latency and cost) carries sourced numbers or `structural`.
# Every operation starts at gate: tracked; V.DOD-index done = every operation enforced with 0 missing (FR-DOD-3).

version: 1

# Approved specs that no user operation names (FR-DOD-3), with the reason.
not_user_facing:
  - { spec: OPS-DOD, reason: "tooling: this index and its verifier" }

criteria:
  functional:    the operation does what its spec says, end to end where a live check exists
  security:      authentication, authorisation, isolation, CSRF and hardening hold for this operation
  privacy:       no secret, token, book text, prompt or model output reaches a log, an artifact or a response it does not belong to
  a11y:          the web surface passes the axe-core serious/critical checks (web operations only)
  latency:       p50/p95 within a sourced or structural budget
  cost:          provider $ and tokens within a sourced budget (operations that call a model only)
  observability: the operation leaves a structured log line or metric an owner can find it by
  recovery:      the failure path is defined and tested (fail closed, retry, resume or a clear message)

operations:
  - id: auth.bootstrap
    title: Register the first passkey from a one-time bootstrap link
    surface: [cli, web]
    specs: [SRV-AUTH, OPS-CLI]
    gate: tracked
    criteria:
      functional:
        items: [FR-AUTH-4, FR-AUTH-5, FR-AUTH-14, FR-CLI-21, INV-AUTH-7]
        live: ["passkey:bootstrap link issued for live-check (not printed)", "passkey:bootstrap options",
               "passkey:registration with a per-run software passkey"]
      security:
        items: [INV-AUTH-1, INV-AUTH-4, INV-AUTH-7, FR-AUTH-11, FR-AUTH-12]
        live: ["stage-1:POST without Origin is refused (403)"]
      privacy: { items: [INV-AUTH-5, INV-CLI-9] }
      a11y: { missing: "axe-core on /api/auth/bootstrap in the Playwright live suite (V/live-e2e)" }
      latency: { missing: "no sourced budget; measure bootstrap ceremony p50/p95 in the live suite" }
      cost: { na: no provider call }
      observability: { items: [FR-AUTH-18] }
      recovery: { items: [FR-AUTH-5, FR-AUTH-11] }

  - id: auth.signin
    title: Sign in with a passkey
    surface: [web]
    specs: [SRV-AUTH, WEB-UI]
