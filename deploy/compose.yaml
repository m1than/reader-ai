# reader-ai stack on the owner's Mac (spec/modules/OPS-DEPLOY.yaml). Started by `reader up` (OPS-CLI), which adds an
# in-memory override (kernel-<user> services) and delivers secrets into the tmpfs /run/secrets of each consumer over
# `docker exec` stdin (ADR-0026). This file holds no secret and no interpolation. The override also binds the owner's
# reader.yaml read-only into the server roles at READER_CONFIG's path (FR-DEPLOY-5).
name: reader

# Health timing for postgres and the server roles (FR-DEPLOY-11): poll every 2 s instead of Docker's default 30 s, so
# each `service_healthy` hop costs seconds against NFR-DEPLOY-1's 120 s; failures in the first 60 s do not count,
# which covers initdb on the first start and the wait for secret delivery. Structural bounds, revised from the stage-1
# live check.
x-health: &health
  interval: 2s
  timeout: 2s
  retries: 3
  start_period: 60s

x-kernel: &kernel
  image: reader-kernel:local
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /home/lab:noexec,size=256m,uid=1000
    - /tmp:noexec,size=256m,uid=1000
    - /run/evcxr:exec,nosuid,nodev,size=1g,uid=1000
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  memswap_limit: 2g
  cpus: 2
  pids_limit: 256
  restart: always
  profiles: [kernels]
  healthcheck:
    test: ["CMD", "/usr/local/bin/reader-kernel-health"]

x-server: &server
  image: reader-server:local
  build:
    context: ..
    dockerfile: deploy/images/server.Dockerfile
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /home/reader:size=64m,uid=10001,mode=0700
    - /tmp:size=64m,uid=10001
    - /run/secrets:uid=10001,mode=0700,size=256k
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 1g
  memswap_limit: 1g
  restart: unless-stopped
  environment:
    READER_CONFIG: /etc/reader/reader.yaml
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    # The pinned caddy image plus the built SPA at /srv/spa (deploy/images/caddy.Dockerfile, FR-DEPLOY-2).
    image: reader-caddy:local
    build:
      context: ..
      dockerfile: deploy/images/caddy.Dockerfile
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # obs-ui: the 8443 dashboard site reaches mlflow (FR-DEPLOY-13); jaeger-ui: the 8444 site reaches jaeger
    networks: [edge, front, obs-ui, jaeger-ui]
    healthcheck:
      # 127.0.0.1, not localhost: the admin endpoint listens on IPv4 loopback only, and busybox wget tries ::1 first.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]

  api:
    <<: *server
    command: ["reader-server", "--role", "api", "--bind", "10.230.1.10:8000"]
    volumes:
      - blobs:/var/lib/reader/blobs
    networks:
      front:
        ipv4_address: 10.230.1.10
      core: {}
      sb-pair-1: {}
      embed: {}
      otel: {}   # FR-DEPLOY-13: spans to rotel
    healthcheck:
      <<: *health
      test: ["CMD", "reader-server", "--role", "api", "--healthcheck"]

  worker:
    <<: *server
    command: ["reader-server", "--role", "worker"]
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - blobs:/var/lib/reader/blobs
      # SRV-OBS FR-OBS-26 (OPS-DEPLOY FR-DEPLOY-15): the declarative MLflow bootstrap, read by obs.setup
      - ./otel/mlflow-setup.yaml:/etc/reader/mlflow-setup.yaml:ro
    # otel: spans to rotel; obs: the worker's MLflow writes (retention, ADR-0035, ADR-0038) (FR-DEPLOY-13)
    networks: [core, agentnet, sb-verify, sb-agent, embed, otel, obs]
    healthcheck:
      <<: *health
      test: ["CMD", "reader-server", "--role", "worker", "--healthcheck"]

  mcp:
    <<: *server
    profiles: [mcp]
    command: ["reader-server", "--role", "mcp", "--bind", "0.0.0.0:8001"]
    networks: [front, core]
    healthcheck:
      <<: *health
      test: ["CMD", "reader-server", "--role", "mcp", "--healthcheck"]

  postgres:
    image: reader-postgres:local
    build:
      context: ./images
      dockerfile: postgres.Dockerfile
    user: "999:999"
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=999,mode=0775
      - /tmp:uid=999
      - /run/secrets:uid=999,mode=0700,size=256k
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [core]
    healthcheck:
      <<: *health
      # TCP on 127.0.0.1: the entrypoint's temporary initdb server listens on the socket only, so it never looks healthy.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]

  embed:
    # SRV-SEARCH's bge-m3 service (ADR-0028): its own internal network with api and worker only, no secrets, no
    # environment, the model baked into the image. mem_limit 3g is measured: cgroup memory.peak of a real start plus
    # the worst admitted request (8 texts at max_seq_length 1,024) with the mmap'd checkpoint precheck, times 1.25,
    # fits (OPS-DEPLOY FR-DEPLOY-9 has the numbers). Nothing depends_on it: callers wait for its /health. init: a
    # PID 1 that forwards signals and reaps children, so `docker stop` ends the Python server at once.
    image: reader-embed:local
    build:
      context: ..
      dockerfile: deploy/images/embed.Dockerfile
    init: true
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10003
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    memswap_limit: 3g
    restart: unless-stopped
    networks: [embed]
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-I", "-m", "reader.search.embed_service", "--healthcheck"]

  agent-proxy:
    image: reader-agent-proxy:local
    pull_policy: never # built locally (SRV-AGENT); a missing image fails instead of pulling a same-named one
    build:
      context: ..
      dockerfile: deploy/images/agent-proxy.Dockerfile
    profiles: [agents]
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /home/proxy:size=16m,uid=10002,mode=0700
      - /tmp:size=16m,uid=10002
      - /run/secrets:uid=10002,mode=0700,size=256k
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    networks: [agentnet, egress]
    healthcheck:
      test: ["CMD", "/usr/local/bin/reader-agent-proxy-health"]

  kernel-verify:
    <<: *kernel
    networks: [sb-verify]

  kernel-agent:
    <<: *kernel
    networks: [sb-agent]

  kernel-pair-1:
    <<: *kernel
    networks: [sb-pair-1]

  # SRV-OBS (ADR-0032; OPS-DEPLOY FR-DEPLOY-13): the collector and the trace backend, profile `observability`.
  # Neither holds a secret, publishes a port or reaches egress. Rotel's image entrypoint already sets its receivers
  # (4317, 4318); repeating them fails. Its image has bash and no HTTP client, so its healthcheck is a TCP probe.
  rotel:
    image: streamfold/rotel:v0.2.7@sha256:7a12878dae3dc494c27def53ebcccbdc18e13389ececf33abf116af3a07c3427
    profiles: [observability]
    # Two named exporters (SRV-OBS FR-OBS-19, ADR-0033): MLflow and Jaeger; a named exporter reads its settings from
    # ROTEL_EXPORTER_<NAME>_<FIELD> (measured: the ROTEL_OTLP_EXPORTER_<NAME>_* form is not read).
    command: [--exporters, "mlflow:otlp,jaeger:otlp", --exporters-traces, "mlflow,jaeger"]
    environment:
      ROTEL_EXPORTER_MLFLOW_ENDPOINT: "http://mlflow:5000"
      ROTEL_EXPORTER_MLFLOW_PROTOCOL: http
      ROTEL_EXPORTER_MLFLOW_CUSTOM_HEADERS: x-mlflow-experiment-id=0
      ROTEL_EXPORTER_JAEGER_ENDPOINT: "http://jaeger:4318"
      ROTEL_EXPORTER_JAEGER_PROTOCOL: http
    user: "10005:10005"
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=10005
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    networks: [otel, obs, jaeger-in]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4318"]

  # SRV-OBS FR-OBS-29 (OPS-DEPLOY FR-DEPLOY-15): the one-shot that migrates MLflow's SQLite store before the server
  # starts (flock, one pre-migration backup, `mlflow db upgrade`, WAL, store.version; exit codes 10..13). Same image,
  # volume and hardening as mlflow, and no network at all.
  mlflow-migrate:
    image: reader-mlflow:local
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/otel/mlflow.Dockerfile
    profiles: [observability]
    entrypoint: [sh, /opt/reader/mlflow-migrate.sh]
    user: "10004:10004"
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10004
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    network_mode: none
    # Structural (OPS-DEPLOY FR-DEPLOY-15 (b)): one `db upgrade` of a SQLite file, half of mlflow's 1g; equal to
    # memswap_limit, so no swap.
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - obs_mlflow:/var/lib/mlflow
      - ./otel/mlflow-migrate.sh:/opt/reader/mlflow-migrate.sh:ro

  mlflow:
    # MLflow 3.18.0 (SRV-OBS FR-OBS-27): every flag and variable pinned, each with its source. One uvicorn worker:
    # SQLite has one writer (spikes/obs-stack round 9: 8 concurrent writers, 0 errors in WAL mode). Artifacts are
    # served through the server; no CORS origin is allowed (no --cors-allowed-origins); the edge also sends
    # frame-ancestors 'none'. No --static-prefix (8443 is MLflow's own origin), no --dev, no --expose-prometheus.
    image: reader-mlflow:local
    pull_policy: build
    build:
      context: ..   # the context is empty: deploy/otel/mlflow.Dockerfile.dockerignore excludes everything
      dockerfile: deploy/otel/mlflow.Dockerfile
    profiles: [observability]
    depends_on:
      mlflow-migrate:
        condition: service_completed_successfully   # FR-OBS-29: the server never migrates the store itself
    command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --workers, "1",
              --backend-store-uri, "sqlite:////var/lib/mlflow/mlflow.db",
              --artifacts-destination, /var/lib/mlflow/artifacts, --default-artifact-root, "mlflow-artifacts:/",
              --serve-artifacts, --allowed-hosts, "localhost:8443,mlflow:5000,mlflow", --x-frame-options, DENY]
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"   # no job runner (mlflow/environment_variables.py)
      MLFLOW_DISABLE_TELEMETRY: "true"   # 3.18.0 is_telemetry_disabled() reads both of these
      DO_NOT_TRACK: "true"
      MLFLOW_ENABLE_AI_GATEWAY: "false"   # default true in 3.18.0; off answers 501 (spike round 9)
      MLFLOW_ENABLE_REMOTE_ASSISTANT: "false"   # its default, pinned
      MLFLOW_MODEL_CATALOG_URI: ""   # SRV-OBS FR-OBS-12 (c): no remote price fetch; the image's catalog is all zeros
    user: "10004:10004"
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10004
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    volumes:
      - obs_mlflow:/var/lib/mlflow
    networks: [obs, obs-ui]
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=2).status!=200)"]

  jaeger:
    # The Jaeger waterfall view (SRV-OBS FR-OBS-19, ADR-0033): Rotel's second exporter, in-memory, owner only through
    # the 8444 site. Distroless (no shell), so no healthcheck; GOMEMLIMIT keeps the Go heap below the limit.
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    profiles: [observability]
    command: [--config, /etc/jaeger/config.yaml]
    environment:
      GOMEMLIMIT: 200MiB
    volumes:
      - ./otel/jaeger.yaml:/etc/jaeger/config.yaml:ro
    user: "10006:10006"
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=10006
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    networks: [jaeger-in, jaeger-ui]

networks:
  edge: {}
  egress: {}
  front:
    internal: true
    ipam:
      config:
        - subnet: 10.230.1.0/24
          ip_range: 10.230.1.128/25 # dynamic addresses stay away from api's fixed 10.230.1.10
  core: { internal: true }
  agentnet: { internal: true }
  sb-verify: { internal: true }
  sb-agent: { internal: true }
  sb-pair-1: { internal: true }
  embed: { internal: true }   # ADR-0028: api, worker and embed only
  # ADR-0032: explicit subnets (no free predefined pool on the owner's Docker Desktop, measured 2026-11-24).
  otel: { internal: true, ipam: { config: [{ subnet: 10.230.2.0/24 }] } }     # api, worker, rotel
  obs: { internal: true, ipam: { config: [{ subnet: 10.230.3.0/24 }] } }      # rotel, mlflow, worker (retention)
  obs-ui: { internal: true, ipam: { config: [{ subnet: 10.230.4.0/24 }] } }   # caddy, mlflow
  jaeger-in: { internal: true, ipam: { config: [{ subnet: 10.230.5.0/24 }] } }  # rotel, jaeger (ADR-0033)
  jaeger-ui: { internal: true, ipam: { config: [{ subnet: 10.230.6.0/24 }] } }  # caddy, jaeger

volumes:
  pgdata: { labels: { org.reader-ai.backup: include } }
  blobs: { labels: { org.reader-ai.backup: include } }
  caddy_data: { labels: { org.reader-ai.backup: exclude } }
  caddy_config: { labels: { org.reader-ai.backup: include } }
  # ADR-0038 Decision 6 replaces ADR-0032's exclusion: Runs, datasets and versions are backed up now, always
  # through SQLite's backup API (SRV-OBS FR-OBS-30), never as a tar of the live files.
  obs_mlflow: { labels: { org.reader-ai.backup: include } }
