# reader-ai example configuration (OPS-DEPLOY FR-DEPLOY-12; schema: SRV-CONFIG). Secrets are references only:
# `reader up` resolves them on the host and delivers them into the consuming containers (ADR-0011, ADR-0026).
version: 1
instance: { url: https://localhost, data_dir: ./data }
users:
  - handle: ivan
    role: owner
    providers:
      - kind: anthropic-subscription
        token: secret://keychain/reader-ai/claude-oauth-token
  - handle: live-check   # learner for the stage-1 live check (SRV-AUTH): passkey from a virtual authenticator
    role: learner
# Compile task budgets are spent per compile run (SRV-AGENT FR-AGENT-9), sized for two worst-case calls each.
tasks:
  draft:      { model: opus,   budget_usd_per_lesson: 4.0 }
  fact_check: { model: sonnet, budget_usd_per_lesson: 2.0 }
  review:     { model: opus,   budget_usd_per_lesson: 4.0 }
  tutor:      { model: sonnet }
  # The source freshness check (SRV-FRESH; caps are its own bounds: $1.00 per run, $2.00 per day).
  freshness_scan:   { model: sonnet }
  freshness_web:    { model: haiku }
  freshness_report: { model: sonnet }
budgets: { monthly_usd: 200, warn_at: 0.8 }
kernels: [python3, rust, deno]
materials:
  - id: bashir-2025
    file: ./materials/bashir-mastering-blockchain-ru-2025.pdf
    sha256: 61e8d4c390ba63c3f13efe0860d5042f8d1b19ba8f26b4f2e14e73478bc9e2b2
    license: personal-use
    language: ru
sectors:
  blockchain: { title: Blockchain }
sharing:
  invitations: false
  # Open sign-up with owner approval (ADR-0031, SRV-AUTH FR-AUTH-23): "open" or "off". Absent means "open" on
  # localhost and "off" on any other host. New accounts wait in the app's Sign-ups screen until you approve them.
  signup: "open"
# Tracing (SRV-OBS, ADR-0032): spans of requests, jobs and agent calls, kept `retention_days` days, in an owner-only
# dashboard at https://localhost:8443/ (`reader up` prints the link). Defaults: enabled, 30 days. No content is kept.
observability: { enabled: true, retention_days: 30 }
