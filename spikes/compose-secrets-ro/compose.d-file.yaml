# Variant (d): read-only root, file-sourced Compose secret. The source is a 0600 file in a 0700
# directory outside the repository (SPIKE_SECRET_FILE, set by run.sh to a scratch path).
name: reader-spike-csro-d
services:
  svc:
    image: python:3.14-slim-trixie
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    tmpfs: [/tmp]
    secrets:
      - source: tok
        uid: "1000"
        gid: "1000"
        mode: 0400
    command: ["python", "-c", "import os,time\np='/run/secrets/tok'\ns=os.stat(p); v=open(p).read()\nprint({'uid': os.getuid(), 'file_uid': s.st_uid, 'mode': oct(s.st_mode & 0o777), 'length': len(v), 'canary_prefix': v.startswith('CANARY-')}, flush=True)\ntime.sleep(600)"]
secrets:
  tok:
    file: ${SPIKE_SECRET_FILE:?set by run.sh}
