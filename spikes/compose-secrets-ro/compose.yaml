# Spike compose-secrets-ro (OPS-DEPLOY review B7, ADR-0023): does a Compose secret sourced from the
# environment reach a read-only, non-root, cap-drop service as a readable /run/secrets file, and does the
# value stay out of `docker inspect`? A canary value stands in for a real secret.
name: reader-spike-csro
services:
  svc:
    image: python:3.14-slim-trixie
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    network_mode: none
    secrets: [tok]
    command: ["python", "-c", "import os,time; p='/run/secrets/tok'; s=os.stat(p); v=open(p).read(); print({'uid': os.getuid(), 'file_uid': s.st_uid, 'mode': oct(s.st_mode & 0o777), 'readable': True, 'length': len(v), 'matches_canary_prefix': v.startswith('CANARY-')}, flush=True); time.sleep(120)"]
secrets:
  tok:
    environment: SPIKE_TOK
