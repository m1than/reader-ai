# Variant (b): same service, root filesystem writable, env-sourced secret.
name: reader-spike-csro-b
services:
  svc:
    image: python:3.14-slim-trixie
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    secrets: [tok]
    command: ["python", "-c", "import os,time; p='/run/secrets/tok'; s=os.stat(p); v=open(p).read(); print({'uid': os.getuid(), 'file_uid': s.st_uid, 'mode': oct(s.st_mode & 0o777), 'length': len(v), 'canary_prefix': v.startswith('CANARY-')}, flush=True); time.sleep(120)"]
secrets:
  tok:
    environment: SPIKE_TOK
