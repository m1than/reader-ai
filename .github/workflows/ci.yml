name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trace:
    name: trace (specd-lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - name: T1–T8 trace-check
        run: node tools/trace/check.mjs
      - name: P7 tests change only with their spec
        if: github.event_name == 'pull_request'
        run: node tools/trace/guard-tests.mjs --base origin/${{ github.base_ref }}

  layers:
    name: tests per layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Layer steps switch on once the layer has a manifest.
      - if: hashFiles('server/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6
      - if: hashFiles('server/pyproject.toml') != ''
        name: server — ruff, mypy, pytest
        working-directory: server
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run mypy src
          uv run pytest
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - if: hashFiles('web/package.json') != ''
        name: web — typecheck, vitest, storybook build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build-storybook
