name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trace:
    name: trace (specd-lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - name: T0–T10 trace-check
        run: node tools/trace/check.mjs
      - name: Write hook gates (H1–H4) hold in every worktree
        run: node --test tools/hooks/pre-write.test.mjs
      - name: OPS-DOD tools (T10, report, waivers, P8)
        run: node --test "tools/dod/*.test.mjs"
      - name: P7 tests change only with their spec; P8 the Definition of Done is not loosened
        if: github.event_name == 'pull_request'
        run: node tools/trace/guard-tests.mjs --base origin/${{ github.base_ref }}

  layers:
    name: tests per layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Layer steps switch on once the layer has a manifest.
      - if: hashFiles('server/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6
      - if: hashFiles('server/pyproject.toml') != ''
        name: server — ruff, mypy, pytest
        working-directory: server
        run: |
          uv sync --frozen
          uv run ruff check .
          # src/ and tests/ appear with the first approved server spec; until then there is nothing to check.
          if [ -d src ]; then uv run mypy src; fi
          if [ -d tests ]; then uv run pytest; fi
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc   # the Node major is a decision (proposed ADR-0020), not lts/* floating
      - if: hashFiles('web/package.json') != ''
        name: web — typecheck, vitest, storybook build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build-storybook
