# Run state of the roadmap (ADR-0019). The agent reads it to pick the next task and updates it in the
# same PR as the work. Order follows docs/roadmap.md.
#   status: todo | in_progress | blocked | done
#   kind:   owner (only the owner can do it) | setup | spike | module (spec → Red → Green) | live (stage live check)
#   needs:  task ids that must be done first
#   blocked tasks carry `reason` and `ask` (what the owner must do); done tasks carry `pr` and, for spikes, `result`.

budget:
  live_runs_usd: 40      # Agent SDK credit the agent may spend on spikes and live checks before stage 9; owner can raise
  daily_cap_usd: { date: 2026-11-20, usd: 40, by: owner }   # "only 40 dollars for the full flow run today"
  spent_usd: 0.0568      # total_cost_usd as reported by the CLI; not reconciled against the credit drawn
  ledger:                # - { task: S0.spike.compile-cost, usd: 0.00, what: "" }
    - { task: S0.spike.agent-sdk-container, usd: 0.0568, date: 2026-11-20,
        what: "1 + 6 + 6 text probes, 1 sandboxed tools run, 3 verification runs on trixie; breakdown in spikes/agent-sdk-container/RESULT.md" }

owner_review:            # stage exits waiting for the owner's live check and `implemented` flips
  pending: []
  merge_gate: "2026-11-20: a Claude Code PreToolUse hook on the owner's machine forbids `gh pr merge` for the agent,
    contrary to AGENTS.md step 6. Until the owner removes it or changes AGENTS.md, every PR waits for the owner's merge."

tasks:
  # Stage 0 — groundwork and spikes
  - { id: S0.owner.adr-status, stage: 0, kind: owner, status: done, needs: [],
      note: "owner 2026-11-20: treat as resolved and proceed; work follows ADR-0001…0019 as if accepted.
        The status flip in docs/adr/*.md is still the owner's commit (H3); bootstrap-mac.sh keeps reporting it until then.",
      ask: "Set status: accepted in ADR-0001…0019 and merge; bootstrap-mac.sh checks it" }
  - { id: S0.owner.machine, stage: 0, kind: owner, status: blocked, needs: [],
      reason: "bootstrap-mac.sh 2026-11-20 in the agent session, 8 FAIL. Fixed with the owner's consent: uv 0.13.7 and Python 3.13.18 installed, repo-local git identity set. Still open:
        the active gh account is igaifutdinov, which cannot push to m1than/reader-ai or read m1than/ui-builder-lib-with-agents.
        The owner approved switching gh to m1than (2026-11-20). It was later switched back, so the agent switches per push and restores igaifutdinov.
        Provider token: the owner stored it in the Keychain item reader-ai/claude-oauth-token (2026-11-20). bootstrap's env check is
        expected to keep failing in the agent's shell, because the variable does not reach the agent's commands. A FAIL there is not a
        blocker; teaching bootstrap the Keychain path is a later change;
        Telegram token file missing at ~/Developer/.token_tg_bot (or READER_TG_TOKEN_FILE); Telegram chat not linked;
        no autoMode key in ~/.claude/settings.json; ADRs not accepted (S0.owner.adr-status).
        Telegram notifications cannot be sent until the token file and the chat link exist.",
      ask: "put the Telegram bot token file in place (mode 600);
        send /start to the bot, then node tools/agent/notify.mjs link; merge tools/agent/user-settings.json into ~/.claude/settings.json;
        rerun bash tools/agent/bootstrap-mac.sh" }
  - { id: S0.skeleton, stage: 0, kind: setup, status: done, needs: [], pr: "https://github.com/m1than/reader-ai/pull/4",
      what: "server/pyproject.toml (uv, ruff, mypy strict, pytest, anyio, hypothesis, testcontainers), web/package.json (Vite, React 19, Vitest, Storybook 10, Playwright), e2e/live/lib.sh",
      note: "server is `package = false` until OPS-CLI/OPS-DEPLOY claim server/src/reader and add the entry points;
        CI runs mypy/pytest only once server/src and server/tests exist. Local node 22.22.1 is below some packages' engines (^22.22.2); CI uses lts/*." }
  - { id: S0.toolchain-baseline, stage: 0, kind: setup, status: in_progress, needs: [],
      pr: "https://github.com/m1than/reader-ai/pull/8", review: "deep-reviewer (Fable): approve, round 3",
      what: "owner 2026-11-20: use the latest LTS versions. Proposed ADR-0020: Node 26 LTS, Python 3.14 (3.15: 5 dependencies lack cp315 aarch64 wheels), Debian 13 trixie",
      note: "Done in this branch: web/ engines >=26 <27 and .nvmrc; CI reads web/.nvmrc (typecheck, vitest, storybook green on node 26.13.0).
        node@26 is installed as a separate Homebrew keg (the Mac's default node stays 22). New spikes use python:3.14-slim-trixie
        (agent-sdk-container measured, PR #6). Pending evidence: OCR conversion on 3.14 (ingest-docling) and a kernel-roundtrip re-run on 3.14.
        On acceptance by the owner: move the 3.13 pins listed in ADR-0020 Consequences in one PR. This PR carries an ADR, so it waits for the owner." }
  - { id: S0.spike.passkey-localhost, stage: 0, kind: spike, status: blocked, needs: [S0.skeleton],
      pr: "https://github.com/m1than/reader-ai/pull/7",
      result: "Safari 27.2 and Dia (Chromium 157) each register.ok + login.ok on https://localhost behind Caddy tls internal,
        both through Apple Passwords (AAGUID fbfc3007-…), UV true, server verifies challenge/origin/RP ID/UV/signature
        (spikes/passkey-localhost/RESULT.md). Host name for stage 1 provisionally localhost; mkcert fallback not needed so far.
        Owner's keychain checked clean after teardown (no Caddy trust setting or certificate left).",
      reason: "The roadmap criterion and ADR-0012 name Google Chrome. It would not launch on the owner's Mac, and its own passkey
        provider (Google Password Manager) was not exercised. Swapping the criterion is the owner's call.",
      ask: "Either accept Safari + Chromium (Dia) via Apple Passwords as meeting the criterion (reply 'accept passkey substitution'),
        or fix/reinstall Google Chrome and rerun steps 1–4 of RESULT.md in Chrome (about 5 minutes)." }
  - { id: S0.spike.agent-sdk-container, stage: 0, kind: spike, status: done, needs: [S0.skeleton],
      pr: "https://github.com/m1than/reader-ai/pull/6", review: "deep-reviewer (Fable): approve, round 3",
      note: "The owner allowed spikes/agent-sdk-container/run.sh, for this spike only, to read the Keychain item
        reader-ai/claude-oauth-token straight into `docker run -e`, never printed (2026-11-20). No other script or task may read it.",
      result: "PASS (spikes/agent-sdk-container/RESULT.md): SDK 0.2.186 with bundled CLI runs non-root in linux/arm64 (bookworm and trixie);
        streams; total_cost_usd reported. Host wall 3.3–3.6 s (haiku) / 5.4–6.0 s (sonnet); first token 1.6–1.9 s / 3.5–3.9 s;
        ≈9.9k cached CLI system tokens per call. Sandboxed Bash run under ADR-0014's process, capability and resource limits passes
        (network, secrets and timeout rows not applied). Open for SRV-AGENT/OPS-SANDBOX: the token sits inside the tool sandbox;
        docker run -e exposes it to docker inspect (ADR-0011 wants /run/secrets, untested); API-only egress untested. Worker placement: container." }
  - { id: S0.spike.kernel-roundtrip, stage: 0, kind: spike, status: done, needs: [S0.skeleton],
      pr: "https://github.com/m1than/reader-ai/pull/5", review: "deep-reviewer (Fable): approve, round 2",
      result: "PASS (spikes/kernel-roundtrip/RESULT.md, results/*.json): python3/rust/deno start < 0.8 s and stream, internal network, no egress;
        pilot crates warm 1.0–1.17 s, cold 4.9 s (≈10 s for two kernels at once); image 1.91 GB; peak 1.0 GiB warm, 1.4 GiB cold.
        Needs an exec tmpfs /run/evcxr and a per-kernel copy of the evcxr cache via a launcher (shared cache breaks concurrent kernels);
        per-kernel dirs leak 86 MiB each (13th kernel fails) (cleanup open for OPS-SANDBOX); --memory-swap must equal --memory.
        Proposed ADR-0014 amendment (exec tmpfs, writable cache, verification in its own container) goes to S0.exit." }
  - { id: S0.spike.ingest-docling, stage: 0, kind: spike, status: todo, needs: [S0.skeleton],
      note: "input: the Bashir PDF on the owner's Mac (path set in reader.yaml by the owner; sha256 in pilot/bashir/plan.yaml)" }
  - { id: S0.spike.embeddings-local, stage: 0, kind: spike, status: todo, needs: [S0.skeleton] }
  - { id: S0.spike.compile-cost, stage: 0, kind: spike, status: todo, needs: [S0.spike.agent-sdk-container],
      note: "spends Agent SDK credit; record in budget.ledger" }
  - { id: S0.spike.library-publish, stage: 0, kind: spike, status: blocked, needs: [S0.skeleton],
      review: "deep-reviewer (Fable) round 1: changes (prerelease dist-tag, composited contrast pairs); addressed",
      result: "PARTIAL (spikes/library-publish/RESULT.md, results/sizes.json, contrast.json, render.json).
        Release workflow + decision record 0045 on local library branch release/github-packages (6355fe67, dbb932cb): tag check first,
        `npm run gates`, publish renames @acme/ui → @<owner>/ui in its checkout, prereleases to dist-tag next, GITHUB_TOKEN with
        packages: write, no persisted credentials; actionlint and npm run check pass; not run.
        Fallback works: built-commit tarball installs in a Vite 8 + React 19 + Storybook 10 consumer on Node 26.13.0; the 20 ADR-0013
        components typecheck, build and render in Chromium without page errors; as used in the gallery 56.5 KB gzip JS (React excluded;
        reviewer's full-entry ceiling ≈ 59.3 KB), styles.css 30.2 KB gzip.
        Draft Calm tokens: 218/218 contrast pairs pass, including composited tints (soft buttons, hover overlays, toasts, chips) after a
        lightness-only adjustment (before: 198/218; lowest 3.75:1 text, 2.96:1 UI). Lowest now: text 4.57:1, UI 3.25:1.
        Library size gate fails 5 entries by 1–19 B under Node 26 but passes under Node 22 (its CI runtime).",
      reason: "Publishing is the owner's: the library's AGENTS.md forbids agents to push or publish. Install-by-version and release
        time are therefore unmeasured.",
      ask: "Review and push library branch release/github-packages (dbb932cb), merge it into web3/material-parity, push tag v0.1.0
        and note the release workflow's gates duration; then tell the agent the version. Installing from GitHub Packages needs a
        read:packages token on the Mac, likely a classic PAT (fine-grained tokens may not cover Packages; to be verified)." }
  - { id: S0.spike.trace-backend, stage: 0, kind: spike, status: todo, needs: [S0.spike.agent-sdk-container] }
  - { id: S0.exit, stage: 0, kind: live, status: todo,
      needs: [S0.spike.passkey-localhost, S0.spike.agent-sdk-container, S0.spike.kernel-roundtrip, S0.spike.ingest-docling,
              S0.spike.embeddings-local, S0.spike.compile-cost, S0.spike.trace-backend],
      what: "8 RESULT.md summarised; proposed ADR amendments for numbers that change decisions" }

  # Stage 1 — stack on the Mac
  - { id: S1.SRV-CONFIG, stage: 1, kind: module, track: engineering, status: in_progress, needs: [S0.skeleton],
      note: "spec drafted (spec/modules/SRV-CONFIG.yaml, status: draft; fixtures in spec/fixtures/SRV-CONFIG/), awaits deep-reviewer.
        Scope follows the roadmap split: this module parses all five secret:// schemes and resolves env and file; hostfile, keychain,
        op and `reader doctor` belong to OPS-CLI through the resolver registry (FR-CONFIG-7)." }
  - { id: S1.OPS-CLI, stage: 1, kind: module, track: engineering, status: todo, needs: [S1.SRV-CONFIG] }
  - { id: S1.OPS-DEPLOY, stage: 1, kind: module, track: engineering, status: todo,
      needs: [S0.skeleton, S0.spike.passkey-localhost, S0.spike.agent-sdk-container] }
  - { id: S1.SRV-AUTH, stage: 1, kind: module, track: product, status: todo, needs: [S1.OPS-DEPLOY, S1.SRV-CONFIG] }
  - { id: S1.live, stage: 1, kind: live, status: todo, needs: [S1.OPS-CLI, S1.SRV-AUTH],
      what: "e2e/live/stage-1.sh; re-plan checkpoint 1 in docs/roadmap.md" }

  # Stage 2 — event backbone and notifications
  - { id: S2.SRV-EVENTS, stage: 2, kind: module, track: engineering, status: todo, needs: [S1.live] }
  - { id: S2.SRV-OBS, stage: 2, kind: module, track: engineering, status: todo, needs: [S2.SRV-EVENTS, S0.spike.trace-backend] }
  - { id: S2.SRV-NOTIFY, stage: 2, kind: module, track: product, status: todo, needs: [S2.SRV-EVENTS] }
  - { id: S2.live, stage: 2, kind: live, status: todo, needs: [S2.SRV-OBS, S2.SRV-NOTIFY] }

  # Stage 3 — ingestion and search
  - { id: S3.SRV-INGEST, stage: 3, kind: module, track: engineering, status: todo, needs: [S2.live, S0.spike.ingest-docling] }
  - { id: S3.SRV-SEARCH, stage: 3, kind: module, track: ai, status: todo, needs: [S3.SRV-INGEST, S0.spike.embeddings-local] }
  - { id: S3.live, stage: 3, kind: live, status: todo, needs: [S3.SRV-SEARCH] }

  # Stage 4 — lessons and practice
  - { id: S4.SRV-LESSON, stage: 4, kind: module, track: product, status: todo, needs: [S2.live] }
  - { id: S4.OPS-SANDBOX, stage: 4, kind: module, track: engineering, status: todo, needs: [S1.live, S0.spike.kernel-roundtrip] }
  - { id: S4.SRV-KERNEL, stage: 4, kind: module, track: engineering, status: todo, needs: [S4.OPS-SANDBOX] }
  - { id: S4.WEB-UI, stage: 4, kind: module, track: engineering, status: todo, needs: [S1.live, S0.spike.library-publish] }
  - { id: S4.WEB-RENDER, stage: 4, kind: module, track: engineering, status: todo, needs: [S4.WEB-UI] }
  - { id: S4.WEB-NOTEBOOK, stage: 4, kind: module, track: product, status: todo,
      needs: [S4.WEB-UI, S4.WEB-RENDER, S4.SRV-KERNEL, S4.SRV-LESSON] }
  - { id: S4.live, stage: 4, kind: live, status: todo, needs: [S4.WEB-NOTEBOOK],
      what: "e2e/live/stage-4.sh; the owner reviews the Calm theme in Storybook at this exit; re-plan checkpoint 2" }

  # Stage 5 — agents and the compile pipeline
  - { id: S5.SRV-AGENT, stage: 5, kind: module, track: ai, status: todo, needs: [S2.live, S0.spike.compile-cost] }
  - { id: S5.SRV-PIPELINE, stage: 5, kind: module, track: ai, status: todo, needs: [S5.SRV-AGENT, S3.live, S4.live] }
  - { id: S5.WEB-AUTHORING, stage: 5, kind: module, track: product, status: todo, needs: [S5.SRV-PIPELINE] }
  - { id: S5.live, stage: 5, kind: live, status: todo, needs: [S5.WEB-AUTHORING],
      what: "L02 compiled through G1/G2; spends credit (≤ $4.35)" }

  # Stage 6 — daily study loop
  - { id: S6.SRV-TUTOR, stage: 6, kind: module, track: ai, status: todo, needs: [S5.live] }
  - { id: S6.SRV-RECALL, stage: 6, kind: module, track: product, status: todo, needs: [S4.live] }
  - { id: S6.SRV-HABIT, stage: 6, kind: module, track: product, status: todo, needs: [S2.SRV-NOTIFY, S4.live] }
  - { id: S6.WEB-SESSION, stage: 6, kind: module, track: product, status: todo, needs: [S6.SRV-TUTOR, S6.SRV-RECALL, S6.SRV-HABIT] }
  - { id: S6.live, stage: 6, kind: live, status: todo, needs: [S6.WEB-SESSION],
      what: "friction NFR in Playwright; then 7 days of real study by the owner (owner part)" }

  # Stage 7 — knowledge base, export and MCP
  - { id: S7.SRV-KB, stage: 7, kind: module, track: ai, status: todo, needs: [S5.live] }
  - { id: S7.SRV-EXPORT, stage: 7, kind: module, track: product, status: todo, needs: [S7.SRV-KB] }
  - { id: S7.SRV-MCP, stage: 7, kind: module, track: ai, status: todo, needs: [S7.SRV-KB] }
  - { id: S7.WEB-KB, stage: 7, kind: module, track: product, status: todo, needs: [S7.SRV-KB, S4.WEB-UI] }
  - { id: S7.live, stage: 7, kind: live, status: todo, needs: [S7.SRV-EXPORT, S7.SRV-MCP, S7.WEB-KB] }

  # Stage 8 — sharing and paired programs
  - { id: S8.SRV-SHARE, stage: 8, kind: module, track: product, status: todo, needs: [S7.live] }
  - { id: S8.WEB-COHORT, stage: 8, kind: module, track: product, status: todo, needs: [S8.SRV-SHARE] }
  - { id: S8.live, stage: 8, kind: live, status: todo, needs: [S8.WEB-COHORT] }

  # Stage 9 — pilot rollout and load measurement
  - { id: S9.rolling-compile, stage: 9, kind: setup, status: todo, needs: [S6.live],
      what: "keep two plan stages of the Bashir course compiled ahead of the owner; spends credit per lesson (ledger)" }
  - { id: S9.capacity, stage: 9, kind: live, status: todo, needs: [S8.live],
      what: "two weeks of measurements → docs/capacity.md → proposed VPS ADR" }
