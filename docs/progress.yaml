    the Keychain item reader-ai/claude-oauth-token straight into the spike container (never printed), same pattern as
    compile-cost. Spend cap $0.60 from test_budget_usd, recorded in the ledger."
  spent_usd: 8.7416      # total_cost_usd as reported by the CLI; not reconciled against the credit drawn
                         # = main's 5.4518 (agent-sdk-container 0.0568 + compile-cost 5.395) + trace-backend 0.0058
                         #   + tutor-call 0.0383 (from test_budget_usd) + V.live L02 compile 1.2587
