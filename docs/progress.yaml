# Run state of the roadmap (ADR-0019). The agent reads it to pick the next task and updates it in the
# same PR as the work. Order follows docs/roadmap.md.
#   status: todo | in_progress | blocked | done
#   kind:   owner (only the owner can do it) | setup | spike | module (spec → Red → Green) | live (stage live check)
#   needs:  task ids that must be done first
#   blocked tasks carry `reason` and `ask` (what the owner must do); done tasks carry `pr` and, for spikes, `result`.

budget:
  live_runs_usd: 40      # Agent SDK credit the agent may spend on spikes and live checks before stage 9; owner can raise
  daily_cap_usd: { date: 2026-11-20, usd: 40, by: owner }   # "only 40 dollars for the full flow run today"
  compile_cap_usd: { usd: 8, per: "one lesson compile (all stages)", date: 2026-11-22, by: owner,
    why: "owner 'accept everything' on the compile budget; spike L02 cost $2.42–$2.97 per run, $8 matches the spike's own cap" }
  test_budget_usd: { usd: 30, date: 2026-11-22, by: owner,
    why: "owner: 'Do all for 1000% ready status, I'm approving $30 budget for tests'. Covers live checks and live L02
      compiles of the vertical slice; no per-run owner consent needed within it; every spend goes to the ledger below" }
  live_runs_by_agent: "owner 2026-11-22: the agent may run `bash e2e/live/stage-1.sh` and `bash e2e/live/verify-all.sh`
    itself (allow rules in .claude/settings.json). Those scripts docker-exec internally only to fetch the test user's
    one-time bootstrap link and reset the test user; they never print or store a secret, and the agent still never runs
    docker exec directly. Changes to e2e/live/** therefore get a deep-reviewer pass for secret handling."
  spent_usd: 5.4576      # total_cost_usd as reported by the CLI; not reconciled against the credit drawn
                         # = main's 5.4518 (agent-sdk-container 0.0568 + compile-cost 5.395) + trace-backend 0.0058
  ledger:                # - { task: S0.spike.compile-cost, usd: 0.00, what: "" }
    - { task: S0.spike.agent-sdk-container, usd: 0.0568, date: 2026-11-20,
        what: "1 + 6 + 6 text probes, 1 sandboxed tools run, 3 verification runs on trixie; breakdown in spikes/agent-sdk-container/RESULT.md" }
    - { task: S0.spike.compile-cost, usd: 5.395, date: 2026-11-20,
        what: "2 full L02 compiles (6 stages each: draft, fact-check, review, revise, fact-check, review); cap $8.00 set by the owner;
          per stage in spikes/compile-cost/results/" }
    - { task: S0.spike.trace-backend, usd: 0.0058, date: 2026-11-20,
        what: "2 exploratory (hand-recorded) + 2 measured rounds of probe runs (3 haiku stages each); span replays without model calls;
          breakdown in spikes/trace-backend/RESULT.md" }

owner_review:            # stage exits waiting for the owner's live check and `implemented` flips
  pending: []
  merge_gate: "2026-11-20: a Claude Code PreToolUse hook on the owner's machine forbids `gh pr merge` for the agent,
    contrary to AGENTS.md step 6. Until the owner removes it or changes AGENTS.md, every PR waits for the owner's merge."
  ci_gate: "owner 2026-11-20: GitHub Actions may fail for now; a red CI run is not a blocker. The agent still runs the local checks
    (trace-check, guard-tests, layer checks) before every PR and records any red CI run in the PR description."

priority: "owner 2026-11-20: vertical slice first (docs/roadmap.md 'Vertical slice first'). After S1.live, pick ready V.* tasks
  before any task of stages 2–9; stages resume in order after V.live. Review depth (AGENTS.md): full review until approve in the
  complex areas, one deep-reviewer round elsewhere."

integration: "owner 2026-11-22: one final PR; all work integrates on V/slice-integration"

