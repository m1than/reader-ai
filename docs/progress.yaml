        and secret_env_var is gone (#26). From OPS-DEPLOY FR-DEPLOY-5 and VEC-DEPLOY-3: the in-memory override binds
        the owner's reader.yaml read-only at /etc/reader/reader.yaml (create_host_path false) into api, worker and mcp
        only; compose.yaml sets READER_CONFIG statically. caddy_config stays backup=include (ADR-0012, ADR-0024), so
        OPS-CLI's backup must read it: in the pinned caddy image /config is 0755 and /config/caddy 1777 (code review).
        Registers its hostfile/keychain/op resolvers through SRV-CONFIG's host_registry(extra) (FR-CONFIG-6, FR-CONFIG-7).
        From OPS-DEPLOY: each write is `docker exec -i -u <service uid>` with `umask 077; cat > /run/secrets/.<name>.tmp &&
        mv … <name>`, exit code checked, value on stdin only. OPS-CLI decides whether `reader up` daemonises once the stack
        is healthy (the live-check scripts call `reader up` and continue), fixes the watcher's stop command (the roadmap's
        stage-1 script uses the placeholder `reader watcher stop`), stops the watcher on `reader down`, and guarantees that
        with the watcher dead a restarted consumer stays unhealthy (fail closed) until the next `reader up`. The DB password
        is set in the cluster only at initdb, so it is never regenerated while `pgdata` exists, and a restore needs the same
        Keychain item. ADR-0026's `verified_by` items that are OPS-CLI's: no value in `docker export`, in `docker events`
        since `reader up`, or in the Docker Desktop logs. OPS-CLI also emits the in-memory override of OPS-DEPLOY
        VEC-DEPLOY-3 (fully expanded kernel-<user> services, their networks, api attachments)." }
