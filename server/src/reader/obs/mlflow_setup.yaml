# SRV-OBS VEC-OBS-6, shipped with the worker as the default for `obs.setup` (FR-OBS-26). The deployed copy is
# deploy/otel/mlflow-setup.yaml, mounted read-only at /etc/reader/mlflow-setup.yaml (phase2.SETUP_PATH), read when it
# exists; a [unit] test checks this file parses equal
# to spec/fixtures/SRV-OBS/mlflow-setup.yaml.
version: 1
experiments:
  - id: "0"
    name: reader
    description: "reader-ai traces, compile and import Runs, owner label mirrors (SRV-OBS)"
    tags:
      mlflow.note.content: "reader-ai traces, compile and import Runs, owner label mirrors (SRV-OBS)"
      reader.kind: traces
      reader.managed_by: obs.setup
  - name: bench
    description: "Bench datasets and evaluation Runs from owner uploads (SRV-OBS FR-OBS-22, -23)"
    tags:
      mlflow.note.content: "Bench datasets and evaluation Runs from owner uploads (SRV-OBS FR-OBS-22, -23)"
      reader.kind: bench
      reader.managed_by: obs.setup
datasets:
  names: [tutor-bench-v2, search-bench-v1]
logged_models:
  name: reader-agent
  tag: reader.version_key
  last_started_tag: reader.last_started
  params: [prompt_set_sha256, stage_models, pipeline_config_sha256]
run_tags:
  - reader.kind
  - reader.run_id
  - reader.ingest_id
  - reader.material_sha256
  - reader.outcome
  - reader.ends
  - reader.snapshot_at
  - reader.complete
  - reader.bench
  - reader.bench_upload
